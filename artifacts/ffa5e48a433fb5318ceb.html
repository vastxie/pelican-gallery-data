<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行记</title>
<style>
  :root { color-scheme: light; --ink:#253b39; --paper:#f8f4e9; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    display:grid; place-items:center; padding:24px;
    background:#e9eee6; color:var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main { width:min(100%, 1040px); }
  .frame {
    overflow:hidden; border:1px solid #d6dfd4; border-radius:26px;
    background:var(--paper); box-shadow:0 24px 70px #3350441c;
  }
  svg { display:block; width:100%; height:auto; }
  .caption { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:16px 22px 19px; }
  h1 { margin:0; font-size:clamp(18px, 3vw, 24px); letter-spacing:.04em; }
  .caption p { margin:0; color:#75877b; font-size:13px; }
  .cloud { animation: drift 28s linear infinite; }
  .cloud.two { animation-duration:37s; animation-delay:-17s; }
  .wheel { transform-box:fill-box; transform-origin:center; animation: roll 2.4s linear infinite; }
  .pedal { transform-box:fill-box; transform-origin:center; animation: roll 1.2s linear infinite; }
  .rider { transform-origin:450px 335px; animation: bob .6s ease-in-out infinite alternate; }
  .tail-feather { transform-origin:390px 267px; animation: tail .6s ease-in-out infinite alternate; }
  .grass { animation: sway 2.4s ease-in-out infinite alternate; transform-origin:bottom; }
  .grass.delay { animation-delay:-1.1s; }
  @keyframes roll { to { transform:rotate(360deg); } }
  @keyframes bob { to { transform:translateY(-3px) rotate(-.6deg); } }
  @keyframes tail { to { transform:rotate(3deg); } }
  @keyframes sway { to { transform:rotate(7deg); } }
  @keyframes drift { from { transform:translateX(-35px); } to { transform:translateX(52px); } }
  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body>
<main>
  <section class="frame" aria-label="鹈鹕骑自行车的动画插画">
    <svg viewBox="0 0 960 600" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
      <title id="title">鹈鹕骑行记</title>
      <desc id="desc">一只戴着蓝绿色头盔的鹈鹕，骑着红色自行车穿过晴朗的乡间。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d8eee7"/><stop offset="1" stop-color="#fff3d7"/></linearGradient>
        <linearGradient id="beak" x2="0" y2="1"><stop stop-color="#ffbd59"/><stop offset="1" stop-color="#ef784d"/></linearGradient>
        <linearGradient id="bag" x2="0" y2="1"><stop stop-color="#f2a35e"/><stop offset="1" stop-color="#df744e"/></linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
      </defs>
      <!-- warm, breezy countryside -->
      <rect width="960" height="600" fill="url(#sky)"/>
      <circle cx="770" cy="130" r="54" fill="#ffd982" opacity=".88"/>
      <circle cx="770" cy="130" r="72" fill="#ffe9af" opacity=".36" filter="url(#soft)"/>
      <g class="cloud" fill="#fffdf4" opacity=".83">
        <ellipse cx="180" cy="133" rx="55" ry="15"/><circle cx="157" cy="124" r="19"/><circle cx="184" cy="116" r="25"/><circle cx="210" cy="127" r="17"/>
      </g>
      <g class="cloud two" fill="#fffdf4" opacity=".65">
        <ellipse cx="650" cy="205" rx="44" ry="12"/><circle cx="633" cy="198" r="15"/><circle cx="653" cy="191" r="21"/><circle cx="675" cy="201" r="14"/>
      </g>
      <path d="M0 337 Q125 256 251 325 T502 319 T760 300 T960 333 V600 H0Z" fill="#c6dfc0"/>
      <path d="M0 386 Q156 322 302 375 T583 363 T960 375 V600 H0Z" fill="#99c49b"/>
      <path d="M0 419 Q191 370 373 419 T705 403 T960 419 V600 H0Z" fill="#79ad85"/>
      <path d="M0 459 Q205 430 400 461 T760 445 T960 459 V600 H0Z" fill="#e7d9b5"/>
      <path d="M0 478 Q230 447 460 477 T960 468 V600 H0Z" fill="#f3e7c9"/>
      <!-- distant flowers and grass -->
      <g fill="#f8f1d5" opacity=".8">
        <circle cx="89" cy="433" r="3"/><circle cx="103" cy="427" r="2.5"/><circle cx="836" cy="426" r="3"/><circle cx="854" cy="434" r="2"/><circle cx="776" cy="447" r="2.5"/>
      </g>
      <g stroke="#548d69" stroke-width="3" stroke-linecap="round" fill="none">
        <path class="grass" d="M117 461q-7-16-13-21m14 21q1-21 8-28"/><path class="grass delay" d="M826 454q-5-16-12-22m13 22q3-17 10-22"/>
        <path class="grass delay" d="M704 461q-4-13-10-16m11 16q4-15 11-19"/>
      </g>
      <!-- bicycle shadow -->
      <ellipse cx="490" cy="491" rx="180" ry="12" fill="#3a614b" opacity=".13"/>
      <!-- bicycle frame -->
      <g stroke="#df684e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M380 425 L445 340 L492 425 L380 425"/>
        <path d="M492 425 L550 340 L600 425"/>
        <path d="M445 340 L550 340"/>
      </g>
      <!-- rear and front wheels -->
      <g fill="none" stroke="#f9f4e8" stroke-width="3">
        <circle cx="380" cy="425" r="72"/><circle cx="600" cy="425" r="72"/>
      </g>
      <g class="wheel" fill="none" stroke="#49665c" stroke-width="3">
        <circle cx="380" cy="425" r="69"/><circle cx="380" cy="425" r="7"/>
        <path d="M380 356V494 M311 425H449 M331 376L429 474 M331 474L429 376"/>
      </g>
      <g class="wheel" fill="none" stroke="#49665c" stroke-width="3">
        <circle cx="600" cy="425" r="69"/><circle cx="600" cy="425" r="7"/>
        <path d="M600 356V494 M531 425H669 M551 376L649 474 M551 474L649 376"/>
      </g>
      <!-- seat, bars, chain and crank -->
      <path d="M420 329h48q8 0 8 7t-8 7h-48q-8 0-8-7t8-7Z" fill="#334d47"/>
      <path d="M445 340l-3-18" stroke="#435c51" stroke-width="7" stroke-linecap="round"/>
      <path d="M550 340l12-22 18-2m-18 2 6 19" fill="none" stroke="#435c51" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M492 425L380 425" stroke="#9b6653" stroke-width="2" opacity=".6"/>
      <circle cx="492" cy="425" r="10" fill="#334d47"/>
      <g class="pedal" stroke="#334d47" stroke-width="5" stroke-linecap="round">
        <path d="M492 425l28 0 M492 425l-28 0"/>
        <path d="M520 425h12 M464 425h-12" stroke-width="7"/>
      </g>
      <circle cx="380" cy="425" r="6" fill="#df684e"/><circle cx="600" cy="425" r="6" fill="#df684e"/>
      <!-- rider, gently bouncing with the road -->
      <g class="rider">
        <!-- small travel satchel -->
        <path d="M388 275q-4-20 15-28l26 4 5 37-35 2Z" fill="url(#bag)" stroke="#be654c" stroke-width="3"/>
        <path d="M394 265q14-5 30 0" fill="none" stroke="#ffd08a" stroke-width="3" stroke-linecap="round"/>
        <!-- tail feathers -->
        <g class="tail-feather" stroke="#d78b63" stroke-width="9" stroke-linecap="round">
          <path d="M414 282q-23-17-44-18"/><path d="M414 288q-22-6-41 0"/><path d="M415 294q-20 5-35 16"/>
        </g>
        <!-- body and folded wing -->
        <ellipse cx="457" cy="278" rx="53" ry="42" fill="#f8f4e9" stroke="#d9d4c7" stroke-width="2"/>
        <path d="M435 279q30-34 57-4-4 28-42 34-22-5-15-30Z" fill="#e6e0d2"/>
        <path d="M443 279q17-14 32-7" fill="none" stroke="#c4bbab" stroke-width="3" stroke-linecap="round"/>
        <!-- neck -->
        <path d="M478 263q-7-24 5-49l17 4q-6 25 9 47" fill="#f8f4e9" stroke="#d9d4c7" stroke-width="2"/>
        <!-- head -->
        <ellipse cx="497" cy="207" rx="31" ry="27" fill="#f8f4e9" stroke="#d9d4c7" stroke-width="2"/>
        <!-- helmet -->
        <path d="M467 205a31 27 0 0 1 60-7l-4 8h-55Z" fill="#3f8f87"/>
        <path d="M468 205q29 6 58 1" fill="none" stroke="#276a67" stroke-width="4" stroke-linecap="round"/>
        <path d="M480 183q15-12 30-2" fill="none" stroke="#78b7a6" stroke-width="4" stroke-linecap="round"/>
        <!-- eye, looking ahead -->
        <circle cx="516" cy="207" r="4.4" fill="#263c3a"/><circle cx="517" cy="205.5" r="1.2" fill="#fff"/>
        <path d="M510 218q7 4 13 0" fill="none" stroke="#cc9c83" stroke-width="2" stroke-linecap="round"/>
        <!-- long pelican bill and pouch -->
        <path d="M519 211q27 2 67 16-5 12-49 8-17-2-22-11Z" fill="url(#beak)" stroke="#d9694b" stroke-width="2" stroke-linejoin="round"/>
        <path d="M519 218q20 14 58 14-7 25-31 22-25-1-32-25Z" fill="#f18a68" stroke="#df704f" stroke-width="2"/>
        <path d="M527 233q22 9 44 1" fill="none" stroke="#ffd0a0" stroke-width="2" opacity=".8"/>
        <path d="M568 227l15 2" stroke="#b85543" stroke-width="2" stroke-linecap="round"/>
        <!-- wing hand reaching the handlebar -->
        <path d="M486 277q31-8 50 23l19 21" fill="none" stroke="#f8f4e9" stroke-width="22" stroke-linecap="round"/>
        <path d="M486 277q31-8 50 23l19 21" fill="none" stroke="#d9d4c7" stroke-width="2" stroke-linecap="round"/>
        <circle cx="555" cy="321" r="8" fill="#ef9a62"/>
        <!-- little leg and cycling foot -->
        <path d="M447 307q18 12 37 35l8 79" fill="none" stroke="#ef985f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M492 421q6 5 18 5 6 0 7 5-13 5-28 0Z" fill="#f2a15f"/>
        <path d="M469 310q4 18 22 31l-17 75" fill="none" stroke="#e88c57" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M474 414q8 3 15 0 6-2 9 3-9 9-27 5Z" fill="#ee955b"/>
      </g>
      <!-- roadside dots -->
      <g fill="#e5a56d"><circle cx="248" cy="472" r="3"/><circle cx="267" cy="465" r="2"/><circle cx="727" cy="474" r="3"/></g>
      <path d="M0 500q215-30 412 0t548-1v101H0Z" fill="#f8f4e9" opacity=".25"/>
    </svg>
    <div class="caption">
      <h1>鹈鹕骑行记</h1>
      <p>微风刚好，出发去兜风。</p>
    </div>
  </section>
</main>
</body>
</html>
