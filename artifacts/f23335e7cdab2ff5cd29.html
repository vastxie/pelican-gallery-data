<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚴 鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:20px;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%,#1c2c4e,#070b16 72%);
    color:#e8eefc;
  }
  .wrap{width:min(1120px,100%)}
  svg#scene{
    width:100%;height:auto;display:block;cursor:pointer;
    border-radius:22px;
    box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);
    background:#0d1526;
  }
  .hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  button{
    font:inherit;font-size:14px;color:#e8eefc;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    padding:8px 15px;border-radius:999px;cursor:pointer;
    backdrop-filter:blur(6px);transition:.18s;
  }
  button:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
  button.on{background:#ffcf5c;color:#25200c;border-color:#ffcf5c;font-weight:600}
  .hint{
    margin:0;font-size:12.5px;color:#8fa0c4;text-align:center;letter-spacing:.3px;
  }
  /* ── 昼夜 ── */
  #skyNight{opacity:0;transition:opacity .9s ease}
  #sunG{opacity:1;transition:opacity .9s ease}
  #moonG{opacity:0;transition:opacity .9s ease}
  #stars{opacity:0;transition:opacity 1.1s ease}
  body.night #skyNight{opacity:1}
  body.night #sunG{opacity:0}
  body.night #moonG{opacity:1}
  body.night #stars{opacity:1}
  body.night #bg,body.night #frontLayer{filter:brightness(.52) saturate(.75)}
  body.night #rig{filter:brightness(.62) saturate(.85)}
  #bg,#frontLayer,#rig{transition:filter .9s ease}
  .headlight,.taillight{opacity:0;transition:opacity .5s ease}
  body.night .headlight{opacity:1}
  .taillight{animation:none}
  body.night .taillight{opacity:1;animation:blinkRed 1s steps(1,end) infinite}
  @keyframes blinkRed{50%{opacity:.15}}
  /* ── 眨眼 ── */
  #eye{transform-box:view-box;transform-origin:646px 226px;transition:transform .07s ease}
  body.blink #eye{transform:scaleY(.1)}
  /* ── 速度线 ── */
  .speedlines{opacity:0;transition:opacity .3s ease}
  body.fast .speedlines{opacity:.5;animation:zoom .45s linear infinite}
  @keyframes zoom{from{transform:translateX(60px)}to{transform:translateX(-60px)}}
  /* ── 挥手 ── */
  #wingWave{opacity:0}
  body.waving #wingHold{opacity:0}
  body.waving #wingWave{opacity:1;transform-box:view-box;transform-origin:604px 336px;
    animation:wave .42s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
</style>
</head>
<body>
<div class="wrap">

<svg id="scene" viewBox="0 0 1200 675" role="img" aria-label="一只戴头盔的鹈鹕骑着自行车在乡间小路上行进">

      <path d="M744 280 l-20 -12 l4 16 l-16 -8 l22 18 z" fill="#8fb8d8" stroke="#263041" stroke-width="2.4" stroke-linejoin="round"/>
      <!-- 眼睛 -->
      <g id="eye">
        <circle cx="646" cy="226" r="9" fill="#fff" stroke="#263041" stroke-width="2.2"/>
        <circle id="pupil" cx="648" cy="227" r="4" fill="#22262e"/>
        <circle cx="644" cy="223" r="1.7" fill="#fff"/>
      </g>
      <!-- 骑行头盔 -->
      <path d="M622 228 C 624 192 674 186 688 218 C 666 210 640 216 622 228 Z" fill="#ef5b3c" stroke="#263041" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M632 204 C 652 196 670 198 682 208" fill="none" stroke="#263041" stroke-width="3" stroke-linecap="round" opacity=".55"/>
      <path d="M688 218 L702 226" stroke="#263041" stroke-width="3.2" stroke-linecap="round"/>
      <!-- 围巾结 -->
      <path d="M586 300 C 600 280 628 278 642 296 C 622 312 596 314 586 300 Z" fill="#2b8ad6" stroke="#263041" stroke-width="3.2" stroke-linejoin="round"/>
      <path id="scarfA" d="M 612 296 Q 562 302 514 300 T 493 324" fill="none" stroke="#2b8ad6" stroke-width="14" stroke-linecap="round"/>
      <!-- 翅膀（握把） -->
      <g id="wingHold">
        <path d="M616 350 C 640 334 660 318 682 312" fill="none" stroke="#263041" stroke-width="32" stroke-linecap="round"/>
        <path d="M616 350 C 640 334 660 318 682 312" fill="none" stroke="#fffdf5" stroke-width="24" stroke-linecap="round"/>
        <circle cx="682" cy="312" r="13" fill="#fffdf5" stroke="#263041" stroke-width="3"/>
      </g>
      <!-- 翅膀（挥手） -->
      <g id="wingWave">
        <path d="M604 336 C 632 302 662 270 692 246" fill="none" stroke="#263041" stroke-width="32" stroke-linecap="round"/>
        <path d="M604 336 C 632 302 662 270 692 246" fill="none" stroke="#fffdf5" stroke-width="24" stroke-linecap="round"/>
        <path d="M678 264 C 694 252 706 242 714 228" fill="none" stroke="#ded9cb" stroke-width="16" stroke-linecap="round"/>
        <circle cx="598" cy="338" r="13" fill="#fffdf5" stroke="#263041" stroke-width="3"/>

      <!-- 肩部羽毛抖动 -->
      <g id="feathers">
        <path d="M588 310 C 574 300 566 286 566 272 C 582 282 592 296 594 308 Z" fill="#fffdf5" stroke="#263041" stroke-width="3" stroke-linejoin="round"/>
      </g>

    <!-- 车筐 + 鱼 -->
    <g>
      <path d="M730 330 L782 330 L774 366 L738 366 Z" fill="#c99a5b" stroke="#263041" stroke-width="3.2" stroke-linejoin="round"/>
      <g stroke="#a87b41" stroke-width="2.4">
        <line x1="742" y1="330" x2="744" y2="366"/><line x1="756" y1="330" x2="758" y2="366"/>
        <line x1="770" y1="330" x2="771" y2="366"/><line x1="730" y1="344" x2="782" y2="344"/>
      </g>
      <path d="M752 330 l-16 -14 l4 14 l-14 -6 l20 16 z" fill="#8fb8d8" stroke="#263041" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <!-- 前灯 -->
    <g class="headlight">
      <path d="M756 366 L1200 312 L1200 404 L756 384 Z" fill="url(#gBeamG)"/>
      <circle cx="752" cy="372" r="11" fill="#fff3b0" stroke="#263041" stroke-width="3"/>
    </g>
    <!-- 尾灯 -->
    <circle class="taillight" cx="556" cy="366" r="6" fill="#ff4d4d"/>
  </g>

  <!-- 速度线 -->
  <g class="speedlines" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="286" x2="300" y2="286"/>
    <line x1="96"  y1="330" x2="230" y2="330"/>
    <line x1="180" y1="372" x2="330" y2="372"/>
    <line x1="120" y1="416" x2="262" y2="416"/>
    <line x1="200" y1="452" x2="300" y2="452"/>
  </g>

  <!-- 前景 -->
  <g id="frontLayer"><g id="lyr-front"><use href="#t-front"/><use href="#t-front" x="1200"/></g></g>
</svg>

<div class="hud">
  <button id="btnPlay">⏸ 暂停</button>
  <button data-speed="0.5">🐢 0.5×</button>
  <button data-speed="1" class="on">🚲 1×</button>
  <button data-speed="2">🐇 2×</button>
  <button data-speed="4">🚀 4×</button>
  <button id="btnNight">🌙 夜晚</button>
  <button id="btnWave">👋 挥手</button>
</div>
<p class="hint">空格 = 暂停/播放 · ← → = 调速 · N = 昼夜切换 · W = 鹈鹕挥手</p>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var scene=$('scene'), rig=$('rig'), pelican=$('pelican');
  var wheelR=$('wheelR'), wheelF=$('wheelF'), crank=$('crank'), chain=$('chain');
  var legNear=$('legNear'), legFar=$('legFar'), footNear=$('footNear'), footFar=$('footFar');
  var scarfA=$('scarfA'), scarfB=$('scarfB'), feathers=$('feathers');

  /* ── 几何参数 ── */
  var G = {
    rear:{x:500,y:458}, front:{x:700,y:458}, bb:{x:598,y:462},
    crankL:22, wheelR:62,
    hipNear:{x:592,y:398}, hipFar:{x:574,y:396},
    L1:46, L2:54, pivot:{x:598,y:470}
  };
  var BASE_SPEED = 250;      // px/s（1× 时）
  var CRANK_PERIOD = 2.4;    // 踩踏一圈秒数
  var CRANK_SPEED = 2*Math.PI/CRANK_PERIOD;
  var WHEEL_SPEED = BASE_SPEED/G.wheelR;

  var LAYERS = [
    {el:$('lyr-clouds'), s:0.10},
    {el:$('lyr-far'),    s:0.22},
    {el:$('lyr-trees'),  s:0.55},
    {el:$('lyr-road'),   s:1.00},
    {el:$('lyr-front'),  s:1.70}
  ];
  var TILE = 1200;

  var dist=0, crankAng=0, chainDist=0, t=0, mul=1, paused=false;

  /* ── 工具 ── */
  function rotAbout(p,dx,dy,deg,c){
    var a=deg*Math.PI/180, cs=Math.cos(a), sn=Math.sin(a), x=p.x-c.x, y=p.y-c.y;
    return {x:c.x + x*cs - y*sn + dx, y:c.y + x*sn + y*cs + dy};
  }
  // 两段骨骼 IK：返回膝盖位置（取较高的一侧，形成骑车人朝前的膝）
  function ik(hx,hy,fx,fy,l1,l2){
    var dx=fx-hx, dy=fy-hy, d=Math.hypot(dx,dy);
    d=Math.max(Math.abs(l1-l2)+1.5, Math.min(d, l1+l2-1.5));
    var base=Math.atan2(dy,dx);
    var a1=Math.acos(Math.max(-1,Math.min(1,(d*d+l1*l1-l2*l2)/(2*d*l1))));
    var k1={x:hx+l1*Math.cos(base-a1), y:hy+l1*Math.sin(base-a1)};
    var k2={x:hx+l1*Math.cos(base+a1), y:hy+l1*Math.sin(base+a1)};
    return k1.y<=k2.y ? k1 : k2;
  }
  // Catmull-Rom 平滑路径
  function smooth(pts){
    if(pts.length<2) return '';
    var d='M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
    for(var i=0;i<pts.length-1;i++){
      var p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
      var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=' C '+c1x.toFixed(1)+' '+c1y.toFixed(1)+', '+c2x.toFixed(1)+' '+c2y.toFixed(1)+', '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
    }
    return d;
  }
  function scarfPts(x0,y0,len,amp,phase,n){
    var pts=[];
    for(var i=0;i<n;i++){
      var p=i/(n-1);
      var x = x0 - p*len + Math.sin(t*2.6 - p*2.8 + phase)*11*p;
      var y = y0 + p*10 + p*p*26 + Math.sin(t*6.5 - p*3.4 + phase)*amp*p;
      pts.push([x,y]);
    }
    return pts;
  }

  /* ── 每帧更新 ── */
  function frame(){
    var dt=1/60;
    t += dt;
    if(!paused){
      dist += BASE_SPEED*mul*dt;
      crankAng += CRANK_SPEED*mul*dt;
      chainDist += G.crankL*CRANK_SPEED*mul*dt;
    }
    var wDeg = ((dist/G.wheelR)*180/Math.PI)%360;
    wheelR.setAttribute('transform','rotate('+wDeg.toFixed(2)+' 500 458)');
    wheelF.setAttribute('transform','rotate('+wDeg.toFixed(2)+' 700 458)');

    var cDeg=(crankAng*180/Math.PI)%360;
    crank.setAttribute('transform','rotate('+cDeg.toFixed(2)+' '+G.bb.x+' '+G.bb.y+')');

    var c=Math.cos(crankAng), s=Math.sin(crankAng);
    var pN={x:G.bb.x+G.crankL*c, y:G.bb.y+G.crankL*s};
    var pF={x:G.bb.x-G.crankL*c, y:G.bb.y-G.crankL*s};
    footNear.setAttribute('transform','translate('+pN.x.toFixed(1)+' '+pN.y.toFixed(1)+') rotate('+(-cDeg).toFixed(1)+')');
    footFar.setAttribute('transform','translate('+pF.x.toFixed(1)+' '+pF.y.toFixed(1)+') rotate('+(-cDeg).toFixed(1)+')');

    // 身体上下颠簸 + 微倾
    var bob=Math.sin(crankAng*2);
    var dy=bob*2.4, deg=bob*1.2;
    pelican.setAttribute('transform','translate(0 '+dy.toFixed(2)+') rotate('+deg.toFixed(2)+' '+G.pivot.x+' '+G.pivot.y+')');
    rig.setAttribute('transform','translate(0 '+(Math.sin(t*17)*0.5).toFixed(2)+')');

    var hn=rotAbout(G.hipNear,0,dy,deg,G.pivot);
    var hf=rotAbout(G.hipFar,0,dy,deg,G.pivot);
    var kn=ik(hn.x,hn.y,pN.x,pN.y,G.L1,G.L2);
    var kf=ik(hf.x,hf.y,pF.x,pF.y,G.L1,G.L2);
    legNear.setAttribute('points', hn.x.toFixed(1)+','+hn.y.toFixed(1)+' '+kn.x.toFixed(1)+','+kn.y.toFixed(1)+' '+pN.x.toFixed(1)+','+pN.y.toFixed(1));
    legFar.setAttribute('points', hf.x.toFixed(1)+','+hf.y.toFixed(1)+' '+kf.x.toFixed(1)+','+kf.y.toFixed(1)+' '+pF.x.toFixed(1)+','+pF.y.toFixed(1));

    // 链条滚动
    chain.setAttribute('stroke-dashoffset', (-(chainDist%1000)).toFixed(1));

    // 视差滚动
    for(var i=0;i<LAYERS.length;i++){
      var L=LAYERS[i];
      var x=-(dist*L.s)%TILE;
      L.el.setAttribute('transform','translate('+x.toFixed(2)+' 0)');
    }

    // 围巾飘动
    scarfB.setAttribute('d', smooth(scarfPts(608,300,132,7,0.4,8)));
    scarfA.setAttribute('d', smooth(scarfPts(612,296,118,8,1.9,8)));

    // 肩部羽毛 & 翅膀轻颤
    feathers.setAttribute('transform','rotate('+(Math.sin(t*8)*3).toFixed(2)+' 592 308)');

    // 眨眼
    blink(dt);
    requestAnimationFrame(frame);
  }

  /* ── 眨眼 ── */
  var blinkIn=1.5+Math.random()*2, blinking=0;
  function blink(dt){
    if(blinking>0){
      blinking-=dt;
      if(blinking<=0) document.body.classList.remove('blink');
    } else {
      blinkIn-=dt;
      if(blinkIn<=0){
        document.body.classList.add('blink');
        blinking=0.13;
        blinkIn=2.2+Math.random()*3.2;
      }
    }
  }

  /* ── 交互 ── */
  var btnPlay=$('btnPlay'), btnNight=$('btnNight'), btnWave=$('btnWave');
  function setPaused(v){
    paused=v;
    btnPlay.textContent = paused ? '▶ 播放' : '⏸ 暂停';
  }
  btnPlay.addEventListener('click',function(){ setPaused(!paused); });

  var speedBtns=[].slice.call(document.querySelectorAll('[data-speed]'));
  function setSpeed(m){
    mul=m;
    document.body.classList.toggle('fast', m>1.5);
    speedBtns.forEach(function(b){ b.classList.toggle('on', +b.dataset.speed===m); });
  }
  speedBtns.forEach(function(b){
    b.addEventListener('click',function(){ setSpeed(+b.dataset.speed); });
  });

  function toggleNight(){
    document.body.classList.toggle('night');
    btnNight.textContent = document.body.classList.contains('night') ? '☀️ 白天' : '🌙 夜晚';
  }
  btnNight.addEventListener('click',toggleNight);

  var waveTimer=null;
  function wave(){
    document.body.classList.add('waving');
    clearTimeout(waveTimer);
    waveTimer=setTimeout(function(){ document.body.classList.remove('waving'); },2600);
  }
  btnWave.addEventListener('click',wave);

  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){ e.preventDefault(); setPaused(!paused); }
    else if(e.code==='ArrowRight'){ setSpeed(Math.min(4, mul*2)); }
    else if(e.code==='ArrowLeft'){ setSpeed(Math.max(0.25, mul/2)); }
    else if(e.key==='n'||e.key==='N'){ toggleNight(); }
    else if(e.key==='w'||e.key==='W'){ wave(); }
  });

  // 点击画面也让鹈鹕挥手
  scene.addEventListener('click',wave);

  setSpeed(1);
  frame();
})();
</script>
</body>
