<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑自行车 🚲</title>
<style>
  :root {
    --sky-top: #7ec8f7;
    --sky-bottom: #e8f7ff;
    --grass: #7dc85a;
    --grass-dark: #5aa93e;
    --road: #6d6a75;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #1b2a4a, #2d4470);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
  }
  h1 {
    color: #ffe9a8;
    font-size: 26px;
    letter-spacing: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .stage {
    width: min(960px, 96vw);
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.12);
    background: #7ec8f7;
  }
  svg { display: block; width: 100%; height: 100%; }
  .hint { color: #a9c3e8; font-size: 13px; letter-spacing: 2px; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>

<div class="stage">
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的2D动画">
  <defs>
    <!-- 天空 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="var(--sky-top)"/>
      <stop offset="100%" stop-color="var(--sky-bottom)"/>
    </linearGradient>
    <!-- 太阳光晕 -->
    <radialGradient id="sunGlow">
      <stop offset="0%"  stop-color="#fff7c0" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#ffe36b" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffe36b" stop-opacity="0"/>
    </radialGradient>
    <!-- 地面 -->
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--grass)"/>
      <stop offset="100%" stop-color="var(--grass-dark)"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a7782"/>
      <stop offset="100%" stop-color="#5c5966"/>
    </linearGradient>
    <!-- 自行车金属 -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b57"/>
      <stop offset="100%" stop-color="#d63b2b"/>
    </linearGradient>
    <!-- 鹈鹕身体 -->
    <radialGradient id="bodyGrad" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#ddd8cc"/>
    </radialGradient>
    <!-- 喙/囊 -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb03a"/>
      <stop offset="100%" stop-color="#f08a1d"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d2e"/>
      <stop offset="100%" stop-color="#e86f1a"/>
    </linearGradient>

    <!-- 圆形裁剪：主场景 -->
    <clipPath id="sceneClip">
      <rect x="0" y="0" width="960" height="540" rx="0"/>
    </clipPath>

    <!-- 草丛图案（用于滚动草地） -->
    <pattern id="bushPattern" width="160" height="60" patternUnits="userSpaceOnUse">
      <ellipse cx="40" cy="52" rx="34" ry="20" fill="#5fb545"/>
      <ellipse cx="70" cy="56" rx="26" ry="15" fill="#6ec44f"/>
      <ellipse cx="125" cy="54" rx="30" ry="18" fill="#57a83e"/>
      <circle cx="46" cy="44" r="4" fill="#ff6f91"/>
      <circle cx="128" cy="47" r="4" fill="#ffd93d"/>
      <circle cx="74" cy="50" r="3" fill="#ffffff"/>
    </pattern>

    <!-- 轮胎纹理（随车轮旋转） -->
    <pattern id="tirePattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#2f2f38"/>
      <rect x="0" y="0" width="10" height="10" fill="#3d3d49"/>
      <rect x="10" y="10" width="10" height="10" fill="#3d3d49"/>
      <circle cx="10" cy="10" r="2.5" fill="#55556a"/>
    </pattern>

    <!-- 单个车轮 -->
    <g id="wheel">
      <circle r="56" fill="url(#tirePattern)"/>
      <circle r="56" fill="none" stroke="#1f1f27" stroke-width="5"/>
      <circle r="47" fill="none" stroke="#8f8fa5" stroke-width="3"/>
      <g stroke="#c9c9d8" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-45" x2="0" y2="45"/>
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
        <line x1="-17" y1="-42" x2="17" y2="42"/>
        <line x1="-17" y1="42" x2="17" y2="-42"/>
        <line x1="-42" y1="-17" x2="42" y2="17"/>
        <line x1="-42" y1="17" x2="42" y2="-17"/>
      </g>
      <circle r="8" fill="#ffb03a" stroke="#c9781a" stroke-width="2"/>
    </g>

    <!-- 灌木/树木（远景） -->
    <g id="tree">
      <rect x="-7" y="-40" width="14" height="42" rx="4" fill="#8a5a33"/>
      <circle cx="0" cy="-58" r="30" fill="#4e9e3f"/>
      <circle cx="-22" cy="-46" r="22" fill="#57ad46"/>
      <circle cx="22" cy="-46" r="22" fill="#458f38"/>
      <circle cx="0" cy="-78" r="20" fill="#63bd50"/>
    </g>
  </defs>

  <g clip-path="url(#sceneClip)">

    <!-- ============ 天空 ============ -->
    <rect width="960" height="540" fill="url(#skyGrad)"/>

    <!-- 太阳 -->
    <g>
      <circle cx="820" cy="90" r="90" fill="url(#sunGlow)"/>
      <circle cx="820" cy="90" r="42" fill="#ffe36b"/>
      <g stroke="#ffe36b" stroke-width="5" stroke-linecap="round" opacity=".8">
        <line x1="820" y1="24" x2="820" y2="8"/>
        <line x1="876" y1="46" x2="890" y2="34"/>
        <line x1="884" y1="96" x2="902" y2="96"/>
        <line x1="764" y1="46" x2="750" y2="34"/>
        <line x1="756" y1="96" x2="738" y2="96"/>
      </g>
    </g>

    <!-- 云层（两层视差，向左飘） -->
    <g fill="#ffffff" opacity=".9">
      <g>
        <g opacity=".75">
          <animateTransform attributeName="transform" type="translate"
            from="1100 0" to="-260 0" dur="46s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="70" rx="70" ry="26"/>
          <ellipse cx="52" cy="60" rx="46" ry="30"/>
          <ellipse cx="-50" cy="62" rx="42" ry="24"/>
        </g>
        <g opacity=".6" transform="translate(-380 60) scale(.75)">
          <animateTransform attributeName="transform" type="translate"
            from="0 0" to="-500 0" dur="46s" repeatCount="indefinite" additive="sum"/>
          <ellipse cx="640" cy="70" rx="70" ry="26"/>
          <ellipse cx="692" cy="60" rx="46" ry="30"/>
          <ellipse cx="590" cy="62" rx="42" ry="24"/>
        </g>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate"
          from="1240 0" to="-320 0" dur="64s" repeatCount="indefinite"/>
        <g transform="translate(0 170) scale(.62)" opacity=".7">
          <ellipse cx="0" cy="70" rx="70" ry="26"/>
          <ellipse cx="52" cy="60" rx="46" ry="30"/>
          <ellipse cx="-50" cy="62" rx="42" ry="24"/>
        </g>
      </g>
    </g>

    <!-- 远山 -->
    <path d="M0 372 L120 300 L230 360 L340 292 L470 366 L600 306 L740 370 L860 314 L960 366 L960 420 L0 420 Z"
          fill="#9fd0a8" opacity=".8"/>
    <path d="M0 396 L140 336 L280 392 L420 340 L560 396 L700 344 L840 394 L960 350 L960 430 L0 430 Z"
          fill="#86c48f" opacity=".85"/>

    <!-- 远景树（向左移动） -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="1000 0" to="-260 0" dur="26s" repeatCount="indefinite"/>
      <use href="#tree" x="60"  y="404" transform="scale(.9) translate(60 0)"/>
      <use href="#tree" x="300" y="410" transform="scale(.75) translate(300 40)"/>
      <use href="#tree" x="560" y="404" transform="scale(.95) translate(560 -10)"/>
      <use href="#tree" x="820" y="412" transform="scale(.7) translate(820 60)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="1500 0" to="-320 0" dur="38s" repeatCount="indefinite"/>
      <use href="#tree" x="180" y="418" transform="scale(.55) translate(180 180)"/>
      <use href="#tree" x="640" y="420" transform="scale(.6) translate(640 140)"/>
    </g>

    <!-- 草地 -->
    <rect x="0" y="416" width="960" height="124" fill="url(#grassGrad)"/>
    <!-- 草地灌木层（滚动） -->
    <rect x="-200" y="404" width="1560" height="60" fill="url(#bushPattern)" opacity=".95">
      <animateTransform attributeName="transform" type="translate"
        from="160 0" to="0 0" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- 马路 -->
    <rect x="0" y="452" width="960" height="72" fill="url(#roadGrad)"/>
    <line x1="0" y1="454" x2="960" y2="454" stroke="#4c4a55" stroke-width="3"/>
    <!-- 路面中线虚线（滚动） -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="120 0" to="0 0" dur="0.6s" repeatCount="indefinite"/>
      <rect x="-120" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="0"   y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="120" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="240" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="360" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="480" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="600" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="720" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="840" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="960" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
      <rect x="1080" y="486" width="70" height="7" rx="3.5" fill="#ffd93d"/>
    </g>
    <!-- 路边小石子（滚动） -->
    <g fill="#8f8ca0">
      <animateTransform attributeName="transform" type="translate"
        from="90 0" to="0 0" dur="0.9s" repeatCount="indefinite"/>
      <ellipse cx="40"  cy="514" rx="8" ry="4"/>
      <ellipse cx="150" cy="522" rx="6" ry="3"/>
      <ellipse cx="260" cy="512" rx="9" ry="4"/>
      <ellipse cx="380" cy="520" rx="5" ry="3"/>
      <ellipse cx="470" cy="514" rx="7" ry="4"/>
      <ellipse cx="590" cy="522" rx="6" ry="3"/>
      <ellipse cx="700" cy="512" rx="8" ry="4"/>
      <ellipse cx="820" cy="520" rx="6" ry="3"/>
      <ellipse cx="930" cy="514" rx="7" ry="4"/>
      <ellipse cx="1020" cy="522" rx="6" ry="3"/>
    </g>

    <!-- 尘土小颗粒（车轮后方） -->
    <g fill="#cfc9b8" opacity=".7">
      <circle r="5">
        <animate attributeName="cx" values="330;250" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="510;470" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6;2" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle r="4">
        <animate attributeName="cx" values="322;262" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="514;478" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;2" dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
      </circle>
      <circle r="4">
        <animate attributeName="cx" values="336;276" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="508;466" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;1.5" dur="0.8s" begin="0.53s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ 自行车 + 鹈鹕 ============ -->
    <!-- 整体上下轻微颠簸 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0; 0 -3; 0 0"
        keyTimes="0; .25; .5; .75; 1"
        dur="0.7s" repeatCount="indefinite"/>

      <!-- 地面阴影 -->
      <ellipse cx="470" cy="522" rx="150" ry="12" fill="#000" opacity=".22">
        <animate attributeName="rx" values="150;144;150;146;150" dur="0.7s" repeatCount="indefinite"/>
      </ellipse>

      <!-- ===== 车轮 ===== -->
      <!-- 后轮 -->
      <g transform="translate(350 470)">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="-360" dur="0.9s" repeatCount="indefinite" additive="sum"/>
        <use href="#wheel"/>
      </g>
      <!-- 前轮 -->
      <g transform="translate(590 470)">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="-360" dur="0.9s" repeatCount="indefinite" additive="sum"/>
        <use href="#wheel"/>
      </g>

      <!-- ===== 车架 ===== -->
      <g stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" fill="none">
        <!-- 后下叉: 后轮 -> 曲柄 -->
        <line x1="350" y1="470" x2="470" y2="470"/>
        <!-- 立管: 曲柄 -> 车座 -->
        <line x1="470" y1="470" x2="448" y2="372"/>
        <!-- 上管: 车座 -> 车头 -->
        <line x1="448" y1="372" x2="570" y2="382"/>
        <!-- 下管: 曲柄 -> 车头 -->
        <line x1="470" y1="470" x2="570" y2="382"/>
        <!-- 前叉: 车头 -> 前轮 -->
        <line x1="570" y1="382" x2="590" y2="470"/>
        <!-- 后上叉: 车座 -> 后轮 -->
        <line x1="448" y1="372" x2="350" y2="470"/>
      </g>

      <!-- 齿盘与踏板 -->
      <g>
        <!-- 曲柄旋转 -->
        <g transform="translate(470 470)">
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="-360" dur="0.9s" repeatCount="indefinite" additive="sum"/>
          <circle r="24" fill="none" stroke="#ffd93d" stroke-width="5"/>
          <circle r="6" fill="#ffd93d"/>
          <line x1="-34" y1="0" x2="34" y2="0" stroke="#44444f" stroke-width="6" stroke-linecap="round"/>
          <rect x="-44" y="-7" width="20" height="14" rx="3" fill="#33333c"/>
          <rect x="24"  y="-7" width="20" height="14" rx="3" fill="#33333c"/>
        </g>
        <!-- 链条 -->
        <path d="M350 462 L470 462" stroke="#55556a" stroke-width="4" stroke-dasharray="6 4"/>
        <path d="M350 478 L470 478" stroke="#55556a" stroke-width="4" stroke-dasharray="6 4"/>
        <circle cx="350" cy="470" r="14" fill="none" stroke="#55556a" stroke-width="4"/>
      </g>

      <!-- 车座 -->
      <path d="M426 366 q-10 -8 -2 -14 q10 -6 30 -2 q14 3 12 10 q-2 8 -16 9 q-16 1 -24 -3 z"
            fill="#33333c"/>

      <!-- 车把 -->
      <g stroke="#33333c" stroke-width="8" fill="none" stroke-linecap="round">
        <line x1="570" y1="382" x2="576" y2="350"/>
        <path d="M576 350 q22 -12 30 6"/>
      </g>
      <circle cx="606" cy="356" r="7" fill="#33333c"/>

      <!-- 车铃 -->
      <g>
        <circle cx="590" cy="342" r="8" fill="#ffd93d" stroke="#c9a10d" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-12 590 342; 12 590 342; -12 590 342"
          keyTimes="0; .5; 1" dur="0.25s" begin="0s;2.4s" repeatCount="indefinite"/>
      </g>

      <!-- 车前小篮 -->
      <g transform="translate(614 372)">
        <path d="M-16 -10 L16 -10 L12 16 L-12 16 Z" fill="#c98a4b" stroke="#9c6733" stroke-width="2"/>
        <line x1="-14" y1="-2" x2="14" y2="-2" stroke="#9c6733" stroke-width="2"/>
        <line x1="-13" y1="6" x2="13" y2="6" stroke="#9c6733" stroke-width="2"/>
        <!-- 篮里的花 -->
        <g>
          <line x1="0" y1="-10" x2="-6" y2="-26" stroke="#4e9e3f" stroke-width="2.5"/>
          <circle cx="-6" cy="-30" r="7" fill="#ff6f91"/>
          <circle cx="-6" cy="-30" r="2.5" fill="#fff"/>
          <line x1="4" y1="-10" x2="10" y2="-24" stroke="#4e9e3f" stroke-width="2.5"/>
          <circle cx="10" cy="-28" r="6" fill="#9b6dff"/>
          <circle cx="10" cy="-28" r="2.2" fill="#fff"/>
        </g>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <g id="pelican">
        <!-- 尾羽 -->
        <path d="M398 360 q-46 -6 -66 14 q22 4 40 14 q-24 2 -40 14 q30 6 62 -8 z"
              fill="#e8e4d8" stroke="#c9c4b4" stroke-width="2"/>

        <!-- 后腿（贴在身体后侧） -->
        <g stroke="#f08a1d" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M452 400 L446 442"/>
        </g>
        <path d="M446 442 l-20 8 M446 442 l-16 14 M446 442 l-4 16"
              stroke="#f08a1d" stroke-width="7" stroke-linecap="round" fill="none"/>

        <!-- 身体 -->
        <ellipse cx="452" cy="360" rx="66" ry="52" fill="url(#bodyGrad)" stroke="#d8d3c4" stroke-width="2"/>
        <!-- 翅膀（拍动） -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="8 430 348; -18 430 348; 8 430 348"
            keyTimes="0; .5; 1" dur="0.6s" repeatCount="indefinite"/>
          <path d="M430 344 q-52 -8 -74 30 q-8 22 14 30 q40 12 68 -18 z"
                fill="#eceadf" stroke="#cfcabb" stroke-width="2"/>
          <path d="M372 388 q18 6 34 2 M366 374 q20 6 38 0"
                stroke="#cfcabb" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>

        <!-- 大围巾 -->
        <path d="M478 322 q28 -6 44 6 q-6 14 -22 16 q-20 2 -30 -8 z" fill="#e63946"/>
        <!-- 飘带 1 -->
        <path d="M520 330 q34 -6 58 6 q-4 12 -18 14 q-30 4 -44 -6 z" fill="#e63946"/>
        <animateTransform attributeName="transform" type="rotate"
          values="-6 520 330; 10 520 330; -6 520 330"
          keyTimes="0; .5; 1" dur="0.45s" repeatCount="indefinite"/>
        <!-- 飘带 2 -->
        <path d="M514 336 q40 4 66 24 q-8 12 -24 10 q-32 -4 -46 -18 z" fill="#c1121f" opacity=".95">
          <animateTransform attributeName="transform" type="rotate"
            values="8 514 336; -8 514 336; 8 514 336"
            keyTimes="0; .5; 1" dur="0.55s" repeatCount="indefinite"/>
        </path>

        <!-- 脖子 -->
        <path d="M474 336 q-4 -52 26 -78 q26 -22 54 -8 q-24 4 -36 26 q-16 30 -12 66 z"
              fill="url(#bodyGrad)" stroke="#d8d3c4" stroke-width="2"/>

        <!-- 头 -->
        <circle cx="548" cy="248" r="34" fill="url(#bodyGrad)" stroke="#d8d3c4" stroke-width="2"/>
        <!-- 头顶小羽冠 -->
        <path d="M536 218 q-6 -18 6 -26 q2 12 10 18 q4 -14 16 -18 q-6 14 -6 24 z"
              fill="#ffd93d" stroke="#e8b820" stroke-width="1.5"/>

        <!-- 眼睛 -->
        <circle cx="562" cy="240" r="8.5" fill="#2b2b33"/>
        <circle cx="565" cy="237" r="3" fill="#fff"/>
        <!-- 眼皮眨眼 -->
        <rect x="553" y="231" width="18" height="0" rx="4" fill="#e8e4d8">
          <animate attributeName="height" values="0;0;16;0;0" keyTimes="0;.9;.95;.98;1"
                   dur="3.4s" repeatCount="indefinite"/>
        </rect>

        <!-- 上喙 -->
        <path d="M570 246 L676 254 Q684 258 676 263 L570 262 Z"
              fill="url(#beakGrad)" stroke="#d97a10" stroke-width="2"/>
        <!-- 喉囊 -->
        <path d="M570 262 L668 264 Q660 306 616 310 Q578 312 570 286 Z"
              fill="url(#pouchGrad)" stroke="#d97a10" stroke-width="2"/>
        <!-- 囊的摆动 -->
        <animateTransform attributeName="transform" type="rotate"
          values="2 572 266; -3 572 266; 2 572 266"
          keyTimes="0; .5; 1" dur="0.7s" repeatCount="indefinite"/>
        <!-- 喙上的小鱼（在囊里动） -->
        <g>
          <path d="M610 286 q10 -8 22 0 q-10 8 -22 0 z M632 286 l10 -6 l0 12 z" fill="#7fd4ff"/>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 4 -3; 0 0; -3 2; 0 0"
            keyTimes="0;.25;.5;.75;1" dur="1.1s" repeatCount="indefinite"/>
        </g>

        <!-- 脖子围巾结（覆盖脖子根部） -->
        <path d="M476 320 q22 -16 48 -6 q4 16 -12 24 q-24 10 -40 -4 z" fill="#e63946"/>
        <path d="M524 336 q10 10 4 24 q-12 -6 -14 -18 z" fill="#c1121f"/>

        <!-- 前腿（踩踏板，随曲柄联动） -->

        <g stroke="#f08a1d" stroke-width="11" stroke-linecap="round" fill="none">
          <path d="M468 396 L472 436"/>
        </g>
        <!-- 小腿 + 脚：跟随踏板位置摆动 -->
        <g>
          <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
            values="M472 436 L472 464 M472 464 l-18 4;
                    M472 436 L470 464 M470 464 l-18 4;
                    M472 436 L476 462 M476 462 l-18 4;
                    M472 436 L480 458 M480 458 l-18 4;
                    M472 436 L484 460 M484 460 l-18 4;
                    M472 436 L484 464 M484 464 l-18 4;
                    M472 436 L480 466 M480 466 l-18 4;
                    M472 436 L476 466 M476 466 l-18 4;
                    M472 436 L472 464 M472 464 l-18 4"
            stroke="#f08a1d" stroke-width="9" stroke-linecap="round" fill="none"/>
        </g>

        <!-- 手（翅膀尖）搭在车把上 -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 470 340; 4 470 340; 0 470 340"

          <path d="M470 336 q46 -6 74 4 q14 4 18 12 q-4 8 -18 6 q-40 -6 -72 -6 z"

          <ellipse cx="600" cy="356" rx="14" ry="9" fill="#f7b23d" stroke="#d97a10" stroke-width="2"/>
        </g>

        <!-- 背心口袋点缀 -->
        <path d="M470 372 q20 10 34 4" stroke="#d8d3c4" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 前景速度线 -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".55">
      <line x1="700" y1="330" x2="780" y2="330">
        <animate attributeName="opacity" values="0;.6;0" dur="1.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"

      </line>
      <line x1="740" y1="410" x2="800" y2="410">
        <animate attributeName="opacity" values="0;.5;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
