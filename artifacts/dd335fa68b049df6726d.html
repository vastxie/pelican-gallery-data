<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 - SVG动画</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 60%, #90EE90 60%, #228B22 100%);
      overflow: hidden;
    }
    svg {
      width: 800px;
      height: 500px;
    }
    /* 轮子旋转 */
    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* 踏板旋转（与轮子同步） */
    @keyframes pedalSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    /* 鹈鹕上下微动 */
    @keyframes bodyBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    /* 翅膀拍动 */
    @keyframes wingFlap {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(5deg); }
    }
    /* 尾巴摇摆 */
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }
    /* 背景云朵移动 */
    @keyframes cloudMove {
      from { transform: translateX(0); }
      to { transform: translateX(-800px); }
    }
    /* 鸟飞过 */
    @keyframes birdFly {
      0% { transform: translate(-50px, 0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(850px, -60px); opacity: 0; }
    }
    /* 前轮 */
    .front-wheel { animation: wheelSpin 1s linear infinite; transform-origin: 610px 340px; }
    /* 后轮 */
    .rear-wheel { animation: wheelSpin 1s linear infinite; transform-origin: 370px 340px; }
    /* 踏板组 */
    .pedals { animation: pedalSpin 1s linear infinite; transform-origin: 490px 340px; }
    /* 鹈鹕身体 */
    .pelican-body { animation: bodyBob 0.5s ease-in-out infinite; }
    /* 翅膀 */
    .pelican-wing { animation: wingFlap 1s ease-in-out infinite; transform-origin: 440px 260px; }
    /* 尾巴 */
    .pelican-tail { animation: tailWag 0.8s ease-in-out infinite; transform-origin: 400px 270px; }
    /* 云 */
    .cloud1 { animation: cloudMove 20s linear infinite; }
    .cloud2 { animation: cloudMove 28s linear infinite; }
    /* 飞鸟 */
    .flying-bird { animation: birdFly 8s ease-in-out infinite; }
    .flying-bird2 { animation: birdFly 12s ease-in-out 3s infinite; }
  </style>
</head>
<body>
  <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 轮胎渐变 -->
      <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#555"/>
        <stop offset="80%" stop-color="#333"/>
        <stop offset="100%" stop-color="#111"/>
      </radialGradient>
      <!-- 车轮辐条 -->
      <g id="spokes">
        <line x1="0" y1="-35" x2="0" y2="35" stroke="#999" stroke-width="1.2"/>
        <line x1="-35" y1="0" x2="35" y2="0" stroke="#999" stroke-width="1.2"/>
        <line x1="-25" y1="-25" x2="25" y2="25" stroke="#999" stroke-width="1.2"/>
        <line x1="25" y1="-25" x2="-25" y2="25" stroke="#999" stroke-width="1.2"/>
      </g>
    </defs>

    <!-- ====== 背景 ====== -->
    <!-- 太阳 -->
    <circle cx="700" cy="70" r="45" fill="#FFD700" opacity="0.9"/>
    <circle cx="700" cy="70" r="55" fill="#FFD700" opacity="0.2"/>
    <!-- 太阳光芒 -->
    <g opacity="0.3">
      <line x1="700" y1="0" x2="700" y2="15" stroke="#FFD700" stroke-width="3"/>
      <line x1="745" y1="25" x2="735" y2="35" stroke="#FFD700" stroke-width="3"/>
      <line x1="760" y1="70" x2="745" y2="70" stroke="#FFD700" stroke-width="3"/>
      <line x1="745" y1="115" x2="735" y2="105" stroke="#FFD700" stroke-width="3"/>
      <line x1="700" y1="130" x2="700" y2="115" stroke="#FFD700" stroke-width="3"/>
      <line x1="655" y1="115" x2="665" y2="105" stroke="#FFD700" stroke-width="3"/>
      <line x1="640" y1="70" x2="655" y2="70" stroke="#FFD700" stroke-width="3"/>
      <line x1="655" y1="25" x2="665" y2="35" stroke="#FFD700" stroke-width="3"/>
    </g>

    <!-- 云朵 -->
    <g class="cloud1" opacity="0.8">
      <ellipse cx="150" cy="60" rx="50" ry="20" fill="white"/>
      <ellipse cx="120" cy="50" rx="35" ry="18" fill="white"/>
      <ellipse cx="180" cy="55" rx="30" ry="15" fill="white"/>
    </g>
    <g class="cloud2" opacity="0.6">
      <ellipse cx="450" cy="40" rx="45" ry="18" fill="white"/>
      <ellipse cx="420" cy="32" rx="30" ry="15" fill="white"/>
      <ellipse cx="480" cy="35" rx="25" ry="13" fill="white"/>
    </g>

    <!-- 远处的小鸟 -->
    <g class="flying-bird">
      <path d="M0,0 Q5,-6 10,0 Q15,-6 20,0" fill="none" stroke="#555" stroke-width="1.5"/>
    </g>
    <g class="flying-bird2">
      <path d="M0,0 Q4,-5 8,0 Q12,-5 16,0" fill="none" stroke="#666" stroke-width="1.2"/>
    </g>

    <!-- ====== 地面道路 ====== -->
    <rect x="0" y="375" width="800" height="125" fill="#8B7355"/>
    <rect x="0" y="375" width="800" height="5" fill="#6B5B3F"/>
    <!-- 路面标线 -->
    <g opacity="0.4">
      <rect x="50" y="420" width="60" height="4" rx="2" fill="white"/>
      <rect x="170" y="420" width="60" height="4" rx="2" fill="white"/>
      <rect x="290" y="420" width="60" height="4" rx="2" fill="white"/>
      <rect x="410" y="420" width="60" height="4" rx="2" fill="white"/>
      <rect x="530" y="420" width="60" height="4" rx="2" fill="white"/>
      <rect x="650" y="420" width="60" height="4" rx="2" fill="white"/>
    </g>

    <!-- 路边小草 -->
    <g fill="#2D8B2D" opacity="0.7">
      <path d="M30,375 Q35,360 32,375"/>
      <path d="M35,375 Q38,358 40,375"/>
      <path d="M100,375 Q105,362 102,375"/>
      <path d="M105,375 Q108,355 110,375"/>
      <path d="M250,375 Q255,363 252,375"/>
      <path d="M500,375 Q505,360 502,375"/>
      <path d="M505,375 Q508,358 510,375"/>
      <path d="M680,375 Q685,362 682,375"/>
      <path d="M685,375 Q688,356 690,375"/>
    </g>

    <!-- ====== 自行车 ====== -->
    <g id="bicycle">
      <!-- 车架 -->
      <g stroke="#CC3333" stroke-width="4" stroke-linecap="round" fill="none">
        <!-- 下管：头管到五通 -->
        <line x1="580" y1="290" x2="490" y2="340"/>
        <!-- 上管：头管到座管顶端 -->
        <line x1="580" y1="290" x2="420" y2="265"/>
        <!-- 座管：五通到座管顶 -->
        <line x1="490" y1="340" x2="420" y2="265"/>
        <!-- 后下叉：五通到后轮轴 -->
        <line x1="490" y1="340" x2="370" y2="340"/>
        <!-- 后上叉：座管顶到后轮轴 -->
        <line x1="420" y1="265" x2="370" y2="340"/>
        <!-- 前叉：头管到前轮轴 -->
        <line x1="580" y1="290" x2="610" y2="340"/>
      </g>

      <!-- 座垫 -->
      <ellipse cx="418" cy="258" rx="18" ry="6" fill="#333" stroke="#222" stroke-width="1"/>
      <!-- 座管 -->
      <line x1="420" y1="265" x2="418" y2="258" stroke="#CC3333" stroke-width="3.5"/>

      <!-- 车把立管 -->
      <line x1="580" y1="290" x2="575" y2="270" stroke="#CC3333" stroke-width="3.5"/>
      <!-- 车把 -->
      <path d="M560,270 Q575,262 590,270" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>
      <!-- 把套 -->
      <circle cx="558" cy="270" r="3.5" fill="#222"/>
      <circle cx="592" cy="270" r="3.5" fill="#222"/>

      <!-- 前轮 -->
      <g class="front-wheel">
        <circle cx="610" cy="340" r="38" fill="none" stroke="url(#tireGrad)" stroke-width="6"/>
        <circle cx="610" cy="340" r="30" fill="none" stroke="#888" stroke-width="1"/>
        <use href="#spokes" x="610" y="340"/>
        <circle cx="610" cy="340" r="4" fill="#777"/>
      </g>

      <!-- 后轮 -->
      <g class="rear-wheel">
        <circle cx="370" cy="340" r="38" fill="none" stroke="url(#tireGrad)" stroke-width="6"/>
        <circle cx="370" cy="340" r="30" fill="none" stroke="#888" stroke-width="1"/>
        <use href="#spokes" x="370" y="340"/>
        <circle cx="370" cy="340" r="4" fill="#777"/>
      </g>

      <!-- 链轮/牙盘 -->
      <circle cx="490" cy="340" r="14" fill="none" stroke="#777" stroke-width="2"/>
      <circle cx="490" cy="340" r="3" fill="#777"/>

      <!-- 链条 -->
      <path d="M476,340 L374,340" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,2"/>
      <path d="M504,340 L598,340" fill="none" stroke="#666" stroke-width="0" opacity="0"/>

      <!-- 踏板组 -->
      <g class="pedals">
        <!-- 曲柄 -->
        <line x1="490" y1="340" x2="490" y2="318" stroke="#777" stroke-width="3"/>
        <line x1="490" y1="340" x2="490" y2="362" stroke="#777" stroke-width="3"/>
        <!-- 踏板 -->
        <rect x="480" y="314" width="20" height="6" rx="2" fill="#555" stroke="#333" stroke-width="1"/>
        <rect x="480" y="358" width="20" height="6" rx="2" fill="#555" stroke="#333" stroke-width="1"/>
      </g>
    </g>

    <!-- ====== 鹈鹕 ====== -->
    <g class="pelican-body">
      <!-- 身体（椭圆，白色带灰色阴影） -->
      <ellipse cx="440" cy="255" rx="55" ry="35" fill="#F5F5F0" stroke="#DDD" stroke-width="1"/>
      <!-- 身体底部阴影 -->
      <ellipse cx="445" cy="268" rx="45" ry="15" fill="#E8E8E0" opacity="0.5"/>

      <!-- 翅膀 -->
      <g class="pelican-wing">
        <path d="M400,250 Q370,230 355,250 Q370,260 400,260 Z" fill="#E0E0D8" stroke="#CCC" stroke-width="1"/>
        <!-- 翅膀纹理 -->
        <path d="M395,248 Q380,240 370,250" fill="none" stroke="#CCC" stroke-width="0.8"/>
        <path d="M395,253 Q382,248 375,255" fill="none" stroke="#CCC" stroke-width="0.8"/>
      </g>

      <!-- 尾巴 -->
      <g class="pelican-tail">
        <path d="M385,265 Q365,255 360,270 Q370,275 385,272 Z" fill="#D8D8D0" stroke="#CCC" stroke-width="0.8"/>
        <path d="M385,268 Q368,262 363,275 Q372,278 385,275 Z" fill="#D0D0C8" stroke="#CCC" stroke-width="0.8"/>
      </g>

      <!-- 脖子 -->
      <path d="M475,240 Q490,210 485,180 Q480,165 470,160" fill="none" stroke="#F5F5F0" stroke-width="18" stroke-linecap="round"/>
      <path d="M475,240 Q490,210 485,180 Q480,165 470,160" fill="none" stroke="#E8E8E0" stroke-width="16" stroke-linecap="round"/>
      <path d="M475,240 Q490,210 485,180 Q480,165 470,160" fill="none" stroke="#F5F5F0" stroke-width="14" stroke-linecap="round"/>

      <!-- 头部 -->
      <ellipse cx="465" cy="150" rx="22" ry="18" fill="#F5F5F0" stroke="#DDD" stroke-width="1"/>

      <!-- 眼睛 -->
      <circle cx="475" cy="145" r="4.5" fill="white"/>
      <circle cx="476" cy="144" r="2.5" fill="#222"/>
      <circle cx="477" cy="143" r="1" fill="white"/>

      <!-- 嘴巴上颚 -->
      <path d="M485,150 L530,148 Q535,148 535,152 L535,152 Q535,155 530,155 L485,153 Z" fill="#FF8C00" stroke="#E07000" stroke-width="1"/>
      <!-- 嘴尖钩 -->
      <path d="M530,155 Q535,158 532,160 L528,157 Z" fill="#E07000"/>

      <!-- 嘴巴下颚 -->
      <path d="M485,153 L525,153 Q530,153 530,157 L485,160 Z" fill="#FF8C00" stroke="#E07000" stroke-width="1" opacity="0.9"/>

      <!-- 喉囊（鹈鹕标志性大口袋） -->
      <path d="M488,157 Q510,178 520,170 Q530,162 525,157 Z" fill="#FFB347" stroke="#E09030" stroke-width="1" opacity="0.85"/>
      <!-- 喉囊纹理 -->
      <path d="M495,162 Q510,170 520,165" fill="none" stroke="#E09030" stroke-width="0.6" opacity="0.5"/>

      <!-- 头顶冠羽 -->
      <path d="M455,138 Q450,125 458,130 Q453,120 462,128 Q460,118 468,130" fill="none" stroke="#DDD" stroke-width="1.5" stroke-linecap="round"/>

      <!-- 脖子上的羽毛纹理 -->
      <path d="M478,190 Q485,188 480,195" fill="none" stroke="#E0E0D8" stroke-width="0.8"/>
      <path d="M476,205 Q483,203 478,210" fill="none" stroke="#E0E0D8" stroke-width="0.8"/>
      <path d="M475,220 Q482,218 477,225" fill="none" stroke="#E0E0D8" stroke-width="0.8"/>

      <!-- 脚（踩在踏板上） -->
      <g>
        <!-- 右脚（踩在上方踏板） -->
        <path d="M488,318 L478,314 L475,318 L488,322 Z" fill="#FF8C00" stroke="#E07000" stroke-width="1"/>
        <path d="M478,314 L470,312 L472,316 L478,318 Z" fill="#FF8C00" stroke="#E07000" stroke-width="0.8"/>
        <!-- 左脚（踩在下方踏板） -->
        <path d="M488,362 L478,358 L475,362 L488,366 Z" fill="#FF8C00" stroke="#E07000" stroke-width="1"/>
        <path d="M478,358 L470,356 L472,360 L478,362 Z" fill="#FF8C00" stroke="#E07000" stroke-width="0.8"/>
      </g>
    </g>

    <!-- 装饰：路边花朵 -->
    <g>
      <circle cx="150" cy="370" r="4" fill="#FF69B4"/>
      <circle cx="150" cy="370" r="2" fill="#FFD700"/>
      <line x1="150" y1="374" x2="150" y2="382" stroke="#228B22" stroke-width="1.5"/>

      <circle cx="600" cy="372" r="3.5" fill="#FF6347"/>
      <circle cx="600" cy="372" r="1.8" fill="#FFD700"/>
      <line x1="600" y1="376" x2="600" y2="383" stroke="#228B22" stroke-width="1.2"/>

      <circle cx="350" cy="371" r="3" fill="#DA70D6"/>
      <circle cx="350" cy="371" r="1.5" fill="#FFD700"/>
      <line x1="350" y1="374" x2="350" y2="380" stroke="#228B22" stroke-width="1"/>
    </g>

    <!-- 标题文字 -->
    <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555" opacity="0.6">
      🦩 鹈鹕骑车去兜风 ~
    </text>
  </svg>
</body>
</html>
