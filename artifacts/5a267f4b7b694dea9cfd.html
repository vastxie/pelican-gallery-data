<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  :root{
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: linear-gradient(160deg,#dfeffb 0%, #f3f8fb 45%, #eef3ea 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .card{
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(30,60,90,0.15), 0 2px 8px rgba(30,60,90,0.08);
    padding: 22px 22px 16px;
    max-width: 940px;
    width: 100%;
  }
  h1{
    margin: 4px 4px 14px;
    font-size: 20px;
    color: #35424a;
    font-weight: 600;
    letter-spacing: .5px;
  }
  h1 span{
    font-weight: 400;
    color: #7c8a92;
    font-size: 13px;
    margin-left: 8px;
  }
  .stage{
    width: 100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    background: #cfeaf8;
  }
  svg{
    display:block;
    width: 100%;
    height: auto;
  }
  .caption{
    margin: 12px 4px 2px;
    color: #8b969c;
    font-size: 12.5px;
    text-align: center;
  }

  /* ---- background parallax (pure CSS loops) ---- */
  .clouds{
    animation: driftClouds 34s linear infinite;
  }
  @keyframes driftClouds{
    from{ transform: translateX(0); }
    to{ transform: translateX(-450px); }
  }
  .hills{
    animation: driftHills 60s linear infinite;
  }
  @keyframes driftHills{
    from{ transform: translateX(0); }
    to{ transform: translateX(-450px); }
  }
  .road-dashes{
    animation: driftRoad 1.1s linear infinite;
  }
  @keyframes driftRoad{
    from{ transform: translateX(0); }
    to{ transform: translateX(-90px); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>鹈鹕骑自行车 <span>SVG 2D 动画 · Pelican Riding a Bicycle</span></h1>
    <div class="stage">
      <svg id="scene" viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7fc0ef"/>
            <stop offset="55%" stop-color="#cdeaf8"/>
            <stop offset="100%" stop-color="#eef8fb"/>
          </linearGradient>
          <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#8cce8e"/>
            <stop offset="100%" stop-color="#5fae6e"/>
          </linearGradient>
          <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6d6"/>
            <stop offset="100%" stop-color="#ffe27a"/>
          </radialGradient>
          <clipPath id="sceneClip">
            <rect x="0" y="0" width="900" height="450"/>
          </clipPath>
        </defs>

        <g clip-path="url(#sceneClip)">
          <!-- sky -->
          <rect width="900" height="450" fill="url(#skyGrad)"/>
          <circle cx="800" cy="65" r="38" fill="url(#sunGrad)"/>

          <!-- distant hills (parallax) -->
          <g class="hills" fill="#a9d9ae" opacity="0.55">
            <ellipse cx="80"  cy="360" rx="120" ry="34"/>
            <ellipse cx="300" cy="368" rx="150" ry="30"/>
            <ellipse cx="560" cy="360" rx="130" ry="34"/>
            <ellipse cx="780" cy="368" rx="140" ry="28"/>
            <ellipse cx="980" cy="360" rx="120" ry="34"/>
            <ellipse cx="1200" cy="368" rx="150" ry="30"/>
            <ellipse cx="1460" cy="360" rx="130" ry="34"/>
            <ellipse cx="1680" cy="368" rx="140" ry="28"/>
          </g>

          <!-- clouds (parallax loop) -->
          <g class="clouds" fill="#ffffff" opacity="0.9">
            <g transform="translate(60,60)">
              <ellipse cx="0" cy="0" rx="30" ry="14"/>
              <ellipse cx="24" cy="-6" rx="22" ry="12"/>
              <ellipse cx="-22" cy="4" rx="18" ry="10"/>
            </g>
            <g transform="translate(320,100)">
              <ellipse cx="0" cy="0" rx="24" ry="11"/>
              <ellipse cx="20" cy="-5" rx="18" ry="9"/>
            </g>
            <g transform="translate(560,50)">
              <ellipse cx="0" cy="0" rx="34" ry="15"/>
              <ellipse cx="28" cy="-6" rx="22" ry="12"/>
              <ellipse cx="-26" cy="5" rx="18" ry="10"/>
            </g>
            <!-- duplicate set shifted by 450px for seamless loop -->
            <g transform="translate(510,60)">
              <ellipse cx="0" cy="0" rx="30" ry="14"/>
              <ellipse cx="24" cy="-6" rx="22" ry="12"/>
              <ellipse cx="-22" cy="4" rx="18" ry="10"/>
            </g>
            <g transform="translate(770,100)">
              <ellipse cx="0" cy="0" rx="24" ry="11"/>
              <ellipse cx="20" cy="-5" rx="18" ry="9"/>
            </g>
            <g transform="translate(1010,50)">
              <ellipse cx="0" cy="0" rx="34" ry="15"/>
              <ellipse cx="28" cy="-6" rx="22" ry="12"/>
              <ellipse cx="-26" cy="5" rx="18" ry="10"/>
            </g>
          </g>

          <!-- ground -->
          <rect y="350" width="900" height="100" fill="url(#groundGrad)"/>
          <rect y="392" width="900" height="58" fill="#5b6169"/>
          <rect y="392" width="900" height="3" fill="#eef3f5" opacity="0.8"/>
          <rect y="447" width="900" height="3" fill="#eef3f5" opacity="0.8"/>
          <g class="road-dashes" fill="#f4f7f8" opacity="0.85">
            <!-- repeated dash pattern, doubled for seamless 90px loop -->
            <g id="dashRow"></g>
          </g>

          <!-- shadow, moves horizontally with the bike but ignores its bob -->
          <g id="traveler">
            <ellipse id="shadow" cx="0" cy="397" rx="108" ry="9" fill="#1c2a20" opacity="0.18"/>

            <g id="bikeBob">
              <g id="bikeLocal" transform="translate(0,355)">

                <!-- rear wheel -->
                <g transform="translate(-80,0)">
                  <circle r="40" fill="#232323"/>
                  <circle r="33" fill="none" stroke="#cfd4d6" stroke-width="4"/>
                  <g id="wheelRearSpin">
                    <g stroke="#9aa2a6" stroke-width="2">
                      <line x1="0" y1="0" x2="0" y2="-33"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(45)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(90)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(135)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(180)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(225)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(270)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(315)"/>
                    </g>
                    <circle r="2.5" fill="#ffce54"/>
                  </g>
                  <circle r="5" fill="#7c8386"/>
                </g>

                <!-- front wheel -->
                <g transform="translate(80,0)">
                  <circle r="40" fill="#232323"/>
                  <circle r="33" fill="none" stroke="#cfd4d6" stroke-width="4"/>
                  <g id="wheelFrontSpin">
                    <g stroke="#9aa2a6" stroke-width="2">
                      <line x1="0" y1="0" x2="0" y2="-33"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(45)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(90)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(135)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(180)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(225)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(270)"/>
                      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(315)"/>
                    </g>
                    <circle r="2.5" fill="#ffce54"/>
                  </g>
                  <circle r="5" fill="#7c8386"/>
                </g>

                <!-- far leg (behind frame) -->
                <g id="legFarGroup" opacity="0.65">
                  <path id="legFarPath" d="M-16,-45 L-16,-45 L-10,0" fill="none" stroke="#e0862f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle id="kneeFar" cx="-16" cy="-45" r="4" fill="#e0862f"/>
                  <g id="footFar">
                    <path d="M0,0 L11,-3 L15,2 L10,6 L0,4 Z" fill="#e2861f" stroke="#b5680f" stroke-width="1"/>
                  </g>
                </g>

                <!-- bicycle frame -->
                <g id="frame" fill="none" stroke="#d64550" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="-80" y1="0"  x2="-10" y2="0"/>     <!-- chainstay -->
                  <line x1="-10" y1="0"  x2="-18" y2="-46"/>   <!-- seat tube -->
                  <line x1="-18" y1="-46" x2="-80" y2="0"/>    <!-- seat stay -->
                  <line x1="-18" y1="-46" x2="62" y2="-42"/>   <!-- top tube -->
                  <line x1="-10" y1="0"  x2="75" y2="-6"/>     <!-- down tube -->
                  <line x1="62" y1="-42" x2="75" y2="-6"/>     <!-- head tube -->
                  <line x1="75" y1="-6" x2="80" y2="0"/>       <!-- fork -->
                </g>
                <!-- saddle -->
                <path d="M-32,-47 Q-18,-54 -4,-47 L-6,-43 Q-18,-47 -30,-43 Z" fill="#3a3a3a"/>
                <!-- handlebar -->
                <g stroke="#3a3a3a" stroke-width="4.5" stroke-linecap="round" fill="none">
                  <line x1="62" y1="-42" x2="57" y2="-58"/>
                  <path d="M45,-58 Q57,-64 70,-56"/>
                </g>

                <!-- crank + pedals -->
                <g id="crankGroup" transform="translate(-10,0)">
                  <g id="crankSpin">
                    <circle r="20" fill="#3a3a3a"/>
                    <circle r="4" fill="#9aa2a6"/>
                    <g stroke="#2b2b2b" stroke-width="5" stroke-linecap="round">
                      <line x1="0" y1="0" x2="18" y2="0"/>
                      <line x1="0" y1="0" x2="-18" y2="0"/>
                    </g>
                    <rect x="14" y="-3" width="8" height="6" rx="1.5" fill="#111"/>
                    <rect x="-22" y="-3" width="8" height="6" rx="1.5" fill="#111"/>
                  </g>
                </g>

                <!-- near leg (in front of frame) -->
                <g id="legNearGroup">
                  <path id="legNearPath" d="M-12,-42 L-12,-42 L-10,0" fill="none" stroke="#f2a33d" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle id="kneeNear" cx="-12" cy="-42" r="4.3" fill="#f2a33d"/>
                  <g id="footNear">
                    <path d="M0,0 L11,-3 L15,2 L10,6 L0,4 Z" fill="#f2a33d" stroke="#c97e18" stroke-width="1"/>
                  </g>
                </g>

                <!-- pelican -->
                <g id="pelican">
                  <!-- tail -->
                  <g fill="#e4e0d8" stroke="#c9c2b5" stroke-width="1.2">
                    <path d="M-42,-68 L-64,-56 L-46,-56 Z"/>
                    <path d="M-40,-62 L-60,-48 L-44,-50 Z"/>
                  </g>

                  <!-- body -->
                  <ellipse cx="6" cy="-70" rx="46" ry="28" fill="#fbfaf6" stroke="#c9c2b5" stroke-width="2" transform="rotate(-8 6 -70)"/>

                  <!-- wing (flutters) -->
                  <g id="wingGroup">
                    <path d="M-14,-76 C-4,-96 34,-100 54,-82 C38,-72 8,-68 -14,-76 Z" fill="#e4e0d8" stroke="#c0b9ab" stroke-width="1.4"/>
                    <g stroke="#8a8578" stroke-width="1.4" stroke-linecap="round">
                      <line x1="30" y1="-76" x2="48" y2="-72"/>
                      <line x1="24" y1="-72" x2="40" y2="-67"/>
                      <line x1="18" y1="-69" x2="32" y2="-64"/>
                    </g>
                    <!-- folded wingtip resting near handlebar -->
                    <path d="M44,-80 C56,-74 62,-64 58,-54" fill="none" stroke="#c0b9ab" stroke-width="6" stroke-linecap="round"/>
                  </g>

                  <!-- neck + head (gentle nod) -->
                  <g id="headNeckGroup">
                    <path d="M46,-92 C58,-124 64,-142 86,-128" fill="none" stroke="#d8d2c4" stroke-width="17" stroke-linecap="round"/>
                    <path d="M46,-92 C58,-124 64,-142 86,-128" fill="none" stroke="#fbfaf6" stroke-width="13" stroke-linecap="round"/>

                    <!-- pouch -->
                    <path d="M110,-119 C122,-88 152,-87 165,-111 C150,-100 126,-101 110,-119 Z" fill="#f7c68b" stroke="#e0a458" stroke-width="1.2"/>

                    <!-- upper beak -->
                    <path d="M99,-130 C122,-137 152,-133 171,-120 C154,-113 128,-112 111,-117 Z" fill="#f2a33d" stroke="#c97e18" stroke-width="1.4"/>

                    <!-- head -->
                    <circle cx="94" cy="-128" r="16" fill="#fbfaf6" stroke="#c9c2b5" stroke-width="2"/>

                    <!-- eye -->
                    <circle cx="100" cy="-133" r="3.1" fill="#222"/>
                    <circle cx="101" cy="-134" r="1" fill="#fff"/>
                  </g>
                </g>

              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <p class="caption">一只鹈鹕正悠闲地骑着自行车穿过草地 · 车轮、脚踏与羽翼均由 JavaScript 实时驱动的 2D 骨骼动画</p>
  </div>

<script>
(function () {
  "use strict";

  // ---------- build repeating road dash pattern ----------
  var dashRow = document.getElementById("dashRow");
  var dashesXml = "";
  for (var i = 0; i < 22; i++) {
    dashesXml += '<rect x="' + (i * 90) + '" y="418" width="40" height="6" rx="3"></rect>';
  }
  dashRow.innerHTML = dashesXml;

  // ---------- element refs ----------
  var traveler   = document.getElementById("traveler");
  var bikeBob    = document.getElementById("bikeBob");
  var wheelRear  = document.getElementById("wheelRearSpin");
  var wheelFront = document.getElementById("wheelFrontSpin");
  var crankSpin  = document.getElementById("crankSpin");
  var legFarPath  = document.getElementById("legFarPath");
  var legNearPath = document.getElementById("legNearPath");
  var kneeFar  = document.getElementById("kneeFar");
  var kneeNear = document.getElementById("kneeNear");
  var footFar  = document.getElementById("footFar");
  var footNear = document.getElementById("footNear");
  var wingGroup = document.getElementById("wingGroup");
  var headNeckGroup = document.getElementById("headNeckGroup");

  // ---------- tunable constants ----------
  var WHEEL_RADIUS   = 40;
  var CRANK_R        = 18;
  var BB             = { x: -10, y: 0 };     // bottom bracket, local coords
  var HIP_FAR         = { x: -16, y: -45 };
  var HIP_NEAR        = { x: -12, y: -42 };
  var THIGH = 32, SHIN = 32;

  var CRANK_PERIOD = 1.6;   // seconds per pedal revolution
  var WHEEL_PERIOD = 1.05;  // seconds per wheel revolution
  var TRAVEL_SPEED = 95;    // px / second
  var TRAVEL_MIN   = -220;
  var TRAVEL_RANGE = 1300;
  var BOB_AMPLITUDE = 3;

  function solveIK(hip, foot, l1, l2, bendSign) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.hypot(dx, dy);
    d = Math.min(d, l1 + l2 - 0.01);
    d = Math.max(d, Math.abs(l1 - l2) + 0.01);
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / d, uy = dy / d;
    var px = -uy, py = ux;
    var mx = hip.x + ux * a, my = hip.y + uy * a;
    return { x: mx + px * h * bendSign, y: my + py * h * bendSign };
  }

  function footPoint(theta) {
    return { x: BB.x + CRANK_R * Math.cos(theta), y: BB.y + CRANK_R * Math.sin(theta) };
  }

  var start = null;

  function frame(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000; // seconds elapsed

    var crankAngle = (t / CRANK_PERIOD) * Math.PI * 2;
    var wheelAngle = (t / WHEEL_PERIOD) * 360;

    // horizontal travel, looping
    var xPos = TRAVEL_MIN + ((t * TRAVEL_SPEED) % TRAVEL_RANGE);
    var bob = Math.sin(crankAngle * 2) * BOB_AMPLITUDE;

    traveler.setAttribute("transform", "translate(" + xPos.toFixed(2) + ",0)");
    bikeBob.setAttribute("transform", "translate(0," + bob.toFixed(2) + ")");

    wheelRear.setAttribute("transform", "rotate(" + (wheelAngle % 360).toFixed(2) + ")");
    wheelFront.setAttribute("transform", "rotate(" + (wheelAngle % 360).toFixed(2) + ")");
    crankSpin.setAttribute("transform", "rotate(" + ((crankAngle * 180 / Math.PI) % 360).toFixed(2) + ")");

    // pedals / feet
    var thetaFar = crankAngle;
    var thetaNear = crankAngle + Math.PI;

    var footF = footPoint(thetaFar);
    var footN = footPoint(thetaNear);

    var kneeF = solveIK(HIP_FAR, footF, THIGH, SHIN, 1);
    var kneeN = solveIK(HIP_NEAR, footN, THIGH, SHIN, 1);

    legFarPath.setAttribute("d",
      "M" + HIP_FAR.x + "," + HIP_FAR.y +
      " L" + kneeF.x.toFixed(2) + "," + kneeF.y.toFixed(2) +
      " L" + footF.x.toFixed(2) + "," + footF.y.toFixed(2));
    legNearPath.setAttribute("d",
      "M" + HIP_NEAR.x + "," + HIP_NEAR.y +
      " L" + kneeN.x.toFixed(2) + "," + kneeN.y.toFixed(2) +
      " L" + footN.x.toFixed(2) + "," + footN.y.toFixed(2));

    kneeFar.setAttribute("cx", kneeF.x.toFixed(2));
    kneeFar.setAttribute("cy", kneeF.y.toFixed(2));
    kneeNear.setAttribute("cx", kneeN.x.toFixed(2));
    kneeNear.setAttribute("cy", kneeN.y.toFixed(2));

    var footFDeg = thetaFar * 180 / Math.PI;
    var footNDeg = thetaNear * 180 / Math.PI;
    footFar.setAttribute("transform", "translate(" + footF.x.toFixed(2) + "," + footF.y.toFixed(2) + ") rotate(" + footFDeg.toFixed(1) + ")");
    footNear.setAttribute("transform", "translate(" + footN.x.toFixed(2) + "," + footN.y.toFixed(2) + ") rotate(" + footNDeg.toFixed(1) + ")");

    // idle wing flutter, independent of pedaling
    var wingAngle = Math.sin(t * 2.1) * 4;
    wingGroup.setAttribute("transform", "rotate(" + wingAngle.toFixed(2) + " 20,-82)");

    // gentle head nod tied to cadence
    var nodAngle = Math.sin(crankAngle * 2 + Math.PI / 2) * 2;
    headNeckGroup.setAttribute("transform", "rotate(" + nodAngle.toFixed(2) + " 46,-92)");

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
