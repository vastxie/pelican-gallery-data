<script>
const NS = "http://www.w3.org/2000/svg";
const REAR = { x: 390, y: 540 };
const FRONT = { x: 780, y: 540 };
const BB = { x: 568, y: 526 };
const CR = 36;
const HIP_N = { x: 504, y: 456 };
const HIP_F = { x: 488, y: 450 };
const TH = 72;
const SH = 68;
const CADENCE = 0.8;
const GEAR = 1.25;
const ROLL_R = 86;
const PERIOD = 1200;

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

function el(name, attrs, parent) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  parent.appendChild(node);
  return node;
}

function wheel(parent, spokesId) {
  const spin = el("g", { id: spokesId }, parent);
  el("circle", { r: 78, fill: "none", stroke: "#1C2128", "stroke-width": 14 }, spin);
  el("circle", { r: 78, fill: "none", stroke: "#4C5762", "stroke-width": 14, "stroke-dasharray": "9 13" }, spin);
  const spokes = el("g", { stroke: "#F3ECDE", "stroke-width": 2.6 }, spin);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    el("line", {
      x1: Math.cos(a) * 14,
      y1: Math.sin(a) * 14,
      x2: Math.cos(a) * 66,
      y2: Math.sin(a) * 66,
    }, spokes);
  }
  el("circle", { r: 68, fill: "none", stroke: "#F4EFE4", "stroke-width": 4.5 }, spin);
  el("circle", { r: 10, fill: "#1C2128" }, spin);
  el("circle", { r: 4, fill: "#F4EFE4" }, spin);
}

function teeth(parent, radius, count, len) {
  for (let i = 0; i < count; i++) {
    el("rect", {
      x: -3,
      y: -radius - len,
      width: 6,
      height: len,
      rx: 1.2,
      fill: "#2A2424",
      transform: `rotate(${(360 / count) * i})`,
    }, parent);
  }
}

function wave(y, amp, step) {
  let d = `M0,${y}`;
  for (let x = 0, n = 0; x < PERIOD * 2; x += step, n++) {
    d += ` Q${x + step / 2},${y + (n % 2 ? amp : -amp)} ${x + step},${y}`;
  }
  return d;
}

function mod(n, m) {
  return ((n % m) + m) % m;
}

function setLine(id, x1, y1, x2, y2) {
  const node = $(id);
  node.setAttribute("x1", x1);
  node.setAttribute("y1", y1);
  node.setAttribute("x2", x2);
  node.setAttribute("y2", y2);
}

function kneePoint(hip, foot, l1, l2, sign) {
  let dx = foot.x - hip.x;
  let dy = foot.y - hip.y;
  let d = Math.hypot(dx, dy);
  const max = l1 + l2 - 1;
  const min = Math.abs(l1 - l2) + 1;
  d = Math.min(max, Math.max(min, d));
  const base = Math.atan2(dy, dx);
  const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
  const bend = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const a = base + sign * bend;
  return { x: hip.x + Math.cos(a) * l1, y: hip.y + Math.sin(a) * l1 };
}

const memory = { near: -1, far: -1 };
function solveKnee(hip, foot, key) {
  const options = [-1, 1].map((sign) => ({ sign, k: kneePoint(hip, foot, TH, SH, sign) }));
  options.sort((a, b) => a.k.y - b.k.y);
  const best = options[0];
  const current = options.find((o) => o.sign === memory[key]);
  if (current && current.k.y <= best.k.y + 16) return current.k;
  memory[key] = best.sign;
  return best.k;
}

wheel($("rearWheel"), "rearSpin");
wheel($("frontWheel"), "frontSpin");

teeth($("ringTeeth"), 22, 14, 8);
const cogTeeth = el("g", {}, $("cogSpin"));
teeth(cogTeeth, 12, 8, 6);
el("circle", { r: 12, fill: "none", stroke: "#2A2424", "stroke-width": 5 }, $("cogSpin"));
el("circle", { r: 4, fill: "#F4EFE4" }, $("cogSpin"));

const sun = $("sunSpin");
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  el("line", {
    x1: Math.cos(a) * 58,
    y1: Math.sin(a) * 58,
    x2: Math.cos(a) * 96,
    y2: Math.sin(a) * 96,
    stroke: "#FFE3A3",
    "stroke-width": 4,
    "stroke-linecap": "round",
  }, sun);
}
el("circle", { r: 46, fill: "#FFD56A" }, sun);
el("circle", { r: 26, fill: "#FFF3C9" }, sun);

el("path", { d: wave(444, 8, 56), stroke: "#E9F8FC", "stroke-width": 3 }, $("waveScroll"));
el("path", { d: wave(468, 5, 44), stroke: "#D4F1F7", "stroke-width": 2.2, opacity: 0.8 }, $("waveScroll"));

const gullHold = $("gullScroll");
[[180, 392, 1, ""], [640, 360, 0.8, "b"], [980, 404, 1.1, "c"], [1460, 372, 0.9, "b"]].forEach(([x, y, s, cls]) => {
  el("path", {
    class: `gull ${cls}`,
    d: `M${x},${y} q${10 * s},${-12 * s} ${20 * s},0 q${10 * s},${-12 * s} ${20 * s},0`,
  }, gullHold);
});

const tufts = $("tuftScroll");
let seed = 19;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let x = 0; x < PERIOD * 2; x += 26) {
  const h = 16 + rnd() * 26;
  const lean = (rnd() - 0.5) * 14;
  const y = 612;
  el("path", {
    d: `M${x},${y} Q${x + lean},${y - h} ${x + lean * 0.35},${y - h - 2}`,
    stroke: rnd() > 0.45 ? "#6F9A3E" : "#87AE52",
    "stroke-width": 3,
    fill: "none",
    "stroke-linecap": "round",
  }, tufts);
  if (rnd() > 0.78) {
    el("circle", {
      cx: x + lean * 0.35,
      cy: y - h - 2,
      r: 3.3,
      fill: rnd() > 0.5 ? "#F2D15A" : "#FFF8EA",
    }, tufts);
  }
}

const dustPool = [];
for (let i = 0; i < 16; i++) {
  const node = el("circle", { r: 3, fill: "#E4D2AE", opacity: 0 }, $("dust"));
  dustPool.push({ el: node, life: 0, x: 0, y: 0, vx: 0, vy: 0, r: 3 });
}

function pedal(angle) {
  return { x: BB.x + Math.cos(angle) * CR, y: BB.y + Math.sin(angle) * CR };
}

function drawLeg(prefix, hip, foot, key) {
  const k = solveKnee(hip, foot, key);
  setLine(prefix + "ThighO", hip.x, hip.y, k.x, k.y);
  setLine(prefix + "Thigh", hip.x, hip.y, k.x, k.y);
  setLine(prefix + "ShinO", k.x, k.y, foot.x, foot.y);
  setLine(prefix + "Shin", k.x, k.y, foot.x, foot.y);
  $(prefix + "Knee").setAttribute("cx", k.x);
  $(prefix + "Knee").setAttribute("cy", k.y);
}

let spawnAcc = 0;
function render(angle, dt, spinSun) {
  const bob = Math.sin(angle * 2) * 2.6;
  const wheel = angle * GEAR;
  const speed = CADENCE * GEAR * Math.PI * 2 * ROLL_R;
  const travel = wheel * ROLL_R;

  $("rig").setAttribute("transform", `translate(0,${bob})`);
  $("rearWheel").setAttribute("transform", `translate(${REAR.x},${REAR.y})`);
  $("rearSpin").setAttribute("transform", `rotate(${(wheel * 180) / Math.PI})`);
  $("frontWheel").setAttribute("transform", `translate(${FRONT.x},${FRONT.y})`);
  $("frontSpin").setAttribute("transform", `rotate(${(wheel * 180) / Math.PI})`);
  $("cogSpin").setAttribute("transform", `translate(${REAR.x},${REAR.y}) rotate(${(wheel * 180) / Math.PI})`);
  $("ringSpin").setAttribute("transform", `translate(${BB.x},${BB.y}) rotate(${(angle * 180) / Math.PI})`);

  const ringY = BB.y + bob;
  setLine("chainTop", REAR.x + 10, REAR.y - 12, BB.x, ringY - 22);
  setLine("chainBot", REAR.x + 8, REAR.y + 12, BB.x, ringY + 22);
  const dash = -angle * 22;
  $("chainTop").setAttribute("stroke-dashoffset", dash);
  $("chainBot").setAttribute("stroke-dashoffset", dash);

  const deg = (angle * 180) / Math.PI;
  $("crank").setAttribute("transform", `translate(${BB.x},${BB.y}) rotate(${deg})`);
  $("pedalNear").setAttribute("transform", `translate(${CR},0) rotate(${-deg})`);
  $("pedalFar").setAttribute("transform", `translate(${-CR},0) rotate(${-deg})`);

  const near = pedal(angle);
  const far = pedal(angle + Math.PI);
  drawLeg("near", HIP_N, near, "near");
  drawLeg("far", HIP_F, far, "far");
  $("nearFoot").setAttribute("transform", `translate(${near.x},${near.y}) rotate(${Math.sin(angle) * 18})`);
  $("farFoot").setAttribute("transform", `translate(${far.x},${far.y}) rotate(${Math.sin(angle + Math.PI) * 18}) scale(0.88)`);

  const headSway = Math.sin(angle * 2) * 1.6;
  const headLift = Math.cos(angle * 2) * 2.1;
  $("head").setAttribute("transform", `translate(${headSway},${headLift}) rotate(${Math.sin(angle) * 1.3}, 678, 234)`);
  const jiggle = 1 + Math.sin(angle * 2 + 0.6) * 0.05;
  $("pouch").setAttribute("transform", `translate(820,290) scale(1,${jiggle}) translate(-820,-290)`);

  const blinkPhase = ((angle / (Math.PI * 2)) * (1 / CADENCE)) % 4.8;
  let eye = 1;
  if (blinkPhase > 4.55) {
    const k = (blinkPhase - 4.55) / 0.25;
    eye = k < 0.5 ? 1 - k * 1.85 : (k - 0.5) * 1.85;
    eye = Math.max(0.08, Math.min(1, eye));
  }
  $("eye").setAttribute("transform", `translate(695,229) scale(1,${eye}) translate(-695,-229)`);

  $("cloudScroll").setAttribute("transform", `translate(${-mod(travel * 0.07, PERIOD)},0)`);
  $("waveScroll").setAttribute("transform", `translate(${-mod(travel * 0.12, PERIOD)},0)`);
  $("gullScroll").setAttribute("transform", `translate(${-mod(travel * 0.16, PERIOD)},0)`);
  $("farDuneWrap").setAttribute("transform", `translate(${-mod(travel * 0.24, PERIOD)},0)`);
  $("nearDuneWrap").setAttribute("transform", `translate(${-mod(travel * 0.42, PERIOD)},0)`);
  $("tuftScroll").setAttribute("transform", `translate(${-mod(travel * 0.78, PERIOD)},0)`);
  $("lane").setAttribute("patternTransform", `translate(${-mod(travel, 156)},0)`);
  $("shadow").setAttribute("transform", `translate(0,${bob * 0.25}) scale(${1 + bob * 0.004},1)`);

  if (spinSun) {
    const turns = (travel / speed) * 10;
    $("sunSpin").setAttribute("transform", `translate(188,132) rotate(${turns})`);
  }

  if (dt > 0) {
    spawnAcc += dt;
    while (spawnAcc > 0.09) {
      spawnAcc -= 0.09;
      const p = dustPool.find((item) => item.life <= 0);
      if (!p) break;
      p.life = 1;
      p.x = REAR.x - 10 + Math.random() * 16;
      p.y = 624;
      p.vx = -70 - Math.random() * 110;
      p.vy = -24 - Math.random() * 46;
      p.r = 2 + Math.random() * 3.4;
    }
    for (const p of dustPool) {
      if (p.life <= 0) {
        p.el.setAttribute("opacity", 0);
        continue;
      }
      p.life -= dt * 1.35;
      p.x += (p.vx - speed) * dt;
      p.y += p.vy * dt;
      p.vy += 90 * dt;
      p.el.setAttribute("cx", p.x);
      p.el.setAttribute("cy", p.y);
      p.el.setAttribute("r", p.r * (1.2 - p.life * 0.3));
      p.el.setAttribute("opacity", Math.max(0, p.life) * 0.4);
    }
  }
}

render(0.4, 0, false);
$("sunSpin").setAttribute("transform", "translate(188,132)");

if (!reduce) {
  let last = performance.now();
  let angle = 0.4;
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    angle += dt * CADENCE * Math.PI * 2;
    render(angle, dt, true);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
