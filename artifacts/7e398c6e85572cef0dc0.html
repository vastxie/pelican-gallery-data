<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG 2D 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e1b2c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .wrap {
    width: min(96vw, 900px);
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  h1 {
    color: #ffd76a;
    text-align: center;
    font-size: 18px;
    letter-spacing: 4px;
    margin: 0 0 12px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>鹈鹕骑自行车 · SVG 2D 动画</h1>
<svg id="scene" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8fd3ff"/>
      <stop offset="60%" stop-color="#c9ecff"/>
      <stop offset="100%" stop-color="#fff3d6"/>
    </linearGradient>
    <!-- 草地渐变 -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7ec850"/>
      <stop offset="100%" stop-color="#4c9a2e"/>
    </linearGradient>
    <!-- 太阳光晕 -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#fff6c9" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffe27a" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <!-- 喙渐变 -->
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f4801f"/>
    </linearGradient>
    <!-- 喉囊渐变 -->
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffd28a"/>
      <stop offset="100%" stop-color="#ffab5c"/>
    </linearGradient>
    <!-- 身体渐变 -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f3ece0"/>
      <stop offset="100%" stop-color="#d9cdba"/>
    </linearGradient>
  </defs>

  <!-- ===== 背景 ===== -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="665" cy="85" r="62" fill="url(#sunGlow)"/>
    <circle cx="665" cy="85" r="30" fill="#ffdf6b"/>
  </g>

  <!-- 远山 -->
  <path d="M0 300 Q 90 220 190 300 T 400 300 T 620 300 T 830 300 L 830 330 L 0 330 Z" fill="#a9d7a0" opacity=".7"/>

  <!-- 云朵（缓慢飘动） -->
  <g fill="#ffffff" opacity=".9">
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="-160 0" to="960 0" dur="38s" repeatCount="indefinite"/>
      <ellipse cx="0"  cy="70"  rx="46" ry="22"/>
      <ellipse cx="34" cy="60"  rx="34" ry="24"/>
      <ellipse cx="-34" cy="62" rx="30" ry="18"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="-360 0" to="900 0" dur="52s" repeatCount="indefinite"/>
      <ellipse cx="0"  cy="130" rx="38" ry="18"/>
      <ellipse cx="28" cy="122" rx="28" ry="19"/>
      <ellipse cx="-26" cy="124" rx="24" ry="15"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect y="300" width="800" height="150" fill="url(#grass)"/>
  <!-- 道路 -->
  <rect y="352" width="800" height="60" fill="#6b6b74"/>
  <rect y="352" width="800" height="5" fill="#8a8a93"/>
  <rect y="407" width="800" height="5" fill="#55555d"/>
  <!-- 道路虚线（快速后移 = 前进感） -->
  <g stroke="#f7f3a8" stroke-width="6" stroke-linecap="round" stroke-dasharray="42 34">
    <line x1="-200" y1="382" x2="1000" y2="382">
      <animate attributeName="stroke-dashoffset" from="0" to="152" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 地面小草（后移） -->
  <g stroke="#3e8a24" stroke-width="3" stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0 0" to="-240 0" dur="1.1s" repeatCount="indefinite"/>
      <path d="M60 345 l-6 -12 M60 345 l6 -12 M60 345 l0 -14"/>
      <path d="M240 345 l-6 -12 M240 345 l6 -12 M240 345 l0 -14"/>
      <path d="M420 345 l-6 -12 M420 345 l6 -12 M420 345 l0 -14"/>
      <path d="M600 345 l-6 -12 M600 345 l6 -12 M600 345 l0 -14"/>
      <path d="M780 345 l-6 -12 M780 345 l6 -12 M780 345 l0 -14"/>
    </g>
  </g>

  <!-- 远处树木（后移） -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-480 0" dur="3s" repeatCount="indefinite"/>
    <g>
      <rect x="150" y="270" width="10" height="34" fill="#7a4b26"/>
      <circle cx="155" cy="258" r="26" fill="#5aa83a"/>
    </g>
    <g>
      <rect x="390" y="276" width="9" height="28" fill="#7a4b26"/>
      <circle cx="394" cy="266" r="20" fill="#4f9b31"/>
    </g>
    <g>
      <rect x="630" y="270" width="10" height="34" fill="#7a4b26"/>
      <circle cx="635" cy="256" r="27" fill="#5aa83a"/>
    </g>
  </g>

  <!-- ===== 整车与鹈鹕（上下颠簸） ===== -->
  <g id="rig">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -3; 0 0; 0 -3; 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.5s" repeatCount="indefinite"/>

    <!-- 影子 -->
    <ellipse cx="330" cy="412" rx="130" ry="10" fill="#000" opacity=".18"/>

    <!-- ===== 自行车 ===== -->
    <g id="bike" stroke-linecap="round">
      <!-- 后轮 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 250 380" to="360 250 380" dur="0.55s" repeatCount="indefinite"/>
        <circle cx="250" cy="380" r="34" fill="none" stroke="#23252b" stroke-width="8"/>
        <circle cx="250" cy="380" r="27" fill="none" stroke="#3a3d45" stroke-width="2"/>
        <g stroke="#b9bdc7" stroke-width="2">
          <line x1="250" y1="353" x2="250" y2="407"/>
          <line x1="223" y1="380" x2="277" y2="380"/>
          <line x1="231" y1="361" x2="269" y2="399"/>
          <line x1="269" y1="361" x2="231" y2="399"/>
        </g>
        <circle cx="250" cy="380" r="5" fill="#6b7280"/>
      </g>

      <!-- 前轮 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 420 380" to="360 420 380" dur="0.55s" repeatCount="indefinite"/>
        <circle cx="420" cy="380" r="34" fill="none" stroke="#23252b" stroke-width="8"/>
        <circle cx="420" cy="380" r="27" fill="none" stroke="#3a3d45" stroke-width="2"/>
        <g stroke="#b9bdc7" stroke-width="2">
          <line x1="420" y1="353" x2="420" y2="407"/>
          <line x1="393" y1="380" x2="447" y2="380"/>
          <line x1="401" y1="361" x2="439" y2="399"/>
          <line x1="439" y1="361" x2="401" y2="399"/>
        </g>
        <circle cx="420" cy="380" r="5" fill="#6b7280"/>
      </g>

      <!-- 车架 -->
      <g stroke="#e0483a" stroke-width="8" fill="none">
        <!-- 后叉 -> 五通 -> 座管 -->
        <path d="M250 380 L 330 380 L 322 300"/>
        <!-- 上管 -->
        <path d="M322 300 L 395 312"/>
        <!-- 前叉 -> 头管 -->
        <path d="M420 380 L 398 318"/>
        <!-- 下管 -->
        <path d="M330 380 L 398 318"/>
        <!-- 后上叉 -->
        <path d="M250 380 L 322 300"/>
      </g>

      <!-- 座垫 -->
      <path d="M300 292 q 16 -12 36 -4 l 4 8 q -22 8 -42 0 z" fill="#3a2b21"/>
      <!-- 车把 -->
      <path d="M398 318 L 402 292 M388 286 q 12 -8 26 -2" stroke="#2f3138" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- 车铃 -->
      <circle cx="416" cy="283" r="5" fill="#ffcf4d"/>

      <!-- 脚踏曲柄 + 踏板（绕五通旋转） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 330 380" to="360 330 380" dur="0.55s" repeatCount="indefinite"/>
        <line x1="330" y1="380" x2="330" y2="404" stroke="#2f3138" stroke-width="6"/>
        <rect x="318" y="400" width="24" height="8" rx="3" fill="#2f3138"/>
        <line x1="330" y1="380" x2="330" y2="356" stroke="#2f3138" stroke-width="6"/>
        <rect x="318" y="352" width="24" height="8" rx="3" fill="#2f3138"/>
      </g>
      <!-- 牙盘 -->
      <circle cx="330" cy="380" r="14" fill="none" stroke="#c9ccd4" stroke-width="4"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M262 288 q -30 -8 -46 8 q 22 4 40 14 z" fill="#cbbda6"/>

      <!-- 身体 -->
      <ellipse cx="322" cy="288" rx="58" ry="40" fill="url(#body)"/>

      <!-- 翅膀（拍打） -->
      <g id="wing">
        <animateTransform attributeName="transform" type="rotate"
          values="6 315 278; -8 315 278; 6 315 278" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>
        <path d="M300 262 q 46 -16 62 14 q -20 34 -62 22 q -12 -18 0 -36 z" fill="#e6dcc9"/>
        <path d="M300 262 q 46 -16 62 14" fill="none" stroke="#cbbda6" stroke-width="2"/>
        <path d="M312 282 q 22 -4 40 2" fill="none" stroke="#cbbda6" stroke-width="2"/>
      </g>

      <!-- 右腿（远侧，暗一点，反相踩踏） -->
      <g id="legR">
        <animateTransform attributeName="transform" type="rotate"
          values="-14 318 322; 14 318 322; -14 318 322" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>
        <path d="M318 322 L 322 358" stroke="#c98a3c" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M322 358 L 334 368" stroke="#c98a3c" stroke-width="8" fill="none" stroke-linecap="round"/>
        <ellipse cx="336" cy="370" rx="11" ry="5" fill="#d18f3d"/>
      </g>

      <!-- 左腿（近侧） -->
      <g id="legL">
        <animateTransform attributeName="transform" type="rotate"
          values="14 318 322; -14 318 322; 14 318 322" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>
        <path d="M318 322 L 322 358" stroke="#f0a24a" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M322 358 L 334 368" stroke="#f0a24a" stroke-width="9" fill="none" stroke-linecap="round"/>
        <ellipse cx="336" cy="370" rx="12" ry="5.5" fill="#ffb052"/>
      </g>

      <!-- 颈部 + 头部 -->
      <g id="head">
        <animateTransform attributeName="transform" type="rotate"
          values="-2 330 268; 2 330 268; -2 330 268" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>

        <!-- 长脖子 -->
        <path d="M336 268 q 22 -28 14 -58" stroke="#f3ece0" stroke-width="22" fill="none" stroke-linecap="round"/>
        <path d="M336 268 q 22 -28 14 -58" stroke="#ffffff" stroke-width="14" fill="none" stroke-linecap="round"/>

        <!-- 头 -->
        <circle cx="352" cy="196" r="24" fill="url(#body)"/>
        <!-- 头顶小羽冠 -->
        <path d="M344 174 q 6 -14 18 -12 q -6 8 -4 14 z" fill="#e6dcc9"/>

        <!-- 眼睛 -->
        <circle cx="362" cy="188" r="5.5" fill="#2a2a33"/>
        <circle cx="364" cy="186" r="1.8" fill="#fff"/>
        <!-- 眨眼 -->
        <rect x="356" y="183" width="14" height="10" fill="url(#body)" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.92;0.95;0.98;1" dur="3.2s" repeatCount="indefinite"/>
        </rect>

        <!-- 喙（上） -->
        <path d="M368 194 L 452 208 L 366 208 Q 360 200 368 194 Z" fill="url(#beak)"/>
        <!-- 喉囊（下喙，轻轻晃动） -->
        <g id="pouchG">
          <animateTransform attributeName="transform" type="rotate"
            values="0 368 204; 3 368 204; 0 368 204" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
          <path d="M366 206 q 6 40 50 34 q 34 -6 32 -34 z" fill="url(#pouch)" stroke="#e8892f" stroke-width="2"/>
          <path d="M380 212 q 24 22 62 8" fill="none" stroke="#e8892f" stroke-width="2" opacity=".6"/>
        </g>
        <!-- 喙缝线 -->
        <line x1="366" y1="206" x2="450" y2="208" stroke="#d96c14" stroke-width="2"/>
      </g>

      <!-- 把住车把的小翅膀尖（手臂） -->
      <path d="M352 272 q 34 4 52 18" stroke="#efe6d5" stroke-width="12" fill="none" stroke-linecap="round"/>
      <ellipse cx="404" cy="290" rx="10" ry="7" fill="#ffb052"/>
    </g>
  </g>

  <!-- 前景飞掠的小草（营造速度） -->
  <g stroke="#2f6b1c" stroke-width="4" stroke-linecap="round" opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-400 0" dur="0.7s" repeatCount="indefinite"/>
    <path d="M80 430 l -10 -18 M80 430 l 10 -18"/>
    <path d="M280 436 l -10 -18 M280 436 l 10 -18"/>
    <path d="M480 430 l -10 -18 M480 430 l 10 -18"/>
    <path d="M680 436 l -10 -18 M680 436 l 10 -18"/>
  </g>
</svg>
</div>
</body>
</html>
