<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root {
    --sky-top: #7ec8f0;
    --sky-bottom: #d9f0ff;
    --ground: #6ab04c;
    --ground-dark: #4e8c37;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f1720;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 100%;
    height: 100%;
    max-width: 100%;
    display: block;
  }
  .caption {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 14px;
    text-align: center;
    color: #ffffffcc;
    font-size: 14px;
    letter-spacing: 2px;
    text-shadow: 0 2px 6px #000;
    pointer-events: none;
    user-select: none;
  }

  /* ---------- 车轮旋转 ---------- */
  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.05s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ---------- 踩踏板（曲柄转动） ---------- */
  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.05s linear infinite;
  }

  /* ---------- 整体上下颠簸 ---------- */
  .bike-and-bird {
    animation: bob 0.66s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center bottom;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25%      { transform: translateY(-4px) rotate(-0.7deg); }
    50%      { transform: translateY(0.5px) rotate(0.4deg); }
    75%      { transform: translateY(-3px) rotate(-0.4deg); }
  }

  /* ---------- 鹈鹕身体轻微起伏（呼吸/摆动） ---------- */
  .pelican-body {
    animation: sway 1.32s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center bottom;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(1.4deg); }
  }

  /* ---------- 翅膀扇动 ---------- */
  .wing {
    transform-box: fill-box;
    transform-origin: 90% 15%;
    animation: flap 0.66s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-16deg); }
  }

  /* ---------- 腿踩踏（交替） ---------- */
  .leg-front {
    transform-box: fill-box;
    transform-origin: top center;
    animation: pedal-front 0.525s ease-in-out infinite;
  }
  .leg-back {
    transform-box: fill-box;
    transform-origin: top center;
    animation: pedal-back 0.525s ease-in-out infinite;
  }
  @keyframes pedal-front {
    0%, 100% { transform: rotate(-14deg); }
    50%      { transform: rotate(16deg); }
  }
  @keyframes pedal-back {
    0%, 100% { transform: rotate(16deg); }
    50%      { transform: rotate(-14deg); }
  }

  /* ---------- 喙里的喉囊轻微晃动 ---------- */
  .pouch {
    transform-box: fill-box;
    transform-origin: top center;
    animation: jiggle 1.05s ease-in-out infinite;
  }
  @keyframes jiggle {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    50%      { transform: scaleY(1.09) scaleX(1.02); }
  }

  /* ---------- 眼睛眨眼 ---------- */
  .eye-lid {
    animation: blink 4.2s infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    94%, 96%      { transform: scaleY(1); }
  }

  /* ---------- 头颈小幅点头 ---------- */
  .neck-head {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: nod 1.32s ease-in-out infinite;
  }
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-3deg); }
  }

  /* ---------- 背景云朵漂移 ---------- */
  .cloud-drift-1 { animation: drift 26s linear infinite; }
  .cloud-drift-2 { animation: drift 38s linear infinite; }
  .cloud-drift-3 { animation: drift 19s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-340px); }
  }

  /* ---------- 地面滚动纹理 ---------- */
  .road-dash { animation: road 0.45s linear infinite; }
  @keyframes road {
    from { transform: translateX(0); }
    to   { transform: translateX(-60px); }
  }

  /* ---------- 速度线 ---------- */
  .speedline { animation: zoom 0.9s linear infinite; }
  .speedline:nth-child(2) { animation-delay: 0.3s; }
  .speedline:nth-child(3) { animation-delay: 0.6s; }
  @keyframes zoom {
    0%   { transform: translateX(40px); opacity: 0; }
    30%  { opacity: 0.75; }
    100% { transform: translateX(-180px); opacity: 0; }
  }

  /* ---------- 太阳光照旋转 ---------- */
  .sun-rays {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 24s linear infinite;
  }

  /* 尊重减少动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 6s !important; animation-iteration-count: infinite !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="一只鹈鹕骑着自行车前进的动画">
    <defs>
      <!-- 天空渐变 -->
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--sky-top)"/>
        <stop offset="100%" stop-color="var(--sky-bottom)"/>
      </linearGradient>
      <!-- 地面渐变 -->
      <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--ground)"/>
        <stop offset="100%" stop-color="var(--ground-dark)"/>
      </linearGradient>
      <!-- 鹈鹕身体渐变 -->
      <linearGradient id="pelicanBody" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="55%" stop-color="#f2f5f8"/>
        <stop offset="100%" stop-color="#cfd8e3"/>
      </linearGradient>
      <!-- 喙部渐变 -->
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.6">
        <stop offset="0%" stop-color="#ffd66b"/>
        <stop offset="100%" stop-color="#f0a52a"/>
      </linearGradient>
      <!-- 喉囊渐变 -->
      <linearGradient id="pouchGrad" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#ffcf87"/>
        <stop offset="100%" stop-color="#f4a441"/>
      </linearGradient>
      <!-- 车架金属渐变 -->
      <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff5f6d"/>
        <stop offset="100%" stop-color="#c62b3c"/>
      </linearGradient>
      <!-- 太阳光晕 -->
      <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#fff8c9" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#fff8c9" stop-opacity="0"/>
      </radialGradient>
      <!-- 地面阴影 -->
      <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0%" stop-color="#000" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- ================= 背景：天空 ================= -->
    <rect x="0" y="0" width="900" height="430" fill="url(#sky)"/>

    <!-- 太阳 -->
    <g transform="translate(760, 92)">
      <circle r="86" fill="url(#sunGlow)"/>
      <g class="sun-rays" fill="#ffe98a" opacity="0.75">
        <rect x="-3" y="-72" width="6" height="22" rx="3"/>
        <rect x="-3" y="-72" width="6" height="22" rx="3" transform="rotate(45)"/>
        <rect x="-3" y="-72" width="6" height="22" rx="3" transform="rotate(90)"/>
        <rect x="-3" y="-72" width="6" height="22" rx="3" transform="rotate(135)"/>
        <rect x="-3" y="-72" width="6" height="22" rx="3" transform="rotate(180)"/>
        <rect x="-3" y="-72" width="6" height="22" rx="3" transform="rotate(225)"/>
        <rect x="-3" y="-72" width="6" height="22" rx="3" transform="rotate(270)"/>
        <rect x="-3" y="-72" width="6" height="22" rx="3" transform="rotate(315)"/>
      </g>
      <circle r="36" fill="#ffd93b"/>
      <circle r="36" fill="#fff3a8" opacity="0.45"/>
    </g>

    <!-- 云朵 -->
    <g class="cloud-drift-1" fill="#ffffff" opacity="0.92">
      <g transform="translate(120, 110)">
        <ellipse cx="0" cy="0" rx="46" ry="26"/>
        <ellipse cx="42" cy="8" rx="36" ry="20"/>
        <ellipse cx="-40" cy="10" rx="30" ry="17"/>
        <ellipse cx="10" cy="-18" rx="30" ry="20"/>
      </g>
    </g>
    <g class="cloud-drift-2" fill="#ffffff" opacity="0.8">
      <g transform="translate(520, 70)">
        <ellipse cx="0" cy="0" rx="38" ry="21"/>
        <ellipse cx="34" cy="6" rx="28" ry="16"/>
        <ellipse cx="-32" cy="8" rx="24" ry="14"/>
      </g>
    </g>
    <g class="cloud-drift-3" fill="#ffffff" opacity="0.72">
      <g transform="translate(300, 190)">
        <ellipse cx="0" cy="0" rx="30" ry="16"/>
        <ellipse cx="26" cy="5" rx="22" ry="13"/>
        <ellipse cx="-24" cy="6" rx="18" ry="11"/>
      </g>
    </g>

    <!-- 远山 -->
    <path d="M0 430 L0 360 L120 300 L240 372 L360 292 L500 370 L620 305 L760 372 L900 320 L900 430 Z"
          fill="#9fd9b8" opacity="0.75"/>
    <path d="M0 430 L0 392 L150 340 L300 398 L430 344 L580 400 L720 350 L900 398 L900 430 Z"
          fill="#7fc99c" opacity="0.85"/>

    <!-- 地面 -->
    <rect x="0" y="430" width="900" height="170" fill="url(#groundGrad)"/>
    <!-- 路面 -->
    <rect x="0" y="470" width="900" height="70" fill="#4b4f57"/>
    <rect x="0" y="470" width="900" height="8" fill="#5d626b"/>
    <!-- 路面虚线（滚动） -->
    <g class="road-dash" fill="#f4c542" opacity="0.9">
      <rect x="0" y="502" width="34" height="7" rx="3"/>
      <rect x="60" y="502" width="34" height="7" rx="3"/>
      <rect x="120" y="502" width="34" height="7" rx="3"/>
      <rect x="180" y="502" width="34" height="7" rx="3"/>
      <rect x="240" y="502" width="34" height="7" rx="3"/>
      <rect x="300" y="502" width="34" height="7" rx="3"/>
      <rect x="360" y="502" width="34" height="7" rx="3"/>
      <rect x="420" y="502" width="34" height="7" rx="3"/>
      <rect x="480" y="502" width="34" height="7" rx="3"/>
      <rect x="540" y="502" width="34" height="7" rx="3"/>
      <rect x="600" y="502" width="34" height="7" rx="3"/>
      <rect x="660" y="502" width="34" height="7" rx="3"/>
      <rect x="720" y="502" width="34" height="7" rx="3"/>
      <rect x="780" y="502" width="34" height="7" rx="3"/>
      <rect x="840" y="502" width="34" height="7" rx="3"/>
      <rect x="900" y="502" width="34" height="7" rx="3"/>
      <rect x="960" y="502" width="34" height="7" rx="3"/>
    </g>
    <!-- 草地小簇 -->
    <g fill="#5fae55" opacity="0.85">
      <path d="M40 470 q6 -16 12 0 z"/>
      <path d="M150 470 q5 -13 10 0 z"/>
      <path d="M690 470 q6 -15 12 0 z"/>
      <path d="M820 470 q5 -12 10 0 z"/>
    </g>

    <!-- ================= 速度线 ================= -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-width="4" opacity="0.85">
      <line class="speedline" x1="700" y1="250" x2="780" y2="250"/>
      <line class="speedline" x1="720" y1="300" x2="790" y2="300"/>
      <line class="speedline" x1="690" y1="350" x2="760" y2="350"/>
    </g>

    <!-- ================= 地面阴影 ================= -->
    <ellipse cx="440" cy="470" rx="215" ry="17" fill="url(#shadowGrad)"/>

    <!-- ================= 自行车 + 鹈鹕 ================= -->
    <g class="bike-and-bird">

      <!-- ---------- 后轮 ---------- -->
      <g>
        <circle cx="300" cy="452" r="62" fill="none" stroke="#2b2f36" stroke-width="11"/>
        <circle cx="300" cy="452" r="56" fill="none" stroke="#c8ccd3" stroke-width="4"/>
        <g class="wheel">
          <circle cx="300" cy="452" r="52" fill="none" stroke="#9aa1ac" stroke-width="2.5"/>
          <g stroke="#b7bcc5" stroke-width="2.5">
            <line x1="300" y1="400" x2="300" y2="504"/>
            <line x1="248" y1="452" x2="352" y2="452"/>
            <line x1="263" y1="415" x2="337" y2="489"/>
            <line x1="337" y1="415" x2="263" y2="489"/>
            <line x1="252" y1="430" x2="348" y2="474"/>
            <line x1="348" y1="430" x2="252" y2="474"/>
          </g>
        </g>
        <circle cx="300" cy="452" r="9" fill="#3a3f47"/>
        <circle cx="300" cy="452" r="4" fill="#dfe3e8"/>
      </g>

      <!-- ---------- 前轮 ---------- -->
      <g>
        <circle cx="620" cy="452" r="62" fill="none" stroke="#2b2f36" stroke-width="11"/>
        <circle cx="620" cy="452" r="56" fill="none" stroke="#c8ccd3" stroke-width="4"/>
        <g class="wheel">
          <circle cx="620" cy="452" r="52" fill="none" stroke="#9aa1ac" stroke-width="2.5"/>
          <g stroke="#b7bcc5" stroke-width="2.5">
            <line x1="620" y1="400" x2="620" y2="504"/>
            <line x1="568" y1="452" x2="672" y2="452"/>
            <line x1="583" y1="415" x2="657" y2="489"/>
            <line x1="657" y1="415" x2="583" y2="489"/>
            <line x1="572" y1="430" x2="668" y2="474"/>
            <line x1="668" y1="430" x2="572" y2="474"/>
          </g>
        </g>
        <circle cx="620" cy="452" r="9" fill="#3a3f47"/>
        <circle cx="620" cy="452" r="4" fill="#dfe3e8"/>
      </g>

      <!-- ---------- 车架 ---------- -->
      <g stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" fill="none">
        <!-- 下管 -->
        <line x1="300" y1="452" x2="452" y2="452"/>
        <!-- 座管 -->
        <line x1="368" y1="378" x2="300" y2="452"/>
        <!-- 上管 -->
        <line x1="368" y1="378" x2="540" y2="386"/>
        <!-- 头管 / 前叉 -->
        <line x1="540" y1="386" x2="620" y2="452"/>
        <!-- 后上叉 -->
        <line x1="368" y1="378" x2="300" y2="452"/>
      </g>
      <!-- 前叉（银灰） -->
      <line x1="540" y1="386" x2="620" y2="452" stroke="#b9c0c9" stroke-width="9" stroke-linecap="round"/>
      <!-- 五通 -->
      <circle cx="430" cy="452" r="11" fill="#3a3f47"/>
      <!-- 车把立管与车把 -->
      <line x1="540" y1="386" x2="556" y2="356" stroke="#b9c0c9" stroke-width="9" stroke-linecap="round"/>
      <path d="M534 352 q22 -14 44 -2" stroke="#2b2f36" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- 车座 -->
      <path d="M352 372 q20 -14 44 -3 q-22 16 -44 3 z" fill="#2b2f36"/>
      <!-- 座管弹簧 -->
      <path d="M368 378 l0 -8" stroke="#8b939e" stroke-width="6" stroke-linecap="round"/>

      <!-- ---------- 曲柄与踏板 ---------- -->
      <g class="crank">
        <g transform="translate(430, 452)">
          <line x1="0" y1="0" x2="0" y2="-30" stroke="#5a626d" stroke-width="7" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="30" stroke="#5a626d" stroke-width="7" stroke-linecap="round"/>
          <rect x="-12" y="-40" width="24" height="11" rx="4" fill="#2b2f36"/>
          <rect x="-12" y="29" width="24" height="11" rx="4" fill="#2b2f36"/>
        </g>
      </g>
      <!-- 牙盘 -->
      <circle cx="430" cy="452" r="24" fill="none" stroke="#8b939e" stroke-width="4"/>
      <circle cx="430" cy="452" r="7" fill="#3a3f47"/>
      <!-- 链条 -->
      <path d="M430 476 L300 452 M430 428 L300 452" stroke="#6d747e" stroke-width="4" fill="none"/>

      <!-- ================= 鹈鹕 ================= -->
      <g class="pelican-body" transform="translate(430, 300)">

        <!-- 尾羽 -->
        <path d="M-58 24 q-52 -2 -82 -26 q40 4 62 12 q-44 -6 -70 2 q36 8 66 18 q-30 4 -50 16 q40 2 74 -8 z"
              fill="#e3e9f0" stroke="#c3ccd8" stroke-width="2"/>

        <!-- 腿（后腿，先画） -->
        <g class="leg-back">
          <path d="M-6 62 q10 30 24 48" stroke="#f0a52a" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M18 110 q10 6 20 2" stroke="#f0a52a" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M18 110 q10 10 24 12" stroke="#f0a52a" stroke-width="7" fill="none" stroke-linecap="round"/>
        </g>

        <!-- 身体 -->
        <ellipse cx="-6" cy="26" rx="76" ry="54" fill="url(#pelicanBody)" stroke="#c3ccd8" stroke-width="2.5"/>
        <!-- 身体阴影 -->
        <path d="M-60 44 q30 30 92 16 q-16 22 -52 22 q-34 0 -40 -38 z" fill="#c9d3df" opacity="0.55"/>

        <!-- 翅膀 -->
        <g class="wing">
          <path d="M-24 6 q44 -30 92 -18 q-6 34 -38 52 q-32 16 -58 -6 q-8 -16 4 -28 z"
                fill="#eef2f7" stroke="#c3ccd8" stroke-width="2.5"/>
          <!-- 羽毛分层 -->
          <path d="M-14 16 q34 -14 64 -8" stroke="#c3ccd8" stroke-width="2" fill="none"/>
          <path d="M-8 30 q30 -10 56 -4" stroke="#c3ccd8" stroke-width="2" fill="none"/>
          <path d="M0 44 q24 -8 44 -2" stroke="#c3ccd8" stroke-width="2" fill="none"/>
          <!-- 翼尖深色羽毛 -->
          <path d="M20 40 q22 -6 42 -2 q-16 14 -42 2 z" fill="#5b6773" opacity="0.8"/>
        </g>

        <!-- 腿（前腿，后画，位于车架前） -->
        <g class="leg-front">
          <path d="M-14 60 q-2 32 8 56" stroke="#ffbe3d" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M-6 116 q10 8 22 6" stroke="#ffbe3d" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M-6 116 q12 12 26 12" stroke="#ffbe3d" stroke-width="7" fill="none" stroke-linecap="round"/>
        </g>

        <!-- ---------- 颈 + 头 ---------- -->
        <g class="neck-head" transform="translate(46, -18)">
          <!-- 颈部 -->
          <path d="M-14 52 q-6 -48 8 -78 q10 -22 30 -22 q16 0 20 14 q-16 6 -22 26 q-6 22 -2 58 z"
                fill="url(#pelicanBody)" stroke="#c3ccd8" stroke-width="2.5"/>

          <!-- 头 -->
          <ellipse cx="26" cy="-58" rx="34" ry="29" fill="url(#pelicanBody)" stroke="#c3ccd8" stroke-width="2.5"/>
          <!-- 头顶羽冠 -->
          <path d="M2 -78 q-10 -20 -30 -24 q16 12 18 26 z" fill="#e3e9f0" stroke="#c3ccd8" stroke-width="2"/>

          <!-- ---------- 喙 ---------- -->
          <g transform="translate(52, -58)">
            <!-- 上喙 -->
            <path d="M0 -10 q42 -12 76 -2 q6 2 4 8 q-2 6 -12 6 q-30 2 -68 4 q-4 -8 0 -16 z"
                  fill="url(#beakGrad)" stroke="#d98f1e" stroke-width="2"/>
            <!-- 喙尖钩 -->
            <path d="M76 -8 q8 2 6 10 q-4 -2 -8 -2 z" fill="#d98f1e"/>
            <!-- 喉囊 -->
            <path class="pouch" d="M6 8 q10 34 40 38 q28 2 34 -34 q-38 6 -74 -4 z"
                  fill="url(#pouchGrad)" stroke="#d98f1e" stroke-width="2"/>
            <path d="M20 20 q24 8 46 -2" stroke="#e0a63c" stroke-width="1.6" fill="none" opacity="0.8"/>
            <!-- 喙缝 -->
            <path d="M2 6 q38 8 74 -2" stroke="#c07a12" stroke-width="2" fill="none"/>
          </g>

          <!-- 眼睛 -->
          <g transform="translate(34, -66)">
            <circle r="9" fill="#ffffff" stroke="#b8c2cf" stroke-width="1.5"/>
            <circle r="5.4" fill="#2b2f36"/>
            <circle r="1.8" fill="#ffffff" cx="1.8" cy="-1.8"/>
            <!-- 眼皮（眨眼） -->
            <ellipse class="eye-lid" cx="0" cy="0" rx="9.5" ry="9.5" fill="#eef2f7" stroke="#c3ccd8" stroke-width="1.5"/>
          </g>

          <!-- 腮红 -->
          <ellipse cx="14" cy="-46" rx="8" ry="5" fill="#ffb3b3" opacity="0.65"/>
        </g>

        <!-- 车把上的"手"（翅尖搭在车把） -->
        <path d="M56 6 q34 20 74 40" stroke="#c3ccd8" stroke-width="2" fill="none" opacity="0.4"/>
      </g>

      <!-- 鹈鹕翅尖抓握车把 -->
      <g transform="translate(556, 358)">
        <ellipse rx="14" ry="9" fill="#eef2f7" stroke="#c3ccd8" stroke-width="2.5" transform="rotate(-14)"/>
      </g>

    </g>
  </svg>
