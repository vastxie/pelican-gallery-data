<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕的骑行日</title>
  <style>
    :root { color-scheme: light; --ink:#173348; --cream:#fff6dd; --coral:#ef6b55; --sky:#bfe8ec; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; background: #dceff0; font-family: ui-rounded, "PingFang SC", system-ui, sans-serif;
    }
    .stage { position: relative; width: min(100vw, 1280px); aspect-ratio: 16/10; overflow: hidden; background: var(--sky); }
    svg { display: block; width: 100%; height: 100%; }
    .title { position: absolute; inset: 5% auto auto 6%; color: var(--ink); pointer-events: none; }
    .title h1 { margin: 0; font-size: clamp(24px, 4vw, 58px); letter-spacing: -.05em; line-height: .95; }
    .title p { margin: .6em 0 0; font-size: clamp(11px, 1.15vw, 16px); letter-spacing: .2em; opacity: .65; }
    button {
      position: absolute; right: 4%; top: 5%; border: 1.5px solid var(--ink); border-radius: 999px;
      padding: .65em 1em; color: var(--ink); background: rgba(255,246,221,.72); font: inherit; font-weight: 700;
      cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    .clouds { animation: drift 22s linear infinite; }
    .far { animation: slide 18s linear infinite; }
    .roadmarks { animation: road 1.6s linear infinite; }
    .rider { transform-origin: 640px 455px; animation: bob .75s ease-in-out infinite alternate; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.25s linear infinite; }
    .pedal { transform-origin: 640px 507px; animation: spin 1.25s linear infinite; }
    .leg-back { transform-origin: 632px 420px; animation: legBack 1.25s ease-in-out infinite; }
    .leg-front { transform-origin: 632px 420px; animation: legFront 1.25s ease-in-out infinite; }
    .scarf { transform-origin: 568px 306px; animation: scarf .55s ease-in-out infinite alternate; }
    .wing { transform-origin: 614px 355px; animation: wing .75s ease-in-out infinite alternate; }
    .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin:center; }
    .paused * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-.4deg); } }
    @keyframes drift { to { transform: translateX(430px); } }
    @keyframes slide { to { transform: translateX(-400px); } }
    @keyframes road { to { transform: translateX(-180px); } }
    @keyframes scarf { to { transform: rotate(8deg) scaleX(1.06); } }
    @keyframes wing { to { transform: rotate(-10deg); } }
    @keyframes legBack { 0%,100% { transform: rotate(25deg); } 50% { transform: rotate(-22deg); } }
    @keyframes legFront { 0%,100% { transform: rotate(-22deg); } 50% { transform: rotate(25deg); } }
    @keyframes blink { 0%,46%,50%,100% { transform:scaleY(1); } 48% { transform:scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="一只鹈鹕骑着红色自行车穿过海边的动画">
    <div class="title"><h1>慢慢骑，<br>风会等你。</h1><p>PELICAN CYCLING CLUB</p></div>
    <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
    <svg viewBox="0 0 1280 800" role="img" aria-labelledby="svgTitle svgDesc">
      <title id="svgTitle">鹈鹕骑自行车</title>
      <desc id="svgDesc">戴着小帽子的鹈鹕骑红色自行车经过海边，车轮、双腿、围巾和背景都在运动。</desc>
      <defs>
        <clipPath id="scene"><rect width="1280" height="800"/></clipPath>
        <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="#173348" opacity=".08"/></pattern>
      </defs>
      <g clip-path="url(#scene)">
        <rect width="1280" height="800" fill="#bfe8ec"/>
        <circle cx="1034" cy="137" r="66" fill="#ffdc72"/>
        <circle cx="1034" cy="137" r="88" fill="none" stroke="#ffdc72" stroke-width="2" opacity=".45"/>
        <g class="clouds" fill="#fff6dd" opacity=".9">
          <path d="M-190 205c14-37 63-42 84-12 14-43 77-42 88 4 42-9 63 45 23 61h-190c-35-7-39-44-5-53Z"/>
          <path d="M705 105c10-27 45-31 61-9 10-32 56-31 64 3 31-7 46 33 17 44H708c-25-5-29-32-3-38Z"/>
        </g>
        <path d="M0 415Q160 338 318 408T630 397T940 385T1280 398V576H0Z" fill="#76c6bd"/>
        <g class="far">
          <path d="M-300 480q95-110 190 0 95-120 190 0 95-103 190 0 95-122 190 0 95-105 190 0 95-118 190 0 95-106 190 0 95-120 190 0 95-108 190 0 95-116 190 0V590H-300Z" fill="#3b8f83" opacity=".7"/>
          <g fill="#fff6dd"><path d="M100 406l25-90 25 90Z"/><rect x="121" y="350" width="8" height="67"/><path d="M1120 418l27-98 28 98Z"/><rect x="1143" y="360" width="8" height="68"/></g>
        </g>
        <rect y="548" width="1280" height="252" fill="#f2ca83"/>
        <rect y="548" width="1280" height="252" fill="url(#dots)"/>
        <path d="M0 590C260 565 413 611 680 585s407 23 600-3v218H0Z" fill="#d99f67"/>
        <g class="roadmarks" stroke="#fff6dd" stroke-width="9" stroke-linecap="round" opacity=".75">
          <path d="M-120 705h105M60 705h105M240 705h105M420 705h105M600 705h105M780 705h105M960 705h105M1140 705h105M1320 705h105"/>
        </g>
        <ellipse cx="650" cy="673" rx="290" ry="28" fill="#173348" opacity=".16" filter="url(#soft)"/>

        <g class="rider" stroke="#173348" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <!-- bicycle wheels -->
          <g class="wheel">
            <circle cx="472" cy="596" r="119" fill="#fff6dd" stroke-width="11"/>
            <circle cx="472" cy="596" r="105" fill="none" stroke-width="3"/>
            <g stroke-width="3"><path d="M472 491v210M367 596h210M398 522l148 148M398 670l148-148"/></g>
            <circle cx="472" cy="596" r="10" fill="#ef6b55"/>
          </g>
          <g class="wheel">
            <circle cx="820" cy="596" r="119" fill="#fff6dd" stroke-width="11"/>
            <circle cx="820" cy="596" r="105" fill="none" stroke-width="3"/>
            <g stroke-width="3"><path d="M820 491v210M715 596h210M746 522l148 148M746 670l148-148"/></g>
            <circle cx="820" cy="596" r="10" fill="#ef6b55"/>
          </g>
          <!-- bicycle frame -->
          <g fill="none" stroke="#ef6b55" stroke-width="14">
            <path d="M472 596l105-166 70 166H472l213-112 135 112"/>
            <path d="M647 596l-70-166M685 484l-18-65"/>
          </g>
          <path d="M648 414h70" stroke="#173348" stroke-width="13"/>
          <path d="M548 425h63" stroke="#173348" stroke-width="16"/>
          <path d="M682 479l61-11" fill="none"/>
          <path d="M738 468l38 12" fill="none"/>
          <g class="pedal"><circle cx="647" cy="596" r="14" fill="#ffdc72"/><path d="M647 596l42 22M647 596l-42-22"/><circle cx="692" cy="620" r="8" fill="#173348" stroke="none"/><circle cx="602" cy="572" r="8" fill="#173348" stroke="none"/></g>

          <!-- pelican legs behind body -->
          <g class="leg-back" fill="none" stroke="#e7a14b" stroke-width="25"><path d="M625 414q-13 83 22 126l45 78"/><path d="M679 621h39" stroke-width="16"/></g>
          <g class="leg-front" fill="none" stroke="#ffc85f" stroke-width="27"><path d="M649 414q39 76 1 132l-48 29"/><path d="M588 579h39" stroke-width="16"/></g>

          <!-- scarf behind neck -->
          <g class="scarf" stroke-width="5"><path d="M578 301q-67-6-125 28 45 1 55 22-40 15-53 49 75-16 130-67Z" fill="#ef6b55"/><path d="M481 337l-28-8"/></g>
          <!-- pelican body -->
          <path d="M604 278q65-35 111 12 35 37 7 92-20 41-16 91-57 19-128-2 36-54 5-104-23-37 21-89Z" fill="#fff6dd"/>
          <path d="M599 285q-2-80 58-112 49-27 93 8 31 25 13 73-20 55-71 71Z" fill="#fff6dd"/>
          <!-- bill -->
          <path d="M718 225q84-19 180 12-100 68-199 16Z" fill="#ffc85f"/>
          <path d="M708 253q85 8 190-16-57 58-164 51Z" fill="#ef9d45" stroke-width="5"/>
          <circle class="eye" cx="711" cy="211" r="10" fill="#173348" stroke="none"/>
          <circle cx="714" cy="208" r="3" fill="#fff" stroke="none"/>
          <!-- cap -->
          <path d="M625 180q32-68 101-30l8 35Z" fill="#ef6b55"/>
          <path d="M721 181q38-9 67 9-40 17-81 6Z" fill="#ef6b55"/>
          <path d="M650 148q6-32 25-42" fill="none" stroke-width="5"/>
          <circle cx="677" cy="104" r="12" fill="#ffdc72"/>
          <!-- wing and handlebar arm -->
          <g class="wing"><path d="M610 340q-55 30-25 93 30 37 75-3 25-30 13-84Z" fill="#f2dfb7"/><path d="M642 373q45 15 90 73" fill="none" stroke="#f2dfb7" stroke-width="24"/><circle cx="739" cy="454" r="15" fill="#ffc85f"/></g>
          <path d="M578 468q52 18 128 5" fill="none" stroke="#ef6b55" stroke-width="8" opacity=".5"/>
        </g>
        <g fill="#173348" opacity=".6"><path d="M1060 510q13-45 27 0Z"/><path d="M1090 516q16-57 31 0Z"/><path d="M180 535q14-48 28 0Z"/></g>
      </g>
    </svg>
  </main>
  <script>
    const stage = document.querySelector('#stage');
    const toggle = document.querySelector('#toggle');
    toggle.addEventListener('click', () => {
      const paused = stage.classList.toggle('paused');
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    });
  </script>
</body>
</html>
