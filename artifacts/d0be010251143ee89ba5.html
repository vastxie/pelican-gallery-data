<div class="controls">
<div class="left-controls"><button id="toggle" aria-pressed="false"><span id="playIcon" aria-hidden="true">Ⅱ</span><span id="playText">暂停骑行</span></button><button id="ring" aria-label="按响自行车车铃"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 13V9a6 6 0 0 1 12 0v4l2 2H2l2-2ZM8 18h4M10 1V0"/></svg>叮铃</button></div>
<label class="speed" for="speed">骑行速度<input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speedOut" for="speed">1.00×</output></label>

</div>
<footer><span>沿途的风景，比目的地更有趣。</span><span>SVG 手绘动画 · 可离线播放</span></footer>
</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let paused = reducedMotion.matches, speed = 1, elapsed = 0, previous = null, ringUntil = 0, toastTimer, audioContext;
function updateButton(){ $('toggle').setAttribute('aria-pressed', String(paused)); $('playIcon').textContent = paused ? '▶' : 'Ⅱ'; $('playText').textContent = paused ? '继续骑行' : '暂停骑行'; }
function toggle(){paused=!paused; updateButton();}
$('toggle').addEventListener('click',toggle);
$('speed').addEventListener('input',e=>{speed=Number(e.target.value);$('speedOut').value=speed.toFixed(2)+'×';});
function ring(){
 ringUntil=performance.now()+1000;
 $('toast').textContent='叮铃～ 海风让个路！';$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1600);
 try {const Audio = window.AudioContext || window.webkitAudioContext;if(!Audio)return;audioContext ||= new Audio();audioContext.resume();[0,.13].forEach(delay=>{const gain=audioContext.createGain();gain.connect(audioContext.destination);const at=audioContext.currentTime+delay;gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.1,at+.006);gain.gain.exponentialRampToValueAtTime(.0001,at+.7);[1650,2420].forEach(f=>{const osc=audioContext.createOscillator();osc.type='sine';osc.frequency.value=f;osc.connect(gain);osc.start(at);osc.stop(at+.72);});});}catch(e){/* Visual bell remains available without audio. */}
}
$('ring').addEventListener('click',ring);
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|BUTTON/.test(e.target.tagName)){e.preventDefault();toggle();}});
reducedMotion.addEventListener('change',e=>{if(e.matches){paused=true;updateButton();}});
function leg(prefix,angle,bounce){
 const x=560+31*Math.cos(angle), y=460+31*Math.sin(angle), hipX=510, hipY=350+bounce;
 const dx=x-hipX,dy=y-hipY,d=Math.hypot(dx,dy),length=76;
 const h=Math.sqrt(Math.max(0,length*length-d*d/4));
 const kx=(hipX+x)/2-h*dy/d, ky=(hipY+y)/2+h*dx/d;
 $(prefix+'Leg').setAttribute('d',`M${hipX} ${hipY}L${kx} ${ky}L${x} ${y}`);
 $(prefix+'Foot').setAttribute('d',`M${x-9} ${y}Q${x+8} ${y+7} ${x+19} ${y+1}`);
 $(prefix+'Pedal').setAttribute('d',`M${x-10} ${y+5}H${x+15}`);
}
function draw(now){
 const phase=elapsed*3.5, degrees=phase*180/Math.PI, bounce=Math.sin(phase*2)*2.2;
 $('rearSpokes').setAttribute('transform',`rotate(${degrees*(148 / 83 / 3.5)})`);$('frontSpokes').setAttribute('transform',`rotate(${degrees*(148 / 83 / 3.5)})`);
 $('crank').setAttribute('transform',`translate(560 460) rotate(${degrees})`);
 $('bird').setAttribute('transform',`translate(0 ${bounce})`);
 leg('far',phase+Math.PI,bounce);leg('near',phase,bounce);
 const flutter=Math.sin(elapsed*6)*5;
 $('scarfTail').setAttribute('d',`M552 253Q510 ${237+flutter} 459 ${252+flutter}L477 ${263+flutter}Q508 ${259+flutter} 551 270Z`);
 $('clouds').setAttribute('transform',`translate(${-elapsed*10%1100} 0)`);
 $('coast').setAttribute('transform',`translate(${-elapsed*32%1100} 0)`);
 $('foreground').setAttribute('transform',`translate(${-elapsed*148%1100} 0)`);
 $('roadMarks').setAttribute('patternTransform',`translate(${-elapsed*148%185} 0)`);
 $('waves').setAttribute('patternTransform',`translate(${-elapsed*18%180} 0)`);
 $('sailboat').setAttribute('transform',`translate(${906-Math.sin(elapsed*.15)*24} ${368+Math.sin(elapsed)*1.8})`);
 $('eye').setAttribute('ry',elapsed%5.4>5.23 ? 0.8 : 5.2);
 $('distance').textContent=Math.floor(elapsed*3.2);
 $('bellRings').setAttribute('opacity',now<ringUntil ? .5+.5*Math.sin(now*.025) : 0);
}
function tick(now){if(previous!==null&&!paused)elapsed+=Math.min((now-previous)/1000,.05)*speed;previous=now;draw(now);requestAnimationFrame(tick);}
updateButton();requestAnimationFrame(tick);
})();
</script>
