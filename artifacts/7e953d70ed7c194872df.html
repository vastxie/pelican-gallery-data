<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      background: #e8eef4;
      color: #1f2937;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .stage {
      width: min(960px, 100%);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.18);
    }
    svg { display: block; width: 100%; height: auto; }
    .controls { display: flex; align-items: center; gap: 16px; font-size: 14px; }
    button {
      font: inherit;
      padding: 6px 18px;
      border: 1px solid #94a3b8;
      border-radius: 999px;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
    }
    button:hover { background: #f1f5f9; }
    input[type="range"] { width: 200px; accent-color: #2563eb; }
  </style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>

  <div class="stage">
    <svg viewBox="0 0 800 500" role="img" aria-labelledby="pelican-title">
      <title id="pelican-title">一只鹈鹕骑着自行车的 2D 动画</title>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6cc0ff"/>
          <stop offset="1" stop-color="#d8f1ff"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#d5dfe9"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0.5" stop-color="#ffe066"/>
          <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
        </radialGradient>

        <!-- 可复用图形；远山、灌木都以 800 为周期，便于无缝滚动 -->
        <g id="cloud" fill="#ffffff" opacity="0.92">
          <ellipse cx="0" cy="0" rx="34" ry="16"/>
          <ellipse cx="22" cy="-10" rx="26" ry="20"/>
          <ellipse cx="-20" cy="-6" rx="22" ry="16"/>
        </g>
        <g id="farHills" fill="#a8dfc0">
          <path d="M0 300 C100 230 200 230 300 300 C400 240 500 240 600 300 C680 250 740 252 800 300 V420 H0 Z"/>
        </g>
        <g id="nearHills" fill="#86cf9e">
          <path d="M0 340 C120 290 240 300 360 340 C480 300 600 296 720 340 C760 352 780 350 800 340 V420 H0 Z"/>
        </g>
        <g id="bushes" fill="#5bb06a">
          <circle cx="44" cy="404" r="16"/><circle cx="60" cy="394" r="22"/><circle cx="76" cy="404" r="16"/>
          <circle cx="184" cy="404" r="16"/><circle cx="200" cy="394" r="22"/><circle cx="216" cy="404" r="16"/>
          <circle cx="314" cy="404" r="16"/><circle cx="330" cy="394" r="22"/><circle cx="346" cy="404" r="16"/>
          <circle cx="454" cy="404" r="16"/><circle cx="470" cy="394" r="22"/><circle cx="486" cy="404" r="16"/>
          <circle cx="584" cy="404" r="16"/><circle cx="600" cy="394" r="22"/><circle cx="616" cy="404" r="16"/>
          <circle cx="724" cy="404" r="16"/><circle cx="740" cy="394" r="22"/><circle cx="756" cy="404" r="16"/>
        </g>
        <!-- 脚掌（webbed foot），原点在脚踝，脚趾朝前 -->
        <path id="foot" d="M-2 -6 C8 -8 18 -8 25 -3 C28 0 29 5 26 8 C21 12 12 12 6 10 C0 8 -3 2 -2 -6 Z"/>
      </defs>

      <!-- 天空与太阳 -->
      <rect width="800" height="420" fill="url(#sky)"/>
      <g transform="translate(690 86)">
        <circle r="56" fill="url(#sunGlow)"/>
        <circle r="30" fill="#ffd23f"/>
        <g id="sunRays" stroke="#ffd23f" stroke-width="5" stroke-linecap="round">
          <path d="M0 -42V-54M0 42V54M-42 0H-54M42 0H54M30 -30L39 -39M-30 30L-39 39M30 30L39 39M-30 -30L-39 -39"/>
        </g>
      </g>

      <!-- 云（最慢） -->
      <use id="cloud1" href="#cloud" y="62"/>
      <use id="cloud2" href="#cloud" y="112"/>
      <use id="cloud3" href="#cloud" y="48"/>

      <!-- 远山、近山、灌木（速度依次加快，形成视差） -->
      <g id="farLayer"><use href="#farHills"/><use href="#farHills" x="800"/></g>
      <g id="nearLayer"><use href="#nearHills"/><use href="#nearHills" x="800"/></g>
      <g id="bushLayer"><use href="#bushes"/><use href="#bushes" x="800"/></g>

      <!-- 路面与车道虚线（虚线速度 = 车速） -->
      <rect y="420" width="800" height="80" fill="#6b7280"/>
      <rect y="420" width="800" height="5" fill="#9ca3af"/>
      <g id="dashes" fill="#e5e7eb" opacity="0.85"></g>
      <ellipse cx="390" cy="424" rx="200" ry="8" fill="#111827" opacity="0.18"/>

      <!-- 远侧：曲柄、踏板、腿（在车架后面） -->
      <g stroke="#4b5563" stroke-width="6" stroke-linecap="round">
        <line id="crankFar" x1="330" y1="362" x2="330" y2="326"/>
        <line id="crankNear" x1="330" y1="362" x2="330" y2="398"/>
      </g>
      <rect id="pedalFar" x="-11" y="-2.5" width="22" height="5" rx="2.5" fill="#111827"/>
      <g id="legFar">
        <polyline stroke="#2b2d42" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline stroke="#c2631a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="foot"><use href="#foot" fill="#c2631a" stroke="#2b2d42" stroke-width="2" stroke-linejoin="round"/></g>
      </g>

      <!-- 车轮（辐条会旋转） -->
      <g id="rearWheel" transform="translate(250 350)"></g>
      <g id="frontWheel" transform="translate(500 350)"></g>

      <!-- 车架 -->
      <g fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round">
        <path d="M250 350 L330 362" stroke-width="7"/>
        <path d="M250 350 L300 262" stroke-width="7"/>
        <path d="M330 362 L300 262" stroke-width="8"/>
        <path d="M300 262 L465 252" stroke-width="7"/>
        <path d="M330 362 L475 281" stroke-width="8"/>
        <path d="M475 281 L500 350" stroke-width="6"/>
        <path d="M465 252 L475 281" stroke-width="10"/>
      </g>

      <!-- 链盘、飞轮、链条 -->
      <g id="chainRing" transform="translate(330 362)"></g>
      <g id="cog" transform="translate(250 350)"></g>
      <g fill="none" stroke="#111827" stroke-width="3" stroke-dasharray="5 3">
        <path id="chainTop" d="M250 339 L330 340"/>
        <path id="chainBottom" d="M330 384 L250 361"/>
      </g>

      <!-- 座垫 -->
      <rect x="274" y="250" width="52" height="11" rx="5.5" fill="#111827"/>

      <!-- 近侧：踏板与腿（在身体前面下方） -->
      <rect id="pedalNear" x="-11" y="-2.5" width="22" height="5" rx="2.5" fill="#111827"/>
      <g id="legNear">
        <polyline stroke="#2b2d42" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline stroke="#f08a24" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="foot"><use href="#foot" fill="#f08a24" stroke="#2b2d42" stroke-width="2" stroke-linejoin="round"/></g>
      </g>

      <!-- 鹈鹕上身（会上下轻微起伏） -->
      <g id="upper">
        <!-- 尾羽 -->
        <path d="M292 232 C272 220 252 224 238 240 C256 246 276 248 294 246 Z" fill="#f1f5f9" stroke="#2b2d42" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- 脖子：先描边再填白 -->
        <path d="M392 184 C404 160 418 146 440 134" fill="none" stroke="#2b2d42" stroke-width="30" stroke-linecap="round"/>
        <path d="M392 184 C404 160 418 146 440 134" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round"/>
        <!-- 身体 -->
        <ellipse cx="343" cy="209" rx="78" ry="50" transform="rotate(-28 343 209)" fill="url(#body)" stroke="#2b2d42" stroke-width="2.5"/>
        <!-- 头与眼 -->
        <ellipse cx="446" cy="122" rx="23" ry="20" transform="rotate(-12 446 122)" fill="#ffffff" stroke="#2b2d42" stroke-width="2.5"/>
        <circle cx="447" cy="113" r="4.5" fill="#facc15" stroke="#2b2d42" stroke-width="1.5"/>
        <circle cx="447.5" cy="113" r="2.2" fill="#111827"/>
        <circle cx="448.5" cy="112" r="0.8" fill="#ffffff"/>
        <!-- 喉囊与下颌 -->
        <path d="M452 126 C484 130 512 136 540 143 C552 146 558 150 556 155 C548 156 536 152 526 150 C522 170 508 180 492 174 C478 168 468 150 458 138 Z" fill="#fcd34d" stroke="#2b2d42" stroke-width="2" stroke-linejoin="round"/>
        <!-- 上喙 -->
        <path d="M452 110 C494 110 530 120 560 132 C570 136 574 144 568 148 C558 146 548 144 536 141 C506 136 480 132 452 128 Z" fill="#f59e0b" stroke="#2b2d42" stroke-width="2" stroke-linejoin="round"/>
        <!-- 翅膀：根部在肩上，末端伸向车把（会轻微扑动） -->
        <g id="wing" transform="translate(352 178) rotate(17.6)">
          <path d="M-10 0 C-10 -12 -2 -13 6 -12 C40 -26 100 -26 140 -14 C152 -10 162 -4 170 2 C160 8 150 10 138 10 C96 18 40 18 6 12 C-2 12 -10 10 -10 0 Z" fill="#f8fafc" stroke="#2b2d42" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M98 -17 C118 -21 136 -17 152 -11 C160 -6 166 -2 170 2 C160 8 150 10 138 10 C124 9 112 8 98 5 C104 0 104 -9 98 -17 Z" fill="#94a3b8"/>
          <path d="M112 -2 L160 5 M118 3 L150 8" stroke="#2b2d42" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 车把与车头（画在翅膀末端之上，像是被抓住） -->
      <g fill="none" stroke="#374151" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M467 252 L474 226"/>
        <path d="M474 226 C488 214 508 214 516 226 C522 236 516 248 506 246"/>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="toggle" type="button">暂停</button>
    <label>速度 <input id="speed" type="range" min="60" max="800" step="10" value="400"></label>
  </div>

  <script>
    (() => {
      const WHEEL_R = 70;                   // 车轮半径
      const CRANK_R = 34;                   // 曲柄长度
      const RING_R = 22;                    // 链盘半径
      const BB = { x: 330, y: 362 };        // 中轴位置
      const HIP = { x: 300, y: 254 };       // 鹈鹕的髋部（坐在座垫上）
      const THIGH = 66, SHIN = 72;          // 大腿、小腿长度
      const $ = (id) => document.getElementById(id);
      const wrap = (v, span) => ((v % span) + span) % span;

      // n 根辐条，长度 len，以原点为圆心
      const spokes = (n, len) => {
        let d = '';
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          d += `M0 0L${(Math.cos(a) * len).toFixed(2)} ${(Math.sin(a) * len).toFixed(2)}`;
        }
        return d;
      };

      // 注入车轮、链盘、飞轮（class="spin" 的部分会随速度旋转）
      $('rearWheel').innerHTML = $('frontWheel').innerHTML = `
        <circle r="${WHEEL_R}" fill="none" stroke="#1f2937" stroke-width="9"/>
        <circle r="${WHEEL_R - 8}" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
        <path class="spin" d="${spokes(16, WHEEL_R - 10)}" stroke="#94a3b8" stroke-width="1.2"/>
        <circle r="5" fill="#475569"/>`;
      $('chainRing').innerHTML = `
        <circle r="${RING_R}" fill="none" stroke="#9ca3af" stroke-width="3"/>
        <path class="spin" d="${spokes(5, 16)}" stroke="#9ca3af" stroke-width="2"/>`;
      $('cog').innerHTML = `
        <circle r="11" fill="none" stroke="#9ca3af" stroke-width="2.5"/>
        <path class="spin" d="${spokes(5, 7)}" stroke="#9ca3af" stroke-width="1.5"/>`;
      // 车道虚线：11 段，周期 90
      $('dashes').innerHTML = Array.from({ length: 11 }, (_, i) =>
        `<rect x="${i * 90}" y="456" width="46" height="5" rx="2.5"/>`).join('');

      const spinners = document.querySelectorAll('.spin');
      const clouds = [
        { el: $('cloud1'), x0: 120, k: 0.05 },
        { el: $('cloud2'), x0: 460, k: 0.05 },
        { el: $('cloud3'), x0: 680, k: 0.05 },
      ];
      const farLayer = $('farLayer'), nearLayer = $('nearLayer'), bushLayer = $('bushLayer');
      const dashes = $('dashes'), sunRays = $('sunRays');
      const crankFar = $('crankFar'), crankNear = $('crankNear');
      const pedalFar = $('pedalFar'), pedalNear = $('pedalNear');
      const legFar = $('legFar'), legNear = $('legNear');
      const chainTop = $('chainTop'), chainBottom = $('chainBottom');
      const upper = $('upper'), wing = $('wing');

      // 两段骨骼反解：给定髋部与脚踝，求膝盖（膝盖始终朝前）
      function knee(hip, ankle) {
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const dist = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.01);
        const base = Math.atan2(dy, dx);
        const cosB = (THIGH * THIGH + dist * dist - SHIN * SHIN) / (2 * THIGH * dist);
        const beta = Math.acos(Math.min(1, Math.max(-1, cosB)));
        const a = { x: hip.x + THIGH * Math.cos(base + beta), y: hip.y + THIGH * Math.sin(base + beta) };
        const b = { x: hip.x + THIGH * Math.cos(base - beta), y: hip.y + THIGH * Math.sin(base - beta) };
        return a.x > b.x ? a : b;
      }

      function placeLeg(leg, hip, pedal) {
        const ankle = { x: pedal.x - 10, y: pedal.y - 12 };
        const k = knee(hip, ankle);
        const pts = [hip, k, ankle].map((p) => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
        leg.querySelectorAll('polyline').forEach((line) => line.setAttribute('points', pts));
        leg.querySelector('.foot').setAttribute('transform', `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)})`);
      }

      const moveTo = (el, p) => el.setAttribute('transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)})`);

      // d 为行驶距离（像素）。所有动画都由 d 推导，因此可精确复现任一帧
      function render(d) {
        // 车轮 = 链盘 = 飞轮 = 曲柄，同一角度（1:1 传动）
        const phi = d / WHEEL_R;
        const deg = (phi * 180) / Math.PI;
        spinners.forEach((s) => s.setAttribute('transform', `rotate(${deg.toFixed(2)})`));

        const chainShift = (-d * RING_R / WHEEL_R).toFixed(2);
        chainTop.setAttribute('stroke-dashoffset', chainShift);
        chainBottom.setAttribute('stroke-dashoffset', chainShift);

        // 两个踏板互差 180°
        const c = Math.cos(phi) * CRANK_R, s = Math.sin(phi) * CRANK_R;
        const near = { x: BB.x + c, y: BB.y + s };
        const far = { x: BB.x - c, y: BB.y - s };
        crankNear.setAttribute('x2', near.x.toFixed(2));
        crankNear.setAttribute('y2', near.y.toFixed(2));
        crankFar.setAttribute('x2', far.x.toFixed(2));
        crankFar.setAttribute('y2', far.y.toFixed(2));
        moveTo(pedalNear, near);
        moveTo(pedalFar, far);

        // 身体随踩踏节奏起伏，髋部跟着动，腿用反解保持脚在踏板上
        const bob = Math.sin(2 * phi) * 1.4;
        const hip = { x: HIP.x, y: HIP.y + bob };
        placeLeg(legFar, hip, far);
        placeLeg(legNear, hip, near);
        upper.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
        wing.setAttribute('transform', `translate(352 178) rotate(${(17.6 + Math.sin(2 * phi) * 1.2).toFixed(2)})`);

        // 背景视差：云 < 远山 < 灌木 < 路面
        clouds.forEach(({ el, x0, k }) => el.setAttribute('x', (wrap(x0 - d * k + 120, 1020) - 120).toFixed(2)));
        farLayer.setAttribute('transform', `translate(${(-wrap(d * 0.2, 800)).toFixed(2)} 0)`);
        nearLayer.setAttribute('transform', `translate(${(-wrap(d * 0.45, 800)).toFixed(2)} 0)`);
        bushLayer.setAttribute('transform', `translate(${(-wrap(d * 0.8, 800)).toFixed(2)} 0)`);
        dashes.setAttribute('transform', `translate(${(-wrap(d, 90)).toFixed(2)} 0)`);
        sunRays.setAttribute('transform', `rotate(${(d * 0.02).toFixed(2)})`);
      }

      const speedInput = $('speed'), toggle = $('toggle');
      let distance = 0, playing = true, last = null;

      toggle.addEventListener('click', () => {
        playing = !playing;
        toggle.textContent = playing ? '暂停' : '播放';
      });

      function frame(now) {
        const dt = last === null ? 0 : Math.min((now - last) / 1000, 0.05);
        last = now;
        if (playing) distance += Number(speedInput.value) * dt;
        render(distance);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
