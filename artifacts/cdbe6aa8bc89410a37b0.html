<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #7ec8e3 0%, #a8dda8 70%, #6bbf59 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, sans-serif;
    overflow: hidden;
  }
  .stage {
    width: 900px;
    max-width: 96vw;
    aspect-ratio: 3 / 2;
    background: linear-gradient(180deg, #cdeaf7 0%, #ffe9b0 55%, #8fd07a 55%, #4fa03a 100%);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden;
    position: relative;
  }
  h1 {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    color: #22384d;
    letter-spacing: 3px;
    font-weight: 600;
    margin: 0;
    font-size: 18px;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
    z-index: 3;
  }
  svg { display: block; width: 100%; height: 100%; }

  /* --- animations --- */
  @keyframes rollWheel { to { transform: rotate(360deg); } }
  @keyframes pedal     { to { transform: rotate(360deg); } }
  @keyframes bob       { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-3px);} }
  @keyframes legL      { 0%,100%{ transform: rotate(-25deg);} 50%{ transform: rotate(30deg);} }
  @keyframes legR      { 0%,100%{ transform: rotate(30deg);}  50%{ transform: rotate(-25deg);} }
  @keyframes beakChomp { 0%,80%,100%{ transform: rotate(0);} 88%{ transform: rotate(-10deg);} }
  @keyframes blink     { 0%,92%,100%{ transform: scaleY(1);} 96%{ transform: scaleY(0.1);} }
  @keyframes cloud     { from { transform: translateX(0);} to { transform: translateX(-1200px);} }
  @keyframes ground    { from { transform: translateX(0);} to { transform: translateX(-120px);} }

  .wheel     { animation: rollWheel .7s linear infinite; transform-origin: center; transform-box: fill-box; }
  .crank     { animation: pedal .7s linear infinite; transform-origin: center; transform-box: fill-box; }
  .rider     { animation: bob .7s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .leg-l     { animation: legL .7s linear infinite; transform-origin: top center; transform-box: fill-box; }
  .leg-r     { animation: legR .7s linear infinite; transform-origin: top center; transform-box: fill-box; }
  .lower-beak{ animation: beakChomp 3.2s ease-in-out infinite; transform-origin: left center; transform-box: fill-box; }
  .eye-lid   { animation: blink 4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .clouds    { animation: cloud 30s linear infinite; }
  .ground-tiles { animation: ground 1.4s linear infinite; }
</style>
</head>
<body>
  <div class="stage">
    <h1>鹈 鹕 骑 车 记</h1>
    <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Sun glow -->
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#fff2b3"/>
          <stop offset="60%" stop-color="#ffd76a"/>
          <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
        </radialGradient>
        <!-- Pelican body gradient -->
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#dfe7ef"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffcf5a"/>
          <stop offset="100%" stop-color="#ff9a3d"/>
        </linearGradient>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ef4a4a"/>
          <stop offset="100%" stop-color="#b41c1c"/>
        </linearGradient>
        <radialGradient id="tire" cx="50%" cy="50%" r="50%">
          <stop offset="70%" stop-color="#2a2a2a"/>
          <stop offset="100%" stop-color="#000"/>
        </radialGradient>
        <radialGradient id="hub" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#f4f4f4"/>
          <stop offset="100%" stop-color="#9aa1a8"/>
        </radialGradient>
        <!-- Cloud shape -->
        <symbol id="cloud" viewBox="0 0 120 50">
          <g fill="#ffffff" opacity=".9">
            <ellipse cx="30" cy="30" rx="26" ry="18"/>
            <ellipse cx="60" cy="22" rx="30" ry="22"/>
            <ellipse cx="90" cy="32" rx="24" ry="16"/>
          </g>
        </symbol>
      </defs>

      <!-- Sky sun -->
      <circle cx="760" cy="110" r="120" fill="url(#sun)"/>

      <!-- Distant hills -->
      <path d="M0 360 Q 150 280 320 340 T 640 330 T 900 350 L 900 400 L 0 400 Z" fill="#8fbf6e" opacity=".8"/>
      <path d="M0 380 Q 180 320 380 360 T 720 360 T 900 375 L 900 420 L 0 420 Z" fill="#7ab35a"/>

      <!-- Moving clouds -->
      <g class="clouds">
        <use href="#cloud" x="60"  y="70"  width="140" height="60"/>
        <use href="#cloud" x="340" y="50"  width="120" height="50"/>
        <use href="#cloud" x="560" y="90"  width="160" height="65"/>
        <use href="#cloud" x="820" y="60"  width="130" height="55"/>
        <!-- duplicate set for seamless loop -->
        <use href="#cloud" x="1260" y="70" width="140" height="60"/>
        <use href="#cloud" x="1540" y="50" width="120" height="50"/>
        <use href="#cloud" x="1760" y="90" width="160" height="65"/>
      </g>

      <!-- Ground -->
      <rect x="0" y="470" width="900" height="130" fill="#5da84a"/>
      <!-- moving ground dashes / road -->
      <rect x="0" y="470" width="900" height="30" fill="#3d3d3d"/>
      <g class="ground-tiles">
        <g fill="#ffd54a">
          <rect x="0"   y="482" width="60" height="6" rx="2"/>
          <rect x="120" y="482" width="60" height="6" rx="2"/>
          <rect x="240" y="482" width="60" height="6" rx="2"/>
          <rect x="360" y="482" width="60" height="6" rx="2"/>
          <rect x="480" y="482" width="60" height="6" rx="2"/>
          <rect x="600" y="482" width="60" height="6" rx="2"/>
          <rect x="720" y="482" width="60" height="6" rx="2"/>
          <rect x="840" y="482" width="60" height="6" rx="2"/>
          <rect x="960" y="482" width="60" height="6" rx="2"/>
        </g>
      </g>

      <!-- Grass tufts -->
      <g fill="#3a8f2a">
        <path d="M40 500 l4 -10 l3 10 z"/>
        <path d="M220 505 l4 -12 l4 12 z"/>
        <path d="M470 500 l4 -10 l3 10 z"/>
        <path d="M690 505 l4 -12 l4 12 z"/>
        <path d="M840 500 l4 -10 l3 10 z"/>
      </g>

      <!-- ================= BICYCLE + PELICAN ================= -->
      <g transform="translate(280 250)">
        <!-- WHEELS -->
        <!-- Back wheel -->
        <g transform="translate(40 200)">
          <circle r="70" fill="url(#tire)"/>
          <circle r="58" fill="#f2f2f2"/>
          <g class="wheel">
            <circle r="58" fill="none" stroke="#c9ced3" stroke-width="1"/>
            <!-- spokes -->
            <g stroke="#8892a0" stroke-width="2" stroke-linecap="round">
              <line x1="-56" y1="0" x2="56" y2="0"/>
              <line x1="0" y1="-56" x2="0" y2="56"/>
              <line x1="-40" y1="-40" x2="40" y2="40"/>
              <line x1="-40" y1="40" x2="40" y2="-40"/>
              <line x1="-20" y1="-52" x2="20" y2="52"/>
              <line x1="20" y1="-52" x2="-20" y2="52"/>
            </g>
            <circle r="8" fill="url(#hub)" stroke="#4a4a4a" stroke-width="1.5"/>
          </g>
        </g>
        <!-- Front wheel -->
        <g transform="translate(340 200)">
          <circle r="70" fill="url(#tire)"/>
          <circle r="58" fill="#f2f2f2"/>
          <g class="wheel">
            <circle r="58" fill="none" stroke="#c9ced3" stroke-width="1"/>
            <g stroke="#8892a0" stroke-width="2" stroke-linecap="round">
              <line x1="-56" y1="0" x2="56" y2="0"/>
              <line x1="0" y1="-56" x2="0" y2="56"/>
              <line x1="-40" y1="-40" x2="40" y2="40"/>
              <line x1="-40" y1="40" x2="40" y2="-40"/>
              <line x1="-20" y1="-52" x2="20" y2="52"/>
              <line x1="20" y1="-52" x2="-20" y2="52"/>
            </g>
            <circle r="8" fill="url(#hub)" stroke="#4a4a4a" stroke-width="1.5"/>
          </g>
        </g>

        <!-- FRAME -->
        <g stroke="url(#frame)" stroke-width="10" stroke-linecap="round" fill="none">
          <!-- top tube: seat post to head tube -->
          <line x1="190" y1="80"  x2="280" y2="80"/>
          <!-- seat tube: seat post down to crank -->
          <line x1="190" y1="80"  x2="190" y2="200"/>
          <!-- down tube: crank to head tube -->
          <line x1="190" y1="200" x2="280" y2="80"/>
          <!-- chain stays: crank to back wheel -->
          <line x1="190" y1="200" x2="40"  y2="200"/>
          <!-- seat stays: seat post to back wheel -->
          <line x1="190" y1="80"  x2="40"  y2="200"/>
          <!-- fork: head tube to front wheel -->
          <line x1="280" y1="80"  x2="340" y2="200"/>
          <!-- handlebar stem -->
          <line x1="280" y1="80"  x2="290" y2="45"/>
        </g>

        <!-- Handlebars -->
        <path d="M260 40 Q 290 25 320 40 L 320 55 Q 290 40 260 55 Z" fill="#2b2b2b"/>
        <circle cx="258" cy="47" r="6" fill="#111"/>
        <circle cx="322" cy="47" r="6" fill="#111"/>

        <!-- Seat -->
        <path d="M170 74 Q 190 66 215 74 L 210 82 Q 190 78 175 82 Z" fill="#222"/>

        <!-- Crank + pedals -->
        <g transform="translate(190 200)">
          <circle r="14" fill="#3a3a3a" stroke="#111" stroke-width="1.5"/>
          <g class="crank">
            <rect x="-26" y="-3" width="52" height="6" rx="2" fill="#4a4a4a"/>
            <!-- pedals stay flat via counter-rotation trick: keep as blocks -->
            <rect x="-34" y="-6" width="16" height="12" rx="2" fill="#161616"/>
            <rect x="18"  y="-6" width="16" height="12" rx="2" fill="#161616"/>
          </g>
        </g>

        <!-- ================= PELICAN ================= -->
        <g class="rider" transform="translate(190 -30)">
          <!-- Tail feathers -->
          <path d="M-70 100 Q -100 90 -108 108 Q -95 115 -60 112 Z" fill="#e5ecf3" stroke="#a9b4c0" stroke-width="1.2"/>

          <!-- Body -->
          <ellipse cx="0" cy="90" rx="70" ry="52" fill="url(#body)" stroke="#a9b4c0" stroke-width="1.5"/>

          <!-- Wing -->
          <path d="M-15 60 Q 25 40 55 75 Q 40 110 -5 105 Q -25 90 -15 60 Z"
                fill="#eef3f8" stroke="#a9b4c0" stroke-width="1.5"/>
          <path d="M10 78 Q 30 78 48 92" stroke="#a9b4c0" stroke-width="1" fill="none"/>
          <path d="M5 88 Q 28 92 45 100"  stroke="#a9b4c0" stroke-width="1" fill="none"/>

          <!-- Neck -->
          <path d="M-40 60 Q -55 20 -30 -10 Q -5 -25 15 -15 L 20 40 Q -5 55 -40 60 Z"
                fill="url(#body)" stroke="#a9b4c0" stroke-width="1.5"/>

          <!-- Head -->
          <circle cx="-5" cy="-25" r="32" fill="url(#body)" stroke="#a9b4c0" stroke-width="1.5"/>

          <!-- Upper beak -->
          <path d="M-30 -22 Q 20 -45 90 -30 Q 80 -18 25 -14 Q -5 -12 -30 -14 Z"
                fill="url(#beak)" stroke="#c47a1c" stroke-width="1.4"/>
          <!-- Beak highlight -->
          <path d="M-15 -30 Q 30 -40 80 -30" stroke="#ffe9a8" stroke-width="1.5" fill="none" opacity=".7"/>

          <!-- Lower beak / pouch -->
          <g class="lower-beak">
            <path d="M-28 -16 Q 15 6 78 -22 Q 65 12 25 20 Q -8 22 -28 -6 Z"
                  fill="#ffb64a" stroke="#c47a1c" stroke-width="1.4"/>
            <!-- fish tail sticking out of pouch -->
            <path d="M55 8 l 14 6 l -4 -12 z" fill="#7ed3f0" stroke="#3a8db0" stroke-width="1"/>
          </g>

          <!-- Eye -->
          <g transform="translate(-2 -32)">
            <circle r="7" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
            <circle r="4" fill="#2a2a2a"/>
            <circle cx="-1.2" cy="-1.5" r="1.4" fill="#fff"/>
            <rect class="eye-lid" x="-8" y="-8" width="16" height="16" rx="7" fill="#eef3f8"/>
          </g>

          <!-- Little crest -->
          <path d="M-18 -50 q 6 -10 14 -4 q -3 6 -10 8 z" fill="#ffb64a" stroke="#c47a1c" stroke-width="1"/>

          <!-- Helmet -->
          <path d="M-38 -40 Q -5 -70 30 -42 Q 30 -30 15 -30 L -30 -30 Q -38 -32 -38 -40 Z"
                fill="#3ab0e6" stroke="#1a6f97" stroke-width="1.5"/>
          <rect x="-15" y="-46" width="14" height="4" rx="1.5" fill="#ffdd57"/>
          <path d="M-30 -30 Q -20 -22 -8 -22" stroke="#1a6f97" stroke-width="1.5" fill="none"/>

          <!-- Arms holding handlebar (positioned relative to bike group) -->
          <path d="M40 80 Q 80 90 100 130" stroke="#e5ecf3" stroke-width="14" stroke-linecap="round" fill="none"/>
          <path d="M40 80 Q 80 90 100 130" stroke="#a9b4c0" stroke-width="1" fill="none"/>

          <!-- Legs (pedaling) -->
          <g transform="translate(-5 130)">
            <g class="leg-l">
              <rect x="-4" y="0" width="8" height="60" rx="4" fill="url(#body)" stroke="#a9b4c0" stroke-width="1"/>
              <ellipse cx="0" cy="64" rx="10" ry="5" fill="#ffb64a" stroke="#c47a1c" stroke-width="1"/>
            </g>
          </g>
          <g transform="translate(10 130)">
            <g class="leg-r">
              <rect x="-4" y="0" width="8" height="60" rx="4" fill="url(#body)" stroke="#a9b4c0" stroke-width="1"/>
              <ellipse cx="0" cy="64" rx="10" ry="5" fill="#ffb64a" stroke="#c47a1c" stroke-width="1"/>
            </g>
          </g>
        </g>

        <!-- Speed lines -->
        <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".75">
          <line x1="-60" y1="150" x2="-30" y2="150">
            <animate attributeName="opacity" values="0;.8;0" dur=".6s" repeatCount="indefinite"/>
          </line>
          <line x1="-70" y1="180" x2="-40" y2="180">
            <animate attributeName="opacity" values="0;.8;0" dur=".6s" begin=".2s" repeatCount="indefinite"/>
          </line>
          <line x1="-55" y1="220" x2="-25" y2="220">
            <animate attributeName="opacity" values="0;.8;0" dur=".6s" begin=".4s" repeatCount="indefinite"/>
          </line>
        </g>
      </g>

      <!-- little bird companion -->
      <g>
        <g>
          <path d="M120 130 q 8 -8 16 0 q -8 4 -16 0" fill="#2a2a2a"/>
          <animateTransform attributeName="transform" type="translate"
                            values="120 130; 130 120; 120 130" dur="1s" repeatCount="indefinite"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
