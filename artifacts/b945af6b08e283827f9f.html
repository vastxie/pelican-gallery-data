<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7ef">
  <title>慢慢骑 | 鹈鹕的快乐骑行</title>
  <style>
    :root {
      --ink: #304c40;
      --muted: #78897a;
      --paper: #f6f7ef;
      --sky: #dceee4;
      --line: #dfe5d8;
      --orange: #d67954;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .topbar {
      height: 76px;
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      width: min(1280px, calc(100% - 80px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 35px; height: 35px; flex: none; }
    .brand-name { font-family: Georgia, "Songti SC", serif; font-size: 18px; font-weight: 700; letter-spacing: .08em; line-height: 1.1; }
    .brand-en { margin-top: 4px; font-size: 8px; font-weight: 700; letter-spacing: .19em; color: #879589; }
    .top-note { display: flex; align-items: center; gap: 12px; color: #7b8b7c; font-size: 11px; letter-spacing: .13em; }
    .top-note .sun-dot { color: #d8915d; font-size: 19px; line-height: 1; }

    main {
      width: min(1280px, calc(100% - 80px), calc((100vh - 195px) * 1.935));
      margin: 0 auto;
    }
    .section-line {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #819185;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    .section-line span { display: inline-flex; align-items: center; gap: 11px; }
    .section-line .line { width: 25px; height: 1px; background: #a6b6a7; }
    .section-line .right-label { font-weight: 500; letter-spacing: .12em; }

    .postcard {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1200 / 620;
      border: 1px solid rgba(63, 105, 79, .12);
      border-radius: 12px;
      background: var(--sky);
      isolation: isolate;
      box-shadow: 0 12px 35px rgba(56, 85, 60, .055);
    }
    .scene {
      display: block;
      width: 100%;
      height: 100%;
    }
    .copy {
      position: absolute;
      z-index: 2;
      top: 12%;
      left: 6.2%;
      pointer-events: none;
    }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 25px; color: #668772; font-size: 10px; font-weight: 800; letter-spacing: .18em; }
    .eyebrow svg { width: 16px; height: 16px; color: #d88d5c; }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", Georgia, serif;
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 600;
      line-height: 1.23;
      letter-spacing: .035em;
      color: #2e5142;
    }
    .copy-description { margin: 23px 0 0; color: #668273; font-size: 14px; line-height: 1.95; letter-spacing: .08em; }
    .handwritten { display: flex; align-items: center; gap: 10px; margin-top: 28px; color: #c47d58; font: italic 16px Georgia, serif; }
    .handwritten svg { width: 46px; height: 19px; }
    .card-corner {
      position: absolute;
      z-index: 2;
      top: 5.5%;
      right: 3.3%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      color: #718f7c;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .14em;
      line-height: 1.25;
    }
    .card-corner span:last-child { font-size: 8px; font-weight: 500; letter-spacing: .1em; }

    .caption {
      min-height: 75px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .caption-left { display: flex; align-items: center; gap: 14px; }
    .number-badge {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border: 1px solid #ced9cb;
      border-radius: 50%;
      color: #78917d;
      font: italic 13px Georgia, serif;
    }
    .caption-title { font-size: 13px; font-weight: 650; letter-spacing: .06em; }
    .caption-subtitle { margin-top: 5px; color: #9aa99a; font-size: 9px; font-weight: 700; letter-spacing: .14em; }
    .caption-right { display: flex; align-items: center; gap: 24px; }
    .status { display: flex; align-items: center; gap: 8px; color: #8a9a8a; font-size: 11px; letter-spacing: .06em; white-space: nowrap; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #8eaf87; box-shadow: 0 0 0 3px #e6eee2; }
    .is-paused .status-dot { background: #b8b7a3; box-shadow: 0 0 0 3px #edeee7; }
    .toggle {
      min-width: 108px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 15px;
      border: 1px solid #d5dfd2;
      border-radius: 999px;
      background: transparent;
      color: #587061;
      font-size: 11px;
      letter-spacing: .05em;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .toggle:hover { background: #e9f0e6; border-color: #b8cdbb; }
    .toggle:active { transform: scale(.97); }
    .toggle:focus-visible { outline: 2px solid #679574; outline-offset: 3px; }
    .toggle svg { width: 12px; height: 12px; fill: currentColor; }
    .play-icon { display: none; }
    .is-paused .play-icon { display: block; }
    .is-paused .pause-icon { display: none; }
    .footer {
      display: flex;
      justify-content: space-between;
      padding: 4px 0 20px;
      color: #a4b1a3;
      font-size: 9px;
      letter-spacing: .12em;
    }

    .wheel-turn, .crank-turn { transform-box: fill-box; transform-origin: center; animation: spin 1.6s linear infinite; }
    .cloud-one { animation: cloud-drift 8s ease-in-out infinite alternate; }
    .cloud-two { animation: cloud-drift 11s ease-in-out infinite alternate-reverse; }
    .rider-body { animation: rider-bob 1.6s ease-in-out infinite; }
    .wind-one { animation: wind 2.6s ease-in-out infinite; }
    .wind-two { animation: wind 2.6s 1s ease-in-out infinite; }
    .flower-sway { transform-box: fill-box; transform-origin: bottom center; animation: sway 3s ease-in-out infinite alternate; }
    .road-dashes { animation: road 1.6s linear infinite; }
    .is-paused .scene * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes cloud-drift { to { transform: translateX(18px); } }
    @keyframes rider-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes wind { 0% { opacity: 0; transform: translateX(22px); } 35%, 65% { opacity: .8; } 100% { opacity: 0; transform: translateX(-24px); } }
    @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(4deg); } }
    @keyframes road { to { stroke-dashoffset: 100; } }
    @media (prefers-reduced-motion: reduce) {
      body:not(.motion-enabled) .scene * { animation-play-state: paused; }
    }
    @media (max-width: 700px) {
      .topbar { height: 67px; }
      .topbar-inner, main { width: calc(100% - 36px); }
      .top-note { font-size: 0; gap: 0; }
      .top-note .sun-dot { font-size: 22px; }
      .section-line { height: 43px; font-size: 9px; }
      .section-line .right-label { display: none; }
      .postcard { aspect-ratio: auto; height: 570px; }
      .scene { position: absolute; width: 165%; height: auto; left: -55%; bottom: 0; }
      .copy { top: 8%; left: 8%; }
      .eyebrow { margin-bottom: 18px; font-size: 9px; }
      h1 { font-size: clamp(43px, 11vw, 56px); }
      .copy-description { margin-top: 15px; font-size: 13px; }
      .handwritten { margin-top: 15px; font-size: 14px; }
      .card-corner { top: 5%; right: 6%; }
      .caption { min-height: 76px; }
      .caption-right { gap: 12px; }
      .status { display: none; }
      .footer { font-size: 8px; }
    }
    @media (max-width: 380px) {
      .postcard { height: 530px; }
      .scene { width: 175%; left: -65%; }
      .caption-subtitle { font-size: 8px; letter-spacing: .09em; }
      .toggle { min-width: 96px; padding: 0 10px; }
    }
  </style>
</head>

  </main>
  <script>
    (() => {
      const scene = document.getElementById('scene');
      const button = document.getElementById('toggle');
      const buttonText = document.getElementById('toggle-text');
      const statusText = document.getElementById('status-text');
      let paused = false;

      function setPaused(value) {
        paused = value;
        document.body.classList.toggle('is-paused', paused);
        document.body.classList.toggle('motion-enabled', !paused);
        if (paused && scene.pauseAnimations) scene.pauseAnimations();
        if (!paused && scene.unpauseAnimations) scene.unpauseAnimations();
        buttonText.textContent = paused ? '播放动画' : '暂停动画';
        button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        statusText.textContent = paused ? '休息一下' : '正在兜风';
      }

      button.addEventListener('click', () => setPaused(!paused));
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) setPaused(true);
    })();
  </script>
