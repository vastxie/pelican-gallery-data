<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 - SVG 2D 动画</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(#1a2a3a, #0e1620);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .frame {
    width: min(90vw, 960px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  svg { display: block; width: 100%; height: auto; }

  /* ============ 动画定义 ============ */
  /* 轮辐旋转 */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* 脚踏绕牙盘旋转 */
  @keyframes crank {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* 身体上下起伏 */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  /* 翅膀(手臂)扶把轻微摆动 */
  @keyframes wing {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-6deg); }
  }
  /* 头部点头 */
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(4deg); }
  }
  /* 尾巴摆动 */
  @keyframes tail {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(8deg); }
  }
  /* 云漂移 */
  @keyframes drift {
    from { transform: translateX(-200px); }
    to   { transform: translateX(1100px); }
  }
  /* 路面虚线后退(营造前进感) */
  @keyframes road {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -80; }
  }
  /* 腿蹬踏(两相反相) */
  @keyframes pedalA {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25%      { transform: rotate(6deg) translateY(10px); }
    50%      { transform: rotate(0deg) translateY(16px); }
    75%      { transform: rotate(-6deg) translateY(8px); }
  }
  @keyframes pedalB {
    0%, 100% { transform: rotate(0deg) translateY(16px); }
    25%      { transform: rotate(-6deg) translateY(8px); }
    50%      { transform: rotate(0deg) translateY(0); }
    75%      { transform: rotate(6deg) translateY(10px); }
  }

  /* ============ 元素绑定 ============ */
  .spokes        { animation: spin 1s linear infinite; transform-box: fill-box; }
  .crankset      { animation: crank 1s linear infinite; }
  .body-group    { animation: bob 1s ease-in-out infinite; }
  .head-group    { animation: nod 1s ease-in-out infinite; transform-origin: 430px 250px; }
  .wing          { animation: wing 1s ease-in-out infinite; transform-origin: 390px 300px; }
  .tailfeather   { animation: tail 1s ease-in-out infinite; transform-origin: 300px 300px; }
  .legA, .legB   { transform-origin: 372px 330px; }
  .legA          { animation: pedalA 1s ease-in-out infinite; }
  .legB          { animation: pedalB 1s ease-in-out infinite; }
  .cloud1        { animation: drift 26s linear infinite; }
  .cloud2        { animation: drift 40s linear infinite; animation-delay: -14s; }
  .cloud3        { animation: drift 58s linear infinite; animation-delay: -30s; }
  .road-dash     { animation: road 0.6s linear infinite; }
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <!-- ===== 背景 ===== -->
  <rect width="800" height="560" fill="#aee3f5"/>
  <rect y="420" width="800" height="140" fill="#8fd18b"/>
  <circle cx="660" cy="90" r="45" fill="#ffe98a"/>
  <circle cx="660" cy="90" r="60" fill="#ffe98a" opacity="0.35"/>

  <!-- 云 -->
  <g class="cloud1" fill="#ffffff" opacity="0.9">
    <ellipse cx="120" cy="80" rx="45" ry="20"/>
    <ellipse cx="155" cy="68" rx="30" ry="16"/>
    <ellipse cx="90"  cy="70" rx="28" ry="14"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity="0.75">
    <ellipse cx="300" cy="150" rx="40" ry="17"/>
    <ellipse cx="330" cy="138" rx="26" ry="13"/>
  </g>
  <g class="cloud3" fill="#ffffff" opacity="0.6">
    <ellipse cx="520" cy="60" rx="34" ry="14"/>
    <ellipse cx="548" cy="50" rx="22" ry="11"/>
  </g>

  <!-- 道路 -->
  <rect y="460" width="800" height="60" fill="#6b7280"/>
  <line class="road-dash" x1="0" y1="490" x2="800" y2="490"
        stroke="#f9fafb" stroke-width="6" stroke-dasharray="40 40"/>

  <!-- ===== 自行车 ===== -->
  <g id="bike">
    <!-- 后轮 -->
    <g transform="translate(250,460)">
      <circle r="58" fill="none" stroke="#222" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#9ca3af" stroke-width="3"/>
      <g class="spokes" stroke="#6b7280" stroke-width="3">
        <line x1="0" y1="-58" x2="0" y2="58"/>
        <line x1="-58" y1="0" x2="58" y2="0"/>
        <line x1="-41" y1="-41" x2="41" y2="41"/>
        <line x1="41" y1="-41" x2="-41" y2="41"/>
      </g>
      <circle r="8" fill="#374151"/>
    </g>
    <!-- 前轮 -->
    <g transform="translate(540,460)">
      <circle r="58" fill="none" stroke="#222" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#9ca3af" stroke-width="3"/>
      <g class="spokes" stroke="#6b7280" stroke-width="3">
        <line x1="0" y1="-58" x2="0" y2="58"/>
        <line x1="-58" y1="0" x2="58" y2="0"/>
        <line x1="-41" y1="-41" x2="41" y2="41"/>
        <line x1="41" y1="-41" x2="-41" y2="41"/>
      </g>
      <circle r="8" fill="#374151"/>
    </g>
    <!-- 车架 -->
    <g stroke="#e11d48" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="250" y1="460" x2="395" y2="455"/>  <!-- 后下叉 -->
      <line x1="395" y1="455" x2="335" y2="365"/>  <!-- 立管 -->
      <line x1="250" y1="460" x2="335" y2="365"/>  <!-- 后叉 -->
      <line x1="335" y1="365" x2="520" y2="365"/>  <!-- 上管 -->
      <line x1="395" y1="455" x2="520" y2="365"/>  <!-- 下管 -->
      <line x1="520" y1="365" x2="540" y2="460"/>  <!-- 前叉 -->
    </g>
    <!-- 车把 + 座垫 -->
    <line x1="520" y1="365" x2="545" y2="340" stroke="#111" stroke-width="9" stroke-linecap="round"/>
    <line x1="522" y1="344" x2="562" y2="338" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <line x1="335" y1="365" x2="330" y2="345" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <line x1="308" y1="345" x2="352" y2="345" stroke="#111" stroke-width="11" stroke-linecap="round"/>
    <!-- 牙盘与脚踏(旋转) -->
    <g class="crankset" style="transform-origin:395px 455px;">
      <line x1="395" y1="430" x2="395" y2="480" stroke="#374151" stroke-width="7"/>
      <circle cx="395" cy="455" r="16" fill="none" stroke="#374151" stroke-width="5"/>
      <circle cx="395" cy="430" r="7" fill="#111"/>
      <circle cx="395" cy="480" r="7" fill="#111"/>
    </g>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g class="body-group">
    <!-- 尾巴 -->
    <path class="tailfeather" d="M285 290 Q250 280 240 305 Q265 315 290 310 Z" fill="#e5e7eb"/>
    <!-- 后腿(B 相位) -->
    <g class="legB">
      <path d="M368 333 Q360 390 385 448" stroke="#f59e0b" stroke-width="11"
            stroke-linecap="round" fill="none"/>
      <ellipse cx="390" cy="455" rx="13" ry="8" fill="#f59e0b"/>
    </g>
    <!-- 身体 -->
    <ellipse cx="360" cy="295" rx="80" ry="58" fill="#f9fafb"/>
    <ellipse cx="360" cy="315" rx="60" ry="38" fill="#e5e7eb" opacity="0.6"/>
    <!-- 前腿(A 相位) -->
    <g class="legA">
      <path d="M376 333 Q388 390 398 438" stroke="#f59e0b" stroke-width="11"
            stroke-linecap="round" fill="none"/>
      <ellipse cx="400" cy="445" rx="13" ry="8" fill="#f59e0b"/>
    </g>
    <!-- 翅膀(扶把的手臂) -->
    <path class="wing" d="M395 285 Q460 300 540 335" stroke="#f3f4f6"
          stroke-width="22" stroke-linecap="round" fill="none"/>
    <path class="wing" d="M395 285 Q440 290 500 320" stroke="#d1d5db"
          stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- 头部组(点头动画) -->
    <g class="head-group">
      <!-- 长喙 -->
      <path d="M430 228 Q500 236 585 246 Q500 258 432 252 Z" fill="#ff9f1c"/>
      <!-- 喉囊 -->
      <path d="M433 252 Q470 300 545 268 Q520 246 490 250 Q458 254 433 252 Z"
            fill="#ffb64f" opacity="0.95"/>
      <!-- 头 -->
      <ellipse cx="418" cy="228" rx="40" ry="34" fill="#f9fafb"/>
      <!-- 羽冠 -->
      <path d="M395 202 Q385 180 400 190 M410 198 Q408 176 420 188"
            stroke="#f9fafb" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- 眼睛 -->
      <circle cx="425" cy="220" r="6" fill="#111"/>
      <circle cx="427" cy="218" r="2" fill="#fff"/>
      <!-- 喙尖鼻孔 -->
      <circle cx="452" cy="238" r="2.5" fill="#b45309"/>
    </g>
  </g>

  <!-- 前景草地装饰 -->
  <g fill="#5fa05a">
    <path d="M40 560 L50 520 L58 560 Z"/>
    <path d="M70 560 L78 528 L86 560 Z"/>
    <path d="M700 560 L712 518 L720 560 Z"/>
    <path d="M750 560 L758 532 L768 560 Z"/>
  </g>
</svg>
</div>
</body>
</html>
