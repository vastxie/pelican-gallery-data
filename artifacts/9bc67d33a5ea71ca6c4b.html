<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;background:#87ceeb;overflow:hidden}
  svg{width:100%;height:100%;display:block}
  .spin{animation:spin 1s linear infinite}
  .crank{transform-origin:400px 400px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bob{animation:bob .5s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(3px)}}
  .ground{animation:scroll 1s linear infinite}
  @keyframes scroll{to{transform:translateX(-120px)}}
  .clouds{animation:cloud 30s linear infinite}
  @keyframes cloud{from{transform:translateX(900px)}to{transform:translateX(-900px)}}
  .wing{transform-origin:385px 290px;animation:flap .5s ease-in-out infinite alternate}
  @keyframes flap{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
  .pouch{transform-origin:470px 250px;animation:pouch 1s ease-in-out infinite alternate}
  @keyframes pouch{to{transform:scaleY(1.15)}}
</style>
</head>
<body>
<svg viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice">
  <!-- 太阳与云 -->
  <circle cx="680" cy="90" r="45" fill="#ffd93b"/>
  <g class="clouds" fill="#fff">
    <ellipse cx="150" cy="100" rx="60" ry="22"/><ellipse cx="190" cy="85" rx="40" ry="22"/>
    <ellipse cx="500" cy="150" rx="50" ry="18"/><ellipse cx="530" cy="138" rx="32" ry="18"/>
  </g>
  <!-- 远山 -->
  <path d="M0 440 Q150 330 300 440 T600 440 T900 440 V560 H0Z" fill="#7cc576"/>
  <!-- 地面 -->
  <rect y="470" width="800" height="90" fill="#6b6b6b"/>
  <g class="ground" stroke="#fff" stroke-width="6">
    <path d="M0 515h60M120 515h60M240 515h60M360 515h60M480 515h60M600 515h60M720 515h60M840 515h60"/>
  </g>

  <g class="bob">
    <!-- 后轮 -->
    <g transform="translate(270 400)">
      <circle r="68" fill="none" stroke="#222" stroke-width="8"/>
      <g class="spin" stroke="#999" stroke-width="2">
        <line x1="-64" y1="0" x2="64" y2="0"/><line x1="0" y1="-64" x2="0" y2="64"/>
        <line x1="-45" y1="-45" x2="45" y2="45"/><line x1="-45" y1="45" x2="45" y2="-45"/>
      </g>
      <circle r="6" fill="#444"/>
    </g>
    <!-- 前轮 -->
    <g transform="translate(530 400)">
      <circle r="68" fill="none" stroke="#222" stroke-width="8"/>
      <g class="spin" stroke="#999" stroke-width="2">
        <line x1="-64" y1="0" x2="64" y2="0"/><line x1="0" y1="-64" x2="0" y2="64"/>
        <line x1="-45" y1="-45" x2="45" y2="45"/><line x1="-45" y1="45" x2="45" y2="-45"/>
      </g>
      <circle r="6" fill="#444"/>
    </g>
    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M270 400 L400 400 L365 300 Z"/>
      <path d="M365 300 L500 300 L400 400"/>
      <path d="M530 400 L495 270"/>
    </g>
    <path d="M480 262 L515 262" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <path d="M345 292 h45" stroke="#222" stroke-width="10" stroke-linecap="round"/>

    <!-- 远侧腿 -->
    <g class="crank"><line x1="400" y1="400" x2="400" y2="440" stroke="#555" stroke-width="6"/></g>

    <!-- 鹈鹕身体 -->
    <path d="M300 250 Q280 300 330 305 Q400 315 430 270 Q440 220 390 210 Q330 205 300 250Z" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
    <!-- 尾巴 -->
    <path d="M305 255 L265 245 L300 275Z" fill="#eee" stroke="#bbb"/>
    <!-- 脖子 -->
    <path d="M410 225 Q440 180 435 150 Q432 130 450 125" fill="none" stroke="#fafafa" stroke-width="22" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="455" cy="130" r="22" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
    <path d="M445 110 Q455 95 470 108" fill="#ffe08a"/>
    <circle cx="462" cy="125" r="4" fill="#111"/><circle cx="463" cy="124" r="1.3" fill="#fff"/>
    <!-- 喙与喉囊 -->
    <path d="M472 128 L560 142 L472 138Z" fill="#f4a300" stroke="#c77d00"/>
    <path class="pouch" d="M472 138 L556 143 Q520 185 480 160 Z" fill="#ff8c42" stroke="#c77d00"/>
    <!-- 翅膀（握车把） -->
    <path class="wing" d="M360 240 Q420 230 470 262 Q430 290 370 285 Q340 270 360 240Z" fill="#e8e8e8" stroke="#aaa" stroke-width="2"/>

    <!-- 曲柄与腿（近侧） -->
    <g class="crank">
      <line x1="400" y1="400" x2="400" y2="360" stroke="#333" stroke-width="7" stroke-linecap="round"/>
      <rect x="388" y="354" width="24" height="7" fill="#222"/>
    </g>
    <circle cx="400" cy="400" r="14" fill="#555" stroke="#222" stroke-width="3"/>
    <!-- 腿由JS驱动 -->
    <path id="legNear" fill="none" stroke="#f4a300" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footNear" fill="#f4a300"/>
  </g>
</svg>
<script>
  // 腿部简单IK：臀部固定，脚跟随曲柄
  const hip = {x:370, y:290}, L1 = 70, L2 = 70;
  const leg = document.getElementById('legNear'), foot = document.getElementById('footNear');
  function frame(t){
    const a = (t/1000)*2*Math.PI - Math.PI/2; // 与CSS旋转同步（1秒一圈，从上方开始）
    const fx = 400 + 40*Math.cos(a), fy = 400 + 40*Math.sin(a);
    const dx = fx-hip.x, dy = fy-hip.y, d = Math.min(Math.hypot(dx,dy), L1+L2-1);
    const base = Math.atan2(dy,dx), k = Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d));
    const kx = hip.x + L1*Math.cos(base-k), ky = hip.y + L1*Math.sin(base-k);
    leg.setAttribute('d',`M${hip.x} ${hip.y} L${kx} ${ky} L${fx} ${fy}`);
    foot.setAttribute('d',`M${fx-6} ${fy} L${fx+18} ${fy-4} L${fx+18} ${fy+6} Z`);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
