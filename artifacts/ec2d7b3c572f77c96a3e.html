<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf5f1">
  <link rel="icon" href="data:,">
  <title>沿海慢骑 · 鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eaf5f1;
      color: #23444a;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(16px, 3vw, 42px);
      background:
        radial-gradient(circle at 9% 11%, #ffffffab 0 8%, transparent 30%),
        radial-gradient(circle at 91% 82%, #cce8df 0, transparent 32%),
        #eaf5f1;
    }

    main { width: min(1180px, 100%); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 22px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #4f8984;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 52px);
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1.05;
    }

    .intro {
      margin: 0 0 4px;
      color: #62817f;
      font-size: clamp(13px, 1.5vw, 16px);
      text-align: right;
    }

    .scene-frame {
      overflow: hidden;
      border: 8px solid #fff;
      border-radius: 28px;
      background: #bde8e3;
      box-shadow: 0 28px 75px #446e6330, 0 4px 12px #446e6315;
    }

    svg { display: block; width: 100%; height: auto; }

    .cloud { animation: drift 18s ease-in-out infinite alternate; }
    .cloud.two { animation-duration: 24s; animation-direction: alternate-reverse; }
    .cloud.three { animation-duration: 21s; }
    .ribbon { transform-origin: 620px 258px; animation: flutter 1.35s ease-in-out infinite alternate; }
    .tail-feather { transform-origin: 460px 347px; animation: feather 1.1s ease-in-out infinite alternate; }
    .road-markings { animation: road 2.3s linear infinite; }
    .sparkle { animation: twinkle 2.8s ease-in-out infinite alternate; }
    .sparkle.two { animation-delay: -1.3s; }
    .sparkle.three { animation-delay: -.8s; }

    .is-paused .cloud,
    .is-paused .ribbon,
    .is-paused .tail-feather,
    .is-paused .road-markings,
    .is-paused .sparkle { animation-play-state: paused; }

    @keyframes drift { from { transform: translateX(-17px); } to { transform: translateX(24px); } }
    @keyframes flutter { from { transform: rotate(-6deg) scaleY(.97); } to { transform: rotate(7deg) scaleY(1.04); } }
    @keyframes feather { from { transform: rotate(-2deg); } to { transform: rotate(5deg); } }
    @keyframes road { to { transform: translateX(-138px); } }
    @keyframes twinkle { from { opacity: .32; } to { opacity: .9; } }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 8px 0;
    }

    button {
      min-width: 122px;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: #264c50;
      color: white;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    button:hover { background: #356a69; transform: translateY(-1px); }
    button:focus-visible, input:focus-visible { outline: 3px solid #e49e60; outline-offset: 4px; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 13px;
      color: #4b716f;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }
    input[type="range"] { width: min(185px, 27vw); accent-color: #d97854; cursor: pointer; }
    output { min-width: 32px; color: #284c50; font-variant-numeric: tabular-nums; }
    .note { margin-left: auto; color: #70908b; font-size: 13px; }

    @media (max-width: 700px) {
      body { display: block; padding-top: 28px; }
      header { display: block; }
      .intro { margin-top: 9px; text-align: left; }
      .scene-frame { border-width: 5px; border-radius: 20px; }
      .controls { flex-wrap: wrap; gap: 13px 18px; padding-top: 17px; }
      .note { width: 100%; margin-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud, .ribbon, .tail-feather, .road-markings, .sparkle { animation: none !important; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main id="app">
    <header>
      <div>
        <p class="eyebrow">A little seaside loop</p>
        <h1>沿海慢骑</h1>
      </div>
      <p class="intro">鹈鹕先生的午后，车轮和海风同频。</p>
    </header>

    <div class="scene-frame">
      <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕骑自行车的海边动画</title>
        <desc id="scene-desc">一只戴着蓝绿色头盔的鹈鹕，在阳光明亮的海边骑着薄荷绿自行车。车轮和脚踏持续转动，云朵与围巾轻轻飘动。</desc>
        <defs>
          <linearGradient id="sky" x2="0" y2="1">
            <stop stop-color="#b9e4e4"/>
            <stop offset=".67" stop-color="#d9eee1"/>
            <stop offset="1" stop-color="#f6ead4"/>
          </linearGradient>
          <linearGradient id="sea" x2="0" y2="1">
            <stop stop-color="#75c6c4"/>
            <stop offset="1" stop-color="#4ba8af"/>
          </linearGradient>
          <linearGradient id="sand" x2="0" y2="1">
            <stop stop-color="#f7e7c8"/>
            <stop offset="1" stop-color="#eacba1"/>
          </linearGradient>
          <linearGradient id="pouch" x2=".1" y2="1">
            <stop stop-color="#fac275"/>
            <stop offset=".55" stop-color="#f3a362"/>
            <stop offset="1" stop-color="#e88965"/>
          </linearGradient>
          <linearGradient id="beak" x2="0" y2="1">
            <stop stop-color="#f9c675"/>
            <stop offset="1" stop-color="#e79151"/>
          </linearGradient>
          <linearGradient id="body" x2="0" y2="1">
            <stop stop-color="#fff9e9"/>
            <stop offset="1" stop-color="#f1e4c9"/>
          </linearGradient>
          <filter id="soft-shadow" x="-50%" y="-100%" width="200%" height="300%">
            <feGaussianBlur stdDeviation="12"/>
          </filter>
          <pattern id="road-pattern" x="0" y="0" width="138" height="26" patternUnits="userSpaceOnUse">
            <path d="M12 13h49" stroke="#fff5e3" stroke-width="4" stroke-linecap="round" opacity=".74"/>
          </pattern>
        </defs>

        <!-- Sky and distant shore -->
        <rect width="1200" height="720" fill="url(#sky)"/>
        <circle cx="969" cy="134" r="86" fill="#fff5c7" opacity=".28"/>
        <circle cx="969" cy="134" r="59" fill="#fff4c9" opacity=".45"/>
        <circle cx="969" cy="134" r="40" fill="#ffe7ad"/>
        <g class="cloud" fill="#fffdf1" opacity=".88">
          <path d="M74 119c0-20 18-36 39-35 10-23 39-31 58-15 12-6 28-2 35 10 20-2 36 12 37 29 0 17-14 26-31 26H98c-14 0-24-5-24-15z"/>
          <path d="M241 142h69" fill="none" stroke="#fffdf1" stroke-width="5" stroke-linecap="round" opacity=".65"/>
        </g>
        <g class="cloud two" fill="#fffdf1" opacity=".78">
          <path d="M746 89c1-14 14-24 28-22 6-17 29-24 43-10 12-4 24 2 28 13 17-2 30 9 30 23 0 12-11 20-23 20h-84c-12 0-22-9-22-24z"/>
        </g>
        <g class="cloud three" fill="#fffdf1" opacity=".66">
          <path d="M1066 245c0-12 10-21 22-20 8-15 28-17 40-5 17-4 31 8 31 23 0 12-10 19-21 19h-54c-11 0-18-7-18-17z"/>

        <path d="M0 493c156-14 239 8 395-2 148-10 257 14 395 4 147-10 290-2 410-8" fill="none" stroke="#d5f2e5" stroke-width="5" opacity=".5"/>

        <path d="M0 559c125-23 197-12 314-15 155-4 230-11 382-7 198 6 363 10 504-10" fill="none" stroke="#fff8e8" stroke-width="11" opacity=".78"/>
        <path d="M0 652c177 5 265-10 435-5 196 6 313-3 479 2 110 3 208 1 286-8v79H0z" fill="#d7b995" opacity=".3"/>

        </g>
        <g fill="#80aaa0" opacity=".78">
          <path d="M127 605q-11-18-11-25m11 25q4-18 15-26m-15 26q15-13 24-12M1038 614q-9-17-6-26m6 26q3-21 13-30m-13 30q13-12 22-11" fill="none" stroke="#80aaa0" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="187" cy="623" rx="5" ry="2"/><ellipse cx="978" cy="606" rx="7" ry="3"/><ellipse cx="1097" cy="654" rx="5" ry="2"/>
        </g>

        <!-- Moving bicycle; the wheels and crank share one clock in the script. -->
        <ellipse cx="605" cy="656" rx="380" ry="18" fill="#385f59" opacity=".22" filter="url(#soft-shadow)"/>

        <g id="rear-leg" fill="none" stroke="#c37a55" stroke-linecap="round" stroke-linejoin="round">
          <path id="rear-leg-line" stroke-width="18"/>
          <circle id="rear-knee" r="9" fill="#c37a55" stroke="none"/>
          <path id="rear-foot" fill="#c37a55" stroke="none"/>
        </g>

        <g id="wheels">
          <circle cx="394" cy="556" r="99" fill="#f8f2df" fill-opacity=".44" stroke="#26454a" stroke-width="17"/>
          <circle cx="818" cy="556" r="99" fill="#f8f2df" fill-opacity=".44" stroke="#26454a" stroke-width="17"/>
          <circle cx="394" cy="556" r="87" fill="none" stroke="#90b2ac" stroke-width="2"/>
          <circle cx="818" cy="556" r="87" fill="none" stroke="#90b2ac" stroke-width="2"/>
          <g id="rear-spokes" stroke="#75999b" stroke-width="2" opacity=".88"/>
          <g id="front-spokes" stroke="#75999b" stroke-width="2" opacity=".88"/>
          <circle cx="394" cy="556" r="11" fill="#e2b66f" stroke="#315458" stroke-width="5"/>
          <circle cx="818" cy="556" r="11" fill="#e2b66f" stroke="#315458" stroke-width="5"/>
        </g>

        <g id="bike" stroke-linecap="round" stroke-linejoin="round">
          <path d="M397 556H598" fill="none" stroke="#6a7770" stroke-width="2" opacity=".7"/>
          <path d="M394 556 548 412 598 570zM548 412 755 475 598 570" fill="none" stroke="#274e51" stroke-width="20"/>
          <path d="M394 556 548 412 598 570zM548 412 755 475 598 570" fill="none" stroke="#72bbb0" stroke-width="12"/>
          <path d="M739 415 755 475 818 556" fill="none" stroke="#284b50" stroke-width="20"/>
          <path d="M739 415 755 475 818 556" fill="none" stroke="#72bbb0" stroke-width="12"/>
          <path d="M548 412 538 386" fill="none" stroke="#344e4c" stroke-width="11"/>
          <path d="M507 388q26-13 66-4 11 3 8 11-4 7-17 7h-51q-17 0-16-7 0-4 10-7z" fill="#33484b" stroke="#263d40" stroke-width="3"/>
          <path d="M739 415 751 385 807 385" fill="none" stroke="#344e4c" stroke-width="11"/>
          <path d="M800 381h25q12 0 12 12v7" fill="none" stroke="#344e4c" stroke-width="10"/>
          <path d="M800 382h29" fill="none" stroke="#e5a365" stroke-width="7"/>
          <circle cx="598" cy="570" r="34" fill="#e5c988" stroke="#31565b" stroke-width="8"/>
          <circle cx="598" cy="570" r="22" fill="#608b86" stroke="#dce5c7" stroke-width="4"/>
          <circle cx="598" cy="570" r="7" fill="#314f54"/>
          <path d="M348 556h49" fill="none" stroke="#29484c" stroke-width="6"/>
        </g>

        <!-- The pelican is drawn as one gently bobbing group. -->
        <g id="rider">
          <g class="tail-feather">
            <path d="M474 344q-39-25-78-11 27 12 53 33-34-5-58 8 44 9 82-8z" fill="#f5e6c7" stroke="#e7cfac" stroke-width="3"/>
          </g>
          <path d="M570 364c0-47 20-97 53-121 19-14 28-34 26-49 2-28 28-47 54-39 30 8 37 44 22 68-12 19-31 27-51 30-22 14-29 57-19 100z" fill="url(#body)" stroke="#e9d6b6" stroke-width="4"/>

          <g class="ribbon">
            <path d="M620 250q-17 7-35 0-30-13-64-4 30 11 49 27-24 2-39 19 39-4 78-20z" fill="#3b8c89" stroke="#226b6e" stroke-width="3"/>
            <path d="M618 250q24-9 42-4l-8 26q-20-2-40-3z" fill="#2b7776"/>
          </g>

          <path d="M686 224c56 2 128 16 198 27-20 42-61 73-106 73-49 0-77-36-92-100z" fill="url(#pouch)" stroke="#cf8155" stroke-width="4"/>
          <path d="M711 263q31 39 80 35" fill="none" stroke="#e5875c" stroke-width="4" opacity=".75" stroke-linecap="round"/>

          <path d="M449 317c23-36 86-55 149-39 49 12 80 51 73 89-9 47-57 70-113 68-50-2-93-22-111-54-13-23-14-43 2-64z" fill="url(#body)" stroke="#ead7b8" stroke-width="4"/>
          <path d="M472 349q-26 4-37 25 21 2 47-6" fill="#f9eed7"/>
          <path d="M487 375q18 32 65 38" fill="none" stroke="#e1cbaa" stroke-width="4" stroke-linecap="round" opacity=".65"/>

          <!-- A wing reaches the handlebar; three rounded tips read as feathers. -->
          <path d="M578 317c28-11 54 6 79 26 31 24 74 34 124 32q16-3 24 7 4 6-3 9-9 4-20-1-6 9-20 4-7 7-19 0-48-6-88-20-43-9-70-26-18-12-7-31z" fill="#f0d9b4" stroke="#d9bb93" stroke-width="4"/>
          <path d="M610 338q69 48 144 47" fill="none" stroke="#e4c59d" stroke-width="4" stroke-linecap="round"/>

          <path d="M686 213q80 11 198 32 11 2 11 8-1 7-13 8l-195-20q-12-1-15-10-4-13 14-18z" fill="url(#beak)" stroke="#cc8650" stroke-width="3"/>
          <path d="M719 231q86 13 153 22" fill="none" stroke="#fff1c2" stroke-width="4" opacity=".73" stroke-linecap="round"/>
          <circle cx="699" cy="196" r="7.5" fill="#263f43"/>
          <circle cx="701" cy="193" r="2.5" fill="#fff"/>
          <path d="M685 183q11-6 23 0" fill="none" stroke="#d9b994" stroke-width="3" stroke-linecap="round"/>

          <!-- Tiny cycling helmet and its strap. -->
          <path d="M644 183c4-26 28-43 57-42 24 1 43 17 48 39-28-5-72-4-105 3z" fill="#2a7779" stroke="#205f66" stroke-width="4"/>
          <path d="M646 179q40-14 99-3" fill="none" stroke="#86c7b6" stroke-width="6" stroke-linecap="round"/>
          <path d="M689 144q-4 16-4 31" fill="none" stroke="#205f66" stroke-width="3" opacity=".7"/>
          <path d="M737 179q7 8 12 10-10 6-28 5" fill="#205f66"/>
          <path d="M731 186q0 30-17 37" fill="none" stroke="#28686b" stroke-width="3" opacity=".65"/>
        </g>

        <g id="crank" stroke="#354f52" stroke-width="9" stroke-linecap="round">
          <path id="crank-rear"/>
          <path id="crank-front"/>
        </g>
        <g id="front-leg" fill="none" stroke="#d98756" stroke-linecap="round" stroke-linejoin="round">
          <path id="front-leg-line" stroke-width="20"/>
          <circle id="front-knee" r="10" fill="#d98756" stroke="none"/>
          <path id="front-foot" fill="#d98756" stroke="none"/>
        </g>
        <g id="pedals" fill="#334f52">
          <rect id="rear-pedal" width="44" height="9" rx="4.5"/>
          <rect id="front-pedal" width="44" height="9" rx="4.5"/>
        </g>
      </svg>
    </div>

    <div class="controls" aria-label="动画控制">
      <button id="toggle" type="button" aria-pressed="true">Ⅱ&nbsp; 暂停动画</button>
      <label class="speed-control" for="speed">
        骑行速度
        <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1">
        <output id="speed-value" for="speed">1.0×</output>
      </label>
      <span class="note">纯 SVG 绘制 · 单文件运行</span>
    </div>
  </main>

  <script>
    (() => {
      const svgNS = 'http://www.w3.org/2000/svg';
      const app = document.getElementById('app');
      const button = document.getElementById('toggle');
      const slider = document.getElementById('speed');
      const speedValue = document.getElementById('speed-value');
      const rider = document.getElementById('rider');
      const centers = [{ x: 394, y: 556, id: 'rear-spokes' }, { x: 818, y: 556, id: 'front-spokes' }];
      const legs = {
        front: {
          hip: { x: 536, y: 414 }, line: document.getElementById('front-leg-line'),
          knee: document.getElementById('front-knee'), foot: document.getElementById('front-foot'),
          crank: document.getElementById('crank-front'), pedal: document.getElementById('front-pedal')
        },
        rear: {
          hip: { x: 564, y: 410 }, line: document.getElementById('rear-leg-line'),
          knee: document.getElementById('rear-knee'), foot: document.getElementById('rear-foot'),
          crank: document.getElementById('crank-rear'), pedal: document.getElementById('rear-pedal')
        }
      };

      centers.forEach(({ x, y, id }) => {
        const group = document.getElementById(id);
        for (let i = 0; i < 16; i++) {
          const line = document.createElementNS(svgNS, 'line');
          const angle = i * Math.PI / 8;
          line.setAttribute('x1', x);
          line.setAttribute('y1', y);
          line.setAttribute('x2', x + Math.cos(angle) * 81);
          line.setAttribute('y2', y + Math.sin(angle) * 81);
          group.appendChild(line);
        }
      });

      let phase = 0.72;
      let speed = 1;
      let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let lastTime = 0;
      let frame = 0;

      function kneeFor(hip, foot) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const thigh = 115;
        const shin = 120;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        return {
          x: hip.x + (along * dx + bend * dy) / distance,
          y: hip.y + (along * dy - bend * dx) / distance
        };
      }

      function drawLeg(leg, angle, bob) {
        const pedal = { x: 598 + 39 * Math.cos(angle), y: 570 + 39 * Math.sin(angle) };
        const hip = { x: leg.hip.x, y: leg.hip.y + bob };
        const knee = kneeFor(hip, pedal);
        leg.line.setAttribute('d', `M${hip.x.toFixed(1)} ${hip.y.toFixed(1)} L${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L${pedal.x.toFixed(1)} ${pedal.y.toFixed(1)}`);
        leg.knee.setAttribute('cx', knee.x.toFixed(1));
        leg.knee.setAttribute('cy', knee.y.toFixed(1));
        leg.foot.setAttribute('d', `M${(pedal.x - 11).toFixed(1)} ${(pedal.y - 7).toFixed(1)} Q${(pedal.x + 9).toFixed(1)} ${(pedal.y - 12).toFixed(1)} ${(pedal.x + 27).toFixed(1)} ${(pedal.y + 2).toFixed(1)} Q${(pedal.x + 31).toFixed(1)} ${(pedal.y + 10).toFixed(1)} ${(pedal.x + 10).toFixed(1)} ${(pedal.y + 8).toFixed(1)} L${(pedal.x - 11).toFixed(1)} ${(pedal.y + 5).toFixed(1)}Z`);
        leg.crank.setAttribute('d', `M598 570 L${pedal.x.toFixed(1)} ${pedal.y.toFixed(1)}`);
        leg.pedal.setAttribute('x', (pedal.x - 22).toFixed(1));
        leg.pedal.setAttribute('y', (pedal.y + 6).toFixed(1));
      }

      function render() {
        const bob = Math.sin(phase * 2) * 2.7;
        rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
        drawLeg(legs.front, phase, bob);
        drawLeg(legs.rear, phase + Math.PI, bob);
        const wheelDegrees = phase * 2.45 * 180 / Math.PI;
        centers.forEach(({ x, y, id }) => {
          document.getElementById(id).setAttribute('transform', `rotate(${wheelDegrees.toFixed(2)} ${x} ${y})`);
        });
      }

      function tick(time) {
        if (!playing) return;
        if (lastTime) phase += Math.min(time - lastTime, 50) * speed * Math.PI * 2 / 1700;
        lastTime = time;
        render();
        frame = requestAnimationFrame(tick);
      }

      function updateControls() {
        app.classList.toggle('is-paused', !playing);
        button.innerHTML = playing ? 'Ⅱ&nbsp; 暂停动画' : '▶&nbsp; 播放动画';
        button.setAttribute('aria-pressed', String(playing));
      }

      button.addEventListener('click', () => {
        playing = !playing;
        updateControls();
        if (playing) {
          lastTime = 0;
          frame = requestAnimationFrame(tick);
        } else {
          cancelAnimationFrame(frame);
        }
      });

      slider.addEventListener('input', () => {
        speed = Number(slider.value);
        speedValue.value = `${speed.toFixed(1)}×`;
        document.querySelector('.road-markings').style.animationDuration = `${2.3 / speed}s`;
        document.querySelectorAll('.cloud').forEach((cloud, i) => {
          cloud.style.animationDuration = `${[18, 24, 21][i] / speed}s`;
        });
      });

      document.addEventListener('visibilitychange', () => { lastTime = 0; });
      render();
      updateControls();
      if (playing) frame = requestAnimationFrame(tick);
    })();
  </script>
