<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);

  const REAR = { x: 312, y: 368 };
  const FRONT = { x: 652, y: 368 };
  const BB = { x: 448, y: 384 };
  const CRANK = 26;
  const CHAIN_R = 18;
  const COG_R = 13;
  const ROLL_R = 64;
  const SPEED = 480;

  const HIP_N = { x: 404, y: 298 };
  const HIP_F = { x: 394, y: 292 };
  const SH_N = { x: 428, y: 256 };
  const SH_F = { x: 420, y: 250 };
  const GRIP_N = { x: 508, y: 272 };
  const GRIP_F = { x: 500, y: 264 };

  const THIGH = 66, SHIN = 64, UPPER = 50, FORE = 44;

  function el(name, attrs, parent) {
    const node = document.createElementNS(NS, name);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
    if (parent) parent.appendChild(node);
    return node;
  }

  // bend +1 keeps the joint on the screen-up side of each limb in this pose
  function ik(a, b, l1, l2, bend) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 1e-6;
    const ux = dx / dist;
    const uy = dy / dist;
    if (dist >= l1 + l2 - 1e-4) {
      const len1 = (l1 / (l1 + l2)) * dist;
      return { x: a.x + ux * len1, y: a.y + uy * len1 };
    }
    const along = (l1 * l1 + dist * dist - l2 * l2) / (2 * dist);
    const h = Math.sqrt(Math.max(0, l1 * l1 - along * along));
    return {
      x: a.x + ux * along + uy * bend * h,
      y: a.y + uy * along - ux * bend * h
    };
  }

  function pts(arr) {
    return arr.map((p) => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  }

  function setLimb(ol, ln, points) {
    const v = pts(points);
    ol.setAttribute("points", v);
    ln.setAttribute("points", v);
  }

  function feathers(elbow, hand, count, length) {
    const dx = hand.x - elbow.x;
    const dy = hand.y - elbow.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;
    let downX = -uy;
    let downY = ux;
    if (downY < 0) { downX = -downX; downY = -downY; }
    let d = "";
    for (let i = 0; i < count; i++) {
      const t = 0.08 + (i / (count - 1)) * 0.46;
      const px = elbow.x + dx * t + downX * 8;
      const py = elbow.y + dy * t + downY * 8;
      const fan = (i - (count - 1) / 2) * 0.16;
      const cs = Math.cos(fan);
      const sn = Math.sin(fan);
      const fx = downX * cs - downY * sn;
      const fy = downX * sn + downY * cs;
      const fl = length * (0.82 + i * 0.07);
      const tx = px + fx * fl;
      const ty = py + fy * fl;
      d += "M" + (px + ux * 1.1).toFixed(1) + " " + (py + uy * 1.1).toFixed(1)
        + "L" + (tx + ux * 0.6).toFixed(1) + " " + (ty + uy * 0.6).toFixed(1)
        + "L" + (tx - ux * 0.6).toFixed(1) + " " + (ty - uy * 0.6).toFixed(1)
        + "L" + (px - ux * 1.1).toFixed(1) + " " + (py - uy * 1.1).toFixed(1) + "Z";
    }
    return d;
  }

  function externalTangents(c1, r1, c2, r2) {
    const dx = c2.x - c1.x;
    const dy = c2.y - c1.y;
    const dist = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    const cosTheta = (r1 - r2) / dist;
    if (Math.abs(cosTheta) > 1) return null;
    const theta = Math.acos(cosTheta);
    return [ang + theta, ang - theta].map((t) => ({
      x1: c1.x + r1 * Math.cos(t),
      y1: c1.y + r1 * Math.sin(t),
      x2: c2.x + r2 * Math.cos(t),
      y2: c2.y + r2 * Math.sin(t)
    }));
  }

  function buildSpokes(id, reflector) {
    const g = $(id);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      el("line", {
        x1: Math.cos(a) * 12, y1: Math.sin(a) * 12,
        x2: Math.cos(a) * 44, y2: Math.sin(a) * 44,
        stroke: "#8d99a6", "stroke-width": 2.1, "stroke-linecap": "round"
      }, g);
    }
    el("circle", {
      cy: -40, r: 4.2, fill: reflector, stroke: "#1b2430", "stroke-width": 1
    }, g);
    if (id === "rear-spin") {
      el("circle", {
        r: COG_R, fill: "none", stroke: "#2a3038", "stroke-width": 4.5,
        "stroke-dasharray": "2.2 1.6"
      }, g);
    }
  }

  function rand(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function init() {
    buildSpokes("rear-spin", "#e23b48");
    buildSpokes("front-spin", "#f0c94d");

    const rays = $("sun-rays");
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      el("line", {
        x1: Math.cos(a) * 46, y1: Math.sin(a) * 46,
        x2: Math.cos(a) * 74, y2: Math.sin(a) * 74
      }, rays);
    }

    const tangents = externalTangents(BB, CHAIN_R, REAR, COG_R);
    if (tangents) {
      for (let i = 0; i < 2; i++) {
        const line = i === 0 ? $("chain-a") : $("chain-b");
        line.setAttribute("x1", tangents[i].x1);
        line.setAttribute("y1", tangents[i].y1);
        line.setAttribute("x2", tangents[i].x2);
        line.setAttribute("y2", tangents[i].y2);
      }
    }

    $("near-mitt").setAttribute("cx", GRIP_N.x);
    $("near-mitt").setAttribute("cy", GRIP_N.y);
    $("far-mitt").setAttribute("cx", GRIP_F.x);
    $("far-mitt").setAttribute("cy", GRIP_F.y);

    const ground = $("ground-scroll");
    for (let x = 0; x < 1920; x += 80) {
      el("rect", {
        x, y: 468, width: 42, height: 7, rx: 3, fill: "#f3efe6"
      }, ground);
    }
    for (let i = 0, x = 0; x < 1920; x += 34, i++) {
      const h1 = 14 + rand(i) * 12;
      const h2 = 12 + rand(i + 3) * 14;
      const h3 = 10 + rand(i + 7) * 10;
      const color = rand(i + 1) > 0.45 ? "#6eae45" : "#4f8f38";
      const y = 430;
      el("path", {
        d: "M" + x + " " + y + " Q" + (x - 4) + " " + (y - h1) + " " + (x - 1) + " " + (y - h1 - 2),
        fill: "none", stroke: color, "stroke-width": 2, "stroke-linecap": "round"
      }, ground);
      el("path", {
        d: "M" + (x + 4) + " " + y + " Q" + (x + 6) + " " + (y - h2) + " " + (x + 2) + " " + (y - h2),
        fill: "none", stroke: "#87c35a", "stroke-width": 2, "stroke-linecap": "round"
      }, ground);
      el("path", {
        d: "M" + (x + 8) + " " + y + " Q" + (x + 14) + " " + (y - h3) + " " + (x + 12) + " " + (y - h3 + 2),
        fill: "none", stroke: color, "stroke-width": 1.8, "stroke-linecap": "round"
      }, ground);
      if (i % 5 === 0) {
        el("circle", { cx: x + 6, cy: y - h2 - 1, r: 2.2, fill: "#f2d15a" }, ground);
      } else if (i % 7 === 0) {
        el("circle", { cx: x + 2, cy: y - h1, r: 2, fill: "#e77aa0" }, ground);
      }
    }
    for (let i = 0, x = 20; x < 1920; x += 110, i++) {
      el("ellipse", {
        cx: x, cy: 412 + rand(i + 9) * 8,
        rx: 4 + rand(i + 2) * 3, ry: 2.2,
        fill: rand(i) > 0.5 ? "#f7f3ea" : "#e7b6a0",
        transform: "rotate(" + ((rand(i + 4) * 40 - 20).toFixed(0)) + " " + x + " 414)"
      }, ground);
    }

    const tile = $("mid-tile");
    const copy = tile.cloneNode(true);
    copy.removeAttribute("id");
    copy.setAttribute("transform", "translate(960 0)");
    $("mid-scroll").appendChild(copy);
  }

  function wrap(v, period) {
    return ((v % period) + period) % period;
  }

  function blinkScale(t) {
    const p = t % 3.8;
    if (p < 3.45) return 1;
    const u = (p - 3.45) / 0.18;
    if (u > 1) return 1;
    return 1 - Math.sin(u * Math.PI) * 0.92;
  }

  function sinePath(y, amp, k, phase) {
    let d = "";
    for (let x = 0; x <= 960; x += 14) {
      const yy = y + Math.sin(x * k + phase) * amp;
      d += (x === 0 ? "M" : "L") + x + " " + yy.toFixed(1) + " ";
    }
    return d;
  }

  const farWingOl = $("far-wing-ol");
  const farWingLn = $("far-wing-ln");
  const nearWingOl = $("near-wing-ol");
  const nearWingLn = $("near-wing-ln");
  const legFarOl = $("leg-far-ol");
  const legFarLn = $("leg-far-ln");
  const legNearOl = $("leg-near-ol");
  const legNearLn = $("leg-near-ln");

  function render(t) {
    const dist = t * SPEED;
    const wheelAng = dist / ROLL_R;
    const pedalAng = wheelAng * (COG_R / CHAIN_R) + 0.85;
    const bob = Math.sin(pedalAng * 2) * 2.3;
    const wheelDeg = wheelAng * 180 / Math.PI;
    const pedalDeg = pedalAng * 180 / Math.PI;

    $("ground-scroll").setAttribute("transform", "translate(" + (-wrap(dist, 960)).toFixed(1) + " 0)");
    $("mid-scroll").setAttribute("transform", "translate(" + (-wrap(dist * 0.18, 960)).toFixed(1) + " 0)");

    $("rear-spin").setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
    $("front-spin").setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
    $("chainring-spin").setAttribute("transform", "rotate(" + pedalDeg.toFixed(2) + ")");
    const chainShift = (-pedalAng * CHAIN_R).toFixed(1);
    $("chain-a").setAttribute("stroke-dashoffset", chainShift);
    $("chain-b").setAttribute("stroke-dashoffset", (-chainShift).toString());

    $("sun-rays").setAttribute("transform", "rotate(" + (t * 6).toFixed(2) + ")");
    $("cloud-a").setAttribute("transform", "translate(" + (wrap(180 - t * 16, 1200) - 80).toFixed(1) + " 62)");
    $("cloud-b").setAttribute("transform", "translate(" + (wrap(520 - t * 10, 1200) - 80).toFixed(1) + " 40)");
    $("cloud-c").setAttribute("transform", "translate(" + (wrap(860 - t * 22, 1300) - 80).toFixed(1) + " 96)");

    $("wave-a").setAttribute("d", sinePath(332, 3.2, 0.045, t * 1.4));
    $("wave-b").setAttribute("d", sinePath(352, 2.4, 0.06, -t * 1.1));
    $("wave-c").setAttribute("d", sinePath(372, 3.5, 0.035, t * 0.8));
    $("spark-a").setAttribute("opacity", (0.25 + Math.sin(t * 3.2) * 0.35).toFixed(2));
    $("spark-b").setAttribute("opacity", (0.2 + Math.sin(t * 2.4 + 1) * 0.3).toFixed(2));

    document.querySelectorAll(".boat").forEach((boat, i) => {
      const y = 338 + Math.sin(t * 1.5 + i) * 1.5;
      boat.setAttribute("transform", "translate(730 " + y.toFixed(1) + ")");
    });

    const flapA = 0.82 + Math.sin(t * 5.5) * 0.18;
    const flapB = 0.8 + Math.sin(t * 4.4 + 1.2) * 0.2;
    const gullAx = wrap(760 - dist * 0.22, 1200) - 100;
    const gullBx = wrap(280 - dist * 0.3, 1200) - 100;
    $("gull-a").setAttribute("transform", "translate(" + gullAx.toFixed(1) + " 108) translate(28 8) scale(1 " + flapA.toFixed(3) + ") translate(-28 -8)");
    $("gull-b").setAttribute("transform", "translate(" + gullBx.toFixed(1) + " 146) translate(20 6) scale(1 " + flapB.toFixed(3) + ") translate(-20 -6)");

    for (let i = 0; i < 4; i++) {
      const life = (t * 1.35 + i / 4) % 1;
      const puff = $("dust" + i);
      puff.setAttribute("cx", (REAR.x - 36 - life * 78).toFixed(1));
      puff.setAttribute("cy", (428 - Math.sin(life * Math.PI) * 16).toFixed(1));
      puff.setAttribute("r", (2 + life * 5).toFixed(1));
      puff.setAttribute("opacity", ((1 - life) * 0.32).toFixed(2));
    }
    $("shadow").setAttribute("rx", (166 + Math.sin(pedalAng * 2) * 8).toFixed(1));

    const hipN = { x: HIP_N.x, y: HIP_N.y + bob };
    const hipF = { x: HIP_F.x, y: HIP_F.y + bob };
    const shN = { x: SH_N.x, y: SH_N.y + bob };
    const shF = { x: SH_F.x, y: SH_F.y + bob };

    const nearA = pedalAng;
    const farA = pedalAng + Math.PI;
    const footN = { x: BB.x + Math.cos(nearA) * CRANK, y: BB.y + Math.sin(nearA) * CRANK };
    const footF = { x: BB.x + Math.cos(farA) * CRANK, y: BB.y + Math.sin(farA) * CRANK };
    const kneeN = ik(hipN, footN, THIGH, SHIN, 1);
    const kneeF = ik(hipF, footF, THIGH, SHIN, 1);
    const elbowN = ik(shN, GRIP_N, UPPER, FORE, 1);
    const elbowF = ik(shF, GRIP_F, UPPER, FORE, 1);

    setLimb(legNearOl, legNearLn, [hipN, kneeN, footN]);
    setLimb(legFarOl, legFarLn, [hipF, kneeF, footF]);
    setLimb(nearWingOl, nearWingLn, [shN, elbowN, GRIP_N]);
    setLimb(farWingOl, farWingLn, [shF, elbowF, GRIP_F]);

    $("near-feathers").setAttribute("d", feathers(elbowN, GRIP_N, 4, 30));
    $("far-feathers").setAttribute("d", "");

    $("crank-near").setAttribute("x1", BB.x);
    $("crank-near").setAttribute("y1", BB.y);
    $("crank-near").setAttribute("x2", footN.x);
    $("crank-near").setAttribute("y2", footN.y);
    $("crank-far").setAttribute("x1", BB.x);
    $("crank-far").setAttribute("y1", BB.y);
    $("crank-far").setAttribute("x2", footF.x);
    $("crank-far").setAttribute("y2", footF.y);

    const tiltN = Math.sin(nearA) * 8;
    const tiltF = Math.sin(farA) * 8;
    $("pedal-near").setAttribute("transform", "translate(" + footN.x.toFixed(1) + " " + footN.y.toFixed(1) + ")");
    $("pedal-far").setAttribute("transform", "translate(" + footF.x.toFixed(1) + " " + footF.y.toFixed(1) + ")");
    $("foot-near").setAttribute("transform", "translate(" + footN.x.toFixed(1) + " " + (footN.y - 1).toFixed(1) + ") rotate(" + tiltN.toFixed(1) + ")");
    $("foot-far").setAttribute("transform", "translate(" + footF.x.toFixed(1) + " " + (footF.y - 1).toFixed(1) + ") rotate(" + tiltF.toFixed(1) + ")");

    const bobT = "translate(0 " + bob.toFixed(2) + ")";
    $("torso").setAttribute("transform", bobT);
    $("neckhead").setAttribute("transform", bobT);
    $("tail").setAttribute("transform", "rotate(" + (Math.sin(t * 2.5) * 5).toFixed(2) + " 300 250)");
    $("head").setAttribute("transform", "rotate(" + (Math.sin(t * 1.7) * 2.1 + Math.sin(pedalAng) * 1.1).toFixed(2) + " 430 188)");
    $("pouch").setAttribute("transform", "rotate(" + (Math.sin(t * 3.4) * 3.2).toFixed(2) + " 492 160)");
    const eyeS = blinkScale(t).toFixed(3);
    $("eye").setAttribute("transform", "translate(470 134) scale(1 " + eyeS + ")");

    $("fish").setAttribute("transform", "translate(572 284) rotate(" + (Math.sin(t * 2.1) * 4).toFixed(2) + ")");
    $("fish-tail").setAttribute("transform", "rotate(" + (Math.sin(t * 7.5) * 18).toFixed(2) + " -14 0)");
  }

  init();

  const params = new URLSearchParams(location.search);
  const freeze = params.has("t") ? Number(params.get("t")) : null;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (freeze != null && !Number.isNaN(freeze)) {
    render(freeze);
  } else if (reduce) {
    render(0.45);
  } else {
    const t0 = performance.now();
    const frame = (now) => {
      render((now - t0) / 1000);
      requestAnimationFrame(frame);
    };
    render(0);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
