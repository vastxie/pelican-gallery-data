<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Bike Ride</title>
  <style>
    :root {
      color-scheme: light;
      --sky: #cceffd;
      --cloud: #fff8ec;
      --road: #3f4650;
      --road-line: #f6d365;
      --bike: #23424a;
      --bike-accent: #f28c38;
      --pelican-body: #f8f3df;
      --pelican-wing: #d8d0ba;
      --pelican-beak: #f6b24b;
      --pelican-pouch: #ffcf83;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(#f7fdff, #dff7ff);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      width: min(960px, 94vw);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(35, 66, 74, 0.16);
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(31, 63, 78, 0.18);
      background: var(--sky);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .clouds {
      animation: drift 16s linear infinite;
    }

    .clouds.back {
      opacity: 0.58;
      animation-duration: 24s;
    }

    .ride {
      animation: bob 0.72s ease-in-out infinite;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 20% 30%;
      animation: wingPulse 0.72s ease-in-out infinite;
    }

    .neck {
      transform-box: fill-box;
      transform-origin: 35% 100%;
      animation: neckDip 0.72s ease-in-out infinite;
    }

    .tail {
      transform-box: fill-box;
      transform-origin: 80% 45%;
      animation: tailFlick 0.72s ease-in-out infinite;
    }

    .shadow {
      animation: shadowPulse 0.72s ease-in-out infinite;
      transform-origin: 320px 342px;
    }

    .pedal {
      animation: pedalSpin 0.8s linear infinite;
      transform-origin: 330px 280px;
    }

    .leg-front {
      transform-box: fill-box;
      transform-origin: 85% 0%;
      animation: legFront 0.8s linear infinite;
    }

    .leg-back {
      transform-box: fill-box;
      transform-origin: 15% 0%;
      animation: legBack 0.8s linear infinite;
    }

    .road-lines {
      animation: roadMove 1.1s linear infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes wingPulse {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(8deg) translateY(-1px); }
    }

    @keyframes neckDip {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2.5deg); }
    }

    @keyframes tailFlick {
      0%, 100% { transform: rotate(2deg); }
      50% { transform: rotate(-7deg); }
    }

    @keyframes pedalSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes legFront {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes legBack {
      0%, 100% { transform: rotate(12deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: 0.24; }
      50% { transform: scaleX(0.86); opacity: 0.16; }
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-480px); }
    }

    @keyframes roadMove {
      from { transform: translateX(0); }
      to { transform: translateX(-110px); }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="A looping SVG animation of a pelican riding a bicycle">
    <svg viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
      <title id="title">Pelican riding a bicycle</title>
      <desc id="desc">A cheerful pelican pedals a bicycle along a road while clouds drift through the sky.</desc>

      <defs>
        <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bcecff"/>
          <stop offset="0.68" stop-color="#e7faff"/>
          <stop offset="1" stop-color="#fff6dc"/>
        </linearGradient>
        <linearGradient id="beakGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd06a"/>
          <stop offset="1" stop-color="#ee8f38"/>
        </linearGradient>
        <radialGradient id="wheelShine" cx="36%" cy="32%" r="65%">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.68"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="640" height="360" fill="url(#skyGradient)"/>

      <g class="clouds back">
        <g fill="var(--cloud)">
          <ellipse cx="74" cy="62" rx="42" ry="15"/>
          <ellipse cx="42" cy="65" rx="24" ry="12"/>
          <ellipse cx="108" cy="66" rx="28" ry="12"/>
          <ellipse cx="304" cy="38" rx="38" ry="13"/>
          <ellipse cx="274" cy="41" rx="22" ry="10"/>
          <ellipse cx="334" cy="42" rx="26" ry="10"/>
          <ellipse cx="548" cy="70" rx="40" ry="14"/>
          <ellipse cx="516" cy="73" rx="24" ry="11"/>
          <ellipse cx="580" cy="74" rx="27" ry="11"/>
          <ellipse cx="724" cy="62" rx="42" ry="15"/>
          <ellipse cx="692" cy="65" rx="24" ry="12"/>
          <ellipse cx="758" cy="66" rx="28" ry="12"/>
          <ellipse cx="954" cy="38" rx="38" ry="13"/>
          <ellipse cx="924" cy="41" rx="22" ry="10"/>
          <ellipse cx="984" cy="42" rx="26" ry="10"/>
        </g>
      </g>

      <g class="clouds">
        <g fill="#fffdf7">
          <ellipse cx="198" cy="91" rx="48" ry="17"/>
          <ellipse cx="158" cy="95" rx="27" ry="13"/>
          <ellipse cx="238" cy="96" rx="31" ry="13"/>
          <ellipse cx="460" cy="104" rx="52" ry="18"/>
          <ellipse cx="420" cy="108" rx="28" ry="13"/>
          <ellipse cx="502" cy="109" rx="33" ry="13"/>
          <ellipse cx="848" cy="91" rx="48" ry="17"/>
          <ellipse cx="808" cy="95" rx="27" ry="13"/>
          <ellipse cx="888" cy="96" rx="31" ry="13"/>
        </g>
      </g>

      <path d="M0 230 C80 212 150 232 230 219 C330 203 404 228 492 208 C564 192 610 207 640 198 L640 360 L0 360 Z" fill="#78ba7c"/>
      <path d="M0 246 C86 230 152 250 231 236 C329 220 416 247 510 226 C570 213 615 224 640 215 L640 360 L0 360 Z" fill="#5ca665"/>

      <rect y="294" width="640" height="66" fill="var(--road)"/>
      <g class="road-lines" stroke="var(--road-line)" stroke-width="5" stroke-linecap="round">
        <line x1="20" y1="327" x2="86" y2="327"/>
        <line x1="132" y1="327" x2="198" y2="327"/>
        <line x1="244" y1="327" x2="310" y2="327"/>
        <line x1="356" y1="327" x2="422" y2="327"/>
        <line x1="468" y1="327" x2="534" y2="327"/>
        <line x1="580" y1="327" x2="646" y2="327"/>
        <line x1="692" y1="327" x2="758" y2="327"/>
      </g>

      <ellipse class="shadow" cx="322" cy="336" rx="180" ry="15" fill="#17242a"/>

      <g class="ride">
        <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
          <g>
            <circle cx="203" cy="280" r="53" fill="#f5fcff" stroke="var(--bike)" stroke-width="8"/>
            <circle cx="203" cy="280" r="38" fill="url(#wheelShine)" stroke="#92aeb7" stroke-width="2"/>
            <g stroke="#73909b" stroke-width="2">
              <line x1="203" y1="280" x2="203" y2="229"/>
              <line x1="203" y1="280" x2="203" y2="331"/>
              <line x1="203" y1="280" x2="152" y2="280"/>
              <line x1="203" y1="280" x2="254" y2="280"/>
              <line x1="203" y1="280" x2="167" y2="244"/>
              <line x1="203" y1="280" x2="239" y2="244"/>
              <line x1="203" y1="280" x2="167" y2="316"/>
              <line x1="203" y1="280" x2="239" y2="316"/>
              <animateTransform attributeName="transform" type="rotate" from="0 203 280" to="-360 203 280" dur="0.78s" repeatCount="indefinite"/>
            </g>
          </g>

          <g>
            <circle cx="440" cy="280" r="53" fill="#f5fcff" stroke="var(--bike)" stroke-width="8"/>
            <circle cx="440" cy="280" r="38" fill="url(#wheelShine)" stroke="#92aeb7" stroke-width="2"/>
            <g stroke="#73909b" stroke-width="2">
              <line x1="440" y1="280" x2="440" y2="229"/>
              <line x1="440" y1="280" x2="440" y2="331"/>
              <line x1="440" y1="280" x2="389" y2="280"/>
              <line x1="440" y1="280" x2="491" y2="280"/>
              <line x1="440" y1="280" x2="404" y2="244"/>
              <line x1="440" y1="280" x2="476" y2="244"/>
              <line x1="440" y1="280" x2="404" y2="316"/>
              <line x1="440" y1="280" x2="476" y2="316"/>
              <animateTransform attributeName="transform" type="rotate" from="0 440 280" to="-360 440 280" dur="0.78s" repeatCount="indefinite"/>
            </g>
          </g>

          <g fill="none" stroke="var(--bike)" stroke-width="7">
            <path d="M203 280 L283 218 L330 280 Z"/>
            <path d="M330 280 L440 280 L392 214 L283 218"/>
            <path d="M392 214 L418 178"/>
            <path d="M283 218 L270 184"/>
            <path d="M418 178 C439 175 454 183 463 198"/>
          </g>
          <path d="M252 181 L292 181" stroke="#27353a" stroke-width="9" stroke-linecap="round"/>
          <circle cx="330" cy="280" r="13" fill="var(--bike-accent)" stroke="var(--bike)" stroke-width="5"/>

          <g class="pedal" stroke="var(--bike-accent)" stroke-width="6" stroke-linecap="round">
            <line x1="330" y1="280" x2="356" y2="264"/>
            <line x1="330" y1="280" x2="304" y2="296"/>
            <line x1="348" y1="262" x2="368" y2="262"/>
            <line x1="292" y1="298" x2="312" y2="298"/>
          </g>
        </g>

        <g id="pelican">
          <path class="tail" d="M216 196 C187 180 168 171 150 174 C163 191 184 204 213 209 Z" fill="#c9c0a9" stroke="#7c7466" stroke-width="3"/>

          <path d="M222 198 C246 150 335 142 382 180 C421 211 400 254 331 260 C271 265 210 237 222 198 Z" fill="var(--pelican-body)" stroke="#746e61" stroke-width="4"/>
          <path class="wing" d="M277 188 C315 168 360 180 379 213 C347 226 302 224 267 205 C260 201 264 193 277 188 Z" fill="var(--pelican-wing)" stroke="#7c7466" stroke-width="3"/>
          <path d="M256 216 C281 234 337 239 366 224" fill="none" stroke="#b7ae9d" stroke-width="3" stroke-linecap="round"/>

          <g class="neck">
            <path d="M365 184 C382 152 407 134 435 134 C463 134 477 154 471 176 C466 198 440 203 418 190 C397 178 383 181 365 198" fill="var(--pelican-body)" stroke="#746e61" stroke-width="4"/>
            <path d="M431 147 C459 144 494 151 532 165 C494 176 458 180 426 177 C413 175 411 150 431 147 Z" fill="url(#beakGradient)" stroke="#805c2f" stroke-width="3"/>
            <path d="M430 173 C456 178 486 176 520 166 C496 195 451 204 424 186 C418 182 421 173 430 173 Z" fill="var(--pelican-pouch)" stroke="#9b6b36" stroke-width="3"/>
            <circle cx="438" cy="146" r="4.5" fill="#17242a"/>
            <circle cx="439.5" cy="144.5" r="1.3" fill="#fff"/>
            <path d="M459 162 C479 161 498 163 519 166" fill="none" stroke="#996331" stroke-width="2" stroke-linecap="round"/>
          </g>

          <g fill="none" stroke="#6f6a5f" stroke-width="7" stroke-linecap="round">
            <path class="leg-front" d="M302 245 C314 255 333 260 352 264"/>
            <path class="leg-back" d="M286 246 C282 263 294 284 304 296"/>
          </g>

          <path d="M254 181 C265 167 289 166 301 181" fill="none" stroke="#746e61" stroke-width="5" stroke-linecap="round"/>
          <path d="M248 180 C247 172 252 167 260 166" fill="none" stroke="#746e61" stroke-width="4" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </main>
</body>
</html>
