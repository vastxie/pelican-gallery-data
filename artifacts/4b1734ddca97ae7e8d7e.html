<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root { --cycle: 0.8s; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #3e9fd6;
      font-family: "Hiragino Mincho ProN", "Songti SC", "STSong", serif;
      position: relative;
    }
    svg { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      top: 4.5vh;
      left: 4vw;
      pointer-events: none;
      color: #14364a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.28);
    }
    .overlay .kicker {
      font-size: clamp(11px, 1.2vw, 15px);
      letter-spacing: 0.42em;
      opacity: 0.72;
      margin-bottom: 6px;
    }
    .overlay h1 {
      font-size: clamp(22px, 3.2vw, 36px);
      font-weight: normal;
      line-height: 1.2;
    }
    .overlay .sub {
      margin-top: 6px;
      font-size: clamp(11px, 1.2vw, 14px);
      opacity: 0.7;
    }
    .chain-move {
      animation: chain 0.4s linear infinite;
    }
    @keyframes chain {
      to { stroke-dashoffset: -10.4; }
    }

    .spin, .spin-rev { transform-box: fill-box; transform-origin: center; }

    .bob {
      animation: bob 0.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .pouch {
      animation: pouch var(--cycle) ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 30% 0%;
    }
    @keyframes pouch {
      0%, 100% { transform: scale(1, 1) rotate(0deg); }
      50% { transform: scale(1.04, 0.9) rotate(-2deg); }
    }

    .head-nod {
      animation: nod var(--cycle) ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 15% 80%;
    }
    @keyframes nod {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(4deg); }
    }

    .wing-flex {
      animation: wing var(--cycle) ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 0% 50%;
    }
    @keyframes wing {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-4deg); }
    }

    .tail-wag {
      animation: tail 0.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 100% 50%;
    }
    @keyframes tail {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }

    .fish-flop {
      animation: flop 1.1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 30% 50%;
    }
    .fish-flop.delay { animation-delay: -0.4s; }
    @keyframes flop {
      0%, 100% { transform: rotate(-12deg) translateY(0); }
      50% { transform: rotate(14deg) translateY(-3px); }
    }

    .pouch-fish {
      animation: wiggle 1.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes wiggle {
      0%, 100% { transform: translate(0, 0) rotate(-6deg); }
      50% { transform: translate(3px, 2px) rotate(8deg); }
    }

    .scroll-fg { animation: scroll 3.6s linear infinite; }
    .scroll-road { animation: scroll 4.5s linear infinite; }
    .scroll-mid { animation: scroll 7s linear infinite; }
    .scroll-dune { animation: scroll 11s linear infinite; }
    .scroll-sea { animation: scroll 16s linear infinite; }
    .scroll-far { animation: scroll 38s linear infinite; }
    .cloud-a { animation: cloud 42s linear infinite; }
    .cloud-b { animation: cloud 56s linear infinite; }
    .cloud-c { animation: cloud 34s linear infinite; }
    @keyframes scroll { to { transform: translateX(-1200px); } }
    @keyframes cloud { to { transform: translateX(-1400px); } }


    .shimmer {
      animation: shimmer 3.2s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.55; }
    }
    .wave-a { animation: wavey 4s ease-in-out infinite; }
    .wave-b { animation: wavey 5.2s ease-in-out infinite reverse; }
    .wave-c { animation: wavey 3.4s ease-in-out infinite; }
    @keyframes wavey {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
    }
    .gull {
      animation: gull 18s linear infinite;
    }
    .gull2 { animation: gull 24s linear infinite; animation-delay: -8s; }
    @keyframes gull {
      0% { transform: translate(0, 0); }
      50% { transform: translate(-500px, -18px); }
      100% { transform: translate(-1100px, 8px); }
    }
    .gull-wing {
      animation: flap 0.7s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.45) translateY(2px); }
    }
    .boat { animation: boat 28s linear infinite; }
    @keyframes boat {
      from { transform: translateX(0); }
      to { transform: translateX(-900px); }
    }
    .beacon { animation: beacon 2.4s ease-in-out infinite; }
    @keyframes beacon {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .crab-claw {
      animation: wave-claw 1.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 100% 100%;
    }
    @keyframes wave-claw {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(-28deg); }
    }
    .title-card {
      animation: fadeIn 1.4s ease 0.2s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .shadow-pulse {
      animation: shadow 0.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes shadow {
      0%, 100% { transform: scaleX(1); opacity: 0.22; }
      50% { transform: scaleX(0.88); opacity: 0.16; }
    }
    .sparkle { animation: sparkle 2.8s ease-in-out infinite; }
    .sparkle2 { animation: sparkle 3.6s ease-in-out infinite 1.1s; }
    @keyframes sparkle {
      0%, 100% { opacity: 0.15; }
      40% { opacity: 0.8; }
      60% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="overlay title-card">
    <div class="kicker">PELICAN COAST</div>
    <h1>鹈鹕的海滨骑行</h1>
    <div class="sub">Beach cruiser · 2D SVG</div>
  </div>
  <svg viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

          <path d="M0,0 Q28,-6 58,10 Q24,4 0,0Z" fill="#2d8a58"/>

          <path d="M0,0 Q6,-28 4,-58 Q-8,-26 0,0Z" fill="#349e64"/>

    <!-- SKY -->
    <rect width="1200" height="630" fill="url(#skyGrad)"/>

    <!-- SUN -->
    <g transform="translate(980, 88)">
      <circle r="110" fill="url(#sunGlow)"/>
      <g opacity="0.35" stroke="#ffe27a" stroke-linecap="round">

      </g>
      <circle r="38" fill="#ffe566"/>
      <circle r="38" fill="#fff1a3" opacity="0.35"/>
    </g>

    <!-- CLOUDS -->
    <g class="cloud-a" opacity="0.92">
      <use href="#cloudDef" transform="translate(180, 78) scale(1.1)" fill="#fff"/>
      <use href="#cloudDef" transform="translate(1380, 78) scale(1.1)"/>
      <use href="#cloudDef" transform="translate(620, 50) scale(0.7)" opacity="0.8"/>
      <use href="#cloudDef" transform="translate(1820, 50) scale(0.7)" opacity="0.8"/>
    </g>
    <g class="cloud-b" opacity="0.75">

      <use href="#cloudDef" transform="translate(1630, 110) scale(0.85)"/>

    <g class="cloud-c" opacity="0.85">

      <use href="#cloudDef" transform="translate(2260, 64) scale(1.25)"/>
    </g>

    <!-- DISTANT GULLS -->
    <g transform="translate(1080, 120)" fill="none" stroke="#f7f7f7" stroke-width="2.2" stroke-linecap="round">

        <g class="gull-wing">
          <path d="M-16,2 Q0,-10 8,1 Q16,-9 26,4"/>
        </g>
      </g>
    </g>
    <g transform="translate(980, 155)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">

        <g class="gull-wing">

          <rect x="-6" y="8" width="12" height="8" fill="#c44536"/>

    <!-- OCEAN -->

    <g class="scroll-sea">

    <!-- SAILBOAT -->
    <g transform="translate(1100, 332)">
    <g class="boat">
      <path d="M0,28 L42,28 L32,40 L8,40 Z" fill="#6b4a32"/>

    <!-- FOAM LINE -->
    <path d="M0,418 C80,412 140,426 220,418 C300,410 360,424 440,418 C520,412 580,426 660,418 C740,410 800,424 880,418 C960,412 1040,426 1120,418 C1160,414 1200,420 1200,418 L1200,438 L0,438Z" fill="#f6efe0" opacity="0.85"/>

    <!-- BEACH / DUNES -->
    <rect x="0" y="428" width="1200" height="90" fill="url(#sandGrad)"/>
    <g class="scroll-dune">
      <g>
        <path d="M0,448 C60,436 110,456 180,444 C250,432 300,454 380,442 C460,430 520,452 600,444 C700,432 760,454 860,442 C960,430 1040,450 1220,440 L1220,470 L0,470Z" fill="#e8c27a" opacity="0.55"/>
        <ellipse cx="210" cy="458" rx="18" ry="5" fill="#d2a66a" opacity="0.5"/>
        <ellipse cx="640" cy="462" rx="26" ry="6" fill="#d2a66a" opacity="0.4"/>
        <ellipse cx="980" cy="456" rx="14" ry="4" fill="#d2a66a" opacity="0.5"/>
        <!-- shells -->
        <path d="M400,460 Q406,452 412,460 Q406,458 400,460" fill="#f3d6c0"/>
        <path d="M830,464 Q838,454 846,464 Q838,461 830,464" fill="#eec9b0"/>
        <!-- crab -->
