<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 🚲</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#87CEEB 0 62%,#7ec850 62%);font-family:system-ui,sans-serif;overflow:hidden}
  h1{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3);margin:12px}
  svg{width:min(92vw,800px);height:auto;background:rgba(255,255,255,.15);border-radius:20px}
  .ground-line{stroke-dasharray:40 30;animation:dash 0.6s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-70}}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bike-frame{animation:bob .8s ease-in-out infinite}
  .rider{animation:bob .8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .leg-front{transform-origin:130px 150px;animation:pedal 0.8s linear infinite}
  .leg-back{transform-origin:130px 150px;animation:pedal 0.8s linear infinite reverse}
  @keyframes pedal{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .wing{transform-origin:180px 120px;animation:flap .8s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
  .cloud{animation:drift linear infinite}
  .c1{animation-duration:18s}.c2{animation-duration:26s}.c3{animation-duration:14s}
  @keyframes drift{from{transform:translateX(520px)}to{transform:translateX(-160px)}}
  .beak-pouch{transform-origin:250px 95px;animation:pouch .8s ease-in-out infinite}
  @keyframes pouch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车 🦤</h1>
<svg viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg">
  <!-- 太阳 -->
  <circle cx="430" cy="50" r="32" fill="#FFD93D"/>
  <circle cx="430" cy="50" r="40" fill="#FFD93D" opacity=".3"/>

  <!-- 云 -->
  <g fill="#fff" opacity=".9">
    <g class="cloud c1"><ellipse cx="0" cy="45" rx="34" ry="14"/><ellipse cx="24" cy="38" rx="22" ry="14"/></g>
    <g class="cloud c2"><ellipse cx="0" cy="90" rx="28" ry="11"/><ellipse cx="20" cy="84" rx="18" ry="11"/></g>
    <g class="cloud c3"><ellipse cx="0" cy="25" rx="24" ry="10"/><ellipse cx="18" cy="20" rx="15" ry="9"/></g>
  </g>

  <!-- 地面 -->
  <line x1="0" y1="290" x2="500" y2="290" stroke="#4a7c2e" stroke-width="6" class="ground-line"/>
  <line x1="0" y1="298" x2="500" y2="298" stroke="#5da33a" stroke-width="14"/>

  <!-- 自行车 -->
  <g>
    <!-- 轮子 -->
    <g transform="translate(90,250)">
      <g class="wheel">
        <circle r="40" fill="none" stroke="#222" stroke-width="7"/>
        <circle r="33" fill="none" stroke="#999" stroke-width="2"/>
        <g stroke="#555" stroke-width="2">
          <line x1="-33" y1="0" x2="33" y2="0"/><line x1="0" y1="-33" x2="0" y2="33"/>
          <line x1="-23" y1="-23" x2="23" y2="23"/><line x1="-23" y1="23" x2="23" y2="-23"/>
        </g>
        <circle r="5" fill="#333"/>
      </g>
    </g>
    <g transform="translate(250,250)">
      <g class="wheel">
        <circle r="40" fill="none" stroke="#222" stroke-width="7"/>
        <circle r="33" fill="none" stroke="#999" stroke-width="2"/>
        <g stroke="#555" stroke-width="2">
          <line x1="-33" y1="0" x2="33" y2="0"/><line x1="0" y1="-33" x2="0" y2="33"/>
          <line x1="-23" y1="-23" x2="23" y2="23"/><line x1="-23" y1="23" x2="23" y2="-23"/>
        </g>
        <circle r="5" fill="#333"/>
      </g>
    </g>

    <!-- 车架 -->
    <g class="bike-frame" stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="90" y1="250" x2="150" y2="175"/>
      <line x1="150" y1="175" x2="225" y2="175"/>
      <line x1="225" y1="175" x2="250" y2="250"/>
      <line x1="150" y1="175" x2="130" y2="250"/>
      <line x1="130" y1="250" x2="250" y2="250"/>
      <line x1="225" y1="175" x2="218" y2="140"/>
      <line x1="150" y1="175" x2="142" y2="140"/>
    </g>
    <!-- 车座 / 车把 -->
    <g class="bike-frame">
      <rect x="128" y="132" width="30" height="10" rx="5" fill="#222"/>
      <rect x="206" y="132" width="26" height="10" rx="5" fill="#222"/>
    </g>
    <!-- 脚踏 -->
    <circle cx="130" cy="250" r="9" fill="none" stroke="#222" stroke-width="4"/>
    <g stroke="#222" stroke-width="5" stroke-linecap="round">
      <g class="leg-front"><line x1="130" y1="250" x2="130" y2="228"/></g>
      <g class="leg-back"><line x1="130" y1="250" x2="130" y2="272"/></g>
    </g>

    <!-- 鹈鹕身体 -->
    <g class="rider">
      <!-- 尾巴 -->
      <path d="M140 150 L110 135 L118 155 L108 160 L140 165 Z" fill="#cfd8dc"/>
      <!-- 身体 -->
      <ellipse cx="180" cy="140" rx="48" ry="34" fill="#f5f5f5" stroke="#b0bec5" stroke-width="2"/>
      <!-- 翅膀 -->
      <g class="wing">
        <ellipse cx="175" cy="135" rx="30" ry="14" fill="#90a4ae" transform="rotate(-15 175 135)"/>
        <path d="M150 140 l-18 6 M152 145 l-16 8" stroke="#78909c" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- 腿 (连到脚踏) -->
      <line x1="165" y1="165" x2="130" y2="232" stroke="#ff9f1c" stroke-width="7" stroke-linecap="round"/>
      <line x1="195" y1="165" x2="130" y2="268" stroke="#e08900" stroke-width="7" stroke-linecap="round"/>
      <!-- 脖子 + 头 -->
      <path d="M215 125 C225 100 230 85 245 75" fill="none" stroke="#f5f5f5" stroke-width="18" stroke-linecap="round"/>
      <path d="M215 125 C225 100 230 85 245 75" fill="none" stroke="#b0bec5" stroke-width="20" stroke-linecap="round" opacity=".35"/>
      <circle cx="250" cy="68" r="20" fill="#f5f5f5" stroke="#b0bec5" stroke-width="2"/>
      <circle cx="256" cy="63" r="3.5" fill="#222"/>
      <!-- 帽子 -->
      <rect x="236" y="38" width="28" height="12" rx="3" fill="#e63946"/>
      <rect x="246" y="24" width="14" height="16" rx="2" fill="#e63946"/>
      <!-- 大嘴 + 喉囊 -->
      <path d="M266 66 L330 78 L266 82 Z" fill="#ff9f1c"/>
      <g class="beak-pouch">
        <path d="M268 80 C290 108 315 105 328 78 L268 80 Z" fill="#ffb84d" stroke="#e08900" stroke-width="2"/>
      </g>
      <!-- 翅膀扶着车把 (前肢) -->
      <line x1="200" y1="140" x2="220" y2="138" stroke="#ff9f1c" stroke-width="7" stroke-linecap="round"/>
      <!-- 围巾飘动 -->
      <path d="M232 82 q-20 6 -34 2 q10 8 4 16 q14 -2 32 -8" fill="#e63946">
        <animate attributeName="d" dur="0.6s" repeatCount="indefinite"
          values="M232 82 q-20 6 -34 2 q10 8 4 16 q14 -2 32 -8;
                  M232 82 q-22 2 -36 -2 q12 6 6 15 q14 0 32 -4;
                  M232 82 q-20 6 -34 2 q10 8 4 16 q14 -2 32 -8"/>
      </path>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7">
    <line x1="20" y1="150" x2="70" y2="150"><animate attributeName="x1" values="120;10" dur="0.5s" repeatCount="indefinite"/><animate attributeName="x2" values="170;60" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="10" y1="180" x2="50" y2="180"><animate attributeName="x1" values="110;0" dur="0.4s" repeatCount="indefinite"/><animate attributeName="x2" values="150;40" dur="0.4s" repeatCount="indefinite"/></line>
    <line x1="30" y1="210" x2="80" y2="210"><animate attributeName="x1" values="130;20" dur="0.55s" repeatCount="indefinite"/><animate attributeName="x2" values="180;70" dur="0.55s" repeatCount="indefinite"/></line>
  </g>
</svg>
<p style="color:#fff">纯 SVG + CSS/SMIL 动画 · 无需 JS · 可直接保存打开</p>
</body>
</html>
