<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #1e2a38; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  svg {
    width: min(92vw, 960px); height: auto; display: block;
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
  }
  button {
    padding: 8px 22px; border: 0; border-radius: 999px;
    background: #f2b632; color: #222; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 500" role="img" aria-label="一只鹈鹕骑着自行车的 2D 动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db8ee"/>
      <stop offset="1" stop-color="#d8f1ff"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="-24" cy="6" rx="24" ry="14"/>
      <ellipse cx="0" cy="0" rx="32" ry="21"/>
      <ellipse cx="26" cy="6" rx="26" ry="15"/>
    </g>
    <path id="foot" d="M-10 -4 Q0 -8 8 -4 L18 0 Q20 4 14 5 L-8 5 Q-12 2 -10 -4 Z"
          fill="#f2943a" stroke="#8a4f12" stroke-width="1.5" stroke-linejoin="round"/>
  </defs>

  <!-- 天空、太阳、云 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <g transform="translate(690 88)">
    <g id="rays" stroke="#ffd65c" stroke-width="5" stroke-linecap="round"></g>
    <circle r="36" fill="#ffd65c"/>
  </g>
  <use id="cloud1" href="#cloud" fill="#fff"/>
  <use id="cloud2" href="#cloud" fill="#fff" opacity=".9"/>
  <use id="cloud3" href="#cloud" fill="#fff" opacity=".85"/>

  <!-- 远山（视差滚动） -->
  <path id="hillsFar" fill="#a9dcc1"/>
  <path id="hillsNear" fill="#7cc79b"/>

  <!-- 草地与路面 -->
  <rect y="440" width="800" height="8" fill="#86cf6a"/>
  <rect y="448" width="800" height="52" fill="#4a4f58"/>
  <line id="roadLine" x1="0" y1="476" x2="800" y2="476" stroke="#f4f4f4" stroke-width="4"
        stroke-dasharray="36 28" opacity=".8"/>

  <!-- 鹈鹕和自行车（整体右移 50） -->
  <g transform="translate(50 0)">
    <ellipse cx="385" cy="443" rx="180" ry="6" fill="#000" opacity=".2"/>

    <!-- 后轮 -->
    <g transform="translate(230 372)">
      <circle r="68" fill="none" stroke="#1f1f23" stroke-width="9"/>
      <circle r="60" fill="none" stroke="#c9ced6" stroke-width="3"/>
      <g id="rearSpokes" stroke="#9aa3ad" stroke-width="1.3"></g>
      <circle r="12" fill="none" stroke="#777" stroke-width="3"/>
      <circle r="5" fill="#444"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(530 372)">
      <circle r="68" fill="none" stroke="#1f1f23" stroke-width="9"/>
      <circle r="60" fill="none" stroke="#c9ced6" stroke-width="3"/>
      <g id="frontSpokes" stroke="#9aa3ad" stroke-width="1.3"></g>
      <circle r="5" fill="#444"/>
    </g>

    <!-- 链条、车架、车把、大齿盘 -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M370 354 L230 360 M370 390 L230 384" stroke="#2a2a2a" stroke-width="2.5"/>
      <path d="M370 372 L340 244 M340 244 L482 262 M482 262 L500 322 M370 372 L500 322 M500 322 L530 372 M370 372 L230 372 M340 244 L230 372"
            stroke="#e4572e" stroke-width="7"/>
      <path d="M482 262 L494 236 L522 232 Q532 231 530 242" stroke="#333" stroke-width="5"/>
      <circle cx="370" cy="372" r="18" stroke="#555" stroke-width="3"/>
    </g>
    <!-- 车座 -->
    <rect x="318" y="236" width="44" height="8" rx="4" fill="#2b2b2b"/>

    <!-- 远侧的曲柄、踏板、腿（在身体后面） -->
    <line id="crankFar" x1="370" y1="372" x2="342" y2="372" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
    <rect id="pedalFar" x="-7" y="-2.5" width="14" height="5" rx="2" fill="#222"/>
    <path id="legFar" fill="none" stroke="#c96f22" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <use id="footFar" href="#foot"/>

    <!-- 鹈鹕上半身（会随踏板轻微起伏） -->
    <g id="upper">
      <!-- 尾羽 -->
      <path d="M258 220 Q230 206 198 226 Q220 232 212 254 Q236 246 258 238 Z"
            fill="#7e8a96" stroke="#3d4650" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 身体 -->
      <ellipse cx="300" cy="200" rx="64" ry="44" transform="rotate(-28 300 200)"
               fill="#fbfbf6" stroke="#4a4a4a" stroke-width="3"/>
      <!-- 手臂，伸向车把 -->
      <path d="M312 180 Q400 200 494 236" fill="none" stroke="#4a4a4a" stroke-width="12" stroke-linecap="round"/>
      <path d="M312 180 Q400 200 494 236" fill="none" stroke="#fbfbf6" stroke-width="7" stroke-linecap="round"/>
      <!-- 脖子 -->
      <path d="M345 178 C365 166 362 138 388 120" fill="none" stroke="#4a4a4a" stroke-width="26" stroke-linecap="round"/>
      <path d="M345 178 C365 166 362 138 388 120" fill="none" stroke="#fbfbf6" stroke-width="20" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="400" cy="108" r="19" fill="#fbfbf6" stroke="#4a4a4a" stroke-width="3"/>
      <!-- 头盔 -->
      <path d="M381 104 Q379 84 400 82 Q421 84 421 99 Q400 95 381 104 Z"
            fill="#e63946" stroke="#7a1e25" stroke-width="2" stroke-linejoin="round"/>
      <!-- 嘴袋 -->
      <path d="M412 114 L480 124 Q488 130 478 140 Q460 158 436 150 Q420 140 412 122 Z"
            fill="#f2943a" stroke="#7a4a10" stroke-width="2" stroke-linejoin="round"/>
      <!-- 喙 -->
      <path d="M410 100 L486 118 Q492 121 486 126 L412 116 Z"
            fill="#f7d154" stroke="#7a5a00" stroke-width="2" stroke-linejoin="round"/>
      <!-- 眼睛 -->
      <circle cx="405" cy="109" r="3.6" fill="#222"/>
      <circle cx="406" cy="108" r="1.1" fill="#fff"/>
      <!-- 翅膀（会扇动，原点在肩部） -->
      <g id="wing" transform="translate(312 178) rotate(-28)">
        <path d="M0 -6 C-30 -26 -80 -30 -118 -4 L-112 6 L-98 3 L-108 18 L-88 15 L-96 28 L-68 20 C-44 16 -18 14 0 6 Z"
              fill="#8e99a5" stroke="#3d4650" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M-28 -6 L-66 4 M-50 -12 L-92 -2" fill="none" stroke="#5b6670" stroke-width="2" stroke-linecap="round"/>
      </g>
      <!-- 围巾（随风飘动，画在翅膀上层） -->
      <path id="scarf" d="M350 176 C328 162 304 164 272 176" fill="none"
            stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- 近侧的曲柄、踏板、腿（在身体前面） -->
    <line id="crankNear" x1="370" y1="372" x2="398" y2="372" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <rect id="pedalNear" x="-7" y="-2.5" width="14" height="5" rx="2" fill="#222"/>
    <path id="legNear" fill="none" stroke="#f2943a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <use id="footNear" href="#foot"/>
  </g>
</svg>

<button id="toggle" type="button">暂停</button>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const mod = (a, m) => ((a % m) + m) % m;

  // 运动参数
  const SPEED = 180;                  // 车速 / 路面滚动速度 px/s
  const WHEEL_R = 68;                 // 车轮半径
  const CRANK_SPEED = 2.6;            // 踏板角速度 rad/s
  const CRANK_LEN = 28;               // 曲柄长度
  const CRANK = { x: 370, y: 372 };   // 中轴位置
  const HIP = { x: 330, y: 240 };     // 鹈鹕臀部（坐在车座上）
  const THIGH = 84, SHIN = 84;        // 大腿、小腿长度

  const el = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    parent.appendChild(node);
    return node;
  };

  // 太阳光芒
  const rays = $('rays');
  for (let i = 0; i < 12; i++) {
    const a = i * TAU / 12;
    el('line', {
      x1: (48 * Math.cos(a)).toFixed(1), y1: (48 * Math.sin(a)).toFixed(1),
      x2: (62 * Math.cos(a)).toFixed(1), y2: (62 * Math.sin(a)).toFixed(1),
    }, rays);
  }

  // 辐条：16 根，外圈一个红点，便于看出车轮在转
  const buildSpokes = g => {
    let d = '';
    for (let i = 0; i < 16; i++) {
      const a = i * Math.PI / 8;
      d += `M0 0L${(60 * Math.cos(a)).toFixed(1)} ${(60 * Math.sin(a)).toFixed(1)}`;
    }
    el('path', { d }, g);
    el('circle', { cx: 56, cy: 0, r: 4, fill: '#e4572e', stroke: 'none' }, g);
    return g;
  };
  const rearSpokes = buildSpokes($('rearSpokes'));
  const frontSpokes = buildSpokes($('frontSpokes'));

  // 远山：正弦波，周期内首尾相接，可无缝循环滚动
  const hill = (base, amp, period, phase) => {
    const k = TAU / period;
    let d = 'M-320 500';
    for (let x = -320; x <= 1120; x += 10) {
      const y = base + amp * (Math.sin(k * x + phase) + 0.35 * Math.sin(2 * k * x + 2 * phase));
      d += ` L${x} ${y.toFixed(1)}`;
    }
    return d + ' L1120 500 Z';
  };
  $('hillsFar').setAttribute('d', hill(350, 22, 320, 0));
  $('hillsNear').setAttribute('d', hill(392, 14, 220, 1.3));

  // 云：x0 为初始横坐标，v 为飘动速度
  const clouds = [
    { el: $('cloud1'), x0: 140, y: 70,  s: 1.0, v: 10 },
    { el: $('cloud2'), x0: 600, y: 170, s: 0.8, v: 7 },
    { el: $('cloud3'), x0: 380, y: 40,  s: 0.6, v: 14 },
  ];

  // 腿部两段 IK：膝盖取向前的那个解
  const knee = (h, a) => {
    const dx = a.x - h.x, dy = a.y - h.y;
    const d = Math.min(Math.hypot(dx, dy), THIGH + SHIN - 0.01);
    const base = Math.atan2(dy, dx);
    const cosA = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const alpha = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const k1 = { x: h.x + THIGH * Math.cos(base + alpha), y: h.y + THIGH * Math.sin(base + alpha) };
    const k2 = { x: h.x + THIGH * Math.cos(base - alpha), y: h.y + THIGH * Math.sin(base - alpha) };
    return k1.x > k2.x ? k1 : k2;
  };
  const drawLeg = (path, hip, foot) => {
    const k = knee(hip, foot);
    path.setAttribute('d', `M${hip.x} ${hip.y.toFixed(1)} L${k.x.toFixed(1)} ${k.y.toFixed(1)} L${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`);
  };
  const setLine = (node, p) => {
    node.setAttribute('x2', p.x.toFixed(1));
    node.setAttribute('y2', p.y.toFixed(1));
  };
  const moveTo = (node, p) => node.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);

  // 状态
  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let clock = 0, road = 0, wheelAng = 0, crankAng = 0;

  const btn = $('toggle');
  btn.textContent = playing ? '暂停' : '播放';
  btn.addEventListener('click', () => {
    playing = !playing;
    btn.textContent = playing ? '暂停' : '播放';
  });

  function render() {
    const deg = r => (r * 180 / Math.PI).toFixed(1);

    // 车轮、太阳、云、远山、路面
    rearSpokes.setAttribute('transform', `rotate(${deg(wheelAng)})`);
    frontSpokes.setAttribute('transform', `rotate(${deg(wheelAng)})`);
    rays.setAttribute('transform', `rotate(${(clock * 8).toFixed(1)})`);
    for (const c of clouds) {
      const x = mod(c.x0 - clock * c.v, 1000) - 100;
      c.el.setAttribute('transform', `translate(${x.toFixed(1)} ${c.y}) scale(${c.s})`);
    }
    $('hillsFar').setAttribute('transform', `translate(${(-mod(road * 0.12, 320)).toFixed(1)} 0)`);
    $('hillsNear').setAttribute('transform', `translate(${(-mod(road * 0.35, 220)).toFixed(1)} 0)`);
    $('roadLine').setAttribute('stroke-dashoffset', mod(road, 64).toFixed(1));

    // 鹈鹕起伏、翅膀扇动、围巾飘动
    const bob = -2.2 * Math.abs(Math.sin(crankAng));
    $('upper').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    $('wing').setAttribute('transform', `translate(312 178) rotate(${(-28 + 10 * Math.sin(clock * 9)).toFixed(1)})`);
    const w = 4 * Math.sin(clock * 8);
    $('scarf').setAttribute('d',
      `M350 176 C328 ${(162 + w).toFixed(1)} 304 ${(164 - w).toFixed(1)} 272 ${(176 + w).toFixed(1)}`);

    // 曲柄、踏板、脚（脚踩在踏板上）
    const c = Math.cos(crankAng), s = Math.sin(crankAng);
    const near = { x: CRANK.x + CRANK_LEN * c, y: CRANK.y + CRANK_LEN * s };
    const far = { x: CRANK.x - CRANK_LEN * c, y: CRANK.y - CRANK_LEN * s };
    const hip = { x: HIP.x, y: HIP.y + bob };

    setLine($('crankNear'), near);
    setLine($('crankFar'), far);
    moveTo($('pedalNear'), near);
    moveTo($('footNear'), near);
    moveTo($('pedalFar'), far);
    moveTo($('footFar'), far);
    drawLeg($('legNear'), hip, near);
    drawLeg($('legFar'), hip, far);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (playing) {
      clock += dt;
      road += SPEED * dt;
      wheelAng += SPEED / WHEEL_R * dt;
      crankAng += CRANK_SPEED * dt;
    }
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
