<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: linear-gradient(180deg, #14385c 0%, #1d4e79 100%);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
  }
  .stage {
    width: 100%;
    max-width: 880px;
    background: #0e2f4f;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    overflow: hidden;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .caption {
    color: #d9e8f5;
    letter-spacing: 2px;
    font-size: 14px;
    opacity: .85;
  }
  /* 云朵漂移 */
  .cloud1 { animation: drift 18s ease-in-out infinite alternate; }
  .cloud2 { animation: drift 26s ease-in-out infinite alternate; }
  .cloud3 { animation: drift 22s ease-in-out infinite alternate-reverse; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-70px); }
  }
  /* 路面标线滚动，制造前进感 */
  .roadline { animation: dash 1.1s linear infinite; }
  @keyframes dash {
    to { stroke-dashoffset: -120; }
  }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的2D动画">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7ec8f2"/>
          <stop offset="100%" stop-color="#dff2fc"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fdfaf3"/>
          <stop offset="100%" stop-color="#f1e9da"/>
        </linearGradient>
      </defs>

      <!-- ===== 天空 ===== -->
      <rect x="0" y="0" width="800" height="470" fill="url(#skyGrad)"/>

      <!-- 太阳 -->
      <g>
        <circle cx="700" cy="88" r="58" fill="#ffd84d" opacity="0.35"/>
        <circle cx="700" cy="88" r="44" fill="#ffd84d">
          <animate attributeName="r" values="44;49;44" dur="4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="700" cy="88" r="36" fill="#ffe08a"/>
      </g>

      <!-- 云朵 -->
      <g class="cloud1">
        <ellipse cx="150" cy="108" rx="55" ry="20" fill="#ffffff" opacity="0.92"/>
        <ellipse cx="190" cy="94"  rx="42" ry="18" fill="#ffffff" opacity="0.92"/>
        <ellipse cx="112" cy="100" rx="34" ry="15" fill="#ffffff" opacity="0.92"/>
      </g>
      <g class="cloud2">
        <ellipse cx="450" cy="70" rx="50" ry="17" fill="#ffffff" opacity="0.85"/>
        <ellipse cx="490" cy="58" rx="36" ry="15" fill="#ffffff" opacity="0.85"/>
      </g>
      <g class="cloud3">
        <ellipse cx="620" cy="150" rx="46" ry="16" fill="#ffffff" opacity="0.8"/>
        <ellipse cx="655" cy="140" rx="30" ry="13" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- ===== 远景山丘 ===== -->
      <path d="M0,470 Q130,416 270,470 Z" fill="#8bcb82"/>
      <path d="M190,470 Q360,398 540,470 Z" fill="#72b96a"/>
      <path d="M440,470 Q620,428 800,470 Z" fill="#8bcb82"/>

      <!-- 小树 -->
      <g>
        <rect x="142" y="440" width="8" height="22" rx="3" fill="#7a5230"/>
        <circle cx="146" cy="432" r="18" fill="#5f9e54"/>
        <rect x="648" y="442" width="8" height="20" rx="3" fill="#7a5230"/>
        <circle cx="652" cy="434" r="16" fill="#5f9e54"/>
      </g>

      <!-- ===== 公路 ===== -->
      <rect x="0" y="490" width="800" height="110" fill="#5a5f6a"/>
      <line class="roadline" x1="0" y1="540" x2="800" y2="540" stroke="#e9e3d1" stroke-width="8" stroke-dasharray="70 50"/>

      <!-- 影子 -->
      <ellipse cx="400" cy="505" rx="150" ry="11" fill="#000000" opacity="0.14"/>

      <!-- ===== 车轮 ===== -->
      <g id="wheelRear">
        <circle cx="240" cy="440" r="60" fill="none" stroke="#26282c" stroke-width="9"/>
        <circle cx="240" cy="440" r="52" fill="none" stroke="#8f96a0" stroke-width="3"/>
        <g id="spokesRear"></g>
        <circle cx="240" cy="440" r="6" fill="#3a3d42"/>
        <circle cx="240" cy="440" r="9" fill="#5b6068"/>
        <circle cx="240" cy="440" r="4" fill="#d3d6da"/>
      </g>
      <g id="wheelFront">
        <circle cx="560" cy="440" r="60" fill="none" stroke="#26282c" stroke-width="9"/>
        <circle cx="560" cy="440" r="52" fill="none" stroke="#8f96a0" stroke-width="3"/>
        <g id="spokesFront"></g>
        <circle cx="560" cy="440" r="6" fill="#3a3d42"/>
      </g>

      <!-- 链条 -->
      <line x1="360" y1="405" x2="240" y2="431" stroke="#6f7378" stroke-width="2.5"/>
      <line x1="360" y1="439" x2="240" y2="449" stroke="#6f7378" stroke-width="2.5"/>

      <!-- ===== 远侧腿（在车架之后） ===== -->
      <path id="farLeg" fill="none" stroke="#cf7220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="farPedal">
        <rect x="-11" y="-4" width="22" height="8" rx="3" fill="#2f3237" stroke="#1f2125" stroke-width="1.5"/>
      </g>
      <g id="farFoot">
        <ellipse cx="0" cy="0" rx="11" ry="4.5" fill="#cf7220" stroke="#a85b17" stroke-width="1"/>
      </g>

      <!-- ===== 车架 ===== -->
      <g fill="none" stroke="#d94f3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M340,318 L360,422"/>              <!-- 座管 -->
        <path d="M360,422 L508,332"/>              <!-- 下管 -->
        <path d="M340,318 L528,308"/>              <!-- 上管 -->
        <path d="M340,318 L240,440"/>              <!-- 后上叉 -->
        <path d="M360,422 L240,440"/>              <!-- 后下叉 -->
        <path d="M528,308 L560,440"/>              <!-- 前叉 -->
      </g>
      <!-- 座垫与座管 -->
      <line x1="340" y1="318" x2="340" y2="306" stroke="#8a8f98" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="344" cy="306" rx="21" ry="6" fill="#3a3d42"/>
      <!-- 车把 -->
      <line x1="528" y1="308" x2="538" y2="282" stroke="#44484e" stroke-width="6" stroke-linecap="round"/>
      <path d="M538,282 Q558,274 572,288" fill="none" stroke="#44484e" stroke-width="7" stroke-linecap="round"/>

      <!-- ===== 牙盘 + 曲柄（旋转） ===== -->
      <g id="crank">
        <circle cx="360" cy="422" r="19" fill="none" stroke="#7b828e" stroke-width="4" stroke-dasharray="3 2.5"/>
        <circle cx="360" cy="422" r="15" fill="#5b6068"/>
        <circle cx="360" cy="422" r="8" fill="#d3d6da"/>
        <line x1="360" y1="422" x2="390" y2="422" stroke="#44484e" stroke-width="8" stroke-linecap="round"/>
        <line x1="360" y1="422" x2="330" y2="422" stroke="#44484e" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- ===== 近侧踏板 + 腿（在车架之前） ===== -->
      <g id="nearPedal">
        <rect x="-11" y="-4" width="22" height="8" rx="3" fill="#3a3d42" stroke="#232529" stroke-width="1.5"/>
      </g>
      <path id="nearLeg" fill="none" stroke="#f29a38" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="nearFoot">
        <ellipse cx="0" cy="0" rx="11" ry="4.5" fill="#f29a38" stroke="#c97a1f" stroke-width="1"/>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <g id="rider">
        <!-- 尾巴 -->
        <g id="tail">
          <path d="M240,320 L194,338 L206,356 L240,348 Z" fill="#efe8da" stroke="#ddd2be" stroke-width="1.5"/>
          <path d="M224,326 L204,338" stroke="#d8cdb6" stroke-width="2"/>
        </g>
        <!-- 脖子 -->
        <path d="M340,272 Q372,250 400,240" fill="none" stroke="#faf6ef" stroke-width="34" stroke-linecap="round"/>
        <!-- 身体 -->
        <ellipse cx="300" cy="300" rx="76" ry="54" fill="url(#bodyGrad)" stroke="#e6ddcd" stroke-width="1.5"/>
        <ellipse cx="296" cy="322" rx="52" ry="28" fill="#efe7d8" opacity="0.6"/>
        <!-- 翅膀 -->
        <g id="wing">
          <path d="M330,296 C362,314 358,352 300,362 C260,362 246,342 252,322 C258,298 306,288 330,296 Z"
                fill="#efe8da" stroke="#ddd2be" stroke-width="1.5"/>
          <path d="M300,352 C282,344 264,336 252,326" stroke="#d8cdb6" stroke-width="2" fill="none"/>
          <path d="M312,348 C298,340 284,330 274,318" stroke="#d8cdb6" stroke-width="2" fill="none"/>
        </g>
        <!-- 头部 -->
        <g id="head">
          <circle cx="398" cy="232" r="24" fill="#faf6ef" stroke="#e6ddcd" stroke-width="1.5"/>
          <path d="M398,210 Q395,200 401,196 Q404,202 407,198 Q409,206 405,211 Z"
                fill="#efe8da" stroke="#ddd2be" stroke-width="1"/>
          <circle cx="409" cy="227" r="4" fill="#1c1c1c"/>
          <circle cx="410.5" cy="225.5" r="1.5" fill="#ffffff"/>
          <path d="M416,222 Q486,234 556,258 Q486,244 416,246 Z"
                fill="#f5a13d" stroke="#e08a20" stroke-width="1"/>
          <g id="pouchGroup">
            <path id="pouch" d="M416,246 C460,250 500,256 552,262 C546,282 500,306 458,306 C436,306 422,284 416,246 Z"
                  fill="#f2a558" stroke="#d9852f" stroke-width="1"/>
          </g>
        </g>
      </g>
    </svg>
  </div>
  <div class="caption">鹈鹕骑自行车 · 纯 SVG 2D 动画</div>

<script>
(function () {
  "use strict";

  // ---- 几何常量 ----
  var rearC  = { x: 240, y: 440 };
  var frontC = { x: 560, y: 440 };
  var C      = { x: 360, y: 422 };   // 中轴（牙盘中心）
  var crankLen = 30;                  // 曲柄长度
  var hipNear = { x: 358, y: 352 };   // 近侧髋关节
  var hipFar  = { x: 352, y: 352 };   // 远侧髋关节
  var thigh = 50, shin = 50;          // 大腿 / 小腿长度

  // ---- DOM ----
  var spokesRear  = document.getElementById("spokesRear");
  var spokesFront = document.getElementById("spokesFront");
  var crankEl     = document.getElementById("crank");
  var nearLeg     = document.getElementById("nearLeg");
  var farLeg      = document.getElementById("farLeg");
  var nearFoot    = document.getElementById("nearFoot");
  var farFoot     = document.getElementById("farFoot");
  var nearPedal   = document.getElementById("nearPedal");
  var farPedal    = document.getElementById("farPedal");
  var riderEl     = document.getElementById("rider");
  var wingEl      = document.getElementById("wing");
  var tailEl      = document.getElementById("tail");
  var headEl      = document.getElementById("head");
  var pouchEl     = document.getElementById("pouchGroup");

  // ---- 生成辐条 ----
  function buildSpokes(cx, cy) {
    var s = "";
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      var x2 = cx + 52 * Math.cos(a);
      var y2 = cy + 52 * Math.sin(a);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x2.toFixed(1) +
           '" y2="' + y2.toFixed(1) + '" stroke="#9aa0a8" stroke-width="1.5"/>';
    }
    return s;
  }
  spokesRear.innerHTML  = buildSpokes(rearC.x, rearC.y);
  spokesFront.innerHTML = buildSpokes(frontC.x, frontC.y);

  // ---- 两段骨骼 IK：髋 -> 膝 -> 足 ----
  function ik(hip, foot, l1, l2) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var d  = Math.hypot(dx, dy);
    var a  = Math.atan2(dy, dx);

    if (d >= l1 + l2) {          // 完全伸直
      return { x: hip.x + l1 * Math.cos(a), y: hip.y + l1 * Math.sin(a) };
    }
    if (d <= Math.abs(l1 - l2)) { // 太近
      return { x: hip.x + l1 * Math.cos(a), y: hip.y + l1 * Math.sin(a) };
    }
    var alpha = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d));
    var k1x = hip.x + l1 * Math.cos(a + alpha), k1y = hip.y + l1 * Math.sin(a + alpha);
    var k2x = hip.x + l1 * Math.cos(a - alpha), k2y = hip.y + l1 * Math.sin(a - alpha);
    // 膝盖朝前方（+x 方向）弯曲
    return (k1x >= k2x) ? { x: k1x, y: k1y } : { x: k2x, y: k2y };
  }

  function pedalPos(angle) {
    return { x: C.x + crankLen * Math.cos(angle), y: C.y + crankLen * Math.sin(angle) };
  }

  var theta = 0;
  var speed = 0.06; // 每帧曲柄角增量（弧度）

  function frame(t) {
    theta += speed;

    // 踏板位置
    var pNear = pedalPos(theta);
    var pFar  = pedalPos(theta + Math.PI);

    // 车轮（齿轮比约 2.2，轮转得比曲柄快）
    var wheelDeg = (theta * 2.2) * 180 / Math.PI;
    spokesRear.setAttribute("transform",  "rotate(" + wheelDeg + " " + rearC.x + " " + rearC.y + ")");
    spokesFront.setAttribute("transform", "rotate(" + wheelDeg + " " + frontC.x + " " + frontC.y + ")");

    // 牙盘 + 曲柄
    crankEl.setAttribute("transform", "rotate(" + (theta * 180 / Math.PI) + " " + C.x + " " + C.y + ")");

    // 踏板（保持水平）
    nearPedal.setAttribute("transform", "translate(" + pNear.x + " " + pNear.y + ")");
    farPedal.setAttribute("transform",  "translate(" + pFar.x + " " + pFar.y + ")");

    // 身体上下颠簸（随踩踏节拍）
    var bob = Math.sin(theta * 2) * 2.5;
    var hNear = { x: hipNear.x, y: hipNear.y + bob };
    var hFar  = { x: hipFar.x,  y: hipFar.y  + bob };

    // 腿（髋随身体起伏，足固定在踏板上）
    var kNear = ik(hNear, pNear, thigh, shin);
    var kFar  = ik(hFar,  pFar,  thigh, shin);
    nearLeg.setAttribute("d", "M" + hNear.x + " " + hNear.y + " L" + kNear.x + " " + kNear.y + " L" + pNear.x + " " + pNear.y);
    farLeg.setAttribute("d",  "M" + hFar.x  + " " + hFar.y  + " L" + kFar.x  + " " + kFar.y  + " L" + pFar.x  + " " + pFar.y);

    // 足（固定在踏板上）
    nearFoot.setAttribute("transform", "translate(" + pNear.x + " " + pNear.y + ")");
    farFoot.setAttribute("transform",  "translate(" + pFar.x + " " + pFar.y + ")");

    // 身体起伏
    riderEl.setAttribute("transform", "translate(0 " + bob + ")");

    // 翅膀扇动 / 尾巴摆动 / 头部轻晃 / 喙开合
    wingEl.setAttribute("transform",  "rotate(" + (Math.sin(t / 300) * 14).toFixed(2) + " 330 312)");
    tailEl.setAttribute("transform",  "rotate(" + (Math.sin(t / 260) * 6).toFixed(2)  + " 238 340)");
    headEl.setAttribute("transform",  "rotate(" + (Math.sin(t / 340) * 3).toFixed(2)  + " 398 232)");
    var open = (Math.sin(t / 460) + 1) / 2; // 0..1
    pouchEl.setAttribute("transform", "rotate(" + (open * 9).toFixed(2) + " 416 246)");

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
