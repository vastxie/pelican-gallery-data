<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#eaf6fb, #cfe9f2);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(30, 60, 80, 0.18);
    padding: 18px;
  }
  svg {
    display: block;
    width: min(92vw, 820px);
    height: auto;
    border-radius: 14px;
  }
  .caption {
    color: #3d6b7e;
    margin: 14px 0 6px;
    font-size: 15px;
    letter-spacing: 1px;
  }

  /* 云朵漂移（与骑行方向相反的视差） */
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1200px); }
  }
  .cloud { animation: drift linear infinite; }

  /* 路面虚线后移，速度与车轮转速匹配：周长 2π·45 ≈ 283px / 2s */
  @keyframes dash {
    from { stroke-dashoffset: 40; }
    to   { stroke-dashoffset: 0; }
  }
  .roadline { animation: dash 0.2827s linear infinite; }

  /* 身体随着踩踏上下起伏（每圈两次） */
  @keyframes bob {
    0%, 50%, 100% { transform: translateY(0); }
    25%, 75%      { transform: translateY(-2.5px); }
  }
  .pelBody { animation: bob 1s ease-in-out infinite; }
</style>
</head>
