<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鹈鹕的海边单车之旅</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 0%, #f9e3a7 0, transparent 36rem),
          #0c6174;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      .stage {
        position: relative;
        width: min(100%, 1100px);
        padding: clamp(12px, 2vw, 28px);
      }

      svg {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 28px;
        box-shadow: 0 26px 75px rgb(0 35 49 / 35%);
        background: #bfeaf1;
      }

      .pause-button {
        position: absolute;
        right: clamp(26px, 4vw, 44px);
        top: clamp(26px, 4vw, 44px);
        z-index: 2;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        color: #134654;
        background: rgb(255 255 255 / 82%);
        box-shadow: 0 4px 14px rgb(20 76 84 / 18%);
        font: 700 15px/1 system-ui, sans-serif;
      }

      .pause-button:hover {
        background: #fff;
      }

      .cloud-a {
        animation: drift 24s linear infinite;
      }

      .cloud-b {
        animation: drift 33s -14s linear infinite reverse;
      }

      .distant-birds {
        animation: bird-float 3.2s ease-in-out infinite;
      }

      .rider {
        animation: rider-bob 0.85s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center bottom;
      }

      .wheel {
        animation: spin 0.9s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .crank {
        animation: spin 0.9s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .wing {
        animation: wing-flap 0.85s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 25% 56%;
      }

      .head {
        animation: head-bob 1.7s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 40% 80%;
      }

      .tail-feathers {
        animation: tail-wag 1.7s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: left center;
      }

      .road-dashes {
        animation: road-scroll 1.1s linear infinite;
      }

      .foreground-shrubs {
        animation: shrubs-scroll 5.4s linear infinite;
      }

      .sparkle {
        animation: sparkle 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .sparkle.delay {
        animation-delay: -0.8s;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes rider-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      @keyframes wing-flap {
        0%, 100% { transform: rotate(-2deg) translateY(0); }
        50% { transform: rotate(8deg) translateY(-8px); }
      }

      @keyframes head-bob {
        0%, 100% { transform: rotate(-1deg); }
        50% { transform: rotate(2deg) translate(1px, -2px); }
      }

      @keyframes tail-wag {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(4deg); }
      }

      @keyframes drift {
        from { transform: translateX(-90px); }
        to { transform: translateX(1220px); }
      }

      @keyframes bird-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      @keyframes road-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-110px); }
      }

      @keyframes shrubs-scroll {
        from { transform: translateX(0); }
        to { transform: translateX(-380px); }
      }

      @keyframes sparkle {
        0%, 100% { opacity: .22; transform: scale(.7); }
        50% { opacity: .86; transform: scale(1.12); }
      }

      .paused *,
      .paused animate {
        animation-play-state: paused !important;
      }

      @media (prefers-reduced-motion: reduce) {
        svg *, svg animate {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <button class="pause-button" type="button" aria-label="暂停动画" aria-pressed="false">Ⅱ</button>
      <svg id="pelican-scene" viewBox="0 0 1200 720" role="img" aria-labelledby="scene-title scene-description" xmlns="http://www.w3.org/2000/svg">

        <desc id="scene-description">一只戴着头盔的鹈鹕在海边公路上快乐地骑自行车，车轮和踏板持续转动。</desc>

        <defs>

            <stop offset="1" stop-color="#f9dfa1" />

          <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
            <stop stop-color="#49b9c7" />
            <stop offset="1" stop-color="#147d91" />
          </linearGradient>
          <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
            <stop stop-color="#4b6670" />
            <stop offset="1" stop-color="#2d4651" />

          <linearGradient id="pelican-body" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#fdfcf1" />
            <stop offset=".7" stop-color="#e3edf0" />
            <stop offset="1" stop-color="#bdd6dd" />
          </linearGradient>
          <linearGradient id="pouch" x1="0" x2="0" y1="0" y2="1">
            <stop stop-color="#ffcf74" />
            <stop offset="1" stop-color="#ee8e51" />
          </linearGradient>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" />
          </filter>
          <filter id="small-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2" />
          </filter>
        </defs>

        <!-- 天空和远景 -->
        <rect width="1200" height="720" fill="url(#sky)" />
        <circle cx="945" cy="122" r="57" fill="#fff3bf" opacity=".96" />

        <g class="cloud-a" fill="#fff" opacity=".72">

        <path d="M0 393c94-48 210-37 312 5 94-55 204-44 290 4 116-51 242-43 335 9 88-39 186-39 263-2v151H0Z" fill="#367f80" opacity=".88" />
        <path d="M0 432c123-30 230-22 338 10 116-35 238-29 354 8 116-33 262-29 508 11v108H0Z" fill="url(#sea)" />

        <g fill="none" stroke="#d6fbf3" stroke-linecap="round" opacity=".65">
          <path d="M85 456c59-9 119-9 178 0" stroke-width="5" />
          <path d="M792 454c75-10 151-10 226 0" stroke-width="5" />

        <!-- 沙滩和公路 -->
        <path d="M0 508c131-24 250-20 386 5 173-24 318-23 453 3 131-21 247-17 361 10v76H0Z" fill="#edc985" />

          <rect x="682" y="643" width="62" height="10" rx="5" />
          <rect x="792" y="643" width="62" height="10" rx="5" />
          <rect x="902" y="643" width="62" height="10" rx="5" />
          <rect x="1012" y="643" width="62" height="10" rx="5" />

        <g class="foreground-shrubs">

          </g>
          <g fill="#3e9e87">
            <circle cx="44" cy="572" r="8" /><circle cx="72" cy="580" r="7" />

            <circle cx="900" cy="577" r="8" /><circle cx="950" cy="581" r="7" />
            <circle cx="1100" cy="574" r="9" /><circle cx="1150" cy="579" r="7" />

        </g>

        <!-- 自行车和骑手 -->
        <g class="rider">
          <ellipse cx="568" cy="590" rx="174" ry="20" fill="#173f49" opacity=".22" filter="url(#soft-shadow)" />

          <!-- 车轮 -->

            <g class="wheel">
              <circle r="73" fill="#1e3540" />

          </g>
          <g transform="translate(682 543)">
            <g class="wheel">
              <circle r="73" fill="#1e3540" />
              <circle r="64" fill="#f7ede0" stroke="#8ab0b3" stroke-width="4" />
              <g stroke="#72a0a6" stroke-width="3" opacity=".85">
                <path d="M0-60V60M-60 0H60M-42-42 42 42M42-42-42 42" />
              </g>

          <!-- 车架 -->

            <path d="M456 543 530 435 576 521 456 543 626 437 682 543 576 521 530 435" stroke="#ff9a69" stroke-width="4" />
            <path d="M530 435 518 412" stroke="#264c57" stroke-width="8" />
            <path d="M495 410h54" stroke="#264c57" stroke-width="12" />
            <path d="M626 437 640 390 676 385" stroke="#264c57" stroke-width="8" />
            <path d="M658 380h38" stroke="#264c57" stroke-width="10" />
            <path d="M682 543h24" stroke="#264c57" stroke-width="5" opacity=".65" />
          </g>

          <!-- 后腿：随踏板循环 -->
          <path d="M540 407 L571 458 L523 505" fill="none" stroke="#e58b57" stroke-linecap="round" stroke-linejoin="round" stroke-width="19">
            <animate attributeName="d" dur=".9s" repeatCount="indefinite"
              values="M540 407 L571 458 L523 505;M540 407 L552 472 L555 537;M540 407 L516 461 L587 505;M540 407 L548 446 L555 473;M540 407 L571 458 L523 505" />
          </path>
          <path d="M522 505h23" stroke="#f7a35e" stroke-linecap="round" stroke-width="12">
            <animate attributeName="d" dur=".9s" repeatCount="indefinite"
              values="M522 505h23;M554 537h23;M586 505h23;M554 473h23;M522 505h23" />
          </path>

          <!-- 鹈鹕身体 -->
          <g class="tail-feathers">
            <path d="M467 380c-50-17-81-12-111 16 42-3 60 9 90 32-35-1-58 9-75 29 49 5 80-8 114-41Z" fill="#c3dbe0" stroke="#315b65" stroke-width="5" stroke-linejoin="round" />
            <path d="M461 401c-32-4-55 3-76 21M457 421c-27 2-42 12-56 27" fill="none" stroke="#8db7c0" stroke-width="5" stroke-linecap="round" />

            <path d="M507 322c3-31 15-52 39-71 11-9 17-20 16-31 15 8 17 26 4 45l-26 40 15 31Z" fill="#b7d7dc" />

            <path d="M522 365c22 9 44 22 66 46M513 383c20 9 38 23 57 43M542 346c19 8 36 20 51 35" fill="none" stroke="#d2e7e7" stroke-linecap="round" stroke-width="6" opacity=".9" />

          <path d="M520 410 L515 461 L587 505" fill="none" stroke="#f0a367" stroke-linecap="round" stroke-linejoin="round" stroke-width="20">

              values="M520 410 L515 461 L587 505;M520 410 L548 446 L555 473;M520 410 L553 472 L555 537;M520 410 L573 458 L523 505;M520 410 L515 461 L587 505" />

            <animate attributeName="d" dur=".9s" repeatCount="indefinite"
              values="M586 505h23;M554 473h23;M554 537h23;M522 505h23;M586 505h23" />
          </path>

        <g fill="#f5d281" opacity=".75">
          <circle cx="110" cy="522" r="4" /><circle cx="180" cy="534" r="3" /><circle cx="330" cy="523" r="5" />
          <circle cx="905" cy="531" r="4" /><circle cx="1030" cy="520" r="3" />
        </g>
      </svg>
    </main>

    <script>
      const button = document.querySelector('.pause-button');
      const scene = document.querySelector('#pelican-scene');

      button.addEventListener('click', () => {
        const paused = scene.classList.toggle('paused');
        if (paused) {
          scene.pauseAnimations();
        } else {
          scene.unpauseAnimations();
        }
        button.textContent = paused ? '▶' : 'Ⅱ';
        button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        button.setAttribute('aria-pressed', String(paused));
      });
    </script>
  </body>
</html>
