<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;background:#bfe6ff;overflow:hidden}
  svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="50" ry="16" fill="#fff"/>
      <ellipse cx="-20" cy="-12" rx="24" ry="16" fill="#fff"/>
      <ellipse cx="14" cy="-16" rx="28" ry="18" fill="#fff"/>
    </g>
    <g id="wheel">
      <circle r="52" fill="none" stroke="#333" stroke-width="6"/>
      <circle r="46" fill="none" stroke="#999" stroke-width="1.5"/>
      <g stroke="#888" stroke-width="1.5">
        <line x1="-46" y1="0" x2="46" y2="0"/>
        <line x1="0" y1="-46" x2="0" y2="46"/>
        <line x1="-32.5" y1="-32.5" x2="32.5" y2="32.5"/>
        <line x1="-32.5" y1="32.5" x2="32.5" y2="-32.5"/>
      </g>
      <circle r="5" fill="#555"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="36" fill="#ffe27a"/>

  <!-- 云 -->
  <use href="#cloud" y="80"><animateTransform attributeName="transform" type="translate" from="-100 0" to="900 0" dur="50s" repeatCount="indefinite"/></use>
  <use href="#cloud" y="140"><animateTransform attributeName="transform" type="translate" from="-400 0" to="600 0" dur="70s" repeatCount="indefinite"/></use>

  <!-- 远山 -->
  <path d="M0 360 L120 260 L230 350 L340 240 L470 360 L600 270 L720 350 L800 300 L800 500 L0 500Z" fill="#9dc7a0"/>

  <!-- 地面 -->
  <rect y="400" width="800" height="100" fill="#79b85a"/>
  <rect y="418" width="800" height="60" fill="#6b6b78"/>
  <!-- 滚动的道路标线 -->
  <g stroke="#f5f5f5" stroke-width="4">
    <line x1="0" y1="448" x2="800" y2="448" stroke-dasharray="40 30">
      <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- 滚动的树 -->
  <g>
    <g id="trees">
      <g transform="translate(100 400)"><rect x="-5" y="-40" width="10" height="40" fill="#7a5230"/><circle cy="-60" r="28" fill="#3f8f3f"/></g>
      <g transform="translate(400 400)"><rect x="-5" y="-40" width="10" height="40" fill="#7a5230"/><circle cy="-60" r="34" fill="#4aa04a"/></g>
      <g transform="translate(680 400)"><rect x="-5" y="-40" width="10" height="40" fill="#7a5230"/><circle cy="-60" r="26" fill="#3f8f3f"/></g>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <use href="#trees" x="800">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="6s" repeatCount="indefinite"/>
  </use>

  <!-- 骑行者整体（轻微上下颠簸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- 车轮：后轮(280,400) 前轮(500,400) -->
    <g transform="translate(280 400)"><use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/></use></g>
    <g transform="translate(500 400)"><use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/></use></g>

    <!-- 车架 -->
    <g stroke="#d63b3b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M280 400 L355 400 L330 320 Z"/>
      <path d="M330 320 L472 320 L355 400"/>
      <path d="M472 320 L500 400"/>
      <path d="M472 320 L466 300"/>
    </g>
    <!-- 车把 -->
    <path d="M466 300 L490 296" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <!-- 车座 -->
    <path d="M330 320 L326 300" stroke="#333" stroke-width="5"/>
    <ellipse cx="326" cy="296" rx="20" ry="6" fill="#333"/>

    <!-- 后腿（先画，在身后）与曲柄 -->
    <g transform="translate(355 400)">
      <circle r="14" fill="none" stroke="#444" stroke-width="4"/>
      <!-- 曲柄组：旋转 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-32" stroke="#444" stroke-width="5" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="32" stroke="#444" stroke-width="5" stroke-linecap="round"/>
        <!-- 踏板，反向旋转保持水平 -->
        <g transform="translate(0 -32)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/><rect x="-11" y="-3" width="22" height="6" rx="2" fill="#222"/></g></g>
        <g transform="translate(0 32)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/><rect x="-11" y="-3" width="22" height="6" rx="2" fill="#222"/></g></g>
      </g>
    </g>

    <!-- 腿：用SMIL无法做IK，改用JS更新 -->
    <g id="legs" stroke="#f0a030" stroke-width="7" stroke-linecap="round" fill="none">
      <polyline id="legB" points="0,0 0,0 0,0"/>
      <polyline id="legF" points="0,0 0,0 0,0"/>
    </g>
    <g id="feet" fill="#f0a030">
      <ellipse id="footB" rx="12" ry="4"/>
      <ellipse id="footF" rx="12" ry="4"/>
    </g>

    <!-- 身体 -->
    <g>
      <!-- 尾巴 -->
      <path d="M312 270 L268 290 L316 296Z" fill="#cfd8dc"/>
      <!-- 躯干 -->
      <ellipse cx="350" cy="270" rx="52" ry="36" fill="#f4f4f4" transform="rotate(-15 350 270)"/>
      <!-- 翅膀（伸向车把） -->
      <path d="M340 255 Q400 250 462 298 Q410 300 360 292 Q325 280 340 255Z" fill="#b0bec5" stroke="#90a4ae" stroke-width="2"/>
      <!-- 脖子 -->
      <path d="M385 250 Q420 230 410 190 Q404 170 420 160" stroke="#f4f4f4" stroke-width="20" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="424" cy="156" r="20" fill="#f4f4f4"/>
      <!-- 头冠羽 -->
      <path d="M410 140 Q398 128 394 142 Q402 140 408 150Z" fill="#e0e0e0"/>
      <!-- 眼睛 -->
      <circle cx="430" cy="150" r="4.5" fill="#222"/>
      <circle cx="431.5" cy="148.5" r="1.4" fill="#fff"/>
      <!-- 长嘴：上喙 -->
      <path d="M436 152 L538 160 Q540 166 534 168 L436 166Z" fill="#f2a93b"/>
      <!-- 下喙喉囊 -->
      <path d="M438 166 L530 168 Q490 200 440 176Z" fill="#f7c266">
        <animate attributeName="d" dur="1s" repeatCount="indefinite"
          values="M438 166 L530 168 Q490 200 440 176Z;M438 166 L530 168 Q490 190 440 174Z;M438 166 L530 168 Q490 200 440 176Z"/>
      </path>
      <!-- 嘴尖钩 -->
      <path d="M534 160 Q544 162 540 170 Q538 166 532 166Z" fill="#d9822b"/>
      <!-- 头盔 -->
      <path d="M404 152 Q406 128 428 130 Q442 134 442 146 Q420 140 404 152Z" fill="#2f80ed"/>
      <path d="M404 152 Q420 142 442 146" stroke="#1b5cb8" stroke-width="2" fill="none"/>
    </g>

    <!-- 飘动的围巾 -->
    <path d="M398 208 Q360 200 330 215 Q350 222 372 218 Q350 232 322 240" fill="none" stroke="#ff6f91" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" dur="0.6s" repeatCount="indefinite"
        values="M398 208 Q360 200 330 215 Q350 222 372 218 Q350 232 322 240;
                M398 208 Q360 214 330 200 Q350 214 372 228 Q350 222 322 226;
                M398 208 Q360 200 330 215 Q350 222 372 218 Q350 232 322 240"/>
    </path>
  </g>

  <!-- 速度线 -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8">
    <line x1="120" y1="330" x2="190" y2="330"><animate attributeName="x1" values="220;60" dur="0.6s" repeatCount="indefinite"/><animate attributeName="x2" values="260;120" dur="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="0.6s" repeatCount="indefinite"/></line>
    <line x1="120" y1="370" x2="190" y2="370"><animate attributeName="x1" values="200;40" dur="0.8s" repeatCount="indefinite"/><animate attributeName="x2" values="250;100" dur="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/></line>
  </g>
</svg>

<script>
// 两段腿的简易逆运动学：髋部 -> 膝盖 -> 踏板
const hip = {x: 336, y: 290};   // 髋（接近车座）
const cx = 355, cy = 400, R = 32; // 曲柄中心与半径
const L1 = 62, L2 = 62;         // 大腿、小腿
const $ = id => document.getElementById(id);
const DUR = 1000; // 与SMIL曲柄周期一致 (ms)

function solve(px, py) {
  const dx = px - hip.x, dy = py - hip.y;
  let d = Math.hypot(dx, dy);
  d = Math.min(d, L1 + L2 - 0.5);
  const a = Math.atan2(dy, dx);
  const cosB = (L1*L1 + d*d - L2*L2) / (2*L1*d);
  const b = Math.acos(Math.max(-1, Math.min(1, cosB)));
  // 膝盖朝前（+x）弯曲
  const ka = a - b;
  return {kx: hip.x + L1*Math.cos(ka), ky: hip.y + L1*Math.sin(ka), px, py};
}
function setLeg(leg, foot, theta) {
  // 踏板位置：曲柄从竖直向上起顺时针旋转 theta
  const px = cx + R*Math.sin(theta), py = cy - R*Math.cos(theta);
  const s = solve(px, py);
  leg.setAttribute('points', `${hip.x},${hip.y} ${s.kx},${s.ky} ${px},${py}`);
  foot.setAttribute('cx', px + 6);
  foot.setAttribute('cy', py - 6);
}
// 与SMIL同步：使用文档时间线
const svg = document.querySelector('svg');
function frame() {
  const t = (svg.getCurrentTime() * 1000) % DUR / DUR * Math.PI * 2;
  // 曲柄组 rotate(0→360) 顺时针，起点：曲柄端在 y=-32（上方）为“front”，y=+32 为另一侧
  setLeg($('legF'), $('footF'), t);
  setLeg($('legB'), $('footB'), t + Math.PI);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
