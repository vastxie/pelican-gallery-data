<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑自行车的鹈鹕 · Pelican on a Bicycle</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; gap: 14px; padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #fef6e4, #eaf2fb 60%, #dfeaf7);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", Segoe UI, Roboto, sans-serif;
    color: #33404f;
  }
  h1 { margin: 0; font-size: clamp(18px, 3.4vw, 28px); font-weight: 700; letter-spacing: .5px; }
  p.sub { margin: 0 0 4px; font-size: 13px; opacity: .65; }
  .stage {
    width: min(920px, 96vw);
    border-radius: 22px;
    background: linear-gradient(#eafaff, #f3fdff);
    box-shadow: 0 24px 60px -22px rgba(40,70,110,.45), inset 0 0 0 1px rgba(255,255,255,.6);
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }

  /* --- ambient (decorative) animations in CSS --- */
  #clouds  { animation: cloudmove 26s linear infinite; }
  #dashes  { animation: dash 0.42s linear infinite; }
  .speed   { stroke: #ffffff; stroke-width: 5; stroke-linecap: round; opacity: 0;
             animation: zoom 0.9s linear infinite; }
  .speed:nth-child(2){ animation-delay: .30s; }
  .speed:nth-child(3){ animation-delay: .55s; }
  .speed:nth-child(4){ animation-delay: .15s; }

  @keyframes cloudmove { to { transform: translateX(-800px); } }
  @keyframes dash      { to { transform: translateX(-64px);  } }
  @keyframes zoom {
    0%   { transform: translateX(190px); opacity: 0; }
    18%  { opacity: .7; }
    100% { transform: translateX(-280px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #clouds, #dashes, .speed { animation: none; }
  }
</style>
</head>
<body>
  <h1>🚲 骑自行车的鹈鹕</h1>
  <p class="sub">SVG + JavaScript · 车轮旋转 · 脚踏板联动 · 逆向运动学蹬车</p>

  <div class="stage">
  <svg id="art" viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" aria-label="一只鹈鹕在骑自行车的2D动画">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"  stop-color="#bfe9ff"/>
        <stop offset="1"  stop-color="#f0fbff"/>
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5a5f6b"/>
        <stop offset="1" stop-color="#3b3f49"/>
      </linearGradient>
      <radialGradient id="body" cx="0.4" cy="0.35" r="0.85">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#e5ebf2"/>
      </radialGradient>
      <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd166"/>
        <stop offset="1" stop-color="#ff9f1c"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0"   stop-color="#fff6c9"/>
        <stop offset="0.7" stop-color="#ffe27a"/>
        <stop offset="1"   stop-color="#ffe27a" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="6"/>
      </filter>

      <!-- one repeating cloud group, reused twice for seamless scroll -->
      <g id="cloudset" fill="#ffffff" opacity="0.92">
        <g transform="translate(150,104)">
          <ellipse cx="0" cy="0" rx="34" ry="22"/><ellipse cx="30" cy="7" rx="26" ry="18"/>
          <ellipse cx="-28" cy="8" rx="24" ry="16"/><rect x="-52" y="2" width="104" height="20" rx="10"/>
        </g>
        <g transform="translate(470,66) scale(0.8)">
          <ellipse cx="0" cy="0" rx="34" ry="22"/><ellipse cx="30" cy="7" rx="26" ry="18"/>
          <ellipse cx="-28" cy="8" rx="24" ry="16"/><rect x="-52" y="2" width="104" height="20" rx="10"/>
        </g>
        <g transform="translate(680,132) scale(1.12)">
          <ellipse cx="0" cy="0" rx="34" ry="22"/><ellipse cx="30" cy="7" rx="26" ry="18"/>
          <ellipse cx="-28" cy="8" rx="24" ry="16"/><rect x="-52" y="2" width="104" height="20" rx="10"/>
        </g>
      </g>
    </defs>

    <!-- sky & sun -->
    <rect x="0" y="0" width="800" height="470" fill="url(#sky)"/>
    <circle cx="120" cy="92" r="70" fill="url(#sun)"/>
    <circle cx="120" cy="92" r="34" fill="#fff2ad"/>

    <!-- clouds (two copies, 800 apart, scroll seamlessly) -->
    <g id="clouds">
      <use href="#cloudset" x="0"/>
      <use href="#cloudset" x="800"/>
    </g>

    <!-- rolling hills -->
    <path d="M0,392 C140,352 300,368 450,382 C600,396 700,360 800,374 L800,392 Z" fill="#a9dfba"/>
    <path d="M0,394 C180,372 340,392 520,388 C650,385 730,398 800,390 L800,470 L0,470 Z" fill="#8fd3a3" opacity="0.55"/>

    <!-- road -->
    <rect x="0" y="392" width="800" height="78" fill="url(#road)"/>
    <line x1="0" y1="393" x2="800" y2="393" stroke="#727684" stroke-width="2"/>
    <g id="dashes" fill="#f4c430">
      <rect x="-64" y="428" width="36" height="7" rx="3.5"/>
      <rect x="0"   y="428" width="36" height="7" rx="3.5"/>
      <rect x="64"  y="428" width="36" height="7" rx="3.5"/>
      <rect x="128" y="428" width="36" height="7" rx="3.5"/>
      <rect x="192" y="428" width="36" height="7" rx="3.5"/>
      <rect x="256" y="428" width="36" height="7" rx="3.5"/>
      <rect x="320" y="428" width="36" height="7" rx="3.5"/>
      <rect x="384" y="428" width="36" height="7" rx="3.5"/>
      <rect x="448" y="428" width="36" height="7" rx="3.5"/>
      <rect x="512" y="428" width="36" height="7" rx="3.5"/>
      <rect x="576" y="428" width="36" height="7" rx="3.5"/>
      <rect x="640" y="428" width="36" height="7" rx="3.5"/>
      <rect x="704" y="428" width="36" height="7" rx="3.5"/>
      <rect x="768" y="428" width="36" height="7" rx="3.5"/>
    </g>

    <!-- speed lines trailing the bike -->
    <g>
      <line class="speed" x1="120" y1="330" x2="180" y2="330"/>
      <line class="speed" x1="120" y1="360" x2="185" y2="360"/>
      <line class="speed" x1="120" y1="300" x2="170" y2="300"/>
      <line class="speed" x1="120" y1="410" x2="180" y2="410"/>
    </g>

    <!-- ground shadow -->
    <ellipse cx="400" cy="462" rx="185" ry="16" fill="#1f2530" opacity="0.22" filter="url(#soft)"/>

    <!-- everything that gently bobs while pedalling -->
    <g id="scene">

      <!-- ===== BICYCLE ===== -->
      <g id="bike">
        <!-- wheels (filled by JS) -->
        <g id="rearWheel"></g>
        <g id="frontWheel"></g>

        <!-- chain -->
        <path d="M400,373 L252,381 M400,403 L252,396" stroke="#2b2f36" stroke-width="3" fill="none"/>

        <!-- frame (red tubes) -->
        <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
          <line x1="250" y1="388" x2="400" y2="388"/> <!-- chain stay -->
          <line x1="250" y1="388" x2="382" y2="282"/> <!-- seat stay -->
          <line x1="400" y1="388" x2="382" y2="282"/> <!-- seat tube -->
          <line x1="400" y1="388" x2="545" y2="302"/> <!-- down tube -->
          <line x1="382" y1="282" x2="552" y2="272"/> <!-- top tube -->
          <line x1="550" y1="388" x2="545" y2="302"/> <!-- fork -->
          <line x1="545" y1="302" x2="552" y2="272"/> <!-- head tube -->
        </g>

        <!-- handlebar + stem -->
        <g stroke="#2b2f36" stroke-width="7" stroke-linecap="round" fill="none">
          <line x1="552" y1="272" x2="566" y2="252"/>
          <path d="M544,258 Q568,246 592,251"/>
        </g>
        <circle cx="591" cy="251" r="5" fill="#20232b"/>

        <!-- saddle -->
        <path d="M360,280 Q382,270 404,278 Q393,287 372,287 Q362,285 360,280 Z" fill="#2b2f36"/>

        <!-- crank + pedals (rotated by JS around 400,388) -->
        <g id="crank">
          <line x1="400" y1="388" x2="434" y2="388" stroke="#565b66" stroke-width="7" stroke-linecap="round"/>
          <rect x="424" y="383" width="26" height="7" rx="3" fill="#20232b"/>
          <line x1="400" y1="388" x2="366" y2="388" stroke="#565b66" stroke-width="7" stroke-linecap="round"/>
          <rect x="350" y="383" width="26" height="7" rx="3" fill="#20232b"/>
          <circle cx="400" cy="388" r="15" fill="#3a3f49"/>
          <circle cx="400" cy="388" r="7"  fill="#20232b"/>
        </g>
      </g>

      <!-- far leg (behind body) -->
      <g id="farLeg" opacity="0.9"></g>

      <!-- ===== PELICAN ===== -->
      <!-- tail (behind body) -->
      <path d="M306,232 L262,210 L294,240 L258,250 L298,258 L266,276 L308,262 Z"
            fill="#eef2f7" stroke="#d3dae2" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- body -->
      <path d="M298,252 C296,214 322,192 360,192 C398,192 424,214 424,250
               C424,286 400,306 360,306 C322,306 300,290 298,252 Z"
            fill="url(#body)" stroke="#d3dae2" stroke-width="2"/>
      <ellipse cx="350" cy="264" rx="40" ry="32" fill="#ffffff" opacity="0.5"/>

      <!-- neck -->
      <path d="M410,246 C398,206 418,180 452,170 L472,190
               C446,198 432,216 430,250 Z"
            fill="url(#body)" stroke="#d3dae2" stroke-width="2"/>

      <!-- head -->
      <circle cx="478" cy="158" r="26" fill="url(#body)" stroke="#d3dae2" stroke-width="2"/>

      <!-- beak: upper mandible + pouch -->
      <path d="M500,158 Q560,166 596,169 Q560,205 522,200 Q502,196 498,172 Q497,163 500,158 Z"
            fill="url(#pouch)" stroke="#e0900a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M498,148 Q545,146 600,163 Q603,168 596,171 Q545,160 500,161 Q497,155 498,148 Z"
            fill="#ffb703" stroke="#e0900a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M500,160 Q548,161 595,167" stroke="#d98a12" stroke-width="1.6" fill="none"/>

      <!-- eye + brow -->
      <circle cx="487" cy="150" r="5.6" fill="#1b2333"/>
      <circle cx="489" cy="148" r="1.8" fill="#ffffff"/>
      <path d="M476,139 L493,143" stroke="#1b2333" stroke-width="3" stroke-linecap="round"/>

      <!-- helmet -->
      <path d="M451,152 C455,123 501,123 505,152 Q478,141 451,152 Z"
            fill="#06b6d4" stroke="#0e8fa3" stroke-width="2"/>
      <path d="M457,146 Q478,138 499,146" stroke="#7ff0ff" stroke-width="2.5" fill="none" opacity="0.8"/>
      <line x1="478" y1="123" x2="478" y2="112" stroke="#0e8fa3" stroke-width="3" stroke-linecap="round"/>
      <path d="M456,156 L470,178 M500,156 L487,178" stroke="#1b2333" stroke-width="2" fill="none"/>

      <!-- near wing reaching the handlebar -->
      <path d="M402,214 C440,206 500,214 545,232 C566,240 580,246 588,250
               C582,258 560,258 540,254 C500,246 452,246 420,252
               C408,254 400,236 402,214 Z"
            fill="#eef2f7" stroke="#cfd6df" stroke-width="2" stroke-linejoin="round"/>
      <path d="M440,244 Q472,239 504,246 M452,235 Q482,231 512,238 M430,250 Q470,247 508,253"
            stroke="#cfd6df" stroke-width="1.6" fill="none"/>

      <!-- near leg (in front of body) -->
      <g id="nearLeg"></g>
    </g>
  </svg>
  </div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const DEG = 180 / Math.PI;

  // ---- geometry ----
  const C       = { x: 400, y: 388 };   // bottom bracket / crank center
  const CRANK_R = 34;
  const rearC   = { x: 250, y: 388 };
  const frontC  = { x: 550, y: 388 };
  const WHEEL_R = 70;
  const hipNear = { x: 406, y: 300 };
  const hipFar  = { x: 390, y: 303 };
  const L1 = 60, L2 = 66;               // thigh, shin lengths

  const add = (parent, tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    parent.appendChild(el);
    return el;
  };

  // ---- build a spoked wheel ----
  function buildWheel(g, cx, cy) {
    add(g, "circle", { cx, cy, r: WHEEL_R, fill: "#20232b" });      // tire
    add(g, "circle", { cx, cy, r: WHEEL_R - 9, fill: "#f3f6fa" });  // rim face
    add(g, "circle", { cx, cy, r: WHEEL_R - 9, fill: "none", stroke: "#c3c9d2", "stroke-width": 4 });
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5;
      add(g, "line", {
        x1: cx + Math.cos(a) * 12, y1: cy + Math.sin(a) * 12,
        x2: cx + Math.cos(a) * (WHEEL_R - 12), y2: cy + Math.sin(a) * (WHEEL_R - 12),
        stroke: "#b9c0cb", "stroke-width": 2.4
      });
    }
    // one marker spoke so rotation is obvious
    add(g, "line", {
      x1: cx, y1: cy,
      x2: cx + Math.cos(-0.6) * (WHEEL_R - 12), y2: cy + Math.sin(-0.6) * (WHEEL_R - 12),
      stroke: "#e63946", "stroke-width": 3.2
    });
    add(g, "circle", { cx, cy, r: 9, fill: "#5b616b" });
    add(g, "circle", { cx, cy, r: 4, fill: "#20232b" });
  }
  buildWheel(document.getElementById("rearWheel"),  rearC.x,  rearC.y);
  buildWheel(document.getElementById("frontWheel"), frontC.x, frontC.y);

  // ---- build a two-segment leg ----
  function makeLeg(parent) {
    return {
      to: add(parent, "line", { stroke: "#c9691f", "stroke-width": 19, "stroke-linecap": "round" }),
      ti: add(parent, "line", { stroke: "#f4832f", "stroke-width": 13, "stroke-linecap": "round" }),
      so: add(parent, "line", { stroke: "#c9691f", "stroke-width": 16, "stroke-linecap": "round" }),
      si: add(parent, "line", { stroke: "#f89b4a", "stroke-width": 10, "stroke-linecap": "round" }),
      knee: add(parent, "circle", { r: 5.5, fill: "#f4832f", stroke: "#c9691f", "stroke-width": 2 }),
      foot: add(parent, "path", {
        d: "M-8,-4 Q-11,4 -5,7 L20,8 Q31,7 31,1 Q31,-5 20,-5 Z",
        fill: "#f4832f", stroke: "#c9691f", "stroke-width": 2, "stroke-linejoin": "round"
      })
    };
  }
  const nearL = makeLeg(document.getElementById("nearLeg"));
  const farL  = makeLeg(document.getElementById("farLeg"));

  const pedalPos = a => ({ x: C.x + CRANK_R * Math.cos(a), y: C.y + CRANK_R * Math.sin(a) });

  // 2-bone inverse kinematics: reach foot F from hip H; knee points forward
  function ik(H, F, l1, l2) {
    let dx = F.x - H.x, dy = F.y - H.y;
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(l1 - l2) + 0.5, Math.min(l1 + l2 - 0.5, d));
    const ang = Math.atan2(dy, dx);
    const foot = { x: H.x + d * Math.cos(ang), y: H.y + d * Math.sin(ang) };
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const px = H.x + a * Math.cos(ang), py = H.y + a * Math.sin(ang);
    const ox = -Math.sin(ang), oy = Math.cos(ang);
    const k1 = { x: px + h * ox, y: py + h * oy };
    const k2 = { x: px - h * ox, y: py - h * oy };
    const knee = k1.x > k2.x ? k1 : k2;   // knee toward the front of the bike
    return { knee, foot };
  }

  const seg = (el, a, b) => {
    el.setAttribute("x1", a.x.toFixed(1)); el.setAttribute("y1", a.y.toFixed(1));
    el.setAttribute("x2", b.x.toFixed(1)); el.setAttribute("y2", b.y.toFixed(1));
  };
  function setLeg(L, hip, angle) {
    const { knee, foot } = ik(hip, pedalPos(angle), L1, L2);
    seg(L.to, hip, knee); seg(L.ti, hip, knee);
    seg(L.so, knee, foot); seg(L.si, knee, foot);
    L.knee.setAttribute("cx", knee.x.toFixed(1));
    L.knee.setAttribute("cy", knee.y.toFixed(1));
    L.foot.setAttribute("transform", `translate(${foot.x.toFixed(1)} ${foot.y.toFixed(1)}) rotate(-4)`);
  }

  const rear  = document.getElementById("rearWheel");
  const front = document.getElementById("frontWheel");
  const crank = document.getElementById("crank");
  const scene = document.getElementById("scene");

  function tick(ts) {
    const s = ts / 1000;
    const crankA = s * 3.0;    // pedalling speed (rad/s)
    const wheelA = s * 4.7;    // wheels spin a bit quicker

    rear.setAttribute("transform",  `rotate(${(wheelA * DEG).toFixed(2)} ${rearC.x} ${rearC.y})`);
    front.setAttribute("transform", `rotate(${(wheelA * DEG).toFixed(2)} ${frontC.x} ${frontC.y})`);
    crank.setAttribute("transform", `rotate(${(crankA * DEG).toFixed(2)} ${C.x} ${C.y})`);

    setLeg(nearL, hipNear, crankA);
    setLeg(farL,  hipFar,  crankA + Math.PI);

    const bob = Math.sin(crankA * 2) * 2.2;
    scene.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
