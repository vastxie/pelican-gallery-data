<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  :root {
    --sky-top: #123a63;
    --sky-mid: #4f8fbe;
    --sky-bot: #ffd9a0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    background: radial-gradient(120% 120% at 50% 0%, #1b2740 0%, #0d1320 60%, #070a11 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #dfe7f3;
    padding: 24px 18px 32px;
  }
  .stage {
    width: min(1120px, 100%);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 {
    margin: 0;
    font-size: clamp(16px, 2.4vw, 22px);
    font-weight: 600;
    letter-spacing: .04em;
    text-align: center;
    color: #eaf1fb;
  }
  h1 span { color: #ffc46b; }
  .frame {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: #0b1220;
    box-shadow:
      0 1px 0 rgba(255,255,255,.08) inset,
      0 30px 70px -20px rgba(0,0,0,.85),
      0 0 0 1px rgba(255,255,255,.07);
  }
  svg.scene { display: block; width: 100%; height: auto; }
  .hint {
    text-align: center;
    font-size: 12.5px;
    line-height: 1.7;
    color: #8fa2bd;
    margin: 0;
  }
  .hint code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    background: rgba(255,255,255,.07);
    padding: 1px 6px;
    border-radius: 6px;
    color: #cfe0f5;
  }

  /* ---------- 全局动画常量：踩踏一圈 = 1.5s ---------- */
  .spin-wheel { animation: spin 3s linear infinite; }        /* 车轮：每 3s 一圈 */
  .spin-crank { animation: spin 1.5s linear infinite; }      /* 曲柄：每 1.5s 一圈（齿比 2:1）*/
  .bob-bike   { animation: bobBike 0.75s ease-in-out infinite; }
  .bob-body   { animation: bobBody 0.75s ease-in-out infinite; }
  .bob-head   { animation: bobHead 0.75s ease-in-out infinite; }
  .nod-head   { animation: nodHead 1.5s ease-in-out infinite; }
  .leg-a      { animation: pedalA 1.5s linear infinite; }
  .leg-b      { animation: pedalB 1.5s linear infinite; }
  .tail-wag   { animation: tailWag 0.75s ease-in-out infinite; transform-box: fill-box; transform-origin: 12% 15%; }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes bobBike {
    0%, 100% { transform: translateY(0)     rotate(-0.7deg); }
    50%      { transform: translateY(-3.2px) rotate(0.7deg); }
  }
  @keyframes bobBody {
    0%, 100% { transform: translateY(0.6px)  scale(1); }
    50%      { transform: translateY(-4.4px) scale(1.012); }
  }
  @keyframes bobHead {
    0%, 100% { transform: translateY(1.6px); }
    50%      { transform: translateY(-3.4px); }
  }
  @keyframes nodHead {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(2deg); }
  }

  /* 踏板圆周轨迹：圆心 (462,452)，半径 26 → 左脚自下死点起，右脚反相 */
  @keyframes pedalA {
    0%   { transform: translate(0px, 26px); }
    25%  { transform: translate(-26px, 0px); }
    50%  { transform: translate(0px, -26px); }
    75%  { transform: translate(26px, 0px); }
    100% { transform: translate(0px, 26px); }
  }
  @keyframes pedalB {
    0%   { transform: translate(0px, -26px); }
    25%  { transform: translate(26px, 0px); }
    50%  { transform: translate(0px, 26px); }
    75%  { transform: translate(-26px, 0px); }
    100% { transform: translate(0px, -26px); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3.5deg); }
  }

  /* 背景滚动：精确一个图案周期，保证无缝循环 */
  @keyframes drift { to { transform: translateX(-480px); } }
  @keyframes hills { to { transform: translateX(-240px); } }
  @keyframes road  { to { transform: translateX(-120px); } }
  .clouds   { animation: drift 46s linear infinite; }
  .clouds.b { animation-duration: 74s; animation-delay: -12s; opacity: .75; }
  .hills    { animation: hills 16s linear infinite; }
  .hills.slow { animation-duration: 34s; }
  .road     { animation: road 0.9s linear infinite; }

  @keyframes zoom {
    0%   { opacity: 0; transform: translateX(0) scaleX(.5); }
    35%  { opacity: .85; }
    100% { opacity: 0; transform: translateX(-230px) scaleX(1.4); }
  }
  .streak { animation: zoom 1.4s ease-out infinite; }
  .streak:nth-of-type(2) { animation-delay: .3s; }
  .streak:nth-of-type(3) { animation-delay: .62s; }
  .streak:nth-of-type(4) { animation-delay: .95s; }

  @keyframes glow {
    0%, 100% { opacity: .5; transform: scale(1); }
    50%      { opacity: .85; transform: scale(1.06); }
  }
  .sun-glow { animation: glow 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  @media (prefers-reduced-motion: reduce) {
    .spin-wheel, .spin-crank, .bob-bike, .bob-body, .bob-head,
    .nod-head, .leg-a, .leg-b, .tail-wag,
    .clouds, .hills, .road, .streak, .sun-glow {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <h1>骑自行车的鹈鹕 <span>·</span> SVG 2D 动画</h1>

  <div class="frame">

          <line x1="78" y1="438" x2="202" y2="438"/>
          <line x1="78" y1="468" x2="202" y2="468"/>
          <line x1="78" y1="498" x2="202" y2="498"/>
          <line x1="112" y1="390" x2="168" y2="516"/>
          <line x1="140" y1="380" x2="140" y2="526"/>
          <line x1="168" y1="390" x2="112" y2="516"/>
        </g>
      </defs>

      <g clip-path="url(#sceneClip)">

        <!-- ============ 天空 ============ -->
        <rect x="0" y="0" width="960" height="540" fill="url(#sky)"/>

        <g class="sun-glow">
          <circle cx="246" cy="150" r="104" fill="url(#sunGrad)" opacity=".8"/>
        </g>
        <circle cx="246" cy="150" r="38" fill="#fff2cd" opacity=".92"/>

          <path transform="translate(480,14) scale(1.15)" d="M-40 402 C 20 340, 90 342, 150 392 C 205 436, 250 430, 300 386 C 356 336, 420 340, 480 396 C 536 448, 600 444, 660 394 C 716 348, 780 350, 840 398 C 900 446, 960 442, 1020 396 L 1020 470 L -40 470 Z"/>

          <path transform="translate(480,0)" d="M-40 430 C 30 372, 110 366, 176 412 C 244 460, 300 452, 360 414 C 424 372, 500 378, 566 420 C 632 462, 700 452, 764 412 C 830 370, 900 374, 960 414 L 960 500 L -40 500 Z"/>
          <path transform="translate(960,0)" d="M-40 430 C 30 372, 110 366, 176 412 C 244 460, 300 452, 360 414 C 424 372, 500 378, 566 420 C 632 462, 700 452, 764 412 C 830 370, 900 374, 960 414 L 960 500 L -40 500 Z"/>
        </g>

        <!-- 路缘草丛与路面标线：向左滚动 -->
        <g class="road" fill="#3f8564" opacity=".85">

            <ellipse cx="20"  cy="480" rx="26" ry="6"/><ellipse cx="150" cy="481" rx="34" ry="7"/>
            <ellipse cx="280" cy="479" rx="22" ry="6"/><ellipse cx="410" cy="481" rx="30" ry="7"/>
            <ellipse cx="540" cy="480" rx="24" ry="6"/><ellipse cx="670" cy="481" rx="32" ry="7"/>
            <ellipse cx="800" cy="479" rx="20" ry="6"/><ellipse cx="930" cy="481" rx="28" ry="7"/>
          </g>
          <g transform="translate(600,0)">
            <ellipse cx="20"  cy="480" rx="26" ry="6"/><ellipse cx="150" cy="481" rx="34" ry="7"/>
            <ellipse cx="280" cy="479" rx="22" ry="6"/><ellipse cx="410" cy="481" rx="30" ry="7"/>
            <ellipse cx="540" cy="480" rx="24" ry="6"/><ellipse cx="670" cy="481" rx="32" ry="7"/>
            <ellipse cx="800" cy="479" rx="20" ry="6"/><ellipse cx="930" cy="481" rx="28" ry="7"/>
          </g>
        </g>
        <g class="road" fill="#f2d47a" opacity=".9">
          <g>
            <rect x="10"  y="524" width="60" height="5" rx="2.5"/>
            <rect x="130" y="524" width="60" height="5" rx="2.5"/>
            <rect x="250" y="524" width="60" height="5" rx="2.5"/>

            <path d="M452 320 C 520 338, 580 350, 648 356" fill="none" stroke="#9aa4b5" stroke-width="2.2" opacity=".8"/>

          </g>

          <!-- ============ 鹈鹕头（独立起伏 + 点头） ============ -->

            <g class="nod-head" style="transform-origin: 566px 234px">

              <!-- 喙：下颌 + 喉囊 -->
