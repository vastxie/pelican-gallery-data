<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="一只骑着自行车的鹈鹕，一段有海风陪伴的小小旅程。可暂停、调速的原创 SVG 二维动画。">
  <title>慢慢骑 · 鹈鹕的海岸假日</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ee;
      --ink: #304c45;
      --muted: #7b8376;
      --line: #dcded2;
      --orange: #cb7050;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #bc804b; outline-offset: 5px; }
    .page { max-width: 1320px; margin: 0 auto; padding: 25px 52px 20px; }
    .masthead {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 20px; border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 42px; height: 42px; }
    .brand-name { font-family: "Songti SC", "STSong", serif; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
    .brand-en { margin-top: 4px; font-size: 8px; letter-spacing: 2.6px; font-weight: 600; }
    .edition { display: flex; align-items: center; gap: 15px; font-size: 11px; letter-spacing: 1.5px; color: var(--muted); }
    .edition-line { width: 36px; height: 1px; background: #b9c0b1; }
    .intro { display: flex; justify-content: space-between; align-items: flex-end; padding: 30px 2px 23px; }
    .eyebrow { color: var(--orange); font-size: 10px; font-weight: 600; letter-spacing: 2.6px; margin-bottom: 10px; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: clamp(28px, 3.4vw, 43px); font-weight: 600; letter-spacing: 2px; line-height: 1.4; }
    .intro-note { margin: 0 0 5px; font-size: 12px; color: var(--muted); line-height: 1.9; text-align: right; letter-spacing: 1px; }
    .ride-card { border: 1px solid #d7dccc; border-radius: 19px; overflow: hidden; background: #f5f2e3; box-shadow: 0 5px 0 #eaece0; }
    .scene { position: relative; overflow: hidden; }
    #ride { width: 100%; height: auto; aspect-ratio: 1200 / 620; display: block; }
    .scene-meta { position: absolute; top: 22px; left: 25px; right: 25px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
    .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: #faf8eddb; border: 1px solid #dfe2d1; border-radius: 30px; font-size: 10px; letter-spacing: 1px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #769078; box-shadow: 0 0 0 3px #76907814; }
    .is-paused .status-dot { background: #c79358; box-shadow: 0 0 0 3px #c7935814; }
    .weather { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7c8270; letter-spacing: 1px; }
    .weather svg { width: 18px; height: 18px; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 26px; border-top: 1px solid #d9ddca; background: #fbfaf3; }
    .play-button { border: 0; background: transparent; display: inline-flex; align-items: center; gap: 11px; color: var(--ink); cursor: pointer; padding: 0; font-size: 12px; letter-spacing: 1px; min-width: 123px; }
    .play-circle { background: var(--ink); color: #faf7e9; width: 37px; height: 37px; border-radius: 50%; display: grid; place-items: center; transition: background .2s, transform .2s; }
    .play-button:hover .play-circle { background: #537065; transform: scale(1.06); }
    .play-circle svg { width: 16px; height: 16px; }
    .speed-control { display: flex; align-items: center; gap: 15px; }
    .control-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    .speed-options { display: flex; gap: 3px; background: #eeeee4; border: 1px solid #e3e4d8; padding: 4px; border-radius: 30px; }
    .speed-button { border: 0; padding: 8px 16px; border-radius: 24px; color: #7a8275; background: transparent; font-size: 11px; cursor: pointer; transition: background .15s, color .15s; white-space: nowrap; }
    .speed-button[aria-pressed="true"] { background: #fffef7; color: var(--ink); box-shadow: 0 1px 4px #304c4512; }
    .speed-button:hover { color: #304c45; }
    .speed-button span { font-size: 9px; opacity: .62; padding-left: 5px; }
    .ride-data { display: flex; align-items: center; gap: 20px; }
    .data-item { display: flex; align-items: baseline; gap: 5px; }
    .data-value { font-variant-numeric: tabular-nums; font-family: "Avenir Next", "Helvetica Neue", sans-serif; font-size: 21px; font-weight: 500; letter-spacing: -.5px; }
    .data-unit { color: var(--muted); font-size: 9px; }
    .data-divider { width: 1px; height: 22px; background: var(--line); }
    footer { display: flex; align-items: center; justify-content: space-between; padding: 23px 2px 0; font-size: 10px; color: #8a907e; letter-spacing: 1px; }
    .footer-note { display: flex; align-items: center; gap: 7px; }
    .footer-note svg { width: 15px; height: 15px; }
    .route { display: flex; align-items: center; gap: 9px; font-size: 9px; }
    .route-track { width: 86px; height: 1px; background: #c8cebc; position: relative; }
    .route-track::before, .route-track::after { content: ""; width: 4px; height: 4px; border: 1px solid #9eaa95; border-radius: 50%; position: absolute; top: -2px; background: var(--paper); }
    .route-track::before { left: 0; } .route-track::after { right: 0; }
    .route-bike { position: absolute; top: -2px; left: 39%; width: 5px; height: 5px; border-radius: 50%; background: #c97856; }
    @media (min-width: 1500px) { .page { padding-top: 35px; } .intro { padding-top: 38px; padding-bottom: 27px; } }
    @media (max-width: 850px) {
      .page { padding: 22px 26px; }
      .speed-control { gap: 8px; }
      .control-label { display: none; }
      .controls { padding: 17px 20px; gap: 12px; }
      .speed-button { padding: 8px 11px; }
      .ride-data { gap: 10px; }
      .play-button { min-width: 104px; }
    }
    @media (max-width: 600px) {
      .page { padding: 20px 17px; }
      .masthead { padding-bottom: 16px; }
      .brand-mark { width: 35px; height: 35px; }
      .brand { gap: 8px; }
      .brand-name { font-size: 19px; }
      .brand-en { font-size: 6px; letter-spacing: 1.9px; }
      .edition { font-size: 9px; letter-spacing: 1px; gap: 8px; }
      .edition-line { width: 18px; }
      .intro { display: block; padding: 27px 1px 20px; }
      .eyebrow { font-size: 8px; letter-spacing: 2px; margin-bottom: 10px; }
      h1 { font-size: clamp(25px, 7.7vw, 37px); letter-spacing: 1px; }
      .intro-note { text-align: left; font-size: 10px; margin: 9px 0 0; letter-spacing: .5px; }
      .intro-note br { display: none; }
      .intro-note br::after { content: " "; }
      .ride-card { border-radius: 14px; }
      #ride { aspect-ratio: 690 / 580; }
      .scene-meta { top: 14px; left: 13px; right: 13px; }
      .status { font-size: 8px; padding: 7px 9px; gap: 6px; }
      .weather { font-size: 9px; gap: 4px; }
      .weather svg { width: 15px; height: 15px; }
      .weather-detail { display: none; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; padding: 15px; gap: 16px 10px; }
      .play-button { font-size: 11px; gap: 8px; }
      .play-circle { width: 33px; height: 33px; }
      .ride-data { grid-column: 2; grid-row: 1; justify-content: flex-end; gap: 12px; }
      .data-value { font-size: 18px; }
      .data-unit { font-size: 8px; }
      .speed-control { grid-column: 1 / -1; justify-content: space-between; padding-top: 13px; border-top: 1px solid #e7e7db; }
      .control-label { display: block; font-size: 10px; }
      .speed-button { padding: 8px 14px; font-size: 10px; }
      .speed-button span { font-size: 8px; }
      footer { align-items: flex-start; padding-top: 21px; font-size: 9px; gap: 12px; }
      .route { font-size: 8px; gap: 5px; margin-top: 3px; }
      .route-track { width: 41px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

  <div class="page">
    <header class="masthead">
      <div class="brand">

              <!-- The scarf trails behind a single, continuous pelican silhouette. -->
              <g id="rider">
                <path id="scarf-tail-back" d="M623 247C595 229 569 247 542 230L544 246C573 262 595 244 625 261Z" fill="#648d79" stroke="#486f5e" stroke-width="2"/>

                <path d="M630 174C629 148 653 132 676 145 697 155 699 178 690 198 682 216 668 229 665 250 660 285 669 318 642 347 625 366 601 378 566 377 531 378 494 365 478 341L439 325Q469 327 475 310C466 292 476 264 502 256 533 244 559 264 577 278 596 294 612 287 618 263 625 239 613 213 630 190Z" fill="url(#feather)" stroke="#536553" stroke-width="3.2"/>
                <path d="M444 327Q461 334 479 333L493 350Q463 341 444 327Z" fill="#425c50"/>

                <path d="M492 274q21-11 44 1M493 285q10-4 17-2" fill="none" stroke="#fffef5" stroke-width="5"/>
                <path d="M633 202C626 224 638 246 630 267" fill="none" stroke="#fffef6" stroke-width="6"/>
                <path d="M620 174Q603 174 603 155L616 162Q605 152 611 143L628 158" fill="#fdfcef" stroke="#536553" stroke-width="2.5"/>

                <!-- A long bill and deep throat pouch make this unmistakably a pelican. -->
                <path d="M679 196 869 200C838 214 835 242 797 255 749 273 704 245 688 221Z" fill="url(#pouch)" stroke="#ac8045" stroke-width="2.5"/>
                <path d="M692 208C715 234 752 252 788 248" fill="none" stroke="#f9cf7c" stroke-width="4"/>
                <path d="M831 219q-20 28-49 33" fill="none" stroke="#d49348" stroke-width="2"/>
                <path d="M680 178C730 174 803 184 866 197Q883 201 866 207L684 205Q677 193 680 178Z" fill="#f0c471" stroke="#9c7c45" stroke-width="2.5"/>
                <path d="M690 184Q776 183 856 199" fill="none" stroke="#ffe3a0" stroke-width="3"/>
                <path d="M841 193 866 197Q881 201 866 207H845Q851 200 841 193Z" fill="#d7844e"/>
                <path d="M684 202 864 203" stroke="#b28a4d" stroke-width="1.5"/>
                <path d="M704 187l9 1" stroke="#b18b4b" stroke-width="2.5"/>
                <path d="M642 167q7-5 13 0" fill="none" stroke="#61705a" stroke-width="2"/>
                <ellipse cx="652" cy="178" rx="5" ry="6.5" fill="#344b42"/>
                <circle cx="653.5" cy="176" r="1.7" fill="#fffef3"/>
                <ellipse cx="656" cy="194" rx="9" ry="4.5" fill="#e6b49a" opacity=".62"/>
                <path d="M678 210q-3 5-8 3" fill="none" stroke="#63705a" stroke-width="1.6"/>

                <!-- Helmet, buckle, and a little hand-stitched scarf. -->
                <path d="M636 151Q632 182 651 204L672 160" fill="none" stroke="#78846a" stroke-width="4"/>
                <rect x="647" y="194" width="9" height="7" rx="2" fill="#e9d8a8" stroke="#67745d" stroke-width="1.5" transform="rotate(23 651 198)"/>
                <path d="M623 151C619 130 632 110 656 108 682 105 701 127 702 151L683 157Q653 143 623 151Z" fill="#dcb353" stroke="#667052" stroke-width="3"/>
                <path d="M628 143C626 125 644 111 663 114" fill="none" stroke="#f5d77e" stroke-width="4"/>
                <path d="M649 119q-7 8-9 18M664 117q-5 9-4 19M678 122q-1 6 1 13" fill="none" stroke="#aa9045" stroke-width="4"/>
                <path d="M622 151Q655 142 687 155L705 154" fill="none" stroke="#637153" stroke-width="5"/>
                <path d="M616 247Q640 257 666 246L665 261Q641 273 616 261Z" fill="#7fa18a" stroke="#4c715c" stroke-width="2.5"/>
                <path d="M622 253q20 9 36 1" fill="none" stroke="#b5c8a2" stroke-width="2"/>
                <path d="M617 248q-9 7 0 14l11-3-3-9Z" fill="#648c73" stroke="#4c715c" stroke-width="2"/>

                <!-- A tapered wing reaches naturally toward the handlebar. -->
                <path d="M525 290C545 277 568 291 591 306 618 325 646 311 677 309L700 303Q708 302 709 310L700 324 644 341C609 353 581 347 554 335 532 326 517 305 525 290Z" fill="#f3f3e6" stroke="#536553" stroke-width="3"/>
                <path d="M648 316q16-5 29-7l23-6q8-1 9 7l-9 14-42 13q10-8 13-13-12 6-21 7l14-12Z" fill="#405b4c"/>
                <path d="M543 296C565 298 583 331 622 330" fill="none" stroke="#d4ddca" stroke-width="3"/>
                <path d="M558 322q16 12 33 14M553 310q5 6 11 8" fill="none" stroke="#c0ceba" stroke-width="2"/>
                <path d="M679 319l15-9m-11 13 16-10" stroke="#8c9e83" stroke-width="1.5"/>
              </g>

              <!-- Both feet follow opposite points on the rotating crank. -->
              <path id="near-leg-outline" d="M550 356Q512 416 597 482" fill="none" stroke="#9f793f" stroke-width="14"/>
              <path id="near-leg" d="M550 356Q512 416 597 482" fill="none" stroke="#e7b25d" stroke-width="9"/>
              <path id="near-leg-shine" d="M550 356Q512 416 597 482" fill="none" stroke="#f5ce7c" stroke-width="2"/>
              <path id="crank-front" d="M569 482H597" stroke="#526858" stroke-width="6"/>
              <circle cx="569" cy="482" r="7" fill="#d9d4b4" stroke="#586f58" stroke-width="2"/>
              <circle cx="569" cy="482" r="2" fill="#6f805f"/>
              <g id="near-foot" transform="translate(597 482)">
                <path d="M-5-9Q-10-12-12-5L-19 0Q-23 5-14 6H23Q28 3 21 0L5-9Z" fill="#e9b259" stroke="#9f793f" stroke-width="2"/>
                <path d="m-2-3 8 6M5-4l11 7" fill="none" stroke="#c49347" stroke-width="1.5"/>
                <path d="M-16 10H22" stroke="#3e594b" stroke-width="5"/>
                <path d="M-11 9H17" stroke="#8c9a7b" stroke-width="1.5"/>
              </g>
              <path d="M537 346q14 5 28-1l-3 22q-10 7-22-1Z" id="leg-feathers" fill="#e9eddd"/>
            </g>

            <g id="wind-lines" fill="none" stroke="#9daa8c" stroke-width="2" stroke-linecap="round" opacity=".65">
              <path d="M374 243h41m-64 0h10M336 264h54M390 287h23"/>
            </g>
            <g id="foreground-a" transform="translate(109 603)"><use href="#sprig"/><use href="#flower" transform="translate(24 0) rotate(10)"/><use href="#grass" transform="translate(-28 0) scale(1.2)"/></g>
            <g id="foreground-b" transform="translate(1125 610)"><use href="#sprig" transform="scale(-1.1 1.1)"/><use href="#flower" transform="translate(-35 -4) rotate(-14)"/><use href="#flower" transform="translate(-50 2) scale(.7)"/><use href="#grass" transform="translate(23 0)"/></g>
            <g id="passing-grass" transform="translate(964 582)"><use href="#grass" transform="scale(.8)"/><path d="M28 0h13" stroke="#a9ae8b" stroke-width="2" stroke-linecap="round"/></g>
          </svg>
          <div class="scene-meta">
            <div class="status" role="status"><span class="status-dot"></span><span id="status-text">正在兜风</span></div>
            <div class="weather"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2 2m11.6 11.6 2 2m0-15.6-2 2M6.2 17.8l-2 2"/></svg><span>24°<span class="weather-detail"> &nbsp; 海风轻轻</span></span></div>
          </div>
        </div>

        <div class="controls">
          <button id="play-toggle" class="play-button" type="button" aria-label="暂停动画" aria-pressed="false" aria-controls="ride" title="暂停或继续（空格键）">
            <span class="play-circle"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M5 4h3v12H5zM12 4h3v12h-3z"/></svg></span>
            <span id="play-label">歇一会儿</span>
          </button>
          <div class="speed-control" role="group" aria-label="骑行速度">
            <span class="control-label">骑行节奏</span>
            <div class="speed-options">
              <button type="button" class="speed-button" data-speed="0.5" aria-pressed="false">悠闲<span>0.5×</span></button>
              <button type="button" class="speed-button" data-speed="1" aria-pressed="true">轻快<span>1×</span></button>
              <button type="button" class="speed-button" data-speed="1.5" aria-pressed="false">追风<span>1.5×</span></button>
            </div>
          </div>
          <div class="ride-data" aria-label="本次骑行数据">
            <div class="data-item"><span id="speed-value" class="data-value">14</span><span class="data-unit">km/h</span></div>
            <span class="data-divider"></span>
            <div class="data-item"><span id="distance-value" class="data-value">0.00</span><span class="data-unit">km</span></div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <span class="footer-note"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M15 3C5 2 2 7 5 12s12 0 10-9ZM4 17 12 7M7 13l-1-4m3 1h4"/></svg>慢一点，风景多一点。</span>
      <span class="route"><span>贝壳湾</span><span class="route-track"><i class="route-bike"></i></span><span>白灯塔</span></span>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const refs = Object.fromEntries([
        'ride', 'rider', 'rear-spokes', 'front-spokes', 'chainring', 'near-leg',
        'near-leg-outline', 'near-leg-shine', 'far-leg', 'far-leg-outline',
        'near-foot', 'far-foot', 'crank-front', 'crank-back', 'leg-feathers',
        'scarf-tail-back', 'scarf-tail-front', 'road-lines', 'wave-lines',
        'cloud-a', 'cloud-b', 'cloud-c', 'gull-a', 'gull-b', 'gull-c',
        'distant-birds', 'wind-lines', 'foreground-a', 'foreground-b',
        'passing-grass', 'bike-shadow', 'play-toggle', 'play-icon',
        'play-label', 'status-text', 'speed-value', 'distance-value'
      ].map(id => [id, byId(id)]));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const mobile = window.matchMedia('(max-width: 600px)');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      let playing = !reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let distance = 0;
      let lastTime = null;
      let animationId = null;
      let lastDistanceText = '';
      const set = (id, attr, value) => refs[id].setAttribute(attr, value);
      const f = n => n.toFixed(2);
      const wrap = (n, width) => ((n % width) + width) % width;

      // Two-bone inverse kinematics keeps each webbed foot on its pedal.
      function legPath(hipX, hipY, footX, footY) {
        const upper = 77, lower = 91;
        const dx = footX - hipX, dy = footY - hipY;
        const distanceToFoot = Math.max(.001, Math.hypot(dx, dy));
        const d = Math.min(upper + lower - .01, distanceToFoot);
        const along = (upper * upper - lower * lower + d * d) / (2 * d);
        const side = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + dx / distanceToFoot * along - dy / distanceToFoot * side;
        const kneeY = hipY + dy / distanceToFoot * along + dx / distanceToFoot * side;
        return `M${f(hipX)} ${f(hipY)} L${f(kneeX)} ${f(kneeY)} L${f(footX)} ${f(footY - 5)}`;
      }

      function draw(t) {
        const angle = t * 2.65 + .25;
        const bob = Math.sin(angle * 2) * 2.1;
        const wheelDegrees = t * 2.65 * 1.72 * 180 / Math.PI;
        set('rider', 'transform', `translate(0 ${f(bob)})`);
        set('leg-feathers', 'transform', `translate(0 ${f(bob)})`);
        set('rear-spokes', 'transform', `rotate(${f(wheelDegrees)})`);
        set('front-spokes', 'transform', `rotate(${f(wheelDegrees)})`);
        set('chainring', 'transform', `rotate(${f(angle * 180 / Math.PI)} 569 482)`);

        for (const [side, offset, hipX] of [['near', 0, 550], ['far', Math.PI, 550]]) {
          const x = 569 + Math.cos(angle + offset) * 28;
          const y = 482 + Math.sin(angle + offset) * 28;
          const path = legPath(hipX, 357 + bob, x, y);
          set(`${side}-leg`, 'd', path);
          set(`${side}-leg-outline`, 'd', path);
          if (side === 'near') set('near-leg-shine', 'd', path);
          set(`${side}-foot`, 'transform', `translate(${f(x)} ${f(y)})`);
          set(side === 'near' ? 'crank-front' : 'crank-back', 'd', `M569 482L${f(x)} ${f(y)}`);
        }

        const flutter = Math.sin(t * 5.4) * 6;
        const flutter2 = Math.sin(t * 5.4 - 1) * 5;
        set('scarf-tail-back', 'd', `M623 247C595 ${229 + flutter2} 569 ${247 + flutter} 542 ${230 + flutter2}L544 ${246 + flutter2}C573 ${262 + flutter} 595 ${244 + flutter2} 625 261Z`);
        set('scarf-tail-front', 'd', `M623 251C590 ${253 + flutter} 571 ${267 + flutter2} 540 ${255 + flutter}L535 ${270 + flutter}C571 ${282 + flutter2} 595 ${263 + flutter} 626 266Z`);

        // Ground travel matches the tire circumference; the distant layers move more slowly.
        const travel = t * 2.65 * 1.72 * 91;
        set('road-lines', 'transform', `translate(${-wrap(travel, 400)} 0)`);
        set('wave-lines', 'transform', `translate(${-wrap(t * 16, 240)} 0)`);
        set('cloud-a', 'transform', `translate(${wrap(263 - t * 6, 1470) - 170} 140) scale(1.15)`);
        set('cloud-b', 'transform', `translate(${wrap(883 - t * 3.5, 1470) - 170} 80) scale(.65)`);
        set('cloud-c', 'transform', `translate(${wrap(1224 - t * 5, 1470) - 170} 256) scale(.85)`);
        set('distant-birds', 'transform', `translate(${Math.sin(t * .15) * 19} ${Math.sin(t * .5) * 3})`);
        for (const [id, x, y, width, phase] of [['gull-a', 254, 224, 19, 0], ['gull-b', 306, 198, 14, .9], ['gull-c', 894, 276, 16, 2]]) {
          const flap = -7 + Math.sin(t * 2 + phase) * 4;
          set(id, 'd', `M${x} ${y}q${width / 2} ${flap} ${width} 0q${width / 2} ${flap} ${width} 0`);
        }
        set('wind-lines', 'transform', `translate(${Math.sin(t * 2.8) * 9} 0)`);
        set('wind-lines', 'opacity', .38 + (Math.sin(t * 2.8) + 1) * .13);
        set('foreground-a', 'transform', `translate(109 603) rotate(${Math.sin(t * 2.3) * 2})`);
        set('foreground-b', 'transform', `translate(1125 610) rotate(${Math.sin(t * 2.3 + 1) * 2})`);
        set('passing-grass', 'transform', `translate(${wrap(1064 - travel, 1390) - 100} 582)`);
        set('bike-shadow', 'rx', 237 + bob);
      }

      function frame(now) {
        animationId = null;
        if (!playing || document.hidden) return;
        const dt = lastTime === null ? 0 : Math.min((now - lastTime) / 1000, .06);
        lastTime = now;
        elapsed += dt * speed;
        distance += dt * speed * 14 / 3600;
        draw(elapsed);
        const distanceText = distance.toFixed(2);
        if (distanceText !== lastDistanceText) {
          refs['distance-value'].textContent = distanceText;
          lastDistanceText = distanceText;
        }
        animationId = requestAnimationFrame(frame);
      }

      function syncLoop() {
        if (animationId !== null) cancelAnimationFrame(animationId);
        animationId = null;
        lastTime = null;
        if (playing && !document.hidden) animationId = requestAnimationFrame(frame);
      }

      function updatePlayback() {
        document.body.classList.toggle('is-paused', !playing);
        refs['play-toggle'].setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
        refs['play-toggle'].setAttribute('aria-pressed', String(!playing));
        refs['play-label'].textContent = playing ? '歇一会儿' : '继续兜风';
        refs['status-text'].textContent = playing ? '正在兜风' : '海边小憩';
        refs['play-icon'].setAttribute('d', playing ? 'M5 4h3v12H5zM12 4h3v12h-3z' : 'M6 3.5 16 10 6 16.5Z');
        refs['speed-value'].textContent = playing ? String(14 * speed) : '0';
        syncLoop();
      }

      refs['play-toggle'].addEventListener('click', () => {
        playing = !playing;
        updatePlayback();
      });
      speedButtons.forEach(button => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach(option => option.setAttribute('aria-pressed', String(option === button)));
        refs['speed-value'].textContent = playing ? String(14 * speed) : '0';
      }));
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, textarea, select, a, [contenteditable="true"]')) return;
        event.preventDefault();
        playing = !playing;
        updatePlayback();
      });
      document.addEventListener('visibilitychange', syncLoop);
      reducedMotion.addEventListener('change', event => {
        if (event.matches) { playing = false; updatePlayback(); }
      });
      function fitScene() {
        refs.ride.setAttribute('viewBox', mobile.matches ? '250 65 690 580' : '0 0 1200 620');
      }
      mobile.addEventListener('change', fitScene);
      fitScene();
      draw(0);
      updatePlayback();
    })();
  </script>
</body>
