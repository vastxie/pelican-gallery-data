<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; background: #dff6ff; font-family: system-ui, -apple-system, sans-serif;
    }
    .scene {
      width: min(100vw, 1100px); aspect-ratio: 16 / 10; position: relative;
      border-radius: 24px; overflow: hidden; box-shadow: 0 22px 60px #3786a633;
      background: #a5e5f6;
    }
    svg { display: block; width: 100%; height: 100%; }
    .pelican { transform-origin: 50% 72%; animation: ride-bob .55s ease-in-out infinite alternate; }
    .wing { transform-box: fill-box; transform-origin: 18% 92%; animation: flap .65s ease-in-out infinite alternate; }
    .leg-front, .leg-back { transform-box: fill-box; transform-origin: top center; animation: pedal .8s linear infinite; }
    .leg-back { animation-delay: -.4s; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: roll .8s linear infinite; }
    .cloud { animation: drift 18s linear infinite; }
    .cloud.slow { animation-duration: 26s; animation-delay: -8s; }
    .dash { animation: road 1.1s linear infinite; }
    @keyframes ride-bob { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(4px) rotate(1deg); } }
    @keyframes flap { from { transform: rotate(3deg); } to { transform: rotate(-15deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes roll { to { transform: rotate(360deg); } }
    @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(1140px); } }
    @keyframes road { from { transform: translateX(0); } to { transform: translateX(-120px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-play-state: paused !important; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="一只鹈鹕骑自行车的二维动画">
    <svg viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">一只橙色嘴巴的鹈鹕踩着蓝色自行车沿海边道路前进。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#79d6ef"/><stop offset="1" stop-color="#dcf8ff"/></linearGradient>
        <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#52bfd5"/><stop offset="1" stop-color="#218bb2"/></linearGradient>
        <linearGradient id="road" x2="0" y2="1"><stop stop-color="#47596d"/><stop offset="1" stop-color="#26394d"/></linearGradient>
        <filter id="shadow"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>

      <rect width="1000" height="625" fill="url(#sky)"/>
      <circle cx="838" cy="108" r="48" fill="#fff3aa" opacity=".9"/>
      <g class="cloud" fill="#fff" opacity=".8">
        <path d="M90 155c0-20 19-35 42-32 9-29 56-29 67 2 27-11 58 7 58 35H90z"/>
      </g>
      <g class="cloud slow" fill="#fff" opacity=".65">
        <path d="M630 210c0-18 17-31 36-29 11-25 50-24 60 4 24-9 48 7 48 31H630z"/>
      </g>

      <path d="M0 312 Q130 270 270 315 T535 310 T800 314 T1000 290 V430H0Z" fill="url(#sea)"/>
      <path d="M0 356 Q125 330 260 358 T520 350 T790 356 T1000 338" fill="none" stroke="#b9f4f3" stroke-width="9" opacity=".8"/>
      <path d="M0 407 Q140 384 285 412 T560 403 T820 410 T1000 394 L1000 625H0Z" fill="#b9dfad"/>
      <path d="M0 470 Q210 444 430 475 T1000 456 V625H0Z" fill="url(#road)"/>
      <g class="dash" fill="#f8dd83">
        <rect x="-80" y="538" width="92" height="9" rx="4"/><rect x="92" y="538" width="92" height="9" rx="4"/>
        <rect x="264" y="538" width="92" height="9" rx="4"/><rect x="436" y="538" width="92" height="9" rx="4"/>
        <rect x="608" y="538" width="92" height="9" rx="4"/><rect x="780" y="538" width="92" height="9" rx="4"/>
        <rect x="952" y="538" width="92" height="9" rx="4"/>
      </g>
      <ellipse cx="493" cy="531" rx="210" ry="22" fill="#152c3d" opacity=".25" filter="url(#shadow)"/>

      <!-- bicycle -->
      <g fill="none" stroke="#1f506c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <g class="wheel"><circle cx="350" cy="507" r="76" stroke="#163e57"/><path d="M350 431v152M274 507h152M296 453l108 108M296 561l108-108" stroke-width="3" opacity=".75"/></g>
        <g class="wheel"><circle cx="650" cy="507" r="76" stroke="#163e57"/><path d="M650 431v152M574 507h152M596 453l108 108M596 561l108-108" stroke-width="3" opacity=".75"/></g>
        <path d="M350 507l115-104 80 104-195 0 115-104 41-1 35-35"/>
        <path d="M465 403l-15-35h42"/><path d="M545 506l-5-58"/><path d="M532 446h29"/>
      </g>
      <circle cx="465" cy="507" r="17" fill="#f4b44b" stroke="#1f506c" stroke-width="7"/>
      <path d="M465 507l43-38M465 507l-34 22" stroke="#f4b44b" stroke-width="7" stroke-linecap="round"/>

      <!-- pelican -->
      <g class="pelican">
        <path d="M466 391c-27-68 0-143 66-154 56-10 103 28 108 85 6 70-50 103-112 89z" fill="#f7f1e5" stroke="#173e50" stroke-width="6"/>
        <path d="M509 235c-19-56 12-102 57-101 48 1 63 51 39 92-15 25-57 37-96 9z" fill="#fffaf0" stroke="#173e50" stroke-width="6"/>
        <path d="M603 264c47-22 98-11 138 13l-17 27c-48 7-91-1-125-15z" fill="#f28e45" stroke="#173e50" stroke-width="6"/>
        <path d="M607 284c43 18 82 15 119 5l-13 32c-39 11-79 2-115-18z" fill="#f6ae59" stroke="#173e50" stroke-width="5"/>
        <circle cx="569" cy="181" r="9" fill="#173e50"/><circle cx="572" cy="178" r="3" fill="#fff"/>
        <path d="M526 202c25 16 51 18 76 3" fill="none" stroke="#e7d8c5" stroke-width="7" stroke-linecap="round"/>
        <path d="M494 282c-55 16-73 65-45 93 20 20 61 12 92-22" fill="#d8e3e1" stroke="#173e50" stroke-width="6"/>
        <path class="wing" d="M494 285c-47 16-71 62-53 93 22 36 75 19 107-27z" fill="#c7d8d5" stroke="#173e50" stroke-width="6"/>
        <path d="M532 356c-4 44-6 72-22 103M579 356c3 43 14 72 26 103" fill="none" stroke="#f09a45" stroke-width="12" stroke-linecap="round"/>
        <path class="leg-front" d="M510 447l-33 35 38 15" fill="none" stroke="#173e50" stroke-width="7" stroke-linecap="round"/>
        <path class="leg-back" d="M585 450l34 31-32 18" fill="none" stroke="#173e50" stroke-width="7" stroke-linecap="round"/>
        <path d="M526 267c-4 18-2 38 8 52" fill="none" stroke="#b0c6c4" stroke-width="5" stroke-linecap="round"/>
      </g>
      <g fill="#fff" opacity=".7"><circle cx="148" cy="397" r="4"/><circle cx="171" cy="389" r="2.5"/><circle cx="811" cy="374" r="4"/></g>
      <text x="38" y="70" fill="#17465e" font-size="25" font-weight="700" letter-spacing="3">PELICAN EXPRESS</text>
      <text x="40" y="99" fill="#24728b" font-size="14" letter-spacing="2">海风里的小小旅程</text>
    </svg>
  </main>
</body>
</html>
