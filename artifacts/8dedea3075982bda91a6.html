<html lang="zh-CN">

  svg {
    width: min(95vw, 980px);
    height: auto;
    border-radius: 20px;
    box-shadow: 0 26px 60px rgba(0,0,0,.45);
    background: #bfe6ff;
    display: block;
  }
  p {
    color: #cfe3f5;
    font-size: 13px;
    letter-spacing: .2em;
    margin: 14px 0 0;
  }
</style>
</head>
<body>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function $(id) { return document.getElementById(id); }

  var wheelRear = $('wheelRear'),
      wheelFront = $('wheelFront'),
      crank = $('crank'),
      rider = $('rider'),
      wing = $('wing'),
      head = $('head'),
      pouch = $('pouch'),
      eye = $('eye'),
      legNear = $('legNear'),
      legFar = $('legFar'),
      footNear = $('footNear'),
      footFar = $('footFar'),
      scarf1 = $('scarf1'),
      scarf2 = $('scarf2'),
      sunRays = $('sunRays'),
      farA = $('farA'), farB = $('farB'),
      nearA = $('nearA'), nearB = $('nearB'),
      shadow = $('shadow');

  /* ---------- 生成云朵 ---------- */
  var cloudData = [
    { x: 120,  y: 90,  s: 1.1, v: 0.12 },
    { x: 480,  y: 150, s: 0.8, v: 0.18 },
    { x: 760,  y: 64,  s: 0.95, v: 0.10 },
    { x: 1000, y: 128, s: 0.65, v: 0.22 }
  ];
  cloudData.forEach(function (c) {
    var u = document.createElementNS(NS, 'use');
    u.setAttribute('href', '#cloudShape');
    $('clouds').appendChild(u);
    c.el = u;
  });

  /* ---------- 生成地面装饰 ---------- */
  var deco = [];
  var decoLayer = $('groundDeco');
  for (var i = 0; i < 22; i++) {
    var isFlower = (i % 4 === 0);
    var u = document.createElementNS(NS, 'use');
    u.setAttribute('href', isFlower ? '#flowerShape' : '#grassShape');
    decoLayer.appendChild(u);
    deco.push({
      el: u,
      base: Math.random() * 1800,
      y: 442 + Math.random() * 6,
      s: (isFlower ? 0.8 : 0.75) + Math.random() * 0.5
    });
  }

  /* ---------- 自行车几何 ---------- */
  var C = { x: 415, y: 382 };   // 中轴
  var H0 = { x: 392, y: 285 };  // 鸟髋
  var CRANK = 17, L1 = 54, L2 = 66;

  /* 两连杆反向运动学：返回膝盖坐标（膝盖始终朝前） */
  function ik(H, P) {
    var dx = P.x - H.x, dy = P.y - H.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.max(Math.min(d, L1 + L2 - 0.3), Math.abs(L1 - L2) + 0.3);
    var a = Math.atan2(dy, dx);
    var cos = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    var o = Math.acos(Math.max(-1, Math.min(1, cos)));
    var k1 = { x: H.x + L1 * Math.cos(a - o), y: H.y + L1 * Math.sin(a - o) };
    var k2 = { x: H.x + L1 * Math.cos(a + o), y: H.y + L1 * Math.sin(a + o) };
    return k1.x >= k2.x ? k1 : k2;
  }

  var RAD = 180 / Math.PI;
  var dist = 0;
  var last = performance.now();
  var nextBlink = 2.5, blink = 0;

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var t = now / 1000;

    dist += 210 * dt;

    /* 轮子与踏板（踏板 1 圈 ≈ 轮子 2.5 圈） */
    var wheelAng = dist / 58;
    var theta = dist / 145;
    wheelRear.setAttribute('transform', 'rotate(' + (wheelAng * RAD) + ' 300 382)');
    wheelFront.setAttribute('transform', 'rotate(' + (wheelAng * RAD) + ' 560 382)');
    crank.setAttribute('transform', 'rotate(' + (theta * RAD) + ' 415 382)');

    /* 鸟身体随踩踏节奏上下颠簸 */
    var by = Math.sin(theta * 2) * 2.4;
    rider.setAttribute('transform', 'translate(0 ' + by + ')');

    /* 双脚绑在踏板上 */
    var H = { x: H0.x, y: H0.y + by };
    var Pn = { x: C.x + CRANK * Math.cos(theta), y: C.y + CRANK * Math.sin(theta) };
    var Pf = { x: C.x - CRANK * Math.cos(theta), y: C.y - CRANK * Math.sin(theta) };
    var Kn = ik(H, Pn), Kf = ik(H, Pf);

    legNear.setAttribute('d', 'M' + H.x + ',' + H.y + ' L' + Kn.x + ',' + Kn.y + ' L' + Pn.x + ',' + Pn.y);
    legFar.setAttribute('d',  'M' + H.x + ',' + H.y + ' L' + Kf.x + ',' + Kf.y + ' L' + Pf.x + ',' + Pf.y);
    footNear.setAttribute('transform', 'translate(' + Pn.x + ' ' + Pn.y + ')');
    footFar.setAttribute('transform',  'translate(' + Pf.x + ' ' + Pf.y + ')');

    /* 翅膀 / 头 / 喉囊 */
    wing.setAttribute('transform',  'rotate(' + (Math.sin(t * 5.5) * 6) + ' 400 232)');
    head.setAttribute('transform',  'rotate(' + (Math.sin(theta * 2) * 2.2 + Math.sin(t * 1.3)) + ' 405 222)');
    pouch.setAttribute('transform', 'rotate(' + (Math.sin(t * 6) * 3.6) + ' 470 214)');

    /* 眨眼 */
    nextBlink -= dt;
    if (nextBlink <= 0) { blink = 0.15; nextBlink = 2 + Math.random() * 2.4; }
    if (blink > 0) blink -= dt;
    var open = blink > 0 ? 0.08 : 1;
    eye.setAttribute('transform',
      'translate(455 176) scale(1 ' + open + ') translate(-455 -176)');

    /* 围巾随风飘 */
    var w = Math.sin(t * 9) * 6, w2 = Math.cos(t * 7) * 5;
    scarf1.setAttribute('d',
      'M410,214 C380,' + (210 + w) + ' 352,' + (222 - w) + ' 326,' + (214 + w * 0.8));
    scarf2.setAttribute('d',
      'M412,219 C384,' + (224 - w * 0.8) + ' 358,' + (236 + w2) + ' 336,' + (229 - w2));

    /* 太阳光芒 */
    sunRays.setAttribute('transform', 'rotate(' + (t * 9) + ')');

    /* 视差背景 */
    var offF = (dist * 0.18) % 900;
    var offN = (dist * 0.38) % 900;
    farA.setAttribute('transform', 'translate(' + (-offF) + ' 0)');
    farB.setAttribute('transform', 'translate(' + (900 - offF) + ' 0)');
    nearA.setAttribute('transform', 'translate(' + (-offN) + ' 0)');
    nearB.setAttribute('transform', 'translate(' + (900 - offN) + ' 0)');

    /* 地面装饰滚动（周期 1800） */
    deco.forEach(function (d) {
      var x = ((d.base - dist) % 1800 + 1800) % 1800 - 450;
      d.el.setAttribute('transform', 'translate(' + x + ' ' + d.y + ') scale(' + d.s + ')');
    });

    /* 云朵 */
    cloudData.forEach(function (c) {
      var span = 900 + 240;
      var x = ((c.x - dist * c.v) % span + span) % span - 120;
      c.el.setAttribute('transform', 'translate(' + x + ' ' + c.y + ') scale(' + c.s + ')');
    });

    /* 阴影随颠簸轻微变化 */
    shadow.setAttribute('ry', 12 + by * 0.55);
    shadow.setAttribute('opacity', 0.14 - by * 0.012);

    /* 扬尘 */
    for (var k = 0; k < 3; k++) {
      var age = ((dist / 46) + k / 3) % 1;
      var dot = $('d' + k);
      dot.setAttribute('cx', 300 - age * 34);
      dot.setAttribute('cy', 440 - age * 20);
      dot.setAttribute('r', 1.6 + age * 3.4);
      dot.setAttribute('opacity', (1 - age) * 0.4);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
