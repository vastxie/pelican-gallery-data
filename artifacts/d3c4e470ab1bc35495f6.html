<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const set = (el, attrs) => { for (const k in attrs) el.setAttribute(k, attrs[k]); };

  // ---------- 几何参数 ----------
  const SPEED = 240;             // 世界移动速度 px/s
  const WHEEL_R = 70;
  const BB = { x: 370, y: 335 }; // 中轴
  const CRANK = 26;              // 曲柄长度
  const GEAR = 0.85;             // 曲柄转角 / 车轮转角
  const THIGH = 84, SHIN = 82;
  const NEAR_HIP = { x: 352, y: 204 };
  const FAR_HIP = { x: 346, y: 201 };

  // ---------- 生成辐条 ----------
  function buildSpokes(g) {
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const line = document.createElementNS(NS, 'line');
      set(line, { x1: 0, y1: 0, x2: (62 * Math.cos(a)).toFixed(2), y2: (62 * Math.sin(a)).toFixed(2) });
      g.appendChild(line);
    }
    const reflector = document.createElementNS(NS, 'rect');
    set(reflector, { x: 36, y: -3, width: 12, height: 6, rx: 1.5, fill: '#ff8a2a' });
    g.appendChild(reflector);
  }
  buildSpokes($('rearSpokes'));
  buildSpokes($('frontSpokes'));

  // ---------- 速度线 ----------
  const speedLines = [];
  for (let i = 0; i < 6; i++) {
    const l = document.createElementNS(NS, 'line');
    $('speedLines').appendChild(l);
    speedLines.push({ el: l, y: 120 + i * 38 + Math.random() * 12, len: 30 + Math.random() * 40, phase: Math.random() * 300 });
  }

  // ---------- 两段式腿的反向运动学 ----------
  function solveKnee(hip, foot, l1, l2) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
    const base = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const bend = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const ang = base - bend; // 膝盖朝前
    return { x: hip.x + l1 * Math.cos(ang), y: hip.y + l1 * Math.sin(ang) };
  }

  function drawLeg(side, hip, pedal, crankAngle) {
    const knee = solveKnee(hip, pedal, THIGH, SHIN);
    set($(side + 'Thigh'), { x1: hip.x, y1: hip.y, x2: knee.x, y2: knee.y });
    set($(side + 'Shin'), { x1: knee.x, y1: knee.y, x2: pedal.x, y2: pedal.y - 3 });
    const footTilt = -8 + Math.sin(crankAngle) * 12;
    $(side + 'Foot').setAttribute('transform',
      `translate(${pedal.x - 3} ${pedal.y - 4}) rotate(${footTilt})`);
    if (side === 'near') set($('nearKnee'), { cx: knee.x, cy: knee.y });
  }

  // ---------- 围巾飘带 ----------
  function scarfPaths(t) {
    const N = 16, LEN = 125;
    const top = [], bot = [], mid = [];
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      const x = 398 - s * LEN;
      const y = 137 + s * 12 + Math.sin(t * 10 - s * 6) * (2 + s * 10);
      const w = 13 - s * 5;
      top.push([x, y - w / 2]);
      bot.push([x, y + w / 2]);
      mid.push([x, y]);
    }
    const end = mid[N];
    const fringe = [
      [end[0] - 10, end[1] - 4 + Math.sin(t * 14) * 3],
      [end[0] - 12, end[1] + 2 + Math.sin(t * 14 + 1) * 3],
    ];
    const pt = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
    let d = 'M' + top.map(pt).join(' L');
    d += ` L${pt(fringe[0])} L${pt(fringe[1])} L`;
    d += bot.reverse().map(pt).join(' L') + ' Z';
    const stripe = 'M' + mid.slice(0, N).map(pt).join(' L');
    return { d, stripe };
  }

  // ---------- 尘土粒子 ----------
  const dustGroup = $('dust');
  const particles = [];
  let dustTimer = 0;
  function spawnDust() {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('fill', '#d9c9a8');
    dustGroup.appendChild(c);
    particles.push({
      el: c, x: 230 + Math.random() * 20, y: 396 + Math.random() * 4,
      vx: -(SPEED * 0.45 + Math.random() * 60), vy: -(10 + Math.random() * 25),
      r: 2 + Math.random() * 2, life: 0, max: 0.6 + Math.random() * 0.4,
    });
  }
  function updateDust(dt) {
    dustTimer += dt;
    while (dustTimer > 0.07) { dustTimer -= 0.07; spawnDust(); }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { p.el.remove(); particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.r += 9 * dt;
      set(p.el, { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: p.r.toFixed(1), opacity: (0.55 * (1 - p.life / p.max)).toFixed(2) });
    }
  }

  // ---------- 主循环 ----------
  const scroll = (id, k, dist) =>
    $(id).setAttribute('transform', `translate(${(-((dist * k) % 900)).toFixed(2)} 0)`);

  let simTime = 0, last = performance.now(), running = true;

  function update(t, dt) {
    const dist = t * SPEED;
    const wheelAngle = dist / WHEEL_R;
    const crank = wheelAngle * GEAR;

    // 视差背景
    scroll('clouds', 0.04, dist + t * 20);
    scroll('far', 0.12, dist);
    scroll('hills', 0.35, dist);
    scroll('posts', 0.9, dist);
    scroll('grass', 1.25, dist);
    $('roadDash').setAttribute('stroke-dashoffset', (dist % 80).toFixed(2));
    $('sunRays').setAttribute('transform', `rotate(${(t * 12) % 360})`);

    // 车身轻微颠簸
    const bump = Math.sin(crank * 2) * 0.8;
    $('rig').setAttribute('transform', `translate(0 ${bump.toFixed(2)})`);
    $('shadow').setAttribute('rx', (175 + bump * 2).toFixed(1));

    // 车轮与牙盘
    const wheelDeg = (wheelAngle * 180 / Math.PI) % 360;
    $('rearSpokes').setAttribute('transform', `rotate(${wheelDeg})`);
    $('frontSpokes').setAttribute('transform', `rotate(${wheelDeg})`);
    $('spider').setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${(crank * 180 / Math.PI) % 360})`);
    $('chain').setAttribute('stroke-dashoffset', ((crank * 20) % 7).toFixed(2));

    // 曲柄与踏板
    const nearP = { x: BB.x + CRANK * Math.cos(crank), y: BB.y + CRANK * Math.sin(crank) };
    const farP = { x: BB.x + CRANK * Math.cos(crank + Math.PI), y: BB.y + CRANK * Math.sin(crank + Math.PI) };
    set($('nearCrank'), { x1: BB.x, y1: BB.y, x2: nearP.x, y2: nearP.y });
    set($('farCrank'), { x1: BB.x, y1: BB.y, x2: farP.x, y2: farP.y });
    $('nearPedal').setAttribute('transform', `translate(${nearP.x} ${nearP.y})`);
    $('farPedal').setAttribute('transform', `translate(${farP.x} ${farP.y})`);

    // 身体随蹬踏起伏
    const bodyBob = Math.sin(crank * 2) * 1.8;
    $('pelican').setAttribute('transform', `translate(0 ${bodyBob.toFixed(2)})`);
    drawLeg('near', { x: NEAR_HIP.x, y: NEAR_HIP.y + bodyBob }, nearP, crank);
    drawLeg('far', { x: FAR_HIP.x, y: FAR_HIP.y + bodyBob }, farP, crank + Math.PI);

    // 头部滞后摆动 + 脖子跟随
    const lag = crank * 2 - 0.8;
    const hx = Math.sin(lag) * 1.5, hy = Math.sin(lag) * 2.8;
    $('head').setAttribute('transform', `translate(${hx.toFixed(2)} ${hy.toFixed(2)})`);
    const neckD = `M405 148 C440 122 ${(398 + hx).toFixed(1)} ${(98 + hy).toFixed(1)} ${(420 + hx).toFixed(1)} ${(72 + hy).toFixed(1)}`;
    $('neck').setAttribute('d', neckD);
    $('neckOutline').setAttribute('d', neckD);

    // 喉囊抖动
    const pouchS = 1 + Math.sin(crank * 2 - 1.8) * 0.07;
    $('pouch').setAttribute('transform', `translate(446 76) scale(1 ${pouchS.toFixed(3)}) translate(-446 -76)`);

    // 眨眼
    const blink = (t % 3.6) < 0.13 ? 0.12 : 1;
    $('eye').setAttribute('transform', `translate(429 59) scale(1 ${blink}) translate(-429 -59)`);

    // 尾羽摆动
    $('tail').setAttribute('transform', `rotate(${(Math.sin(t * 6) * 3).toFixed(2)} 345 175)`);

    // 围巾
    const scarf = scarfPaths(t);
    $('scarfTail').setAttribute('d', scarf.d);
    $('scarfStripe').setAttribute('d', scarf.stripe);

    // 速度线
    for (const s of speedLines) {
      const cycle = 280;
      const p = ((t * 520 + s.phase) % cycle) / cycle;
      const x = 250 - p * cycle;
      set(s.el, { x1: x, y1: s.y, x2: x + s.len, y2: s.y, opacity: (Math.sin(p * Math.PI) * 0.55).toFixed(2) });
    }

    updateDust(dt);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) {
      simTime += dt;
      update(simTime, dt);
    }
    requestAnimationFrame(frame);
  }

  document.querySelector('.stage').addEventListener('click', () => {
    running = !running;
    $('pauseText').setAttribute('opacity', running ? 0 : 0.9);
  });

  update(0, 0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
