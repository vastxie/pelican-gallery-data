<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #90EE90 50%, #228B22 100%);
            overflow: hidden;
        }
        
        svg {
            max-width: 90vw;
            max-height: 90vh;
        }
        
        /* 车轮旋转动画 */
        @keyframes wheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .wheel {
            animation: wheelSpin 2s linear infinite;
            transform-origin: center;
        }
        
        /* 踏板旋转动画 */
        @keyframes pedalRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .pedal-group {
            animation: pedalRotate 2s linear infinite;
            transform-origin: 300px 320px;
        }
        
        /* 鹈鹕身体轻微上下摆动 */
        @keyframes pelicanBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        .pelican-body {
            animation: pelicanBob 1s ease-in-out infinite;
        }
        
        /* 腿部踩踏动画 */
        @keyframes legPedal {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 云朵飘动 */
        @keyframes cloudFloat {
            0% { transform: translateX(0); }
            100% { transform: translateX(-800px); }
        }
        
        .cloud {
            animation: cloudFloat 20s linear infinite;
        }
        
        .cloud:nth-child(2) {
            animation-duration: 25s;
            animation-delay: -5s;
        }
        
        .cloud:nth-child(3) {
            animation-duration: 30s;
            animation-delay: -10s;
        }
    </style>
</head>
<body>
    <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <!-- 背景云朵 -->
        <g class="cloud" opacity="0.8">
            <ellipse cx="700" cy="80" rx="60" ry="30" fill="white"/>
            <ellipse cx="740" cy="70" rx="50" ry="25" fill="white"/>
            <ellipse cx="680" cy="75" rx="40" ry="20" fill="white"/>
        </g>
        <g class="cloud" opacity="0.6">
            <ellipse cx="900" cy="120" rx="70" ry="35" fill="white"/>
            <ellipse cx="950" cy="110" rx="55" ry="28" fill="white"/>
            <ellipse cx="870" cy="115" rx="45" ry="22" fill="white"/>
        </g>
        <g class="cloud" opacity="0.7">
            <ellipse cx="1100" cy="60" rx="55" ry="28" fill="white"/>
            <ellipse cx="1140" cy="50" rx="45" ry="22" fill="white"/>
            <ellipse cx="1070" cy="55" rx="35" ry="18" fill="white"/>
        </g>
        
        <!-- 地面 -->
        <rect x="0" y="400" width="800" height="100" fill="#228B22"/>
        <rect x="0" y="395" width="800" height="10" fill="#8B4513"/>
        
        <!-- 自行车 -->
        <g id="bicycle">
            <!-- 后轮 -->
            <g class="wheel" style="transform-origin: 220px 350px;">
                <circle cx="220" cy="350" r="45" fill="none" stroke="#333" stroke-width="4"/>
                <circle cx="220" cy="350" r="5" fill="#666"/>
                <!-- 辐条 -->
                <line x1="220" y1="305" x2="220" y2="395" stroke="#666" stroke-width="1"/>
                <line x1="175" y1="350" x2="265" y2="350" stroke="#666" stroke-width="1"/>
                <line x1="188" y1="318" x2="252" y2="382" stroke="#666" stroke-width="1"/>
                <line x1="252" y1="318" x2="188" y2="382" stroke="#666" stroke-width="1"/>
            </g>
            
            <!-- 前轮 -->
            <g class="wheel" style="transform-origin: 380px 350px;">
                <circle cx="380" cy="350" r="45" fill="none" stroke="#333" stroke-width="4"/>
                <circle cx="380" cy="350" r="5" fill="#666"/>
                <!-- 辐条 -->
                <line x1="380" y1="305" x2="380" y2="395" stroke="#666" stroke-width="1"/>
                <line x1="335" y1="350" x2="425" y2="350" stroke="#666" stroke-width="1"/>
                <line x1="348" y1="318" x2="412" y2="382" stroke="#666" stroke-width="1"/>
                <line x1="412" y1="318" x2="348" y2="382" stroke="#666" stroke-width="1"/>
            </g>
            
            <!-- 车架 -->
            <!-- 座管 -->
            <line x1="280" y1="280" x2="260" y2="350" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
            <!-- 上管 -->
            <line x1="280" y1="280" x2="350" y2="290" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
            <!-- 下管 -->
            <line x1="260" y1="350" x2="350" y2="290" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
            <!-- 后下叉 -->
            <line x1="260" y1="350" x2="220" y2="350" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
            <!-- 后上叉 -->
            <line x1="280" y1="280" x2="220" y2="350" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
            <!-- 前叉 -->
            <line x1="350" y1="290" x2="380" y2="350" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
            
            <!-- 车把 -->
            <line x1="350" y1="290" x2="350" y2="260" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="335" y1="260" x2="365" y2="260" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <!-- 车把手 -->
            <circle cx="335" cy="260" r="4" fill="#333"/>
            <circle cx="365" cy="260" r="4" fill="#333"/>
            
            <!-- 座椅 -->
            <ellipse cx="280" cy="275" rx="20" ry="8" fill="#4A4A4A"/>
            
            <!-- 踏板系统 -->
            <g class="pedal-group">
                <!-- 曲柄 -->
                <line x1="300" y1="320" x2="300" y2="340" stroke="#666" stroke-width="4" stroke-linecap="round"/>
                <line x1="300" y1="320" x2="300" y2="300" stroke="#666" stroke-width="4" stroke-linecap="round"/>
                <!-- 踏板 -->
                <rect x="290" y="338" width="20" height="6" fill="#333" rx="2"/>
                <rect x="290" y="296" width="20" height="6" fill="#333" rx="2"/>
            </g>
            <!-- 中轴 -->
            <circle cx="300" cy="320" r="8" fill="#666"/>
            
            <!-- 链条 (简化表示) -->
            <path d="M 220 350 Q 260 370 300 320" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="4,2"/>
        </g>
        
        <!-- 鹈鹕 -->
        <g class="pelican-body">
            <!-- 身体 -->
            <ellipse cx="290" cy="240" rx="45" ry="35" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
            
            <!-- 翅膀 (左侧，可见) -->
            <path d="M 270 230 Q 240 250 260 270 Q 280 260 290 245" fill="#F5F5F5" stroke="#DDD" stroke-width="2"/>
            
            <!-- 脖子 -->
            <path d="M 310 220 Q 330 200 340 180 Q 345 170 350 165" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
            <path d="M 310 220 Q 330 200 340 180 Q 345 170 350 165" fill="none" stroke="#EEE" stroke-width="14" stroke-linecap="round"/>
            
            <!-- 头部 -->
            <ellipse cx="355" cy="160" rx="22" ry="20" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
            
            <!-- 眼睛 -->
            <circle cx="362" cy="155" r="4" fill="#333"/>
            <circle cx="363" cy="154" r="1.5" fill="white"/>
            
            <!-- 喙 (鹈鹕特征性的大嘴) -->
            <path d="M 370 158 L 420 165 Q 425 175 415 185 L 370 175 Z" fill="#FFA500" stroke="#E69500" stroke-width="2"/>
            <!-- 喉囊 -->
            <path d="M 370 175 Q 390 195 415 185" fill="#FFD700" stroke="#E69500" stroke-width="1" opacity="0.8"/>
            
            <!-- 头顶羽毛 -->
            <path d="M 345 145 Q 350 135 355 142" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
            <path d="M 350 143 Q 355 133 360 140" fill="#FFFFFF" stroke="#DDD" stroke-width="1"/>
            
            <!-- 腿 (连接到踏板) -->
            <g>
                <!-- 左腿 -->
                <line x1="280" y1="270" x2="295" y2="310" stroke="#FFA500" stroke-width="5" stroke-linecap="round">
                    <animate attributeName="x2" values="295;305;295;285;295" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="310;320;330;320;310" dur="2s" repeatCount="indefinite"/>
                </line>
                <!-- 右脚 -->
                <ellipse cx="295" cy="312" rx="8" ry="4" fill="#FFA500">
                    <animate attributeName="cx" values="295;305;295;285;295" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="cy" values="312;322;332;322;312" dur="2s" repeatCount="indefinite"/>
                </ellipse>
            </g>
            
            <!-- 尾巴 -->
            <path d="M 250 245 Q 230 240 220 250 Q 235 255 250 250" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
        </g>
        
        <!-- 地面装饰 -->
        <g opacity="0.6">
            <circle cx="100" cy="420" r="3" fill="#8B4513"/>
            <circle cx="250" cy="430" r="2" fill="#8B4513"/>
            <circle cx="450" cy="415" r="3" fill="#8B4513"/>
            <circle cx="600" cy="425" r="2" fill="#8B4513"/>
            <circle cx="750" cy="418" r="3" fill="#8B4513"/>
        </g>
        
        <!-- 小花 -->
        <g>
            <circle cx="150" cy="398" r="5" fill="#FF69B4"/>
            <circle cx="150" cy="398" r="2" fill="#FFD700"/>
            <line x1="150" y1="403" x2="150" y2="415" stroke="#228B22" stroke-width="2"/>
        </g>
        <g>
            <circle cx="500" cy="398" r="5" fill="#FF69B4"/>
            <circle cx="500" cy="398" r="2" fill="#FFD700"/>
            <line x1="500" y1="403" x2="500" y2="415" stroke="#228B22" stroke-width="2"/>
        </g>
        <g>
            <circle cx="680" cy="398" r="5" fill="#87CEEB"/>
            <circle cx="680" cy="398" r="2" fill="#FFD700"/>
            <line x1="680" y1="403" x2="680" y2="415" stroke="#228B22" stroke-width="2"/>
        </g>
    </svg>
</body>
</html>
