<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --ink: #2a1810;
      --paper: #1a1410;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background:
        radial-gradient(ellipse at 50% 0%, #3b2a22 0%, var(--paper) 62%);
      color: #f4e6d4;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 36px;
    }

    .wrap {
      width: min(96vw, 1280px);
    }

    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 22px;
      overflow: hidden;
      background: #f6b56a;
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .caption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 8px 0;
      flex-wrap: wrap;
    }

    .caption h1 {
      font-size: clamp(1.15rem, 2.2vw, 1.65rem);
      font-weight: 650;
      letter-spacing: 0.04em;
    }

    .caption p {
      font-size: 0.92rem;
      opacity: 0.72;
      letter-spacing: 0.06em;
    }

    /* --- motion --- */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes scroll-road {
      to { transform: translateX(-402px); }
    }
    @keyframes scroll-slow {
      to { transform: translateX(-402px); }
    }
    @keyframes wave {
      to { transform: translateX(-240px); }
    }
    @keyframes drift {
      to { transform: translateX(-1600px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(11deg); }
      70% { transform: rotate(-5deg); }
    }
    @keyframes nod {
      0%, 100% { transform: rotate(-2.2deg); }
      50% { transform: rotate(2.4deg); }
    }
    @keyframes pouch {
      0%, 100% { transform: scaleY(1) rotate(0deg); }
      50% { transform: scaleY(1.07) rotate(2.2deg); }
    }
    @keyframes fish-wiggle {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(4px, -5px) rotate(10deg); }
    }
    @keyframes drip {
      0%, 18% { transform: translateY(0); opacity: 0; }
      28% { opacity: 1; }
      78% { transform: translateY(46px); opacity: 0.9; }
      100% { transform: translateY(62px); opacity: 0; }
    }
    @keyframes sun-pulse {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.06); opacity: 0.75; }
    }
    @keyframes bird-sine {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.85; }
    }
    @keyframes grass-sway {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(5deg); }
    }

    .spin, .spin-rev, .flap, .nod, .pouch, .sway {
      transform-box: fill-box;
      transform-origin: center;
    }
    .spin { animation: spin 1s linear infinite; }
    .spin-rev { animation: spin 1s linear infinite reverse; }
    .scroll-road { animation: scroll-road 1s linear infinite; }
    .scroll-mid { animation: scroll-slow 6s linear infinite; }
    .scroll-far { animation: scroll-slow 18s linear infinite; }
    .waves-a { animation: wave 4.5s linear infinite; }
    .waves-b { animation: wave 7s linear infinite; }
    .cloud-drift { animation: drift 48s linear infinite; }
    .cloud-drift-2 { animation: drift 72s linear infinite; }
    .bob { animation: bob 0.42s ease-in-out infinite; }
    .flap { animation: flap 1.35s ease-in-out infinite; }
    .nod { animation: nod 0.42s ease-in-out infinite; }
    .pouch { animation: pouch 0.42s ease-in-out infinite; transform-origin: 30% 0%; }
    .fish { animation: fish-wiggle 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .drip { animation: drip 2.8s ease-in infinite; }
    .sun-glow { animation: sun-pulse 5s ease-in-out infinite; transform-origin: 980px 198px; transform-box: view-box; }
    .bird-bob { animation: bird-sine 2.2s ease-in-out infinite; }
    .sparkle { animation: sparkle 2.4s ease-in-out infinite; }
    .sparkle.d2 { animation-delay: -0.8s; }
    .sparkle.d3 { animation-delay: -1.5s; }
    .sway { animation: grass-sway 2.4s ease-in-out infinite; transform-origin: 50% 100%; }

    @media (prefers-reduced-motion: reduce) {
      .frame * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
        <title id="title">鹈鹕骑自行车</title>
        <desc id="desc">一只美国白鹈鹕骑着复古海滩自行车，沿着日落海岸公路循环前进。车轮旋转，双脚蹬踏，巨嘴喉囊轻轻晃动。</desc>

        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ef6d4a" />
            <stop offset="22%" stop-color="#f39a5a" />
            <stop offset="48%" stop-color="#f7c97a" />
            <stop offset="68%" stop-color="#b8d6de" />
            <stop offset="100%" stop-color="#6aa8b8" />
          </linearGradient>

          <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6c2" />
            <stop offset="55%" stop-color="#ffe066" />
            <stop offset="100%" stop-color="#ffb347" />
          </radialGradient>

          <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe08a" stop-opacity="0.7" />
            <stop offset="70%" stop-color="#ff9a4a" stop-opacity="0.12" />
            <stop offset="100%" stop-color="#ff9a4a" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4f91a6" />
            <stop offset="45%" stop-color="#2f6d86" />
            <stop offset="100%" stop-color="#1d4e68" />
          </linearGradient>

          <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#edc39a" />
            <stop offset="100%" stop-color="#d29b6a" />
          </linearGradient>

          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5a5854" />
            <stop offset="40%" stop-color="#3f3d3a" />
            <stop offset="100%" stop-color="#2c2a28" />
          </linearGradient>

          <linearGradient id="bodyWhite" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffdf8" />
            <stop offset="55%" stop-color="#f3eadb" />
            <stop offset="100%" stop-color="#e2d2bb" />
          </linearGradient>

          <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#ffe07a" />
            <stop offset="55%" stop-color="#f0b429" />
            <stop offset="100%" stop-color="#d48912" />
          </linearGradient>

          <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2="0.3">
            <stop offset="0%" stop-color="#f7b03a" />
            <stop offset="50%" stop-color="#ef8a1f" />
            <stop offset="100%" stop-color="#d96a12" />
          </linearGradient>

          <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e23a3a" />
            <stop offset="50%" stop-color="#c1121f" />
            <stop offset="100%" stop-color="#8e0e18" />
          </linearGradient>

          <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7a5a6a" />
            <stop offset="100%" stop-color="#4a3548" />
          </linearGradient>

          <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#1a0e08" flood-opacity="0.28" />
          </filter>

          <filter id="grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" />
            <feColorMatrix type="saturate" values="0" />
            <feComponentTransfer>
              <feFuncA type="table" tableValues="0 0.055" />
            </feComponentTransfer>
          </filter>

          <clipPath id="pouchClip">
            <path d="M-72,-8 C-60,42 8,62 72,18 C90,-8 78,-22 54,-20 C10,-16 -40,-12 -72,-8 Z" />
          </clipPath>

          <!-- balloon-tire wheel, drawn around origin -->
          <g id="wheel">
            <circle r="64" fill="#1a1614" />
            <circle r="55" fill="#f0e6d2" />
            <circle r="51" fill="none" stroke="#2a1810" stroke-width="2.2" />
            <circle r="59" fill="none" stroke="#3a342e" stroke-width="3" stroke-dasharray="4 9" />
            <g stroke="#2a1810" stroke-width="1.7" stroke-linecap="round">
              <line y1="-51" y2="51" />
              <line y1="-51" y2="51" transform="rotate(30)" />
              <line y1="-51" y2="51" transform="rotate(60)" />
              <line y1="-51" y2="51" transform="rotate(90)" />
              <line y1="-51" y2="51" transform="rotate(120)" />
              <line y1="-51" y2="51" transform="rotate(150)" />
            </g>
            <circle r="12" fill="#2a1810" />
            <circle r="5.5" fill="#e0b125" />
            <rect x="-2.2" y="-56" width="4.4" height="9" rx="1" fill="#2a1810" />
          </g>

          <g id="roadTile">
            <!-- asphalt already painted globally; this tile is markings + props -->
            <rect x="36" y="26" width="54" height="7" rx="3.5" fill="#f0d15a" />
            <rect x="237" y="26" width="54" height="7" rx="3.5" fill="#f0d15a" />
            <!-- stones -->
            <ellipse cx="120" cy="58" rx="9" ry="5" fill="#6a6560" />
            <ellipse cx="310" cy="70" rx="7" ry="4" fill="#5a5550" />
            <ellipse cx="18" cy="66" rx="5" ry="3" fill="#7a736c" />
            <!-- roadside grass -->
            <g fill="#6aa24a" stroke="#2a1810" stroke-width="1">
              <path d="M70,2 C68,-18 78,-26 74,-38 C86,-18 80,-6 82,2 Z" />
              <path d="M82,2 C86,-16 96,-22 92,-34 C102,-14 94,-4 96,2 Z" />
              <path d="M200,2 C198,-14 208,-18 204,-28 C214,-12 208,0 210,2 Z" />
              <path d="M340,2 C338,-16 348,-24 344,-34 C356,-16 348,-2 350,2 Z" />
            </g>
            <!-- palm -->
            <g transform="translate(168,-2)">
              <path d="M0,4 C6,-36 2,-70 1,-108" fill="none" stroke="#7a4a28" stroke-width="11" stroke-linecap="round" />
              <path d="M1,-104 C4,-70 3,-30 0,4" fill="none" stroke="#c47a3a" stroke-width="3.5" stroke-linecap="round" />
              <g fill="#3f8c3a" stroke="#2a1810" stroke-width="1.3" stroke-linejoin="round">
                <path d="M1,-108 C-38,-128 -70,-112 -78,-88 C-40,-108 -12,-104 1,-108 Z" />
                <path d="M1,-108 C-28,-150 -8,-168 10,-150 C6,-132 4,-116 1,-108 Z" />
                <path d="M1,-108 C40,-132 78,-112 86,-86 C46,-110 16,-104 1,-108 Z" />
                <path d="M1,-108 C32,-154 14,-172 -4,-150 C-2,-130 0,-116 1,-108 Z" />
                <path d="M1,-108 C-18,-140 -48,-138 -56,-118 C-28,-128 -6,-114 1,-108 Z" />
                <path d="M1,-108 C22,-136 54,-128 62,-108 C34,-122 12,-110 1,-108 Z" />
              </g>
              <g fill="#c9a03a">
                <circle cx="-6" cy="-100" r="4.2" />
                <circle cx="8" cy="-98" r="4.6" />
                <circle cx="1" cy="-90" r="4" />
              </g>
            </g>
            <!-- mile post -->
            <g transform="translate(300,-2)">
              <rect x="-3" y="-46" width="6" height="48" fill="#8a5a32" stroke="#2a1810" stroke-width="1.2" />
              <rect x="-18" y="-70" width="36" height="26" rx="3" fill="#f3e2c0" stroke="#2a1810" stroke-width="1.4" />
              <text x="0" y="-53" text-anchor="middle" font-size="11" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif" fill="#2a1810">海岸</text>
            </g>
          </g>

          <g id="webbedFoot">
            <ellipse cx="0" cy="3" rx="13" ry="7.5" fill="#e25a16" stroke="#2a1810" stroke-width="1.6" />
            <path d="M-11,4 Q-16,18 -5,15 Q0,7 0,4" fill="#e25a16" stroke="#2a1810" stroke-width="1.3" />
            <path d="M0,4 Q1,20 9,15 Q7,7 5,4" fill="#e25a16" stroke="#2a1810" stroke-width="1.3" />
            <path d="M8,3 Q16,14 14,6" fill="#e25a16" stroke="#2a1810" stroke-width="1.3" />
          </g>
        </defs>

        <!-- SKY -->
        <rect width="1280" height="720" fill="url(#sky)" />
        <circle class="sun-glow" cx="980" cy="198" r="210" fill="url(#sunHalo)" />
        <circle cx="980" cy="198" r="78" fill="url(#sunCore)" />
        <circle cx="958" cy="180" r="18" fill="#fff6c2" opacity="0.35" />

        <!-- distant birds -->
        <g fill="none" stroke="#2a1810" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
          <g class="cloud-drift" transform="translate(900,130)">
            <g class="bird-bob">
              <path d="M0,0 Q12,-10 22,2 Q32,-12 46,0" />
            </g>
          </g>
          <g class="cloud-drift-2" transform="translate(1180,168)">
            <g class="bird-bob" style="animation-delay:-1s">
              <path d="M0,0 Q8,-7 16,1 Q24,-8 34,0" />
            </g>
          </g>
        </g>

        <!-- CLOUDS -->
        <g class="cloud-drift" fill="#ffe9c8" opacity="0.82">
          <g transform="translate(140,92)">
            <ellipse cx="0" cy="16" rx="54" ry="22" />
            <ellipse cx="38" cy="8" rx="40" ry="20" />
            <ellipse cx="70" cy="18" rx="34" ry="16" />
          </g>
          <g transform="translate(1540,92)">
            <ellipse cx="0" cy="16" rx="54" ry="22" />
            <ellipse cx="38" cy="8" rx="40" ry="20" />
            <ellipse cx="70" cy="18" rx="34" ry="16" />
          </g>
        </g>
        <g class="cloud-drift-2" fill="#fff1da" opacity="0.7">
          <g transform="translate(520,58)">
            <ellipse cx="0" cy="14" rx="36" ry="16" />
            <ellipse cx="30" cy="8" rx="28" ry="14" />
            <ellipse cx="54" cy="16" rx="22" ry="11" />
          </g>
          <g transform="translate(1920,58)">
            <ellipse cx="0" cy="14" rx="36" ry="16" />
            <ellipse cx="30" cy="8" rx="28" ry="14" />
            <ellipse cx="54" cy="16" rx="22" ry="11" />
          </g>
        </g>

        <!-- HILLS -->
        <path fill="url(#hillA)" opacity="0.85" d="M-20,390 C120,300 220,330 340,300 C480,262 560,330 700,290 C840,248 940,320 1100,280 C1200,256 1280,300 1320,290 L1320,430 L-20,430 Z" />
        <path fill="#5c3f52" opacity="0.55" d="M-20,410 C80,350 180,380 300,350 C460,310 540,380 720,345 C900,308 1020,380 1320,330 L1320,440 L-20,440 Z" />

        <!-- lighthouse -->
        <g transform="translate(1088,268)">
          <rect x="-10" y="20" width="20" height="78" fill="#f3efe4" stroke="#2a1810" stroke-width="1.6" />
          <rect x="-10" y="36" width="20" height="10" fill="#c1121f" />
          <rect x="-10" y="62" width="20" height="10" fill="#c1121f" />
          <polygon points="0,4 -16,22 16,22" fill="#c1121f" stroke="#2a1810" stroke-width="1.5" />
          <rect x="-8" y="22" width="16" height="10" fill="#ffe08a" stroke="#2a1810" stroke-width="1.2" />
          <rect x="-22" y="96" width="44" height="10" fill="#6a5344" />
        </g>

        <!-- SEA -->
        <rect y="392" width="1280" height="118" fill="url(#sea)" />
        <ellipse cx="980" cy="430" rx="160" ry="18" fill="#ffe9a8" opacity="0.28" />
        <g class="waves-a" fill="none" stroke="#d7eef4" stroke-width="3" opacity="0.55">
          <path d="M-240,428 Q-180,416 -120,428 T0,428 T120,428 T240,428 T360,428 T480,428 T600,428 T720,428 T840,428 T960,428 T1080,428 T1200,428 T1320,428 T1440,428 T1560,428" />
        </g>
        <g class="waves-b" fill="none" stroke="#9fd0dc" stroke-width="2.4" opacity="0.7">
          <path d="M-240,452 Q-180,440 -120,452 T0,452 T120,452 T240,452 T360,452 T480,452 T600,452 T720,452 T840,452 T960,452 T1080,452 T1200,452 T1320,452 T1440,452 T1560,452" />
        </g>
        <g class="sparkle" fill="#fff">
          <circle cx="220" cy="468" r="2.2" />
          <circle cx="640" cy="480" r="1.6" />
          <circle cx="1010" cy="458" r="2" />
        </g>
        <g class="sparkle d2" fill="#fff">
          <circle cx="400" cy="490" r="1.8" />
          <circle cx="860" cy="472" r="2.2" />
        </g>
        <g class="sparkle d3" fill="#fff">
          <circle cx="70" cy="478" r="1.5" />
          <circle cx="1180" cy="486" r="1.8" />
        </g>

        <!-- SAND -->
        <path fill="url(#sand)" d="M0,500 C180,488 340,512 520,498 C760,480 980,516 1280,492 L1280,575 L0,575 Z" />

        <!-- ROAD -->
        <rect y="568" width="1280" height="152" fill="url(#road)" />
        <rect y="568" width="1280" height="8" fill="#6e6a64" />
        <rect y="572" width="1280" height="3" fill="#d7a94a" opacity="0.35" />

        <g class="scroll-road">
          <use href="#roadTile" x="-402" y="568" />
          <use href="#roadTile" x="0" y="568" />
          <use href="#roadTile" x="402" y="568" />
          <use href="#roadTile" x="804" y="568" />
          <use href="#roadTile" x="1206" y="568" />
          <use href="#roadTile" x="1608" y="568" />
        </g>

        <!-- RIDER: origin at rear hub -->
        <g transform="translate(456, 572)" filter="url(#soft)">
          <!-- ground shadow -->
          <ellipse cx="132" cy="66" rx="188" ry="13" fill="#1a0e08" opacity="0.28" />

          <!-- FAR wing (balance), trailing back-left -->
          <g transform="translate(18,-176)">
            <g>
              <animateTransform attributeName="transform" type="rotate" values="8;22;6;-4;8" dur="1.35s" repeatCount="indefinite" />
              <path d="M0,8 C-36,-18 -28,-64 8,-58 C24,-54 18,-20 0,8 Z"
                    fill="#efe4d2" stroke="#2a1810" stroke-width="2.4" stroke-linejoin="round" />
              <path d="M-22,-48 C-30,-64 -8,-70 6,-56 C-8,-58 -16,-52 -22,-48 Z" fill="#2e3142" />
            </g>
          </g>

          <!-- rear wheel -->
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite" />
            <use href="#wheel" />
          </g>

          <!-- far crank + far foot (behind frame) -->
          <g transform="translate(115,12)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite" />
              <line x1="0" y1="0" x2="-34" y2="0" stroke="#2a1810" stroke-width="7" stroke-linecap="round" />
              <g transform="translate(-34,0)">
                <g>
                  <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite" />
                  <rect x="-11" y="-5" width="22" height="9" rx="2" fill="#efe6d2" stroke="#2a1810" stroke-width="1.6" />
                  <use href="#webbedFoot" y="4" />
                </g>
              </g>
            </g>
          </g>

          <!-- far leg (morphs opposite the near leg) -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="#2a1810" stroke-width="20" d="M88 -118 Q78 -42 81 12">
              <animate attributeName="d" dur="1s" repeatCount="indefinite"
                values="M88 -118 Q78 -42 81 12;
                        M88 -118 Q108 -60 115 -22;
                        M88 -118 Q128 -40 149 12;
                        M88 -118 Q100 -15 115 46;
                        M88 -118 Q78 -42 81 12" />
            </path>
            <path stroke="#e25a16" stroke-width="13" d="M88 -118 Q78 -42 81 12">
              <animate attributeName="d" dur="1s" repeatCount="indefinite"
                values="M88 -118 Q78 -42 81 12;
                        M88 -118 Q108 -60 115 -22;
                        M88 -118 Q128 -40 149 12;
                        M88 -118 Q100 -15 115 46;
                        M88 -118 Q78 -42 81 12" />
            </path>
          </g>

          <!-- chain -->
          <ellipse cx="62" cy="10" rx="58" ry="13" fill="none" stroke="#2a1810" stroke-width="4.2" />
          <ellipse cx="62" cy="10" rx="58" ry="13" fill="none" stroke="#d8c39a" stroke-width="1.8" stroke-dasharray="5 4">
            <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.35s" repeatCount="indefinite" />
          </ellipse>
          <circle cx="115" cy="12" r="16" fill="none" stroke="#2a1810" stroke-width="5" />
          <circle cx="115" cy="12" r="16" fill="none" stroke="#c9b48a" stroke-width="1.6" />
