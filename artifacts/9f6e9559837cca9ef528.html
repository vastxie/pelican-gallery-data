<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(#87ceeb 0%, #b3e5fc 60%, #cdeff5 100%);
    overflow: hidden;
    font-family: sans-serif;
  }
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: min(90vw, 900px); height: auto; }

  /* 背景滚动 */
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-240px); }
  }
  .ground-scroll { animation: scroll 1.2s linear infinite; }

  /* 车轮旋转 */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel { animation: spin 0.6s linear infinite; transform-origin: center; }

  /* 整体上下颠簸 */
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .rider { animation: bob 0.6s ease-in-out infinite; }

  /* 踏板腿 */
  @keyframes pedalLeft {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .pedal-crank { animation: pedalLeft 0.6s linear infinite; transform-origin: 300px 330px; }

  /* 腿部摆动 */
  @keyframes legFront { 0%,100%{transform:rotate(8deg);}50%{transform:rotate(-8deg);} }
  @keyframes legBack  { 0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);} }
  .leg-front { animation: legFront 0.6s ease-in-out infinite; transform-origin: 285px 300px; }
  .leg-back  { animation: legBack 0.6s ease-in-out infinite; transform-origin: 285px 300px; }

  /* 喙里的鱼摆动 */
  @keyframes flap { 0%,100%{transform:rotate(0deg);}50%{transform:rotate(-6deg);} }
  .beak-lower { animation: flap 0.9s ease-in-out infinite; transform-origin: 355px 190px; }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
    <!-- 天空里的云 -->
    <g fill="#ffffff" opacity="0.85">
      <g class="ground-scroll">
        <ellipse cx="120" cy="70" rx="40" ry="18"/>
        <ellipse cx="150" cy="60" rx="30" ry="16"/>
        <ellipse cx="420" cy="90" rx="45" ry="20"/>
        <ellipse cx="450" cy="80" rx="30" ry="16"/>
        <ellipse cx="720" cy="70" rx="40" ry="18"/>
        <ellipse cx="750" cy="60" rx="30" ry="16"/>
      </g>
    </g>

    <!-- 地面 -->
    <rect x="0" y="380" width="600" height="40" fill="#8bc34a"/>
    <g class="ground-scroll" stroke="#689f38" stroke-width="4">
      <line x1="20"  y1="395" x2="60"  y2="395"/>
      <line x1="120" y1="395" x2="160" y2="395"/>
      <line x1="220" y1="395" x2="260" y2="395"/>
      <line x1="320" y1="395" x2="360" y2="395"/>
      <line x1="420" y1="395" x2="460" y2="395"/>
      <line x1="520" y1="395" x2="560" y2="395"/>
      <line x1="620" y1="395" x2="660" y2="395"/>
      <line x1="720" y1="395" x2="760" y2="395"/>
    </g>

    <g class="rider">
      <!-- ===== 自行车 ===== -->
      <g>
        <!-- 后轮 -->
        <g transform="translate(180,330)">
          <circle r="46" fill="none" stroke="#222" stroke-width="6"/>
          <circle r="6" fill="#222"/>
          <g class="wheel">
            <line x1="0" y1="-42" x2="0" y2="42" stroke="#555" stroke-width="2"/>
            <line x1="-42" y1="0" x2="42" y2="0" stroke="#555" stroke-width="2"/>
            <line x1="-30" y1="-30" x2="30" y2="30" stroke="#555" stroke-width="2"/>
            <line x1="-30" y1="30" x2="30" y2="-30" stroke="#555" stroke-width="2"/>
          </g>
        </g>
        <!-- 前轮 -->
        <g transform="translate(420,330)">
          <circle r="46" fill="none" stroke="#222" stroke-width="6"/>
          <circle r="6" fill="#222"/>
          <g class="wheel">
            <line x1="0" y1="-42" x2="0" y2="42" stroke="#555" stroke-width="2"/>
            <line x1="-42" y1="0" x2="42" y2="0" stroke="#555" stroke-width="2"/>
            <line x1="-30" y1="-30" x2="30" y2="30" stroke="#555" stroke-width="2"/>
            <line x1="-30" y1="30" x2="30" y2="-30" stroke="#555" stroke-width="2"/>
          </g>
        </g>

        <!-- 车架 -->
        <g stroke="#e53935" stroke-width="7" fill="none" stroke-linecap="round">
          <line x1="180" y1="330" x2="300" y2="330"/>  <!-- 下管到中轴 -->
          <line x1="300" y1="330" x2="420" y2="330"/>  <!-- 中轴到前轮 -->
          <line x1="300" y1="330" x2="270" y2="255"/>  <!-- 座管 -->
          <line x1="180" y1="330" x2="270" y2="255"/>  <!-- 上管 -->
          <line x1="270" y1="255" x2="410" y2="250"/>  <!-- 上梁到车把 -->
          <line x1="410" y1="250" x2="420" y2="330"/>  <!-- 前叉 -->
        </g>
        <!-- 车座 -->
        <rect x="248" y="248" width="45" height="12" rx="6" fill="#333"/>
        <!-- 车把 -->
        <line x1="410" y1="250" x2="435" y2="235" stroke="#333" stroke-width="6" stroke-linecap="round"/>

        <!-- 曲柄和踏板 -->
        <g class="pedal-crank">
          <line x1="300" y1="330" x2="300" y2="365" stroke="#333" stroke-width="5"/>
          <rect x="288" y="362" width="24" height="8" rx="3" fill="#333"/>
          <line x1="300" y1="330" x2="300" y2="295" stroke="#333" stroke-width="5"/>
          <rect x="288" y="290" width="24" height="8" rx="3" fill="#333"/>
        </g>
        <circle cx="300" cy="330" r="10" fill="#333"/>
      </g>

      <!-- ===== 鹈鹕 ===== -->
      <!-- 后腿 -->
      <g class="leg-back">
        <line x1="285" y1="255" x2="300" y2="330" stroke="#f4a742" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="270" cy="210" rx="70" ry="55" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
      <!-- 翅膀 -->
      <path d="M255 195 Q210 210 245 250 Q265 235 285 220 Z" fill="#eeeeee" stroke="#cfcfcf" stroke-width="2"/>

      <!-- 前腿(踩踏) -->
      <g class="leg-front">
        <line x1="285" y1="255" x2="300" y2="330" stroke="#f6b350" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- 脖子 -->
      <path d="M320 185 Q345 150 340 120 Q338 110 330 112 Q332 145 305 170 Z" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>

      <!-- 头 -->
      <circle cx="336" cy="120" r="26" fill="#ffffff" stroke="#dcdcdc" stroke-width="2"/>
      <!-- 眼睛 -->
      <circle cx="345" cy="114" r="4.5" fill="#222"/>
      <circle cx="346.5" cy="112.5" r="1.5" fill="#fff"/>

      <!-- 喙 上颚 -->
      <path d="M355 112 L410 118 Q412 124 405 126 L355 128 Z" fill="#ffb300" stroke="#e69500" stroke-width="1.5"/>
      <!-- 喙 下颚 + 喉囊 -->
      <g class="beak-lower">
        <path d="M355 128 Q385 175 405 128 Q380 150 355 132 Z" fill="#ffc94d" stroke="#e69500" stroke-width="1.5"/>
      </g>

      <!-- 头顶小毛 -->
      <path d="M320 98 Q322 88 328 96" fill="none" stroke="#dcdcdc" stroke-width="3" stroke-linecap="round"/>
    </g>
  </svg>
</div>
</body>
</html>
