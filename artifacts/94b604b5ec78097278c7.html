<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #87CEEB 0%, #B0E0F6 45%, #E8F4E8 70%, #C8E6C9 100%);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      overflow: hidden;
    }
    h1 {
      color: #1a5276;
      font-weight: 600;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      margin-bottom: 0.5rem;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    }
    .stage {
      width: min(920px, 96vw);
      background: rgba(255,255,255,0.35);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(26, 82, 118, 0.15);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }
    svg { display: block; width: 100%; height: auto; }
    .hint {
      margin-top: 0.75rem;
      color: #2c6b8a;
      font-size: 0.9rem;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <div class="stage">
    <svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑自行车的动画">
      <defs>
        <!-- Soft cloud -->
        <radialGradient id="cloudGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#e8f4ff" stop-opacity="0.7"/>
        </radialGradient>
        <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7CB342"/>
          <stop offset="100%" stop-color="#558B2F"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="55%" stop-color="#F5F5F0"/>
          <stop offset="100%" stop-color="#E0E0D8"/>
        </linearGradient>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ECECE6"/>
          <stop offset="100%" stop-color="#BDBDB5"/>
        </linearGradient>
        <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFB74D"/>
          <stop offset="100%" stop-color="#F57C00"/>
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFCC80"/>
          <stop offset="100%" stop-color="#EF6C00"/>
        </linearGradient>
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#42A5F5"/>
          <stop offset="100%" stop-color="#1565C0"/>
        </linearGradient>
        <!-- Wheel spokes clip -->
        <clipPath id="wheelClip">
          <circle cx="0" cy="0" r="38"/>
        </clipPath>
      </defs>

      <!-- Sky accents -->
      <g class="sun">
        <circle cx="700" cy="70" r="36" fill="#FFE082" opacity="0.95"/>
        <circle cx="700" cy="70" r="48" fill="#FFF59D" opacity="0.35"/>
      </g>

      <!-- Distant hills -->
      <ellipse cx="120" cy="360" rx="180" ry="50" fill="#A5D6A7" opacity="0.7"/>
      <ellipse cx="420" cy="355" rx="220" ry="55" fill="#81C784" opacity="0.65"/>
      <ellipse cx="700" cy="365" rx="160" ry="45" fill="#A5D6A7" opacity="0.7"/>

      <!-- Ground -->
      <rect x="0" y="380" width="800" height="100" fill="url(#groundGrad)"/>
      <!-- Road -->
      <rect x="0" y="400" width="800" height="36" fill="#78909C"/>
      <rect x="0" y="412" width="800" height="6" fill="#FFEB3B" opacity="0.85">
        <animate attributeName="stroke-dashoffset" values="0;40" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <!-- Dashed center line via moving pattern -->
      <g>
        <rect x="-40" y="414" width="40" height="4" fill="#FFF59D" rx="1">
          <animate attributeName="x" from="-40" to="840" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="80" y="414" width="40" height="4" fill="#FFF59D" rx="1">
          <animate attributeName="x" from="80" to="960" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="200" y="414" width="40" height="4" fill="#FFF59D" rx="1">
          <animate attributeName="x" from="200" to="1080" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="320" y="414" width="40" height="4" fill="#FFF59D" rx="1">
          <animate attributeName="x" from="320" to="1200" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="440" y="414" width="40" height="4" fill="#FFF59D" rx="1">
          <animate attributeName="x" from="440" to="1320" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="560" y="414" width="40" height="4" fill="#FFF59D" rx="1">
          <animate attributeName="x" from="560" to="1440" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="680" y="414" width="40" height="4" fill="#FFF59D" rx="1">
          <animate attributeName="x" from="680" to="1560" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Moving clouds -->
      <g opacity="0.9">
        <g>
          <ellipse cx="100" cy="80" rx="40" ry="18" fill="url(#cloudGrad)"/>
          <ellipse cx="125" cy="72" rx="28" ry="16" fill="url(#cloudGrad)"/>
          <ellipse cx="75" cy="75" rx="22" ry="14" fill="url(#cloudGrad)"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="28s" repeatCount="indefinite"/>
        </g>
        <g>
          <ellipse cx="-80" cy="120" rx="36" ry="16" fill="url(#cloudGrad)"/>
          <ellipse cx="-55" cy="112" rx="24" ry="14" fill="url(#cloudGrad)"/>
          <ellipse cx="-100" cy="115" rx="20" ry="12" fill="url(#cloudGrad)"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="980 8" dur="36s" repeatCount="indefinite"/>
        </g>
        <g>
          <ellipse cx="500" cy="55" rx="32" ry="14" fill="url(#cloudGrad)"/>
          <ellipse cx="522" cy="48" rx="22" ry="12" fill="url(#cloudGrad)"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="400 0" dur="40s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- Whole rider group: slight bob + forward drift illusion via road -->
      <g id="rider">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -4; 0 0; 0 -3; 0 0"
          keyTimes="0;0.25;0.5;0.75;1"
          dur="0.7s" repeatCount="indefinite"/>

        <!-- Bicycle -->
        <g id="bike" transform="translate(280, 300)">
          <!-- Rear wheel -->
          <g transform="translate(30, 90)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
              <circle r="40" fill="none" stroke="#37474F" stroke-width="5"/>
              <circle r="36" fill="none" stroke="#90A4AE" stroke-width="2"/>
              <circle r="8" fill="#546E7A"/>
              <g stroke="#607D8B" stroke-width="2">
                <line x1="0" y1="-34" x2="0" y2="34"/>
                <line x1="-34" y1="0" x2="34" y2="0"/>
                <line x1="-24" y1="-24" x2="24" y2="24"/>
                <line x1="24" y1="-24" x2="-24" y2="24"/>
              </g>
            </g>
            <circle r="40" fill="none" stroke="#263238" stroke-width="3" opacity="0.35"/>
          </g>

          <!-- Front wheel -->
          <g transform="translate(170, 90)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
              <circle r="40" fill="none" stroke="#37474F" stroke-width="5"/>
              <circle r="36" fill="none" stroke="#90A4AE" stroke-width="2"/>
              <circle r="8" fill="#546E7A"/>
              <g stroke="#607D8B" stroke-width="2">
                <line x1="0" y1="-34" x2="0" y2="34"/>
                <line x1="-34" y1="0" x2="34" y2="0"/>
                <line x1="-24" y1="-24" x2="24" y2="24"/>
                <line x1="24" y1="-24" x2="-24" y2="24"/>
              </g>
            </g>
            <circle r="40" fill="none" stroke="#263238" stroke-width="3" opacity="0.35"/>
          </g>

          <!-- Frame -->
          <g stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- Seat tube -->
            <line x1="55" y1="30" x2="70" y2="90"/>
            <!-- Top tube -->
            <line x1="55" y1="30" x2="130" y2="40"/>
            <!-- Down tube -->
            <line x1="70" y1="90" x2="130" y2="40"/>
            <!-- Chain stays -->
            <line x1="30" y1="90" x2="70" y2="90"/>
            <!-- Seat stays -->
            <line x1="30" y1="90" x2="55" y2="30"/>
            <!-- Fork -->
            <line x1="130" y1="40" x2="170" y2="90"/>
          </g>

          <!-- Seat -->
          <ellipse cx="52" cy="26" rx="18" ry="7" fill="#5D4037" transform="rotate(-12 52 26)"/>
          <rect x="48" y="28" width="8" height="10" rx="2" fill="#6D4C41"/>

          <!-- Handlebar -->
          <path d="M130 40 Q145 20 160 28" fill="none" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
          <path d="M160 28 Q168 22 172 30" fill="none" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>

          <!-- Crank + pedals -->
          <g transform="translate(70, 90)">
            <circle r="10" fill="#455A64"/>
            <!-- Pedal arm 1 -->
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
              <line x1="0" y1="0" x2="0" y2="28" stroke="#37474F" stroke-width="4" stroke-linecap="round"/>
              <rect x="-10" y="26" width="20" height="6" rx="2" fill="#795548"/>
            </g>
            <!-- Pedal arm 2 (opposite) -->
            <g>
              <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="0.7s" repeatCount="indefinite"/>
              <line x1="0" y1="0" x2="0" y2="28" stroke="#546E7A" stroke-width="4" stroke-linecap="round"/>
              <rect x="-10" y="26" width="20" height="6" rx="2" fill="#8D6E63"/>
            </g>
          </g>

          <!-- Chain hint -->
          <path d="M70 90 Q100 100 130 55" fill="none" stroke="#455A64" stroke-width="2" stroke-dasharray="3 3" opacity="0.5"/>
        </g>

        <!-- Pelican -->
        <g id="pelican" transform="translate(300, 210)">
          <!-- Legs pedaling -->
          <g id="legs">
            <!-- Near leg -->
            <g transform="translate(50, 100)">
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  values="25;-35;25" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="8" y2="42" stroke="#F9A825" stroke-width="7" stroke-linecap="round"/>
                <!-- Foot on pedal -->
                <ellipse cx="10" cy="46" rx="10" ry="5" fill="#F57F17" transform="rotate(15 10 46)"/>
              </g>
            </g>
            <!-- Far leg -->
            <g transform="translate(58, 100)">
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  values="-35;25;-35" keyTimes="0;0.5;1" dur="0.7s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="6" y2="40" stroke="#FBC02D" stroke-width="6" stroke-linecap="round"/>
                <ellipse cx="8" cy="44" rx="9" ry="4.5" fill="#F9A825" transform="rotate(-10 8 44)"/>
              </g>
            </g>
          </g>

          <!-- Body -->
          <ellipse cx="55" cy="70" rx="48" ry="38" fill="url(#bodyGrad)"/>
          <!-- Belly shade -->
          <ellipse cx="58" cy="82" rx="32" ry="22" fill="#FFFFFF" opacity="0.55"/>

          <!-- Wing (flaps gently) -->
          <g transform="translate(40, 55)">
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="8;-6;8" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
              <path d="M0 10 Q-35 -5 -55 25 Q-40 15 -20 22 Q-5 18 0 10 Z" fill="url(#wingGrad)" stroke="#9E9E96" stroke-width="1"/>
              <path d="M-10 12 Q-30 5 -45 22" fill="none" stroke="#BDBDB5" stroke-width="1.5"/>
            </g>
          </g>

          <!-- Tail -->
          <g transform="translate(10, 75)">
            <path d="M0 0 Q-25 -8 -35 10 Q-20 5 -5 12 Z" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1"/>
            <path d="M-5 5 Q-22 0 -30 12" fill="none" stroke="#B0BEC5" stroke-width="1.5"/>
          </g>

          <!-- Neck -->
          <path d="M85 55 Q115 30 125 55 Q120 70 95 68" fill="url(#bodyGrad)" stroke="#E0E0D8" stroke-width="1"/>

          <!-- Head -->
          <g transform="translate(125, 48)">
            <ellipse cx="8" cy="8" rx="22" ry="18" fill="#FAFAF8"/>
            <!-- Eye -->
            <circle cx="16" cy="4" r="5.5" fill="#212121"/>
            <circle cx="17.5" cy="2.5" r="2" fill="#FFFFFF"/>
            <!-- Small crest -->
            <path d="M-8 -8 Q0 -18 10 -10" fill="none" stroke="#ECECE6" stroke-width="4" stroke-linecap="round"/>

            <!-- Beak + pouch (signature pelican look) -->
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="0;3;0;-2;0" keyTimes="0;0.25;0.5;0.75;1" dur="2s" repeatCount="indefinite"/>
              <!-- Upper beak -->
              <path d="M22 6 Q55 0 72 12 Q50 14 24 12 Z" fill="url(#beakGrad)"/>
              <!-- Pouch -->
              <path d="M24 12 Q40 38 68 18 Q50 22 28 16 Z" fill="url(#pouchGrad)" stroke="#E65100" stroke-width="0.8"/>
              <!-- Beak tip line -->
              <path d="M24 10 Q48 8 70 13" fill="none" stroke="#EF6C00" stroke-width="1.2"/>
            </g>
          </g>

          <!-- Wing tip resting near handlebar (near wing) -->
          <g transform="translate(95, 48)">
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="-5;8;-5" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
              <path d="M0 5 Q25 -10 40 8 Q28 5 12 12 Z" fill="#D7D7CF" stroke="#9E9E96" stroke-width="1"/>
            </g>
          </g>
        </g>
      </g>

      <!-- Speed lines -->
      <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
        <line x1="40" y1="280" x2="90" y2="280">
          <animate attributeName="x1" values="40;20;40" dur="0.35s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="90;70;90" dur="0.35s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.2;0.6;0.2" dur="0.35s" repeatCount="indefinite"/>
        </line>
        <line x1="20" y1="310" x2="75" y2="310">
          <animate attributeName="x1" values="20;5;20" dur="0.4s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="75;55;75" dur="0.4s" repeatCount="indefinite"/>
        </line>
        <line x1="50" y1="340" x2="100" y2="340">
          <animate attributeName="x1" values="50;30;50" dur="0.3s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="100;80;100" dur="0.3s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Grass tufts in foreground -->
      <g fill="#689F38">
        <path d="M30 470 Q40 450 35 470 Q45 455 50 470 Z"/>
        <path d="M760 470 Q770 448 765 470 Q775 452 780 470 Z"/>
        <path d="M120 475 Q128 458 125 475 Q132 460 138 475 Z"/>
      </g>
    </svg>
  </div>
  <p class="hint">纯 SVG 动画 · 轮子转动 · 踩踏 · 翅膀轻扇 · 道路滚动</p>
</body>
</html>
