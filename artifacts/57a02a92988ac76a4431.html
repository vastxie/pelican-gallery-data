<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --ink: #243047;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 50% 0%, #d7f3ff 0%, #7ec8ef 42%, #3d8ec4 100%);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: white;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-shadow: 0 2px 0 rgba(36, 48, 71, 0.18);
    }

    .stage {
      width: min(1100px, 96vw);
      position: relative;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(18, 52, 84, 0.28);
      background: #8fd3f5;
    }

    button {
      position: absolute;
      right: 16px;
      bottom: 16px;
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(36, 48, 71, 0.18);
    }

    button:hover { background: white; }

    p {
      margin: 0;
      opacity: 0.92;
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .rays {
      transform-origin: 0 0;
      animation: spin 80s linear infinite;
    }

    .cloud {
      animation: drift linear infinite;
    }

    .cloud-a { animation-duration: 54s; animation-delay: -8s; }
    .cloud-b { animation-duration: 72s; animation-delay: -36s; }
    .cloud-c { animation-duration: 46s; animation-delay: -20s; }

    .gull-move {
      animation: gull-drift linear infinite;
    }

    .gull-a { animation-duration: 28s; animation-delay: -6s; }
    .gull-b { animation-duration: 36s; animation-delay: -18s; }

    .wing-l, .wing-r {
      transform-origin: 0 0;
      animation-duration: 0.55s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .wing-l { animation-name: flap-l; }
    .wing-r { animation-name: flap-r; }

    .boat-move {
      animation: boat 42s linear infinite;
    }

    .beam {
      transform-origin: 0 0;
      animation: sweep 5.5s ease-in-out infinite;
    }

    .eyelid {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.8s infinite;
    }

    svg.paused,
    svg.paused * {
      animation-play-state: paused !important;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes drift {
      from { transform: translateX(1150px); }
      to { transform: translateX(-420px); }
    }

    @keyframes gull-drift {
      from { transform: translateX(-80px); }
      to { transform: translateX(520px); }
    }

    @keyframes flap-l {
      0%, 100% { transform: rotate(-28deg); }
      50% { transform: rotate(18deg); }
    }

    @keyframes flap-r {
      0%, 100% { transform: rotate(28deg); }
      50% { transform: rotate(-18deg); }
    }

    @keyframes boat {
      from { transform: translateX(260px); }
      to { transform: translateX(-980px); }
    }

    @keyframes sweep {
      0%, 100% { transform: rotate(-18deg); opacity: 0.18; }
      50% { transform: rotate(22deg); opacity: 0.45; }
    }

    @keyframes blink {
      0%, 42%, 48%, 90%, 96%, 100% { transform: scaleY(0.06); }
      45%, 93% { transform: scaleY(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rays, .cloud, .gull-move, .wing-l, .wing-r, .boat-move, .beam, .eyelid {
        animation: none !important;
      }
    }
  </style>
</head>
<body>

        <path d="M348 346 C 378 328, 438 328, 458 346 C 430 358, 386 360, 348 346 Z" fill="#243047"/>

    <button id="toggle" type="button">暂停</button>
  </div>
  <p>海边公路 · 白鹈鹕骑行中</p>

  <script>
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const TIRE_R = 56;
    const WHEEL_RPS = 0.7;
    const CRANK_RPS = 0.48;
    const CRANK = { x: 450, y: 478 };
    const CRANK_R = 26;
    const hips = {
      far: { x: 392, y: 362 },
      near: { x: 418, y: 348 }
    };
    const THIGH = 90;
    const SHIN = 84;

    const bike = document.getElementById("bike");
    const spinRear = document.getElementById("spin-rear");
    const spinFront = document.getElementById("spin-front");
    const crankRotor = document.getElementById("crank-rotor");
    const legFar = document.getElementById("leg-far");
    const legFarOutline = document.getElementById("leg-far-outline");
    const legNear = document.getElementById("leg-near");
    const legNearOutline = document.getElementById("leg-near-outline");
    const footFar = document.getElementById("foot-far");
    const footNear = document.getElementById("foot-near");
    const head = document.getElementById("head-group");
    const fish = document.getElementById("fish");
    const kneeFar = document.getElementById("knee-far");
    const kneeNear = document.getElementById("knee-near");
    const farWing = document.getElementById("far-wing");
    const scarf = document.getElementById("scarf");
    const tail = document.getElementById("tail");
    const shadow = document.getElementById("shadow");
    const lane = document.getElementById("lane");
    const sand = document.getElementById("sand-decor");
    const wavesFar = document.getElementById("waves-far");
    const wavesNear = document.getElementById("waves-near");
    const scene = document.getElementById("scene");
    const toggle = document.getElementById("toggle");

    function kneeJoint(hip, foot) {
      const dx = foot.x - hip.x;
      const dy = foot.y - hip.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const base = Math.atan2(dy, dx);
      const cosA = (THIGH * THIGH + dist * dist - SHIN * SHIN) / (2 * THIGH * dist);
      const bend = Math.acos(Math.max(-1, Math.min(1, cosA)));
      const theta = base - bend;
      return {
        x: hip.x + Math.cos(theta) * THIGH,
        y: hip.y + Math.sin(theta) * THIGH
      };
    }

    function setLeg(outline, color, kneeEl, hip, foot) {
      const knee = kneeJoint(hip, foot);
      const d = `M ${hip.x.toFixed(1)} ${hip.y.toFixed(1)} L ${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L ${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`;
      outline.setAttribute("d", d);
      color.setAttribute("d", d);
      kneeEl.setAttribute("cx", knee.x.toFixed(1));
      kneeEl.setAttribute("cy", knee.y.toFixed(1));
    }

    let paused = reduceMotion;
    let raf = 0;
    let last = 0;
    let elapsed = 0.35;

    function frame(now) {
      if (!last) last = now;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (!paused) elapsed += dt;
      draw(elapsed);
      raf = requestAnimationFrame(frame);
    }

    function draw(seconds) {
      const dist = seconds * WHEEL_RPS * 2 * Math.PI * TIRE_R;
      const wheelDeg = seconds * WHEEL_RPS * 360;
      const pedal = seconds * CRANK_RPS * Math.PI * 2;

      spinRear.setAttribute("transform", `rotate(${wheelDeg})`);
      spinFront.setAttribute("transform", `rotate(${wheelDeg})`);
      crankRotor.setAttribute("transform", `translate(450 478) rotate(${pedal * 180 / Math.PI})`);

      const farFoot = {
        x: CRANK.x + Math.cos(pedal + Math.PI) * CRANK_R,
        y: CRANK.y + Math.sin(pedal + Math.PI) * CRANK_R
      };
      const nearFoot = {
        x: CRANK.x + Math.cos(pedal) * CRANK_R,
        y: CRANK.y + Math.sin(pedal) * CRANK_R
      };

      setLeg(legFarOutline, legFar, kneeFar, hips.far, farFoot);
      setLeg(legNearOutline, legNear, kneeNear, hips.near, nearFoot);

      const farTilt = Math.sin(pedal + Math.PI) * 10;
      const nearTilt = Math.sin(pedal) * 10;
      footFar.setAttribute("transform", `translate(${farFoot.x.toFixed(1)} ${farFoot.y.toFixed(1)}) rotate(${farTilt.toFixed(1)})`);
      footNear.setAttribute("transform", `translate(${nearFoot.x.toFixed(1)} ${nearFoot.y.toFixed(1)}) rotate(${nearTilt.toFixed(1)})`);

      const bob = Math.sin(pedal * 2) * 2.4;
      bike.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
      const squash = 1 + bob * 0.012;
      shadow.setAttribute("transform", `translate(470 536) scale(${squash.toFixed(3)} 1) translate(-470 -536)`);

      const nod = Math.sin(pedal) * 2.1;
      head.setAttribute("transform", `rotate(${nod.toFixed(2)} 470 214)`);
      fish.setAttribute("transform", `translate(688 186) rotate(${(Math.sin(seconds * 7) * 5).toFixed(1)})`);
      farWing.setAttribute("transform", `rotate(${(Math.sin(seconds * 2.2) * 3.5).toFixed(2)} 330 260)`);
      scarf.setAttribute("transform", `rotate(${(Math.sin(seconds * 3.4) * 5).toFixed(2)} 478 214)`);
      tail.setAttribute("transform", `rotate(${(Math.sin(seconds * 5) * 3).toFixed(2)} 310 310)`);

      lane.setAttribute("transform", `translate(${-(dist % 100)} 0)`);
      sand.setAttribute("transform", `translate(${-((dist * 0.35) % 160)} 0)`);
      wavesFar.setAttribute("transform", `translate(${-((dist * 0.08) % 200)} 0)`);
      wavesNear.setAttribute("transform", `translate(${-((dist * 0.14) % 200)} 0)`);
    }

    function syncButton() {
      toggle.textContent = paused ? "播放" : "暂停";
      scene.classList.toggle("paused", paused);
    }

    toggle.addEventListener("click", () => {
      paused = !paused;
      last = 0;
      syncButton();
    });

    if (reduceMotion) scene.classList.add("paused");
    syncButton();
    draw(elapsed);
    raf = requestAnimationFrame(frame);
  </script>
