<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #7ec8e3;
      --sky-bot: #d4f1f9;
      --ground: #7cb342;
      --path: #c4a574;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 62%, #b8e986 62%, var(--ground) 100%);
    }
    .scene {
      width: 100%;
      height: 100%;
      display: block;
    }
    .caption {
      position: absolute;
      left: 24px;
      bottom: 20px;
      color: #1a3a2a;
      font-size: 14px;
      letter-spacing: 0.08em;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <svg class="scene" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一只鹈鹕骑着自行车在路上前进">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5eb8d8" />
        <stop offset="70%" stop-color="#cdeef8" />
        <stop offset="100%" stop-color="#e8f7c8" />
      </linearGradient>
      <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#8bc34a" />
        <stop offset="100%" stop-color="#558b2f" />
      </linearGradient>
      <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d7b889" />
        <stop offset="100%" stop-color="#b0895a" />
      </linearGradient>
      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffe082" stop-opacity="1" />
        <stop offset="100%" stop-color="#ffe082" stop-opacity="0" />
      </radialGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2e4a1c" flood-opacity="0.25" />
      </filter>
    </defs>

    <rect width="1200" height="675" fill="url(#sky)" />

    <!-- sun -->
    <circle cx="980" cy="90" r="70" fill="url(#sunGlow)" />
    <circle cx="980" cy="90" r="38" fill="#ffd54f" />

    <!-- clouds -->
    <g fill="#fff" opacity="0.92">
      <g>
        <ellipse cx="160" cy="90" rx="48" ry="22" />
        <ellipse cx="200" cy="82" rx="38" ry="26" />
        <ellipse cx="230" cy="94" rx="32" ry="18" />
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 0; 0 0" dur="18s" repeatCount="indefinite" />
      </g>
      <g>
        <ellipse cx="520" cy="70" rx="56" ry="24" />
        <ellipse cx="570" cy="62" rx="42" ry="28" />
        <ellipse cx="610" cy="74" rx="36" ry="18" />
        <animateTransform attributeName="transform" type="translate" values="0 0; -50 0; 0 0" dur="22s" repeatCount="indefinite" />
      </g>
      <g opacity="0.85">
        <ellipse cx="820" cy="130" rx="40" ry="18" />
        <ellipse cx="850" cy="124" rx="28" ry="20" />
        <animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" dur="16s" repeatCount="indefinite" />
      </g>
    </g>

    <!-- distant hills -->
    <path d="M0 380 C120 300 220 340 340 300 C460 260 520 340 680 290 C820 250 900 330 1200 270 L1200 430 L0 430 Z" fill="#9ccc65" opacity="0.85" />
    <path d="M0 420 C180 350 280 400 420 360 C560 320 640 400 800 350 C940 310 1040 390 1200 340 L1200 470 L0 470 Z" fill="url(#hill)" />

    <!-- road -->
    <path d="M0 500 Q300 470 600 500 T1200 500 L1200 675 L0 675 Z" fill="url(#road)" />
    <path d="M0 518 Q300 488 600 518 T1200 518" fill="none" stroke="#fff8e1" stroke-width="6" stroke-dasharray="28 22" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="1.6s" repeatCount="indefinite" />
    </path>

    <!-- grass tufts -->
    <g fill="#689f38">
      <path d="M40 560 q8 -22 2 -2 q10 -18 4 0 q8 -14 0 2" />
      <path d="M180 610 q8 -22 2 -2 q10 -18 4 0 q8 -14 0 2" />
      <path d="M980 580 q8 -22 2 -2 q10 -18 4 0 q8 -14 0 2" />
      <path d="M1120 620 q8 -22 2 -2 q10 -18 4 0 q8 -14 0 2" />
    </g>

    <!-- rider group: bob + travel -->
    <g filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate"
        values="1180 0; -280 0" dur="8s" repeatCount="indefinite" />

      <g>
        <!-- slight bounce -->
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -6; 0 0; 0 -4; 0 0" dur="0.7s" repeatCount="indefinite" />

        <!-- bicycle + pelican, origin around crank -->
        <g transform="translate(200, 470)">

          <!-- rear wheel -->
          <g transform="translate(-78, 42)">
            <circle r="36" fill="none" stroke="#263238" stroke-width="5" />
            <circle r="6" fill="#455a64" />
            <g>
              <line x1="0" y1="-32" x2="0" y2="32" stroke="#546e7a" stroke-width="2" />
              <line x1="-32" y1="0" x2="32" y2="0" stroke="#546e7a" stroke-width="2" />
              <line x1="-22" y1="-22" x2="22" y2="22" stroke="#546e7a" stroke-width="2" />
              <line x1="22" y1="-22" x2="-22" y2="22" stroke="#546e7a" stroke-width="2" />
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite" />
            </g>
            <circle r="36" fill="none" stroke="#90a4ae" stroke-width="2" />
          </g>

          <!-- front wheel -->
          <g transform="translate(92, 42)">
            <circle r="36" fill="none" stroke="#263238" stroke-width="5" />
            <circle r="6" fill="#455a64" />
            <g>
              <line x1="0" y1="-32" x2="0" y2="32" stroke="#546e7a" stroke-width="2" />
              <line x1="-32" y1="0" x2="32" y2="0" stroke="#546e7a" stroke-width="2" />
              <line x1="-22" y1="-22" x2="22" y2="22" stroke="#546e7a" stroke-width="2" />
              <line x1="22" y1="-22" x2="-22" y2="22" stroke="#546e7a" stroke-width="2" />
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite" />
            </g>
            <circle r="36" fill="none" stroke="#90a4ae" stroke-width="2" />
          </g>

          <!-- frame -->
          <g fill="none" stroke="#e53935" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-78 42 L0 0 L92 42" />
            <path d="M0 0 L-18 -38 L-78 42" />
            <path d="M-18 -38 L52 -38 L92 42" />
            <path d="M52 -38 L62 -58" />
          </g>
          <!-- seat -->
          <ellipse cx="-22" cy="-44" rx="18" ry="7" fill="#5d4037" />
          <!-- handlebar -->
          <path d="M62 -58 Q72 -70 86 -62" fill="none" stroke="#37474f" stroke-width="6" stroke-linecap="round" />
          <circle cx="86" cy="-62" r="5" fill="#212121" />

          <!-- crank + pedals -->
          <g>
            <g>
              <line x1="0" y1="0" x2="0" y2="22" stroke="#37474f" stroke-width="5" stroke-linecap="round" />
              <rect x="-10" y="20" width="20" height="6" rx="2" fill="#212121" />
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite" />
            </g>
            <g>
              <line x1="0" y1="0" x2="0" y2="22" stroke="#37474f" stroke-width="5" stroke-linecap="round" />
              <rect x="-10" y="20" width="20" height="6" rx="2" fill="#212121" />
              <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="0.7s" repeatCount="indefinite" />
            </g>
            <circle r="8" fill="#c62828" stroke="#b71c1c" stroke-width="2" />
          </g>

          <!-- pelican -->
          <g transform="translate(-8, -78)">
            <!-- far wing (behind) -->
            <g transform="translate(8, -8)">
              <ellipse cx="0" cy="0" rx="38" ry="12" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5" />
              <animateTransform attributeName="transform" type="rotate"
                values="-18; 22; -18" dur="0.55s" repeatCount="indefinite"
                additive="sum" />
            </g>

            <!-- body -->
            <ellipse cx="6" cy="10" rx="42" ry="26" fill="#f5f5f5" stroke="#b0bec5" stroke-width="1.5" />
            <!-- belly -->
            <ellipse cx="10" cy="20" rx="28" ry="12" fill="#fffde7" />
            <!-- tail -->
            <path d="M-34 8 Q-58 0 -62 18 Q-48 12 -30 20 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1" />

            <!-- neck -->
            <path d="M36 -4 Q58 -28 72 -8 Q60 8 38 10" fill="#eeeeee" stroke="#b0bec5" stroke-width="1.5" />

            <!-- head -->
            <g transform="translate(78, -10)">
              <animateTransform attributeName="transform" type="rotate"
                values="-6; 8; -6" dur="0.9s" repeatCount="indefinite"
                additive="sum" />
              <ellipse cx="0" cy="0" rx="18" ry="16" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5" />
              <!-- eye -->
              <circle cx="6" cy="-4" r="5" fill="#fff" />
              <circle cx="7" cy="-4" r="2.6" fill="#212121" />
              <circle cx="8" cy="-5" r="1" fill="#fff" />
              <!-- pouch + beak -->
              <path d="M14 2 Q32 18 48 8 Q36 -2 18 -2 Z" fill="#ffb74d" stroke="#f57c00" stroke-width="1.2" />
              <path d="M14 -1 L52 -6 Q40 -14 16 -8 Z" fill="#ff9800" stroke="#ef6c00" stroke-width="1.2" />
            </g>

            <!-- near wing -->
            <g transform="translate(4, 0)">
              <path d="M0 0 Q-10 -36 28 -18 Q18 4 0 8 Z" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5" />
              <animateTransform attributeName="transform" type="rotate"
                values="12; -28; 12" dur="0.55s" repeatCount="indefinite"
                additive="sum" />
            </g>

            <!-- far leg (to rear pedal-ish) -->
            <g stroke="#ff9800" stroke-width="5" stroke-linecap="round" fill="none">
              <path d="M0 28 L-8 52 L-18 70">
                <animate attributeName="d"
                  values="M0 28 L-8 52 L-18 70; M0 28 L10 48 L4 68; M0 28 L-8 52 L-18 70"
                  dur="0.7s" repeatCount="indefinite" />
              </path>
            </g>
            <!-- near leg -->
            <g stroke="#fb8c00" stroke-width="5" stroke-linecap="round" fill="none">
              <path d="M12 30 L22 50 L18 70">
                <animate attributeName="d"
                  values="M12 30 L22 50 L18 70; M12 30 L2 52 L-6 70; M12 30 L22 50 L18 70"
                  dur="0.7s" repeatCount="indefinite" />
              </path>
            </g>

            <!-- feet as webbed blobs -->
            <g fill="#ef6c00">
              <ellipse cx="-18" cy="74" rx="10" ry="4">
                <animate attributeName="cx" values="-18; 6; -18" dur="0.7s" repeatCount="indefinite" />
                <animate attributeName="cy" values="74; 68; 74" dur="0.7s" repeatCount="indefinite" />
              </ellipse>
              <ellipse cx="18" cy="72" rx="10" ry="4">
                <animate attributeName="cx" values="18; -4; 18" dur="0.7s" repeatCount="indefinite" />
                <animate attributeName="cy" values="72; 74; 72" dur="0.7s" repeatCount="indefinite" />
              </ellipse>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- foreground grass -->
    <g fill="#33691e" opacity="0.9">
      <path d="M0 640 Q80 600 40 675 L0 675 Z" />
      <path d="M80 675 Q140 590 160 675 Z" />
      <path d="M200 675 Q250 610 280 675 Z" />
      <path d="M1040 675 Q1100 600 1140 675 Z" />
      <path d="M1140 640 Q1180 600 1200 675 L1140 675 Z" />
    </g>
  </svg>
  <p class="caption">PELICAN ON A BICYCLE · SVG 2D</p>
</body>
</html>
