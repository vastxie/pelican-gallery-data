<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车</title>
<style>
  :root {
    --sky-top: #7ec8f0;
    --sky-bot: #e8f6ff;
    --grass: #5cb85c;
    --road: #c9b48a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #16324a;
    font-family: "Iowan Old Style", Palatino, "Songti SC", serif;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100%;
  }
  .stage {
    width: min(960px, 96vw);
  }
  h1 {
    margin: 0 0 10px;
    color: #f4efe4;
    font-weight: 500;
    letter-spacing: 0.08em;
    font-size: clamp(1.2rem, 2.4vw, 1.7rem);
    text-align: center;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    background: linear-gradient(var(--sky-top), var(--sky-bot));
  }
  .scroll {
    animation: drift 6s linear infinite;
  }
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.7s linear infinite;
  }
  .crank {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.7s linear infinite;
  }
  .bob {
    animation: bob 0.7s ease-in-out infinite;
  }
  .wing {
    transform-box: fill-box;
    transform-origin: 20% 80%;
    animation: flap 0.7s ease-in-out infinite;
  }
  .pouch {
    transform-box: fill-box;
    transform-origin: 10% 40%;
    animation: gulp 1.4s ease-in-out infinite;
  }
  .cloud {
    animation: cloud 18s linear infinite;
  }
  .cloud.b { animation-duration: 26s; animation-delay: -8s; }
  .cloud.c { animation-duration: 22s; animation-delay: -14s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes flap {
    0%, 100% { transform: rotate(8deg); }
    50% { transform: rotate(-18deg); }
  }
  @keyframes gulp {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.08); }
  }
  @keyframes cloud {
    from { transform: translateX(0); }
    to { transform: translateX(-1100px); }
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-240px); }
  }
</style>
</head>
<body>
  <main class="stage">
    <h1>鹈鹕骑自行车</h1>
    <svg viewBox="0 0 960 540" role="img" aria-label="一只白色鹈鹕踩着自行车沿小路骑行">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6ebef0"/>
          <stop offset="1" stop-color="#dff3ff"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6c445"/>
          <stop offset="1" stop-color="#e08a1e"/>
        </linearGradient>
        <linearGradient id="pouchFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4d27a"/>
          <stop offset="1" stop-color="#e7a23a"/>
        </linearGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fff6c2"/>
          <stop offset="1" stop-color="#ffd15a"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b3a52" flood-opacity="0.18"/>
        </filter>
      </defs>

      <rect width="960" height="540" fill="url(#sky)"/>
      <circle cx="820" cy="92" r="46" fill="url(#sun)"/>

      <g class="cloud" fill="#fff" opacity="0.92">
        <ellipse cx="180" cy="90" rx="46" ry="22"/>
        <ellipse cx="214" cy="82" rx="32" ry="20"/>
        <ellipse cx="150" cy="86" rx="28" ry="16"/>
      </g>
      <g class="cloud b" fill="#fff" opacity="0.85">
        <ellipse cx="980" cy="140" rx="54" ry="22"/>
        <ellipse cx="1024" cy="130" rx="30" ry="18"/>
        <ellipse cx="948" cy="132" rx="28" ry="16"/>
      </g>
      <g class="cloud c" fill="#fff" opacity="0.8">
        <ellipse cx="620" cy="70" rx="40" ry="16"/>
        <ellipse cx="650" cy="62" rx="24" ry="14"/>
      </g>

      <!-- distant hills -->
      <path d="M0 360 C120 300 200 330 320 300 C460 264 520 340 680 310 C800 286 880 330 960 300 L960 430 L0 430 Z" fill="#8fd18a"/>
      <path d="M0 390 C140 350 240 380 380 350 C520 320 600 390 760 356 C860 334 920 370 960 350 L960 430 L0 430 Z" fill="#6fbe6c"/>

      <!-- scrolling road marks -->
      <g>
        <rect x="0" y="430" width="960" height="110" fill="#d8c39a"/>
        <rect x="0" y="430" width="960" height="14" fill="#b7a078"/>
        <g class="scroll">
          <g fill="#f4efe2">
            <rect x="40" y="478" width="70" height="8" rx="4"/>
            <rect x="180" y="478" width="70" height="8" rx="4"/>
            <rect x="320" y="478" width="70" height="8" rx="4"/>
            <rect x="460" y="478" width="70" height="8" rx="4"/>
            <rect x="600" y="478" width="70" height="8" rx="4"/>
            <rect x="740" y="478" width="70" height="8" rx="4"/>
            <rect x="880" y="478" width="70" height="8" rx="4"/>
            <rect x="1020" y="478" width="70" height="8" rx="4"/>
            <rect x="1160" y="478" width="70" height="8" rx="4"/>
          </g>
          <g fill="#7d9a55">
            <ellipse cx="90" cy="528" rx="26" ry="8"/>
            <ellipse cx="330" cy="524" rx="18" ry="6"/>
            <ellipse cx="570" cy="530" rx="22" ry="7"/>
            <ellipse cx="810" cy="526" rx="16" ry="5"/>
            <ellipse cx="1050" cy="528" rx="24" ry="7"/>
          </g>
        </g>
      </g>

      <!-- rider + bike, slight bounce -->
      <g class="bob" filter="url(#soft)">
        <!-- shadow -->
        <ellipse cx="470" cy="456" rx="150" ry="14" fill="#8a7348" opacity="0.35"/>

        <!-- rear wheel -->
        <g transform="translate(330 400)">
          <circle r="62" fill="none" stroke="#2b2b2b" stroke-width="8"/>
          <circle r="50" fill="none" stroke="#3d3d3d" stroke-width="2"/>
          <g class="wheel-spin">
            <g stroke="#4a4a4a" stroke-width="2">
              <line x1="0" y1="-48" x2="0" y2="48"/>
              <line x1="-48" y1="0" x2="48" y2="0"/>
              <line x1="-34" y1="-34" x2="34" y2="34"/>
              <line x1="-34" y1="34" x2="34" y2="-34"/>
            </g>
            <circle r="8" fill="#2b2b2b"/>
          </g>
        </g>

        <!-- front wheel -->
        <g transform="translate(610 400)">
          <circle r="62" fill="none" stroke="#2b2b2b" stroke-width="8"/>
          <circle r="50" fill="none" stroke="#3d3d3d" stroke-width="2"/>
          <g class="wheel-spin">
            <g stroke="#4a4a4a" stroke-width="2">
              <line x1="0" y1="-48" x2="0" y2="48"/>
              <line x1="-48" y1="0" x2="48" y2="0"/>
              <line x1="-34" y1="-34" x2="34" y2="34"/>
              <line x1="-34" y1="34" x2="34" y2="-34"/>
            </g>
            <circle r="8" fill="#2b2b2b"/>
          </g>
        </g>

        <!-- frame -->
        <g fill="none" stroke="#2f6f8f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M330 400 L430 320 L540 320 L610 400"/>
          <path d="M430 320 L470 400 L540 320"/>
          <path d="M470 400 L330 400"/>
          <path d="M540 320 L560 286"/>
          <path d="M610 400 L590 286 L545 286"/>
        </g>
        <!-- seat -->
        <path d="M538 278 Q560 268 584 278 Q560 288 538 278" fill="#243038"/>
        <!-- handlebar -->
        <path d="M530 278 Q545 262 568 270" fill="none" stroke="#243038" stroke-width="6" stroke-linecap="round"/>
        <circle cx="528" cy="278" r="5" fill="#f2c14e"/>

        <!-- crank + pedals -->
        <g transform="translate(470 400)">
          <circle r="7" fill="#243038"/>
          <g class="crank">
            <line x1="0" y1="0" x2="0" y2="-28" stroke="#243038" stroke-width="5" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="0" y2="28" stroke="#243038" stroke-width="5" stroke-linecap="round"/>
            <rect x="-14" y="-34" width="22" height="8" rx="3" fill="#e07a2f"/>
            <rect x="-8" y="26" width="22" height="8" rx="3" fill="#e07a2f"/>
          </g>
        </g>

        <!-- pelican body group, seated over the saddle -->
        <g transform="translate(500 250)">
          <!-- tail -->
          <path d="M70 40 Q110 20 108 52 Q78 58 62 48" fill="#f7f7f4" stroke="#d9d4c8" stroke-width="1"/>
          <!-- far wing -->
          <g class="wing">
            <path d="M18 28 Q-10 -20 -46 -8 Q-20 18 10 36 Z" fill="#f4f1ea" stroke="#cfc8ba"/>
            <path d="M-8 -2 Q-40 -18 -52 2" fill="none" stroke="#3d4650" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- body -->
          <ellipse cx="28" cy="42" rx="46" ry="32" fill="#fbfbf8" stroke="#e4dfd4"/>
          <!-- neck -->
          <path d="M-6 28 C-18 8 -8 -28 18 -48" fill="none" stroke="#fbfbf8" stroke-width="16" stroke-linecap="round"/>
          <path d="M-6 28 C-18 8 -8 -28 18 -48" fill="none" stroke="#e6e1d6" stroke-width="1"/>
          <!-- head -->
          <ellipse cx="24" cy="-54" rx="20" ry="16" fill="#fbfbf8" stroke="#e4dfd4"/>
          <!-- eye -->
          <circle cx="16" cy="-58" r="4.2" fill="#1d2430"/>
          <circle cx="14.6" cy="-59.4" r="1.3" fill="#fff"/>
          <!-- beak -->
          <g class="pouch">
            <path d="M8 -52 L-78 -40 Q-86 -28 -62 -24 L6 -40 Z" fill="url(#beak)" stroke="#c98416" stroke-width="1.2"/>
            <path d="M6 -46 Q-40 -30 -70 -34" fill="none" stroke="#f6de8a" stroke-width="2"/>
            <path d="M4 -42 Q-36 -22 -58 -26 Q-30 -18 2 -36 Z" fill="url(#pouchFill)" opacity="0.95"/>
          </g>
          <!-- near wing -->
          <path d="M20 24 Q48 8 62 30 Q40 48 16 46 Z" fill="#f7f4ee" stroke="#d5cfc2"/>
          <path d="M36 22 Q54 18 66 34" fill="none" stroke="#3a4450" stroke-width="3" stroke-linecap="round"/>
          <!-- legs to pedals (stylized, anchored near crank) -->
          <path d="M8 68 C0 92 -18 118 -28 132" fill="none" stroke="#f0b04a" stroke-width="5" stroke-linecap="round"/>
          <path d="M24 70 C36 96 18 120 6 140" fill="none" stroke="#e39a32" stroke-width="5" stroke-linecap="round"/>
          <!-- feet -->
          <path d="M-36 130 L-18 136 L-34 140 Z" fill="#e07a2f"/>
          <path d="M-2 138 L16 132 L14 146 Z" fill="#d86e22"/>
        </g>
      </g>
    </svg>
  </main>
</body>
</html>
