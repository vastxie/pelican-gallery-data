<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕巡航号 · SVG 动画</title>
<style>
  html,body{margin:0;height:100%;background:#1c2030;display:flex;align-items:center;justify-content:center;overflow:hidden}
  svg{width:min(96vw,960px);height:auto;display:block;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.45)}

  /* --- 滚动图层(与车轮线速度 288px/s 匹配) --- */
  .scroller{animation:scrollX linear infinite}
  .hillsF{animation-duration:13s}
  .hillsN{animation-duration:9s}
  .bushL{animation-duration:3.125s}
  @keyframes scrollX{from{transform:translateX(0)}to{transform:translateX(-900px)}}

  /* --- 云朵 --- */
  .cloud{animation:drift linear infinite}
  .c1{animation-duration:28s;animation-delay:-6s}
  .c2{animation-duration:40s;animation-delay:-22s}
  .c3{animation-duration:34s;animation-delay:-14s}
  @keyframes drift{from{transform:translateX(960px)}to{transform:translateX(-280px)}}

  /* --- 路面虚线(一个周期 77px / 288px/s ≈ 0.267s) --- */
  .dashline{stroke-dasharray:45 32;animation:dashmove .267s linear infinite}
  @keyframes dashmove{to{stroke-dashoffset:77}}

  /* --- 链条 --- */
  .chainT{stroke-dasharray:7 5;animation:chT .3s linear infinite}
  @keyframes chT{from{stroke-dashoffset:12}to{stroke-dashoffset:0}}
  .chainB{stroke-dasharray:7 5;animation:chB .3s linear infinite}
  @keyframes chB{from{stroke-dashoffset:0}to{stroke-dashoffset:12}}

  /* --- 风的速度线 --- */
  .streaks{animation:windMove 1.1s linear infinite,windFade 1.1s ease-in-out infinite}
  @keyframes windMove{from{transform:translateX(22px)}to{transform:translateX(-22px)}}
  @keyframes windFade{0%,100%{opacity:0}45%,60%{opacity:.75}}
</style>
</head>
<body>

<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd9ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <g id="cloud" fill="#ffffff" opacity="0.92">
      <ellipse cx="0" cy="0" rx="46" ry="17"/>
      <ellipse cx="-32" cy="7" rx="26" ry="12"/>
      <ellipse cx="30" cy="6" rx="30" ry="13"/>
    </g>
    <g id="cloudS" fill="#ffffff" opacity="0.8">
      <ellipse cx="0" cy="0" rx="30" ry="12"/>
      <ellipse cx="-22" cy="5" rx="18" ry="9"/>
      <ellipse cx="20" cy="4" rx="20" ry="10"/>
    </g>
    <path id="hillF" fill="#c4e6c8" d="M0 430 Q150 335 280 415 Q380 460 500 392 Q620 330 740 418 Q830 470 900 400 L900 430 Z"/>
    <path id="hillN" fill="#9fd6a0" d="M0 430 Q75 350 150 392 Q225 430 300 386 Q375 342 450 396 Q525 430 600 390 Q675 350 750 394 Q825 430 900 380 L900 430 Z"/>
    <g id="bushTile">
      <ellipse cx="90"  cy="424" rx="26" ry="14" fill="#5fae63"/>
      <ellipse cx="108" cy="420" rx="16" ry="10" fill="#6fbd72"/>
      <circle cx="86"  cy="414" r="4"   fill="#ff8fa3"/><circle cx="86" cy="414" r="1.5" fill="#ffd166"/>
      <ellipse cx="310" cy="420" rx="32" ry="16" fill="#4f9d55"/>
      <ellipse cx="288" cy="416" rx="18" ry="11" fill="#6fbd72"/>
      <circle cx="316" cy="408" r="4" fill="#ff8fa3"/><circle cx="316" cy="408" r="1.5" fill="#ffd166"/>
      <ellipse cx="540" cy="424" rx="24" ry="13" fill="#5fae63"/>
      <circle cx="536" cy="414" r="4" fill="#f4978e"/><circle cx="536" cy="414" r="1.5" fill="#ffd166"/>
      <ellipse cx="760" cy="421" rx="30" ry="15" fill="#4f9d55"/>
      <ellipse cx="782" cy="417" rx="17" ry="10" fill="#6fbd72"/>
      <circle cx="764" cy="409" r="4" fill="#ff8fa3"/><circle cx="764" cy="409" r="1.5" fill="#ffd166"/>
    </g>
  </defs>

  <!-- ======== 背景 ======== -->
  <rect x="0" y="0" width="900" height="500" fill="url(#skyG)"/>

  <!-- 太阳 -->
  <g stroke="#f9c74f" stroke-width="4" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 795 84" to="360 795 84" dur="22s" repeatCount="indefinite"/>
      <line x1="833" y1="84" x2="845" y2="84"/>
      <line x1="821.9" y1="110.9" x2="830.4" y2="119.4"/>
      <line x1="795" y1="122" x2="795" y2="134"/>
      <line x1="768.1" y1="110.9" x2="759.6" y2="119.4"/>
      <line x1="757" y1="84" x2="745" y2="84"/>
      <line x1="768.1" y1="57.1" x2="759.6" y2="48.6"/>
      <line x1="795" y1="46" x2="795" y2="34"/>
      <line x1="821.9" y1="57.1" x2="830.4" y2="48.6"/>
    </g>
  </g>
  <circle cx="795" cy="84" r="30" fill="#ffd166" stroke="#f4a259" stroke-width="3"/>

  <!-- 云 -->
  <use href="#cloud"  y="70"  class="cloud c1"/>
  <use href="#cloudS" y="130" class="cloud c2"/>
  <use href="#cloudS" y="45"  class="cloud c3"/>

  <!-- 远山 / 近山(视差滚动) -->
  <g class="scroller hillsF"><use href="#hillF"/><use href="#hillF" x="900"/></g>
  <g class="scroller hillsN"><use href="#hillN"/><use href="#hillN" x="900"/></g>

  <!-- 道路 -->
  <rect x="0" y="430" width="900" height="70" fill="#4b4e57"/>
  <path d="M0 432 H900" stroke="#6a6e78" stroke-width="3"/>
  <path class="dashline" d="M0 466 H900" stroke="#f2f2f2" stroke-width="6"/>

  <!-- 路边灌木(与地面同速) -->
  <g class="scroller bushL"><use href="#bushTile"/><use href="#bushTile" x="900"/></g>

  <!-- 车影 -->
  <ellipse cx="420" cy="433" rx="195" ry="8" fill="rgba(0,0,0,0.18)"/>

  <!-- ======== 远侧腿(在车身后面) ======== -->
  <path id="legFar" d="" fill="none" stroke="#b96f1c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ======== 自行车 ======== -->
  <!-- 后轮 / 前轮 -->
  <circle cx="295" cy="375" r="55" fill="none" stroke="#2b2b31" stroke-width="9"/>
  <circle cx="295" cy="375" r="55" fill="none" stroke="#57575f" stroke-width="2"/>
  <g id="spokesR"></g>
  <circle cx="545" cy="375" r="55" fill="none" stroke="#2b2b31" stroke-width="9"/>
  <circle cx="545" cy="375" r="55" fill="none" stroke="#57575f" stroke-width="2"/>
  <g id="spokesF"></g>

  <!-- 远侧曲柄 + 踏板 -->
  <line id="crankArmFar" x1="415" y1="375" x2="415" y2="375" stroke="#3c3c44" stroke-width="6" stroke-linecap="round"/>
  <g id="pedalFar">
    <rect x="-13" y="6" width="26" height="6" rx="2" fill="#23232f"/>
    <path d="M -12 4 L 16 -1 L 11 5 L -12 7 Z" fill="#c98226" stroke="#9a6112" stroke-width="1.5"/>
  </g>

  <!-- 车架 -->
  <g stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M350 290 L415 375"/>                <!-- 座管 -->
    <path d="M415 375 L518 335"/>                <!-- 下管 -->
    <path d="M350 290 L505 288"/>                <!-- 上管 -->
    <path d="M295 375 L415 375"/>                <!-- 后下叉 -->
    <path d="M295 375 L350 290"/>                <!-- 后上叉 -->
    <path d="M505 288 L518 335 L545 375"/>       <!-- 头管 + 前叉 -->
  </g>
  <!-- 车把 -->
  <path d="M505 288 L497 266" stroke="#2b2b31" stroke-width="6" stroke-linecap="round"/>
  <path d="M497 268 Q490 250 468 254" stroke="#2b2b31" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="467" cy="254" r="4.5" fill="#2b2b31"/>
  <!-- 座杆 + 车座 -->
  <path d="M350 290 L346 266" stroke="#44444e" stroke-width="5" stroke-linecap="round"/>
  <path d="M318 266 Q344 250 374 262 Q352 272 318 266 Z" fill="#6d4c41" stroke="#4e342e" stroke-width="2"/>

  <!-- 链条 + 牙盘 + 飞轮 -->
  <path class="chainT" d="M295 368 L415 358" stroke="#606060" stroke-width="3.5"/>
  <path class="chainB" d="M415 392 L295 382" stroke="#606060" stroke-width="3.5"/>
  <circle cx="295" cy="375" r="7" fill="none" stroke="#606060" stroke-width="3"/>
  <circle cx="415" cy="375" r="17" fill="none" stroke="#606060" stroke-width="4.5"/>

  <!-- 近侧曲柄 + 踏板 -->
  <line id="crankArmNear" x1="415" y1="375" x2="415" y2="375" stroke="#3c3c44" stroke-width="6" stroke-linecap="round"/>

  <!-- ======== 鹈鹕 ======== -->
  <g transform="rotate(-3 358 230)">
    <g id="bob">
      <!-- 尾羽 -->
      <path d="M310 216 L272 198 L280 228 L312 234 Z" fill="#e8e1d2" stroke="#4a4a53" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 身体 -->
      <ellipse cx="358" cy="224" rx="60" ry="46" fill="#faf6ee" stroke="#4a4a53" stroke-width="3"/>
      <!-- 翅膀(扇动) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 372 212;7 372 212;0 372 212;-4 372 212;0 372 212" dur="1.15s" repeatCount="indefinite"/>
        <path d="M372 210 Q330 214 312 246 Q340 262 372 244 Q386 224 372 210 Z"
              fill="#e8e1d2" stroke="#4a4a53" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <!-- 脖子(描边 + 填充两层) -->
      <path d="M396 202 C404 176 410 162 422 150" stroke="#4a4a53" stroke-width="25" stroke-linecap="round" fill="none"/>
      <path d="M396 202 C404 176 410 162 422 150" stroke="#faf6ee" stroke-width="19" stroke-linecap="round" fill="none"/>
      <!-- 头部(带轻微摆动) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 410 165;3 410 165;0 410 165;-3 410 165;0 410 165" dur="1.7s" repeatCount="indefinite"/>
        <!-- 头冠小羽毛 -->
        <path d="M410 130 Q398 118 390 124" stroke="#4a4a53" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M414 126 Q406 112 396 114" stroke="#4a4a53" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="426" cy="146" r="23" fill="#faf6ee" stroke="#4a4a53" stroke-width="3"/>
        <circle cx="434" cy="139" r="4.5" fill="#23232f"/>
        <circle cx="435.5" cy="137.5" r="1.5" fill="#ffffff"/>
        <!-- 上喙 -->
        <path d="M444 133 Q512 120 588 151 L588 163 Q506 137 444 147 Z"
              fill="#f2a33c" stroke="#b06f1e" stroke-width="2.5" stroke-linejoin="round"/>
        <line x1="452" y1="131" x2="466" y2="128" stroke="#b06f1e" stroke-width="2" stroke-linecap="round"/>
        <!-- 下喙 + 喉囊(偶尔张开 + 轻微抖动) -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0 444 146;0 444 146;9 444 146;9 444 146;0 444 146"
            keyTimes="0;0.8;0.85;0.9;1" dur="6s" repeatCount="indefinite"/>
          <path d="M444 148 Q466 196 520 190 Q560 181 588 163 Q506 140 444 148 Z"
                fill="#f6b93b" stroke="#b06f1e" stroke-width="2.5" stroke-linejoin="round">
            <animateTransform attributeName="transform" type="rotate"
              values="0 470 165;1.5 470 165;0 470 165;-1.5 470 165;0 470 165" dur="0.8s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>
    </g>
  </g>

  <!-- ======== 近侧腿(在身体前面) ======== -->
  <path id="legNear" d="" fill="none" stroke="#ef9427" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 近侧踏板(脚踩在上面) -->
  <g id="pedalNear">
    <rect x="-13" y="6" width="26" height="6" rx="2" fill="#23232f"/>
    <path d="M -12 4 L 16 -1 L 11 5 L -12 7 Z" fill="#f6a53a" stroke="#c77f16" stroke-width="1.5"/>
  </g>
  <circle cx="415" cy="375" r="4" fill="#23232f"/>

  <!-- 风的速度线 -->
  <g class="streaks" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="215" x2="215" y2="215"/>
    <line x1="175" y1="242" x2="255" y2="242"/>
    <line x1="150" y1="268" x2="220" y2="268"/>
  </g>

  <!-- 标题 -->
  <text x="32" y="54" font-size="26" font-weight="700" fill="#31456b"
        font-family="'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">鹈鹕巡航号</text>
  <text x="32" y="80" font-size="14" fill="#4d648c"
        font-family="'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">Pelican Riding a Bicycle · 纯 SVG 动画</text>
</svg>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const WHEEL_SPEED = 300;    // 车轮角速度(度/秒) → 线速度 ≈ 288px/s,与路面滚动匹配
  const CRANK_RATIO = 0.5;    // 曲柄转速 = 车轮的一半(传动比)
  const HUB = { x: 295, y: 375 }, HUB2 = { x: 545, y: 375 };
  const C = { x: 415, y: 375 };      // 五通(曲柄中心)
  const CRANK_R = 30;                // 曲柄长度
  const HIP = { x: 350, y: 258 };    // 近侧髋关节(藏在身体下)
  const HIP_FAR = { x: 344, y: 262 };// 远侧髋关节
  const L1 = 76, L2 = 88;            // 大腿 / 小腿长度

  const el = id => document.getElementById(id);

  /* 生成辐条 */
  function buildSpokes(id, cx, cy) {
    const g = el(id);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', cx); l.setAttribute('y1', cy);
      l.setAttribute('x2', (cx + 47 * Math.cos(a)).toFixed(1));
      l.setAttribute('y2', (cy + 47 * Math.sin(a)).toFixed(1));
      l.setAttribute('stroke', '#7c7c88');
      l.setAttribute('stroke-width', '3');
      g.appendChild(l);
    }
    const hub = document.createElementNS(NS, 'circle');
    hub.setAttribute('cx', cx); hub.setAttribute('cy', cy); hub.setAttribute('r', 6);
    hub.setAttribute('fill', '#3c3c44');
    g.appendChild(hub);
  }
  buildSpokes('spokesR', HUB.x, HUB.y);
  buildSpokes('spokesF', HUB2.x, HUB2.y);

  /* 双骨骼反向运动学:已知髋和脚,求膝盖(膝盖朝前) */
  function ik(hx, hy, fx, fy, l1, l2) {
    let dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.5);
    const a = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d));
    const ang = Math.atan2(dy, dx) - a;      // 减去夹角 → 膝盖偏向前方
    return [hx + l1 * Math.cos(ang), hy + l1 * Math.sin(ang)];
  }

  const spokesR = el('spokesR'), spokesF = el('spokesF');
  const armN = el('crankArmNear'), armF = el('crankArmFar');
  const pedN = el('pedalNear'), pedF = el('pedalFar');
  const legN = el('legNear'), legF = el('legFar');
  const bob = el('bob');

  function setLeg(path, hip, foot) {
    const k = ik(hip.x, hip.y, foot.x, foot.y, L1, L2);
    path.setAttribute('d',
      `M ${hip.x} ${hip.y} L ${k[0].toFixed(1)} ${k[1].toFixed(1)} L ${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`);
  }
  function setArm(line, p) {
    line.setAttribute('x2', p.x.toFixed(1));
    line.setAttribute('y2', p.y.toFixed(1));
  }

  function frame(now) {
    const t = now / 1000;
    const wDeg = (t * WHEEL_SPEED) % 360;              // 车轮角度
    const cDeg = (t * WHEEL_SPEED * CRANK_RATIO) % 360;// 曲柄角度
    spokesR.setAttribute('transform', `rotate(${wDeg.toFixed(1)} ${HUB.x} ${HUB.y})`);
    spokesF.setAttribute('transform', `rotate(${wDeg.toFixed(1)} ${HUB2.x} ${HUB2.y})`);

    const a = cDeg * Math.PI / 180;
    const pN = { x: C.x + CRANK_R * Math.cos(a), y: C.y + CRANK_R * Math.sin(a) }; // 近侧踏板
    const pF = { x: C.x - CRANK_R * Math.cos(a), y: C.y - CRANK_R * Math.sin(a) }; // 远侧踏板

    setArm(armN, pN); setArm(armF, pF);
    pedN.setAttribute('transform', `translate(${pN.x.toFixed(1)} ${pN.y.toFixed(1)})`);
    pedF.setAttribute('transform', `translate(${pF.x.toFixed(1)} ${pF.y.toFixed(1)})`);

    setLeg(legN, HIP,     { x: pN.x, y: pN.y - 5 });   // 脚踝踩在踏板上方
    setLeg(legF, HIP_FAR, { x: pF.x, y: pF.y - 5 });

    // 蹬车节奏的身体起伏(每圈曲柄起伏两次)
    bob.setAttribute('transform', `translate(0 ${(2.6 * Math.sin(2 * a)).toFixed(2)})`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
