<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px;
    background: radial-gradient(ellipse at 50% 20%, #2f3d5c 0%, #161c2b 70%);
    color: #e8edf6;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  h1 { margin: 0; font-size: clamp(18px, 2.6vw, 26px); font-weight: 600; letter-spacing: .12em; }
  h1 span { opacity: .55; font-weight: 400; font-size: .7em; letter-spacing: .05em; margin-left: .6em; }
  .stage {
    width: min(1000px, 100%);
    aspect-ratio: 5 / 3;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
  }
  .stage svg { display: block; width: 100%; height: 100%; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: center; font-size: 14px; }
  .controls button {
    appearance: none;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08);
    color: inherit;
    padding: 8px 18px;
    border-radius: 999px;
    font: inherit;
    cursor: pointer;
    transition: background .2s;
  }
  .controls button:hover { background: rgba(255,255,255,.16); }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls input[type=range] { width: 160px; accent-color: #2bb3a3; }
  #speedVal { min-width: 3.4em; font-variant-numeric: tabular-nums; opacity: .8; }
  .hint { margin: 0; font-size: 13px; opacity: .5; }
</style>
</head>
<body>
  <h1>鹈鹕骑自行车 <span>Pelican on a Bicycle</span></h1>

  <div class="stage">

      <defs>

        <radialGradient id="gSunGlow">

          <stop offset=".45" stop-color="#fff2b0" stop-opacity=".35"/>
          <stop offset="1" stop-color="#fff2b0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset="1" stop-color="#fff5e0" stop-opacity=".55"/>
        </linearGradient>
        <linearGradient id="gRoad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#686d7a"/>
          <stop offset="1" stop-color="#868b97"/>
        </linearGradient>
        <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">

          <stop offset=".7" stop-color="#f3f6fa"/>

          <path d="M372,190 q7,5 14,0 M392,178 q7,5 14,0 M414,171 q7,5 14,0" fill="none" stroke="#c9d2de" stroke-width="2" stroke-linecap="round"/>
          <g class="nod">

          </g>
          <path d="M496,196 C512,160 490,140 506,112" fill="none" stroke="#fff" stroke-width="29" stroke-linecap="round"/>

        <!-- 围巾 + 头部 -->

          <path d="M481,166 Q502,174 523,166 L523,180 Q502,188 481,180 Z" fill="#e5484f" stroke="#a51f2b" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M482,173 Q502,181 522,173" fill="none" stroke="#f7858a" stroke-width="2" opacity=".8"/>
          <circle cx="485" cy="176" r="6.5" fill="#d23641" stroke="#a51f2b" stroke-width="1.5"/>
          <g class="nod">
            <ellipse cx="523" cy="96" rx="12" ry="9.5" fill="#f7b9a4"/>

              <path d="M536,106 C574,108 614,114 652,120 C644,138 616,160 582,160 C556,160 540,146 534,122 Z"

              <path d="M548,124 Q566,148 598,151" fill="none" stroke="#fdd08c" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>

  <p class="hint">点击画面也能按车铃 · 空格键 暂停 / 继续</p>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const W = 1000, TAU = Math.PI * 2;
  const f1 = n => n.toFixed(1);
  const f2 = n => n.toFixed(2);
  const deg = r => (r * 180 / Math.PI) % 360;

  /* ---------------- 参数 ---------------- */
  const WHEEL_R = 72;               // 车轮半径
  const BB = { x: 445, y: 420 };    // 中轴（牙盘中心）
  const CRANK = 34;                 // 曲柄长度
  const GEAR = 1.1;                 // 车轮转速 / 踏板转速
  const BASE_SPEED = 300;           // 地面滚动速度 px/s
  const THIGH = 104, SHIN = 104;    // 大腿 / 小腿长度
  const HIP_NEAR = { x: 428, y: 250 };
  const HIP_FAR  = { x: 440, y: 246 };

  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(926);

  /* ---------------- 静态几何 ---------------- */
  document.querySelectorAll('.spokes').forEach(g => {
    let s = '';
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * TAU, c = Math.cos(a), si = Math.sin(a);
      s += `<line x1="${f2(c * 8)}" y1="${f2(si * 8)}" x2="${f2(c * 64)}" y2="${f2(si * 64)}"/>`;
    }
    g.innerHTML = s;
  });

  {
    let s = '';
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU, r2 = i % 2 ? 66 : 76;
      s += `<line x1="${f1(Math.cos(a) * 55)}" y1="${f1(Math.sin(a) * 55)}" x2="${f1(Math.cos(a) * r2)}" y2="${f1(Math.sin(a) * r2)}"/>`;
    }
    $('sunRays').innerHTML = s;
  }

  /* ---------------- 可无缝循环的视差图层 ---------------- */
  const wave = (base, terms) => x => base + terms.reduce((s, [a, f, p]) => s + a * Math.sin(TAU * f * x / W + p), 0);
  const ridge = (fn, step = 10) => {
    let d = `M0,${f1(fn(0))}`;
    for (let x = step; x <= W; x += step) d += ` L${x},${f1(fn(x))}`;
    return d;
  };
  const hill = (fn, bottom = 600) => ridge(fn) + ` L${W},${bottom} L0,${bottom} Z`;

  const layers = [];
  function addLayer(id, factor, content) {
    const el = $(id);
    el.innerHTML = [-1, 0, 1].map(k => `<g transform="translate(${k * W} 0)">${content}</g>`).join('');
    layers.push({ el, factor });
  }

  // 远山（带雪顶）
  const hFar1 = wave(280, [[28, 2, 0.3], [16, 5, 1.1], [7, 9, 2.0]]);
  let snow = ridge(hFar1);
  for (let x = W; x >= 0; x -= 10) snow += ` L${x},${f1(Math.max(hFar1(x), 262 + 3 * Math.sin(x / 9)))}`;
  addLayer('layerFar1', 0.04, `<path d="${hill(hFar1)}" fill="#c9dcea"/><path d="${snow} Z" fill="#f5f9fc"/>`);

  const hFar2 = wave(322, [[20, 3, 2.1], [11, 4, 0.4], [5, 11, 1.3]]);
  addLayer('layerFar2', 0.08, `<path d="${hill(hFar2)}" fill="#a8c6d9"/>`);

  // 中景山丘：树 + 风车
  const roundTree = (x, y, s) =>
    `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f2(s)})">
       <rect x="-2.5" y="-24" width="5" height="26" rx="1" fill="#80563a"/>
       <circle cy="-34" r="16" fill="#5b9a52"/><circle cx="-5" cy="-39" r="8" fill="#76b268"/>
     </g>`;
  const pineTree = (x, y, s) =>
    `<g transform="translate(${f1(x)} ${f1(y)}) scale(${f2(s)})">
       <rect x="-2" y="-12" width="4" height="14" fill="#6f4a31"/>
       <path d="M0,-56 L14,-10 L-14,-10 Z" fill="#4c8a54"/><path d="M0,-56 L6,-36 L-4,-33 Z" fill="#6aa86a"/>
     </g>`;

  // 翅膀路径模板：“x,y@w” 中 w 表示该点跟随身体起伏的权重（翅尖 w=0 固定在车把上）
  const WING_TPL = [
    '',  // 飞羽，下方生成
    'M462,172@1 C500,178@1 522,210@0.6 532,238@0.3 L546,254@0 Q552,265@0 538,266@0 C515,260@0.3 482,240@0.7 444,238@1 C414,236@1 392,230@1 380,222@1 C398,198@1 428,178@1 462,172@1 Z',
    'M394,208@1 Q432,216@1 472,214@0.9 M412,193@1 Q448,197@1 486,196@1 M404,222@1 q8,5 16,2 M428,226@1 q8,5 16,2 M452,228@1 q8,5 16,2',
    'M532,238@0.3 L546,254@0 Q552,265@0 538,266@0 C532,262@0 526,256@0.1 524,250@0.2 Z'
  ];
  // 沿翅膀下缘排布一排向后掠的黑色飞羽，只露出扇贝状的羽尖
  {
    const EDGE = [  // 三次贝塞尔控制点 [x, y, 起伏权重]，从翅尖向后
      [[538, 266, 0], [515, 260, 0.3], [482, 240, 0.7], [444, 238, 1]],
      [[444, 238, 1], [414, 236, 1], [392, 230, 1], [380, 222, 1]]
    ];
    const bez = (a, t, i) => { const u = 1 - t; return u*u*u*a[0][i] + 3*u*u*t*a[1][i] + 3*u*t*t*a[2][i] + t*t*t*a[3][i]; };
    const bezD = (a, t, i) => { const u = 1 - t; return 3*u*u*(a[1][i]-a[0][i]) + 6*u*t*(a[2][i]-a[1][i]) + 3*t*t*(a[3][i]-a[2][i]); };
    const samples = [[1, 0.8], [1, 0.45], [1, 0.1], [0, 0.85], [0, 0.65], [0, 0.45], [0, 0.27], [0, 0.1]];
    let d = '';
    samples.forEach(([seg, t], i) => {
      const a = EDGE[seg];
      const px = bez(a, t, 0), py = bez(a, t, 1), w = f2(bez(a, t, 2));
      let tx = bezD(a, t, 0), ty = bezD(a, t, 1); const m = Math.hypot(tx, ty); tx /= m; ty /= m;
      const nx = ty, ny = -tx;                          // 朝外（向下）的法线
      let dx = nx + tx * 0.75, dy = ny + ty * 0.75; const dm = Math.hypot(dx, dy); dx /= dm; dy /= dm;
      const L = 24 + i * 0.8, hw = 8, bx = px - nx * 7, by = py - ny * 7, sx = -dy, sy = dx;
      const pt = (x, y) => `${f2(x)},${f2(y)}@${w}`;
      d += `M${pt(bx + sx * hw, by + sy * hw)} Q${pt(bx + dx * L * 0.75 + sx * hw, by + dy * L * 0.75 + sy * hw)} ${pt(bx + dx * L, by + dy * L)} ` +
           `Q${pt(bx + dx * L * 0.75 - sx * hw, by + dy * L * 0.75 - sy * hw)} ${pt(bx - sx * hw, by - sy * hw)} Z `;
    });

  function setLine(el, x1, y1, x2, y2) {

  // 两段式反向运动学：已知髋部和脚踝位置求膝盖（膝盖朝前）
  function solveLeg(hx, hy, px, py, els) {
    const tx = px - 4, ty = py - 8;
    const d = Math.min(Math.hypot(tx - hx, ty - hy), THIGH + SHIN - 0.01);
    const base = Math.atan2(ty - hy, tx - hx);
    const cosA = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const a = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const kx = hx + THIGH * Math.cos(base - a), ky = hy + THIGH * Math.sin(base - a);
    // 大腿上半段是白色羽毛“短裤”，下半段露出橙色的腿
    const mx = hx + (kx - hx) * 0.5, my = hy + (ky - hy) * 0.5;
    setLine(els.low, mx, my, kx, ky);
    setLine(els.thighO, hx, hy, mx, my);
    setLine(els.thigh, hx, hy, mx, my);
    setLine(els.shin, kx, ky, tx, ty);
    els.foot.setAttribute('d', footPath(px, py));
  }

  // 飘动的围巾：沿方向 phi 生成一条带正弦波动、末端开叉的丝带
  function ribbon(x0, y0, len, w0, w1, phi, phase, amp) {
    const N = 18, ux = Math.cos(phi), uy = Math.sin(phi), nx = -uy, ny = ux, pts = [];
    for (let i = 0; i <= N; i++) {
      const s = i / N, off = Math.sin(phase - s * 4.6) * amp * s;
      pts.push([x0 + ux * len * s + nx * off, y0 + uy * len * s + ny * off]);
    }
    const left = [], right = [];
    for (let i = 0; i <= N; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1];
      const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
      const hw = (w0 + (w1 - w0) * i / N) / 2;
      left.push([pts[i][0] - ty * hw, pts[i][1] + tx * hw]);
      right.push([pts[i][0] + ty * hw, pts[i][1] - tx * hw]);
    }
    const e = pts[N], p = pts[N - 1], m = Math.hypot(e[0] - p[0], e[1] - p[1]) || 1;
    const notch = [e[0] - (e[0] - p[0]) / m * 6, e[1] - (e[1] - p[1]) / m * 6];
    const fmt = q => `${f1(q[0])},${f1(q[1])}`;
    return 'M' + left.map(fmt).join(' L') + ' L' + fmt(notch) + ' L' + right.reverse().map(fmt).join(' L') + ' Z';
  }

  /* ---------------- 车铃 ---------------- */
  let audioCtx = null;
  function dingSound() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      [0, 0.16, 0.32].forEach(delay => {
        [[2093, 0.12], [2637, 0.06], [5230, 0.025]].forEach(([freq, vol]) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, now + delay);
          g.gain.exponentialRampToValueAtTime(vol, now + delay + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.7);
          o.connect(g).connect(audioCtx.destination);
          o.start(now + delay);
          o.stop(now + delay + 0.75);
        });
      });
    } catch (e) { /* 无音频也不影响动画 */ }
  }

  /* ---------------- 主循环 ---------------- */
  let speed = 1, running = true, t = 0, dist = 0;

  function update(dt) {

    sunA += dt * 5;
    $('sunRays').setAttribute('transform', `rotate(${f1(sunA % 360)})`);

    clouds.forEach(cl => {

      if (cl.x < -110 * cl.s - 20) { cl.x = W + 90; cl.y = 50 + Math.random() * 170; }
      cl.el.setAttribute('transform', `translate(${f1(cl.x)} ${f1(cl.y)}) scale(${f2(cl.s)})`);
    });

    birds.forEach(b => {
      b.x += (18 - v * 0.03) * dt;
      if (b.x > W + 30) b.x = -30;
      if (b.x < -30) b.x = W + 30;
      const fl = Math.sin(t * 7 + b.ph) * 5;
      b.el.setAttribute('d', `M-9,0 Q-4.5,${f1(-fl - 2)} 0,1 Q4.5,${f1(-fl - 2)} 9,0`);
      b.el.setAttribute('transform', `translate(${f1(b.x)} ${f1(b.y + Math.sin(t * 1.3 + b.ph) * 4)}) scale(${f2(b.s)})`);

        L.y = 150 + Math.random() * 290;

      const x = L.x0 - L.p * 260;
      setLine(L.el, x, L.y, x + L.len, L.y);
      L.el.setAttribute('opacity', f2(Math.sin(L.p * Math.PI) * 0.55 * lineVis));
    });

    // 后轮扬起的尘土
    dustAcc += dt * 12 * Math.min(speed, 2);
    while (dustAcc >= 1) {
      dustAcc -= 1;
      const d = dust.find(p => p.life < 0);
      if (!d) break;
      Object.assign(d, {
        life: 0, max: 0.6 + Math.random() * 0.4,
        x: rx + 318 + Math.random() * 8, y: 498 + shake,
        vx: -(v * 0.8 + Math.random() * 30), vy: -(10 + Math.random() * 22), r0: 2 + Math.random() * 2
      });
    }
    dust.forEach(d => {
      if (d.life < 0) return;
      d.life += dt;
      if (d.life > d.max) { d.life = -1; d.el.setAttribute('r', '0'); return; }
      const q = d.life / d.max;
      d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 14 * dt;
      d.el.setAttribute('cx', f1(d.x));
      d.el.setAttribute('cy', f1(d.y));
      d.el.setAttribute('r', f1(d.r0 + 9 * q));
      d.el.setAttribute('opacity', f2(0.32 * (1 - q)));
    });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) update(dt);
    updateEffects(dt);
    requestAnimationFrame(frame);
  }
  update(0);
  requestAnimationFrame(frame);

  /* ---------------- 交互 ---------------- */
  const btnPlay = $('btnPlay'), speedInput = $('speed'), speedVal = $('speedVal');
  function togglePlay() {
    running = !running;
    btnPlay.textContent = running ? '⏸ 暂停' : '▶ 继续';
  }
  btnPlay.addEventListener('click', togglePlay);
  speedInput.addEventListener('input', () => {
    speed = +speedInput.value;
    speedVal.textContent = speed.toFixed(2) + '×';
  });
  $('btnBell').addEventListener('click', ring);
  $('scene').addEventListener('click', ring);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); togglePlay(); }
  });
})();
</script>
</body>
</html>
