<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑行俱乐部 · Coastal Cruise</title>
<style>
  :root {
    --ink: #233943;
    --cream: #fff7e8;
    --coral: #df5a43;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    overflow: hidden;
    background: #e8bd91;
  }

  body {
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background: #f4c79f;
    isolation: isolate;
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    opacity: .25;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
    background-size: 190px 190px;
  }

  .artwork {
    display: block;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }

  /* ---------------- typography ---------------- */
  .kicker {
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3.7px;
    fill: var(--ink);
  }

  .display {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 92px;
    font-style: italic;
    letter-spacing: -5px;
    fill: var(--ink);
  }

  .display.small {
    font-size: 79px;
    letter-spacing: -4px;
  }

  .route-label {
    font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.8px;
    fill: var(--ink);
    opacity: .72;
  }

  /* ---------------- ambient motion ---------------- */
  .sun-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: sun-breathe 7s ease-in-out infinite;
  }

  @keyframes sun-breathe {
    0%, 100% { opacity: .52; transform: scale(1); }
    50% { opacity: .78; transform: scale(1.06); }
  }

  .cloud-a {
    animation: cloud-drift-a 32s ease-in-out infinite alternate;
  }
  .cloud-b {
    animation: cloud-drift-b 41s ease-in-out infinite alternate;
  }
  .cloud-c {
    animation: cloud-drift-a 47s ease-in-out -12s infinite alternate-reverse;
  }

  @keyframes cloud-drift-a {
    from { transform: translateX(-16px); }
    to { transform: translateX(36px); }
  }
  @keyframes cloud-drift-b {
    from { transform: translateX(20px); }
    to { transform: translateX(-34px); }
  }

  .wave-a { animation: wave-slide-a 7.2s linear infinite; }
  .wave-b { animation: wave-slide-b 8.8s linear infinite; }
  .wave-c { animation: wave-slide-c 10.4s linear infinite; }

  @keyframes wave-slide-a { to { transform: translateX(-72px); } }
  @keyframes wave-slide-b { to { transform: translateX(-88px); } }
  @keyframes wave-slide-c { to { transform: translateX(-104px); } }

  .sun-path {
    transform-box: fill-box;
    transform-origin: center;
    animation: shimmer 4.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { opacity: .30; transform: scaleX(.72); }
    50% { opacity: .74; transform: scaleX(1); }
  }

  .gull {
    transform-box: fill-box;
    transform-origin: center;
    animation: gull-float 5.4s ease-in-out infinite;
  }
  .gull:nth-child(2) { animation-delay: -2.1s; animation-duration: 6.7s; }

  @keyframes gull-float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
  }

  .grass {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: grass-sway 3.8s ease-in-out infinite alternate;
  }
  .grass:nth-of-type(2n) { animation-delay: -1.4s; animation-duration: 4.6s; }
  .grass:nth-of-type(3n) { animation-delay: -2.7s; animation-duration: 3.2s; }

  @keyframes grass-sway {
    from { transform: rotate(-1.4deg) skewX(-.5deg); }
    to { transform: rotate(2.2deg) skewX(.8deg); }
  }

  .speed-mark {
    animation: speed-pass 1.7s ease-in-out infinite;
  }
  .speed-mark:nth-child(2) { animation-delay: -.7s; }
  .speed-mark:nth-child(3) { animation-delay: -1.2s; }

  @keyframes speed-pass {
    0% { opacity: 0; transform: translateX(28px); }
    28% { opacity: .7; }
    100% { opacity: 0; transform: translateX(-64px); }
  }

  .road-scroll {
    animation: road-scroll 6.4s linear infinite;
  }
  @keyframes road-scroll {
    to { transform: translateX(-1200px); }
  }

  .dust-puff {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: dust-puff 2.5s ease-out infinite;
  }
  .dust-puff:nth-child(2) { animation-delay: -.9s; }
  .dust-puff:nth-child(3) { animation-delay: -1.7s; }
  .dust-puff:nth-child(4) { animation-delay: -2.1s; }

  @keyframes dust-puff {
    0% { opacity: 0; transform: translate(0, 0) scale(.35); }
    18% { opacity: .45; }
    70% { opacity: .2; }
    100% { opacity: 0; transform: translate(-58px, -16px) scale(1.35); }
  }

  .feather-floater {
    animation: feather-float 13s linear infinite;
  }
  @keyframes feather-float {
    0% { opacity: 0; transform: translate(0, 0) rotate(0deg); }
    12% { opacity: .8; }
    75% { opacity: .7; }
    100% { opacity: 0; transform: translate(-90px, 70px) rotate(160deg); }
  }

  .eye-lid {
    transform-box: fill-box;
    transform-origin: center top;
    transform: scaleY(0);
    animation: blink 6.2s infinite;
  }

  @keyframes blink {
    0%, 91%, 96%, 100% { transform: scaleY(0); }
    93%, 94% { transform: scaleY(1); }
  }

  .head {
    transform-box: view-box;
    transform-origin: 692px 265px;
    animation: head-bob 3.5s ease-in-out infinite;
  }

  @keyframes head-bob {
    0%, 100% { transform: rotate(-.5deg); }
    50% { transform: rotate(1.2deg); }
  }

  .wing {
    transform-box: view-box;
    transform-origin: 600px 322px;
    animation: wing-flap 3.2s ease-in-out infinite;
  }

  @keyframes wing-flap {
    0%, 100% { transform: rotate(.25deg); }
    50% { transform: rotate(-1deg); }
  }

  /* pause everything when requested */
  .stage.is-paused * {
    animation-play-state: paused !important;
  }

  /* ---------------- controls ---------------- */
  .controls {
    position: absolute;
    z-index: 5;
    right: clamp(18px, 3vw, 44px);
    bottom: clamp(18px, 3.5vh, 36px);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 15px 8px 8px;
    border: 1px solid rgba(255, 247, 232, .42);
    border-radius: 999px;
    color: var(--cream);
    background: rgba(35, 57, 67, .42);
    box-shadow: 0 10px 30px rgba(74, 46, 30, .12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: .78;
    transform: translateY(0);
    transition: opacity .25s ease, transform .25s ease, background .25s ease;
  }

  .controls:hover,
  .controls:focus-within {
    opacity: 1;
    background: rgba(35, 57, 67, .62);
    transform: translateY(-2px);
  }

  .toggle {
    width: 36px;
    height: 36px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--cream);
    color: var(--ink);
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
  }

  .toggle:hover { transform: scale(1.06); }
  .toggle:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
  .toggle svg { width: 13px; height: 13px; display: block; }
  .icon-play { display: none; }
  .is-paused .icon-play { display: block; }
  .is-paused .icon-pause { display: none; }

  .speed-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .speed-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  input[type="range"] {
    appearance: none;
    -webkit-appearance: none;
    width: 62px;
    height: 16px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-runnable-track {
    height: 2px;
    border-radius: 2px;
    background: rgba(255, 247, 232, .5);
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 10px;
    height: 10px;
    margin-top: -4px;
    border: 0;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: 0 1px 5px rgba(0,0,0,.18);
  }

  input[type="range"]::-moz-range-track {
    height: 2px;
    border-radius: 2px;
    background: rgba(255, 247, 232, .5);
  }
  input[type="range"]::-moz-range-thumb {
    width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--cream);
  }
  input[type="range"]:focus-visible { outline: 2px solid var(--cream); outline-offset: 5px; }

  @media (max-width: 720px) {
    .controls { gap: 8px; padding-right: 12px; }
    input[type="range"] { width: 44px; }
    .speed-label { display: none; }
    .display { font-size: 70px; }
    .display.small { font-size: 61px; }
    .kicker { font-size: 9.5px; letter-spacing: 2.6px; }
  }

</style>
</head>
<body>
<main class="stage" id="stage">

            <path d="M651 237 C660 231 673 234 678 243 C666 242 661 246 656 253 Z" fill="#c74635"/>
            <path d="M647 245 C650 250 654 253 660 254" fill="none" stroke="#f5c1a2" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
          </g>

          <!-- a fluttering loose feather decal near the back -->
          <g transform="translate(470 291) rotate(-18)" opacity=".62">
            <path d="M0 0 C-10 2 -17 11 -18 20 C-9 16 -3 9 0 0 Z" fill="#f8ebd8"/>
            <path d="M0 0 C-5 7 -10 13 -18 20" fill="none" stroke="#d8c0a2" stroke-width="1"/>
          </g>
        </g>

        <!-- floating feather -->
        <g transform="translate(340 380)">
          <g class="feather-floater">
            <path d="M0 0 C8 6 14 18 13 29 C4 23 -1 13 0 0 Z" fill="#fff3e2" opacity=".8"/>
            <path d="M0 0 C3 10 5 19 13 29" fill="none" stroke="#d2b999" stroke-width="1"/>
          </g>
        </g>
      </g>

      <!-- ================= TITLE ================= -->
      <g id="title-block" transform="translate(40 24)">
        <circle cx="84" cy="75" r="5.5" fill="#df5a43"/>
        <circle cx="84" cy="75" r="10.5" fill="none" stroke="#df5a43" stroke-width="1" opacity=".35"/>
        <text x="102" y="80" class="kicker">PELICAN CYCLING CLUB</text>

        <g>
          <text x="78" y="169" class="display">Coastal</text>
          <text x="119" y="242" class="display small">cruise</text>
          <path d="M82 259 C126 254 164 255 205 259" fill="none" stroke="#df5a43" stroke-width="2" stroke-linecap="round"/>
          <text x="82" y="283" class="route-label">SEASIDE ROUTE · Nº 04</text>
        </g>
      </g>

    </g>
  </svg>

  <div class="controls" id="controls">
    <button class="toggle" id="toggle" type="button" aria-label="暂停动画" aria-pressed="false">
      <svg class="icon-pause" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <rect x="2.5" y="1.5" width="3.7" height="13" rx="1.4"/>
        <rect x="9.8" y="1.5" width="3.7" height="13" rx="1.4"/>
      </svg>
      <svg class="icon-play" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M3.3 1.7c0-.8.9-1.2 1.5-.7l9.2 5.8c.6.4.6 1.3 0 1.7L4.8 15c-.6.4-1.5 0-1.5-.7V1.7Z"/>
      </svg>
    </button>
    <div class="speed-wrap">
      <span class="speed-label">Pedal</span>
      <input id="speed" type="range" min="0.35" max="1.8" step="0.05" value="1" aria-label="动画速度" />
    </div>
  </div>
</main>

<script>
(() => {
  const stage = document.getElementById('stage');
  const toggle = document.getElementById('toggle');
  const speedInput = document.getElementById('speed');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const state = {
    paused: reduceMotion,
    speed: 1,
    wheelAngle: 0,
    crankAngle: Math.PI * 0.12,
    time: 0,
    last: null,
  };

  if (reduceMotion) {
    stage.classList.add('is-paused');
    toggle.setAttribute('aria-pressed', 'true');
    toggle.setAttribute('aria-label', '播放动画');
  }

  const $ = (id) => document.getElementById(id);

  const rearWheel = $('rear-wheel-spin');
  const frontWheel = $('front-wheel-spin');
  const nearLegPath = $('near-leg-line');
  const nearLegHighlight = $('near-leg-highlight');
  const nearKnee = $('near-knee');
  const nearFoot = $('near-foot');
  const nearCrank = $('near-crank');
  const nearPedal = $('near-pedal');
  const farLegPath = $('far-leg-line');
  const farKnee = $('far-knee');
  const farFoot = $('far-foot');
  const farCrank = $('far-crank');
  const farPedal = $('far-pedal');
  const riderBob = $('rider-bob');
  const scarfA = $('scarf-tail-a');
  const scarfB = $('scarf-tail-b');
  const chainTop = $('chain-top');
  const chainBottom = $('chain-bottom');

  const BB = { x: 584, y: 585 };
  const CRANK_R = 44;
  const HIP_NEAR = { x: 578, y: 391 };
  const HIP_FAR = { x: 596, y: 383 };
  const THIGH = 112;
  const SHIN = 132;

  function kneePoint(hip, foot, bend = -1) {
    let dx = foot.x - hip.x;
    let dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    const max = THIGH + SHIN - 0.5;
    if (d > max) {
      const k = max / d;
      dx *= k;
      dy *= k;
      d = max;
    }
    d = Math.max(d, Math.abs(THIGH - SHIN) + 0.5);
    const ux = dx / d;
    const uy = dy / d;
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    return {
      x: hip.x + ux * a + bend * (-uy) * h,
      y: hip.y + uy * a + bend * (ux) * h,
      foot: { x: hip.x + dx, y: hip.y + dy },
    };
  }

  function setLeg(paths, hip, foot, bend = -1) {
    const knee = kneePoint(hip, foot, bend);
    const d = `M ${hip.x} ${hip.y} L ${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L ${knee.foot.x.toFixed(2)} ${knee.foot.y.toFixed(2)}`;
    paths.forEach((el) => el && el.setAttribute('d', d));
    return { knee, foot: knee.foot };
  }

  function updateScene(dt) {
    const pedal = state.crankAngle;
    const wheelDeg = state.wheelAngle * 180 / Math.PI;

    rearWheel.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 405 580)`);
    frontWheel.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)} 802 580)`);

    const bob = Math.sin(pedal * 2) * 4.2;
    riderBob.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    const near = {
      x: BB.x + CRANK_R * Math.cos(pedal),
      y: BB.y + CRANK_R * Math.sin(pedal),
    };
    const far = {
      x: BB.x + CRANK_R * Math.cos(pedal + Math.PI),
      y: BB.y + CRANK_R * Math.sin(pedal + Math.PI),
    };

    const nearFootPoint = { x: near.x, y: near.y - 9 };
    const farFootPoint = { x: far.x, y: far.y - 9 };
    const hipNear = { x: HIP_NEAR.x, y: HIP_NEAR.y + bob };
    const hipFar = { x: HIP_FAR.x, y: HIP_FAR.y + bob };

    const nearRes = setLeg([nearLegPath, nearLegHighlight], hipNear, nearFootPoint, -1);
    const farRes = setLeg([farLegPath], hipFar, farFootPoint, -1);

    nearKnee.setAttribute('cx', nearRes.knee.x.toFixed(2));
    nearKnee.setAttribute('cy', nearRes.knee.y.toFixed(2));
    farKnee.setAttribute('cx', farRes.knee.x.toFixed(2));
    farKnee.setAttribute('cy', farRes.knee.y.toFixed(2));

    nearFoot.setAttribute('transform', `translate(${nearRes.foot.x.toFixed(2)} ${nearRes.foot.y.toFixed(2)})`);
    farFoot.setAttribute('transform', `translate(${farRes.foot.x.toFixed(2)} ${farRes.foot.y.toFixed(2)})`);

    nearCrank.setAttribute('x1', BB.x);
    nearCrank.setAttribute('y1', BB.y);
    nearCrank.setAttribute('x2', near.x.toFixed(2));
    nearCrank.setAttribute('y2', near.y.toFixed(2));
    farCrank.setAttribute('x1', BB.x);
    farCrank.setAttribute('y1', BB.y);
    farCrank.setAttribute('x2', far.x.toFixed(2));
    farCrank.setAttribute('y2', far.y.toFixed(2));

    nearPedal.setAttribute('transform', `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)})`);
    farPedal.setAttribute('transform', `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)})`);

    // chain crawls around the sprockets
    const chainOffset = -(state.time * 48) % 8;
    chainTop.setAttribute('stroke-dashoffset', chainOffset.toFixed(2));
    chainBottom.setAttribute('stroke-dashoffset', chainOffset.toFixed(2));

    // Flowing ribbon: repaint each frame, so the motion stays fluid.
    const t = state.time;
    const flutterA = Math.sin(t * 4.4) * 7.5;
    const flutterB = Math.sin(t * 4.4 + 1.5) * 9;
    const flutterC = Math.sin(t * 3.7 + .7) * 5;
    scarfA.setAttribute('d', `M 654 245 C 620 ${237 + flutterA * .35} 590 ${245 + flutterA} 557 ${226 + flutterA * .8} C 586 ${253 + flutterB * .2} 619 262 655 258 Z`);
    scarfB.setAttribute('d', `M 652 258 C 620 ${267 + flutterC * .5} 591 ${275 + flutterC} 550 ${265 + flutterC * .7} C 584 ${292 + flutterB * .25} 620 291 652 275 Z`);
  }

  function frame(now) {
    if (state.last === null) state.last = now;
    const rawDt = Math.min((now - state.last) / 1000, 0.04);
    state.last = now;

    if (!state.paused) {
      const dt = rawDt * state.speed;
      state.time += dt;
      state.crankAngle += dt * 4.25;
      state.wheelAngle += dt * 8.1;
      updateScene(dt);
    }
    requestAnimationFrame(frame);
  }

  function syncCssAnimations() {
    if (!document.getAnimations) return;
    document.getAnimations().forEach((animation) => {
      try {
        animation.playbackRate = state.speed;
        if (state.paused) animation.pause();
        else animation.play();
      } catch (e) { /* no-op for finished/unsupported animations */ }
    });
  }

  function setPaused(next) {
    state.paused = next;
    stage.classList.toggle('is-paused', next);
    toggle.setAttribute('aria-pressed', String(next));
    toggle.setAttribute('aria-label', next ? '播放动画' : '暂停动画');
    if (!state.paused) state.last = performance.now();
    if (document.getAnimations) {
      document.getAnimations().forEach((animation) => {
        try {
          animation.playbackRate = state.speed;
          if (state.paused) animation.pause();
          else animation.play();
        } catch (e) {}
      });
    }
  }

  toggle.addEventListener('click', () => setPaused(!state.paused));

  speedInput.addEventListener('input', (event) => {
    state.speed = Number(event.target.value) || 1;
    syncCssAnimations();
  });

  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space' && event.target === document.body) {
      event.preventDefault();
      setPaused(!state.paused);
    }
  });

  // draw initial state
  updateScene(0);
  requestAnimationFrame(frame);
  // CSS animations are created asynchronously; sync them after the first paint.
  requestAnimationFrame(() => {
    syncCssAnimations();
  });
})();
</script>
</body>
</html>
