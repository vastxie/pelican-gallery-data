<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 60%, #A5D6A7 100%);
            overflow: hidden;
        }
        svg {
            width: 800px;
            height: 600px;
        }
        /* 云朵漂浮动画 */
        @keyframes cloudMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(800px); }
        }
        .cloud1 { animation: cloudMove 20s linear infinite; }
        .cloud2 { animation: cloudMove 30s linear infinite; animation-delay: -10s; }
        .cloud3 { animation: cloudMove 25s linear infinite; animation-delay: -5s; }

        /* 车轮旋转动画 */
        @keyframes wheelSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .wheel {
            transform-origin: center;
            animation: wheelSpin 1s linear infinite;
        }

        /* 踏板动画 */
        @keyframes pedalPush {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }
        .pedal-front { animation: pedalPush 0.5s ease-in-out infinite; }
        .pedal-back { animation: pedalPush 0.5s ease-in-out infinite; animation-delay: 0.25s; }

        /* 车身轻微颠簸 */
        @keyframes bodyBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .bike-body { animation: bodyBounce 0.5s ease-in-out infinite; }

        /* 鹈鹕头部晃动 */
        @keyframes headBob {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }
        .pelican-head { animation: headBob 1s ease-in-out infinite; transform-origin: 340px 220px; }

        /* 尾羽飘动 */
        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(5deg); }
        }
        .pelican-tail { animation: tailWag 1.2s ease-in-out infinite; transform-origin: 380px 260px; }

        /* 翅膀扇动 */
        @keyframes wingFlap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-8deg); }
        }
        .pelican-wing { animation: wingFlap 0.6s ease-in-out infinite; transform-origin: 350px 250px; }

        /* 太阳光晕 */
        @keyframes sunGlow {
            0%, 100% { opacity: 0.6; r: 35; }
            50% { opacity: 1; r: 38; }
        }
        .sun-glow { animation: sunGlow 3s ease-in-out infinite; }

        /* 地面草叶摆动 */
        @keyframes grassSway {
            0%, 100% { transform: skewX(0deg); }
            50% { transform: skewX(3deg); }
        }
        .grass { animation: grassSway 2s ease-in-out infinite; transform-origin: bottom center; }

        /* 整体移动 */
        @keyframes moveRight {
            0% { transform: translateX(-200px); }
            100% { transform: translateX(900px); }
        }
        .scene-wrapper { animation: moveRight 12s linear infinite; }

        /* 水花飞溅 */
        @keyframes splash {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
            50% { opacity: 1; transform: translateY(-10px) scale(1); }
        }
        .splash { animation: splash 0.8s ease-in-out infinite; }
        .splash-delay { animation: splash 0.8s ease-in-out infinite; animation-delay: 0.4s; }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <!-- 太阳 -->
        <circle cx="650" cy="80" r="35" fill="#FFD54F" class="sun-glow"/>
        <circle cx="650" cy="80" r="28" fill="#FFEB3B"/>
        <!-- 太阳光线 -->
        <g stroke="#FFD54F" stroke-width="3" stroke-linecap="round">
            <line x1="650" y1="35" x2="650" y2="20"/>
            <line x1="650" y1="125" x2="650" y2="140"/>
            <line x1="605" y1="80" x2="590" y2="80"/>
            <line x1="695" y1="80" x2="710" y2="80"/>
            <line x1="618" y1="48" x2="607" y2="37"/>
            <line x1="682" y1="112" x2="693" y2="123"/>
            <line x1="682" y1="48" x2="693" y2="37"/>
            <line x1="618" y1="112" x2="607" y2="123"/>
        </g>

        <!-- 云朵 -->
        <g class="cloud1" opacity="0.9">
            <ellipse cx="100" cy="70" rx="40" ry="25" fill="white"/>
            <ellipse cx="130" cy="60" rx="35" ry="22" fill="white"/>
            <ellipse cx="70" cy="65" rx="30" ry="20" fill="white"/>
        </g>
        <g class="cloud2" opacity="0.8">
            <ellipse cx="300" cy="100" rx="45" ry="28" fill="white"/>
            <ellipse cx="340" cy="90" rx="38" ry="24" fill="white"/>
            <ellipse cx="270" cy="95" rx="32" ry="20" fill="white"/>
        </g>
        <g class="cloud3" opacity="0.85">
            <ellipse cx="550" cy="50" rx="35" ry="22" fill="white"/>
            <ellipse cx="580" cy="42" rx="30" ry="20" fill="white"/>
            <ellipse cx="525" cy="48" rx="28" ry="18" fill="white"/>
        </g>

        <!-- 远山 -->
        <path d="M0 400 Q100 320 200 380 Q300 300 400 360 Q500 290 600 350 Q700 310 800 370 L800 600 L0 600 Z" fill="#81C784" opacity="0.5"/>
        <path d="M0 430 Q150 370 300 420 Q450 360 600 410 Q750 370 800 420 L800 600 L0 600 Z" fill="#66BB6A" opacity="0.6"/>

        <!-- 地面 -->
        <rect x="0" y="460" width="800" height="140" fill="#4CAF50"/>
        <rect x="0" y="460" width="800" height="20" fill="#388E3C" rx="5"/>

        <!-- 草地细节 -->
        <g class="grass">
            <path d="M50 460 L55 445 L60 460" stroke="#2E7D32" stroke-width="2" fill="none"/>
            <path d="M120 460 L125 448 L130 460" stroke="#2E7D32" stroke-width="2" fill="none"/>
            <path d="M200 460 L205 442 L210 460" stroke="#2E7D32" stroke-width="2" fill="none"/>
            <path d="M350 460 L355 446 L360 460" stroke="#2E7D32" stroke-width="2" fill="none"/>
            <path d="M500 460 L505 444 L510 460" stroke="#2E7D32" stroke-width="2" fill="none"/>
            <path d="M650 460 L655 447 L660 460" stroke="#2E7D32" stroke-width="2" fill="none"/>
            <path d="M720 460 L725 443 L730 460" stroke="#2E7D32" stroke-width="2" fill="none"/>
        </g>

        <!-- 道路 -->
        <rect x="0" y="470" width="800" height="60" fill="#78909C" rx="3"/>
        <line x1="0" y1="500" x2="800" y2="500" stroke="#FFF" stroke-width="3" stroke-dasharray="30,20"/>

        <!-- 场景主体 - 鹈鹕骑自行车 -->
        <g class="scene-wrapper">
            <!-- 水花 -->
            <g class="splash">
                <circle cx="230" cy="455" r="3" fill="#4FC3F7"/>
                <circle cx="240" cy="450" r="2" fill="#4FC3F7"/>
            </g>
            <g class="splash-delay">
                <circle cx="370" cy="455" r="3" fill="#4FC3F7"/>
                <circle cx="360" cy="448" r="2" fill="#4FC3F7"/>
            </g>

            <!-- 自行车和鹈鹕主体 -->
            <g class="bike-body">
                <!-- 后轮 -->
                <g class="wheel" style="transform-origin: 280px 430px">
                    <circle cx="280" cy="430" r="45" fill="none" stroke="#333" stroke-width="4"/>
                    <circle cx="280" cy="430" r="38" fill="none" stroke="#555" stroke-width="2"/>
                    <circle cx="280" cy="430" r="5" fill="#333"/>
                    <!-- 辐条 -->
                    <line x1="280" y1="385" x2="280" y2="475" stroke="#888" stroke-width="1.5"/>
                    <line x1="235" y1="430" x2="325" y2="430" stroke="#888" stroke-width="1.5"/>
                    <line x1="248" y1="398" x2="312" y2="462" stroke="#888" stroke-width="1.5"/>
                    <line x1="312" y1="398" x2="248" y2="462" stroke="#888" stroke-width="1.5"/>
                </g>

                <!-- 前轮 -->
                <g class="wheel" style="transform-origin: 420px 430px">
                    <circle cx="420" cy="430" r="45" fill="none" stroke="#333" stroke-width="4"/>
                    <circle cx="420" cy="430" r="38" fill="none" stroke="#555" stroke-width="2"/>
                    <circle cx="420" cy="430" r="5" fill="#333"/>
                    <!-- 辐条 -->
                    <line x1="420" y1="385" x2="420" y2="475" stroke="#888" stroke-width="1.5"/>
                    <line x1="375" y1="430" x2="465" y2="430" stroke="#888" stroke-width="1.5"/>
                    <line x1="388" y1="398" x2="452" y2="462" stroke="#888" stroke-width="1.5"/>
                    <line x1="452" y1="398" x2="388" y2="462" stroke="#888" stroke-width="1.5"/>
                </g>

                <!-- 车架 -->
                <g stroke="#E53935" stroke-width="5" stroke-linecap="round" fill="none">
                    <!-- 后叉 -->
                    <line x1="280" y1="430" x2="340" y2="370"/>
                    <line x1="280" y1="430" x2="330" y2="360"/>
                    <!-- 座管 -->
                    <line x1="330" y1="360" x2="340" y2="370"/>
                    <!-- 上管 -->
                    <line x1="340" y1="370" x2="400" y2="370"/>
                    <!-- 下管 -->
                    <line x1="330" y1="360" x2="390" y2="360"/>
                    <!-- 前叉 -->
                    <line x1="400" y1="370" x2="420" y2="430"/>
                    <line x1="390" y1="360" x2="420" y2="430"/>
                </g>

                <!-- 脚踏板区域 -->
                <circle cx="360" cy="400" r="8" fill="#333"/>
                <g class="pedal-front">
                    <line x1="360" y1="400" x2="375" y2="415" stroke="#333" stroke-width="4"/>
                    <rect x="370" y="412" width="12" height="6" rx="2" fill="#555"/>
                </g>
                <g class="pedal-back">
                    <line x1="360" y1="400" x2="345" y2="385" stroke="#333" stroke-width="4"/>
                    <rect x="340" y="382" width="12" height="6" rx="2" fill="#555"/>
                </g>

                <!-- 车座 -->
                <ellipse cx="335" cy="355" rx="18" ry="8" fill="#5D4037"/>
                <line x1="335" y1="355" x2="340" y2="370" stroke="#5D4037" stroke-width="3"/>

                <!-- 车把 -->
                <g stroke="#333" stroke-width="4" stroke-linecap="round" fill="none">
                    <line x1="400" y1="370" x2="410" y2="345"/>
                    <line x1="405" y1="350" x2="420" y2="340"/>
                    <line x1="405" y1="350" x2="395" y2="335"/>
                </g>

                <!-- 鹈鹕身体 -->
                <g>
                    <!-- 尾羽 -->
                    <g class="pelican-tail">
                        <path d="M380 260 Q400 255 410 245 Q415 250 405 260 Q415 265 405 270 Q395 275 380 270 Z" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
                        <path d="M385 262 Q395 258 400 252" stroke="#E0E0E0" stroke-width="1" fill="none"/>
                        <path d="M385 268 Q395 272 400 276" stroke="#E0E0E0" stroke-width="1" fill="none"/>
                    </g>

                    <!-- 身体 -->
                    <ellipse cx="350" cy="280" rx="45" ry="35" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
                    <!-- 腹部 -->
                    <ellipse cx="355" cy="290" rx="30" ry="20" fill="#FFF9C4"/>

                    <!-- 翅膀 -->
                    <g class="pelican-wing">
                        <path d="M340 265 Q320 250 310 260 Q300 270 310 275 Q320 280 340 275 Z" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
                        <path d="M335 267 Q320 258 315 265" stroke="#BDBDBD" stroke-width="1" fill="none"/>
                    </g>

                    <!-- 腿 -->
                    <g stroke="#FF8A65" stroke-width="4" stroke-linecap="round">
                        <line x1="345" y1="310" x2="360" y2="400"/>
                        <line x1="355" y1="310" x2="360" y2="400"/>
                    </g>

                    <!-- 脚蹼 -->
                    <g fill="#FF8A65">
                        <ellipse cx="368" cy="418" rx="10" ry="5"/>
                        <ellipse cx="352" cy="418" rx="10" ry="5"/>
                    </g>

                    <!-- 脖子 -->
                    <path d="M340 250 Q335 230 340 210 Q345 195 350 190" stroke="#FAFAFA" stroke-width="12" fill="none" stroke-linecap="round"/>
                    <path d="M340 250 Q335 230 340 210 Q345 195 350 190" stroke="#E0E0E0" stroke-width="1" fill="none"/>

                    <!-- 头部 -->
                    <g class="pelican-head">
                        <!-- 头 -->
                        <circle cx="350" cy="185" r="18" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
                        <!-- 眼睛 -->
                        <circle cx="358" cy="180" r="5" fill="white"/>
                        <circle cx="359" cy="179" r="3" fill="#333"/>
                        <circle cx="360" cy="178" r="1" fill="white"/>
                        <!-- 眉毛 -->
                        <path d="M353 174 Q358 172 363 174" stroke="#666" stroke-width="1.5" fill="none"/>

                        <!-- 喙 - 鹈鹕标志性的大嘴 -->
                        <path d="M365 183 Q390 180 410 185 Q415 188 410 192 Q390 196 365 193 Z" fill="#FFB74D" stroke="#F57C00" stroke-width="1"/>
                        <!-- 喉囊 -->
                        <path d="M365 193 Q380 200 400 198 Q410 196 410 192 Q400 210 380 212 Q365 210 365 193 Z" fill="#FFCC80" stroke="#FFB74D" stroke-width="1"/>
                        <!-- 喙的纹理 -->
                        <line x1="370" y1="187" x2="370" y2="191" stroke="#F57C00" stroke-width="0.5"/>
                        <line x1="380" y1="185" x2="380" y2="193" stroke="#F57C00" stroke-width="0.5"/>
                        <line x1="390" y1="184" x2="390" y2="194" stroke="#F57C00" stroke-width="0.5"/>
                        <line x1="400" y1="185" x2="400" y2="193" stroke="#F57C00" stroke-width="0.5"/>
                        <!-- 喙尖端小钩 -->
                        <path d="M410 185 Q413 187 410 188" stroke="#F57C00" stroke-width="1.5" fill="none"/>

                        <!-- 头顶小羽毛 -->
                        <path d="M345 168 Q347 160 350 165 Q352 158 355 165" stroke="#E0E0E0" stroke-width="2" fill="none"/>
                    </g>
                </g>

                <!-- 小旗子 -->
                <line x1="410" y1="345" x2="410" y2="300" stroke="#795548" stroke-width="2"/>
                <path d="M410 300 L435 308 L410 316 Z" fill="#E53935">
                    <animate attributeName="d" values="M410 300 L435 308 L410 316 Z;M410 300 L432 310 L410 316 Z;M410 300 L435 308 L410 316 Z" dur="0.5s" repeatCount="indefinite"/>
                </path>
            </g>
        </g>

        <!-- 蝴蝶 -->
        <g>
            <path d="M150 300 Q155 295 160 300 Q155 305 150 300" fill="#FF80AB" opacity="0.8">
                <animate attributeName="d" values="M150 300 Q155 295 160 300 Q155 305 150 300;M150 300 Q153 297 158 300 Q153 303 150 300;M150 300 Q155 295 160 300 Q155 305 150 300" dur="0.3s" repeatCount="indefinite"/>
            </path>
            <path d="M150 300 Q145 295 140 300 Q145 305 150 300" fill="#F48FB1" opacity="0.8">
                <animate attributeName="d" values="M150 300 Q145 295 140 300 Q145 305 150 300;M150 300 Q147 297 142 300 Q147 303 150 300;M150 300 Q145 295 140 300 Q145 305 150 300" dur="0.3s" repeatCount="indefinite"/>
            </path>
            <line x1="150" y1="300" x2="150" y2="305" stroke="#333" stroke-width="1">
                <animate attributeName="d" values="M150 300 Q155 295 160 300 Q155 305 150 300;M150 300 Q153 297 158 300 Q153 303 150 300;M150 300 Q155 295 160 300 Q155 305 150 300" dur="0.3s" repeatCount="indefinite"/>
            </line>
            <animateTransform attributeName="transform" type="translate" values="0,0;20,-10;40,0;20,10;0,0" dur="4s" repeatCount="indefinite"/>
        </g>

        <!-- 小花 -->
        <g transform="translate(80, 450)">
            <circle cx="0" cy="0" r="5" fill="#FF80AB"/>
            <circle cx="0" cy="-6" r="4" fill="#FF80AB"/>
            <circle cx="5" cy="-2" r="4" fill="#FF80AB"/>
            <circle cx="3" cy="5" r="4" fill="#FF80AB"/>
            <circle cx="-4" cy="4" r="4" fill="#FF80AB"/>
            <circle cx="-5" cy="-3" r="4" fill="#FF80AB"/>
            <circle cx="0" cy="0" r="3" fill="#FFEB3B"/>
        </g>
        <g transform="translate(700, 455)">
            <circle cx="0" cy="0" r="4" fill="#CE93D8"/>
            <circle cx="0" cy="-5" r="3.5" fill="#CE93D8"/>
            <circle cx="4" cy="-2" r="3.5" fill="#CE93D8"/>
            <circle cx="2.5" cy="4" r="3.5" fill="#CE93D8"/>
            <circle cx="-3.5" cy="3.5" r="3.5" fill="#CE93D8"/>
            <circle cx="-4" cy="-2.5" r="3.5" fill="#CE93D8"/>
            <circle cx="0" cy="0" r="2.5" fill="#FFF176"/>
        </g>
        <g transform="translate(450, 452)">
            <circle cx="0" cy="0" r="4" fill="#81D4FA"/>
            <circle cx="0" cy="-5" r="3.5" fill="#81D4FA"/>
            <circle cx="4" cy="-2" r="3.5" fill="#81D4FA"/>
            <circle cx="2.5" cy="4" r="3.5" fill="#81D4FA"/>
            <circle cx="-3.5" cy="3.5" r="3.5" fill="#81D4FA"/>
            <circle cx="-4" cy="-2.5" r="3.5" fill="#81D4FA"/>
            <circle cx="0" cy="0" r="2.5" fill="#FFF9C4"/>
        </g>
    </svg>
</body>
</html>
