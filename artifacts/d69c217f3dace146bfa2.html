<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6c76b" />
    <title>鹈鹕的海风单车行</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #183c4b;
        --coral: #ee6d54;
        --teal: #1c8c8f;
        --cream: #fff8e9;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 8%, #fff1c9 0 10%, transparent 34%),
          linear-gradient(145deg, #f7c96d, #ec8563 75%);
        font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      .poster {
        position: relative;
        width: min(100vw, 1520px);
        height: min(100vh, 950px);
        overflow: hidden;
        isolation: isolate;
        background: #f7d383;
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: .22;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .title-kicker {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: .22em;
      }

      .title-main {
        font-size: 50px;
        font-weight: 900;
        letter-spacing: .045em;
      }

      .title-sub {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .16em;
      }

      .cloud-a { animation: cloud-drift 30s linear infinite; }
      .cloud-b { animation: cloud-drift 38s -17s linear infinite; }
      .sun-rays { transform-origin: 1178px 137px; animation: slow-spin 28s linear infinite; }
      .sun { animation: sun-glow 4s ease-in-out infinite; transform-origin: 1178px 137px; }
      .wave { animation: wave-shift 5.5s linear infinite; }
      .wave.two { animation-delay: -2.75s; }
      .wave.three { animation-duration: 7s; animation-delay: -4.1s; }
      .road-lines { animation: road-roll 1.1s linear infinite; }
      .grass-a { animation: landscape-roll 10s linear infinite; }
      .grass-b { animation: landscape-roll 15s -5s linear infinite; }
      .bike-shadow { animation: shadow-breathe 1.35s ease-in-out infinite; transform-origin: 710px 740px; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: wheel-spin 1.35s linear infinite; }
      .wheel.front { animation-delay: -.12s; }
      .crank { transform-origin: 707px 639px; animation: wheel-spin 1.35s linear infinite; }
      .pedal-left { transform-origin: 707px 639px; animation: pedal-left 1.35s linear infinite; }
      .pedal-right { transform-origin: 707px 639px; animation: pedal-right 1.35s linear infinite; }
      .pelican-bob { animation: bob 1.35s ease-in-out infinite; }
      .pelican-head { transform-origin: 674px 316px; animation: head-nod 2.7s ease-in-out infinite; }
      .wing { transform-origin: 594px 417px; animation: wing-flap 1.35s ease-in-out infinite; }
      .tail { transform-origin: 539px 496px; animation: tail-wag 1.35s ease-in-out infinite; }
      .leg-a { transform-origin: 655px 535px; animation: leg-a 1.35s ease-in-out infinite; }
      .leg-b { transform-origin: 669px 535px; animation: leg-b 1.35s ease-in-out infinite; }
      .blink { transform-origin: 697px 299px; animation: blink 5.6s step-end infinite; }
      .scarf { transform-origin: 636px 352px; animation: scarf-wave 1.35s ease-in-out infinite; }
      .little-flag { transform-origin: 847px 492px; animation: flag-wave 1s ease-in-out infinite; }
      .sparkle { animation: sparkle 2.2s ease-in-out infinite; }
      .sparkle.delay { animation-delay: -1.1s; }

      @keyframes wheel-spin { to { transform: rotate(360deg); } }
      @keyframes pedal-left { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } }
      @keyframes pedal-right { 0%, 100% { transform: rotate(180deg); } 50% { transform: rotate(360deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes head-nod { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(1.5deg) translate(2px, 3px); } }
      @keyframes wing-flap { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(7deg) translateY(-4px); } }
      @keyframes tail-wag { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(6deg); } }
      @keyframes leg-a { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(12deg); } }
      @keyframes leg-b { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(-9deg); } }
      @keyframes blink { 0%, 92%, 94%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } }
      @keyframes scarf-wave { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(8deg) translateY(-2px); } }
      @keyframes flag-wave { 0%, 100% { transform: skewY(-4deg); } 50% { transform: skewY(9deg); } }
      @keyframes cloud-drift { from { transform: translateX(-100px); } to { transform: translateX(1580px); } }
      @keyframes slow-spin { to { transform: rotate(360deg); } }
      @keyframes sun-glow { 50% { transform: scale(1.04); } }
      @keyframes wave-shift { to { stroke-dashoffset: -160px; } }
      @keyframes road-roll { to { stroke-dashoffset: -88px; } }
      @keyframes landscape-roll { to { transform: translateX(-320px); } }
      @keyframes shadow-breathe { 50% { transform: scaleX(.86); opacity: .55; } }
      @keyframes sparkle { 50% { transform: scale(1.4) rotate(45deg); opacity: .25; } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-play-state: paused !important; }
      }
    </style>
  </head>
