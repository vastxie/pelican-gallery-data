<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1c2c;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", sans-serif;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .spin { animation: spin 0.55s linear infinite; }
    .crank { animation: spin 0.72s linear infinite; }
    .crank-counter { animation: spin 0.72s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bob { animation: bob 0.72s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .head-bob { animation: headBob 0.72s ease-in-out infinite; }
    @keyframes headBob {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    .pouch-wobble {
      transform-origin: 78px 18px;
      animation: pouch 0.72s ease-in-out infinite;
    }
    @keyframes pouch {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.04, 1.1); }
    }

    .tail-wag {
      transform-origin: 20px 18px;
      animation: tail 0.72s ease-in-out infinite;
    }
    @keyframes tail {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }

    .blink { animation: blink 3.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes blink {
      0%, 42%, 48%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(0.08); }
    }

    .cloud-a { animation: drift 48s linear infinite; }
    .cloud-b { animation: drift 36s linear infinite; }
    .cloud-c { animation: drift 28s linear infinite; }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-2400px); }
    }

    .scroll-far { animation: scroll 46s linear infinite; }
    .scroll-mid { animation: scroll 26s linear infinite; }
    .scroll-near { animation: scroll 14s linear infinite; }
    .scroll-road { animation: scroll 5.5s linear infinite; }
    .scroll-grass { animation: scroll 4.2s linear infinite; }
    .scroll-fg { animation: scroll 3.4s linear infinite; }
    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-1200px); }
    }

    .sun-glow { animation: pulse 6s ease-in-out infinite; transform-origin: 160px 88px; }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.06); }
    }
    .sun-rays { animation: spin 36s linear infinite; transform-origin: 160px 88px; }

    .streamer-l { animation: stream 0.5s ease-in-out infinite; transform-origin: 0px 0px; }
    .streamer-r { animation: stream 0.55s ease-in-out infinite 0.12s; transform-origin: 0px 0px; }
    @keyframes stream {
      0%, 100% { transform: rotate(-8deg) skewX(-8deg); }
      50% { transform: rotate(10deg) skewX(6deg); }
    }

    .fish-peek { animation: peek 4.8s ease-in-out infinite; }
    @keyframes peek {
      0%, 62%, 100% { transform: translate(4px, 10px) rotate(-12deg); }
      70%, 82% { transform: translate(-2px, -6px) rotate(8deg); }
    }

    .dust { animation: dust 0.72s ease-out infinite; }
    @keyframes dust {
      0% { opacity: 0.35; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50px, -8px) scale(1.6); }
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      fill: #1d3557;
      letter-spacing: 4px;
    }
    .subtitle {
      font-size: 13px;
      fill: #457b9d;
      letter-spacing: 6px;
    }
  </style>
</head>

        <circle cx="18" cy="-14" r="2" fill="#fff3b0" />
        <!-- streamers -->
        <g transform="translate(50 14)">
          <g class="streamer-l">
            <path d="M0 0 C18 4 22 16 40 10" fill="none" stroke="#E63946" stroke-width="3" stroke-linecap="round" />
            <path d="M0 2 C16 10 26 8 38 18" fill="none" stroke="#FFD166" stroke-width="3" stroke-linecap="round" />
          </g>
          <g class="streamer-r">
            <path d="M0 1 C14 8 20 20 36 14" fill="none" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round" />
            <path d="M0 3 C12 14 28 12 34 22" fill="none" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round" />
          </g>
        </g>
      </g>

      <!-- PELICAN -->
      <g filter="url(#soft)">
        <!-- tail -->
        <g class="tail-wag" transform="translate(8 70)">
          <path d="M20 18 C-8 8 -22 22 -18 38 C-4 42 16 36 24 28 Z" fill="#F2EBDD" stroke="#D9CDB8" stroke-width="1.5" />
          <path d="M16 20 C0 16 -6 26 2 34" fill="none" stroke="#C4B49A" stroke-width="1.2" />
        </g>

        <!-- body -->
        <ellipse cx="92" cy="92" rx="62" ry="44" fill="url(#bodyGrad)" />
        <ellipse cx="108" cy="100" rx="28" ry="18" fill="#F8E7C0" opacity="0.7" />
        <!-- wing shoulder -->
        <path d="M70 78 C88 58 130 62 148 86 C132 78 96 76 70 90 Z" fill="#FFFEFB" stroke="#E4D8C4" stroke-width="1" />
        <!-- black flight feathers folded -->
        <path d="M60 96 C52 110 58 128 86 132 C70 118 62 108 68 96 Z" fill="#243044" />
        <path d="M68 100 C64 114 74 128 94 130" fill="none" stroke="#1A2332" stroke-width="1.2" />

        <!-- S-shaped neck -->
        <path d="M132 78 C150 70 154 48 140 34 C128 22 148 8 172 18 C186 24 194 38 190 50" fill="none" stroke="#EFE6D6" stroke-width="26" stroke-linecap="round" />
        <path d="M132 78 C150 70 154 48 140 34 C128 22 148 8 172 18 C186 24 194 38 190 50" fill="none" stroke="url(#bodyGrad)" stroke-width="22" stroke-linecap="round" />

        <!-- HEAD + BEAK -->
        <g class="head-bob" transform="translate(168 8)">

          <g class="pouch-wobble">
            <path d="M78 28 C92 58 138 72 168 48 C150 70 96 78 70 42 Z" fill="url(#pouchGrad)" stroke="#D9924A" stroke-width="1.4" />
            <path d="M88 40 C108 58 140 58 156 44" fill="none" stroke="#E8B56A" stroke-width="1.2" opacity="0.7" />
            <!-- tiny fish peeking from pouch -->
            <g class="fish-peek" transform="translate(118 48)">
              <ellipse cx="0" cy="0" rx="10" ry="5" fill="#3D8BFF" />
              <polygon points="10,0 16,-4 16,4" fill="#3D8BFF" />
              <circle cx="-3" cy="-1" r="1.3" fill="#fff" />
              <circle cx="-3.3" cy="-1" r="0.6" fill="#123" />
            </g>
          </g>

          <!-- upper mandible -->
          <path d="M72 22 C110 8 150 12 188 28 C168 38 120 40 78 34 Z" fill="url(#beakGrad)" stroke="#D97830" stroke-width="1.5" />
          <path d="M80 26 C120 16 158 20 182 30" fill="none" stroke="#FFE2A8" stroke-width="2" opacity="0.7" />
          <!-- hooked tip -->
          <path d="M188 28 C196 30 198 36 190 38 C186 34 186 30 188 28 Z" fill="#C45C22" />
          <!-- nostril -->
          <ellipse cx="92" cy="26" rx="4" ry="2.2" fill="#C45C22" opacity="0.7" />

          <!-- head -->
          <ellipse cx="64" cy="28" rx="28" ry="24" fill="#FFFEFB" stroke="#E4D8C4" stroke-width="1" />
          <ellipse cx="58" cy="22" rx="12" ry="8" fill="#fff" opacity="0.8" />
          <!-- eye -->
          <g class="blink">
            <ellipse cx="78" cy="24" rx="7.5" ry="7.5" fill="#fff" />
            <circle cx="80" cy="25" r="4.4" fill="#1A2332" />
            <circle cx="81.5" cy="23.5" r="1.5" fill="#fff" />
            <path d="M70 20 Q78 16 86 20" fill="none" stroke="#1A2332" stroke-width="1.6" stroke-linecap="round" />
          </g>
          <!-- cheek blush -->
          <ellipse cx="58" cy="36" rx="7" ry="4" fill="#F2B8A0" opacity="0.55" />
        </g>

        <!-- near wing as arm on handlebar -->
        <g transform="translate(120 88)">
          <path d="M0 8 C28 4 70 18 118 -8 C90 8 48 28 8 22 Z" fill="#FFFEFB" stroke="#D9CDB8" stroke-width="1.4" />
          <path d="M18 16 C48 22 88 8 116 -4" fill="none" stroke="#E6D8C4" stroke-width="1.2" />

          <path d="M112 0 C122 -8 132 2 126 8" fill="none" stroke="#1A2332" stroke-width="1" />
        </g>
      </g>

      <!-- NEAR leg -->
      <g transform="translate(148 112)">
        <path d="M0 0 Q -6 42 8 78" fill="none" stroke="#F4A07A" stroke-width="10" stroke-linecap="round">
          <animate attributeName="d" dur="0.72s" repeatCount="indefinite"

      <!-- crank + pedals + webbed feet -->
      <g transform="translate(148 168)">
        <g class="crank">
          <!-- crank arms -->
          <line x1="0" y1="-28" x2="0" y2="28" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" />
          <!-- far pedal (top at t=0, since line goes -28) -->
          <g transform="translate(0 -28)">
            <g class="crank-counter">
              <rect x="-12" y="-4" width="24" height="7" rx="2" fill="#333" />
              <!-- far foot -->
              <g transform="translate(2 2)">
                <ellipse cx="0" cy="0" rx="11" ry="6" fill="#E08B6A" />
                <path d="M6 -2 q8 -6 12 0 q-4 6 -12 4z" fill="#D47B5C" />
              </g>
            </g>
          </g>
          <!-- near pedal -->
          <g transform="translate(0 28)">
            <g class="crank-counter">
              <rect x="-12" y="-4" width="24" height="7" rx="2" fill="#1a1a1a" />
              <g transform="translate(2 2)">
                <ellipse cx="0" cy="0" rx="12" ry="7" fill="#F4A07A" />
                <path d="M6 -2 q9 -7 14 0 q-5 7 -14 5z" fill="#E08B6A" />
                <path d="M8 -1 q4 -3 7 0" fill="none" stroke="#C66A4A" stroke-width="0.8" />
              </g>
            </g>
          </g>
        </g>
      </g>

      <!-- front wheel (in front of near foot slightly overlapping) -->
      <g transform="translate(292 180)">
        <g class="spin">
          <circle r="54" fill="#1F1F1F" />
          <circle r="46" fill="#EDE6DA" />
          <circle r="42" fill="none" stroke="#C8BFAF" stroke-width="2" />
          <g stroke="#8A8378" stroke-width="1.6">
            <line y1="-42" y2="42" />
            <line x1="-42" x2="42" />
            <line x1="-30" y1="-30" x2="30" y2="30" />
            <line x1="30" y1="-30" x2="-30" y2="30" />
            <line x1="-15" y1="-39" x2="15" y2="39" />
            <line x1="15" y1="-39" x2="-15" y2="39" />
            <line x1="-39" y1="-15" x2="39" y2="15" />
            <line x1="39" y1="-15" x2="-39" y2="15" />
          </g>
          <circle r="10" fill="#C1121F" />
          <circle r="4" fill="#F1E9DC" />
        </g>
        <circle r="54" fill="none" stroke="#2A2A2A" stroke-width="6" />
        <circle r="54" fill="none" stroke="#4A4541" stroke-width="2" />
      </g>
    </g>
