<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Pedal</title>
  <style>
    :root {
      color-scheme: light;
      --sky: #79c7ef;
      --water: #1f9eb3;
      --road: #4a5260;
      --ink: #253140;
      --cream: #fff3d4;
      --white: #fffaf0;
      --orange: #f09a3e;
      --coral: #ee6e58;
      --blue: #387ec8;
      --green: #4e9d65;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0f1825;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      width: min(100vw, 1400px);
      height: min(100vh, 840px);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,.22), transparent 30%),
        linear-gradient(180deg, #0f1825, #1f3545);
    }

    svg {
      width: min(100vw, calc(100vh * 1.6667));
      height: auto;
      max-height: 100vh;
      display: block;
      filter: drop-shadow(0 28px 34px rgba(0,0,0,.28));
    }

    .cloud-a { animation: cloudDrift 24s linear infinite; }
    .cloud-b { animation: cloudDrift 32s linear infinite reverse; }
    .cloud-c { animation: cloudDriftSmall 18s linear infinite; }
    .road-lines { animation: roadSlide .85s linear infinite; }
    .water-line { animation: waveSlide 2s linear infinite; }
    .bird-body { animation: rideBob .72s ease-in-out infinite; }
    .head { animation: headNod .72s ease-in-out infinite; transform-box: fill-box; transform-origin: 35% 80%; }
    .wing { animation: wingFlap .72s ease-in-out infinite; transform-box: fill-box; transform-origin: 18% 38%; }
    .tail { animation: tailFlick .72s ease-in-out infinite; transform-box: fill-box; transform-origin: 12% 50%; }
    .leg-front { animation: legFront .9s linear infinite; transform-box: fill-box; transform-origin: 18% 9%; }
    .leg-back { animation: legBack .9s linear infinite; transform-box: fill-box; transform-origin: 85% 9%; }
    .shadow { animation: shadowPulse .72s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .hat { animation: capTilt .72s ease-in-out infinite; transform-box: fill-box; transform-origin: 42% 92%; }

    @keyframes cloudDrift {
      from { transform: translateX(-150px); }
      to { transform: translateX(150px); }
    }

    @keyframes cloudDriftSmall {
      from { transform: translateX(130px); }
      to { transform: translateX(-130px); }
    }

    @keyframes roadSlide {
      from { transform: translateX(0); }
      to { transform: translateX(-120px); }
    }

    @keyframes waveSlide {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -80; }
    }

    @keyframes rideBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes headNod {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-5deg); }
    }

    @keyframes wingFlap {
      0%, 100% { transform: rotate(5deg) translateY(0); }
      50% { transform: rotate(-12deg) translateY(5px); }
    }

    @keyframes tailFlick {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes legFront {
      0% { transform: rotate(23deg); }
      25% { transform: rotate(-4deg); }
      50% { transform: rotate(-25deg); }
      75% { transform: rotate(4deg); }
      100% { transform: rotate(23deg); }
    }

    @keyframes legBack {
      0% { transform: rotate(-24deg); }
      25% { transform: rotate(4deg); }
      50% { transform: rotate(24deg); }
      75% { transform: rotate(-5deg); }
      100% { transform: rotate(-24deg); }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: .24; }
      50% { transform: scaleX(.86); opacity: .16; }
    }

    @keyframes capTilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
