<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(#dff1fb, #f6fbff);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #35506b;
    letter-spacing: 2px;
    margin: 18px 0 6px;
  }
  .stage {
    width: min(92vw, 880px);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(53, 80, 107, .18);
    background: #fff;
  }
  svg { display: block; width: 100%; height: auto; }

  /* 云朵整体平移一整个周期宽度(960)，组内放两份实现无缝循环 */
  .cloud-belt-a { animation: drift 30s linear infinite; }
  .cloud-belt-b { animation: drift 46s linear infinite; }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-960px); }
  }

  /* 路面虚线滚动：一个虚线周期 80px */
  .lane-dashes {
    stroke-dasharray: 46 34;
    animation: roll .24s linear infinite;
  }
  @keyframes roll {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 80; }
  }

  /* 身后的速度线 */
  .speed { animation: whoosh 1.1s linear infinite; opacity: 0; }
  .speed.s2 { animation-delay: .35s; }
  .speed.s3 { animation-delay: .7s; }
  @keyframes whoosh {
    0%   { transform: translateX(46px);  opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translateX(-70px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cloud-belt-a, .cloud-belt-b, .lane-dashes, .speed { animation: none; }
  }
</style>
</head>
<body>
<div>
  <h1>鹈鹕骑自行车</h1>
  <div class="stage">
    <svg viewBox="0 0 800 500" role="img" aria-label="一只鹈鹕骑着蓝色自行车的二维动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8ecdf0"/>
          <stop offset="1" stop-color="#d9f0fb"/>
        </linearGradient>
        <radialGradient id="sunGlow" r="0.5">
          <stop offset="0" stop-color="#ffe9a3"/>
          <stop offset="1" stop-color="#ffd24d"/>
        </radialGradient>
        <g id="cloud">
          <ellipse cx="0" cy="0" rx="42" ry="17" fill="#ffffff"/>
          <ellipse cx="-26" cy="7" rx="26" ry="12" fill="#ffffff"/>
          <ellipse cx="28" cy="6" rx="30" ry="13" fill="#ffffff"/>
        </g>
        <g id="wheel">
          <circle r="52" fill="none" stroke="#2d3436" stroke-width="9"/>
          <circle r="46" fill="none" stroke="#95a5a6" stroke-width="3"/>
          <g stroke="#95a5a6" stroke-width="3">
            <line x1="-46" y1="0" x2="46" y2="0"/>
            <line x1="0" y1="-46" x2="0" y2="46"/>
            <line x1="-33" y1="-33" x2="33" y2="33"/>
            <line x1="-33" y1="33" x2="33" y2="-33"/>
            <animateTransform attributeName="transform" type="rotate"
              from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
          </g>
          <circle r="6" fill="#2d3436"/>
        </g>
      </defs>

      <!-- ======================= 背景 ======================= -->
      <rect width="800" height="500" fill="url(#sky)"/>

      <g transform="translate(690 82)">
        <circle r="34" fill="url(#sunGlow)"/>
        <g stroke="#ffd24d" stroke-width="5" stroke-linecap="round">
          <line x1="0" y1="-46" x2="0" y2="-58"/>
          <line x1="0" y1="46"  x2="0" y2="58"/>
          <line x1="-46" y1="0" x2="-58" y2="0"/>
          <line x1="46"  y1="0" x2="58"  y2="0"/>
          <line x1="-33" y1="-33" x2="-41" y2="-41"/>
          <line x1="33"  y1="-33" x2="41"  y2="-41"/>
          <line x1="-33" y1="33"  x2="-41" y2="41"/>
          <line x1="33"  y1="33"  x2="41"  y2="41"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="360" dur="36s" repeatCount="indefinite"/>
        </g>
      </g>

      <g class="cloud-belt-a">
        <use href="#cloud" x="140" y="90"/>
        <use href="#cloud" x="520" y="60" transform="scale(1)"/>
        <use href="#cloud" x="1100" y="90"/>
        <use href="#cloud" x="1480" y="60"/>
      </g>
      <g class="cloud-belt-b" opacity="0.75">
        <use href="#cloud" x="330" y="150" transform="scale(.7)"/>
        <use href="#cloud" x="760" y="120" transform="scale(.7)"/>
        <use href="#cloud" x="1290" y="150" transform="scale(.7)"/>
        <use href="#cloud" x="1720" y="120" transform="scale(.7)"/>
      </g>

      <!-- 远处山丘与草地 -->
      <ellipse cx="160" cy="446" rx="330" ry="70" fill="#a8d08d"/>
      <ellipse cx="640" cy="452" rx="380" ry="78" fill="#93c47d"/>
      <rect x="0" y="418" width="800" height="16" fill="#7fb069"/>

      <!-- 路面 -->
      <rect x="0" y="430" width="800" height="70" fill="#5f6b7a"/>
      <line class="lane-dashes" x1="-40" y1="466" x2="840" y2="466"
        stroke="#f2f4f6" stroke-width="6"/>

      <!-- 速度线 -->
      <g stroke="#9fc9e8" stroke-width="5" stroke-linecap="round">
        <line class="speed s1" x1="130" y1="250" x2="190" y2="250"/>
        <line class="speed s2" x1="110" y1="300" x2="180" y2="300"/>
        <line class="speed s3" x1="140" y1="350" x2="200" y2="350"/>
      </g>

      <!-- =================== 远侧腿（车架后面）=================== -->
      <path id="legFar" fill="none" stroke="#d98e04" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" d=""/>
      <g id="footFar">
        <rect x="-14" y="3" width="28" height="6" rx="3" fill="#4a4a4a"/>
        <path d="M -9 -2 L 16 -3 L 21 4 L -9 3 Z" fill="#d98e04"/>
      </g>

      <!-- ======================= 自行车 ======================= -->
      <use href="#wheel" x="300" y="378"/>
      <use href="#wheel" x="520" y="378"/>

      <!-- 链条与车架 -->
      <g stroke="#2d3436" stroke-width="4" fill="none">
        <line x1="392" y1="363" x2="301" y2="370"/>
        <line x1="392" y1="393" x2="301" y2="386"/>
        <circle cx="300" cy="378" r="9"/>
      </g>
      <g stroke="#2e86de" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M 300 378 L 340 274 L 492 268 L 392 378 L 300 378"/>
        <line x1="340" y1="274" x2="392" y2="378"/>
        <line x1="492" y1="268" x2="520" y2="378"/>
        <line x1="492" y1="268" x2="481" y2="236"/>
      </g>
      <!-- 车把 -->
      <path d="M 481 236 Q 470 228 458 232" fill="none"
        stroke="#2d3436" stroke-width="8" stroke-linecap="round"/>
      <!-- 车座 -->
      <line x1="340" y1="274" x2="336" y2="266" stroke="#2e86de" stroke-width="8"/>
      <rect x="311" y="256" width="52" height="11" rx="5.5" fill="#2d3436"/>
      <!-- 牙盘与曲柄（曲柄由 JS 旋转） -->
      <circle cx="392" cy="378" r="17" fill="none" stroke="#2d3436" stroke-width="5"/>
      <g id="crank" stroke="#2d3436" stroke-width="6" stroke-linecap="round">
        <line x1="358" y1="378" x2="426" y2="378"/>
      </g>
      <circle cx="392" cy="378" r="6" fill="#2d3436"/>

      <!-- ======================= 鹈鹕 ======================= -->
      <g id="pelican">
        <!-- 尾羽 -->
        <path d="M 288 196 L 246 166 L 272 198 L 240 188 L 272 210 L 248 214 L 282 220 Z"
          fill="#fdfdf8" stroke="#cfc9b8" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- 身体 -->
        <ellipse cx="330" cy="218" rx="60" ry="45" fill="#fdfdf8"
          stroke="#cfc9b8" stroke-width="3" transform="rotate(-12 330 218)"/>
        <!-- 脖子 + 头（整体轻微点头） -->
        <g>
          <path d="M 366 202 C 402 198 420 180 424 148" fill="none"
            stroke="#cfc9b8" stroke-width="25" stroke-linecap="round"/>
          <path d="M 366 202 C 402 198 420 180 424 148" fill="none"
            stroke="#fdfdf8" stroke-width="19" stroke-linecap="round"/>
          <circle cx="426" cy="138" r="18" fill="#fdfdf8" stroke="#cfc9b8" stroke-width="3"/>
          <!-- 小头盔 -->
          <path d="M 406 131 A 20 19 0 0 1 445 125 L 446 131 Q 425 116 407 137 Z"
            fill="#e74c3c" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/>
          <!-- 大嘴与喉囊 -->
          <path d="M 436 141 L 556 144 C 516 172 458 178 436 141 Z"
            fill="#f7b955" stroke="#d68910" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 434 129 L 556 143 L 436 143 Z"
            fill="#f6a72c" stroke="#d68910" stroke-width="2.5" stroke-linejoin="round"/>
          <line x1="447" y1="134" x2="520" y2="140" stroke="#d68910" stroke-width="2"/>
          <!-- 眼睛 -->
          <circle cx="434" cy="126" r="4" fill="#2d3436"/>
          <circle cx="435.5" cy="124.5" r="1.3" fill="#ffffff"/>
          <animateTransform attributeName="transform" type="rotate"
            values="0 366 202; 2.5 366 202; 0 366 202; -1.5 366 202; 0 366 202"
            dur="2.2s" repeatCount="indefinite"/>
        </g>
        <!-- 翅膀（扶把 + 轻拍） -->
        <g>
          <path d="M 352 196 C 328 188 298 194 284 216 C 300 234 338 236 360 220 C 364 210 360 202 352 196 Z"
            fill="#f0ece0" stroke="#cfc9b8" stroke-width="3" stroke-linejoin="round"/>
          <path d="M 344 204 C 326 202 308 208 298 218" fill="none"
            stroke="#cfc9b8" stroke-width="2.5"/>
          <animateTransform attributeName="transform" type="rotate"
            values="-5 352 196; 6 352 196; -5 352 196" dur="0.9s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- =================== 近侧腿（最上层）=================== -->
      <path id="legNear" fill="none" stroke="#f4a300" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round" d=""/>
      <g id="footNear">
        <rect x="-14" y="3" width="28" height="6" rx="3" fill="#2d3436"/>
        <path d="M -9 -3 L 17 -4 L 23 4 L -9 4 Z" fill="#f4a300" stroke="#d68910" stroke-width="1.5"/>
      </g>
    </svg>
  </div>
</div>

<script>
  // 蹬踏动画：脚固定在踏板上，用双骨骼反向运动学求膝盖位置
  const BB   = { x: 392, y: 378 };   // 五通（曲柄中心）
  const R    = 34;                   // 曲柄长度
  const HIP  = { x: 338, y: 262 };   // 髋关节（坐垫下方）
  const L1   = 88, L2 = 92;          // 大腿 / 小腿长度

  const crank   = document.getElementById('crank');
  const pelican = document.getElementById('pelican');
  const legs = [
    { phase: Math.PI, leg: document.getElementById('legFar'),  foot: document.getElementById('footFar')  },
    { phase: 0,       leg: document.getElementById('legNear'), foot: document.getElementById('footNear') },
  ];

  function knee(hip, foot) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(L1 - L2) + 0.5, Math.min(L1 + L2 - 0.5, d));
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const ux = dx / d, uy = dy / d;
    // 取膝盖朝前（车头方向）的解
    return { x: hip.x + a * ux + h * uy, y: hip.y + a * uy - h * ux };
  }

  function render(t) {
    const theta = t / 1000 * Math.PI * 2 / 1.1;      // 与车轮同步：1.1 秒一圈
    const bob = 2 * Math.sin(theta * 2);             // 身体随蹬踏轻微起伏
    pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    crank.setAttribute('transform',
      `rotate(${(theta * 180 / Math.PI).toFixed(2)} ${BB.x} ${BB.y})`);

    const hip = { x: HIP.x, y: HIP.y + bob };
    for (const { phase, leg, foot } of legs) {
      const a = theta + phase;
      const f = { x: BB.x + R * Math.cos(a), y: BB.y + R * Math.sin(a) };
      const k = knee(hip, f);
      leg.setAttribute('d',
        `M ${hip.x.toFixed(1)} ${hip.y.toFixed(1)} L ${k.x.toFixed(1)} ${k.y.toFixed(1)} L ${f.x.toFixed(1)} ${f.y.toFixed(1)}`);
      foot.setAttribute('transform', `translate(${f.x.toFixed(1)} ${f.y.toFixed(1)})`);
    }
  }

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) {
    render(180); // 静态定格一帧
  } else {
    (function loop(t) { render(t); requestAnimationFrame(loop); })(0);
  }
</script>
</body>
</html>
