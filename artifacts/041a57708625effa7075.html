<!DOCTYPE html>

<meta charset="UTF-8">

<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #67c4ea;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
  }
  svg {
    width: min(100vw, 100vh * 960 / 540);
    height: auto;
    display: block;
    cursor: pointer;
    user-select: none;
  }
  #sun-rays {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 36s linear infinite;
  }
  #eyelid {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.4s infinite;
  }
  #fish-snack {
    transform-box: fill-box;
    transform-origin: 10% 50%;
    animation: wiggle 0.55s ease-in-out infinite;
  }
  #basket-fish {
    transform-box: fill-box;
    transform-origin: 40% 50%;
    animation: wiggle 1.1s ease-in-out infinite;
  }
  #pouch {
    transform-box: fill-box;
    transform-origin: 20% 15%;
    animation: pouch 0.96s ease-in-out infinite;
  }
  svg.paused, svg.paused * {
    animation-play-state: paused !important;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink {
    0%, 86%, 100% { transform: scaleY(0.05); opacity: 0; }
    90%, 96% { opacity: 1; transform: scaleY(1); }
    93% { opacity: 1; transform: scaleY(0.15); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(9deg); }
  }
  @keyframes pouch {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.015, 1.04); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>

  const CRANK_R = 28;
  const WHEEL_R = 76;
  const GEAR = 2.35;
  const SPEED = 190;
  const LEG = 90;
  const hips = {
    far: { x: 328, y: 280, phase: 0, bend: -1 },
    near: { x: 342, y: 288, phase: Math.PI, bend: -1 }
  };

  const $ = (id) => document.getElementById(id);
  const spokesRear = $("spokes-rear");
  const spokesFront = $("spokes-front");
  const crankFar = $("crank-far");
  const crankNear = $("crank-near");
  const chainring = $("chainring");
  const clouds = $("clouds");
  const hillsFar = $("hills-far");
  const hillsNear = $("hills-near");
  const props = $("props");
  const dashes = $("dashes");
  const rig = $("rig");
  const head = $("head");
  const wing = $("wing");
  const shadow = $("shadow");
  const scene = $("scene");

  function makeSpokes(g) {
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const line = document.createElementNS(NS, "line");
      line.setAttribute("x1", (Math.cos(a) * 14).toFixed(2));
      line.setAttribute("y1", (Math.sin(a) * 14).toFixed(2));
      line.setAttribute("x2", (Math.cos(a) * 54).toFixed(2));
      line.setAttribute("y2", (Math.sin(a) * 54).toFixed(2));
      line.setAttribute("stroke", "#eef3f7");
      line.setAttribute("stroke-width", "3");
      line.setAttribute("stroke-linecap", "round");
      g.appendChild(line);
    }
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", "46");
    dot.setAttribute("cy", "0");
    dot.setAttribute("r", "4.5");
    dot.setAttribute("fill", "#ef233c");
    dot.setAttribute("stroke", "#9b1c2c");
    dot.setAttribute("stroke-width", "1");
    g.appendChild(dot);
  }
  makeSpokes(spokesRear);
  makeSpokes(spokesFront);

  for (const x of [0, 2100]) {
    const u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#prop-tile");
    u.setAttribute("x", x);
    props.appendChild(u);
  }
  for (let x = 20; x < 4200; x += 150) {
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x);
    r.setAttribute("y", "504");
    r.setAttribute("width", "54");
    r.setAttribute("height", "8");
    r.setAttribute("rx", "3");
    r.setAttribute("fill", "#f8fafc");
    r.setAttribute("opacity", "0.9");
    dashes.appendChild(r);
  }

  function kneePoint(hip, foot, l1, l2, bend) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const reach = l1 + l2;
    const ang = Math.atan2(dy, dx);
    const d = Math.min(Math.max(dist, Math.abs(l1 - l2) + 0.5), reach - 0.5);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const turn = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const dir = ang + bend * turn;
    return {
      x: hip.x + Math.cos(dir) * l1,
      y: hip.y + Math.sin(dir) * l1
    };
  }

  function setLeg(name, hip, foot) {
    const knee = kneePoint(hip, foot, LEG, LEG, hip.bend);
    const pts = hip.x.toFixed(1) + "," + hip.y.toFixed(1) + " " +
      knee.x.toFixed(1) + "," + knee.y.toFixed(1) + " " +
      foot.x.toFixed(1) + "," + foot.y.toFixed(1);
    $(name === "far" ? "leg-far-out" : "leg-near-out").setAttribute("points", pts);
    $(name === "far" ? "leg-far" : "leg-near").setAttribute("points", pts);
    const dot = $(name === "far" ? "knee-far" : "knee-near");
    dot.setAttribute("cx", knee.x.toFixed(1));
    dot.setAttribute("cy", knee.y.toFixed(1));
    $(name === "far" ? "foot-far" : "foot-near").setAttribute("transform", "translate(" + foot.x.toFixed(1) + "," + foot.y.toFixed(1) + ")");
    $(name === "far" ? "pedal-far" : "pedal-near").setAttribute("transform", "translate(" + foot.x.toFixed(1) + "," + foot.y.toFixed(1) + ")");
  }

  let dist = 0;
  let last = performance.now();
  let running = true;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function frame(now) {
    const dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    if (!reduce && running) dist += SPEED * dt;

    const wheelAng = dist / WHEEL_R;
    const wheelDeg = wheelAng * 180 / Math.PI;
    const crankAng = wheelAng * GEAR;
    const crankDeg = crankAng * 180 / Math.PI;

    spokesRear.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
    spokesFront.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + ")");
    chainring.setAttribute("transform", "rotate(" + crankDeg.toFixed(2) + ")");
    crankFar.setAttribute("transform", "rotate(" + crankDeg.toFixed(2) + ")");
    crankNear.setAttribute("transform", "rotate(" + (crankDeg + 180).toFixed(2) + ")");

    for (const name of ["far", "near"]) {
      const hip = hips[name];
      const a = crankAng + hip.phase;
      setLeg(name, hip, {
        x: BB.x + Math.cos(a) * CRANK_R,
        y: BB.y + Math.sin(a) * CRANK_R
      });
    }

    const bob = Math.sin(crankAng * 2) * 2.2;
    rig.setAttribute("transform", "translate(0," + bob.toFixed(2) + ")");
    head.setAttribute("transform", "rotate(" + (Math.sin(crankAng) * 3.2).toFixed(2) + ",448,208)");
    wing.setAttribute("transform", "rotate(" + (Math.sin(crankAng * 2) * 11).toFixed(2) + ",390,240)");
    const squash = 1 + Math.sin(crankAng * 2) * 0.04;
    shadow.setAttribute("transform", "translate(400,486) scale(" + (1 / squash).toFixed(3) + "," + squash.toFixed(3) + ")");
    shadow.setAttribute("cx", "0");
    shadow.setAttribute("cy", "0");

    clouds.setAttribute("transform", "translate(" + (-(dist * 0.12) % 960).toFixed(1) + ",0)");
    hillsFar.setAttribute("transform", "translate(" + (-(dist * 0.28) % 1200).toFixed(1) + ",0)");
    hillsNear.setAttribute("transform", "translate(" + (-(dist * 0.48) % 1200).toFixed(1) + ",0)");
    const ground = -(dist % 2100);
    props.setAttribute("transform", "translate(" + ground.toFixed(1) + ",0)");
    dashes.setAttribute("transform", "translate(" + ground.toFixed(1) + ",0)");

    if (running && !reduce) requestAnimationFrame(frame);
  }

  // The sailboat lives in the far-hill layer so it drifts with the shore.
  scene.addEventListener("click", () => {
    running = !running;
    scene.classList.toggle("paused", !running);
    if (running) {
      last = performance.now();
      requestAnimationFrame(frame);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && running && !reduce) {
      last = performance.now();
      requestAnimationFrame(frame);
    }
  });

  last = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
