<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e9">
  <title>鹈鹕骑行记 · SVG 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173a42;
      --paper: #f7f3e9;
      --teal: #a8d9cf;
      --coral: #ee795e;
      --yellow: #f3c968;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 28%, #fffdf7 0, var(--paper) 72%);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
    }
    .scene-card {
      width: min(100%, 1040px);
      overflow: hidden;
      border: 1px solid rgba(23,58,66,.09);
      border-radius: 28px;
      background: #e5f2e9;
      box-shadow: 0 24px 70px rgba(30,67,66,.13), 0 3px 10px rgba(30,67,66,.06);
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 28px 13px;
    }
    .eyebrow { margin: 0 0 5px; color: #63877d; font-size: 11px; font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 29px); line-height: 1.1; letter-spacing: -.04em; }
    .badge { flex: none; padding: 8px 12px; border: 1px solid #c8ddd2; border-radius: 999px; color: #55796f; background: rgba(255,255,255,.58); font-size: 12px; font-weight: 700; }
    .art { display: block; width: 100%; height: auto; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px 19px;
      background: rgba(255,255,255,.58);
    }
    .caption { margin: 0; color: #55766f; font-size: 13px; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      color: white;
      background: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }
    button:hover { transform: translateY(-2px); background: #28535a; }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }
    @keyframes wheel { to { transform: rotate(360deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-5px) rotate(1deg); } }
    @keyframes wing { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-860px); } }
    @keyframes dash { to { stroke-dashoffset: -180; } }
    .wheel { transform-box: fill-box; transform-origin: center; animation: wheel 2.1s linear infinite; }
    .crank { transform-box: fill-box; transform-origin: center; animation: pedal 1.1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 50% 100%; animation: bob .9s ease-in-out infinite; }
    .wing { transform-box: fill-box; transform-origin: 20% 70%; animation: wing 1.7s ease-in-out infinite; }
    .cloud-track { animation: drift 28s linear infinite; }
    .road-dash { animation: dash 1.3s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 560px) {
      body { padding: 12px; }
      .scene-card { border-radius: 20px; }
      .topline { padding: 18px 18px 10px; }
      .controls { padding: 13px 16px 16px; }
      .caption { max-width: 58%; font-size: 11px; }
      .badge { font-size: 10px; padding: 7px 9px; }
    }
  </style>
</head>
<body>
  <main class="scene-card" id="scene">
    <header class="topline">
      <div><p class="eyebrow">A LITTLE SVG ADVENTURE</p><h1>鹈鹕骑行记</h1></div>
      <span class="badge">矢量绘制 · 轻快动画</span>
    </header>
    <svg class="art" viewBox="0 0 1000 620" role="img" aria-labelledby="svg-title svg-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title">一只鹈鹕骑着自行车</title>
      <desc id="svg-desc">圆润的鹈鹕骑着绿色自行车，车轮转动，云朵和路面向后移动。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c5e7df"/><stop offset="1" stop-color="#eaf1d6"/></linearGradient>
        <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#9dc9a9"/><stop offset="1" stop-color="#84b69a"/></linearGradient>
        <filter id="softShadow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
      </defs>
      <rect width="1000" height="620" fill="url(#sky)"/>
      <circle cx="831" cy="111" r="48" fill="#f8d885" opacity=".9"/>
      <g fill="#fffdf5" opacity=".83" class="cloud-track">
        <g transform="translate(0 0)"><path d="M94 139c0-16 13-29 29-29 7-19 26-31 47-27 18 3 31 17 34 34 14 0 26 10 26 23H98c-2 0-4 0-4-1Z"/><path d="M570 91c0-12 10-22 22-22 6-15 21-24 37-21 14 2 24 13 26 26 11 0 20 8 20 18H573c-2 0-3 0-3-1Z"/></g>
        <g transform="translate(860 0)"><path d="M94 139c0-16 13-29 29-29 7-19 26-31 47-27 18 3 31 17 34 34 14 0 26 10 26 23H98c-2 0-4 0-4-1Z"/><path d="M570 91c0-12 10-22 22-22 6-15 21-24 37-21 14 2 24 13 26 26 11 0 20 8 20 18H573c-2 0-3 0-3-1Z"/></g>
      </g>
      <path d="M0 325c125-70 235-51 345 4 105 52 208 47 318-8 124-62 220-55 337 17v140H0Z" fill="url(#hill)"/>
      <path d="M0 379c149-46 260-14 375 24 117 39 233 17 333-20 116-43 191-31 292 9v100H0Z" fill="#b8d5a9" opacity=".72"/>
      <path d="M0 481h1000v139H0z" fill="#e9d9ae"/>
      <path d="M0 492h1000" stroke="#fff4d8" stroke-width="4" opacity=".8"/>
      <path d="M0 580h1000" stroke="#c6b890" stroke-width="3" opacity=".52"/>
      <path class="road-dash" d="M-80 551h1120" stroke="#fffaf0" stroke-width="8" stroke-linecap="round" stroke-dasharray="44 58"/>
      <ellipse cx="510" cy="505" rx="279" ry="20" fill="#355c51" opacity=".18" filter="url(#softShadow)"/>

      <!-- Bicycle wheels -->
      <g fill="none" stroke="#173a42" stroke-width="9">
        <g class="wheel"><circle cx="310" cy="438" r="91"/><path d="M310 347v182M219 438h182M246 374l128 128M374 374 246 502" stroke-width="3" opacity=".72"/><circle cx="310" cy="438" r="8" fill="#ee795e" stroke="none"/></g>
        <g class="wheel"><circle cx="700" cy="438" r="91"/><path d="M700 347v182M609 438h182M636 374l128 128M764 374 636 502" stroke-width="3" opacity=".72"/><circle cx="700" cy="438" r="8" fill="#ee795e" stroke="none"/></g>
      </g>
      <!-- Bicycle frame -->
      <g fill="none" stroke="#ee795e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <path d="M310 438 420 326 505 438 310 438 385 438"/>
        <path d="m420 326 139-8 141 120-195 0 74-120"/>
        <path d="m700 438 25-133" stroke="#173a42" stroke-width="8"/>
        <path d="m682 305 55 0M365 327h88" stroke="#173a42" stroke-width="9"/>
      </g>
      <g class="crank" fill="none" stroke="#173a42" stroke-width="6" stroke-linecap="round">
        <circle cx="505" cy="438" r="18" fill="#f3c968" stroke="#173a42" stroke-width="4"/>
        <path d="M505 438 537 458M505 438l-31-20"/>
        <path d="M532 458h25M467 418h25" stroke-width="8"/>
      </g>

      <!-- Pelican rider -->
      <g class="rider">
        <!-- legs -->
        <path d="M471 375c-9 27-3 47 14 61l19 3" fill="none" stroke="#e9a64f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M525 371c16 21 19 41 1 63l-21 4" fill="none" stroke="#e9a64f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M498 439h20M473 418h20" stroke="#173a42" stroke-width="7" stroke-linecap="round"/>
        <!-- body -->
        <ellipse cx="495" cy="294" rx="78" ry="101" fill="#fffaf0" stroke="#173a42" stroke-width="6" transform="rotate(-12 495 294)"/>
        <g class="wing">
          <path d="M446 280c20-38 75-54 108-20 22 23 14 62-13 82-29 22-67 12-91-9-16-14-17-35-4-53Z" fill="#e6eee0" stroke="#173a42" stroke-width="5"/>
          <path d="M458 286c23 8 45 24 65 48M468 270c26 8 44 21 60 38" fill="none" stroke="#bfd2c4" stroke-width="5" stroke-linecap="round"/>
        </g>
        <!-- neck and head -->
        <path d="M536 270c16-24 10-59 8-82" fill="none" stroke="#fffaf0" stroke-width="28" stroke-linecap="round"/>
        <path d="M536 270c16-24 10-59 8-82" fill="none" stroke="#173a42" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="545" cy="177" rx="43" ry="39" fill="#fffaf0" stroke="#173a42" stroke-width="6"/>
        <circle cx="558" cy="169" r="5.5" fill="#173a42"/>
        <circle cx="560" cy="167" r="1.6" fill="white"/>
        <!-- long bill and pouch -->
        <path d="M577 179c42-4 80 0 112 12-31 16-69 21-109 9Z" fill="#f3c968" stroke="#173a42" stroke-width="5" stroke-linejoin="round"/>
        <path d="M580 185c17 2 34 5 50 11-2 24-13 38-30 38-17 0-25-15-20-49Z" fill="#ee795e" stroke="#173a42" stroke-width="5" stroke-linejoin="round"/>
        <path d="M588 220c9 4 20 4 29-1" fill="none" stroke="#c85d4c" stroke-width="3" stroke-linecap="round"/>
        <!-- crest -->
        <path d="M526 145c-4-15-17-21-27-19 8 7 9 14 6 23M541 139c1-15-9-24-19-26 5 9 4 16-1 24" fill="#ee795e" stroke="#173a42" stroke-width="4" stroke-linejoin="round"/>
        <!-- tail -->
        <path d="M425 314c-28 2-48 16-58 37 28-8 49-7 70 1" fill="#fffaf0" stroke="#173a42" stroke-width="5" stroke-linejoin="round"/>
      </g>

      <!-- handlebar grip and tiny flowers -->
      <path d="M716 300c13-14 32-16 47-8" fill="none" stroke="#173a42" stroke-width="8" stroke-linecap="round"/>
      <g fill="#f3c968"><circle cx="123" cy="475" r="6"/><circle cx="137" cy="474" r="4"/><circle cx="873" cy="460" r="6"/><circle cx="888" cy="460" r="4"/></g>
      <g stroke="#608f6c" stroke-width="4" stroke-linecap="round"><path d="M130 493v-18M880 480v-18M123 486l-8-7M880 473l9-7"/></g>
    </svg>
    <footer class="controls">
      <p class="caption">微风正好，今天也慢慢骑。</p>
      <button id="toggle" type="button" aria-pressed="false"><span aria-hidden="true">Ⅱ</span><span>暂停动画</span></button>
    </footer>
  </main>
  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.innerHTML = paused
        ? '<span aria-hidden="true">▶</span><span>继续动画</span>'
        : '<span aria-hidden="true">Ⅱ</span><span>暂停动画</span>';
    });
  </script>
</body>
</html>
