<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #228B22 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  svg {
    display: block;
  }
</style>
</head>
<body>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 云朵 -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="white" opacity="0.9"/>
      <ellipse cx="-20" cy="5" rx="25" ry="15" fill="white" opacity="0.9"/>
      <ellipse cx="20" cy="5" rx="28" ry="16" fill="white" opacity="0.9"/>
    </g>
  </defs>

  <!-- 天空背景 -->
  <rect width="800" height="300" fill="#87CEEB"/>
  <!-- 地面 -->
  <rect y="300" width="800" height="200" fill="#4a7c2f"/>
  <!-- 路面 -->
  <rect y="340" width="800" height="40" fill="#808080"/>
  <!-- 路面标线 -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="white" stroke-width="2" stroke-dasharray="40,30">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-70,0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- 云朵动画 -->
  <g>
    <use href="#cloud" transform="translate(100,80)">
      <animateTransform attributeName="transform" type="translate" from="100,80" to="900,80" dur="18s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" transform="translate(400,50)">
      <animateTransform attributeName="transform" type="translate" from="400,50" to="1200,50" dur="25s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" transform="translate(-100,100)">
      <animateTransform attributeName="transform" type="translate" from="-100,100" to="700,100" dur="20s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- 太阳 -->
  <circle cx="720" cy="70" r="45" fill="#FFD700" opacity="0.9"/>
  <circle cx="720" cy="70" r="38" fill="#FFA500" opacity="0.5"/>

  <!-- 树木装饰 -->
  <g transform="translate(650, 340)">
    <rect x="-8" y="-40" width="16" height="40" fill="#8B4513"/>
    <ellipse cx="0" cy="-60" rx="30" ry="40" fill="#228B22"/>
    <ellipse cx="-15" cy="-45" rx="22" ry="30" fill="#2d9e2d"/>
    <ellipse cx="15" cy="-48" rx="20" ry="28" fill="#1a7a1a"/>
  </g>
  <g transform="translate(750, 340)">
    <rect x="-6" y="-30" width="12" height="30" fill="#8B4513"/>
    <ellipse cx="0" cy="-48" rx="24" ry="32" fill="#228B22"/>
    <ellipse cx="-12" cy="-36" rx="18" ry="24" fill="#2d9e2d"/>
  </g>

  <!-- 主体：鹈鹕骑自行车 - 整体向右移动并上下轻微弹跳 -->
  <g id="pelican-bike">
    <animateTransform attributeName="transform" type="translate" from="-300,0" to="1100,0" dur="6s" repeatCount="indefinite"/>

    <!-- 自行车车架 -->
    <g transform="translate(0, 330)">

      <!-- 后轮 -->
      <g transform="translate(-60, 0)">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="5"/>
        <circle cx="0" cy="0" r="6" fill="#555"/>
        <!-- 轮辐 -->
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-24" y1="-24" x2="24" y2="24" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="24" y1="-24" x2="-24" y2="24" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <!-- 轮胎纹路动画 -->
        <circle cx="0" cy="0" r="40" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="8,8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- 前轮 -->
      <g transform="translate(60, 0)">
        <circle cx="0" cy="0" r="40" fill="none" stroke="#333" stroke-width="5"/>
        <circle cx="0" cy="0" r="6" fill="#555"/>
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-24" y1="-24" x2="24" y2="24" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="24" y1="-24" x2="-24" y2="24" stroke="#666" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        </line>
        <circle cx="0" cy="0" r="40" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="8,8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- 车架主体 -->
      <!-- 下管：后轮轴->底部五通 -->
      <line x1="-60" y1="0" x2="-10" y2="10" stroke="#e63" stroke-width="6" stroke-linecap="round"/>
      <!-- 上管：后轴->座管顶 -->
      <line x1="-60" y1="0" x2="-10" y2="-45" stroke="#e63" stroke-width="6" stroke-linecap="round"/>
      <!-- 立管：座管 -->
      <line x1="-10" y1="-45" x2="-10" y2="10" stroke="#e63" stroke-width="6" stroke-linecap="round"/>
      <!-- 前叉上管：座管顶->前轮轴 -->
      <line x1="-10" y1="-45" x2="60" y2="0" stroke="#e63" stroke-width="6" stroke-linecap="round"/>
      <!-- 前叉下管：五通->前轮轴 -->
      <line x1="-10" y1="10" x2="60" y2="0" stroke="#e63" stroke-width="6" stroke-linecap="round"/>
      <!-- 前叉 -->
      <line x1="45" y1="-30" x2="60" y2="0" stroke="#c52" stroke-width="5" stroke-linecap="round"/>

      <!-- 车把 -->
      <line x1="45" y1="-30" x2="55" y2="-45" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <line x1="55" y1="-45" x2="65" y2="-38" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <!-- 把手握把 -->
      <circle cx="65" cy="-38" r="5" fill="#222"/>
      <circle cx="50" cy="-48" r="5" fill="#222"/>

      <!-- 车座 -->
      <rect x="-25" y="-55" width="30" height="8" rx="4" fill="#222"/>
      <line x1="-10" y1="-47" x2="-10" y2="-45" stroke="#555" stroke-width="4"/>

      <!-- 脚踏板和曲柄动画 -->
      <g transform="translate(-10, 10)">
        <!-- 链轮 -->
        <circle cx="0" cy="0" r="14" fill="none" stroke="#888" stroke-width="3"/>
        <circle cx="0" cy="0" r="4" fill="#888"/>
        <!-- 曲柄和踏板旋转 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
          <line x1="0" y1="-12" x2="0" y2="12" stroke="#555" stroke-width="4" stroke-linecap="round"/>
          <!-- 踏板1 -->
          <rect x="-8" y="-16" width="16" height="6" rx="2" fill="#333"/>
          <!-- 踏板2 -->
          <rect x="-8" y="10" width="16" height="6" rx="2" fill="#333"/>
        </g>
      </g>

      <!-- 链条 -->
      <path d="M -10,10 Q 25,18 60,0" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="5,3">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="0.3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 鹈鹕身体 (坐在车座上) -->
    <g transform="translate(-10, 270)">
      <!-- 上下弹跳 -->
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="-10,270; -10,268; -10,270; -10,272; -10,270"
        dur="0.6s" repeatCount="indefinite"/>

      <!-- 身体 -->
      <ellipse cx="0" cy="-30" rx="28" ry="35" fill="white" stroke="#ddd" stroke-width="1"/>
      <!-- 胸部深色斑纹 -->
      <ellipse cx="0" cy="-20" rx="16" ry="20" fill="#f0f0f0"/>

      <!-- 翅膀左 (轻微扇动) -->
      <ellipse cx="-28" cy="-30" rx="18" ry="10" fill="white" stroke="#ccc" stroke-width="1" transform="rotate(-15, -28, -30)">
        <animateTransform attributeName="transform" type="rotate"
          values="-15,-28,-30; -25,-28,-30; -15,-28,-30; -5,-28,-30; -15,-28,-30"
          dur="0.6s" repeatCount="indefinite"/>
      </ellipse>
      <!-- 翅膀右 -->
      <ellipse cx="28" cy="-30" rx="18" ry="10" fill="white" stroke="#ccc" stroke-width="1" transform="rotate(15, 28, -30)">
        <animateTransform attributeName="transform" type="rotate"
          values="15,28,-30; 25,28,-30; 15,28,-30; 5,28,-30; 15,28,-30"
          dur="0.6s" repeatCount="indefinite"/>
      </ellipse>

      <!-- 脖子 -->
      <ellipse cx="0" cy="-65" rx="12" ry="22" fill="white"/>
      <!-- 颈部纹路 -->
      <path d="M -8,-55 Q 0,-60 8,-55" fill="none" stroke="#ddd" stroke-width="1"/>

      <!-- 头部 -->
      <circle cx="0" cy="-90" r="22" fill="white" stroke="#ddd" stroke-width="1"/>
      <!-- 头顶羽毛 -->
      <path d="M 0,-112 Q -5,-120 0,-128 Q 5,-120 0,-112" fill="#FFD700"/>
      <path d="M -6,-110 Q -10,-118 -6,-126 Q -2,-118 -6,-110" fill="#FFA500"/>
      <path d="M 6,-110 Q 10,-118 6,-126 Q 2,-118 6,-110" fill="#FFA500"/>

      <!-- 眼睛 -->
      <circle cx="10" cy="-93" r="6" fill="#FFE066"/>
      <circle cx="10" cy="-93" r="3.5" fill="#222"/>
      <circle cx="11.5" cy="-94.5" r="1.2" fill="white"/>
      <!-- 眨眼动画 -->
      <ellipse cx="10" cy="-93" rx="6" ry="0.5" fill="white" opacity="0">
        <animate attributeName="ry" values="0.5;5.5;0.5" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      </ellipse>

      <!-- 鹈鹕长嘴 -->
      <path d="M 18,-88 L 58,-78 L 55,-72 L 16,-82 Z" fill="#FFA500"/>
      <!-- 喉囊 -->
      <path d="M 18,-82 Q 40,-65 55,-72 Q 50,-58 20,-68 Z" fill="#FF8C00" opacity="0.8"/>
      <!-- 嘴尖 -->
      <path d="M 55,-74 L 65,-74 L 58,-70 Z" fill="#e07000"/>

      <!-- 腿部 (踩踏板) -->
      <!-- 右腿 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0,0,-30; 20,0,-30; 0,0,-30; -20,0,-30; 0,0,-30"
          dur="0.6s" repeatCount="indefinite"/>
        <line x1="8" y1="-10" x2="20" y2="15" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
        <line x1="20" y1="15" x2="8" y2="35" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
        <!-- 脚蹼 -->
        <path d="M 8,35 L 24,38 L 20,42 L 4,40 Z" fill="#FFA500"/>
      </g>
      <!-- 左腿 -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0,0,-30; -20,0,-30; 0,0,-30; 20,0,-30; 0,0,-30"
          dur="0.6s" repeatCount="indefinite"/>
        <line x1="-8" y1="-10" x2="-20" y2="15" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
        <line x1="-20" y1="15" x2="-8" y2="35" stroke="#FFD700" stroke-width="5" stroke-linecap="round"/>
        <path d="M -8,35 L -24,38 L -20,42 L -4,40 Z" fill="#FFA500"/>
      </g>
    </g>
  </g>

  <!-- 装饰文字 -->
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="white" font-weight="bold" opacity="0.8">🚴 鹈鹕的快乐骑行 🚴</text>
</svg>
</body>
</html>
