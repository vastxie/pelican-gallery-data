<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #87CEEB 0%, #B0E0E6 60%, #F4E4BC 60%, #E8D098 100%);
    font-family: sans-serif;
  }
  svg { max-width: 100%; height: auto; }
  h1 { position: absolute; top: 20px; color: #333; font-weight: 300; }
</style>
</head>
<body>
<h1>鹈鹕骑自行车 🚴</h1>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun -->
  <circle cx="680" cy="80" r="40" fill="#FFD966" opacity="0.9"/>
  <circle cx="680" cy="80" r="55" fill="#FFD966" opacity="0.3"/>

  <!-- Clouds -->
  <g fill="white" opacity="0.85">
    <ellipse cx="120" cy="90" rx="40" ry="15"/>
    <ellipse cx="150" cy="80" rx="30" ry="18"/>
    <ellipse cx="400" cy="60" rx="50" ry="16"/>
    <ellipse cx="430" cy="55" rx="35" ry="20"/>
  </g>

  <!-- Ground line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#8B7355" stroke-width="2"/>

  <!-- Moving grass/dashes to convey motion -->
  <g stroke="#8B7355" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="410" x2="30" y2="410">
      <animate attributeName="x1" from="800" to="-30" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="830" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="430" x2="240" y2="430">
      <animate attributeName="x1" from="800" to="-40" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="840" to="0" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="420" x2="530" y2="420">
      <animate attributeName="x1" from="800" to="-30" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="830" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="650" y1="440" x2="690" y2="440">
      <animate attributeName="x1" from="800" to="-40" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="840" to="0" dur="1.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Whole scene bobbing slightly -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,0; 0,-2; 0,0" dur="0.6s" repeatCount="indefinite"/>

    <!-- Bicycle group -->
    <g transform="translate(400,320)">
      <!-- Rear wheel -->
      <g transform="translate(-90,30)">
        <circle r="55" fill="none" stroke="#222" stroke-width="5"/>
        <circle r="8" fill="#444"/>
        <g stroke="#666" stroke-width="2">
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="-35" y1="35" x2="35" y2="-35"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        </g>
      </g>
      <!-- Front wheel -->
      <g transform="translate(90,30)">
        <circle r="55" fill="none" stroke="#222" stroke-width="5"/>
        <circle r="8" fill="#444"/>
        <g stroke="#666" stroke-width="2">
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="-35" y1="35" x2="35" y2="-35"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- Frame -->
      <g stroke="#D9376E" stroke-width="6" stroke-linecap="round" fill="none">
        <line x1="-90" y1="30" x2="0" y2="30"/>
        <line x1="0" y1="30" x2="-30" y2="-30"/>
        <line x1="-30" y1="-30" x2="60" y2="-30"/>
        <line x1="60" y1="-30" x2="90" y2="30"/>
        <line x1="0" y1="30" x2="60" y2="-30"/>
      </g>

      <!-- Seat -->
      <rect x="-42" y="-38" width="26" height="8" rx="3" fill="#333"/>

      <!-- Handlebar -->
      <g stroke="#333" stroke-width="4" stroke-linecap="round" fill="none">
        <line x1="60" y1="-30" x2="60" y2="-55"/>
        <line x1="45" y1="-55" x2="75" y2="-55"/>
      </g>

      <!-- Pedal crank -->
      <g transform="translate(0,30)">
        <circle r="10" fill="#888"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
          <line x1="-18" y1="0" x2="18" y2="0" stroke="#555" stroke-width="4"/>
          <rect x="-24" y="-4" width="12" height="8" rx="2" fill="#222"/>
          <rect x="12" y="-4" width="12" height="8" rx="2" fill="#222"/>
        </g>
      </g>
    </g>

    <!-- Pelican rider -->
    <g transform="translate(370,240)">
      <!-- Legs pedaling: two legs animated to trace pedal circle -->
      <!-- Left leg -->
      <g stroke="#F5B841" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="0" y1="30" x2="20" y2="80">
          <animate attributeName="x2"
            values="30;45;30;15;30" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="y2"
            values="80;95;110;95;80" dur="0.8s" repeatCount="indefinite"/>
        </line>
      </g>
      <!-- Right leg (opposite phase) -->
      <g stroke="#E0A020" stroke-width="9" stroke-linecap="round" fill="none">
        <line x1="0" y1="30" x2="20" y2="110">
          <animate attributeName="x2"
            values="30;15;30;45;30" dur="0.8s" repeatCount="indefinite"/>
          <animate attributeName="y2"
            values="110;95;80;95;110" dur="0.8s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Body -->
      <ellipse cx="0" cy="0" rx="45" ry="55" fill="#FAFAFA" stroke="#DDD" stroke-width="2"/>
      <!-- Belly -->
      <ellipse cx="5" cy="10" rx="30" ry="38" fill="#FFF8E7"/>

      <!-- Wing (hand on handlebar) -->
      <path d="M 30 -10 Q 70 -5 85 15 Q 65 25 45 15 Z" fill="#EAEAEA" stroke="#CCC" stroke-width="1.5">
        <animateTransform attributeName="transform" type="rotate"
          values="-2 30 -10; 2 30 -10; -2 30 -10" dur="0.6s" repeatCount="indefinite"/>
      </path>
      <!-- Wing feather lines -->
      <g stroke="#CCC" stroke-width="1" fill="none">
        <path d="M 50 -5 Q 60 5 55 15"/>
        <path d="M 65 -3 Q 72 8 68 18"/>
      </g>

      <!-- Neck -->
      <path d="M -15 -40 Q -20 -60 -5 -70 L 15 -65 Q 10 -45 5 -40 Z" fill="#FAFAFA" stroke="#DDD" stroke-width="2"/>

      <!-- Head -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 2,-1; 0,0; -1,1; 0,0" dur="0.6s" repeatCount="indefinite"/>
        <!-- Head circle -->
        <circle cx="5" cy="-80" r="22" fill="#FAFAFA" stroke="#DDD" stroke-width="2"/>
        <!-- Eye -->
        <circle cx="15" cy="-85" r="4" fill="white" stroke="#333" stroke-width="1"/>
        <circle cx="16" cy="-84" r="2" fill="#222"/>
        <!-- Upper beak -->
        <path d="M 20 -78 Q 65 -75 75 -68 Q 55 -68 25 -70 Z" fill="#F9A825" stroke="#C77800" stroke-width="1.5"/>
        <!-- Lower beak / pouch -->
        <path d="M 22 -72 Q 55 -60 72 -68 Q 60 -52 40 -55 Q 28 -58 22 -68 Z" fill="#FFCA5C" stroke="#C77800" stroke-width="1.5"/>
        <!-- Small tuft -->
        <path d="M -5 -100 Q 0 -108 5 -100" stroke="#DDD" stroke-width="2" fill="none"/>
      </g>

      <!-- Tail -->
      <path d="M -40 20 Q -60 25 -55 40 Q -45 35 -35 30 Z" fill="#EAEAEA" stroke="#CCC" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Foreground motion streaks -->
  <g stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="100" y1="250" x2="160" y2="250">
      <animate attributeName="x1" from="900" to="-100" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="960" to="-40" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="300" y1="200" x2="360" y2="200">
      <animate attributeName="x1" from="900" to="-100" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="960" to="-40" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="280" x2="670" y2="280">
      <animate attributeName="x1" from="900" to="-100" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="970" to="-30" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
</body>
</html>
