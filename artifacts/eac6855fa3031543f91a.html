<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f3f3">
  <link rel="icon" href="data:,">
  <title>骑自行车的鹈鹕 · SVG 动画</title>
  <style>
    :root { color-scheme: light; font-family: ui-rounded, "Avenir Next", "PingFang SC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #e8f3f0; color: #173947; }
    main { width: min(1200px, 100%); }
    .stage { overflow: hidden; border: 8px solid #fff; border-radius: 28px; background: #d9f3f3; box-shadow: 0 22px 65px #28516025, 0 4px 12px #28516016; }
    svg { width: 100%; height: auto; display: block; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 6px 0; }
    .caption { margin: 0; font-size: 14px; letter-spacing: .02em; color: #496c73; }
    button { appearance: none; border: 0; border-radius: 999px; padding: 11px 18px; background: #173947; color: white; font: 700 14px/1 inherit; cursor: pointer; box-shadow: 0 4px 0 #0a2832; }
    button:hover { background: #255569; }
    button:focus-visible { outline: 3px solid #f7a85b; outline-offset: 4px; }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a2832; }
    .wheel-spin { animation: spin 1.4s linear infinite; transform-origin: 0 0; }
    .bike-bob { animation: bob .7s ease-in-out infinite alternate; }
    .road-stripes { animation: road 1.4s linear infinite; }
    .cloud-one { animation: cloud 5s ease-in-out infinite alternate; }
    .cloud-two { animation: cloud 6.3s ease-in-out infinite alternate-reverse; }
    .scarf-tail { animation: flutter .42s ease-in-out infinite alternate; transform-origin: 680px 187px; }
    .plant-strip { animation: landscape 5.6s linear infinite; }
    .paused .wheel-spin, .paused .bike-bob, .paused .road-stripes,
    .paused .cloud-one, .paused .cloud-two, .paused .scarf-tail,
    .paused .plant-strip { animation-play-state: paused; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-5px); } }
    @keyframes road { to { stroke-dashoffset: 220; } }
    @keyframes cloud { to { transform: translateX(24px); } }
    @keyframes flutter { to { transform: rotate(7deg) scaleY(.87); } }
    @keyframes landscape { to { transform: translateX(-1200px); } }
    @media (prefers-reduced-motion: reduce) {
      .wheel-spin, .bike-bob, .road-stripes, .cloud-one, .cloud-two,
      .scarf-tail, .plant-strip { animation-duration: .001ms; animation-iteration-count: 1; }
    }
  </style>
</head>

          </g>

        </g>

        <path d="M575 389 584 421" stroke="#244554" stroke-width="10" stroke-linecap="round"/>
        <circle cx="615" cy="516" r="27" fill="#f8d5a5" stroke="#244554" stroke-width="7"/>
        <circle cx="615" cy="516" r="13" fill="#244554"/>
        <path d="M739 363 760 330h42" fill="none" stroke="#244554" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Tail, neck, body and wing -->
        <path d="M432 284q-48-7-77-35 7 40 53 64Z" fill="#f3eee0" stroke="#244554" stroke-width="5" stroke-linejoin="round"/>
        <path d="M426 303q-47-2-68-20 16 38 55 43Z" fill="#e7e6d8" stroke="#244554" stroke-width="4" stroke-linejoin="round"/>
        <path d="M633 318q35-34 47-102 4-44 42-58 37-8 49 25-27 8-37 35-8 31-19 82-8 44-39 62Z" fill="#fff9e9" stroke="#244554" stroke-width="6"/>
        <path d="M428 269q44-48 139-48 74 0 108 44 26 35 8 75-20 52-104 67-96 17-155-29-54-42-33-82 10-19 37-27Z" fill="#fff9e9" stroke="#244554" stroke-width="6"/>
        <path d="M424 335q29 54 119 61 64 4 107-23" fill="none" stroke="#e6dfc9" stroke-width="7" stroke-linecap="round"/>
        <path d="M472 283q37-29 97-19 37 6 53 35-15 49-76 63-55 10-90-29 5-28 16-50Z" fill="#f4f0dc" stroke="#244554" stroke-width="5"/>
        <path d="M465 313q32 26 72 22 44-4 71-27" fill="none" stroke="#d7d9c9" stroke-width="5" stroke-linecap="round"/>
        <path d="M502 342q31 20 65 6" fill="none" stroke="#d7d9c9" stroke-width="4" stroke-linecap="round"/>

        <!-- Front leg and rotating pedals -->
        <path id="frontLeg" d="M616 359 Q675 417 650 530" fill="none" stroke="#e89b5a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <circle id="frontKnee" cx="675" cy="417" r="11" fill="#e89b5a"/>
        <g id="frontFoot"><path d="M-23-4q5-14 21-13l17 11q17 3 22 15-12 9-35 9h-23q-13-4-11-13Z" fill="#f6ae67" stroke="#ad7046" stroke-width="3"/></g>

        <path d="M574 280q38-8 72 13l71 42q21 10 52-2" fill="none" stroke="#f5f0df" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>

  </div>
  <div class="controls">
    <p class="caption">海风、车轮，还有一段悠闲的骑行。</p>
    <button id="toggle" type="button" aria-pressed="false" aria-label="暂停动画">暂停动画</button>
  </div>
</main>
<script>
(() => {
  const stage = document.getElementById('stage');
  const toggle = document.getElementById('toggle');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const parts = Object.fromEntries(['frontLeg', 'backLeg', 'frontKnee', 'backKnee', 'frontFoot', 'backFoot', 'frontPedal', 'backPedal', 'crank'].map(id => [id, document.getElementById(id)]));
  const center = {x: 615, y: 516};
  const radius = 38;
  let paused = reducedMotion.matches;
  let elapsed = 0;
  let lastTime = 0;
  let rafId = 0;

  function pointOnPedal(angle) {
    return {x: center.x + Math.cos(angle) * radius, y: center.y + Math.sin(angle) * radius};
  }

  // Find the forward knee position from the hip and pedal; both leg lengths stay fixed.
  function knee(hip, foot, upper, lower) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    const d = Math.hypot(dx, dy);
    const along = (upper * upper - lower * lower + d * d) / (2 * d);
    const out = Math.sqrt(Math.max(0, upper * upper - along * along));
    return {x: hip.x + along * dx / d - out * dy / d, y: hip.y + along * dy / d + out * dx / d};
  }

  function drawLeg(name, hip, foot, upper, lower) {
    const k = knee(hip, foot, upper, lower);
    parts[name + 'Leg'].setAttribute('d', `M${hip.x} ${hip.y} Q${k.x.toFixed(1)} ${k.y.toFixed(1)} ${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`);
    parts[name + 'Knee'].setAttribute('cx', k.x.toFixed(1));
    parts[name + 'Knee'].setAttribute('cy', k.y.toFixed(1));
    parts[name + 'Foot'].setAttribute('transform', `translate(${foot.x.toFixed(1)} ${foot.y.toFixed(1)})`);
    parts[name + 'Pedal'].setAttribute('transform', `translate(${foot.x.toFixed(1)} ${(foot.y + 14).toFixed(1)})`);
  }

  function draw(time) {
    const angle = time * Math.PI * 2 / 1400 + .38;
    const front = pointOnPedal(angle);
    const back = pointOnPedal(angle + Math.PI);
    drawLeg('back', {x: 565, y: 362}, back, 105, 111);
    drawLeg('front', {x: 617, y: 364}, front, 105, 112);
    parts.crank.setAttribute('d', `M615 516 ${front.x.toFixed(1)} ${front.y.toFixed(1)} M615 516 ${back.x.toFixed(1)} ${back.y.toFixed(1)}`);
  }

  function frame(now) {
    if (!lastTime) lastTime = now;
    elapsed += Math.min(now - lastTime, 50);
    lastTime = now;
    draw(elapsed);
    rafId = requestAnimationFrame(frame);
  }

  function setPaused(value) {
    paused = value;
    stage.classList.toggle('paused', value);
    toggle.textContent = value ? '继续动画' : '暂停动画';
    toggle.setAttribute('aria-label', toggle.textContent);
    toggle.setAttribute('aria-pressed', String(value));
    if (value) {
      cancelAnimationFrame(rafId);
      rafId = 0;
      lastTime = 0;
    } else if (!rafId) {
      rafId = requestAnimationFrame(frame);
    }
  }

  toggle.addEventListener('click', () => setPaused(!paused));
  reducedMotion.addEventListener('change', event => setPaused(event.matches));
  setPaused(paused);
  draw(0);
})();
</script>
</body>
</html>
