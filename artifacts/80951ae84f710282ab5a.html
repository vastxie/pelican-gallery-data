<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #1d2733;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: #e8eef5;
  }
  svg {
    width: min(96vw, 1000px);
    height: auto;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    cursor: pointer;
  }
  .hint { margin-top: 14px; opacity: .7; font-size: 14px; }
  .controls { margin-top: 8px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
  input[type=range] { width: 180px; }
</style>
</head>
<body>

<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="0.7" stop-color="#cdeefc"/>
      <stop offset="1" stop-color="#fff4d8"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.5" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ffd84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe4ea"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf4a"/>
      <stop offset="1" stop-color="#f29d2e"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a53c"/>
      <stop offset="1" stop-color="#e0702a"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d1db"/>
      <stop offset="1" stop-color="#8e9aab"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="38" ry="18" fill="#fff"/>
      <ellipse cx="-26" cy="6" rx="26" ry="14" fill="#fff"/>
      <ellipse cx="28" cy="6" rx="28" ry="14" fill="#fff"/>
      <ellipse cx="6" cy="-12" rx="24" ry="16" fill="#fff"/>
    </g>
    <g id="tree">
      <rect x="-4" y="-10" width="8" height="30" fill="#7a5436"/>
      <circle cx="0" cy="-28" r="22" fill="#4f9a55"/>
      <circle cx="-12" cy="-16" r="15" fill="#468c4c"/>
      <circle cx="13" cy="-18" r="16" fill="#5aa860"/>
    </g>
    <!-- 车轮：辐条 + 轮胎 -->
    <g id="wheel">
      <circle r="60" fill="none" stroke="#2b2f36" stroke-width="7"/>
      <circle r="55" fill="none" stroke="#9aa4b1" stroke-width="2"/>
      <g stroke="#b9c2cc" stroke-width="1.3">
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="-38.9" y1="-38.9" x2="38.9" y2="38.9"/>
        <line x1="-38.9" y1="38.9" x2="38.9" y2="-38.9"/>
        <line x1="-21" y1="-50.8" x2="21" y2="50.8"/>
        <line x1="-50.8" y1="-21" x2="50.8" y2="21"/>
        <line x1="-21" y1="50.8" x2="21" y2="-50.8"/>
        <line x1="-50.8" y1="21" x2="50.8" y2="-21"/>
      </g>
      <circle r="6" fill="#6b7480"/>
      <circle r="2.5" fill="#2b2f36"/>
      <!-- 气门嘴，方便看出旋转 -->
      <rect x="-2" y="-58" width="4" height="7" fill="#e14b4b"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="70" fill="url(#sunGlow)"/>
  <circle cx="660" cy="90" r="30" fill="#ffe872"/>

  <!-- 云 -->
  <g id="clouds">
    <use href="#cloud" x="120" y="80"/>
    <use href="#cloud" x="420" y="60" transform="scale(1)"/>
    <use href="#cloud" x="700" y="140"/>
    <use href="#cloud" x="920" y="90"/>
    <use href="#cloud" x="1220" y="60"/>
    <use href="#cloud" x="1500" y="140"/>
  </g>

  <!-- 远山（视差） -->
  <g id="farHills">
    <path d="M0 330 Q100 250 200 310 T400 300 T600 290 T800 330 L800 500 L0 500Z" fill="#a8cfa0"/>
    <path d="M800 330 Q900 250 1000 310 T1200 300 T1400 290 T1600 330 L1600 500 L800 500Z" fill="#a8cfa0"/>
  </g>
  <g id="nearHills">
    <path d="M0 370 Q120 310 260 360 T520 350 T800 370 L800 500 L0 500Z" fill="#86bd7c"/>
    <path d="M800 370 Q920 310 1060 360 T1320 350 T1600 370 L1600 500 L800 500Z" fill="#86bd7c"/>
  </g>

  <!-- 树 -->
  <g id="trees">
    <use href="#tree" x="60" y="372"/>
    <use href="#tree" x="310" y="366"/>
    <use href="#tree" x="370" y="374" transform="translate(0,0)"/>
    <use href="#tree" x="620" y="370"/>
    <use href="#tree" x="860" y="372"/>
    <use href="#tree" x="1110" y="366"/>
    <use href="#tree" x="1170" y="374"/>
    <use href="#tree" x="1420" y="370"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="398" width="800" height="102" fill="#5d6570"/>
  <rect x="0" y="396" width="800" height="6" fill="#c9b98f"/>
  <line id="roadDash" x1="0" y1="455" x2="800" y2="455" stroke="#f4f1e4" stroke-width="5" stroke-dasharray="46 34"/>

  <!-- 影子 -->
  <ellipse id="shadow" cx="350" cy="402" rx="150" ry="8" fill="#000" opacity=".22"/>

  <!-- 骑手 + 自行车 -->
  <g id="rig">
    <!-- 远侧腿（在车架后面） -->
    <g id="legFar" stroke="#d9772a" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path id="legFarPath" stroke-width="7"/>
      <path id="footFar" fill="#c9661f" stroke="none"/>
    </g>
    <!-- 远侧曲柄 -->
    <line id="crankFar" stroke="#555c66" stroke-width="5" stroke-linecap="round"/>
    <rect id="pedalFar" width="16" height="5" rx="1.5" fill="#3a3f47"/>

    <!-- 车轮 -->
    <g id="rearWheel" transform="translate(250 340)"><use href="#wheel"/></g>
    <g id="frontWheel" transform="translate(455 340)"><use href="#wheel"/></g>

    <!-- 车架 -->
    <g stroke="#1f8fb8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M250 340 L340 345"/>                 <!-- 后下叉 -->
      <path d="M250 340 L318 262"/>                 <!-- 后上叉 -->
      <path d="M340 345 L316 250"/>                 <!-- 立管 -->
      <path d="M318 265 L428 262"/>                 <!-- 上管 -->
      <path d="M340 345 L433 288"/>                 <!-- 下管 -->
      <path d="M426 255 L436 292" stroke-width="9"/><!-- 头管 -->
    </g>
    <!-- 前叉 -->
    <path d="M435 290 L455 340" stroke="#2b2f36" stroke-width="6" stroke-linecap="round"/>
    <!-- 车把立管 + 车把 -->
    <path d="M427 257 L422 236" stroke="#2b2f36" stroke-width="6" stroke-linecap="round"/>
    <path d="M410 236 Q432 230 440 244" stroke="#2b2f36" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- 链轮 + 链条 -->
    <circle cx="340" cy="345" r="15" fill="none" stroke="#6b7480" stroke-width="4"/>
    <path d="M250 334 L340 330 M250 346 L340 360" stroke="#6b7480" stroke-width="2" stroke-dasharray="3 2"/>
    <!-- 座管 + 车座 -->
    <path d="M316 250 L313 240" stroke="#2b2f36" stroke-width="5"/>
    <path d="M292 236 Q312 230 336 238 Q318 245 296 243 Z" fill="#2b2f36"/>

    <!-- ===== 鹈鹕 ===== -->
    <g id="pelican">
      <!-- 尾巴 -->
      <path d="M268 222 L236 212 L244 226 L232 234 L270 236 Z" fill="#dfe4ea" stroke="#b7c0cb" stroke-width="1.5"/>
      <!-- 身体 -->
      <ellipse cx="318" cy="212" rx="58" ry="36" fill="url(#bodyGrad)" stroke="#c3ccd6" stroke-width="2" transform="rotate(-18 318 212)"/>
      <!-- 脖子 -->
      <path id="neck" d="M350 196 C372 176 356 150 378 128 L396 140 C380 158 396 186 368 214 Z" fill="url(#bodyGrad)" stroke="#c3ccd6" stroke-width="2"/>

      <!-- 头部组（单独轻微摆动） -->
      <g id="head">
        <!-- 喉囊 -->
        <path id="pouch" d="M398 138 Q450 186 500 146 L402 146 Z" fill="url(#pouchGrad)" stroke="#c75c1f" stroke-width="1.5"/>
        <!-- 上喙 -->
        <path d="M392 124 Q450 128 506 142 Q510 146 502 148 Q450 146 396 144 Z" fill="url(#beakGrad)" stroke="#c9741d" stroke-width="1.5"/>
        <path d="M500 140 Q510 142 508 150 Q504 146 499 146 Z" fill="#e0602a"/>
        <!-- 头 -->
        <circle cx="386" cy="128" r="19" fill="#fff" stroke="#c3ccd6" stroke-width="2"/>
        <!-- 冠羽 -->
        <path d="M378 111 Q370 96 360 100 Q370 104 374 114 Z" fill="#f5e6a8" stroke="#d9c77e" stroke-width="1"/>
        <path d="M384 110 Q382 94 372 92 Q380 100 380 111 Z" fill="#f5e6a8" stroke="#d9c77e" stroke-width="1"/>
        <!-- 眼睛 -->
        <g id="eye">
          <circle cx="392" cy="124" r="5.5" fill="#fff" stroke="#333" stroke-width="1"/>
          <circle cx="393.5" cy="124" r="3" fill="#1a1a1a"/>
          <circle cx="394.5" cy="122.8" r="1" fill="#fff"/>
        </g>
        <path id="eyelid" d="M386 124 Q392 116 398 124" fill="#fff" stroke="#333" stroke-width="1" opacity="0"/>
        <!-- 围巾 -->
        <path d="M368 150 Q384 158 398 150 L398 160 Q384 168 366 160 Z" fill="#e14b4b"/>
      </g>
      <!-- 飘动的围巾尾巴 -->
      <path id="scarfTail" fill="#e14b4b"/>

      <!-- 翅膀（伸向车把） -->
      <path d="M300 196 C330 176 380 190 408 222 C414 230 424 236 430 238 C420 244 406 240 396 234 C366 230 334 238 306 228 Z"
            fill="url(#wingGrad)" stroke="#7a8697" stroke-width="1.5"/>
      <path d="M318 214 Q350 206 380 222 M322 224 Q352 220 384 230" stroke="#7a8697" stroke-width="1.2" fill="none"/>
      <!-- 翅尖羽毛握住车把 -->
      <path d="M424 234 Q436 232 440 240 Q432 244 424 242 Z" fill="#5d6878"/>
    </g>

    <!-- 近侧曲柄 + 踏板 -->
    <line id="crankNear" stroke="#8a929c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="340" cy="345" r="4" fill="#2b2f36"/>
    <rect id="pedalNear" width="16" height="5" rx="1.5" fill="#2b2f36"/>

    <!-- 近侧腿 -->
    <g stroke="#f08a33" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path id="legNearPath" stroke-width="8"/>
      <path id="footNear" fill="#e57b27" stroke="none"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g id="speedLines" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".7">
    <line x1="160" y1="200" x2="200" y2="200"/>
    <line x1="140" y1="250" x2="190" y2="250"/>
    <line x1="170" y1="300" x2="200" y2="300"/>
  </g>
</svg>

<div class="controls">
  <label for="speed">速度</label>
  <input id="speed" type="range" min="0" max="3" step="0.05" value="1">
</div>
<div class="hint">点击画面暂停 / 继续</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const BB = { x: 340, y: 345 };      // 中轴（曲柄中心）
  const CRANK = 22;                    // 曲柄长度
  const HIP = { x: 318, y: 238 };      // 髋关节（相对车架）
  const THIGH = 62, SHIN = 60;
  const WHEEL_R = 60, GEAR = 2.4;      // 轮子转速 = 曲柄转速 × GEAR

  let crank = 0, travel = 0, t = 0, last = performance.now();
  let paused = false;
  const speedEl = $('speed');
  $('scene').addEventListener('click', () => { paused = !paused; });

  // 两段式反向运动学：由髋部和脚的位置求膝盖
  function knee(hip, foot) {
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, THIGH + SHIN - 0.01);
    const a = Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
    const base = Math.atan2(dy, dx);
    const ang = base - a;              // 膝盖向前（+x）弯
    return { x: hip.x + THIGH * Math.cos(ang), y: hip.y + THIGH * Math.sin(ang) };
  }

  function foot(p) {
    // 蹼足：以踏板为落点的小三角
    const x = p.x, y = p.y - 3;
    return `M${x - 8} ${y} L${x + 16} ${y - 3} L${x + 12} ${y + 2} L${x + 17} ${y + 4} L${x - 6} ${y + 4} Z`;
  }

  function drawLeg(pathId, footId, crankId, pedalId, angle, hip) {
    const p = { x: BB.x + CRANK * Math.cos(angle), y: BB.y + CRANK * Math.sin(angle) };
    const k = knee(hip, p);
    $(pathId).setAttribute('d', `M${hip.x} ${hip.y} L${k.x.toFixed(1)} ${k.y.toFixed(1)} L${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
    $(footId).setAttribute('d', foot(p));
    const c = $(crankId);
    c.setAttribute('x1', BB.x); c.setAttribute('y1', BB.y);
    c.setAttribute('x2', p.x); c.setAttribute('y2', p.y);
    const pd = $(pedalId);
    pd.setAttribute('x', p.x - 8); pd.setAttribute('y', p.y - 2.5);
  }

  const wrap = (v, w) => ((v % w) + w) % w;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) {
      const speed = parseFloat(speedEl.value);
      t += dt;
      crank += dt * 4.2 * speed;                     // rad/s
      travel += dt * 4.2 * speed * GEAR * WHEEL_R;  // px
    }
    const speed = paused ? 0 : parseFloat(speedEl.value);

    // 车轮旋转
    const wheelDeg = (crank * GEAR * 180 / Math.PI) % 360;
    $('rearWheel').setAttribute('transform', `translate(250 340) rotate(${wheelDeg})`);
    $('frontWheel').setAttribute('transform', `translate(455 340) rotate(${wheelDeg})`);

    // 骑行颠簸（每踩一圈两次）
    const bob = Math.sin(crank * 2) * 1.6;
    $('rig').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    $('shadow').setAttribute('rx', (150 - bob * 2).toFixed(1));

    // 头部点头 + 喉囊晃动
    const nod = Math.sin(crank * 2 + 0.8) * 2.5;
    $('head').setAttribute('transform', `rotate(${nod.toFixed(2)} 380 140)`);
    const sag = 186 + Math.sin(crank * 2 + 1.6) * 5;
    $('pouch').setAttribute('d', `M398 138 Q450 ${sag.toFixed(1)} 500 146 L402 146 Z`);

    // 眨眼
    const blink = (t % 3.2) < 0.12;
    $('eye').setAttribute('opacity', blink ? 0 : 1);
    $('eyelid').setAttribute('opacity', blink ? 1 : 0);

    // 围巾飘动
    const w1 = Math.sin(t * 9) * 6, w2 = Math.sin(t * 9 + 1.5) * 8;
    const len = 50 + speed * 12;
    $('scarfTail').setAttribute('d',
      `M370 152 C${350} ${150 + w1} ${340 - len * 0.3} ${146 + w2} ${370 - len} ${148 + w2}` +
      ` L${372 - len} ${160 + w2} C${344 - len * 0.3} ${160 + w2} ${352} ${164 + w1} 368 160 Z`);

    // 双腿（两个踏板相差 180°）
    drawLeg('legFarPath', 'footFar', 'crankFar', 'pedalFar', crank + Math.PI, { x: HIP.x + 4, y: HIP.y - 2 });
    drawLeg('legNearPath', 'footNear', 'crankNear', 'pedalNear', crank, HIP);

    // 背景视差滚动
    $('roadDash').setAttribute('stroke-dashoffset', (travel % 80).toFixed(1));
    $('nearHills').setAttribute('transform', `translate(${-wrap(travel * 0.35, 800)} 0)`);
    $('farHills').setAttribute('transform', `translate(${-wrap(travel * 0.15, 800)} 0)`);
    $('trees').setAttribute('transform', `translate(${-wrap(travel * 0.6, 800)} 0)`);
    $('clouds').setAttribute('transform', `translate(${-wrap(t * 12 + travel * 0.05, 800)} 0)`);

    // 速度线
    const sl = $('speedLines');
    sl.setAttribute('opacity', Math.min(speed / 1.5, 1) * (0.5 + 0.4 * Math.sin(t * 20)));
    sl.setAttribute('transform', `translate(${-wrap(travel * 0.8, 60)} 0)`);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
