<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 32px 16px;
    background: linear-gradient(160deg, #dff0f7, #f6f1e3);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: #3d4a42;
  }
  h1 { margin: 0; font-size: 26px; letter-spacing: 1px; font-weight: 700; }
  .card {
    border-radius: 20px; overflow: hidden; line-height: 0;
    box-shadow: 0 24px 60px rgba(40, 60, 70, .25);
    background: #fff;
  }
  svg { width: min(92vw, 940px); height: auto; display: block; cursor: pointer; }
  .hint { margin: 0; font-size: 13px; opacity: .65; }

  /* 视差滚动层：内容以 1000px 为周期平铺，位移一个周期后无缝循环 */
  .scroll-clouds { animation: scroll 65s  linear infinite; }
  .scroll-trees  { animation: scroll 9s   linear infinite; }
  .scroll-bushes { animation: scroll 3.2s linear infinite; }
  @keyframes scroll { to { transform: translateX(-1000px); } }

  /* 路面虚线：dasharray 周期 80px，偏移 -800px 为整数周期，循环无缝 */
  .roadline { stroke-dasharray: 46 34; animation: dash 2.67s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -800px; } }
  .chain { stroke-dasharray: 5 4; animation: chainMove .86s linear infinite; }
  @keyframes chainMove { to { stroke-dashoffset: -90px; } }

  .streak { animation: streak 1.15s linear infinite; opacity: 0; }
  .streak:nth-of-type(2) { animation-delay: .38s; }
  .streak:nth-of-type(3) { animation-delay: .74s; }
  @keyframes streak {
    0%   { transform: translateX(36px);  opacity: 0; }
    18%  { opacity: .8; }
    100% { transform: translateX(-150px); opacity: 0; }
  }

  .paused * { animation-play-state: paused !important; }
  @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>
<div class="card">
<svg id="scene" viewBox="0 0 900 600" role="img" aria-label="一只白色鹈鹕骑着红色自行车、大嘴迎风的卡通动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#8ecfef"/>
      <stop offset=".7" stop-color="#cdeaf7"/>
      <stop offset="1"  stop-color="#eaf7fd"/>
    </linearGradient>

    <g id="cloud">
      <ellipse rx="36" ry="20"/>
      <ellipse cx="30"  cy="7" rx="26" ry="15"/>
      <ellipse cx="-30" cy="9" rx="24" ry="13"/>
    </g>

    <g id="tree">
      <rect x="-5" y="-48" width="10" height="48" rx="3" fill="#8a6240"/>
      <circle cy="-64" r="27" fill="#5f9e57"/>
      <circle cx="-18" cy="-50" r="17" fill="#67a75e"/>
      <circle cx="18"  cy="-52" r="17" fill="#578f4f"/>
    </g>

    <g id="bush" fill="#55884a">
      <ellipse rx="20" ry="13"/>
      <ellipse cx="-16" cy="4" rx="14" ry="9"/>
      <ellipse cx="16"  cy="4" rx="14" ry="9"/>
    </g>

    <g id="wheel">
      <circle r="57" fill="none" stroke="#35302b" stroke-width="13"/>
      <circle r="47" fill="none" stroke="#d8dadd" stroke-width="5"/>
      <g stroke="#c3c6ca" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(30)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(60)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(90)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(120)"/>
        <line x1="-45" y1="0" x2="45" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="6.5" fill="#35302b"/>
    </g>
  </defs>

  <!-- ======================= 背景 ======================= -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <g transform="translate(110 92)">
    <circle r="46" fill="#ffd166" opacity=".35"/>
    <g stroke="#ffd166" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <line x1="0" y1="-40" x2="0" y2="-52"/>
      <line x1="0" y1="-40" x2="0" y2="-52" transform="rotate(45)"/>
      <line x1="0" y1="-40" x2="0" y2="-52" transform="rotate(90)"/>
      <line x1="0" y1="-40" x2="0" y2="-52" transform="rotate(135)"/>
      <line x1="0" y1="-40" x2="0" y2="-52" transform="rotate(180)"/>
      <line x1="0" y1="-40" x2="0" y2="-52" transform="rotate(225)"/>
      <line x1="0" y1="-40" x2="0" y2="-52" transform="rotate(270)"/>
      <line x1="0" y1="-40" x2="0" y2="-52" transform="rotate(315)"/>
    </g>
    <circle r="30" fill="#ffd35e" stroke="#f2b83c" stroke-width="3"/>
  </g>

  <g class="scroll-clouds" fill="#ffffff">
    <g id="cloudRow">
      <use href="#cloud" transform="translate(160 115)" opacity=".95"/>
      <use href="#cloud" transform="translate(540 72) scale(.8)" opacity=".9"/>
      <use href="#cloud" transform="translate(820 160) scale(.6)" opacity=".8"/>
    </g>
    <use href="#cloudRow" x="1000"/>
  </g>

  <path d="M -20 472 Q 180 372 400 468 Q 560 392 720 462 Q 810 430 920 468 L 920 510 L -20 510 Z" fill="#bcd9a4"/>
  <path d="M -20 482 Q 120 420 320 478 Q 500 428 700 480 Q 800 452 920 482 L 920 520 L -20 520 Z" fill="#9cc487"/>
  <rect x="0" y="470" width="900" height="130" fill="#7fb069"/>

  <g class="scroll-trees">
    <g id="treeRow">
      <use href="#tree" x="150" y="502"/>
      <use href="#tree" x="640" y="499" transform="scale(1)"/>
      <use href="#tree" x="870" y="501"/>
    </g>
    <use href="#treeRow" x="1000"/>
  </g>

  <rect x="0" y="503" width="900" height="72" fill="#5a5f66"/>
  <line x1="0" y1="507" x2="900" y2="507" stroke="#e8e4da" stroke-width="3" opacity=".5"/>
  <line x1="0" y1="571" x2="900" y2="571" stroke="#e8e4da" stroke-width="3" opacity=".5"/>
  <path class="roadline" d="M 0 540 H 900" stroke="#f2ecd9" stroke-width="6" fill="none"/>

  <!-- 疾驰的风线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line class="streak" x1="150" y1="210" x2="205" y2="210"/>
    <line class="streak" x1="130" y1="265" x2="195" y2="265"/>
    <line class="streak" x1="155" y1="325" x2="210" y2="325"/>
  </g>

  <ellipse cx="460" cy="523" rx="215" ry="9" fill="rgba(0,0,0,.14)"/>

  <!-- ======================= 远侧（车身后面）的腿 ======================= -->
  <g id="farSide">
    <line id="crankF" x1="460" y1="468" x2="427" y2="468" stroke="#4c453f" stroke-width="7" stroke-linecap="round"/>
    <g id="pedalF"><rect x="-14" y="-4" width="28" height="8" rx="3" fill="#4c453f"/></g>
    <path id="legFo" d="" fill="none" stroke="#4a3b2a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="legFf" d="" fill="none" stroke="#d28c2c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footF">
      <path d="M -8 2 Q -8 -4 -2 -6 Q 8 -8 14 -5 L 30 -4 L 22 0 L 32 3 L 22 5 L 28 9 Q 10 9 0 8 Q -7 7 -8 2 Z"
            fill="#d28c2c" stroke="#4a3b2a" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ======================= 自行车 ======================= -->
  <g id="bike">
    <use href="#wheel" x="300" y="456"/>
    <use href="#wheel" x="620" y="456"/>
    <path d="M 300 456 L 460 468 L 432 330 L 300 456 M 434 338 L 597 336 M 460 468 L 604 356 M 594 330 L 608 366 M 608 366 L 620 456"
          fill="none" stroke="#e04f3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="456" r="9" fill="none" stroke="#3f3a35" stroke-width="4"/>
    <path class="chain" d="M 300 447 L 460 448 M 300 465 L 460 488" stroke="#2c2723" stroke-width="4" fill="none"/>
    <circle cx="460" cy="468" r="20" fill="none" stroke="#3f3a35" stroke-width="5"/>
    <circle cx="460" cy="468" r="5" fill="#3f3a35"/>
    <path d="M 404 328 Q 430 314 460 326 Q 432 340 404 328 Z" fill="#3a3430"/>
    <path d="M 601 344 L 592 310 Q 589 298 572 303" fill="none" stroke="#3a3430" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ======================= 鹈鹕（随踩踏上下起伏） ======================= -->
  <g id="pelican">
    <path d="M 374 240 L 334 210 L 352 240 L 322 226 L 348 252 L 320 248 L 352 264 L 374 262 Z"
          fill="#efe8da" stroke="#4a3b2a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 442 258 C 478 240 494 210 502 170" fill="none" stroke="#4a3b2a" stroke-width="24" stroke-linecap="round"/>
    <path d="M 442 258 C 478 240 494 210 502 170" fill="none" stroke="#faf6ee" stroke-width="17" stroke-linecap="round"/>
    <ellipse cx="408" cy="274" rx="57" ry="44" transform="rotate(-16 408 274)"
             fill="#faf6ee" stroke="#4a3b2a" stroke-width="3.5"/>
    <ellipse cx="396" cy="292" rx="38" ry="22" transform="rotate(-16 396 292)" fill="#eee4d2" opacity=".8"/>
    <path d="M 442 252 Q 388 240 358 272 Q 392 290 432 276 Q 448 266 442 252 Z"
          fill="#efe8da" stroke="#4a3b2a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 372 268 Q 398 278 424 270" fill="none" stroke="#d8cdba" stroke-width="2.5"/>
    <path d="M 378 260 Q 402 268 428 262" fill="none" stroke="#d8cdba" stroke-width="2.5"/>

    <circle cx="508" cy="152" r="21" fill="#faf6ee" stroke="#4a3b2a" stroke-width="3.5"/>
    <path d="M 500 134 Q 488 122 494 110 Q 500 122 506 114 Q 503 128 512 132 Z"
          fill="#faf6ee" stroke="#4a3b2a" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 大嘴与喉囊 -->
    <path d="M 514 150 L 648 188 C 606 212 542 206 514 150 Z"
          fill="#f9c04c" stroke="#4a3b2a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 512 142 L 650 180 Q 654 185 648 189 L 511 156 Q 505 148 512 142 Z"
          fill="#f2953f" stroke="#4a3b2a" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 526 150 L 560 158" stroke="#cf7d2e" stroke-width="2" stroke-linecap="round"/>

    <ellipse cx="514" cy="140" rx="6" ry="6.5" fill="#ffffff" stroke="#4a3b2a" stroke-width="2"/>
    <circle cx="516" cy="141" r="3" fill="#2b2b2b"/>
    <circle cx="517" cy="139" r="1" fill="#ffffff"/>
    <circle cx="514" cy="140" r="7.5" fill="#faf6ee" stroke="#4a3b2a" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.9;.93;.97;1" dur="4.6s" repeatCount="indefinite"/>
    </circle>

    <!-- 扶车把的翅膀 -->
    <path d="M 436 242 C 490 252 544 282 578 302 L 570 318 C 534 296 478 278 428 270 Z"
          fill="#efe8da" stroke="#4a3b2a" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="574" cy="308" rx="10" ry="8" transform="rotate(28 574 308)"
             fill="#efe8da" stroke="#4a3b2a" stroke-width="3"/>
  </g>

  <!-- ======================= 近侧（车身前面）的腿 ======================= -->
  <g id="nearSide">
    <line id="crankN" x1="460" y1="468" x2="493" y2="468" stroke="#2f2b28" stroke-width="7" stroke-linecap="round"/>
    <g id="pedalN"><rect x="-14" y="-4" width="28" height="8" rx="3" fill="#2f2b28"/></g>
    <path id="legNo" d="" fill="none" stroke="#4a3b2a" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="legNf" d="" fill="none" stroke="#f4a53c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="footN">
      <path d="M -8 2 Q -8 -4 -2 -6 Q 8 -8 14 -5 L 30 -4 L 22 0 L 32 3 L 22 5 L 28 9 Q 10 9 0 8 Q -7 7 -8 2 Z"
            fill="#f4a53c" stroke="#4a3b2a" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ======================= 前景 ======================= -->
  <rect x="0" y="574" width="900" height="26" fill="#6b9e55"/>
  <g class="scroll-bushes">
    <g id="bushRow">
      <use href="#bush" x="130" y="586"/>
      <use href="#bush" x="430" y="590" transform="scale(1)"/>
      <use href="#bush" x="760" y="587"/>
    </g>
    <use href="#bushRow" x="1000"/>
  </g>
</svg>
</div>
<p class="hint">纯 SVG + CSS/JS 动画 · 点击画面可暂停 / 继续</p>

<script>
  // 踩踏由 JS 驱动：脚固定在踏板圆周上，用双段反向运动学求出膝盖位置
  const BB = { x: 460, y: 468 };   // 五通（曲柄中心）
  const CRANK_R = 33;              // 曲柄半径
  const HIP = { x: 432, y: 318 };  // 髋关节（藏在身体下沿）
  const L1 = 90, L2 = 90;          // 大腿 / 小腿长度
  const CADENCE = 2 * Math.PI / 1.25; // 踏频：1.25 秒一圈

  const svg = document.getElementById('scene');
  const pelican = document.getElementById('pelican');
  const sides = [
    { crank: crankF, pedal: pedalF, legO: legFo, legF: legFf, foot: footF, phase: Math.PI },
    { crank: crankN, pedal: pedalN, legO: legNo, legF: legNf, foot: footN, phase: 0 },
  ];

  function updateSide(s, th, bob) {
    const px = BB.x + CRANK_R * Math.cos(th);
    const py = BB.y + CRANK_R * Math.sin(th);
    s.crank.setAttribute('x2', px);
    s.crank.setAttribute('y2', py);
    s.pedal.setAttribute('transform', `translate(${px} ${py})`);

    const ankle = { x: px - 6, y: py - 13 };       // 脚掌踩在踏板上沿
    const hip = { x: HIP.x, y: HIP.y + bob };
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const d = Math.hypot(dx, dy);
    const dm = Math.min(d, L1 + L2 - 2);
    const ux = dx / d, uy = dy / d;
    const a = (L1 * L1 - L2 * L2 + dm * dm) / (2 * dm);
    const h = Math.sqrt(Math.max(9, L1 * L1 - a * a));
    const kx = hip.x + a * ux + h * uy;            // 膝盖偏向行进方向
    const ky = hip.y + a * uy - h * ux;
    const path = `M ${hip.x} ${hip.y} L ${kx.toFixed(1)} ${ky.toFixed(1)} L ${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}`;
    s.legO.setAttribute('d', path);
    s.legF.setAttribute('d', path);
    s.foot.setAttribute('transform',
      `translate(${ankle.x.toFixed(1)} ${ankle.y.toFixed(1)}) rotate(${(10 * Math.sin(th)).toFixed(1)})`);
  }

  function draw(t) {
    const th = t * CADENCE;
    const bob = Math.sin(th * 2) * 2;              // 身体随踩踏轻微起伏
    pelican.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    for (const s of sides) updateSide(s, th + s.phase, bob);
  }

  let paused = false, simT = 0, lastTs = null;
  svg.addEventListener('click', () => {
    paused = !paused;
    svg.classList.toggle('paused', paused);
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
  });

  draw(0.35);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    svg.pauseAnimations();                          // 尊重系统的减少动态设置，保留静态画面
  } else {
    requestAnimationFrame(function frame(ts) {
      if (lastTs !== null && !paused) simT += (ts - lastTs) / 1000;
      lastTs = ts;
      draw(simT);
      requestAnimationFrame(frame);
    });
  }
</script>
</body>
</html>
