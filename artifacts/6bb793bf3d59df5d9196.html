<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5eb">
  <title>海风骑行记 · 鹈鹕的慢生活</title>
  <style>
    :root { color-scheme: light; --ink: #2e4947; --paper: #f7f5eb; --muted: #87928a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button { font: inherit; }
    .page { width: min(1180px, calc(100% - 80px)); margin: 0 auto; padding: 31px 0 25px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid #dfe1d4; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; letter-spacing: 2.5px; }
    .brand-mark { width: 26px; height: 26px; border: 1.5px solid var(--ink); border-radius: 50%; position: relative; }
    .brand-mark::before { content: ""; position: absolute; width: 11px; height: 7px; border: 1.5px solid var(--ink); border-radius: 9px 9px 3px 9px; top: 6px; left: 4px; transform: rotate(-15deg); }
    .brand-mark::after { content: ""; position: absolute; width: 10px; height: 3px; background: #d9a24f; top: 11px; left: 13px; border-radius: 0 100% 100% 0; }
    .edition { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 2px; color: #829087; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 32px 0 26px; }
    .eyebrow { margin: 0 0 10px; color: #a07046; font-size: 10px; letter-spacing: 3px; font-weight: 600; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: clamp(27px, 3.2vw, 39px); font-weight: 600; letter-spacing: 2px; line-height: 1.45; }
    .intro-note { margin: 0 0 5px; font-size: 12px; line-height: 1.9; letter-spacing: 1px; color: #819086; text-align: right; }
    .scene-wrap { position: relative; overflow: hidden; border-radius: 22px; background: #e1eee6; border: 1px solid #d9e3d7; }
    #scene { display: block; width: 100%; height: auto; }
    .scene-caption { position: absolute; top: 24px; left: 28px; display: flex; align-items: center; gap: 8px; color: #6c8c80; font-size: 10px; letter-spacing: 1.8px; pointer-events: none; }
    .live-dot { height: 5px; width: 5px; background: #78a28b; border-radius: 50%; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 23px 1px; }
    .playback { display: flex; align-items: center; gap: 18px; }
    .play-button { border: 0; border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 21px; background: #31584e; color: #fffdf1; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: background .2s, transform .2s; }
    .play-button:hover { background: #426e61; transform: translateY(-1px); }
    .play-icon { width: 10px; height: 12px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
    .paused .play-icon { width: 0; height: 0; border: 6px solid transparent; border-left: 9px solid currentColor; border-right: 0; margin-left: 1px; }
    .speed-button { border: 0; background: transparent; padding: 10px 4px; cursor: pointer; color: #758779; font-size: 11px; letter-spacing: 1px; }
    .speed-button span { display: inline-block; margin-left: 7px; color: #38564b; font-family: ui-monospace, monospace; }
    button:focus-visible { outline: 2px solid #d38b50; outline-offset: 5px; }
    .quote { margin: 0; color: #7e8b7f; font-size: 12px; letter-spacing: 1.5px; }
    footer { display: flex; align-items: center; justify-content: space-between; padding-top: 18px; border-top: 1px solid #dfe1d4; color: #a0a69b; font-size: 9px; letter-spacing: 1.6px; }
    .footer-right { letter-spacing: 1px; }
    @media (min-width: 1500px) { .page { padding-top: 42px; } .intro { padding-top: 40px; } }
    @media (max-width: 640px) {
      .page { width: calc(100% - 32px); padding: 21px 0; }
      .masthead { padding-bottom: 20px; } .brand { font-size: 10px; letter-spacing: 1.5px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .intro { padding: 25px 0 22px; } .intro-note { display: none; }
      .eyebrow { font-size: 8px; letter-spacing: 2.5px; } h1 { font-size: 28px; }
      .scene-wrap { border-radius: 17px; } #scene { width: 165%; max-width: none; margin-left: -32.5%; }
      .scene-caption { top: 17px; left: 18px; font-size: 8px; letter-spacing: 1px; }
      .controls { flex-wrap: wrap; justify-content: center; gap: 18px; padding: 22px 0; }
      .playback { justify-content: center; width: 100%; } .quote { font-size: 10px; }
      footer { font-size: 8px; letter-spacing: 1px; } .footer-right { letter-spacing: 0; }
    }
  </style>
</head>
<body>

    <section class="intro" aria-labelledby="title">

  <script>
    (() => {
      'use strict';
      const get = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'rider', 'pelican', 'rear-spokes', 'front-spokes', 'crank',
        'leg-front', 'leg-front-outline', 'leg-back', 'leg-back-outline',
        'foot-front', 'foot-back', 'scarf-tail', 'scarf-back', 'eye',
        'clouds', 'waves', 'roadside', 'foreground', 'gulls', 'wind-strokes', 'bike-shadow'
      ].map(id => [id, get(id)]));
      const playButton = get('play-toggle');
      const speedButton = get('speed-toggle');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speedIndex = 1;
      const speeds = [{ value: .6, label: '0.6× 慢游' }, { value: 1, label: '1× 悠闲' }, { value: 1.6, label: '1.6× 追风' }];
      let elapsed = 0;
      let previous = null;
      let frameId = null;
      const setTransform = (id, value) => parts[id].setAttribute('transform', value);

      // Inverse kinematics keeps both feet attached to opposite pedals.
      function leg(side, hipX, hipY, phase, bend) {
        const footX = 565 + Math.cos(phase) * 34;
        const footY = 516 + Math.sin(phase) * 34;
        const ankleY = footY - 7;
        const dx = footX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        const thigh = 96;
        const shin = 98;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const perpendicular = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hipX + along * dx / distance + bend * perpendicular * dy / distance;
        const kneeY = hipY + along * dy / distance - bend * perpendicular * dx / distance;
        const path = `M${hipX} ${hipY}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${footX.toFixed(2)} ${ankleY.toFixed(2)}`;
        parts[`leg-${side}`].setAttribute('d', path);
        parts[`leg-${side}-outline`].setAttribute('d', path);
        setTransform(`foot-${side}`, `translate(${footX} ${footY - 7})`);
      }

      function draw(t) {
        const phase = t * 2.65 + Math.PI * .72;
        const bob = Math.sin(phase * 2) * 1.8;
        const roll = t * 88 / 97 * 180 / Math.PI;
        setTransform('rider', `translate(0 ${Math.sin(t * 5.3) * .65})`);
        setTransform('pelican', `translate(0 ${bob})`);
        setTransform('rear-spokes', `rotate(${roll})`);
        setTransform('front-spokes', `rotate(${roll})`);
        setTransform('crank', `translate(565 516) rotate(${phase * 180 / Math.PI})`);
        leg('back', 535, 373 + bob, phase + Math.PI, 1);
        leg('front', 516, 379 + bob, phase, -1);
        const flutter = Math.sin(t * 5) * 7;
        const flutter2 = Math.sin(t * 5 - 1) * 6;
        parts['scarf-tail'].setAttribute('d', `M602 227C565 ${241 + flutter} 535 ${215 + flutter2} 478 ${236 + flutter}L491 ${246 + flutter}L487 ${255 + flutter}C535 ${235 + flutter2} 565 ${264 + flutter} 608 242Z`);
        parts['scarf-back'].setAttribute('d', `M600 228C563 ${204 - flutter2} 549 ${236 - flutter} 503 ${218 - flutter2}L510 ${235 - flutter2}C548 ${252 - flutter} 568 ${221 - flutter2} 601 246Z`);
        const blinkTime = t % 5.7;
        const eyeScale = blinkTime > 5.45 ? Math.max(.08, Math.abs(blinkTime - 5.575) / .125) : 1;
        setTransform('eye', `translate(644 168) scale(1 ${eyeScale})`);
        setTransform('clouds', `translate(${-((t * 5) % 1200)} 0)`);
        setTransform('waves', `translate(${-((t * 15) % 1200)} 0)`);
        setTransform('roadside', `translate(${-((t * 88) % 1200)} 0)`);
        setTransform('foreground', `translate(${-((t * 88) % 1200)} 0)`);
        setTransform('gulls', `translate(${Math.sin(t * .3) * 7} ${Math.sin(t * .8) * 3})`);
        parts['wind-strokes'].setAttribute('opacity', String(.35 + Math.sin(t * 3) * .18));
        parts['bike-shadow'].setAttribute('rx', String(243 + bob));
      }

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) { previous = null; return; }
        if (previous !== null) elapsed += Math.min((timestamp - previous) / 1000, .05) * speeds[speedIndex].value;
        previous = timestamp;
        draw(elapsed);
        frameId = requestAnimationFrame(tick);
      }
      function schedule() {
        if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(tick);
      }
      function updatePlayback() {
        playButton.classList.toggle('paused', !playing);
        playButton.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        get('play-label').textContent = playing ? '暂停一下' : '继续骑行';
        previous = null;
        if (!playing && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        schedule();
      }
      playButton.addEventListener('click', () => { playing = !playing; updatePlayback(); });
      speedButton.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        get('speed-label').textContent = speeds[speedIndex].label;
        speedButton.setAttribute('aria-label', `切换骑行速度，当前速度 ${speeds[speedIndex].value} 倍`);
      });
      document.addEventListener('visibilitychange', () => {
        previous = null;
        if (document.hidden && frameId !== null) { cancelAnimationFrame(frameId); frameId = null; }
        else schedule();
      });
      reducedMotion.addEventListener('change', event => { playing = !event.matches; updatePlayback(); });
      draw(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
