<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG 动画</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#87ceeb, #e0f6ff);
    font-family: sans-serif;
  }
  .stage {
    width: min(92vw, 900px);
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    border-radius: 16px;
    overflow: hidden;
    background: #fff;
  }
  svg { display: block; width: 100%; height: auto; }
  h1 { position: fixed; top: 16px; color: #2c5f7c; font-size: 18px; letter-spacing: 2px; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>
<div class="stage">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 太阳光晕 -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="60%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
    <!-- 车轮 -->
    <g id="wheel">
      <circle r="52" fill="none" stroke="#263238" stroke-width="8"/>
      <circle r="46" fill="none" stroke="#546e7a" stroke-width="2"/>
      <g stroke="#90a4ae" stroke-width="3">
        <line x1="-46" y1="0" x2="46" y2="0"/>
        <line x1="0" y1="-46" x2="0" y2="46"/>
        <line x1="-32.5" y1="-32.5" x2="32.5" y2="32.5"/>
        <line x1="-32.5" y1="32.5" x2="32.5" y2="-32.5"/>
        <line x1="-17.6" y1="-42.5" x2="17.6" y2="42.5"/>
        <line x1="-42.5" y1="-17.6" x2="42.5" y2="17.6"/>
        <line x1="-42.5" y1="17.6" x2="42.5" y2="-17.6"/>
        <line x1="-17.6" y1="42.5" x2="17.6" y2="-42.5"/>
      </g>
      <circle r="7" fill="#37474f"/>
      <circle r="3" fill="#b0bec5"/>
    </g>
    <!-- 云 -->
    <g id="cloud" fill="#ffffff" opacity="0.9">
      <ellipse cx="0" cy="0" rx="38" ry="16"/>
      <ellipse cx="-24" cy="4" rx="22" ry="11"/>
      <ellipse cx="24" cy="5" rx="24" ry="10"/>
      <ellipse cx="4" cy="-10" rx="20" ry="12"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="500" fill="url(#skyGrad)"/>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7ec8e3"/>
    <stop offset="70%" stop-color="#cdeefc"/>
    <stop offset="100%" stop-color="#eaf9ff"/>
  </linearGradient>

  <!-- 太阳 -->
  <circle cx="770" cy="85" r="60" fill="url(#sunGlow)">
    <animate attributeName="r" values="58;64;58" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="85" r="32" fill="#ffca28"/>

  <!-- 云层：两组拼接实现无缝滚动 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="24s" repeatCount="indefinite"/>
    <use href="#cloud" x="120" y="70"/>
    <use href="#cloud" x="420" y="120" transform="scale(1)"/>
    <use href="#cloud" x="680" y="60"/>
    <use href="#cloud" x="1020" y="70"/>
    <use href="#cloud" x="1320" y="120"/>
    <use href="#cloud" x="1580" y="60"/>
  </g>

  <!-- 远山 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="16s" repeatCount="indefinite"/>
    <g fill="#a5d6a7">
      <path d="M0,380 Q90,300 180,380 T360,380 T540,380 T720,380 T900,380 V420 H0 Z"/>
      <path d="M900,380 Q990,300 1080,380 T1260,380 T1440,380 T1620,380 T1800,380 V420 H900 Z"/>
    </g>
  </g>

  <!-- 草地 -->
  <rect y="400" width="900" height="100" fill="#8bc34a"/>
  <rect y="400" width="900" height="8" fill="#7cb342"/>

  <!-- 路面 -->
  <rect y="420" width="900" height="60" fill="#607d8b"/>
  <rect y="420" width="900" height="6" fill="#455a64"/>
  <!-- 路面虚线滚动 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-120 0" dur="0.5s" repeatCount="indefinite"/>
    <g stroke="#eceff1" stroke-width="6" stroke-dasharray="60 60">
      <line x1="0" y1="452" x2="1140" y2="452"/>
    </g>
  </g>

  <!-- ============ 鹈鹕 + 自行车 ============ -->
  <g transform="translate(400, 0)">
    <!-- 整体轻微颠簸 -->
    <animateTransform attributeName="transform" type="translate"
      values="400 0; 400 -3; 400 0; 400 -2; 400 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- 阴影 -->
    <ellipse cx="30" cy="474" rx="130" ry="8" fill="rgba(0,0,0,0.2)"/>

    <!-- 后轮 -->
    <g transform="translate(-60, 418)">
      <use href="#wheel">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </use>
    </g>
    <!-- 前轮 -->
    <g transform="translate(125, 418)">
      <use href="#wheel">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- 车架 -->
    <g stroke="#e53935" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M-60,418 L10,418 L60,352 L-25,352 Z"/>
      <path d="M-60,418 L-25,352"/>
      <path d="M10,418 L-25,352"/>
      <path d="M125,418 L60,352"/>
      <!-- 车把 -->
      <path d="M60,352 L72,320 L96,314" stroke="#37474f"/>
      <!-- 座管 -->
      <path d="M-25,352 L-30,332" stroke="#37474f"/>
    </g>
    <!-- 车座 -->
    <path d="M-46,330 L-14,330 Q-8,330 -10,336 L-48,336 Q-52,330 -46,330 Z" fill="#4e342e"/>

    <!-- 脚踏曲柄 + 踏板 -->
    <g transform="translate(10, 418)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <line x1="0" y1="-26" x2="0" y2="26" stroke="#37474f" stroke-width="6"/>
        <rect x="-14" y="-30" width="28" height="8" rx="3" fill="#ffb300"/>
        <rect x="-14" y="22" width="28" height="8" rx="3" fill="#ffb300"/>
      </g>
      <circle r="12" fill="#455a64"/>
      <circle r="5" fill="#b0bec5"/>
    </g>
    <!-- 链条（示意） -->
    <path d="M-60,418 L10,406 M-60,418 L10,430" stroke="#90a4ae" stroke-width="2" stroke-dasharray="4 3" fill="none"/>

    <!-- ============ 鹈鹕身体 ============ -->
    <g>
      <!-- 腿（踩踏动画：两条腿交替） -->
      <!-- 后腿 -->
      <g stroke="#f4a83d" stroke-width="9" stroke-linecap="round" fill="none">
        <path id="legBack">
          <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
            values="M-20,340 Q-2,380 10,392;
                    M-20,340 Q8,378 10,444;
                    M-20,340 Q14,392 10,418;
                    M-20,340 Q-8,384 10,392;
                    M-20,340 Q-2,380 10,392"/>
        </path>
      </g>
      <!-- 前腿 -->
      <g stroke="#ffb74d" stroke-width="10" stroke-linecap="round" fill="none">
        <path id="legFront">
          <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
            values="M-20,340 Q14,392 10,418;
                    M-20,340 Q-8,384 10,392;
                    M-20,340 Q-2,380 10,392;
                    M-20,340 Q8,378 10,444;
                    M-20,340 Q14,392 10,418"/>
        </path>
      </g>

      <!-- 尾羽 -->
      <path d="M-78,296 Q-105,290 -112,306 Q-96,308 -92,316 Q-108,318 -104,330 Q-80,328 -66,318 Z" fill="#eceff1"/>

      <!-- 身体 -->
      <ellipse cx="-28" cy="300" rx="62" ry="42" fill="#fafafa" stroke="#cfd8dc" stroke-width="2"/>
      <!-- 翅膀（拍动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 -30 292; -14 -30 292; 0 -30 292" dur="0.8s" repeatCount="indefinite"/>
        <path d="M-58,290 Q-20,268 18,292 Q-6,320 -44,314 Q-58,306 -58,290 Z" fill="#e3e8ea" stroke="#cfd8dc" stroke-width="2"/>
        <path d="M-50,294 Q-22,278 8,294" fill="none" stroke="#cfd8dc" stroke-width="3"/>
        <path d="M-48,302 Q-22,288 6,300" fill="none" stroke="#cfd8dc" stroke-width="3"/>
      </g>

      <!-- 脖子 -->
      <path d="M8,272 Q34,246 42,208" stroke="#fafafa" stroke-width="26" stroke-linecap="round" fill="none"/>
      <path d="M8,272 Q34,246 42,208" stroke="#cfd8dc" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

      <!-- 头部（轻微点头） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 44 206; 4 44 206; 0 44 206" dur="1.6s" repeatCount="indefinite"/>
        <!-- 头 -->
        <ellipse cx="46" cy="200" rx="26" ry="21" fill="#fafafa" stroke="#cfd8dc" stroke-width="2"/>
        <!-- 大喙上颌 -->
        <path d="M64,194 Q110,192 148,204 Q150,208 146,210 Q110,204 66,206 Z" fill="#f9a825"/>
        <!-- 喉囊（下喙，晃动） -->
        <path fill="#fb8c00">
          <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
            values="M64,206 Q104,206 146,210 Q120,236 88,232 Q68,226 64,206 Z;
                    M64,206 Q104,206 146,210 Q122,242 88,236 Q68,228 64,206 Z;
                    M64,206 Q104,206 146,210 Q120,236 88,232 Q68,226 64,206 Z"/>
        </path>
        <!-- 喉囊里的小鱼（彩蛋） -->
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0 0; 1 3; 0 0" dur="1.6s" repeatCount="indefinite"/>
          <path d="M96,222 q8,-5 15,0 q-7,5 -15,0 Z" fill="#4fc3f7"/>
          <path d="M111,222 l5,-4 l0,8 Z" fill="#4fc3f7"/>
          <circle cx="99.5" cy="221" r="1.2" fill="#01579b"/>
        </g>
        <!-- 眼睛 -->
        <circle cx="54" cy="193" r="5" fill="#fff" stroke="#cfd8dc"/>
        <circle cx="55.5" cy="193" r="2.6" fill="#263238">
          <animate attributeName="cx" values="55.5;54.5;55.5" dur="3s" repeatCount="indefinite"/>
        </circle>
        <!-- 头顶羽冠 -->
        <path d="M36,182 Q32,172 38,168 M44,180 Q43,170 50,167" stroke="#eceff1" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 翅膀尖握把处的手臂示意 -->
      <path d="M6,286 Q40,300 74,316" stroke="#e3e8ea" stroke-width="12" stroke-linecap="round" fill="none"/>
      <circle cx="76" cy="316" r="6" fill="#f4a83d"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="200" y1="300" x2="260" y2="300">
      <animate attributeName="x1" values="240;120" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="280;170" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="340" x2="250" y2="340">
      <animate attributeName="x1" values="230;100" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="270;160" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="210" y1="255" x2="265" y2="255">
      <animate attributeName="x1" values="250;140" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="290;190" dur="0.55s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.55s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 路边小花（滚动） -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="4s" repeatCount="indefinite"/>
    <g>
      <g transform="translate(80,490)"><circle r="4" fill="#ff8a80"/><circle cx="5" cy="-3" r="4" fill="#ff8a80"/><circle cx="-5" cy="-3" r="4" fill="#ff8a80"/><circle r="2.5" fill="#fff176"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
      <g transform="translate(330,492)"><circle r="4" fill="#b388ff"/><circle cx="5" cy="-3" r="4" fill="#b388ff"/><circle cx="-5" cy="-3" r="4" fill="#b388ff"/><circle r="2.5" fill="#fff176"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
      <g transform="translate(610,488)"><circle r="4" fill="#ffd54f"/><circle cx="5" cy="-3" r="4" fill="#ffd54f"/><circle cx="-5" cy="-3" r="4" fill="#ffd54f"/><circle r="2.5" fill="#ff8a65"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
      <g transform="translate(820,491)"><circle r="4" fill="#80d8ff"/><circle cx="5" cy="-3" r="4" fill="#80d8ff"/><circle cx="-5" cy="-3" r="4" fill="#80d8ff"/><circle r="2.5" fill="#fff176"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
      <!-- 第二组用于无缝循环 -->
      <g transform="translate(980,490)"><circle r="4" fill="#ff8a80"/><circle cx="5" cy="-3" r="4" fill="#ff8a80"/><circle cx="-5" cy="-3" r="4" fill="#ff8a80"/><circle r="2.5" fill="#fff176"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
      <g transform="translate(1230,492)"><circle r="4" fill="#b388ff"/><circle cx="5" cy="-3" r="4" fill="#b388ff"/><circle cx="-5" cy="-3" r="4" fill="#b388ff"/><circle r="2.5" fill="#fff176"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
      <g transform="translate(1510,488)"><circle r="4" fill="#ffd54f"/><circle cx="5" cy="-3" r="4" fill="#ffd54f"/><circle cx="-5" cy="-3" r="4" fill="#ffd54f"/><circle r="2.5" fill="#ff8a65"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
      <g transform="translate(1720,491)"><circle r="4" fill="#80d8ff"/><circle cx="5" cy="-3" r="4" fill="#80d8ff"/><circle cx="-5" cy="-3" r="4" fill="#80d8ff"/><circle r="2.5" fill="#fff176"/><line x1="0" y1="0" x2="0" y2="12" stroke="#558b2f" stroke-width="2"/></g>
    </g>
  </g>
</svg>
</div>
</body>
</html>
