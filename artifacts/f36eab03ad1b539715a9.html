<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - SVG 动画</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#87CEEB 0%, #c9e9f7 60%, #f5e6c8 60%, #e8d5a8 100%);
    font-family: sans-serif;
  }
  h1 { color: #345; font-weight: 600; }
  svg { max-width: 90vw; height: auto; }

  /* ===== 轮子旋转（以各自轮毂为原点）===== */
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ===== 踏板曲柄旋转 ===== */
  .crank-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.8s linear infinite;
  }

  /* ===== 车身整体上下颠簸 ===== */
  .rider {
    animation: bob 0.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }

  /* ===== 鹈鹕蹬腿动作：腿部摆动 ===== */
  .leg-pedal {
    transform-box: fill-box;
    transform-origin: top center;
    animation: pedal-leg 0.8s ease-in-out infinite;
  }
  .leg-pedal.delayed { animation-delay: -0.4s; }
  @keyframes pedal-leg {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(12deg); }
  }

  /* ===== 翅膀扇动 ===== */
  .wing {
    transform-box: fill-box;
    transform-origin: top left;
    animation: flap 0.8s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-14deg); }
  }

  /* ===== 头部点动 ===== */
  .head {
    transform-box: fill-box;
    transform-origin: bottom left;
    animation: nod 0.8s ease-in-out infinite;
  }
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(4deg); }
  }

  /* ===== 背景道路移动，营造前进感 ===== */
  .road-line {
    animation: road-move 0.5s linear infinite;
  }
  @keyframes road-move {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 80; }
  }

  /* ===== 云朵和树后退 ===== */
  .bg-move {
    animation: bg-scroll 8s linear infinite;
  }
  @keyframes bg-scroll {
    from { transform: translateX(900px); }
    to   { transform: translateX(-900px); }
  }
  .bg-move.slow { animation-duration: 14s; }
  .bg-move.offset { animation-delay: -4s; }
  .bg-move.offset2 { animation-delay: -7s; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车 🪽</h1>

<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== 太阳 ===== -->
  <circle cx="700" cy="70" r="40" fill="#FFD75E">
    <animate attributeName="r" values="40;44;40" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== 后退的云 ===== -->
  <g class="bg-move slow" opacity="0.9">
    <ellipse cx="100" cy="80" rx="45" ry="18" fill="white"/>
    <ellipse cx="135" cy="70" rx="35" ry="16" fill="white"/>
    <ellipse cx="65" cy="72" rx="30" ry="14" fill="white"/>
  </g>
  <g class="bg-move slow offset" opacity="0.8">
    <ellipse cx="300" cy="140" rx="40" ry="15" fill="white"/>
    <ellipse cx="335" cy="132" rx="28" ry="12" fill="white"/>
  </g>

  <!-- ===== 后退的树 ===== -->
  <g class="bg-move">
    <rect x="80" y="330" width="14" height="60" fill="#8B5A2B"/>
    <circle cx="87" cy="315" r="38" fill="#5FA463"/>
  </g>
  <g class="bg-move offset2">
    <rect x="400" y="340" width="12" height="50" fill="#8B5A2B"/>
    <circle cx="406" cy="328" r="30" fill="#6DB571"/>
  </g>

  <!-- ===== 道路 ===== -->
  <rect x="0" y="420" width="800" height="80" fill="#9aa0a6"/>
  <line x1="0" y1="455" x2="800" y2="455" stroke="#f2f2f2" stroke-width="6"
        stroke-dasharray="40 40" class="road-line"/>

  <!-- ================= 鹈鹕 + 自行车 ================= -->
  <g transform="translate(380, 250)">
   <g class="rider">

    <!-- ---- 后轮 ---- -->
    <g transform="translate(-95, 130)">
      <g class="wheel-spin">
        <circle r="62" fill="none" stroke="#333" stroke-width="9"/>
        <circle r="53" fill="none" stroke="#bbb" stroke-width="2"/>
        <g stroke="#666" stroke-width="3">
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="-35" y1="35" x2="35" y2="-35"/>
        </g>
        <circle r="7" fill="#444"/>
      </g>
    </g>

    <!-- ---- 前轮 ---- -->
    <g transform="translate(95, 130)">
      <g class="wheel-spin">
        <circle r="62" fill="none" stroke="#333" stroke-width="9"/>
        <circle r="53" fill="none" stroke="#bbb" stroke-width="2"/>
        <g stroke="#666" stroke-width="3">
          <line x1="-50" y1="0" x2="50" y2="0"/>
          <line x1="0" y1="-50" x2="0" y2="50"/>
          <line x1="-35" y1="-35" x2="35" y2="35"/>
          <line x1="-35" y1="35" x2="35" y2="-35"/>
        </g>
        <circle r="7" fill="#444"/>
      </g>
    </g>

    <!-- ---- 车架 ---- -->
    <g stroke="#D9363E" stroke-width="8" stroke-linecap="round">
      <line x1="-95" y1="130" x2="-25" y2="40"/>   <!-- 后叉到座管顶 -->
      <line x1="-95" y1="130" x2="5" y2="130"/>    <!-- 后下叉 -->
      <line x1="-25" y1="40" x2="5" y2="130"/>     <!-- 座管 -->
      <line x1="5" y1="130" x2="75" y2="35"/>      <!-- 下管 -->
      <line x1="-25" y1="40" x2="75" y2="35"/>     <!-- 上管 -->
      <line x1="75" y1="35" x2="95" y2="130"/>     <!-- 前叉 -->
    </g>

    <!-- ---- 车座 ---- -->
    <path d="M -45 35 Q -25 25 -8 36 L -45 42 Z" fill="#333"/>

    <!-- ---- 车把 ---- -->
    <g stroke="#333" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="75" y1="35" x2="72" y2="10"/>
      <path d="M 72 10 Q 60 2 48 8"/>
      <path d="M 72 10 Q 84 4 92 12"/>
    </g>

    <!-- ---- 曲柄与脚踏 ---- -->
    <g transform="translate(5, 130)">
      <g class="crank-spin">
        <line x1="0" y1="-28" x2="0" y2="28" stroke="#555" stroke-width="6"/>
        <line x1="-28" y1="0" x2="28" y2="0" stroke="#555" stroke-width="6" opacity="0"/>
        <rect x="-12" y="-33" width="24" height="7" rx="3" fill="#222"/>
        <rect x="-12" y="26" width="24" height="7" rx="3" fill="#222"/>
      </g>
      <circle r="9" fill="#555"/>
      <circle r="4" fill="#999"/>
    </g>

    <!-- ========= 鹈鹕 ========= -->
    <g transform="translate(-10, -30)">

      <!-- 后腿（远侧）-->
      <g class="leg-pedal delayed" transform="translate(0, 55)">
        <path d="M 0 0 Q 8 30 -2 58" stroke="#E8A33D" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M -2 58 l 16 4 l -16 5 z" fill="#E8A33D"/>
      </g>

      <!-- 尾巴 -->
      <path d="M -75 -25 Q -100 -35 -95 -12 Q -105 -5 -88 2 Q -75 8 -65 0 Z" fill="#F0F0F0" stroke="#ccc" stroke-width="1.5"/>

      <!-- 身体 -->
      <ellipse cx="-15" cy="-15" rx="62" ry="42" fill="#FAFAFA" stroke="#ddd" stroke-width="2" transform="rotate(-12 -15 -15)"/>

      <!-- 翅膀（近侧，扇动）-->
      <g class="wing" transform="translate(-25, -35)">
        <path d="M 0 0 Q -45 15 -60 55 Q -25 62 5 40 Q 25 22 15 2 Z" fill="#E8E8E8" stroke="#bbb" stroke-width="2"/>
        <path d="M -10 22 Q -30 32 -45 48" stroke="#bbb" stroke-width="2" fill="none"/>
        <path d="M -2 30 Q -18 40 -30 52" stroke="#bbb" stroke-width="2" fill="none"/>
      </g>

      <!-- 脖子 -->
      <path d="M 25 -40 Q 45 -75 38 -105" stroke="#FAFAFA" stroke-width="24" fill="none" stroke-linecap="round"/>

      <!-- 头 + 大嘴 -->
      <g class="head" transform="translate(38, -108)">
        <circle r="20" fill="#FAFAFA" stroke="#ddd" stroke-width="2"/>
        <!-- 上喙 -->
        <path d="M 12 -8 Q 55 -12 88 -2 Q 55 2 18 4 Z" fill="#F2A93B" stroke="#d98f1f" stroke-width="1.5"/>
        <!-- 喉囊 -->
        <path d="M 16 4 Q 52 6 86 -1 Q 60 34 24 22 Q 14 14 16 4 Z" fill="#F6C15C" stroke="#d98f1f" stroke-width="1.5">
          <animate attributeName="d"
            values="M 16 4 Q 52 6 86 -1 Q 60 34 24 22 Q 14 14 16 4 Z;
                    M 16 4 Q 52 8 86 -1 Q 62 46 24 30 Q 14 14 16 4 Z;
                    M 16 4 Q 52 6 86 -1 Q 60 34 24 22 Q 14 14 16 4 Z"
            dur="1.6s" repeatCount="indefinite"/>
        </path>
        <!-- 眼睛 -->
        <circle cx="8" cy="-6" r="4" fill="#222"/>
        <circle cx="9.5" cy="-7.5" r="1.3" fill="white"/>
        <!-- 冠羽 -->
        <path d="M -8 -16 Q -14 -28 -2 -24 Q -6 -18 0 -16 Z" fill="#F2A93B"/>
      </g>

      <!-- 前腿（近侧）-->
      <g class="leg-pedal" transform="translate(5, 55)">
        <path d="M 0 0 Q 10 30 0 60" stroke="#F0B050" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M 0 60 l 18 4 l -18 6 z" fill="#F0B050"/>
      </g>

      <!-- 翅膀尖端扶车把的小手势 -->
      <path d="M 30 -18 Q 55 -8 70 2" stroke="#E8E8E8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.0"/>
    </g>

   </g>
  </g>

  <!-- ===== 速度线 ===== -->
  <g stroke="#7aa7c0" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="200" x2="180" y2="200">
      <animate attributeName="x1" values="180;100" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="240;160" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="260" x2="160" y2="260">
      <animate attributeName="x1" values="160;80" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="220;140" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="320" x2="185" y2="320">
      <animate attributeName="x1" values="190;110" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="245;165" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

</svg>
<p style="color:#567">纯 SVG + CSS 动画 · 保存后直接用浏览器打开</p>
</body>
</html>
