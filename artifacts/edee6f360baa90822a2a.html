<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车动画</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FF);
            overflow: hidden;
        }

        .scene {
            width: 100%;
            max-width: 900px;
            height: auto;
        }

        /* Wheel rotation */
        .wheel-front, .wheel-rear {
            animation: rotate-wheel 1s linear infinite;
            transform-origin: center;
        }

        .wheel-front { transform-box: fill-box; }
        .wheel-rear { transform-box: fill-box; }

        @keyframes rotate-wheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Pedal rotation */
        .pedal-group {
            animation: rotate-wheel 1s linear infinite;
            transform-box: fill-box;
        }

        /* Pelican body bobbing */
        .pelican-group {
            animation: bob 0.5s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Wing flapping */
        .wing {
            animation: flap 0.8s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: top center;
        }

        @keyframes flap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); }
        }

        /* Road moving */
        .road-mark {
            animation: road-move 2s linear infinite;
        }

        @keyframes road-move {
            from { transform: translateX(0); }
            to { transform: translateX(-80px); }
        }

        /* Clouds moving */
        .cloud1 {
            animation: cloud-move 15s linear infinite;
        }
        .cloud2 {
            animation: cloud-move 20s linear infinite;
            animation-delay: -5s;
        }
        .cloud3 {
            animation: cloud-move 18s linear infinite;
            animation-delay: -10s;
        }

        @keyframes cloud-move {
            from { transform: translateX(900px); }
            to { transform: translateX(-200px); }
        }

        /* Sun glow */
        .sun {
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Beak pouch animation */
        .pouch {
            animation: pouch-bounce 0.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: top center;
        }

        @keyframes pouch-bounce {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.05); }
        }

        /* Head nodding */
        .head-group {
            animation: head-nod 0.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: bottom center;
        }

        @keyframes head-nod {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }
    </style>
</head>
<body>
    <svg class="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
        <!-- Sky background -->
        <rect width="900" height="600" fill="url(#sky-gradient)"/>

        <!-- Definitions -->
        <defs>
            <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#87CEEB"/>
                <stop offset="100%" style="stop-color:#E8F8FF"/>
            </linearGradient>
            <linearGradient id="beak-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#FF8C00"/>
                <stop offset="100%" style="stop-color:#FF6B00"/>
            </linearGradient>
            <radialGradient id="wheel-gradient" cx="50%" cy="50%" r="50%">
                <stop offset="70%" style="stop-color:#333"/>
                <stop offset="100%" style="stop-color:#111"/>
            </radialGradient>
        </defs>

        <!-- Sun -->
        <circle class="sun" cx="750" cy="80" r="50" fill="#FFD700" opacity="0.9"/>
        <circle cx="750" cy="80" r="40" fill="#FFF44F" opacity="0.6"/>

        <!-- Clouds -->
        <g class="cloud1" opacity="0.9">
            <ellipse cx="100" cy="80" rx="50" ry="25" fill="white"/>
            <ellipse cx="140" cy="70" rx="40" ry="20" fill="white"/>
            <ellipse cx="70" cy="75" rx="30" ry="18" fill="white"/>
        </g>
        <g class="cloud2" opacity="0.8">
            <ellipse cx="300" cy="120" rx="45" ry="22" fill="white"/>
            <ellipse cx="340" cy="110" rx="35" ry="18" fill="white"/>
            <ellipse cx="270" cy="115" rx="28" ry="16" fill="white"/>
        </g>
        <g class="cloud3" opacity="0.7">
            <ellipse cx="500" cy="60" rx="40" ry="20" fill="white"/>
            <ellipse cx="535" cy="52" rx="30" ry="16" fill="white"/>
            <ellipse cx="470" cy="56" rx="25" ry="14" fill="white"/>
        </g>

        <!-- Ground -->
        <rect x="0" y="480" width="900" height="120" fill="#4a7c3f"/>
        <rect x="0" y="480" width="900" height="10" fill="#5a9c4f"/>

        <!-- Road -->
        <rect x="0" y="490" width="900" height="60" fill="#555" rx="2"/>
        <rect x="0" y="545" width="900" height="8" fill="#666"/>

        <!-- Road markings -->
        <g class="road-mark">
            <rect x="0" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="80" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="160" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="240" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="320" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="400" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="480" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="560" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="640" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="720" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="800" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="880" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
            <rect x="960" y="517" width="40" height="4" fill="#FFD700" rx="2"/>
        </g>

        <!-- Bicycle and Pelican Group -->
        <g transform="translate(320, 280)">
            <!-- BICYCLE -->
            <!-- Rear wheel -->
            <g class="wheel-rear" transform="translate(0, 170)">
                <circle cx="0" cy="0" r="62" fill="none" stroke="#333" stroke-width="8"/>
                <circle cx="0" cy="0" r="55" fill="none" stroke="#666" stroke-width="2"/>
                <circle cx="0" cy="0" r="10" fill="#888"/>
                <circle cx="0" cy="0" r="6" fill="#555"/>
                <!-- Spokes -->
                <line x1="0" y1="-55" x2="0" y2="55" stroke="#999" stroke-width="2"/>
                <line x1="-55" y1="0" x2="55" y2="0" stroke="#999" stroke-width="2"/>
                <line x1="-39" y1="-39" x2="39" y2="39" stroke="#999" stroke-width="2"/>
                <line x1="39" y1="-39" x2="-39" y2="39" stroke="#999" stroke-width="2"/>
            </g>

            <!-- Front wheel -->
            <g class="wheel-front" transform="translate(185, 170)">
                <circle cx="0" cy="0" r="62" fill="none" stroke="#333" stroke-width="8"/>
                <circle cx="0" cy="0" r="55" fill="none" stroke="#666" stroke-width="2"/>
                <circle cx="0" cy="0" r="10" fill="#888"/>
                <circle cx="0" cy="0" r="6" fill="#555"/>
                <!-- Spokes -->
                <line x1="0" y1="-55" x2="0" y2="55" stroke="#999" stroke-width="2"/>
                <line x1="-55" y1="0" x2="55" y2="0" stroke="#999" stroke-width="2"/>
                <line x1="-39" y1="-39" x2="39" y2="39" stroke="#999" stroke-width="2"/>
                <line x1="39" y1="-39" x2="-39" y2="39" stroke="#999" stroke-width="2"/>
            </g>

            <!-- Bike frame -->
            <!-- Chain ring (center) -->
            <circle cx="75" cy="170" r="22" fill="none" stroke="#666" stroke-width="4"/>
            <circle cx="75" cy="170" r="18" fill="none" stroke="#888" stroke-width="2"/>

            <!-- Down tube -->
            <line x1="75" y1="170" x2="155" y2="90" stroke="#CC2200" stroke-width="8" stroke-linecap="round"/>
            <!-- Top tube -->
            <line x1="75" y1="170" x2="30" y2="90" stroke="#CC2200" stroke-width="8" stroke-linecap="round"/>
            <!-- Seat tube -->
            <line x1="30" y1="90" x2="50" y2="170" stroke="#CC2200" stroke-width="8" stroke-linecap="round"/>
            <!-- Chain stay -->
            <line x1="50" y1="170" x2="75" y2="170" stroke="#CC2200" stroke-width="6" stroke-linecap="round"/>
            <!-- Seat stay -->
            <line x1="30" y1="90" x2="0" y2="170" stroke="#CC2200" stroke-width="6" stroke-linecap="round"/>
            <!-- Chain stay to rear -->
            <line x1="75" y1="170" x2="0" y2="170" stroke="#CC2200" stroke-width="5" stroke-linecap="round"/>
            <!-- Head tube -->
            <line x1="155" y1="90" x2="185" y2="170" stroke="#CC2200" stroke-width="7" stroke-linecap="round"/>
            <!-- Fork -->
            <line x1="155" y1="90" x2="185" y2="110" stroke="#CC2200" stroke-width="7" stroke-linecap="round"/>
            <line x1="185" y1="110" x2="185" y2="170" stroke="#888" stroke-width="6" stroke-linecap="round"/>
            <!-- Top tube to seat -->
            <line x1="30" y1="90" x2="155" y2="90" stroke="#CC2200" stroke-width="7" stroke-linecap="round"/>

            <!-- Seat post -->
            <line x1="30" y1="90" x2="25" y2="70" stroke="#555" stroke-width="6" stroke-linecap="round"/>
            <!-- Seat -->
            <ellipse cx="25" cy="65" rx="18" ry="8" fill="#333"/>

            <!-- Handlebars -->
            <line x1="155" y1="90" x2="160" y2="70" stroke="#555" stroke-width="6" stroke-linecap="round"/>
            <path d="M 145 65 Q 160 60 175 65" fill="none" stroke="#555" stroke-width="5" stroke-linecap="round"/>
            <!-- Handlebar grips -->
            <circle cx="145" cy="65" r="4" fill="#222"/>
            <circle cx="175" cy="65" r="4" fill="#222"/>

            <!-- Chain -->
            <path d="M 75 148 L 75 148 L 0 148 A 22 22 0 0 0 0 192 L 75 192 A 22 22 0 0 0 75 148" fill="none" stroke="#444" stroke-width="3" stroke-dasharray="4,3"/>

            <!-- Pedal crank -->
            <g class="pedal-group" transform="translate(75, 170)">
                <line x1="-25" y1="0" x2="25" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
                <rect x="-30" y="-5" width="10" height="10" fill="#333" rx="2"/>
                <rect x="20" y="-5" width="10" height="10" fill="#333" rx="2"/>
            </g>

            <!-- PELICAN -->
            <g class="pelican-group">
                <!-- Tail feathers -->
                <path d="M -25 50 Q -45 40 -50 25 Q -40 35 -30 38 Q -45 28 -48 15 Q -38 28 -25 38 Q -38 20 -40 10 Q -30 25 -20 40 Z" fill="#F0F0F0" stroke="#DDD" stroke-width="1"/>

                <!-- Body -->
                <ellipse cx="15" cy="50" rx="42" ry="30" fill="#FAFAFA" stroke="#E8E8E8" stroke-width="1"/>

                <!-- Belly -->
                <ellipse cx="20" cy="58" rx="30" ry="20" fill="#F5F5F0"/>

                <!-- Wing -->
                <g class="wing">
                    <path d="M -5 35 Q 15 20 40 30 Q 50 35 45 50 Q 35 45 20 48 Q 5 50 -5 45 Z" fill="#E8E8E8" stroke="#DDD" stroke-width="1"/>
                    <path d="M 0 40 Q 15 32 35 38" fill="none" stroke="#CCC" stroke-width="1"/>
                    <path d="M 2 44 Q 18 38 32 42" fill="none" stroke="#CCC" stroke-width="1"/>
                </g>

                <!-- Neck -->
                <path d="M 35 35 Q 45 25 50 10 Q 52 0 48 -10" fill="none" stroke="#FAFAFA" stroke-width="18" stroke-linecap="round"/>
                <path d="M 35 35 Q 45 25 50 10 Q 52 0 48 -10" fill="none" stroke="#F0F0F0" stroke-width="14" stroke-linecap="round"/>

                <!-- Head -->
                <g class="head-group">
                    <ellipse cx="50" cy="-18" rx="14" ry="13" fill="#FAFAFA" stroke="#E8E8E8" stroke-width="1"/>

                    <!-- Eye -->
                    <circle cx="54" cy="-22" r="4" fill="#222"/>
                    <circle cx="55.5" cy="-23.5" r="1.5" fill="#FFF"/>

                    <!-- Eye ring -->
                    <circle cx="54" cy="-22" r="6" fill="none" stroke="#E8E8E8" stroke-width="1"/>

                    <!-- Beak - top -->
                    <path d="M 60 -18 Q 85 -22 110 -18 Q 105 -15 60 -12 Z" fill="url(#beak-gradient)" stroke="#E67300" stroke-width="1"/>
                    <!-- Beak tip hook -->
                    <path d="M 108 -19 Q 112 -18 110 -15" fill="none" stroke="#E67300" stroke-width="2"/>

                    <!-- Pouch -->
                    <g class="pouch">
                        <path d="M 60 -12 Q 80 -5 95 -10 Q 105 -12 110 -15 Q 100 -5 85 0 Q 70 2 60 -5 Z" fill="#FFB347" stroke="#E8960F" stroke-width="1" opacity="0.9"/>
                    </g>

                    <!-- Head crest -->
                    <path d="M 42 -28 Q 44 -35 48 -30 Q 46 -28 44 -27" fill="#FAFAFA" stroke="#DDD" stroke-width="0.5"/>
                </g>

                <!-- Legs -->
                <!-- Left leg -->
                <path d="M 5 70 Q 10 90 50 140 Q 55 150 65 155" fill="none" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
                <!-- Left foot on pedal -->
                <path d="M 50 170 L 60 170 L 65 172 L 58 173 L 50 173 Z" fill="#FFB347" stroke="#E8960F" stroke-width="1"/>

                <!-- Right leg -->
                <path d="M 25 72 Q 35 95 55 135 Q 60 150 100 170" fill="none" stroke="#FFB347" stroke-width="6" stroke-linecap="round"/>
                <!-- Right foot -->
                <path d="M 95 168 L 105 168 L 108 170 L 100 172 L 93 171 Z" fill="#FFB347" stroke="#E8960F" stroke-width="1"/>
            </g>
        </g>

        <!-- Grass details -->
        <g>
            <path d="M 50 490 Q 55 475 52 490 Q 58 470 54 490" stroke="#3a6c2f" stroke-width="2" fill="none"/>
            <path d="M 150 492 Q 155 478 152 492 Q 158 474 154 492" stroke="#3a6c2f" stroke-width="2" fill="none"/>
            <path d="M 600 490 Q 605 475 602 490 Q 608 470 604 490" stroke="#3a6c2f" stroke-width="2" fill="none"/>
            <path d="M 700 492 Q 705 478 702 492 Q 708 474 704 492" stroke="#3a6c2f" stroke-width="2" fill="none"/>
            <path d="M 800 490 Q 805 475 802 490" stroke="#3a6c2f" stroke-width="2" fill="none"/>

            <!-- Small flowers -->
            <circle cx="100" cy="555" r="4" fill="#FF6B9D"/>
            <circle cx="102" cy="553" r="3" fill="#FFB3C7"/>
            <circle cx="650" cy="560" r="4" fill="#FF6B9D"/>
            <circle cx="652" cy="558" r="3" fill="#FFB3C7"/>
            <circle cx="820" cy="558" r="3.5" fill="#FFE44D"/>
            <circle cx="822" cy="556" r="2.5" fill="#FFF176"/>
        </g>

        <!-- Shadow under bicycle -->
        <ellipse cx="465" cy="510" rx="120" ry="8" fill="rgba(0,0,0,0.15)"/>

        <!-- Title -->
        <text x="450" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#666" opacity="0.7">🐦 Pelican on a Bicycle 🚲</text>
    </svg>
</body>
</html>
