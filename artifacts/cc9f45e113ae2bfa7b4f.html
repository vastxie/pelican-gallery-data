<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1200px 800px at 50% 20%, #1d2a3a 0%, #0d1219 70%);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 960px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  svg { display: block; width: 100%; height: auto; background: #bfe6f8; }
  footer {
    text-align: center;
    color: #7d8fa3;
    font-size: 13px;
    padding: 12px;
    letter-spacing: .12em;
  }
</style>
</head>
<body>
<div class="card">
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只鹈鹕骑着自行车的 2D 动画">
  <title>鹈鹕骑自行车</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f0"/>
      <stop offset="0.65" stop-color="#c8ecfb"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6673"/>
      <stop offset="1" stop-color="#414b56"/>
    </linearGradient>

    <!-- 云朵 -->
    <g id="cloud" fill="#ffffff" opacity="0.92">
      <ellipse cx="0"   cy="2"   rx="58" ry="22"/>
      <ellipse cx="38"  cy="-10" rx="36" ry="19"/>
      <ellipse cx="-40" cy="-6"  rx="32" ry="16"/>
    </g>

    <!-- 路边灌木(周期 300px,用于无缝视差滚动) -->
    <g id="bush" fill="#4f7942">
      <circle cx="70" cy="522" r="16"/>
      <circle cx="86" cy="528" r="12"/>
      <circle cx="56" cy="528" r="11"/>
      <circle cx="72" cy="516" r="9" fill="#5f8f4e"/>
    </g>
  </defs>

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

  <!-- 太阳(光芒缓慢旋转) -->
  <g transform="translate(100,96)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <g stroke="#ffce3a" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-46" x2="0" y2="-62"/>
        <line x1="0" y1="-46" x2="0" y2="-62" transform="rotate(45)"/>
        <line x1="0" y1="-46" x2="0" y2="-62" transform="rotate(90)"/>
        <line x1="0" y1="-46" x2="0" y2="-62" transform="rotate(135)"/>
        <line x1="0" y1="-46" x2="0" y2="-62" transform="rotate(180)"/>
        <line x1="0" y1="-46" x2="0" y2="-62" transform="rotate(225)"/>
        <line x1="0" y1="-46" x2="0" y2="-62" transform="rotate(270)"/>
        <line x1="0" y1="-46" x2="0" y2="-62" transform="rotate(315)"/>
      </g>
    </g>
    <circle r="36" fill="#ffd43b"/>
    <circle r="28" fill="#ffde6a"/>
  </g>

  <!-- 三朵云,不同速度飘过 -->
  <g transform="translate(0,92)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="980 0; -260 0" dur="34s" repeatCount="indefinite"/>
      <use href="#cloud"/>
    </g>
  </g>
  <g transform="translate(0,158)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="1150 0; -260 0" dur="48s" repeatCount="indefinite"/>
      <use href="#cloud" transform="scale(0.7)"/>
    </g>
  </g>
  <g transform="translate(0,60)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="1060 0; -260 0" dur="60s" repeatCount="indefinite"/>
      <use href="#cloud" transform="scale(0.55)"/>
    </g>
  </g>

  <!-- 远山(周期 600px 视差滚动) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -600 0" dur="4.5s" repeatCount="indefinite"/>
    <path fill="#b5d99c" d="M0 505
      Q80 430 170 468 Q240 497 330 470 Q420 442 480 478 Q540 505 600 505
      Q680 430 770 468 Q840 497 930 470 Q1020 442 1080 478 Q1140 505 1200 505
      Q1280 430 1370 468 Q1440 497 1530 470 Q1620 442 1680 478 Q1740 505 1800 505
      Q1880 430 1970 468 Q2040 497 2130 470 Q2220 442 2280 478 Q2340 505 2400 505
      L2400 512 L0 512 Z"/>
  </g>

  <!-- 草地 -->
  <rect x="0" y="505" width="900" height="40" fill="#7fb069"/>

  <!-- 灌木(与车速同步) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -300 0" dur="0.65s" repeatCount="indefinite"/>
    <use href="#bush" x="0"/><use href="#bush" x="300"/><use href="#bush" x="600"/>
    <use href="#bush" x="900"/><use href="#bush" x="1200"/><use href="#bush" x="1500"/>
  </g>

  <!-- 公路 -->
  <rect x="0" y="541" width="900" height="59" fill="url(#road)"/>
  <rect x="0" y="541" width="900" height="4" fill="#dfe6ee" opacity="0.85"/>
  <line x1="0" y1="574" x2="900" y2="574" stroke="#f5f6fa" stroke-width="6"
        stroke-dasharray="42 34" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="76" dur="0.165s" repeatCount="indefinite"/>
  </line>

  <!-- 车影(随骑行节奏呼吸) -->
  <ellipse cx="452" cy="560" rx="215" ry="12" fill="#000" opacity="0.13">
    <animate attributeName="opacity" values="0.10;0.16;0.10" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="250" y1="300" x2="300" y2="300">
      <animateTransform attributeName="transform" type="translate" values="0 0; -95 0" dur="0.55s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="0.55s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="240" y1="325" x2="285" y2="325">
      <animateTransform attributeName="transform" type="translate" values="0 0; -95 0" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="0.55s" begin="0.18s" repeatCount="indefinite"/>
    </line>
    <line x1="255" y1="350" x2="295" y2="350">
      <animateTransform attributeName="transform" type="translate" values="0 0; -95 0" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="0.55s" begin="0.36s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ============ 自行车 ============ -->
  <g>
    <!-- 后轮 -->
    <g transform="translate(320,465)">
      <circle r="66" fill="none" stroke="#2d3436" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#b2bec3" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <g stroke="#aab6be" stroke-width="2.5">
          <line y1="-55" y2="55"/>
          <line y1="-55" y2="55" transform="rotate(45)"/>
          <line y1="-55" y2="55" transform="rotate(90)"/>
          <line y1="-55" y2="55" transform="rotate(135)"/>
        </g>
        <circle r="7" fill="#2d3436"/>
        <circle r="2.5" fill="#dfe6ee"/>
      </g>
    </g>

    <!-- 前轮 -->
    <g transform="translate(580,465)">
      <circle r="66" fill="none" stroke="#2d3436" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#b2bec3" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
        <g stroke="#aab6be" stroke-width="2.5">
          <line y1="-55" y2="55"/>
          <line y1="-55" y2="55" transform="rotate(45)"/>
          <line y1="-55" y2="55" transform="rotate(90)"/>
          <line y1="-55" y2="55" transform="rotate(135)"/>
        </g>
        <circle r="7" fill="#2d3436"/>
        <circle r="2.5" fill="#dfe6ee"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="320" y1="465" x2="430" y2="480"/>              <!-- 后下叉 -->
      <line x1="320" y1="465" x2="400" y2="375"/>              <!-- 后上叉 -->
      <line x1="400" y1="375" x2="430" y2="480"/>              <!-- 座管 -->
      <line x1="430" y1="480" x2="548" y2="392"/>              <!-- 下管 -->
      <line x1="400" y1="375" x2="548" y2="392"/>              <!-- 上管 -->
      <line x1="548" y1="392" x2="552" y2="352" stroke-width="9"/> <!-- 头管 -->
      <line x1="548" y1="392" x2="580" y2="465" stroke-width="6"/>  <!-- 前叉 -->
    </g>

    <!-- 车座 -->
    <line x1="400" y1="378" x2="400" y2="372" stroke="#6d4c41" stroke-width="6"/>
    <ellipse cx="400" cy="372" rx="18" ry="6" fill="#6d4c41"/>

    <!-- 车把 -->
    <path d="M552 352 L552 342 Q552 332 538 332 L528 332"
          fill="none" stroke="#2d3436" stroke-width="6" stroke-linecap="round"/>
    <circle cx="528" cy="332" r="5" fill="#2d3436"/>

    <!-- 链条(流动的虚线) -->
    <circle cx="320" cy="465" r="8"  fill="none" stroke="#2d3436" stroke-width="4"/>
    <circle cx="430" cy="480" r="16" fill="none" stroke="#2d3436" stroke-width="4"/>
    <line x1="321" y1="458" x2="431" y2="465" stroke="#636e72" stroke-width="3.5"
          stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="0" to="-7" dur="0.12s" repeatCount="indefinite"/>
    </line>
    <line x1="321" y1="472" x2="431" y2="495" stroke="#636e72" stroke-width="3.5"
          stroke-dasharray="4 3">
      <animate attributeName="stroke-dashoffset" from="0" to="7" dur="0.12s" repeatCount="indefinite"/>
    </line>

    <!-- 曲柄与踏板 -->
    <g transform="translate(430,480)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#3d4752" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(38,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
            <rect x="-13" y="-4" width="26" height="8" rx="2.5" fill="#2d3436"/>
          </g>
        </g>
        <g transform="translate(-38,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
            <rect x="-13" y="-4" width="26" height="8" rx="2.5" fill="#2d3436"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ============ 鹈鹕 ============ -->

  <!-- 腿(两段式 IK,脚掌始终贴合踏板) -->
  <!-- 近侧腿 -->
  <g transform="translate(400,368)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
        values="-70.0;-58.7;-47.6;-38.9;-34.0;-33.2;-35.1;-39.0;-44.9;-53.1;-63.9;-76.3;-86.3;-90.3;-87.6;-80.2;-70.0"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#f08c00" stroke-width="11" stroke-linecap="round"/>
      <g transform="translate(0,80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
            values="74.9;60.8;49.2;42.7;44.0;52.6;65.4;79.8;94.3;107.5;117.9;123.3;122.2;114.9;103.4;89.5;74.9"/>
          <line x1="0" y1="0" x2="0" y2="85" stroke="#f08c00" stroke-width="9" stroke-linecap="round"/>
          <circle r="5.5" fill="#f08c00"/>
          <g transform="translate(0,85)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
                values="-4.9;-2.2;-1.5;-3.8;-10.0;-19.5;-30.3;-40.7;-49.4;-54.4;-54.0;-47.1;-35.9;-24.7;-15.7;-9.3;-4.9"/>
              <path d="M0 -4 Q14 -11 27 -4 L27 2 Q14 4 0 6 Z" fill="#f08c00"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- 远侧腿(相位相差半圈,颜色略暗) -->
  <g transform="translate(400,368)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
        values="-44.9;-53.1;-63.9;-76.3;-86.3;-90.3;-87.6;-80.2;-70.0;-58.7;-47.6;-38.9;-34.0;-33.2;-35.1;-39.0;-44.9"/>
      <line x1="0" y1="0" x2="0" y2="80" stroke="#c96e00" stroke-width="11" stroke-linecap="round"/>
      <g transform="translate(0,80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
            values="94.3;107.5;117.9;123.3;122.2;114.9;103.4;89.5;74.9;60.8;49.2;42.7;44.0;52.6;65.4;79.8;94.3"/>
          <line x1="0" y1="0" x2="0" y2="85" stroke="#c96e00" stroke-width="9" stroke-linecap="round"/>
          <circle r="5.5" fill="#c96e00"/>
          <g transform="translate(0,85)">
            <g>
              <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
                values="-49.4;-54.4;-54.0;-47.1;-35.9;-24.7;-15.7;-9.3;-4.9;-2.2;-1.5;-3.8;-10.0;-19.5;-30.3;-40.7;-49.4"/>
              <path d="M0 -4 Q14 -11 27 -4 L27 2 Q14 4 0 6 Z" fill="#c96e00"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- 身体(随踩踏节奏上下起伏) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M352 300 L288 280 L300 300 L284 314 L296 324 L352 330 Z"
          fill="#eef2f4" stroke="#cfd8dc" stroke-width="2" stroke-linejoin="round"/>

    <!-- 躯干 -->
    <ellipse cx="410" cy="320" rx="78" ry="50" transform="rotate(-14 410 320)"
             fill="#f8fafc" stroke="#cfd8dc" stroke-width="3"/>

    <!-- 翅膀(轻拍) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
        values="0 400 312; 9 400 312; 0 400 312; -5 400 312; 0 400 312"/>
      <ellipse cx="398" cy="316" rx="58" ry="32" transform="rotate(-18 398 316)"
               fill="#e9eef2" stroke="#b8c4ca" stroke-width="2"/>
      <g fill="none" stroke="#b8c4ca" stroke-width="2.5" stroke-linecap="round">
        <path d="M430 296 Q456 312 452 334"/>
        <path d="M416 302 Q440 318 438 340"/>
        <path d="M404 308 Q424 324 424 344"/>
      </g>
    </g>

    <!-- 髋部绒毛(遮住腿根) -->
    <circle cx="402" cy="366" r="13" fill="#eef2f4"/>

    <!-- 围巾(随风飘动) -->
    <path fill="#e63946" d="M452 286 Q420 276 404 292 Q430 290 452 302 Z">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
        values="M452 286 Q420 276 404 292 Q430 290 452 302 Z;
                M452 286 Q420 300 404 276 Q430 296 452 302 Z;
                M452 286 Q420 276 404 292 Q430 290 452 302 Z"/>
    </path>
    <circle cx="462" cy="290" r="7" fill="#e63946"/>

    <!-- 脖子 -->
    <path d="M464 300 Q484 272 502 246" fill="none" stroke="#cfd8dc" stroke-width="31" stroke-linecap="round"/>
    <path d="M464 300 Q484 272 502 246" fill="none" stroke="#f8fafc" stroke-width="26" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="508" cy="242" r="23" fill="#f8fafc" stroke="#cfd8dc" stroke-width="2.5"/>

    <!-- 喉囊(装着一条小鱼) -->
    <path d="M512 246 Q535 308 620 294 Q655 283 664 265 L512 246 Z" fill="#f6b93c"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.4s" repeatCount="indefinite"
        values="0 585 292; 10 585 292; 0 585 292; -8 585 292; 0 585 292"/>
      <path d="M585 292 L566 314 L580 307 L584 320 L594 300 Z" fill="#38ada9"/>
    </g>

    <!-- 上喙 -->
    <path d="M510 228 Q590 238 664 258 L664 266 Q585 250 508 246 Z"
          fill="#f08c00" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 毛线帽 -->
    <path d="M488 230 Q508 196 528 228 Z" fill="#e63946"/>
    <circle cx="508" cy="198" r="6.5" fill="#ffffff"/>

    <!-- 眼睛 -->
    <circle cx="514" cy="238" r="5" fill="#263238"/>
    <circle cx="516" cy="236" r="1.8" fill="#ffffff"/>
  </g>

  <!-- 标题 -->
  <text x="450" y="46" text-anchor="middle" font-size="30" font-weight="700"
        font-family="'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif"
        fill="#22577a" opacity="0.9">🚲 鹈鹕骑行 · Pelican Ride</text>
</svg>
<footer>纯 SVG + SMIL 动画 · 无 JavaScript · 双腿 IK 踩踏 · 视差滚动背景</footer>
</div>
</body>
</html>
