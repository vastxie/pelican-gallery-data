<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1b2733;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 {
    color: #eaf2f8;
    font-size: 20px;
    font-weight: 500;
    margin: 18px 0 10px;
    letter-spacing: 2px;
  }
  .stage {
    width: min(94vw, 900px);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    background: #dff3ff;
  }
  svg { display: block; width: 100%; height: auto; }
  p.caption {
    color: #93a5b3;
    font-size: 13px;
    margin: 12px 0 24px;
  }
</style>
</head>
<body>
<h1>鹈鹕骑自行车</h1>
<div class="stage">
<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe8ff"/>
      <stop offset="70%" stop-color="#eaf8ff"/>
      <stop offset="100%" stop-color="#fdf6e3"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="100%" stop-color="#4f9fc4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b6b73"/>
      <stop offset="100%" stop-color="#42505a"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb14e"/>
      <stop offset="100%" stop-color="#ff8c3d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="900" height="450" fill="url(#sky)"/>
  <circle cx="770" cy="90" r="70" fill="url(#sunGlow)"/>
  <circle cx="770" cy="90" r="30" fill="#ffe27a"/>

  <!-- 远景云朵，缓慢漂移形成视差 -->
  <g fill="#ffffff" opacity="0.85">
    <g id="cloudsFar">
      <ellipse cx="120" cy="70" rx="38" ry="16"/>
      <ellipse cx="150" cy="60" rx="26" ry="13"/>
      <ellipse cx="420" cy="50" rx="44" ry="17"/>
      <ellipse cx="455" cy="42" rx="26" ry="12"/>
      <ellipse cx="700" cy="65" rx="34" ry="14"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -900,0" dur="40s" repeatCount="indefinite"/>
    </g>
    <g id="cloudsFarCopy">
      <ellipse cx="1020" cy="70" rx="38" ry="16"/>
      <ellipse cx="1050" cy="60" rx="26" ry="13"/>
      <ellipse cx="1320" cy="50" rx="44" ry="17"/>
      <ellipse cx="1355" cy="42" rx="26" ry="12"/>
      <ellipse cx="1600" cy="65" rx="34" ry="14"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -900,0" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远处海面 -->
  <rect x="0" y="300" width="900" height="40" fill="url(#water)" opacity="0.6"/>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <g id="waves">
      <line x1="20" y1="312" x2="60" y2="312"/>
      <line x1="140" y1="322" x2="190" y2="322"/>
      <line x1="300" y1="308" x2="345" y2="308"/>
      <line x1="480" y1="320" x2="520" y2="320"/>
      <line x1="640" y1="310" x2="690" y2="310"/>
      <line x1="800" y1="322" x2="850" y2="322"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -900,0" dur="14s" repeatCount="indefinite"/>
    </g>
    <g id="wavesCopy">
      <line x1="920" y1="312" x2="960" y2="312"/>
      <line x1="1040" y1="322" x2="1090" y2="322"/>
      <line x1="1200" y1="308" x2="1245" y2="308"/>
      <line x1="1380" y1="320" x2="1420" y2="320"/>
      <line x1="1540" y1="310" x2="1590" y2="310"/>
      <line x1="1700" y1="322" x2="1750" y2="322"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -900,0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 道路 -->
  <rect x="0" y="340" width="900" height="70" fill="url(#road)"/>
  <rect x="0" y="340" width="900" height="6" fill="#3a4750"/>
  <g fill="none" stroke="#f4d35e" stroke-width="5" stroke-dasharray="34 28" stroke-linecap="round">
    <g id="dashes">
      <line x1="-40" y1="376" x2="940" y2="376"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -186,0" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- 草地 -->
  <rect x="0" y="410" width="900" height="40" fill="#7fb069"/>
  <rect x="0" y="410" width="900" height="5" fill="#6a9a57"/>

  <!-- ============ 骑车的鹈鹕（整体沿道路循环平移） ============ -->
  <g id="rig">
    <animateTransform attributeName="transform" type="translate"
      values="-250,190; 980,190" dur="9s" repeatCount="indefinite"/>

    <!-- 地面投影 -->
    <ellipse cx="75" cy="152" rx="100" ry="9" fill="#000000" opacity="0.18"/>

    <!-- 车架（菱形结构） -->
    <g stroke="#2c3e50" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="75" y1="115" x2="38" y2="50"/>   <!-- 座管 -->
      <line x1="38" y1="50" x2="150" y2="50"/>   <!-- 上管 -->
      <line x1="150" y1="88" x2="75" y2="115"/>  <!-- 下管 -->
      <line x1="150" y1="50" x2="150" y2="88"/>  <!-- 头管 -->
      <line x1="75" y1="115" x2="0" y2="115"/>   <!-- 后叉 -->
      <line x1="38" y1="50" x2="0" y2="115"/>    <!-- 座撑 -->
      <line x1="150" y1="88" x2="150" y2="115"/> <!-- 前叉 -->
    </g>
    <!-- 车座 -->
    <ellipse cx="32" cy="47" rx="15" ry="5" fill="#20262b" transform="rotate(-12 32 47)"/>
    <!-- 车把 -->
    <g stroke="#2c3e50" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="150" y1="50" x2="150" y2="32"/>
      <line x1="130" y1="28" x2="170" y2="28"/>
    </g>
    <circle cx="130" cy="28" r="4" fill="#111"/>
    <circle cx="170" cy="28" r="4" fill="#111"/>

    <!-- 后轮 -->
    <g transform="translate(0,115)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0 0;360 0 0" dur="0.6s" repeatCount="indefinite"/>
        <circle r="35" fill="#1a1f24" stroke="#0c0f12" stroke-width="3"/>
        <circle r="35" fill="none" stroke="#8d99a3" stroke-width="2"/>
        <circle r="8" fill="#8d99a3"/>
        <g stroke="#c6cfd6" stroke-width="2">
          <line x1="0" y1="0" x2="0" y2="-35"/>
          <line x1="0" y1="0" x2="30.3" y2="-17.5"/>
          <line x1="0" y1="0" x2="30.3" y2="17.5"/>
          <line x1="0" y1="0" x2="0" y2="35"/>
          <line x1="0" y1="0" x2="-30.3" y2="17.5"/>
          <line x1="0" y1="0" x2="-30.3" y2="-17.5"/>
        </g>
      </g>
    </g>

    <!-- 前轮 -->
    <g transform="translate(150,115)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0 0;360 0 0" dur="0.6s" repeatCount="indefinite"/>
        <circle r="35" fill="#1a1f24" stroke="#0c0f12" stroke-width="3"/>
        <circle r="35" fill="none" stroke="#8d99a3" stroke-width="2"/>
        <circle r="8" fill="#8d99a3"/>
        <g stroke="#c6cfd6" stroke-width="2">
          <line x1="0" y1="0" x2="0" y2="-35"/>
          <line x1="0" y1="0" x2="30.3" y2="-17.5"/>
          <line x1="0" y1="0" x2="30.3" y2="17.5"/>
          <line x1="0" y1="0" x2="0" y2="35"/>
          <line x1="0" y1="0" x2="-30.3" y2="17.5"/>
          <line x1="0" y1="0" x2="-30.3" y2="-17.5"/>
        </g>
      </g>
    </g>

    <!-- 曲柄 + 脚踏 -->
    <g transform="translate(75,115)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0 0;360 0 0" dur="1s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="20" y2="0" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="-20" y2="0" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>
        <rect x="14" y="-4" width="14" height="8" rx="2" fill="#111"/>
        <rect x="-28" y="-4" width="14" height="8" rx="2" fill="#111"/>
      </g>
      <circle r="6" fill="#4b5b66"/>
    </g>

    <!-- 后腿（远侧，稍暗，先绘制显得更靠后） -->
    <g transform="translate(52,74)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;360" dur="1s" begin="-0.5s" repeatCount="indefinite"/>
        <path d="M0,0 Q14,20 18,34 T22,46" fill="none" stroke="#e08a2c" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="22" cy="47" rx="7" ry="4" fill="#e08a2c" transform="rotate(20 22 47)"/>
      </g>
    </g>

    <!-- ============ 鹈鹕主体（含轻微上下颠簸） ============ -->
    <g id="pelicanBob">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-3; 0,0; 0,2; 0,0" keyTimes="0;0.25;0.5;0.75;1"
        dur="1s" repeatCount="indefinite"/>

      <!-- 尾羽 -->
      <path d="M18,52 C2,50 -14,58 -22,70 C-8,66 6,64 20,60 Z" fill="#e7e1d3" stroke="#c9c2ae" stroke-width="1.5"/>

      <!-- 身体 -->
      <path d="M15,68 C-15,64 -28,32 -14,4 C-2,-20 34,-32 62,-22
               C88,-13 92,14 80,36 C70,55 42,72 15,68 Z"
            fill="#f7f2e5" stroke="#d8d0ba" stroke-width="2"/>

      <!-- 翅膀（扇动） -->
      <g transform="translate(46,10)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-8;18;-8" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>
          <path d="M-6,-24 C18,-30 40,-14 38,10 C36,28 14,38 -8,34
                   C2,20 8,4 4,-10 C1,-18 -3,-22 -6,-24 Z"
                fill="#dcd5c2" stroke="#bdb49a" stroke-width="2"/>
          <path d="M-4,30 L-16,40 M6,32 L-2,44 M16,26 L12,40" stroke="#bdb49a" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>

      <!-- 头 + 脖子 -->
      <path d="M62,-22 C78,-34 82,-52 74,-64 C92,-60 104,-46 100,-30 C97,-18 84,-10 70,-12 Z"
            fill="#f7f2e5" stroke="#d8d0ba" stroke-width="2"/>
      <circle cx="86" cy="-46" r="15" fill="#f7f2e5" stroke="#d8d0ba" stroke-width="2"/>

      <!-- 喉囊 -->
      <path d="M92,-40 C108,-34 122,-22 118,-6 C112,-10 98,-16 90,-22 C86,-28 88,-36 92,-40 Z"
            fill="#ffce85"/>

      <!-- 喙（上颚，随呼吸轻微开合） -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 86 -46; -3 86 -46; 0 86 -46" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite"/>
        <path d="M95,-52 C130,-56 165,-50 182,-40 C160,-38 128,-40 96,-40 Z" fill="url(#beakGrad)" stroke="#e07a1f" stroke-width="1.5"/>
      </g>
      <!-- 喙（下颚） -->
      <path d="M95,-40 C126,-38 156,-32 178,-24 C150,-24 120,-28 94,-32 Z" fill="#ffb14e" stroke="#e07a1f" stroke-width="1.5"/>

      <!-- 眼睛 -->
      <circle cx="90" cy="-52" r="4.2" fill="#2c2c2c"/>
      <circle cx="91.3" cy="-53.3" r="1.3" fill="#ffffff"/>

      <!-- 前腿（近侧，覆盖在身体前，颜色更亮） -->
      <g transform="translate(58,78)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0;360" dur="1s" repeatCount="indefinite"/>
          <path d="M0,0 Q16,18 20,32 T24,44" fill="none" stroke="#ff9d3d" stroke-width="8" stroke-linecap="round"/>
          <ellipse cx="24" cy="45" rx="8" ry="4.5" fill="#ff9d3d" transform="rotate(20 24 45)"/>
          <path d="M18,46 l6,4 M24,47 l7,2 M30,44 l6,-1" stroke="#ff9d3d" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
</div>
<p class="caption">SVG + SMIL 动画 · 车轮转动、曲柄带动双腿踩踏、翅膀振动、整车沿海滨小路循环骑行</p>
</body>
</html>
