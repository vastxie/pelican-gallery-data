<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海边慢骑 · SVG Animation</title>
<style>
  :root{
    --paper:#f3ead9;
    --ink:#294b50;
    --muted:#6c7d78;
    --coral:#e75950;
    --cream:#fff9ec;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.9), transparent 30%),
      radial-gradient(circle at 85% 88%, rgba(231,89,80,.07), transparent 32%),
      radial-gradient(#d6c7ad .7px, transparent .8px);
    background-size:auto, auto, 18px 18px;
    color:var(--ink);
    font-family:"Avenir Next", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(14px, 3vh, 32px) 0;
  }
  .shell{
    width:min(1160px, 94vw);
    margin:auto;
  }
  .topbar, .foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:0 8px;
    font-size:10px;
    font-weight:650;
    line-height:1.4;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .topbar{padding-bottom:12px}
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--ink);
    letter-spacing:.22em;
  }
  .brand-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--coral);
    box-shadow:0 0 0 4px rgba(231,89,80,.12);
  }
  .meta{white-space:nowrap}
  .stage{
    position:relative;
    border-radius:clamp(16px, 2vw, 28px);
    overflow:hidden;
    background:#cfe6e4;
    box-shadow:
      0 30px 70px -30px rgba(46,72,73,.45),
      0 4px 18px -8px rgba(46,72,73,.2),
      inset 0 0 0 1px rgba(255,255,255,.42);
    isolation:isolate;
  }
  .stage svg{display:block;width:100%;height:auto}
  .stage::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
    background:linear-gradient(180deg, rgba(255,255,255,.09), transparent 18% 82%, rgba(87,56,26,.04));
    z-index:1;
  }
  .motion-toggle{
    position:absolute;
    z-index:3;
    right:clamp(14px, 2.4vw, 26px);
    bottom:clamp(14px, 2.4vw, 26px);
    display:inline-flex;
    align-items:center;
    gap:9px;
    min-height:38px;
    padding:9px 15px 9px 12px;
    border:1px solid rgba(44,76,79,.12);
    border-radius:999px;
    background:rgba(255,249,236,.8);
    color:var(--ink);
    font:650 11px/1 "Avenir Next", "PingFang SC", sans-serif;
    letter-spacing:.14em;
    cursor:pointer;
    box-shadow:0 8px 24px -12px rgba(31,58,61,.4), inset 0 1px 0 rgba(255,255,255,.85);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:transform .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .motion-toggle:hover{
    transform:translateY(-1px);
    background:rgba(255,249,236,.95);
    box-shadow:0 12px 28px -12px rgba(31,58,61,.48), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .motion-toggle:focus-visible{
    outline:3px solid rgba(231,89,80,.45);
    outline-offset:3px;
  }
  .toggle-icon{
    position:relative;
    display:block;
    width:15px;height:15px;
    border-radius:50%;
    background:var(--coral);
    box-shadow:inset 0 0 0 1px rgba(98,31,29,.12);
    flex:none;
  }
  .toggle-icon::before,
  .toggle-icon::after{
    content:"";
    position:absolute;
    top:4px;
    width:2px;height:7px;
    border-radius:2px;
    background:#fff9ec;
    transition:all .2s ease;
  }
  .toggle-icon::before{left:5px}
  .toggle-icon::after{right:5px}
  .is-paused .toggle-icon::before{
    left:5.5px;top:4.4px;height:0;width:0;
    border-top:3.6px solid transparent;
    border-bottom:3.6px solid transparent;
    border-left:5.5px solid #fff9ec;
    background:transparent;
    border-radius:0;
  }
  .is-paused .toggle-icon::after{opacity:0}
  .foot{
    padding-top:12px;
    text-transform:none;
    letter-spacing:.06em;
    font-weight:500;
    font-size:11px;
  }
  .foot .zh{color:#4e6668;font-weight:600;letter-spacing:.18em}
  .foot .hint{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .key{
    display:inline-block;
    padding:3px 6px 4px;
    border:1px solid rgba(66,91,90,.22);
    border-bottom-width:2px;
    border-radius:5px;
    background:rgba(255,255,255,.28);
    font-size:9px;
    line-height:1;
    letter-spacing:.05em;
    color:#4e6668;
  }
  kbd{font:inherit}

  /* ---------- ambient motion ---------- */
  .cloud-band{animation:cloudDrift 76s linear infinite}
  .sun-rays{animation:rayTurn 80s linear infinite;transform-box:view-box;transform-origin:812px 106px}
  .wave-band-far{animation:waveDrift 24s linear infinite}
  .wave-band-near{animation:waveDrift 13s linear infinite}
  .road-dashes{animation:roadDrift .58s linear infinite}
  .pebble-band{animation:roadDrift 2.8s linear infinite}
  .birds{animation:birdSway 9s ease-in-out infinite}
  .sailboat{animation:boatBob 4.8s ease-in-out infinite;transform-box:view-box;transform-origin:770px 345px}
  .reflection{animation:shimmer 5.5s ease-in-out infinite}
  .lighthouse-light{animation:lighthousePulse 6s ease-in-out infinite}
  .smoke{animation:smokeRise 7s ease-in-out infinite}
  .rider-bob{animation:bob 1.75s ease-in-out infinite;transform-box:view-box;transform-origin:500px 470px}
  .head-bob{animation:headBob 1.75s ease-in-out infinite;transform-box:view-box;transform-origin:564px 260px}
  .wing-bob{animation:wingBob 1.75s ease-in-out infinite;transform-box:view-box;transform-origin:530px 272px}
  .scarf-a{animation:scarfA 2.3s ease-in-out infinite;transform-box:view-box;transform-origin:541px 267px}
  .scarf-b{animation:scarfB 2.75s ease-in-out infinite;transform-box:view-box;transform-origin:541px 274px}
  .eye{animation:blink 6.8s infinite;transform-box:fill-box;transform-origin:center}
  .grass-left{animation:grassSway 5.4s ease-in-out infinite;transform-box:view-box;transform-origin:60px 580px}
  .grass-right{animation:grassSway 6.4s ease-in-out infinite reverse;transform-box:view-box;transform-origin:930px 585px}
  .fish-tail-a{animation:fishWag 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .fish-tail-b{animation:fishWag 2.2s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:50% 100%}
  .speed-line{animation:speedZip 1.8s ease-in-out infinite}
  .speed-line.delay{animation-delay:-.6s}
  .speed-line.delay2{animation-delay:-1.2s}

  @keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
  @keyframes rayTurn{to{transform:rotate(360deg)}}
  @keyframes waveDrift{to{transform:translateX(-160px)}}
  @keyframes roadDrift{to{transform:translateX(-112px)}}
  @keyframes birdSway{0%,100%{transform:translate(0,0)}50%{transform:translate(-9px,5px)}}
  @keyframes boatBob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(4px) rotate(.7deg)}}
  @keyframes shimmer{0%,100%{opacity:.34}50%{opacity:.72}}
  @keyframes lighthousePulse{0%,100%{opacity:.12}50%{opacity:.3}}
  @keyframes smokeRise{0%{opacity:0;transform:translate(0,5px) scale(.7)}35%{opacity:.35}100%{opacity:0;transform:translate(-12px,-17px) scale(1.15)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.7px)}}
  @keyframes headBob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-1.1px) rotate(.55deg)}}
  @keyframes wingBob{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-.7deg)}}
  @keyframes scarfA{0%,100%{transform:rotate(-1.2deg) skewY(-1deg)}50%{transform:rotate(4deg) skewY(2.5deg)}}
  @keyframes scarfB{0%,100%{transform:rotate(2deg) skewY(1.4deg)}50%{transform:rotate(-3.5deg) skewY(-2deg)}}
  @keyframes blink{0%,92%,96%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
  @keyframes grassSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(2deg)}}
  @keyframes fishWag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(10deg)}}
  @keyframes speedZip{0%{opacity:0;transform:translateX(16px)}22%{opacity:.55}60%{opacity:.25}100%{opacity:0;transform:translateX(-22px)}}

  .is-paused *{animation-play-state:paused!important}
  @media (prefers-reduced-motion: reduce){
    .stage:not(.is-playing) *{animation-duration:.001ms!important;animation-iteration-count:1!important}
  }
  @media (max-width:640px){
    .topbar .meta{display:none}
    .foot .hint{display:none}
    .motion-toggle{min-height:34px;padding:8px 12px 8px 10px;font-size:10px}
    .foot{font-size:10px}
  }
</style>

<body>
<div class="shell">

          <rect x="-15" y="-3.5" width="30" height="8" rx="3" fill="#31464b"/>
          <rect x="-12" y="-3" width="24" height="2" rx="1" fill="#8fa19c" opacity=".55"/>
        </g>

        <!-- NEAR LEG -->
        <g id="near-leg">
          <path id="near-thigh" fill="none" stroke="#d98b31" stroke-width="15" stroke-linecap="round"/>
          <path id="near-shin" fill="none" stroke="#f0a33d" stroke-width="10" stroke-linecap="round"/>
          <circle id="near-knee" r="6.5" fill="#eda03a"/>
        </g>
        <g id="near-foot" transform="translate(500 516)">
          <path d="M-12 1c4-6 11-9 20-8 8 1 15 5 18 9-3 5-12 8-23 7-7-1-13-3-15-8Z" fill="#f0a33d" stroke="#cc7f28" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M-3 2c6 1 13 1 20 0" fill="none" stroke="#ffd28a" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        </g>
        <g id="far-foot" transform="translate(500 448)">
          <path d="M-11 1c4-5 10-8 18-7 7 1 13 4 16 8-3 4-11 7-21 6-7-1-11-3-13-7Z" fill="#cf892f" stroke="#ab6e27" stroke-width="1.4" stroke-linejoin="round"/>
        </g>

        <!-- HIP FEATHER TUFT -->
        <path d="M461 330c7-9 22-10 32-2 5 4 1 10-6 11-10 2-22-2-26-9Z" fill="#f8f6eb" stroke="#d9e3df" stroke-width="1.4"/>
        <path d="M475 329c4-3 10-3 14 0" fill="none" stroke="#cbd9d6" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </svg>

    <button class="motion-toggle" id="motionToggle" type="button" aria-pressed="false" aria-label="暂停动画">
      <span class="toggle-icon" aria-hidden="true"></span>
      <span class="toggle-label">暂停</span>
    </button>
  </main>

  <footer class="foot">
    <span class="zh">海边慢骑 · 一只鹈鹕的下午</span>
    <span class="hint"><span class="key">SPACE</span> 暂停 / 播放</span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const artwork = document.getElementById('artwork');
  const stage = document.getElementById('stage');
  const toggle = document.getElementById('motionToggle');
  const toggleLabel = toggle.querySelector('.toggle-label');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let paused = reduceMotion;
  let lastTime = performance.now();
  let elapsed = 0;

  const BB = { x: 500, y: 486 };
  const CRANK_R = 34;
  const CADENCE = 1.55; // seconds per pedal revolution
  const WHEEL_TURN = 1.15; // seconds per wheel revolution

  const nearHip = { x: 484, y: 341 };
  const farHip = { x: 467, y: 338 };
  const nearL1 = 93;
  const nearL2 = 101;
  const farL1 = 91;
  const farL2 = 99;

  const $ = (id) => document.getElementById(id);
  const nearThigh = $('near-thigh');
  const nearShin = $('near-shin');
  const nearKnee = $('near-knee');
  const farThigh = $('far-thigh');
  const farShin = $('far-shin');
  const farKnee = $('far-knee');
  const nearFoot = $('near-foot');
  const farFoot = $('far-foot');
  const nearPedal = $('near-pedal');
  const farPedal = $('far-pedal');
  const nearCrankArm = $('near-crank-arm');
  const farCrankArm = $('far-crank-arm');
  const rearWheelSpin = $('rear-wheel-spin');
  const frontWheelSpin = $('front-wheel-spin');
  const chainDashes = $('chain-dashes');

  const round = (n) => Math.round(n * 100) / 100;

  function solveKnee(hip, foot, l1, l2) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    const clampedD = Math.min(d, l1 + l2 - 0.01);
    const ux = dx / d;
    const uy = dy / d;
    const a = (l1 * l1 - l2 * l2 + clampedD * clampedD) / (2 * clampedD);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    // Pick the knee that points forward (to the right), like a cyclist.
    const k1 = { x: hip.x + ux * a - uy * h, y: hip.y + uy * a + ux * h };
    const k2 = { x: hip.x + ux * a + uy * h, y: hip.y + uy * a - ux * h };
    return k1.x > k2.x ? k1 : k2;
  }

  function drawLeg(hip, angle, thighEl, shinEl, kneeEl, footEl, pedalEl, crankEl, l1, l2, shade) {
    const pedal = {
      x: BB.x + Math.cos(angle) * CRANK_R,
      y: BB.y + Math.sin(angle) * CRANK_R
    };
    const ankle = { x: pedal.x + 1, y: pedal.y - 4 };
    const knee = solveKnee(hip, ankle, l1, l2);

    thighEl.setAttribute('d', `M${round(hip.x)} ${round(hip.y)} L${round(knee.x)} ${round(knee.y)}`);
    shinEl.setAttribute('d', `M${round(knee.x)} ${round(knee.y)} L${round(ankle.x)} ${round(ankle.y)}`);
    kneeEl.setAttribute('cx', round(knee.x));
    kneeEl.setAttribute('cy', round(knee.y));
    footEl.setAttribute('transform', `translate(${round(pedal.x)} ${round(pedal.y - 4)})`);
    pedalEl.setAttribute('transform', `translate(${round(pedal.x)} ${round(pedal.y + 1)})`);
    crankEl.setAttribute('x2', round(pedal.x));
    crankEl.setAttribute('y2', round(pedal.y));
  }

  function render(timeSeconds) {
    const wheelAngle = (timeSeconds / WHEEL_TURN) * 360;
    rearWheelSpin.setAttribute('transform', `rotate(${round(wheelAngle)} 355 465)`);
    frontWheelSpin.setAttribute('transform', `rotate(${round(wheelAngle)} 655 465)`);

    const crankAngle = (timeSeconds / CADENCE) * Math.PI * 2 - 0.55;
    drawLeg(nearHip, crankAngle, nearThigh, nearShin, nearKnee, nearFoot, nearPedal, nearCrankArm, nearL1, nearL2, false);
    drawLeg(farHip, crankAngle + Math.PI, farThigh, farShin, farKnee, farFoot, farPedal, farCrankArm, farL1, farL2, true);

    chainDashes.setAttribute('stroke-dashoffset', round(-(timeSeconds * 42) % 8));
  }

  function tick(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    if (!paused) {
      elapsed += dt;
      render(elapsed);
    }
    requestAnimationFrame(tick);
  }

  function setPaused(next) {
    paused = next;
    stage.classList.toggle('is-paused', paused);
    stage.classList.toggle('is-playing', !paused);
    toggle.setAttribute('aria-pressed', String(paused));
    toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
    toggleLabel.textContent = paused ? '播放' : '暂停';
    lastTime = performance.now();
  }

  toggle.addEventListener('click', () => setPaused(!paused));

  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space' && event.target === document.body) {
      event.preventDefault();
      setPaused(!paused);
    }
  });

  setPaused(paused);
  render(elapsed);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
