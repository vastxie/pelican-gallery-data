<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;background:#bfe8ff}
  svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8f5"/><stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="55" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="50" fill="none" stroke="#888" stroke-width="1"/>
      <g stroke="#666" stroke-width="1.5">
        <line x1="-50" x2="50"/><line y1="-50" y2="50"/>
        <line x1="-35" y1="-35" x2="35" y2="35"/><line x1="-35" y1="35" x2="35" y2="-35"/>
      </g>
      <circle r="5" fill="#444"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="40" fill="#ffe66d"/>

  <!-- clouds -->
  <g fill="#fff" opacity=".9">
    <g><ellipse cx="0" cy="0" rx="50" ry="16"/><ellipse cx="25" cy="-12" rx="30" ry="16"/>
      <ellipse cx="-25" cy="-8" rx="25" ry="12"/>
      <animateTransform attributeName="transform" type="translate" from="-100 90" to="900 90" dur="45s" repeatCount="indefinite"/></g>
    <g><ellipse cx="0" cy="0" rx="40" ry="13"/><ellipse cx="20" cy="-10" rx="25" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="-100 160" to="900 160" dur="30s" begin="-15s" repeatCount="indefinite"/></g>
  </g>

  <!-- distant hills -->
  <path d="M0 360 Q120 290 250 350 T520 340 T800 350 V500 H0Z" fill="#9fd58c"/>

  <!-- ground -->
  <rect y="410" width="800" height="90" fill="#6cbf5a"/>
  <rect y="410" width="800" height="6" fill="#58a848"/>
  <!-- scrolling road dashes -->
  <rect y="440" width="800" height="60" fill="#666"/>
  <g stroke="#fff" stroke-width="5" stroke-dasharray="40 40">
    <line x1="-80" y1="470" x2="880" y2="470">
      <animate attributeName="x1" from="0" to="-80" dur=".5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="960" to="880" dur=".5s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- scrolling trees -->
  <g>
    <g id="trees">
      <g transform="translate(100 410)"><rect x="-5" y="-50" width="10" height="50" fill="#7a5230"/><circle cy="-70" r="32" fill="#3f9a4a"/></g>
      <g transform="translate(400 410)"><rect x="-5" y="-40" width="10" height="40" fill="#7a5230"/><circle cy="-58" r="26" fill="#4aa956"/></g>
      <g transform="translate(650 410)"><rect x="-5" y="-55" width="10" height="55" fill="#7a5230"/><circle cy="-78" r="35" fill="#3f9a4a"/></g>
    </g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <use href="#trees" transform="translate(800 0)">
  </use>

  <!-- bike + pelican, bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".5s" repeatCount="indefinite"/>

    <!-- wheels -->
    <g transform="translate(300 400)"><use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/></use></g>
    <g transform="translate(500 400)"><use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/></use></g>

    <!-- frame -->
    <g stroke="#d62828" stroke-width="7" stroke-linecap="round" fill="none" stroke-linejoin="round">
      <path d="M300 400 L370 400 L340 320 Z"/>
      <path d="M370 400 L440 320 L340 320"/>
      <path d="M440 320 L500 400"/>
      <path d="M440 320 L430 295"/>
    </g>
    <!-- seat & handle -->
    <path d="M322 312 H358" stroke="#222" stroke-width="9" stroke-linecap="round"/>
    <path d="M425 292 H455" stroke="#222" stroke-width="6" stroke-linecap="round"/>

    <!-- pedals / crank -->
    <circle cx="370" cy="400" r="12" fill="#999" stroke="#333" stroke-width="3"/>
    <g transform="translate(370 400)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" additive="sum" repeatCount="indefinite"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <rect x="-10" y="-34" width="20" height="6" fill="#111">
        <animateTransform attributeName="transform" type="rotate" from="0 0 -31" to="-360 0 -31" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="-10" y="28" width="20" height="6" fill="#111">
        <animateTransform attributeName="transform" type="rotate" from="0 0 31" to="-360 0 31" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- pelican -->
    <!-- tail -->
    <path d="M325 300 L290 285 L300 312 Z" fill="#ddd"/>
    <!-- legs (animated with crank) -->
    <g stroke="#f4a300" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M345 305 L370 400">
        <animate attributeName="d" dur="1s" repeatCount="indefinite"
          values="M345 305 L385 350 L370 370;M345 305 L375 345 L370 430;M345 305 L365 350 L370 370;M345 305 L385 350 L370 370"/>
      </path>
      <path d="M345 305 L370 400" opacity=".7">
        <animate attributeName="d" dur="1s" repeatCount="indefinite"
          values="M345 305 L375 345 L370 430;M345 305 L365 350 L370 370;M345 305 L385 350 L370 370;M345 305 L375 345 L370 430"/>
      </path>
    </g>
    <!-- body -->
    <ellipse cx="350" cy="275" rx="52" ry="34" fill="#fff" stroke="#ccc" stroke-width="2" transform="rotate(-10 350 275)"/>
    <!-- wing reaching handlebar -->
    <path d="M350 265 Q395 275 435 292" stroke="#e8e8e8" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M350 265 Q395 275 435 292" stroke="#bbb" stroke-width="2" stroke-linecap="round" fill="none" transform="translate(0 6)"/>
    <!-- neck -->
    <path d="M380 258 Q415 235 405 200" stroke="#fff" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 405 200;2 405 200;-2 405 200" dur=".5s" repeatCount="indefinite"/>
      <circle cx="408" cy="193" r="19" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
      <!-- beak -->
      <path d="M420 190 L500 196 Q470 232 425 208 Z" fill="#f6b02e" stroke="#d9901a" stroke-width="2"/>
      <path d="M422 200 L498 198" stroke="#d9901a" stroke-width="2"/>
      <!-- eye -->
      <circle cx="412" cy="186" r="4.5" fill="#111"/><circle cx="413.5" cy="184.5" r="1.4" fill="#fff"/>
      <!-- helmet -->
      <path d="M388 190 Q392 160 420 166 Q432 172 428 184 Z" fill="#2a9df4" stroke="#1673b8" stroke-width="2"/>
      <!-- head feather -->
      <path d="M392 176 Q378 165 374 172" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
</body>
</html>
