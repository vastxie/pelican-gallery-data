<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕的海岸骑行</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1f514d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    overflow: hidden;
    background: #cfe7dd;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  }

  .scene {
    width: 100vw;
    height: 100vh;
    height: 100svh;
    display: block;
  }

  .cloud {
    animation: cloudDrift 64s linear infinite;
    animation-delay: -16s;
    will-change: transform;
  }
  .cloud-b {
    animation-duration: 84s;
    animation-delay: -9s;
  }
  .cloud-c {
    animation-duration: 53s;
    animation-delay: -3s;
  }

  @keyframes cloudDrift {
    from { transform: translateX(-260px); }
    to   { transform: translateX(1380px); }
  }

  .gull {
    animation: gullFloat 5.5s ease-in-out infinite alternate;
  }
  .gull-2 { animation-delay: -2.2s; animation-duration: 7s; }
  .gull-3 { animation-delay: -4.1s; animation-duration: 6.2s; }

  @keyframes gullFloat {
    from { transform: translateY(-5px); }
    to   { transform: translateY(7px); }
  }

  .wave {
    stroke-dasharray: 28 23;
    animation: waveRoll 8s linear infinite;
  }
  .wave-2 { animation-duration: 11s; animation-delay: -3s; }
  .wave-3 { animation-duration: 6.5s; animation-delay: -1.5s; }

  @keyframes waveRoll {
    to { stroke-dashoffset: -51; }
  }

  .road-line {
    animation: roadRoll 1.65s linear infinite;
  }
  .road-line-2 {
    animation-duration: 2.3s;
    animation-delay: -0.8s;
  }

  @keyframes roadRoll {
    to { stroke-dashoffset: -218; }
  }

  .speed-streak {
    animation: streak 2.4s ease-in-out infinite;
  }
  .speed-streak-2 { animation-delay: -0.9s; animation-duration: 3.1s; }
  .speed-streak-3 { animation-delay: -1.7s; animation-duration: 2.7s; }

  @keyframes streak {
    0%, 100% { opacity: 0; transform: translateX(18px); }
    35%, 65% { opacity: .55; }
    70% { opacity: 0; transform: translateX(-26px); }
  }

  .dust {
    animation: dustPuff 2.5s ease-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .dust-2 { animation-delay: -0.85s; }
  .dust-3 { animation-delay: -1.7s; }

  @keyframes dustPuff {
    0% { opacity: 0; transform: translate(12px, 4px) scale(.45); }
    18% { opacity: .38; }
    100% { opacity: 0; transform: translate(-58px, -18px) scale(1.35); }
  }

  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 6.5s infinite;
  }

  @keyframes blink {
    0%, 92%, 96%, 100% { transform: scaleY(1); }
    93.6%, 94.6% { transform: scaleY(.08); }
  }

  .grass-sway {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: sway 4.8s ease-in-out infinite alternate;
  }
  .grass-sway-2 {
    animation-delay: -2s;
    animation-duration: 6.2s;
  }

  @keyframes sway {
    from { transform: rotate(-1.5deg); }
    to   { transform: rotate(2deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .gull, .wave, .road-line, .speed-streak, .dust, .eye, .grass-sway {
      animation: none !important;
    }
  }
</style>
</head>

<script>
(() => {
  const BB = { x: 595, y: 585 };
  const crankR = 44;
  const nearHip = { x: 572, y: 430 };
  const farHip = { x: 548, y: 428 };
  const L1 = 89;
  const L2 = 116;
  const rider = document.getElementById('rider');

  const refs = {
    near: {
      thigh: document.getElementById('nearThigh'),
      shin: document.getElementById('nearShin'),
      shinInner: document.getElementById('nearShinInner'),
      knee: document.getElementById('nearKnee'),
      foot: document.getElementById('nearFoot'),
      crank: document.getElementById('nearCrankArm'),
      crankTop: document.getElementById('nearCrankArmTop'),
      pedal: document.getElementById('nearPedal'),
      pedalAccent: document.getElementById('nearPedalAccent'),
      hip: nearHip
    },
    far: {
      thigh: document.getElementById('farThigh'),
      shin: document.getElementById('farShin'),
      shinInner: document.getElementById('farShinInner'),
      knee: document.getElementById('farKnee'),
      foot: document.getElementById('farFoot'),
      crank: document.getElementById('farCrankArm'),
      crankTop: document.getElementById('farCrankArmTop'),
      pedal: document.getElementById('farPedal'),
      pedalAccent: null,
      hip: farHip
    }
  };

  function solveLeg(hip, pedal) {
    let dx = pedal.x - hip.x;
    let dy = pedal.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxReach = L1 + L2 - 0.4;

    if (d > maxReach) {
      dx = dx / d * maxReach;
      dy = dy / d * maxReach;
      d = maxReach;
    }
    d = Math.max(d, 0.001);

    const ux = dx / d;
    const uy = dy / d;
    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));

    // Keep the knee bending forward, toward the handlebars.
    const knee = {
      x: hip.x + ux * a + uy * h,
      y: hip.y + uy * a - ux * h
    };
    const end = { x: hip.x + dx, y: hip.y + dy };
    return { knee, end };
  }

  function setLeg(ref, phase) {
    const pedal = {
      x: BB.x + Math.cos(phase) * crankR,
      y: BB.y + Math.sin(phase) * crankR
    };
    const { knee, end } = solveLeg(ref.hip, pedal);

    const thigh = `M${ref.hip.x.toFixed(1)} ${ref.hip.y.toFixed(1)} L${knee.x.toFixed(1)} ${knee.y.toFixed(1)}`;
    const shin = `M${knee.x.toFixed(1)} ${knee.y.toFixed(1)} L${end.x.toFixed(1)} ${end.y.toFixed(1)}`;

    ref.thigh.setAttribute('d', thigh);
    ref.shin.setAttribute('d', shin);
    ref.shinInner.setAttribute('d', shin);
    ref.knee.setAttribute('cx', knee.x.toFixed(1));
    ref.knee.setAttribute('cy', knee.y.toFixed(1));

    ref.crank.setAttribute('x2', pedal.x.toFixed(1));
    ref.crank.setAttribute('y2', pedal.y.toFixed(1));
    ref.crankTop.setAttribute('x2', pedal.x.toFixed(1));
    ref.crankTop.setAttribute('y2', pedal.y.toFixed(1));

    ref.pedal.setAttribute('x', (pedal.x - 20).toFixed(1));
    ref.pedal.setAttribute('y', (pedal.y - 5).toFixed(1));
    if (ref.pedalAccent) {
      ref.pedalAccent.setAttribute('x', (pedal.x - 15).toFixed(1));
      ref.pedalAccent.setAttribute('y', (pedal.y - 3).toFixed(1));
    }

    ref.foot.setAttribute('transform', `translate(${pedal.x.toFixed(1)} ${(pedal.y - 4).toFixed(1)})`);
  }

  function render(angle) {
    setLeg(refs.near, angle);
    setLeg(refs.far, angle + Math.PI);
    const bob = Math.sin(angle * 2) * 1.55;
    rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
  }

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    document.querySelectorAll('animateTransform').forEach(node => node.remove());
    render(-Math.PI / 2);
    return;
  }

  let startTime = null;
  function tick(now) {
    if (startTime === null) startTime = now;
    const t = (now - startTime) / 1000;
    // A relaxed seaside cadence: a little over two pedal revolutions every 5 seconds.
    const angle = t * 2.15 - Math.PI / 2;
    render(angle);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
