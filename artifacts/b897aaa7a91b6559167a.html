<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='20' fill='%23e7eddf'/%3E%3Cpath d='M12 28V16c0-9 12-9 12 0l10 3-12 4-4 6' fill='%23fffdf0' stroke='%23648b70' stroke-width='2'/%3E%3Cpath d='m24 16 10 3-10 4' fill='%23efc26a'/%3E%3Ccircle cx='21' cy='14' r='1.5' fill='%23334942'/%3E%3C/svg%3E">
  <title>风从海上来 · 鹈鹕的单车漫游</title>
  <style>
    :root { color-scheme: light; --paper: #f7f5ed; --ink: #293f3a; --muted: #7c8b7e; --green: #427963; --line: #dedfd3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #d99549; outline-offset: 5px; }
    .page { width: min(1240px, 100%); margin: auto; padding: 35px 40px 24px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 21px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 650; letter-spacing: 2px; }
    .brand svg { width: 36px; height: 36px; }
    .edition { color: var(--muted); font-size: 10px; letter-spacing: 2px; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 27px 0 26px; }
    h1 { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif; font-size: clamp(32px, 4vw, 48px); line-height: 1.2; font-weight: 600; letter-spacing: 2px; margin: 0 0 13px; }
    .intro p { margin: 0; font-size: 13px; line-height: 1.8; color: var(--muted); letter-spacing: 1px; }
    .trip { display: flex; align-items: center; gap: 10px; color: var(--green); font-size: 12px; letter-spacing: 1px; padding-bottom: 5px; white-space: nowrap; }
    .trip-dot { width: 7px; height: 7px; border-radius: 50%; background: #87a882; box-shadow: 0 0 0 5px #e9eddf; }
    .scene-wrap { position: relative; overflow: hidden; width: 100%; aspect-ratio: 1200 / 620; border-radius: 22px; background: #e9f1e5; border: 1px solid #d8e1d4; }
    #scene { display: block; width: 100%; height: 100%; }
    .scene-label { position: absolute; left: 27px; top: 24px; font-size: 10px; letter-spacing: 2px; color: #678b7a; display: flex; gap: 10px; align-items: center; pointer-events: none; }
    .scene-label::before { content: ""; width: 22px; height: 1px; background: #8ba794; }
    .weather { position: absolute; right: 24px; top: 20px; font-size: 11px; color: #7e8c71; display: flex; align-items: center; gap: 7px; pointer-events: none; }
    .weather svg { width: 17px; height: 17px; }
    .controls { display: flex; align-items: center; gap: 29px; padding: 23px 2px; }
    .play { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 19px; min-width: 116px; border: 0; border-radius: 30px; background: var(--ink); color: #fbfaf3; font-size: 12px; letter-spacing: .6px; transition: background .18s, transform .18s; }
    .play:hover { background: #446859; transform: translateY(-1px); }
    .play svg { width: 15px; height: 15px; }
    .speed-control { display: flex; align-items: center; gap: 13px; font-size: 12px; color: #738272; }
    input[type="range"] { width: 118px; height: 20px; padding: 0; margin: 0; accent-color: var(--green); cursor: pointer; }
    output { min-width: 36px; font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .bell { display: flex; align-items: center; gap: 8px; border: 1px solid #dadfd1; border-radius: 30px; padding: 11px 16px; background: transparent; color: #667c69; font-size: 12px; margin-left: auto; transition: background .18s; }
    .bell:hover { background: #e8eddf; }
    .bell svg { width: 17px; height: 17px; }
    .footer { display: flex; justify-content: space-between; gap: 16px; padding-top: 13px; border-top: 1px solid var(--line); font-size: 10px; color: #98a08f; letter-spacing: 1px; line-height: 1.7; }
    .footer span:last-child { letter-spacing: 2px; font-size: 9px; }
    #toast { position: absolute; left: 50%; bottom: 25px; transform: translateX(-50%) translateY(6px); padding: 9px 16px; background: #f7f5edeb; border: 1px solid #dae2d3; border-radius: 20px; font-size: 12px; color: #5a7e68; white-space: nowrap; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
    #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 700px) {
      .page { padding: 23px 20px 20px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .brand { gap: 8px; font-size: 11px; letter-spacing: 1px; }
      .brand svg { width: 31px; height: 31px; }
      .intro { margin: 25px 0 22px; }
      .trip { display: none; }
      .intro p { font-size: 11px; letter-spacing: 0; }
      .scene-wrap { aspect-ratio: 1.2; border-radius: 17px; }
      .scene-label { left: 18px; top: 19px; font-size: 8px; letter-spacing: 1px; }
      .weather { right: 15px; top: 15px; font-size: 10px; }
      .controls { flex-wrap: wrap; gap: 19px 15px; padding: 22px 0; }
      .speed-control { order: 3; width: 100%; padding: 0 4px; }
      input[type="range"] { flex: 1; width: auto; }
      .play { min-width: 110px; }
      .bell { padding: 11px 14px; }
      .footer { font-size: 9px; gap: 10px; }
      .footer span:last-child { font-size: 8px; letter-spacing: 1px; }
    }
    @media (prefers-reduced-motion: reduce) { button, #toast { transition: none; } }
  </style>
</head>

        </g>

        <!-- Foreground plants sweep past the camera. -->
        <g id="foreground-a"><use href="#grass-shape" transform="translate(104 611) scale(1.3)"/><use href="#flower-shape" transform="translate(161 615) scale(1.25)"/><use href="#flower-shape" transform="translate(184 618) scale(.86)"/><use href="#grass-shape" transform="translate(224 622) scale(.8)"/></g>
        <g id="foreground-b"><use href="#grass-shape" transform="translate(1077 622) scale(1.2)"/><use href="#flower-shape" transform="translate(1029 625) scale(1.55)"/><use href="#flower-shape" transform="translate(1004 624) scale(.83)"/><use href="#grass-shape" transform="translate(956 622) scale(.65)"/></g>
        <path d="M0 617q140-8 297 1t333 1 280-1 290-1v10H0Z" fill="#bec19a" opacity=".8"/>
      </svg>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>

    <div class="controls" role="group" aria-label="动画控制">
      <button class="play" id="play" type="button" aria-label="暂停动画" aria-pressed="false">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><g id="pause-icon"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></g><path id="play-icon" d="m6 3 11 7-11 7Z" style="display:none"/></svg>
        <span id="play-text">暂停骑行</span>
      </button>
      <div class="speed-control"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速"><output for="speed" id="speed-value">1.00×</output></div>
      <button class="bell" id="bell" type="button" aria-label="按响自行车铃铛"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15h14M7 15v-4a5 5 0 0 1 10 0v4M10 18h4M12 4V2M3 6l2 2m16-2-2 2"/></svg>叮铃，出发</button>
    </div>
    <footer class="footer"><span>不用赶路，风景会慢慢经过。</span><span>DRAWN IN SVG · MADE TO WANDER</span></footer>
    <span id="motion-status" class="sr-only" role="status" aria-live="polite">动画正在播放</span>
    <noscript><p>请启用 JavaScript 来播放动画。当前显示鹈鹕骑行的静态插画。</p></noscript>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const elements = {};
      ['rider', 'rear-spokes', 'front-spokes', 'crank', 'near-leg-path', 'near-leg-highlight', 'far-leg-path', 'near-foot', 'far-foot', 'scarf-tail-a', 'scarf-tail-b', 'open-eye', 'closed-eye', 'cloud-a', 'cloud-b', 'cloud-c', 'gull-a', 'gull-b', 'gull-c', 'foreground-a', 'foreground-b', 'distant-grass', 'lighthouse', 'road-lines', 'wave-lines', 'bike-shadow', 'bell-rays', 'bike-bell'].forEach(id => { elements[id] = $(id); });
      let time = 0;
      let previous = null;
      let speed = 1;
      let paused = motionPreference.matches;
      let animationId = null;
      let audioContext = null;
      let toastTimer = null;
      let bellStart = null;
      let bellFrame = null;
      const tau = Math.PI * 2;
      const transform = (id, value) => elements[id].setAttribute('transform', value);
      const wrap = (value, width) => ((value % width) + width) % width;

      // Two-link inverse kinematics keeps each ankle attached to its pedal.
      function legPose(phase, far, bounce) {
        const hip = { x: far ? 567 : 554, y: (far ? 333 : 336) + bounce };
        const ankle = { x: 592 + 28 * Math.cos(phase), y: 465 + 28 * Math.sin(phase) - 11 };
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 72;
        const lower = 87;
        const a = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const h = Math.sqrt(Math.max(0, upper * upper - a * a));
        const knee = { x: hip.x + dx * a / distance + dy * h / distance, y: hip.y + dy * a / distance - dx * h / distance };
        const path = `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`;
        elements[far ? 'far-leg-path' : 'near-leg-path'].setAttribute('d', path);
        if (!far) elements['near-leg-highlight'].setAttribute('d', path);
        transform(far ? 'far-foot' : 'near-foot', `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)})`);
      }

      function draw() {
        const phase = time * 2.8;
        const degrees = phase * 180 / Math.PI;
        const bounce = Math.sin(phase * 2) * 1.8;
        transform('rider', `translate(0 ${bounce})`);
        transform('rear-spokes', `rotate(${degrees * 1.5})`);
        transform('front-spokes', `rotate(${degrees * 1.5})`);
        transform('crank', `rotate(${degrees} 592 465)`);
        legPose(phase, false, bounce);
        legPose(phase + Math.PI, true, bounce);

        const breeze = Math.sin(time * 4.1) * 4;
        const breeze2 = Math.sin(time * 4.1 + 1.5) * 3;
        elements['scarf-tail-a'].setAttribute('d', `M584 225Q558 ${220 + breeze2} 535 ${225 + breeze}T492 ${221 + breeze2}L498 ${238 + breeze2}Q521 ${247 + breeze} 542 ${236 + breeze2}T584 238Z`);
        elements['scarf-tail-b'].setAttribute('d', `M583 232Q553 ${239 - breeze} 534 ${258 - breeze2}L525 ${249 - breeze2}Q551 ${217 - breeze} 583 224Z`);

        const blink = wrap(time + 1.9, 4.7) > 4.54;
        elements['open-eye'].setAttribute('opacity', blink ? '0' : '1');
        elements['closed-eye'].setAttribute('opacity', blink ? '1' : '0');
        transform('cloud-a', `translate(${wrap(349 - time * 9, 1510) - 349} 0)`);
        transform('cloud-b', `translate(${wrap(950 - time * 6, 1510) - 950} 0)`);
        transform('cloud-c', `translate(${wrap(1320 - time * 13, 1510) - 1320} 0)`);
        transform('gull-a', `translate(${wrap(510 - time * 18, 1490) - 510} ${Math.sin(time * 1.8) * 5})`);
        transform('gull-b', `translate(${wrap(552 - time * 18, 1490) - 552} ${Math.sin(time * 1.8 + 1) * 5})`);
        transform('gull-c', `translate(${wrap(1067 - time * 13, 1490) - 1067} ${Math.sin(time * 1.6) * 3})`);
        transform('lighthouse', `translate(${wrap(1278 - time * 7, 1540) - 250} 219)`);
        elements['wave-lines'].setAttribute('patternTransform', `translate(${-wrap(time * 22, 245)} 0)`);
        elements['road-lines'].setAttribute('patternTransform', `translate(${-wrap(time * 361.2, 190)} 0)`);
        transform('foreground-a', `translate(${wrap(384 - time * 395, 1600) - 384} 0)`);
        transform('foreground-b', `translate(${wrap(1244 - time * 395, 1600) - 1244} 0)`);
        transform('distant-grass', `translate(${-wrap(time * 38, 1200)} 0)`);
        elements['bike-shadow'].setAttribute('rx', 267 + bounce * 2);
      }

      function tick(now) {
        animationId = null;
        if (paused || document.hidden) { previous = null; return; }
        if (previous !== null) time += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw();
        animationId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        $('play').setAttribute('aria-label', paused ? '继续播放动画' : '暂停动画');
        $('play').setAttribute('aria-pressed', String(paused));
        $('play-text').textContent = paused ? '继续骑行' : '暂停骑行';
        $('pause-icon').style.display = paused ? 'none' : '';
        $('play-icon').style.display = paused ? '' : 'none';
        $('motion-status').textContent = paused ? '动画已暂停' : '动画正在播放';
        previous = null;
        if (animationId !== null) cancelAnimationFrame(animationId);
        animationId = null;
        if (!paused && !document.hidden) animationId = requestAnimationFrame(tick);
      }

      $('play').addEventListener('click', () => { paused = !paused; syncPlayback(); });
      $('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        $('speed-value').value = `${speed.toFixed(2)}×`;
        $('speed').setAttribute('aria-valuetext', `${speed} 倍速`);
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', event => { paused = event.matches; syncPlayback(); });

      // Sound is synthesized locally and only starts after a bell-button click.
      async function soundBell() {
        const AudioConstructor = window.AudioContext || window.webkitAudioContext;
        if (!AudioConstructor) return;
        audioContext ||= new AudioConstructor();
        if (audioContext.state === 'suspended') await audioContext.resume();
        const start = audioContext.currentTime;
        [0, .17].forEach(delay => {
          [1740, 2610, 3480].forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, start + delay);
            gain.gain.setValueAtTime(0, start + delay);
            gain.gain.linearRampToValueAtTime(.09 / (index + 1), start + delay + .005);
            gain.gain.exponentialRampToValueAtTime(.0001, start + delay + .72);
            oscillator.connect(gain);
            gain.connect(audioContext.destination);
            oscillator.start(start + delay);
            oscillator.stop(start + delay + .75);
            oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
          });
        });
      }

      function ring(now) {
        const elapsed = (now - bellStart) / 1000;
        if (elapsed >= .7 || motionPreference.matches) {
          transform('bike-bell', 'translate(724 282)');
          elements['bell-rays'].setAttribute('opacity', '0');
          bellFrame = null;
          return;
        }
        transform('bike-bell', `translate(724 282) rotate(${Math.sin(elapsed * 58) * 10 * (1 - elapsed / .7)})`);
        elements['bell-rays'].setAttribute('opacity', String(.8 * (1 - elapsed / .7)));
        bellFrame = requestAnimationFrame(ring);
      }
      $('bell').addEventListener('click', () => {
        soundBell().catch(() => {});
        if (bellFrame !== null) cancelAnimationFrame(bellFrame);
        bellStart = performance.now();
        bellFrame = requestAnimationFrame(ring);
        $('toast').textContent = '叮铃！把好心情带上。';
        $('toast').classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { $('toast').classList.remove('visible'); }, 1800);
      });
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
