<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9c45b">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173b42;
      --cream: #fff8e8;
      --coral: #ef6c4d;
      --yellow: #f5bc42;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.88), transparent 42%),
        #eadfca;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: min(1180px, calc(100vw - 28px));
      overflow: hidden;
      border: 1px solid rgba(23, 59, 66, .16);
      border-radius: clamp(18px, 3vw, 34px);
      background: #9edddc;
      box-shadow: 0 28px 80px rgba(45, 59, 54, .2), 0 3px 0 rgba(255,255,255,.7) inset;
      isolation: isolate;
    }

    .stage::after {
      position: absolute;
      inset: 0;
      z-index: 8;
      border-radius: inherit;
      box-shadow: 0 0 0 8px rgba(255, 255, 255, .22) inset;
      content: "";
      pointer-events: none;
    }

    svg.scene {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 12 / 7;
    }

    .title-block {
      position: absolute;
      top: clamp(16px, 3vw, 30px);
      left: clamp(18px, 4vw, 44px);
      z-index: 10;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55em;
      margin-bottom: 7px;
      color: rgba(23, 59, 66, .7);
      font-size: clamp(9px, 1vw, 12px);
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 25px;
      height: 3px;
      border-radius: 999px;
      background: var(--coral);
      content: "";
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(23px, 4.25vw, 55px);
      font-weight: 900;
      line-height: .96;
      letter-spacing: -.055em;
      text-shadow: 0 2px 0 rgba(255,255,255,.28);
    }

    .controls {
      position: absolute;
      right: clamp(14px, 2vw, 25px);
      bottom: clamp(14px, 2vw, 24px);
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 999px;
      background: rgba(255, 248, 232, .84);
      box-shadow: 0 8px 24px rgba(23,59,66,.16);
      backdrop-filter: blur(10px);
    }

    button {
      min-width: 68px;
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    button:hover { transform: translateY(-1px); background: #24535b; }
    button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 8px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    input[type="range"] {
      width: clamp(62px, 9vw, 105px);
      accent-color: var(--coral);
      cursor: pointer;
    }

    #speed-value { min-width: 28px; font-variant-numeric: tabular-nums; }

    .cloud-near { animation: cloud-drift 21s linear infinite; }
    .cloud-far { animation: cloud-drift-far 33s linear infinite; }
    .wave-dashes { animation: wave-slide 4s linear infinite; }
    .road-marks { animation: road-slide 1.15s linear infinite; }
    .road-specks { animation: road-slide 1.8s linear infinite; }
    .grass-runner { animation: grass-slide 2.7s linear infinite; }
    .sun-halo { animation: breathe 3.6s ease-in-out infinite; transform-origin: 963px 133px; }
    #bike-rig { animation: bike-bob .48s ease-in-out infinite alternate; transform-origin: 575px 520px; }
    #bike-shadow { animation: shadow-bob .48s ease-in-out infinite alternate; transform-origin: center; }
    #wing { animation: wing-sway 1.1s ease-in-out infinite alternate; transform-origin: 523px 289px; }
    #crest { animation: crest-flutter .6s ease-in-out infinite alternate; transform-origin: 615px 137px; }
    #tail-feathers { animation: tail-flutter .72s ease-in-out infinite alternate; transform-origin: 393px 316px; }
    #scarf-tail { animation: scarf-wave .55s ease-in-out infinite alternate; transform-origin: 575px 241px; }
    #eye-open { animation: blink 4.6s linear infinite; transform-origin: center; }

    @keyframes cloud-drift {
      from { transform: translateX(-260px); }
      to { transform: translateX(1260px); }
    }

    @keyframes cloud-drift-far {
      from { transform: translateX(170px); }
      to { transform: translateX(-1120px); }
    }

    @keyframes wave-slide { to { stroke-dashoffset: -90; } }
    @keyframes road-slide { to { transform: translateX(-240px); } }
    @keyframes grass-slide { to { transform: translateX(-360px); } }

    @keyframes breathe {
      50% { transform: scale(1.08); opacity: .42; }
    }

    @keyframes bike-bob {
      to { transform: translateY(-4px) rotate(-.16deg); }
    }

    @keyframes shadow-bob {
      to { transform: scaleX(.97); opacity: .13; }
    }

    @keyframes wing-sway {
      to { transform: rotate(-2.8deg); }
    }

    @keyframes crest-flutter {
      to { transform: rotate(-8deg); }
    }

    @keyframes tail-flutter {
      to { transform: rotate(3deg); }
    }

    @keyframes scarf-wave {
      to { transform: rotate(6deg) scaleX(.94); }
    }

    @keyframes blink {
      0%, 45%, 48%, 100% { transform: scaleY(1); }
      46.2%, 47% { transform: scaleY(.08); }
    }

    .paused *, .paused *::before, .paused *::after {
      animation-play-state: paused !important;
    }

    @media (max-width: 640px) {
      .stage { width: calc(100vw - 16px); border-radius: 20px; }
      .controls { gap: 6px; padding: 6px; }
      button { min-width: 58px; min-height: 34px; padding: 0 12px; font-size: 12px; }
      .speed-control { gap: 4px; padding-right: 4px; }
      .speed-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .cloud-near, .cloud-far, .wave-dashes, .road-marks, .road-specks,
      .grass-runner, .sun-halo, #bike-rig, #bike-shadow, #wing,
      #crest, #tail-feathers, #scarf-tail, #eye-open {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <div class="title-block" aria-hidden="true">
      <div class="eyebrow">Seaside Cycle Club</div>
      <h1>追着海风<br>骑一程</h1>
    </div>

    <svg class="scene" viewBox="0 0 1200 700" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">一只鹈鹕沿着海岸骑自行车</title>
      <desc id="scene-desc">暖色调的二维 SVG 动画。鹈鹕踩着珊瑚红自行车，车轮转动，云朵、海浪和道路从身边掠过。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#79cfd5"/>
          <stop offset=".68" stop-color="#c9ebe0"/>
          <stop offset="1" stop-color="#f7dfad"/>
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55b8bd"/>
          <stop offset="1" stop-color="#347f8d"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#547077"/>
          <stop offset="1" stop-color="#2f4b53"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2=".7">
          <stop offset="0" stop-color="#ffc54e"/>
          <stop offset="1" stop-color="#ed8044"/>
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#ffd86b"/>
          <stop offset="1" stop-color="#f08a53"/>
        </linearGradient>
        <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf4"/>
          <stop offset="1" stop-color="#e8dfc8"/>
        </linearGradient>
        <radialGradient id="sun-glow">
          <stop offset="0" stop-color="#ffe98a" stop-opacity=".75"/>
          <stop offset="1" stop-color="#ffe98a" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
          <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#183c43" flood-opacity=".18"/>
        </filter>
        <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" result="noise"/>
          <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
          <feComponentTransfer in="gray" result="faint">
            <feFuncA type="table" tableValues="0 .055"/>
          </feComponentTransfer>
          <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
        </filter>
        <clipPath id="scene-clip">
          <rect width="1200" height="700" rx="28"/>
        </clipPath>

        <g id="cloud-shape" fill="#fffaf0" stroke="#3d7377" stroke-width="3">
          <path d="M17 56C6 56 0 49 0 39c0-11 9-20 20-20 4 0 8 1 11 3C36 9 48 1 63 1c19 0 35 14 37 32 4-2 8-3 13-3 14 0 25 11 25 25v1Z"/>
        </g>

        <g id="wheel-art">
          <circle r="100" fill="#f7ead1" fill-opacity=".16" stroke="#163c43" stroke-width="13"/>
          <circle r="89" fill="none" stroke="#f5e6c7" stroke-width="4"/>
          <g stroke="#b9c8bd" stroke-width="2.5" opacity=".95">
            <line y1="-86" y2="86"/>
            <line y1="-86" y2="86" transform="rotate(30)"/>
            <line y1="-86" y2="86" transform="rotate(60)"/>
            <line y1="-86" y2="86" transform="rotate(90)"/>
            <line y1="-86" y2="86" transform="rotate(120)"/>
            <line y1="-86" y2="86" transform="rotate(150)"/>
          </g>
          <circle r="13" fill="#f7d764" stroke="#163c43" stroke-width="6"/>
          <circle r="3.5" fill="#163c43"/>
        </g>
      </defs>

      <g clip-path="url(#scene-clip)" filter="url(#paper)">
        <!-- sky and slow background -->
        <rect width="1200" height="700" fill="url(#sky)"/>
        <circle class="sun-halo" cx="963" cy="133" r="99" fill="url(#sun-glow)"/>
        <circle cx="963" cy="133" r="55" fill="#f8c955" stroke="#e39a42" stroke-width="5"/>
        <path d="M924 140c17 13 60 13 78-1" fill="none" stroke="#f9dd7a" stroke-width="5" stroke-linecap="round" opacity=".75"/>

        <g class="cloud-far" opacity=".55" transform="translate(170 145) scale(.55)">
          <use href="#cloud-shape"/>
          <use href="#cloud-shape" x="760" y="-80" transform="scale(.76)"/>
          <use href="#cloud-shape" x="1510" y="30" transform="scale(.9)"/>
          <use href="#cloud-shape" x="2260" y="-55" transform="scale(.63)"/>
        </g>
        <g class="cloud-near" transform="translate(-260 86)">
          <use href="#cloud-shape" transform="scale(.72)"/>
          <use href="#cloud-shape" x="690" y="38" transform="scale(.46)"/>
          <use href="#cloud-shape" x="1380" y="-22" transform="scale(.58)"/>
          <use href="#cloud-shape" x="2050" y="28" transform="scale(.7)"/>
        </g>

        <!-- birds -->
        <g fill="none" stroke="#285b62" stroke-width="4" stroke-linecap="round" opacity=".7">
          <path d="M842 208q13-12 26 0q13-12 26 0"/>
          <path d="M913 235q9-8 18 0q9-8 18 0"/>
        </g>

        <!-- sea and dunes -->
        <path d="M0 303c190-15 373 12 553-2 188-15 399-8 647 11v178H0Z" fill="url(#sea)"/>
        <g class="wave-dashes" fill="none" stroke="#d9f4e7" stroke-width="4" stroke-linecap="round" stroke-dasharray="46 44" opacity=".72">
          <path d="M-100 337c168-18 296 20 455 0s315 15 476-2 286 10 469-4"/>
          <path d="M-70 383c148-17 278 17 425 0s310 14 468-3 302 12 477-5"/>
          <path d="M-120 433c169-18 304 16 466 0s315 17 489-1 300 10 487-4"/>
        </g>
        <path d="M0 420c114-44 212-35 310 5 110 45 213-28 320-8 108 21 194 49 311 7 93-34 174-12 269 21v100H0Z" fill="#e7c66e" stroke="#b18c48" stroke-width="5"/>
        <path d="M0 456c143-22 225-3 339 35 121 40 220-27 349-20 126 7 225 49 332 21 78-21 127-18 180-5v72H0Z" fill="#6f9a5b" opacity=".92"/>
        <g fill="none" stroke="#416e4d" stroke-width="5" stroke-linecap="round" opacity=".9">
          <path d="M75 472l-9-28m9 28 12-32m-12 32 24-18M238 486l-6-35m6 35 17-26m208 21-8-30m8 30 18-31m307 37-3-37m3 37 18-29m217 41-9-34m9 34 22-26"/>
        </g>

        <!-- road -->
        <path d="M0 500c318-19 680-18 1200 5v195H0Z" fill="url(#road)"/>
        <path d="M0 500c333-17 744-14 1200 5" fill="none" stroke="#f4dfaa" stroke-width="14"/>
        <path d="M0 512c333-17 744-14 1200 5" fill="none" stroke="#d39a50" stroke-width="4" opacity=".85"/>
        <g class="road-marks" fill="#efd67b">
          <rect x="-120" y="653" width="128" height="12" rx="6"/>
          <rect x="120" y="653" width="128" height="12" rx="6"/>
          <rect x="360" y="653" width="128" height="12" rx="6"/>
          <rect x="600" y="653" width="128" height="12" rx="6"/>
          <rect x="840" y="653" width="128" height="12" rx="6"/>
          <rect x="1080" y="653" width="128" height="12" rx="6"/>
          <rect x="1320" y="653" width="128" height="12" rx="6"/>
        </g>
        <g class="road-specks" fill="#b7c2aa" opacity=".42">
          <circle cx="42" cy="564" r="4"/><circle cx="181" cy="616" r="3"/>
          <circle cx="308" cy="545" r="5"/><circle cx="492" cy="684" r="4"/>
          <circle cx="671" cy="596" r="3"/><circle cx="862" cy="552" r="5"/>
          <circle cx="1031" cy="691" r="4"/><circle cx="1168" cy="589" r="3"/>
          <circle cx="1288" cy="545" r="5"/><circle cx="1432" cy="681" r="4"/>
        </g>
        <g class="grass-runner" fill="none" stroke="#335d49" stroke-width="5" stroke-linecap="round">
          <path d="M-50 516l-7-29m7 29 11-31m-11 31 26-18M310 516l-7-29m7 29 11-31m-11 31 26-18M670 516l-7-29m7 29 11-31m-11 31 26-18M1030 516l-7-29m7 29 11-31m-11 31 26-18M1390 516l-7-29m7 29 11-31m-11 31 26-18"/>
        </g>

        <!-- moving bicycle and rider -->
        <ellipse id="bike-shadow" cx="578" cy="623" rx="294" ry="23" fill="#152f36" opacity=".19"/>
        <g id="bike-rig" filter="url(#soft-shadow)">
          <!-- wheels -->
          <g id="rear-wheel" transform="translate(390 520)"><use href="#wheel-art"/></g>
          <g id="front-wheel" transform="translate(760 520)"><use href="#wheel-art"/></g>

          <!-- rear leg, behind the frame -->
          <path id="back-leg-outline" fill="none" stroke="#173b42" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="back-leg" fill="none" stroke="#e8973c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <line id="back-foot-outline" stroke="#173b42" stroke-width="19" stroke-linecap="round"/>
          <line id="back-foot" stroke="#f2ad45" stroke-width="11" stroke-linecap="round"/>

          <!-- bicycle frame -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M390 520 510 383 555 520Zm120-137 171 25-126 112m126-112 79 112" stroke="#173b42" stroke-width="20"/>
            <path d="M390 520 510 383 555 520Zm120-137 171 25-126 112m126-112 79 112" stroke="#ef684b" stroke-width="11"/>
            <path d="M510 383l-13-39" stroke="#173b42" stroke-width="16"/>
            <path d="M510 383l-13-39" stroke="#ef684b" stroke-width="8"/>
            <path d="M682 408l-8-67 20-37" stroke="#173b42" stroke-width="17"/>
            <path d="M682 408l-8-67 20-37" stroke="#ef684b" stroke-width="9"/>
            <path d="M673 342h45l14 12" stroke="#173b42" stroke-width="12"/>
            <path d="M674 340h42" stroke="#f4d463" stroke-width="5"/>
          </g>
          <path d="M473 344q25-13 58 0l-6 14h-52q-10-7 0-14Z" fill="#173b42"/>
          <path d="M477 343q22-8 48 0" fill="none" stroke="#f8d75e" stroke-width="5" stroke-linecap="round"/>
          <path d="M442 511c32-31 82-32 113 2" fill="none" stroke="#f3d165" stroke-width="5" stroke-linecap="round" opacity=".85"/>

          <!-- rear rack and tiny travel bag -->
          <path d="M352 420h113l-14 86m-99-86 35 88" fill="none" stroke="#173b42" stroke-width="7" stroke-linecap="round"/>
          <path d="M354 393h80q15 0 15 15v43h-109v-44q0-14 14-14Z" fill="#f2b844" stroke="#173b42" stroke-width="7"/>
          <path d="M342 419h105M390 395v53" stroke="#c57b3d" stroke-width="4" opacity=".6"/>
          <circle cx="430" cy="410" r="6" fill="#fff3cf"/>

          <!-- pelican body -->
          <g id="pelican">
            <g id="tail-feathers" fill="url(#feather)" stroke="#173b42" stroke-width="6" stroke-linejoin="round">
              <path d="M412 286q-67-27-105-3 44 20 101 29Z"/>
              <path d="M408 307q-74-4-99 24 54 6 106-4Z"/>
              <path d="M417 328q-61 17-77 48 49-7 92-31Z"/>
            </g>

            <!-- neck behind body -->
            <path d="M532 314c45-34 44-78 48-111 3-31 19-62 52-69 30-6 63 10 72 40 11 38-8 70-36 90-20 15-29 46-18 81Z" fill="url(#feather)" stroke="#173b42" stroke-width="7" stroke-linejoin="round"/>
            <path d="M596 208c-1 45-21 84-52 107" fill="none" stroke="#d7cdb8" stroke-width="5" stroke-linecap="round"/>

            <!-- body -->
            <path d="M399 283c37-46 109-61 170-31 48 24 74 73 60 115-14 42-67 53-124 45-65-9-111-37-119-79-3-18 2-35 13-50Z" fill="url(#feather)" stroke="#173b42" stroke-width="7"/>
            <path d="M413 352c25 38 82 55 139 50" fill="none" stroke="#d8cfbd" stroke-width="5" stroke-linecap="round"/>

            <!-- scarf -->
            <path d="M563 235q37 19 69 1l8 22q-39 18-79-2Z" fill="#ee6750" stroke="#173b42" stroke-width="6"/>
            <g id="scarf-tail" fill="#ee6750" stroke="#173b42" stroke-width="6" stroke-linejoin="round">
              <path d="M575 248q-55 7-85-12 16 22 45 29-29 2-42 16 51 4 88-14Z"/>
            </g>

            <!-- head and crest -->
            <ellipse cx="651" cy="177" rx="58" ry="49" fill="#fffdf4" stroke="#173b42" stroke-width="7"/>
            <g id="crest" fill="#fffdf4" stroke="#173b42" stroke-width="6" stroke-linejoin="round">
              <path d="M621 143q-24-28-14-48 19 15 26 43Z"/>
              <path d="M639 134q-6-35 12-49 9 24 1 51Z"/>
              <path d="M657 136q12-31 34-35-3 26-22 43Z"/>
            </g>

            <!-- beak and pouch -->
            <path d="M680 164c51 2 112 13 171 35-47 10-103 12-171 3Z" fill="url(#beak)" stroke="#173b42" stroke-width="7" stroke-linejoin="round"/>
            <path d="M681 201c61 9 118 7 170-2-15 38-57 64-107 53-33-7-57-24-63-51Z" fill="url(#pouch)" stroke="#173b42" stroke-width="7" stroke-linejoin="round"/>
            <path d="M705 215q64 23 118-3" fill="none" stroke="#e27a46" stroke-width="4" stroke-linecap="round" opacity=".75"/>
            <circle id="eye-open" cx="661" cy="165" r="7" fill="#173b42"/>
            <circle cx="659" cy="162" r="2" fill="white"/>

            <!-- wing reaching the handlebar -->
            <g id="wing">
              <path d="M461 290c49-39 102-19 127 20 18 28 42 39 91 36l11 22c-69 19-120-4-150-34-26 41-75 41-100 13-16-18-7-43 21-57Z" fill="#eee3ca" stroke="#173b42" stroke-width="7" stroke-linejoin="round"/>
              <path d="M467 314q42 40 86 14m-67 42q36-4 54-36" fill="none" stroke="#c8baa0" stroke-width="5" stroke-linecap="round"/>
              <path d="M672 347q19-8 27 7-7 22-23 14" fill="#f1a242" stroke="#173b42" stroke-width="6" stroke-linecap="round"/>
            </g>
          </g>

          <!-- front leg above frame -->
          <path id="front-leg-outline" fill="none" stroke="#173b42" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="front-leg" fill="none" stroke="#f1aa43" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- crank and pedals -->
          <g id="crank" transform="translate(555 520)">
            <circle r="27" fill="#f5d061" stroke="#173b42" stroke-width="7"/>
            <circle r="7" fill="#173b42"/>
            <path d="M-35 0h70" stroke="#173b42" stroke-width="7" stroke-linecap="round"/>
            <path d="M-49 0h26M23 0h26" stroke="#f8e5b8" stroke-width="8" stroke-linecap="round"/>
          </g>
          <line id="front-foot-outline" stroke="#173b42" stroke-width="20" stroke-linecap="round"/>
          <line id="front-foot" stroke="#f6b447" stroke-width="12" stroke-linecap="round"/>

          <!-- frame highlights -->
          <circle cx="555" cy="520" r="5" fill="#fff1bd"/>
          <circle cx="760" cy="520" r="5" fill="#fff1bd"/>
        </g>

        <!-- foreground flashes add a sense of speed -->
        <g class="grass-runner" opacity=".72" fill="none" stroke="#e7c764" stroke-width="6" stroke-linecap="round">
          <path d="M90 699l19-39m-19 39-4-45m4 45 38-25m322 25 19-39m-19 39-4-45m4 45 38-25m322 25 19-39m-19 39-4-45m4 45 38-25m322 25 19-39m-19 39-4-45m4 45 38-25"/>
        </g>
      </g>
    </svg>

    <div class="controls" aria-label="动画控制">
      <button id="toggle" type="button" aria-pressed="false">暂停</button>
      <label class="speed-control" for="speed">
        <span class="speed-label">风速</span>
        <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="动画速度">
        <span id="speed-value">1×</span>
      </label>
    </div>
  </main>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const toggle = document.getElementById('toggle');
      const speedInput = document.getElementById('speed');
      const speedValue = document.getElementById('speed-value');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const rearWheel = document.getElementById('rear-wheel');
      const frontWheel = document.getElementById('front-wheel');
      const crank = document.getElementById('crank');
      const paths = {
        front: document.getElementById('front-leg'),
        frontOutline: document.getElementById('front-leg-outline'),
        back: document.getElementById('back-leg'),
        backOutline: document.getElementById('back-leg-outline')
      };
      const feet = {
        front: document.getElementById('front-foot'),
        frontOutline: document.getElementById('front-foot-outline'),
        back: document.getElementById('back-foot'),
        backOutline: document.getElementById('back-foot-outline')
      };

      let speed = 1;
      let paused = reduceMotion;
      let simTime = 0;
      let previous = performance.now();

      function solveLeg(hip, foot, upper, lower, kneeSide = -1) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.max(1, Math.min(Math.hypot(dx, dy), upper + lower - 0.01));
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const ux = dx / distance;
        const uy = dy / distance;
        return {
          x: hip.x + along * ux + kneeSide * height * -uy,
          y: hip.y + along * uy + kneeSide * height * ux
        };
      }

      function setLeg(path, outline, hip, foot, side) {
        const knee = solveLeg(hip, foot, 91, 94, side);
        const d = `M ${hip.x.toFixed(1)} ${hip.y.toFixed(1)} Q ${knee.x.toFixed(1)} ${knee.y.toFixed(1)} ${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`;
        path.setAttribute('d', d);
        outline.setAttribute('d', d);
      }

      function setFoot(line, outline, point, angle) {
        const length = 31;
        const tilt = angle + 0.08;
        const x1 = point.x - Math.cos(tilt) * length * .34;
        const y1 = point.y - Math.sin(tilt) * length * .34;
        const x2 = point.x + Math.cos(tilt) * length * .66;
        const y2 = point.y + Math.sin(tilt) * length * .66;
        for (const item of [line, outline]) {
          item.setAttribute('x1', x1.toFixed(1));
          item.setAttribute('y1', y1.toFixed(1));
          item.setAttribute('x2', x2.toFixed(1));
          item.setAttribute('y2', y2.toFixed(1));
        }
      }

      function drawBike() {
        const crankAngle = simTime * 4.25;
        const wheelDegrees = (simTime * 132) % 360;
        const crankDegrees = (crankAngle * 180 / Math.PI) % 360;
        rearWheel.setAttribute('transform', `translate(390 520) rotate(${wheelDegrees.toFixed(2)})`);
        frontWheel.setAttribute('transform', `translate(760 520) rotate(${wheelDegrees.toFixed(2)})`);
        crank.setAttribute('transform', `translate(555 520) rotate(${crankDegrees.toFixed(2)})`);

        const radius = 35;
        const frontPedal = {
          x: 555 + Math.cos(crankAngle) * radius,
          y: 520 + Math.sin(crankAngle) * radius
        };
        const backPedal = {
          x: 555 - Math.cos(crankAngle) * radius,
          y: 520 - Math.sin(crankAngle) * radius
        };

        setLeg(paths.front, paths.frontOutline, { x: 522, y: 369 }, frontPedal, -1);
        setLeg(paths.back, paths.backOutline, { x: 485, y: 369 }, backPedal, -1);
        setFoot(feet.front, feet.frontOutline, frontPedal, 0);
        setFoot(feet.back, feet.backOutline, backPedal, 0);
      }

      function frame(now) {
        const delta = Math.min(40, now - previous) / 1000;
        previous = now;
        if (!paused) simTime += delta * speed;
        drawBike();
        requestAnimationFrame(frame);
      }

      function syncCssAnimations() {
        document.getAnimations().forEach(animation => {
          animation.playbackRate = speed;
          if (paused) animation.pause(); else animation.play();
        });
      }

      toggle.addEventListener('click', () => {
        paused = !paused;
        stage.classList.toggle('paused', paused);
        toggle.textContent = paused ? '继续' : '暂停';
        toggle.setAttribute('aria-pressed', String(paused));
        previous = performance.now();
        syncCssAnimations();
      });

      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        speedValue.textContent = `${speed.toFixed(speed % 1 ? 2 : 0).replace(/0$/, '')}×`;
        syncCssAnimations();
      });

      if (reduceMotion) {
        stage.classList.add('paused');
        toggle.textContent = '播放';
        toggle.setAttribute('aria-pressed', 'true');
      }

      drawBike();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
