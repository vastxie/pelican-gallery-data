<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3eb">
  <title>鹈鹕出发啦 — 一段 SVG 小动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #183c3a;
      --muted: #637a70;
      --paper: #f4f3eb;
      --card: #fffef9;
      --line: #dce4d8;
      --orange: #f2a94c;
      --green: #447e65;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 36px 22px;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(242, 169, 76, .13), transparent 28rem),
        var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page { width: min(100%, 1040px); }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 8px 18px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 43px);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .intro {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .motion-note {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 254, 249, .7);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .motion-note::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #69a47c;
      box-shadow: 0 0 0 4px rgba(105, 164, 124, .14);
      content: "";
    }

    figure {
      overflow: hidden;
      margin: 0;
      border: 1px solid rgba(24, 60, 58, .1);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 22px 60px rgba(42, 68, 52, .11), 0 3px 9px rgba(42, 68, 52, .05);
    }

    svg { display: block; width: 100%; height: auto; }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 15px 20px 17px;
      border-top: 1px solid #edf0e8;
      color: var(--muted);
      font-size: 12px;
    }

    .caption strong { color: var(--ink); font-weight: 750; }

    /* The illustration keeps the bicycle in place while the road rolls beneath it. */
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .pedal-spin { transform-box: view-box; transform-origin: 480px 390px; animation: spin 1.2s linear infinite; }
    .rider-bob { transform-box: view-box; transform-origin: 450px 250px; animation: bob 1.2s ease-in-out infinite; }
    .front-leg { transform-box: view-box; transform-origin: 445px 263px; animation: pedal-leg 1.2s ease-in-out infinite; }
    .back-leg { transform-box: view-box; transform-origin: 427px 260px; animation: pedal-leg 1.2s ease-in-out -0.6s infinite; }
    .cloud-one { animation: cloud-drift 30s linear infinite; }
    .cloud-two { animation: cloud-drift 38s linear -16s infinite; }
    .passing-trees { animation: scenery 14s linear infinite; }
    .road-dashes { animation: dash 1.2s linear infinite; }
    .wing-tip { transform-box: view-box; transform-origin: 435px 219px; animation: wing 1.2s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes pedal-leg { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes wing { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-3deg); } }
    @keyframes cloud-drift { from { transform: translateX(110px); } to { transform: translateX(-1100px); } }
    @keyframes scenery { from { transform: translateX(0); } to { transform: translateX(-300px); } }
    @keyframes dash { to { stroke-dashoffset: -72; } }

    @media (max-width: 620px) {
      body { padding: 20px 12px; }
      header { align-items: start; margin-inline: 4px; }
      .motion-note { display: none; }
      figure { border-radius: 15px; }
      .caption { padding: 12px 14px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">A tiny ride through the sunshine</p>
        <h1>鹈鹕出发啦</h1>
        <p class="intro">风刚刚好，今天适合骑车兜兜风。</p>
      </div>
      <span class="motion-note">循环小动画</span>
    </header>

    <figure aria-label="鹈鹕骑着自行车穿过晴朗的乡间">
      <svg viewBox="0 0 1000 600" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="scene-title">一只鹈鹕骑着自行车</title>
        <desc id="scene-desc">鹈鹕踩着踏板，车轮转动，路边的树和云缓缓向后移动。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d9f0ed"/>
            <stop offset="1" stop-color="#f6f4df"/>
          </linearGradient>
          <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#b9d8b9"/><stop offset="1" stop-color="#e5e9bb"/>
          </linearGradient>
          <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#ffc65e"/><stop offset="1" stop-color="#ee8e3d"/>
          </linearGradient>
          <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
            <feGaussianBlur stdDeviation="7"/>
          </filter>
          <g id="little-tree">
            <path d="M0 0v51" stroke="#748660" stroke-width="7" stroke-linecap="round"/>
            <circle cx="0" cy="-8" r="25" fill="#7fac78"/>
            <circle cx="-17" cy="1" r="15" fill="#93bd83"/>
            <circle cx="16" cy="3" r="16" fill="#6d9e71"/>
            <circle cx="-7" cy="-19" r="7" fill="#b0cf90" opacity=".8"/>
          </g>
        </defs>

        <!-- Sky and distant country -->
        <rect width="1000" height="600" fill="url(#sky)"/>
        <circle cx="805" cy="112" r="49" fill="#f9cc70" opacity=".9"/>
        <circle cx="805" cy="112" r="65" fill="#f9cc70" opacity=".14"/>
        <g fill="#fffef7" opacity=".88">
          <g class="cloud-one" transform="translate(0 0)">
            <ellipse cx="204" cy="109" rx="40" ry="15"/>
            <circle cx="185" cy="101" r="17"/><circle cx="211" cy="93" r="22"/><circle cx="235" cy="105" r="15"/>
          </g>
          <g class="cloud-two" transform="translate(0 0)" opacity=".75">
            <ellipse cx="725" cy="206" rx="35" ry="12"/>
            <circle cx="709" cy="199" r="14"/><circle cx="733" cy="192" r="18"/><circle cx="752" cy="203" r="12"/>
          </g>
        </g>
        <path d="M0 349c92-42 174-53 265-26 99 29 164 1 254-35 118-47 188-2 285 29 70 22 133 13 196-16v177H0z" fill="url(#hill)"/>
        <path d="M0 380c113-41 215-14 304 7 102 24 191-1 282-31 123-41 229-5 414 34v107H0z" fill="#c4dba9"/>
        <path d="M0 414c120-25 202-15 298 6 96 21 213 8 328-12 131-22 248-6 374 17v88H0z" fill="#a9c98c"/>

        <!-- Repeating trees make the forward motion easy to read. -->
        <g class="passing-trees" opacity=".92">
          <use href="#little-tree" x="74" y="373"/>
          <use href="#little-tree" x="374" y="393" transform="scale(.8) translate(93 98)"/>
          <use href="#little-tree" x="674" y="376" transform="scale(1.08) translate(-50 -28)"/>
          <use href="#little-tree" x="974" y="397" transform="scale(.72) translate(380 154)"/>
        </g>

        <!-- Road and grass -->
        <path d="M0 443c192-15 382-13 574 0 153 10 285 10 426-2v159H0z" fill="#e8d5b5"/>
        <path d="M0 452c229-13 462-10 678 1 123 7 220 5 322-3" fill="none" stroke="#d4ba91" stroke-width="3" opacity=".7"/>
        <path d="M0 505c240-17 452-14 668-2 128 7 234 4 332-5" fill="none" stroke="#fff8e6" stroke-width="5" stroke-linecap="round" stroke-dasharray="30 42" class="road-dashes"/>
        <path d="M0 551c176-12 337-7 489 1m133 4c145 5 250 1 378-7" fill="none" stroke="#d1c19e" stroke-width="2" opacity=".6"/>

        <!-- Soft ground shadow -->
        <ellipse cx="478" cy="485" rx="255" ry="19" fill="#53664d" opacity=".17" filter="url(#soft-shadow)"/>

        <!-- Bicycle wheels -->
        <g fill="none" stroke-linecap="round">
          <g>
            <circle cx="338" cy="390" r="91" stroke="#244642" stroke-width="11"/>
            <circle cx="338" cy="390" r="80" stroke="#fffdf6" stroke-width="3" opacity=".9"/>
            <g class="wheel-spin" stroke="#77918a" stroke-width="2">
              <path d="M338 309v162M257 390h162M281 333l114 114M395 333 281 447M307 313l62 154M261 360l154 60M369 313l-62 154M415 360l-154 60"/>
            </g>
            <circle cx="338" cy="390" r="8" fill="#f2a94c" stroke="#244642" stroke-width="4"/>
          </g>
          <g>
            <circle cx="626" cy="390" r="91" stroke="#244642" stroke-width="11"/>
            <circle cx="626" cy="390" r="80" stroke="#fffdf6" stroke-width="3" opacity=".9"/>
            <g class="wheel-spin" stroke="#77918a" stroke-width="2">
              <path d="M626 309v162M545 390h162M569 333l114 114M683 333 569 447M595 313l62 154M549 360l154 60M657 313l-62 154M703 360l-154 60"/>
            </g>
            <circle cx="626" cy="390" r="8" fill="#f2a94c" stroke="#244642" stroke-width="4"/>
          </g>
        </g>

        <!-- Bicycle frame -->
        <g fill="none" stroke="#397664" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M338 390 421 290 480 390 338 390"/>
          <path d="M421 290 550 285 480 390"/>
          <path d="M550 285 626 390"/>
          <path d="M550 285 557 267M535 267h43M421 290l-3-14M398 276h38"/>
        </g>
        <path d="M480 390 508 366" stroke="#244642" stroke-width="6" stroke-linecap="round"/>
        <g class="pedal-spin" fill="none" stroke="#244642" stroke-width="5" stroke-linecap="round">
          <path d="M480 390 480 361M480 390 480 419"/>
          <path d="M467 361h26M467 419h26" stroke-width="6"/>
          <circle cx="480" cy="390" r="7" fill="#f2a94c" stroke="#244642"/>
        </g>
        <path d="M411 278q10-9 30 0" fill="none" stroke="#244642" stroke-width="10" stroke-linecap="round"/>

        <!-- Pelican's feet and legs, placed behind the body. -->
        <g class="back-leg" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M420 247q7 34 19 58l19 49" stroke="#cb783e" stroke-width="13"/>
          <path d="M458 354q-1 13 9 21l16 5q9 1 10-5-2-5-10-7l-6-15" fill="#f2a94c" stroke="#b76438" stroke-width="4"/>
        </g>
        <g class="front-leg" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M446 246q3 36 17 59l-4 49" stroke="#e28b42" stroke-width="14"/>
          <path d="M459 354q-4 12 4 20l17 6q10 1 11-5-2-5-10-7l-7-15" fill="#ffc05a" stroke="#b76438" stroke-width="4"/>
        </g>

        <!-- The pelican, drawn as a single friendly, bobbing character. -->
        <g class="rider-bob">
          <!-- tail feathers -->
          <path d="M369 209q-31-17-49-6 15 22 42 23M372 219q-32 0-46 17 23 14 51 1" fill="#f8fbf2" stroke="#92aaa0" stroke-width="3" stroke-linejoin="round"/>
          <!-- body -->
          <path d="M369 221c1-38 32-64 72-62 36 1 62 24 60 56-2 35-29 54-69 53-36-1-63-17-63-47" fill="#fffef9" stroke="#8da89e" stroke-width="3"/>
          <path d="M392 192c20-22 52-25 74-9 19 14 23 35 12 52-13 20-41 25-66 11 19 0 33-11 36-25 3-15-10-29-29-32-10-2-19-1-27 3" fill="#d8ebe5" stroke="#9ab8ad" stroke-width="2.5" class="wing-tip"/>
          <path d="M405 221q21 4 34 19M414 208q18 4 29 18M425 197q15 5 23 16" fill="none" stroke="#aac8bd" stroke-width="3" stroke-linecap="round"/>
          <!-- curved neck -->
          <path d="M464 207c33-8 41-28 34-49-8-21 0-41 20-47 17-5 34 5 38 20 4 15-7 27-24 28-14 1-22-6-20-16" fill="none" stroke="#fffef9" stroke-width="27" stroke-linecap="round"/>
          <path d="M464 207c33-8 41-28 34-49-8-21 0-41 20-47 17-5 34 5 38 20 4 15-7 27-24 28-14 1-22-6-20-16" fill="none" stroke="#8da89e" stroke-width="3" stroke-linecap="round"/>
          <!-- head -->
          <circle cx="526" cy="115" r="24" fill="#fffef9" stroke="#8da89e" stroke-width="3"/>
          <circle cx="534" cy="110" r="3.6" fill="#183c3a"/>
          <circle cx="535" cy="109" r="1" fill="#fff"/>
          <path d="M520 99q10-11 22-3" fill="none" stroke="#e7eee5" stroke-width="5" stroke-linecap="round"/>
          <!-- long bill and elastic pouch -->
          <path d="M544 113q22-8 128 13-83 18-126 7z" fill="url(#beak)" stroke="#bc7037" stroke-width="3" stroke-linejoin="round"/>
          <path d="M548 132q37 12 111-2-7 38-43 51-42 10-68-49" fill="#f29d49" stroke="#bc7037" stroke-width="3" stroke-linejoin="round"/>
          <path d="M558 143q22 24 51 25" fill="none" stroke="#ffd17a" stroke-width="4" stroke-linecap="round" opacity=".9"/>
          <!-- little cheek and neck highlight -->
          <circle cx="516" cy="125" r="3" fill="#efb86a" opacity=".7"/>
        </g>

        <!-- Breezy accent marks -->
        <g fill="none" stroke="#74a89a" stroke-width="3" stroke-linecap="round" opacity=".8">
          <path d="M692 234h38m-22 11h21"/>
          <path d="M281 167h29m-18 11h20"/>
        </g>
        <g fill="#f5b955">
          <path d="m742 290 4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
          <circle cx="304" cy="273" r="3"/><circle cx="752" cy="163" r="3"/>
        </g>
      </svg>
      <figcaption class="caption">
        <span><strong>兜风日记 · 01</strong>　沿着绿绿的小路慢慢骑</span>
        <span>画在 SVG 里，轻轻循环</span>
      </figcaption>
    </figure>
  </main>
</body>
</html>
