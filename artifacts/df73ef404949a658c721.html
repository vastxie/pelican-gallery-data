<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(#87ceeb 0%, #c5e8ff 55%, #7ec86a 55%, #4a9a3a 100%);
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  .scene {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .caption {
    position: fixed;
    left: 16px;
    bottom: 12px;
    color: #143018;
    font-size: 14px;
    opacity: 0.8;
  }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <!-- sun -->
  <circle cx="760" cy="80" r="40" fill="#ffe566" />
  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="0" cy="70" rx="50" ry="22">
      <animate attributeName="cx" values="-80;980" dur="28s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="40" cy="62" rx="36" ry="18">
      <animate attributeName="cx" values="-40;1020" dur="28s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="180" cy="110" rx="42" ry="16">
      <animate attributeName="cx" values="-60;960" dur="36s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- ground -->
  <rect x="0" y="360" width="900" height="160" fill="#5cb348" />
  <path d="M0 360 Q 80 348 160 360 T 320 360 T 480 360 T 640 360 T 800 360 T 900 352 V 380 H0 Z" fill="#6dcc55" />

  <!-- rider group: rolls along the road -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-180 0; 980 0" dur="8s" repeatCount="indefinite" />

    <!-- slight bounce -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -6; 0 0" dur="0.45s" repeatCount="indefinite" />

      <!-- shadow -->
      <ellipse cx="210" cy="352" rx="90" ry="10" fill="#000" opacity="0.18" />

      <!-- bike frame -->
      <g stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M140 300 L190 250 L250 300" />
        <path d="M190 250 L190 210" />
        <path d="M165 210 L215 210" />
        <path d="M250 300 L285 250" />
        <path d="M250 300 L210 300" />
        <path d="M140 300 L100 250" />
      </g>
      <!-- seat -->
      <path d="M175 208 Q190 198 210 208" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round" />
      <!-- handlebar -->
      <path d="M90 238 Q100 228 115 238" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" />
      <line x1="100" y1="250" x2="100" y2="238" stroke="#333" stroke-width="4" />

      <!-- wheels -->
      <g>
        <circle cx="140" cy="300" r="38" fill="none" stroke="#222" stroke-width="6" />
        <circle cx="140" cy="300" r="6" fill="#444" />
        <g stroke="#888" stroke-width="2">
          <line x1="140" y1="268" x2="140" y2="332">
            <animateTransform attributeName="transform" type="rotate" from="0 140 300" to="360 140 300" dur="0.7s" repeatCount="indefinite" />
          </line>
          <line x1="108" y1="300" x2="172" y2="300">
            <animateTransform attributeName="transform" type="rotate" from="0 140 300" to="360 140 300" dur="0.7s" repeatCount="indefinite" />
          </line>
          <line x1="117" y1="277" x2="163" y2="323">
            <animateTransform attributeName="transform" type="rotate" from="0 140 300" to="360 140 300" dur="0.7s" repeatCount="indefinite" />
          </line>
          <line x1="117" y1="323" x2="163" y2="277">
            <animateTransform attributeName="transform" type="rotate" from="0 140 300" to="360 140 300" dur="0.7s" repeatCount="indefinite" />
          </line>
        </g>
      </g>
      <g>
        <circle cx="270" cy="300" r="38" fill="none" stroke="#222" stroke-width="6" />
        <circle cx="270" cy="300" r="6" fill="#444" />
        <g stroke="#888" stroke-width="2">
          <line x1="270" y1="268" x2="270" y2="332">
            <animateTransform attributeName="transform" type="rotate" from="0 270 300" to="360 270 300" dur="0.7s" repeatCount="indefinite" />
          </line>
          <line x1="238" y1="300" x2="302" y2="300">
            <animateTransform attributeName="transform" type="rotate" from="0 270 300" to="360 270 300" dur="0.7s" repeatCount="indefinite" />
          </line>
          <line x1="247" y1="277" x2="293" y2="323">
            <animateTransform attributeName="transform" type="rotate" from="0 270 300" to="360 270 300" dur="0.7s" repeatCount="indefinite" />
          </line>
          <line x1="247" y1="323" x2="293" y2="277">
            <animateTransform attributeName="transform" type="rotate" from="0 270 300" to="360 270 300" dur="0.7s" repeatCount="indefinite" />
          </line>
        </g>
      </g>

      <!-- pedals / legs crank -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 190 300" to="360 190 300" dur="0.7s" repeatCount="indefinite" />
        <line x1="168" y1="300" x2="212" y2="300" stroke="#555" stroke-width="4" />
        <circle cx="168" cy="300" r="5" fill="#c45c26" />
        <circle cx="212" cy="300" r="5" fill="#c45c26" />
      </g>

      <!-- pelican body -->
      <ellipse cx="200" cy="175" rx="42" ry="30" fill="#f4f1ea" stroke="#d9d3c7" />
      <!-- wing flap -->
      <g>
        <ellipse cx="188" cy="178" rx="28" ry="14" fill="#efeae0" stroke="#cfc8bb">
          <animateTransform attributeName="transform" type="rotate"
            values="-18 200 175; 22 200 175; -18 200 175" dur="0.55s" repeatCount="indefinite" />
        </ellipse>
      </g>
      <!-- neck -->
      <path d="M230 160 Q255 140 250 110" fill="none" stroke="#f4f1ea" stroke-width="14" stroke-linecap="round" />
      <!-- head -->
      <circle cx="252" cy="100" r="18" fill="#f7f4ee" stroke="#ddd6c8" />
      <!-- eye -->
      <circle cx="258" cy="96" r="3.2" fill="#222" />
      <circle cx="259.2" cy="95" r="1" fill="#fff" />
      <!-- beak -->
      <path d="M266 102 L330 108 L266 118 Z" fill="#f4a024" stroke="#d48412" />
      <!-- pouch -->
      <path d="M268 114 Q300 150 268 118" fill="#f6c15b" stroke="#e0a020" />
      <!-- crest -->
      <path d="M242 84 Q248 70 258 82" fill="none" stroke="#e8dcc8" stroke-width="3" stroke-linecap="round" />

      <!-- legs to pedals (stylized) -->
      <path d="M185 198 Q175 240 172 292" fill="none" stroke="#f0a050" stroke-width="5" stroke-linecap="round">
        <animate attributeName="d"
          values="M185 198 Q170 240 168 296; M185 198 Q190 250 190 300; M185 198 Q170 240 168 296"
          dur="0.7s" repeatCount="indefinite" />
      </path>
      <path d="M205 198 Q215 245 210 296" fill="none" stroke="#e89040" stroke-width="5" stroke-linecap="round">
        <animate attributeName="d"
          values="M205 198 Q220 250 212 300; M205 198 Q200 240 198 292; M205 198 Q220 250 212 300"
          dur="0.7s" repeatCount="indefinite" />
      </path>
      <!-- arms to handlebar -->
      <path d="M175 165 Q140 190 108 236" fill="none" stroke="#f4f1ea" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>
</svg>
<div class="caption">鹈鹕骑车 · SVG 动画</div>
</body>
</html>
