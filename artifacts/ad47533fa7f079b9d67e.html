<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  :root { --ink: #1d2833; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4d5764; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* “先描边、后填色”两遍绘制：同一组图形先用 .pass-o 画出加粗的墨色轮廓，
     再原样画一遍填色。重叠的部件之间没有内线，只留下整体外轮廓。
     .ov 标记的细节（眼睛、羽毛纹路等）只在填色那一遍出现。 */
  .shape { fill: var(--o, var(--c)); stroke: var(--o, none); stroke-width: var(--ow, 0px); stroke-linejoin: round; stroke-linecap: round; }
  .line  { fill: none; stroke: var(--o, var(--c)); stroke-width: calc(var(--w) + var(--ow, 0px)); stroke-linecap: round; stroke-linejoin: round; }
  .ov    { display: var(--dn, inline); }
  .pass-o { --o: var(--ink); --dn: none; }

  .ui {
    position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 14px;
    padding: 8px; border-radius: 999px; color: #fff; user-select: none;
    background: rgba(16, 28, 40, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font: 13px/1 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    opacity: .72; transition: opacity .2s;
  }
  .ui:hover, .ui:focus-within { opacity: 1; }
  .ui button {
    min-width: 58px; padding: 7px 14px; border: 0; border-radius: 999px; cursor: pointer;
    background: #ff9f1c; color: #2b1a05; font: inherit; font-weight: 600;
  }
  .ui button:hover { background: #ffb547; }
  .ui label { display: flex; align-items: center; gap: 8px; padding-right: 10px; }
  .ui input { width: 110px; accent-color: #ff9f1c; }
  .ui output { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const n2 = v => +v.toFixed(2);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rad = d => d * Math.PI / 180;

  /* ---------- 几何常量（自行车 / 鹈鹕，坐标系原点 = 后轴）---------- */
  const V = 520;                        // 地面速度 px/s
  const WHEEL_R = 70;                   // 车轮滚动半径
  const RING_R = 20, COG_R = 11;        // 牙盘 / 飞轮节圆半径
  const GEAR = COG_R / RING_R;          // 曲柄转角 = 车轮转角 × GEAR
  const BB = { x: 102, y: 16 }, CRANK = 36;
  const HIP = { x: 78, y: -148 }, THIGH = 92, SHIN = 108;
  const ANKLE = { x: -14, y: -14 };     // 脚踝相对踏板中心的位置
  const GRIP = { x: 221, y: -136 };     // 车把握持点
  const SHOULDER = { x: 108, y: -186 }, ARM = 64;

  const NECK = [{ x: 112, y: -205 }, { x: 166, y: -214 }, { x: 98, y: -266 }, { x: 150, y: -289 }];

  /* ---------- 小工具 ---------- */
  const bez = (p, t) => {
    const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    return { x: a * p[0].x + b * p[1].x + c * p[2].x + d * p[3].x, y: a * p[0].y + b * p[1].y + c * p[2].y + d * p[3].y };
  };

  // 两段骨骼反向运动学：返回关节点。dir = +1 / -1 选择弯折方向
  function ik(a, b, l1, l2, dir) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(l1 - l2) + .01), l1 + l2 - .01);
    const cosA = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const ang = Math.atan2(dy, dx) + dir * Math.acos(Math.max(-1, Math.min(1, cosA)));
    return { x: a.x + l1 * Math.cos(ang), y: a.y + l1 * Math.sin(ang) };
  }

  // 沿折线生成变宽“管状”多边形路径（脖子、大腿、袖子、围巾）
  function tube(pts, ws, capA, capB) {
    const n = pts.length, A = [], B = [];
    for (let i = 0; i < n; i++) {
      const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(n - 1, i + 1)];
      let tx = p1.x - p0.x, ty = p1.y - p0.y; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      const h = ws[i] / 2;
      A.push(n2(pts[i].x - ty * h) + ',' + n2(pts[i].y + tx * h));
      B.push(n2(pts[i].x + ty * h) + ',' + n2(pts[i].y - tx * h));
    }
    const hA = n2(ws[0] / 2), hB = n2(ws[n - 1] / 2);
    let d = 'M' + A.join('L');
    d += capB ? `A${hB},${hB} 0 0 0 ${B[n - 1]}` : `L${B[n - 1]}`;
    d += 'L' + B.slice(0, n - 1).reverse().join('L');
    if (capA) d += `A${hA},${hA} 0 0 0 ${A[0]}`;
    return d + 'Z';
  }

  /* ---------- 元素引用 ---------- */
  const el = {};
  ['rearSpin', 'frontSpin', 'cogUse', 'ringUse', 'chain', 'crankN', 'pedalN', 'crankF', 'pedalF', 'torso', 'neckP', 'headG',
   'crestG', 'tailG', 'eyeG', 'pouchG', 'scarfBand', 'scarfBand2', 'scarfT1', 'scarfT2', 'nThigh', 'nShin', 'nFoot', 'fThigh', 'fShin', 'fFoot',
   'wSleeve', 'wHand', 'wFeathers', 'fishTail', 'fishG', 'sunRays', 'gulls', 'speedLines', 'weave', 'spokes'
  ].forEach(id => el[id] = $(id));

  /* ---------- 静态细节：辐条 / 车筐编织 / 阳光 ---------- */
  (() => {
    let s = '';
    for (let i = 0; i < 16; i++) {
      const a = i * 2 * Math.PI / 16, b = a + (i % 2 ? 1 : -1) * .42;
      s += `<line x1="${n2(8 * Math.cos(a))}" y1="${n2(8 * Math.sin(a))}" x2="${n2(60 * Math.cos(b))}" y2="${n2(60 * Math.sin(b))}"/>`;

    let r = '';
    for (let i = 0; i < 12; i++) {

  })();

  /* ---------- 链条路径（两个圆的外公切线）---------- */
  let chainPeriod = 5;
  (() => {
    const O1 = { x: 0, y: 0 }, O2 = BB, r1 = COG_R, r2 = RING_R;
    const d = Math.hypot(O2.x - O1.x, O2.y - O1.y), beta = Math.atan2(O2.y - O1.y, O2.x - O1.x), gam = Math.asin((r2 - r1) / d);
    const aUp = beta - Math.PI / 2 - gam, aDown = beta + Math.PI / 2 + gam;
    const P = (O, r, a) => ({ x: n2(O.x + r * Math.cos(a)), y: n2(O.y + r * Math.sin(a)) });
    const a1 = P(O1, r1, aUp), b1 = P(O2, r2, aUp), b2 = P(O2, r2, aDown), a2 = P(O1, r1, aDown);
    el.chain.setAttribute('d', `M${a1.x},${a1.y}L${b1.x},${b1.y}A${r2},${r2} 0 1 1 ${b2.x},${b2.y}L${a2.x},${a2.y}A${r1},${r1} 0 0 1 ${a1.x},${a1.y}Z`);
    const L = el.chain.getTotalLength(), n = Math.round(L / 5.4);

  })();

  /* ---------- 场景：可无缝循环的分层 ---------- */
  const TILE = 1200, defs = document.querySelector('#scene defs');
  const layers = [];
  const rng = seed => { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; };

  function addLayer(id, markup, speed, drift = 0) {

  const cloud = (x, y, s, o = 1) => `<use href="#cloud" transform="translate(${x} ${y}) scale(${s})" opacity="${o}"/>`;
  addLayer('clouds', cloud(60, 92, 1.1) + cloud(330, 164, .8, .9) + cloud(600, 66, 1.35) + cloud(890, 146, .9, .85) + cloud(1100, 62, .7, .8), .02, 9);

  const island = (x, s, house) => `<g transform="translate(${x} 305) scale(${s})">

      <path d="M70,0C100,-16 140,-22 180,-16C210,-22 240,-14 260,0Z" fill="#69a8a3"/>
      ${house ? `<g transform="translate(158 -32)"><path d="M-7,0L7,0L4.5,-34L-4.5,-34Z" fill="#fff"/><path d="M-6.2,-8L6.2,-8L5.8,-14L-5.8,-14Z" fill="#e35d4f"/><path d="M-5.2,-22L5.2,-22L4.9,-27L-4.9,-27Z" fill="#e35d4f"/><rect x="-5" y="-40" width="10" height="6" fill="#ffd45e"/><path d="M-7,-40L0,-48L7,-40Z" fill="#e35d4f"/></g>` : ''}
    </g>`;

  const boat = `<g id="boat" transform="translate(640 322)"><path d="M-22,0L22,0L16,7L-16,7Z" fill="#8a4b32"/><path d="M-1,-2L-1,-40L-20,-6Z" fill="#fff"/><path d="M2,-2L2,-32L18,-6Z" fill="#ffe7b8"/><path d="M-1,-40L-1,-44L6,-42Z" fill="#e35d4f"/></g>`;

  addLayer('foam', `<path d="${foam}L1200,14L0,14Z" transform="translate(0 388)" fill="#fff" opacity=".85"/><path d="${foam}L1200,14L0,14Z" transform="translate(-18 380)" fill="#fff" opacity=".35"/>`, .16);

  const palm = (x, y, s, flip) => {
    const fr = 'M0,0C12,-24 46,-26 70,10C46,-8 20,-8 0,0Z', angs = [-80, -46, -14, 18];
    let leaves = '';
    angs.forEach(a => leaves += `<path d="${fr}" fill="#2a8a55" transform="scale(-1 1) rotate(${a})"/>`);
    angs.forEach(a => leaves += `<path d="${fr}" fill="#3fae6c" transform="rotate(${a})"/>`);

      <path d="M-6,0C-8,-38 0,-84 10,-118L19,-115C12,-84 6,-40 6,0Z" fill="#a4733f"/>
      <path d="M1,0C-1,-40 5,-84 13,-116" fill="none" stroke="#7d5330" stroke-width="1.6" opacity=".55"/>
      <g transform="translate(14 -118)">${leaves}<circle cx="-3" cy="6" r="4.5" fill="#7a4b26"/><circle cx="6" cy="8" r="4.5" fill="#6b4020"/></g></g>`;
  };
  const tuft = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-8,0C-8,-12 -14,-18 -18,-20C-8,-18 -3,-10 -2,0Z" fill="#3a9a5a"/><path d="M-3,0C-2,-16 0,-24 2,-28C5,-22 5,-10 3,0Z" fill="#52b673"/><path d="M2,0C4,-10 9,-16 16,-18C10,-10 8,-6 8,0Z" fill="#3a9a5a"/></g>`;
  addLayer('beach',
    `<path d="M0,44C120,20 260,52 400,30C560,6 700,50 860,28C980,12 1100,40 1200,44L1200,80L0,80Z" transform="translate(0 388)" fill="#f2dcaa" opacity=".65"/>` +
    palm(90, 436, 1.05, 1) + palm(360, 438, .8, -1) + palm(690, 436, 1.2, 1) +
    palm(930, 438, .9, -1) + palm(1130, 436, .75, 1) +
    tuft(230, 436, 1) + tuft(590, 438, .9) + tuft(820, 436, 1.1) + tuft(1030, 438, .8), .32);

  let pk = '', ps = '';
  for (let x = 6; x < TILE; x += 30) { pk += `M${x},450L${x},430L${x + 5},424L${x + 10},430L${x + 10},450Z`; ps += `M${x + 7},450L${x + 7},429L${x + 10},430L${x + 10},450Z`; }
  const fence = `<path d="M0,432h1200v3h-1200zM0,444h1200v3h-1200z" fill="#e9eff3"/><path d="${pk}" fill="#f7f9fb"/><path d="${ps}" fill="#dbe3ea"/>`;
  addLayer('fence', fence, .75);

  let curb = ''; for (let x = 40; x < TILE; x += 150) curb += `M${x},450h1.6v8h-1.6z`;
  curb = `<path d="${curb}" fill="#a9b6c2"/>`;
  addLayer('curb', curb, .9);

  const peb = (() => {

      const cx = r() * TILE, cy = 464 + r() * 26, w = 3 + r() * 8, h = w * .3, e = `M${n2(cx - w)},${n2(cy)}a${n2(w)},${n2(h)} 0 1 0 ${n2(2 * w)},0a${n2(w)},${n2(h)} 0 1 0 ${n2(-2 * w)},0z`;
      if (r() > .45) dk += e; else lt += e;
    }

    return `<path d="${dk}" fill="#4b5562" opacity=".55"/><path d="${lt}" fill="#8895a3" opacity=".45"/><path d="${cr}" fill="none" stroke="#3f4855" stroke-width="1" opacity=".5"/>`;
  })();
  addLayer('pebbles', peb, 1);

  let dash = ''; for (let x = 0; x < TILE; x += 120) dash += `M${x},508h66v6h-66z`;
  dash = `<path d="${dash}" fill="#fff" opacity=".85"/>`;
  addLayer('dash', dash, 1.25);

  /* ---------- 海鸥 / 速度线 ---------- */
  const gullData = [{ x: 180, y: 78, s: 1, ph: 0, v: 26 }, { x: 470, y: 42, s: .8, ph: 1.7, v: 20 }, { x: 640, y: 62, s: .65, ph: 3.1, v: 32 }, { x: 880, y: 84, s: .9, ph: 4.4, v: 24 }];
  gullData.forEach(g => { g.el = document.createElementNS(NS, 'path'); el.gulls.appendChild(g.el); });
  const lineData = [{ y: 178, len: 90, v: 1250, x: 100, o: .34 }, { y: 236, len: 60, v: 1500, x: 700, o: .3 }, { y: 302, len: 130, v: 1100, x: 400, o: .3 },
                    { y: 356, len: 80, v: 1400, x: 900, o: .32 }, { y: 420, len: 110, v: 1300, x: 250, o: .3 }, { y: 268, len: 70, v: 1600, x: 1000, o: .26 }];
  lineData.forEach(l => { l.el = document.createElementNS(NS, 'line'); l.el.setAttribute('stroke-width', 2.6); l.el.setAttribute('stroke-opacity', l.o); el.speedLines.appendChild(l.el); });

  /* ---------- 帧渲染 ---------- */
  const foot = (pfx, pedal, hipOff) => {
    const ank = { x: pedal.x + ANKLE.x, y: pedal.y + ANKLE.y };
    const hip = { x: HIP.x + hipOff.x, y: HIP.y + hipOff.y };
    const knee = ik(hip, ank, THIGH, SHIN, -1);
    el[pfx + 'Shin'].setAttribute('d', `M${n2(knee.x)},${n2(knee.y)}L${n2(ank.x)},${n2(ank.y)}`);
    el[pfx + 'Foot'].setAttribute('transform', `translate(${n2(ank.x)} ${n2(ank.y)})`);
    el[pfx + 'Thigh'].setAttribute('d', tube([hip, knee], [29, 16], true, true));
  };

  const feathers = [];
  for (let i = 0; i < 5; i++) {
    const g = document.createElementNS(NS, 'path');
    const len = [68, 74, 74, 68, 60][i];
    g.setAttribute('class', 'shape'); g.setAttribute('style', '--c:url(#gFeather)');
    g.setAttribute('d', `M0,0C14,-8 ${n2(len * .7)},-9 ${len},-1C${n2(len * .7)},8 14,9 0,0Z`);
    el.wFeathers.appendChild(g); feathers.push(g);
  }

  function render(t) {
    const wa = V * t / WHEEL_R;                // 车轮转角
    const th = wa * GEAR;                      // 曲柄转角
    const wdeg = n2(wa * 180 / Math.PI % 360), cdeg = n2(th * 180 / Math.PI % 360);

    /* 场景分层滚动 */
    const dist = V * t;
    for (const L of layers) L.g.setAttribute('transform', `translate(${-n2((dist * L.speed + t * L.drift) % TILE)} 0)`);
    el.sunRays.setAttribute('transform', `rotate(${n2(t * 5 % 360)})`);
    el.gulls.childNodes.forEach((p, i) => {
      const g = gullData[i], a = 6 * Math.sin(t * 6.5 + g.ph);
      const x = ((g.x - t * g.v) % 1200 + 1200) % 1200 - 120, y = g.y + 5 * Math.sin(t * .9 + g.ph);
      p.setAttribute('transform', `translate(${n2(x)} ${n2(y)}) scale(${g.s})`);
      p.setAttribute('d', `M-11,${n2(a)}Q-5.5,${n2(a - 6)} 0,0Q5.5,${n2(a - 6)} 11,${n2(a)}`);
    });
    lineData.forEach(l => {
      const x = ((l.x - t * l.v) % 1500 + 1500) % 1500 - 250;
      l.el.setAttribute('x1', n2(x)); l.el.setAttribute('x2', n2(x + l.len)); l.el.setAttribute('y1', l.y); l.el.setAttribute('y2', l.y);
    });
    boatEl.setAttribute('transform', `translate(640 ${n2(322 + 1.2 * Math.sin(t * 1.6))}) rotate(${n2(2 * Math.sin(t * 1.3))})`);

    /* 车轮 / 传动 */
    el.rearSpin.setAttribute('transform', `rotate(${wdeg})`);
    el.frontSpin.setAttribute('transform', `rotate(${wdeg})`);
    el.cogUse.setAttribute('transform', `rotate(${wdeg})`);
    el.ringUse.setAttribute('transform', `rotate(${cdeg})`);
    el.chain.setAttribute('stroke-dashoffset', n2(-(RING_R * th) % chainPeriod));

    /* 曲柄、踏板（踏板始终保持水平），两条腿用 IK 追踪踏板 */
    const cN = { x: BB.x + CRANK * Math.cos(th), y: BB.y + CRANK * Math.sin(th) };
    const cF = { x: BB.x - CRANK * Math.cos(th), y: BB.y - CRANK * Math.sin(th) };
    el.crankN.setAttribute('d', `M${BB.x},${BB.y}L${n2(cN.x)},${n2(cN.y)}`);
    el.pedalN.setAttribute('transform', `translate(${n2(cN.x)} ${n2(cN.y)})`);
    el.crankF.setAttribute('d', `M${BB.x},${BB.y}L${n2(cF.x)},${n2(cF.y)}`);
    el.pedalF.setAttribute('transform', `translate(${n2(cF.x)} ${n2(cF.y)})`);
    foot('n', cN, { x: 0, y: 0 });
    foot('f', cF, { x: 3, y: -2 });

    /* 躯干随蹬踏节奏微微起伏、摇摆 */
    const sway = 1.3 * Math.sin(2 * th + .5), bob = 1.1 * Math.sin(2 * th + 1.2);
    el.torso.setAttribute('transform', `translate(0 ${n2(bob)}) rotate(${n2(sway)} ${HIP.x} ${HIP.y})`);
    const torsoPt = p => {
      const a = rad(sway), c = Math.cos(a), s = Math.sin(a), dx = p.x - HIP.x, dy = p.y - HIP.y;
      return { x: HIP.x + dx * c - dy * s, y: HIP.y + dx * s + dy * c + bob };
    };

    /* 脖子（S 形贝塞尔 + 变宽）与头 */
    const P = [NECK[0], { x: NECK[1].x + 3 * Math.sin(t * 1.6), y: NECK[1].y },
               { x: NECK[2].x + 5 * Math.sin(t * 2.3 + 1), y: NECK[2].y },
               { x: NECK[3].x + 2 * Math.sin(t * 1.9), y: NECK[3].y + 2 * Math.cos(t * 2.4) }];
    const pts = [], ws = [], N = 18, neckW = u => lerp(32, 19, u);

    const headAng = 5 + 2.5 * Math.sin(t * 1.7 + 1) - .7 * sway;
    el.headG.setAttribute('transform', `translate(${n2(P[3].x)} ${n2(P[3].y)}) rotate(${n2(headAng)})`);
    el.tailG.setAttribute('transform', `rotate(${n2(3.5 * Math.sin(t * 6.3))} 10 -196)`);
    el.crestG.setAttribute('transform', `rotate(${n2(7 * Math.sin(t * 9))} -12 -10)`);
    el.pouchG.setAttribute('transform', `translate(0 5) scale(1 ${n2(1 + .05 * Math.sin(t * 4.2))}) translate(0 -5)`);
    const ph = t % 3.7, blink = ph < .16 ? Math.sin(ph / .16 * Math.PI) : 0;
    el.eyeG.setAttribute('transform', `scale(1 ${n2(1 - .92 * blink)})`);

    /* 围巾：绕脖一圈，两条尾巴迎风飘动 */
    const u0 = .4, np = bez(P, u0), q0 = bez(P, u0 - .03), q1 = bez(P, u0 + .03);
    let tx = q1.x - q0.x, ty = q1.y - q0.y; const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
    const nx = -ty, ny = tx, hw = neckW(u0) / 2, K = { x: np.x - nx * (hw + 1), y: np.y - ny * (hw + 1) };
    const band = `M${n2(np.x - nx * (hw + 3.5))},${n2(np.y - ny * (hw + 3.5))}L${n2(np.x + nx * (hw + 3.5))},${n2(np.y + ny * (hw + 3.5))}`;
    el.scarfBand.setAttribute('d', band);
    el.scarfBand2.setAttribute('d', `M${n2(np.x - nx * (hw + 3) + ty * 2.6)},${n2(np.y - ny * (hw + 3) - tx * 2.6)}L${n2(np.x + nx * (hw + 3) + ty * 2.6)},${n2(np.y + ny * (hw + 3) - tx * 2.6)}`);
    const ribbon = (ox, oy, dx, dy, len, w0, w1, amp, ph0) => {

    const S = torsoPt(SHOULDER), E = ik(S, GRIP, ARM, ARM, 1);
    const C = { x: 2 * E.x - (S.x + GRIP.x) / 2, y: 2 * E.y - (S.y + GRIP.y) / 2 };

    el.wSleeve.setAttribute('d', tube(sp, sw, true, true));
    el.wHand.setAttribute('transform', `translate(${GRIP.x - 3} ${GRIP.y - 3})`);
    feathers.forEach((fe, i) => {
      const r = sp[2 + i * 2], ang = 171 - i * 5.5 + 3 * Math.sin(t * 5 + i * 1.3);
      fe.setAttribute('transform', `translate(${n2(r.x)} ${n2(r.y)}) rotate(${n2(ang)})`);
    });

    /* 鱼尾摆动 */
    el.fishTail.setAttribute('transform', `translate(0 -36) rotate(${n2(16 * Math.sin(t * 7))})`);
    el.fishG.setAttribute('transform', `translate(246 -124) rotate(${n2(12 + 3 * Math.sin(t * 3.3))})`);
  }

  /* ---------- 视野自适应：始终以鹈鹕为中心，高、宽都不小于 540（宽屏向两侧延伸，竖屏向上下延伸）---------- */
  const svg = $('scene');
  const fit = () => {
    const a = innerWidth / innerHeight, h = Math.max(540, 540 / a), w = h * a;
    svg.setAttribute('viewBox', `${n2(480 - w / 2)} ${n2(275 - h / 2)} ${n2(w)} ${n2(h)}`);
  };
  addEventListener('resize', fit); fit();

  /* ---------- 播放控制 ---------- */
  let t = 0, speed = 1, paused = false, last = performance.now();
  const btn = $('btn'), spd = $('spd'), out = $('spdOut');
  const setPaused = p => { paused = p; btn.textContent = p ? '播放' : '暂停'; };
  btn.addEventListener('click', () => setPaused(!paused));
  spd.addEventListener('input', () => { speed = +spd.value; out.textContent = speed.toFixed(1) + '×'; });
  addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPaused(!paused); } });
  setPaused(paused);

  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!paused) { t += dt * speed; render(t); }
    requestAnimationFrame(tick);
  }
  render(t);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
