<!DOCTYPE html>

<style>

  html, body { height: 100%; }
  body {
    margin: 0;

    place-items: center;
    padding: 24px;
    background: radial-gradient(1200px 620px at 50% 10%, #1c2e3c 0%, #0b1218 58%, #06090c 100%);

  .stage {
    position: relative;
    width: min(1020px, 100%);
    border-radius: 22px;
    overflow: hidden;
    cursor: pointer;
    background: #8fd4ff;
    box-shadow: 0 34px 90px -24px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 255, 255, .09);
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .tip {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px 8px 8px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .18em;
    color: rgba(255, 255, 255, .78);
    background: linear-gradient(to top, rgba(4, 18, 28, .38), transparent);
    pointer-events: none;
    user-select: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .stage { cursor: default; }
  }
</style>

<body>

<script>
(function () {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const DEG = 180 / Math.PI;
  const $ = (id) => document.getElementById(id);

  /* ---------------- 机械参数 ---------------- */
  const REAR  = { x: 300, y: 368 };
  const FRONT = { x: 560, y: 368 };
  const BB    = { x: 430, y: 360 };   // 五通（曲柄中心）
  const CRANK = 22;                   // 曲柄半径
  const HIP   = { x: 368, y: 256 };   // 髋关节
  const L_THIGH = 80;                 // 大腿长
  const L_SHIN  = 86;                 // 小腿长

  const WHEEL_SPEED = 330;            // 车轮 度/秒
  const CRANK_SPEED = 200;            // 脚踏 度/秒

  /* ---------------- 元素 ---------------- */
  const scene      = $("scene");
  const rearWheel  = $("rearWheel");
  const frontWheel = $("frontWheel");
  const crank      = $("crank");
  const nearPedal  = $("nearPedal");
  const farPedal   = $("farPedal");
  const head       = $("head");
  const tail       = $("tail");
  const dustGroup  = $("dust");
  const speedGroup = $("speed");

  const legNear = { thigh: $("nearThigh"), shin: $("nearShin"), foot: $("nearFoot") };
  const legFar  = { thigh: $("farThigh"),  shin: $("farShin"),  foot: $("farFoot")  };

  /* ---------------- 生成车轮辐条 ---------------- */
  [rearWheel, frontWheel].forEach(function (wheel) {
    const holder = wheel.querySelector(".spokes");
    for (let i = 0; i < 12; i++) {
      const spoke = document.createElementNS(NS, "line");
      spoke.setAttribute("x1", 0);
      spoke.setAttribute("y1", 0);
      spoke.setAttribute("x2", 0);
      spoke.setAttribute("y2", -51);
      spoke.setAttribute("transform", "rotate(" + i * 30 + ")");
      holder.appendChild(spoke);
    }
  });

  /* ---------------- 生成尘土 ---------------- */
  const puffs = [];
  for (let i = 0; i < 8; i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("fill", "#f4f9ee");
    dustGroup.appendChild(c);
    puffs.push({ el: c, phase: i / 8, base: 6 + (i % 3) * 4 });
  }

  /* ---------------- 生成速度线 ---------------- */
  const streaks = [];
  for (let i = 0; i < 5; i++) {
    const l = document.createElementNS(NS, "line");
    l.setAttribute("stroke", "#ffffff");
    l.setAttribute("stroke-width", 3);
    speedGroup.appendChild(l);
    streaks.push({ el: l, phase: i / 5, y: 96 + ((i * 97) % 190) });
  }

  /* ---------------- 背景视差层 ---------------- */
  const layers = [];
  document.querySelectorAll("[data-speed]").forEach(function (g) {
    layers.push({ g: g, speed: parseFloat(g.getAttribute("data-speed")) });
  });

  /* ---------------- 踏板的圆周位置 ---------------- */
  // 与 SVG rotate() 同向：局部点 (0, r) 旋转 a 后落在 (-r·sin a, r·cos a)
  function pedalAt(ang) {
    return {
      x: BB.x - CRANK * Math.sin(ang),
      y: BB.y + CRANK * Math.cos(ang)
    };
  }

  /* ---------------- 两节反向骨骼（IK）---------------- */
  // 已知髋关节固定、脚踩踏板，解出膝盖位置 → 大腿/小腿角度
  function solveLeg(target) {
    const dx = target.x - HIP.x;
    const dy = target.y - HIP.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(Math.max(d, Math.abs(L_THIGH - L_SHIN) + 1), L_THIGH + L_SHIN - 1);

    const phi  = Math.atan2(dy, dx);
    const cosA = Math.min(1, Math.max(-1,
      (d * d + L_THIGH * L_THIGH - L_SHIN * L_SHIN) / (2 * d * L_THIGH)));
    const A       = Math.acos(cosA);
    const thighA  = phi - A;                       // 膝盖朝前弯
    const knee    = {
      x: HIP.x + L_THIGH * Math.cos(thighA),
      y: HIP.y + L_THIGH * Math.sin(thighA)
    };
    const shinA = Math.atan2(target.y - knee.y, target.x - knee.x);
    return { thighA: thighA, shinA: shinA, knee: knee };
  }

  function applyLeg(leg, target) {
    const s = solveLeg(target);
    leg.thigh.setAttribute("transform",
      "translate(" + HIP.x + " " + HIP.y + ") rotate(" + (s.thighA * DEG).toFixed(2) + ")");
    leg.shin.setAttribute("transform",
      "translate(" + s.knee.x.toFixed(2) + " " + s.knee.y.toFixed(2) + ") rotate(" + (s.shinA * DEG).toFixed(2) + ")");
    // 脚掌始终保持水平（踏板不翻转）
    leg.foot.setAttribute("transform",
      "translate(" + L_SHIN + " 0) rotate(" + (-s.shinA * DEG).toFixed(2) + ")");
  }

  /* ---------------- 逐帧绘制 ---------------- */
  function render(t) {
    // 车轮
    const wheelDeg = t * WHEEL_SPEED;
    rearWheel.setAttribute("transform",  "translate(" + REAR.x + " " + REAR.y + ") rotate(" + wheelDeg.toFixed(2) + ")");
    frontWheel.setAttribute("transform", "translate(" + FRONT.x + " " + FRONT.y + ") rotate(" + wheelDeg.toFixed(2) + ")");

    // 曲柄
    const crankDeg = t * CRANK_SPEED;
    const th = crankDeg / DEG;
    crank.setAttribute("transform", "translate(" + BB.x + " " + BB.y + ") rotate(" + crankDeg.toFixed(2) + ")");

    // 踏板 + 双腿
    const pNear = pedalAt(th);
    const pFar  = pedalAt(th + Math.PI);
    nearPedal.setAttribute("transform", "translate(" + pNear.x.toFixed(2) + " " + pNear.y.toFixed(2) + ")");
    farPedal.setAttribute("transform",  "translate(" + pFar.x.toFixed(2)  + " " + pFar.y.toFixed(2)  + ")");
    applyLeg(legNear, pNear);
    applyLeg(legFar,  pFar);

    // 车身起伏（每圈两次）
    const bob = Math.sin(th * 2);
    scene.setAttribute("transform",
      "translate(0 " + (bob * 1.7).toFixed(2) + ") rotate(" + (bob * 0.45).toFixed(2) + " 430 430)");
    // 点头、尾羽摆动
    head.setAttribute("transform",
      "rotate(" + (Math.sin(th * 2 + 0.9) * 2.1).toFixed(2) + " 452 132)");
    tail.setAttribute("transform",
      "rotate(" + (Math.sin(th * 2 + 2.1) * 3.4).toFixed(2) + " 300 170)");

    // 背景滚动（双份贴图无缝循环）
    for (let i = 0; i < layers.length; i++) {
      const off = (t * layers[i].speed) % 900;
      layers[i].g.setAttribute("transform", "translate(" + (-off).toFixed(2) + " 0)");
    }

    // 速度线
    for (let i = 0; i < streaks.length; i++) {
      const s = streaks[i];
      const u = (t * 1.15 + s.phase) % 1;
      const x = 880 - u * 1040;
      const len = 46 + 70 * Math.sin(s.phase * Math.PI);
      s.el.setAttribute("x1", x.toFixed(1));
      s.el.setAttribute("y1", s.y);
      s.el.setAttribute("x2", (x + len).toFixed(1));
      s.el.setAttribute("y2", s.y);
      s.el.setAttribute("opacity", (Math.sin(u * Math.PI) * 0.42).toFixed(3));
    }

    // 车轮扬起的尘土
    for (let i = 0; i < puffs.length; i++) {
      const p = puffs[i];
      const u = (t * 0.5 + p.phase) % 1;
      const x = REAR.x - 8 - u * 150;
      const y = 424 - Math.sin(u * Math.PI) * 30 - u * 8;
      p.el.setAttribute("cx", x.toFixed(1));
      p.el.setAttribute("cy", y.toFixed(1));
      p.el.setAttribute("r", (p.base + u * 15).toFixed(1));
      p.el.setAttribute("opacity", ((1 - u) * 0.55).toFixed(3));
    }
  }

  /* ---------------- 主循环（可暂停） ---------------- */
  let last = 0, elapsed = 0;
  const tip = $("tip");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let paused = reduceMotion;
  if (reduceMotion) tip.textContent = "已按系统偏好暂停 · 点击画面播放";

  function loop(now) {
    requestAnimationFrame(loop);
    if (!last) last = now;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (!paused) elapsed += dt;
    render(elapsed);
  }

  $("stageBox").addEventListener("click", function () {
    paused = !paused;
    tip.textContent = paused ? "已暂停 · 点击继续" : "点击画面暂停 / 继续";
  });

  document.addEventListener("visibilitychange", function () { last = 0; });

  render(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
