<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕的骑行日记</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap');
    :root { color-scheme: light; --ink:#284e49; --muted:#82948a; --paper:#f5f4ec; --coral:#eb946b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#e5eae2; color:var(--ink); font-family:"DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif; display:grid; place-items:center; padding:30px; }
    .page { width:min(1440px, 100%); min-height:min(900px, calc(100vh - 60px)); background:var(--paper); border:1px solid rgba(40,78,73,.08); box-shadow:0 18px 60px rgba(44,72,61,.08); overflow:hidden; position:relative; }
    header { height:94px; padding:0 6%; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #e3e8dc; }
    .brand { display:flex; align-items:center; gap:11px; font-size:13px; font-weight:700; letter-spacing:.14em; }
    .brand-mark { width:34px; height:34px; border:1px solid #9cb4a3; border-radius:50%; display:grid; place-items:center; font-size:18px; line-height:1; }
    .header-right { display:flex; align-items:center; gap:12px; color:#768c7e; font-size:11px; letter-spacing:.14em; font-weight:700; }
    .header-right span { width:7px; height:7px; background:#e99a70; border-radius:50%; }
    main { position:relative; padding:57px 6% 0; }
    .intro { position:relative; z-index:2; pointer-events:none; }
    .eyebrow { color:#d18b67; letter-spacing:.19em; font-size:10px; font-weight:700; margin:0 0 17px; }
    h1 { margin:0; font-weight:500; font-size:clamp(36px, 4.4vw, 64px); letter-spacing:.04em; line-height:1.18; }
    h1 em { font-family:"Playfair Display", Georgia, serif; font-weight:600; letter-spacing:-.035em; color:#e59a72; }
    .subtitle { color:#8a9b8e; font-size:13px; letter-spacing:.08em; line-height:1.8; margin:16px 0 0; }
    .scene-wrap { position:relative; margin-top:-108px; }
    .scene { display:block; width:100%; height:auto; overflow:visible; }
    .scene-note { position:absolute; right:2%; top:18%; color:#a0aea0; font-size:10px; line-height:1.9; letter-spacing:.12em; text-align:right; }
    .scene-note strong { display:block; color:#718a78; font-size:11px; letter-spacing:.16em; }
    .ground-dash { animation:road 2.2s linear infinite; }
    .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
    .crank { transform-origin:620px 416px; animation:spin 2s linear infinite; }
    .rider { animation:bob 2s ease-in-out infinite; }
    .leg { transform-origin:568px 295px; animation:pedal 2s ease-in-out infinite; }
    .leg.back { animation-delay:-1s; }
    @keyframes pedal { 0%,100% { transform:rotate(-7deg); } 50% { transform:rotate(7deg); } }
    .cloud-one { animation:drift 8s ease-in-out infinite alternate; }
    .cloud-two { animation:drift 11s ease-in-out infinite alternate-reverse; }
    .bird { animation:bird 3s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
    @keyframes drift { to { transform:translateX(20px); } }
    @keyframes bird { 50% { transform:translateY(-6px); } }
    @keyframes road { to { stroke-dashoffset:80; } }
    .footer { margin:0 6%; padding:23px 0 30px; border-top:1px solid #dce4d9; display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .footer-left { display:flex; align-items:center; gap:14px; }
    .badge { width:37px; height:37px; display:grid; place-items:center; border:1px solid #cbd9c9; border-radius:50%; font-size:17px; }
    .footer-title { font-size:12px; letter-spacing:.08em; font-weight:700; }
    .footer-sub { color:#9aab9e; font-size:10px; margin-top:5px; letter-spacing:.06em; }
    .footer-right { color:#9baea0; font-size:10px; font-weight:700; letter-spacing:.15em; text-align:right; }
    .footer-right b { color:#d78f6a; margin:0 8px; }
    @media (max-width:700px) {
      body { padding:12px; }
      .page { min-height:calc(100vh - 24px); display:flex; flex-direction:column; }
      header { height:70px; padding:0 6%; }
      .header-right { font-size:9px; }
      main { padding-top:40px; flex:1; display:flex; flex-direction:column; justify-content:center; }
      .scene-wrap { margin-top:10px; margin-left:-8%; margin-right:-8%; }
      .scene-note { display:none; }
      .subtitle { font-size:12px; }
      .footer { padding:20px 0; }
      .footer-right { font-size:8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand"><div class="brand-mark">✳</div> LITTLE WANDERS</div>
      <div class="header-right"><span></span> AN ANIMATED POSTCARD</div>
    </header>
    <main>
      <div class="intro">
        <p class="eyebrow">A LITTLE MOMENT OF JOY &nbsp; / &nbsp; 01</p>
        <h1>今天，<em>慢慢骑。</em></h1>
        <p class="subtitle">微风刚好，阳光正好。<br>和鹈鹕一起，去兜个风吧。</p>
      </div>
      <div class="scene-wrap">
        <div class="scene-note"><strong>THE SCENIC ROUTE</strong>TAKE YOUR TIME<br>ENJOY THE RIDE</div>
        <svg class="scene" viewBox="0 0 1200 620" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
          <title id="scene-title">鹈鹕的骑行日记</title>
          <desc id="scene-desc">一只戴着小帽子的鹈鹕骑着自行车，悠闲地经过阳光下的草地。车轮和踏板不断转动。</desc>
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e2ede2"/><stop offset="1" stop-color="#eff3e8"/></linearGradient>
            <linearGradient id="pouch" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#f7be7c"/><stop offset="1" stop-color="#df9465"/></linearGradient>
          </defs>
          <!-- Soft landscape -->
          <path d="M188 456C208 290 339 151 555 121c200-28 411 40 492 191 24 45 33 96 31 144Z" fill="url(#sky)"/>
          <circle cx="878" cy="183" r="49" fill="#f3d6a8" opacity=".9"/>
          <circle cx="878" cy="183" r="63" fill="none" stroke="#e8cfa7" stroke-width="1" opacity=".65"/>
          <g fill="#fffef7" opacity=".82" class="cloud-one"><path d="M342 224c7-14 24-17 36-9 8-22 40-23 49-2 12-3 25 5 25 16H328c0-9 6-14 14-15Z"/></g>
          <g fill="#fffef7" opacity=".7" class="cloud-two"><path d="M757 279c5-10 17-13 26-7 6-16 29-17 36-2 9-2 18 4 18 12h-90c0-6 4-10 10-11Z"/></g>
          <g class="bird" fill="none" stroke="#91ad9a" stroke-linecap="round" stroke-width="2"><path d="M941 254q8-9 16 0 8-9 16 0"/><path d="M1000 224q5-6 11 0 5-6 11 0"/></g>
          <path d="M171 454c121-45 207-50 323-17 109-40 204-42 315-5 102-35 197-22 277 22v64H171Z" fill="#d3e4cf"/>
          <path d="M116 491c154-30 280-29 403-4 142-29 278-26 402-2 61-9 115-9 164 0v53H116Z" fill="#c1d7bd"/>
          <g fill="#91b99c" opacity=".8"><circle cx="269" cy="458" r="3"/><circle cx="292" cy="469" r="2"/><circle cx="958" cy="456" r="3"/><circle cx="978" cy="466" r="2"/><circle cx="1001" cy="455" r="2"/></g>
          <g stroke="#91b596" stroke-width="2" fill="none" stroke-linecap="round"><path d="M226 490q-4-15-10-19m10 19q3-12 10-15M1015 490q-3-15-10-20m10 20q4-11 11-15M334 490q-3-10-8-13m8 13q3-9 8-11"/></g>
          <path d="M88 520H1113" stroke="#8caf9b" stroke-width="2" stroke-linecap="round"/>
          <path class="ground-dash" d="M118 548H1082" stroke="#c3d3bf" stroke-width="2" stroke-dasharray="24 56" stroke-linecap="round"/>
          <ellipse cx="620" cy="520" rx="278" ry="13" fill="#8daa93" opacity=".13"/>
          <!-- Bicycle wheels -->
          <g class="wheel" fill="none" stroke-linecap="round">
            <circle cx="450" cy="416" r="102" stroke="#3d625c" stroke-width="7"/>
            <circle cx="450" cy="416" r="92" stroke="#f9f7e9" stroke-width="3"/>
            <g stroke="#99b8a9" stroke-width="1.5"><path d="M450 315v202M349 416h202M379 345l142 142M521 345 379 487M411 323l78 186M357 377l186 78M489 323l-78 186M357 455l186-78"/></g>
            <circle cx="450" cy="416" r="7" fill="#e8a172" stroke="#3d625c" stroke-width="3"/>
          </g>
          <g class="wheel" fill="none" stroke-linecap="round">
            <circle cx="790" cy="416" r="102" stroke="#3d625c" stroke-width="7"/>
            <circle cx="790" cy="416" r="92" stroke="#f9f7e9" stroke-width="3"/>
            <g stroke="#99b8a9" stroke-width="1.5"><path d="M790 315v202M689 416h202M719 345l142 142M861 345 719 487M751 323l78 186M697 377l186 78M829 323l-78 186M697 455l186-78"/></g>
            <circle cx="790" cy="416" r="7" fill="#e8a172" stroke="#3d625c" stroke-width="3"/>
          </g>
          <!-- Frame and handlebars -->
          <g fill="none" stroke="#df8d68" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M450 416 552 309 620 416H450l102-107h157L620 416"/><path d="M790 416 709 309l-11-32"/></g>
          <path d="M684 277h37q13 0 13-12" fill="none" stroke="#476a60" stroke-width="6" stroke-linecap="round"/>
          <path d="M675 276h17" stroke="#476a60" stroke-width="8" stroke-linecap="round"/>
          <path d="M540 304h-22q-8 0-8-6 0-4 9-4h45q6 0 6 4 0 6-7 6Z" fill="#476a60"/>
          <path d="M620 416 450 416" stroke="#b97b61" stroke-width="2" stroke-dasharray="3 3"/>
          <circle cx="620" cy="416" r="19" fill="#f5f4ec" stroke="#df8d68" stroke-width="4"/>
          <!-- Rider -->
          <g class="rider">
            <!-- Back leg -->
            <g class="leg back"><path d="M552 282q-8 35 19 66l33 36" fill="none" stroke="#d99468" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M599 383h29" stroke="#d99468" stroke-width="8" stroke-linecap="round"/></g>
            <!-- Tail and body -->
            <path d="M490 242q-29-8-48-27 2 30 39 54Z" fill="#f7f6e9" stroke="#d7e0d2" stroke-width="2"/>
            <path d="M479 233c22-29 73-41 120-26 33 10 59 32 70 59-15 34-57 49-105 44-52-5-87-32-85-77Z" fill="#fffdf1" stroke="#d6e0d3" stroke-width="2.5"/>
            <path d="M501 246c22 2 44-12 67-17 25-5 49 5 62 23-22 3-30 25-57 28-27 4-53-7-72-34Z" fill="#e5ede0"/>
            <path d="M514 254q30 20 59 9" fill="none" stroke="#cbdacb" stroke-width="2" stroke-linecap="round"/>
            <!-- Long curved neck -->
            <path d="M625 269c33-7 48-25 43-50-3-16-12-28-13-46-2-27 14-44 38-43 25 0 39 18 34 39-4 16-16 25-17 37-2 30 4 49-11 69-16 22-44 28-74 20Z" fill="#fffdf1" stroke="#d6e0d3" stroke-width="2.5"/>
            <!-- Beak and pouch -->
            <path d="M710 166q40 7 111 26-48 3-95 0-14-4-16-26Z" fill="#edaa74" stroke="#d89767" stroke-width="2" stroke-linejoin="round"/>
            <path d="M716 184q33 10 105 8-54 39-91 32-19-4-23-27Z" fill="url(#pouch)" stroke="#d89767" stroke-width="2" stroke-linejoin="round"/>
            <path d="M720 191q45 8 91 2" fill="none" stroke="#c9825e" stroke-width="1.5"/>
            <circle cx="698" cy="160" r="3.8" fill="#3c5c54"/><circle cx="699" cy="159" r="1.1" fill="#fff"/>
            <circle cx="688" cy="175" r="7" fill="#efb8a2" opacity=".55"/>
            <!-- Hat -->
            <path d="M673 136q4-21 22-22 17 0 23 24Z" fill="#7caa91" stroke="#638e78" stroke-width="2"/>
            <path d="M669 137q26 6 55 1" fill="none" stroke="#638e78" stroke-width="5" stroke-linecap="round"/>
            <path d="M678 129q17 4 34 1" fill="none" stroke="#eac990" stroke-width="3"/>
            <!-- Front leg -->
            <g class="leg"><path d="M568 295q-2 28 25 54l33 45" fill="none" stroke="#e7a375" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M623 394h25" stroke="#e7a375" stroke-width="8" stroke-linecap="round"/></g>
          </g>
          <g class="crank">
            <path d="M620 397v38" stroke="#526f63" stroke-width="4" stroke-linecap="round"/>
            <path d="M609 397h22M609 435h22" stroke="#526f63" stroke-width="6" stroke-linecap="round"/>
            <circle cx="620" cy="416" r="5" fill="#526f63"/>
          </g>
          <!-- little flowers -->
          <g fill="#f4eee0"><circle cx="185" cy="490" r="3"/><circle cx="180" cy="494" r="3"/><circle cx="190" cy="494" r="3"/><circle cx="185" cy="498" r="3"/><circle cx="1048" cy="487" r="3"/><circle cx="1043" cy="491" r="3"/><circle cx="1053" cy="491" r="3"/><circle cx="1048" cy="495" r="3"/></g>
          <g fill="#e7b47f"><circle cx="185" cy="494" r="2"/><circle cx="1048" cy="491" r="2"/></g>
        </svg>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-left"><div class="badge">☼</div><div><div class="footer-title">把日子骑成喜欢的样子</div><div class="footer-sub">A little sunshine for your day.</div></div></div>
      <div class="footer-right">GOOD DAYS <b>✳</b> SLOW RIDES</div>
    </footer>
  </div>
</body>
</html>
