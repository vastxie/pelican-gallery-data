  <g id="pedalNear"><rect x="-13" y="-4.5" width="26" height="9" rx="4.5" fill="#2d2a26"/></g>

  <g id="footNear"><path d="M-8,-4 C-14,3 -13,11 -4,12 L10,12 Q24,12 33,5 Q28,13 19,14 Q31,14 36,11 Q30,18 14,18 L-4,18 C-13,18 -14,3 -8,-4 Z" fill="#f39c2d" stroke="#2d2a26" stroke-width="2.6" stroke-linejoin="round"/></g>

  <path id="wingF1" fill="none" stroke="#2d2a26" stroke-width="2" opacity="0.4"/>

<p class="caption">纯 SVG + JavaScript 手绘动画 · 点击画面可暂停 / 继续</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PI = Math.PI;

  // ---- 参数 ----
  const GS = 380;                 // 地面速度 px/s
  const WR = 72;                  // 车轮半径
  const W_W = GS / WR;            // 车轮角速度 rad/s(与地面真实耦合)
  const C_W = W_W / 1.9;          // 曲柄角速度(传动比 1.9)
  const BB = { x: 430, y: 486 };  // 中轴
  const CRANK = 32;               // 曲柄长
  const L1 = 96, L2 = 90;         // 大腿 / 小腿
  const GRIP = { x: 514, y: 332 };// 车把握点

  // ---- 生成重复元素 ----
  function buildSpokes(g, cx, cy) {
    for (let i = 0; i < 12; i++) {
      const a = i * PI / 6;
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', cx + 12 * Math.cos(a)); l.setAttribute('y1', cy + 12 * Math.sin(a));
      l.setAttribute('x2', cx + 53 * Math.cos(a)); l.setAttribute('y2', cy + 53 * Math.sin(a));
      g.appendChild(l);
    }
  }
  buildSpokes($('spokesR'), 302, 464);
  buildSpokes($('spokesF'), 568, 464);

  for (let i = 0; i < 8; i++) {
    const a = i * PI / 4;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 108 + 44 * Math.cos(a)); l.setAttribute('y1', 96 + 44 * Math.sin(a));
    l.setAttribute('x2', 108 + 58 * Math.cos(a)); l.setAttribute('y2', 96 + 58 * Math.sin(a));
    $('sunRays').appendChild(l);
  }

  for (let i = 0; i < 13; i++) {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', i * 96); r.setAttribute('y', 562);
    r.setAttribute('width', 52); r.setAttribute('height', 8); r.setAttribute('rx', 4);
    r.setAttribute('fill', '#eef0f2'); r.setAttribute('opacity', '0.9');
    $('layerDashes').appendChild(r);
  }

  const flowerDefs = [
    { x: 36,  y: 514, c: '#ffffff' }, { x: 120, y: 526, c: '#ffd93d' },
    { x: 212, y: 512, c: '#ffb3c1' }, { x: 298, y: 524, c: '#ffffff' },
    { x: 372, y: 516, c: '#ffd93d' }, { x: 451, y: 527, c: '#ffb3c1' },
  ];
  for (let k = 0; k < 3; k++) for (const f of flowerDefs) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', f.x + k * 480); c.setAttribute('cy', f.y); c.setAttribute('r', 3.4);
    c.setAttribute('fill', f.c); c.setAttribute('stroke', '#2d2a26'); c.setAttribute('stroke-width', 1.4);
    $('layerFlowers').appendChild(c);
    const d = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    d.setAttribute('cx', f.x + k * 480); d.setAttribute('cy', f.y); d.setAttribute('r', 1.2);
    d.setAttribute('fill', f.c === '#ffffff' ? '#f2a541' : '#ffffff');
    $('layerFlowers').appendChild(d);
  }

  // ---- 两段式反向运动学:求膝盖位置(膝盖朝前) ----
  function ik(hx, hy, tx, ty) {
    const dx = tx - hx, dy = ty - hy;
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(L1 - L2) + 0.5, Math.min(L1 + L2 - 0.5, d));
    const a = Math.acos((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d));
    const base = Math.atan2(dy, dx);
    const k1x = hx + L1 * Math.cos(base - a), k1y = hy + L1 * Math.sin(base - a);
    const k2x = hx + L1 * Math.cos(base + a), k2y = hy + L1 * Math.sin(base + a);
    return k1x > k2x ? { x: k1x, y: k1y } : { x: k2x, y: k2y };
  }

  const legs = [
    { phase: PI, hip: { x: 368, y: 326 }, o: $('legFarO'),  i: $('legFarI'),  foot: $('footFar'),  crank: $('crankFar'),  pedal: $('pedalFar')  },
    { phase: 0,  hip: { x: 376, y: 330 }, o: $('legNearO'), i: $('legNearI'), foot: $('footNear'), crank: $('crankNear'), pedal: $('pedalNear') },
  ];

  function setWing(sx, sy) {
    let ux = GRIP.x - sx, uy = GRIP.y - sy;
    const L = Math.hypot(ux, uy); ux /= L; uy /= L;
    const nx = -uy, ny = ux;
    const P = (f, w) => (sx + ux * L * f + nx * w).toFixed(1) + ',' + (sy + uy * L * f + ny * w).toFixed(1);
    $('wing').setAttribute('d',
      `M${P(0,-14)} Q${P(0.45,-28)} ${P(1.02,-7)} Q${P(1.1,1)} ${P(1.03,9)} Q${P(0.6,36)} ${P(0.2,44)} Q${P(-0.06,30)} ${P(0,-14)} Z`);
    $('wingF1').setAttribute('d', `M${P(0.16,8)} Q${P(0.55,24)} ${P(0.95,4)}`);
    $('wingF2').setAttribute('d', `M${P(0.12,22)} Q${P(0.47,34)} ${P(0.8,20)}`);
  }

  function scarfD(t, b) {
    const x0 = 404, y0 = 244 + b * 0.8, N = 7, seg = 17;
    const xs = [], ys = [], ws = [];
    for (let i = 0; i <= N; i++) {
      xs.push(x0 - i * seg);
      ys.push(y0 - i * 1.1 + Math.sin(t * 7 - i * 0.85) * (1.6 + i * 1.8) + Math.sin(t * 3.1 - i * 0.5) * i * 0.6);
      ws.push(Math.max(2, 7.5 - i * 0.72));
    }
    let d = `M${xs[0]},${(ys[0] - ws[0]).toFixed(1)}`;
    for (let i = 1; i <= N; i++) d += ` L${xs[i]},${(ys[i] - ws[i]).toFixed(1)}`;
    d += ` L${xs[N] + 9},${ys[N].toFixed(1)}`;
    for (let i = N; i >= 0; i--) d += ` L${xs[i]},${(ys[i] + ws[i]).toFixed(1)}`;
    return d + ' Z';
  }

  const clouds = [
    { el: $('cloudA'), x0: 180, y: 84,  v: 17, s: 1    },
    { el: $('cloudB'), x0: 520, y: 56,  v: 11, s: 0.68 },
    { el: $('cloudC'), x0: 800, y: 126, v: 7,  s: 0.5  },
  ];

  // ---- 主循环 ----
  let T = 0, last = performance.now();
  let running = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let nextBlink = 2.4, blinkStart = -9;
  $('scene').addEventListener('click', () => { running = !running; });

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running) T += dt;
    const t = T;
    const ca = t * C_W;                          // 曲柄角
    const bob = 2.2 * Math.sin(2 * ca - 0.5);    // 身体起伏
    const hb = 1.1 * Math.sin(2 * ca + 1.3);     // 头部微动(鸟类头部稳定)

    const wd = (t * W_W * 180 / PI) % 360;
    $('spokesR').setAttribute('transform', `rotate(${wd} 302 464)`);
    $('spokesF').setAttribute('transform', `rotate(${wd} 568 464)`);
    $('sunRays').setAttribute('transform', `rotate(${(t * 5) % 360} 108 96)`);

    for (const s of legs) {
      const a = ca + s.phase;
      const px = BB.x + CRANK * Math.cos(a), py = BB.y + CRANK * Math.sin(a);
      s.crank.setAttribute('x2', px.toFixed(1)); s.crank.setAttribute('y2', py.toFixed(1));
      s.pedal.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)})`);
      const ax = px - 10, ay = py - 13;          // 脚踝在脚蹬上方
      const hx = s.hip.x, hy = s.hip.y + bob;
      const k = ik(hx, hy, ax, ay);
      const d = `M${hx},${hy.toFixed(1)} L${k.x.toFixed(1)},${k.y.toFixed(1)} L${ax.toFixed(1)},${ay.toFixed(1)}`;
      s.o.setAttribute('d', d); s.i.setAttribute('d', d);
      s.foot.setAttribute('transform', `translate(${ax.toFixed(1)} ${ay.toFixed(1)}) rotate(${(8 * Math.sin(a + 2.3)).toFixed(1)})`);
    }

    $('bodyG').setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    const nd = `M402,${(262 + bob).toFixed(1)} C442,${(252 + bob * 0.7).toFixed(1)} 438,${(204 + hb * 0.6).toFixed(1)} 474,${(184 + hb).toFixed(1)}`;
    $('neckO').setAttribute('d', nd); $('neckI').setAttribute('d', nd);
    $('headG').setAttribute('transform', `translate(0 ${hb.toFixed(2)}) rotate(${(2.2 * Math.sin(t * 1.4)).toFixed(2)} 486 172)`);
    $('fish').setAttribute('transform', `rotate(${(13 * Math.sin(t * 6.2)).toFixed(1)} 570 186)`);

    setWing(392, 276 + bob);
    $('scarf').setAttribute('d', scarfD(t, bob));
    $('knot').setAttribute('cy', (245 + bob * 0.8).toFixed(1));

    if (t > nextBlink) { blinkStart = t; nextBlink = t + 2.2 + Math.random() * 2.8; }
    const bp = (t - blinkStart) / 0.16;
    $('lid').setAttribute('ry', (bp > 0 && bp < 1) ? (6 * Math.sin(PI * bp)).toFixed(2) : 0);

    $('chain').setAttribute('stroke-dashoffset', (-(t * C_W * 16) % 12).toFixed(2));

    const mv = (id, v, p) => $(id).setAttribute('transform', `translate(${(-((t * v) % p)).toFixed(1)} 0)`);
    mv('layerHillsFar', GS * 0.05, 960);
    mv('layerHillsNear', GS * 0.11, 960);
    mv('layerTrees', GS * 0.32, 960);
    mv('layerFlowers', GS * 0.62, 480);
    mv('layerDashes', GS, 96);

    for (const c of clouds) {
      const x = ((c.x0 - c.v * t) % 1200 + 1200) % 1200 - 120;
      c.el.setAttribute('transform', `translate(${x.toFixed(1)} ${c.y}) scale(${c.s})`);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
