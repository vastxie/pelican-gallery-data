<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e8">
  <title>鹈鹕的海岸骑行 · SVG 动画</title>
  <style>
    :root {
      --ink: #183f47;
      --paper: #f5f1e8;
      --coral: #e96f51;
      --pedal-time: 1.35s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255,255,255,.9), transparent 28%),
        var(--paper);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 34px;
    }

    .page { width: min(1280px, 100%); }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 4px 22px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .7;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 3px;
      border-radius: 3px;
      background: var(--coral);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3.5vw, 46px);
      line-height: 1.1;
      letter-spacing: -.045em;
      font-weight: 800;
    }

    h1 span { color: var(--coral); }

    .controls { display: flex; align-items: center; gap: 14px; }

    .ride-status {
      font-size: 12px;
      letter-spacing: .08em;
      opacity: .65;
      white-space: nowrap;
    }

    button {
      appearance: none;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      min-width: 112px;
      padding: 11px 18px;
      font: 700 13px/1 inherit;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      transition: background .2s, color .2s, transform .2s;
    }

    button:hover { background: var(--ink); color: #fff; transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid rgba(233,111,81,.35); outline-offset: 3px; }

    .pause-icon { display: flex; gap: 3px; align-items: center; height: 12px; }
    .pause-icon::before, .pause-icon::after { content: ""; width: 3px; height: 11px; background: currentColor; border-radius: 2px; }
    .paused .pause-icon::before { width: 0; height: 0; background: none; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid currentColor; border-radius: 0; }
    .paused .pause-icon::after { display: none; }

    .scene {
      position: relative;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 26px;
      background: #dcefeb;
      box-shadow: 8px 9px 0 rgba(24,63,71,.1);
      isolation: isolate;
    }

    svg { display: block; width: 100%; height: auto; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 18px 5px 0;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: .6;
    }

    .footer-note { display: flex; align-items: center; gap: 8px; }
    .footer-note::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #5d998b; box-shadow: 0 0 0 4px rgba(93,153,139,.12); }

    /* SVG animation */
    .cloud-one { animation: cloud-drift 25s linear infinite; }
    .cloud-two { animation: cloud-drift 34s -15s linear infinite; }
    .cloud-three { animation: cloud-drift 29s -7s linear infinite; }
    @keyframes cloud-drift { from { transform: translateX(1600px); } to { transform: translateX(-420px); } }

    .wave-lines { animation: waves 6s linear infinite; }
    @keyframes waves { to { stroke-dashoffset: -120; } }

    .ride-bob { animation: ride-bob var(--pedal-time) ease-in-out infinite; }
    @keyframes ride-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

    .chain { animation: chain-move .5s linear infinite; }
    @keyframes chain-move { to { stroke-dashoffset: -20; } }

    .road-dashes { animation: road-move 1s linear infinite; }
    @keyframes road-move { to { stroke-dashoffset: -170; } }

    .grass-a { animation: grass-pass 5.5s linear infinite; }
    .grass-b { animation: grass-pass 7s -3.5s linear infinite; }
    .grass-c { animation: grass-pass 6.2s -1.2s linear infinite; }
    @keyframes grass-pass { from { transform: translateX(1600px); } to { transform: translateX(-250px); } }

    .scarf-tail { animation: scarf-wave .7s ease-in-out infinite alternate; transform-origin: 594px 237px; }
    @keyframes scarf-wave { from { transform: rotate(-3deg) scaleX(1); } to { transform: rotate(5deg) scaleX(1.04); } }

    .head-look { animation: head-look 4s ease-in-out infinite; transform-origin: 614px 262px; }
    @keyframes head-look { 0%, 42%, 100% { transform: rotate(0); } 50%, 80% { transform: rotate(2deg); } }

    .sun-rays { animation: sun-spin 30s linear infinite; transform-origin: 1195px 169px; }
    @keyframes sun-spin { to { transform: rotate(360deg); } }

    .speed-line { animation: speed-pulse 1.4s ease-in-out infinite; }
    .speed-line:nth-child(2) { animation-delay: -.45s; }
    .speed-line:nth-child(3) { animation-delay: -.9s; }
    @keyframes speed-pulse { 0%, 100% { opacity: .15; transform: translateX(8px); } 50% { opacity: .7; transform: translateX(-8px); } }

    .paused svg *, .paused svg *::before, .paused svg *::after { animation-play-state: paused !important; }

    @media (max-width: 700px) {
      body { padding: 18px; align-items: start; }
      header { align-items: center; margin-bottom: 16px; }
      .ride-status { display: none; }
      button { min-width: 46px; width: 46px; height: 46px; padding: 0; }
      .button-label { display: none; }
      .scene { border-radius: 18px; box-shadow: 5px 6px 0 rgba(24,63,71,.1); }
      footer { font-size: 9px; }
      footer > span:last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      svg * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

  <script>
    const button = document.getElementById('toggleAnimation');
    const scene = document.querySelector('.scene');
    const svg = document.getElementById('pelicanScene');
    const status = document.getElementById('rideStatus');
    const label = button.querySelector('.button-label');
    let paused = false;

    button.addEventListener('click', () => {
      paused = !paused;
      scene.classList.toggle('paused', paused);
      button.classList.toggle('paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      label.textContent = paused ? '继续骑行' : '暂停动画';
      status.textContent = paused ? '歇一会儿 · 已暂停' : '海风正好 · 骑行中';
      if (paused) svg.pauseAnimations();
      else svg.unpauseAnimations();
    });
  </script>
