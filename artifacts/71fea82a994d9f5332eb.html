<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骑自行车的鹈鹕</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eaf6ff;
  }
  svg { width: min(92vw, 880px); height: auto; display: block; }

  /* ---- CSS 负责与踩踏无关的环境动画 ---- */
  @keyframes sunSpin   { to { transform: rotate(360deg); } }
  @keyframes cloudMove { from { transform: translateX(900px); } to { transform: translateX(-420px); } }
  @keyframes dashMove  { to { transform: translateX(-140px); } }
  @keyframes speckMove { to { transform: translateX(-90px); } }
  @keyframes speedMove { to { transform: translateX(-500px); } }

  .sunrays { transform-box: fill-box; transform-origin: center; animation: sunSpin 36s linear infinite; }
  .cloud   { animation: cloudMove linear infinite; }
  .dashes  { animation: dashMove  .5s  linear infinite; }
  .specks  { animation: speckMove .32s linear infinite; }
  .speed   { animation: speedMove .7s  linear infinite; }
</style>
</head>
<body>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车前进">
  <desc>2D SVG 动画：一只系着围巾的鹈鹕蹬着自行车，车筐里有一条鱼，背景是太阳、云朵和移动的公路。</desc>

  <!-- ===== 天空 ===== -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a2d2ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- ===== 太阳 ===== -->
  <g class="sunrays" stroke="#ffd60a" stroke-width="6" stroke-linecap="round">
    <line x1="162" y1="95" x2="178" y2="95"/><line x1="58" y1="95" x2="42" y2="95"/>
    <line x1="110" y1="43" x2="110" y2="27"/><line x1="110" y1="147" x2="110" y2="163"/>
    <line x1="146.8" y1="131.8" x2="158.1" y2="143.1"/><line x1="73.2" y1="131.8" x2="61.9" y2="143.1"/>
    <line x1="146.8" y1="58.2" x2="158.1" y2="46.9"/><line x1="73.2" y1="58.2" x2="61.9" y2="46.9"/>
  </g>
  <circle cx="110" cy="95" r="42" fill="#ffd60a" stroke="#ffb703" stroke-width="4"/>

  <!-- ===== 云朵与小鸟（从右向左飘） ===== -->
  <g class="cloud" style="animation-duration:57s; animation-delay:-12s">
    <g transform="translate(0,120) scale(1.1)" fill="#ffffff" opacity="0.95">
      <ellipse cx="0" cy="0" rx="40" ry="22"/><ellipse cx="34" cy="-10" rx="30" ry="18"/><ellipse cx="-34" cy="-8" rx="28" ry="16"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:72s; animation-delay:-45s">
    <g transform="translate(0,185) scale(0.75)" fill="#ffffff" opacity="0.9">
      <ellipse cx="0" cy="0" rx="40" ry="22"/><ellipse cx="34" cy="-10" rx="30" ry="18"/><ellipse cx="-34" cy="-8" rx="28" ry="16"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:64s; animation-delay:-30s">
    <g transform="translate(0,70) scale(1.35)" fill="#ffffff" opacity="0.9">
      <ellipse cx="0" cy="0" rx="40" ry="22"/><ellipse cx="34" cy="-10" rx="30" ry="18"/><ellipse cx="-34" cy="-8" rx="28" ry="16"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:40s; animation-delay:-6s">
    <path d="M0 90 Q7 81 14 90 Q21 81 28 90" fill="none" stroke="#2d3142" stroke-width="3" opacity="0.6"/>
  </g>
  <g class="cloud" style="animation-duration:46s; animation-delay:-25s">
    <path d="M0 150 Q6 142 12 150 Q18 142 24 150" fill="none" stroke="#2d3142" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- ===== 远山 / 草地 / 公路 ===== -->
  <ellipse cx="180" cy="600" rx="340" ry="120" fill="#99d98c"/>
  <ellipse cx="640" cy="610" rx="330" ry="130" fill="#b5e48c"/>
  <rect x="0" y="538" width="800" height="10" fill="#7fbf72"/>
  <rect x="0" y="548" width="800" height="52" fill="#8d99ae"/>

  <!-- 路面虚线：向后移动制造前进感 -->
  <g class="dashes" fill="#ffffff" opacity="0.85">
    <rect x="-140" y="570" width="70" height="8" rx="4"/><rect x="0" y="570" width="70" height="8" rx="4"/>
    <rect x="140" y="570" width="70" height="8" rx="4"/><rect x="280" y="570" width="70" height="8" rx="4"/>
    <rect x="420" y="570" width="70" height="8" rx="4"/><rect x="560" y="570" width="70" height="8" rx="4"/>
    <rect x="700" y="570" width="70" height="8" rx="4"/><rect x="840" y="570" width="70" height="8" rx="4"/>
    <rect x="980" y="570" width="70" height="8" rx="4"/>
  </g>
  <g class="specks" fill="#6c757d" opacity="0.5">
    <rect x="-90" y="590" width="26" height="5" rx="2"/><rect x="0" y="590" width="26" height="5" rx="2"/>
    <rect x="90" y="590" width="26" height="5" rx="2"/><rect x="180" y="590" width="26" height="5" rx="2"/>
    <rect x="270" y="590" width="26" height="5" rx="2"/><rect x="360" y="590" width="26" height="5" rx="2"/>
    <rect x="450" y="590" width="26" height="5" rx="2"/><rect x="540" y="590" width="26" height="5" rx="2"/>
    <rect x="630" y="590" width="26" height="5" rx="2"/><rect x="720" y="590" width="26" height="5" rx="2"/>
    <rect x="810" y="590" width="26" height="5" rx="2"/><rect x="900" y="590" width="26" height="5" rx="2"/>
  </g>

  <!-- 速度线（在主体后方掠过） -->
  <g class="speed" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="30" y1="240" x2="120" y2="240"/><line x1="60" y1="300" x2="180" y2="300"/>
    <line x1="20" y1="360" x2="110" y2="360"/>
    <line x1="530" y1="240" x2="620" y2="240"/><line x1="560" y1="300" x2="680" y2="300"/>
    <line x1="520" y1="360" x2="610" y2="360"/>
  </g>

  <!-- 车身阴影 -->
  <ellipse cx="420" cy="556" rx="210" ry="9" fill="#000000" opacity="0.08"/>

  <!-- ===== 自行车 ===== -->
  <!-- 后轮 -->
  <g>
    <circle cx="290" cy="480" r="70" fill="none" stroke="#2b2d42" stroke-width="10"/>
    <circle cx="290" cy="480" r="57" fill="none" stroke="#ced4da" stroke-width="4"/>
    <g stroke="#9aa5b1" stroke-width="3">
      <line x1="234" y1="480" x2="346" y2="480"/><line x1="290" y1="424" x2="290" y2="536"/>
      <line x1="250.4" y1="440.4" x2="329.6" y2="519.6"/><line x1="329.6" y1="440.4" x2="250.4" y2="519.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 290 480" to="360 290 480" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle cx="290" cy="480" r="9" fill="#495057" stroke="#2d3142" stroke-width="3"/>
  </g>
  <!-- 前轮 -->
  <g>
    <circle cx="550" cy="480" r="70" fill="none" stroke="#2b2d42" stroke-width="10"/>
    <circle cx="550" cy="480" r="57" fill="none" stroke="#ced4da" stroke-width="4"/>
    <g stroke="#9aa5b1" stroke-width="3">
      <line x1="494" y1="480" x2="606" y2="480"/><line x1="550" y1="424" x2="550" y2="536"/>
      <line x1="510.4" y1="440.4" x2="589.6" y2="519.6"/><line x1="589.6" y1="440.4" x2="510.4" y2="519.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 550 480" to="360 550 480" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle cx="550" cy="480" r="9" fill="#495057" stroke="#2d3142" stroke-width="3"/>
  </g>

  <!-- 链条 -->
  <g stroke="#6c757d" stroke-width="3">
    <line x1="290" y1="472" x2="415" y2="469"/>
    <line x1="290" y1="488" x2="415" y2="501"/>
  </g>

  <!-- 车架 -->
  <g stroke="#118ab2" stroke-width="8" stroke-linecap="round">
    <line x1="290" y1="480" x2="415" y2="485"/>   <!-- 后下叉 -->
    <line x1="290" y1="480" x2="378" y2="368"/>   <!-- 后上叉 -->
    <line x1="415" y1="485" x2="378" y2="368"/>   <!-- 座管 -->
    <line x1="415" y1="485" x2="558" y2="378"/>   <!-- 下管 -->
    <line x1="378" y1="368" x2="548" y2="352"/>   <!-- 上管 -->
    <line x1="556" y1="378" x2="550" y2="480"/>   <!-- 前叉 -->
  </g>
  <line x1="546" y1="350" x2="558" y2="380" stroke="#0b6f8f" stroke-width="10" stroke-linecap="round"/>
  <!-- 车把 -->
  <line x1="549" y1="352" x2="546" y2="322" stroke="#2d3142" stroke-width="7" stroke-linecap="round"/>
  <path d="M546 322 Q552 310 570 313" fill="none" stroke="#2d3142" stroke-width="8" stroke-linecap="round"/>
  <!-- 车座 -->
  <path d="M352 358 C358 348 392 346 402 354 C404 360 398 364 388 364 L356 366 Z"
        fill="#8b5e34" stroke="#2d3142" stroke-width="4" stroke-linejoin="round"/>

  <!-- 牙盘 / 飞轮 / 曲柄（SMIL 旋转，与脚踩点同步） -->
  <circle cx="290" cy="480" r="8" fill="none" stroke="#6c757d" stroke-width="3"/>
  <circle cx="415" cy="485" r="16" fill="#adb5bd" stroke="#2d3142" stroke-width="4"/>
  <g stroke="#343a40" stroke-width="7" stroke-linecap="round">
    <line x1="415" y1="485" x2="445" y2="485"/>
    <line x1="415" y1="485" x2="385" y2="485"/>
    <circle cx="445" cy="485" r="5" fill="#343a40" stroke="none"/>
    <circle cx="385" cy="485" r="5" fill="#343a40" stroke="none"/>
    <animateTransform attributeName="transform" type="rotate" from="0 415 485" to="360 415 485" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <circle cx="415" cy="485" r="4.5" fill="#2d3142"/>

  <!-- 车筐 + 一条鱼 -->
  <line x1="548" y1="326" x2="524" y2="334" stroke="#8b5e34" stroke-width="4"/>
  <line x1="548" y1="326" x2="578" y2="334" stroke="#8b5e34" stroke-width="4"/>
  <!-- 鱼：头扎进筐里，尾巴翘出来 -->
  <path d="M565 336 Q573 310 578 302 Q583 310 591 336 Z"
        fill="#8ecae6" stroke="#2d3142" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M578 302 L578 326" stroke="#2d3142" stroke-width="2.5"/>
  <path d="M516 334 L584 334 L575 376 L525 376 Z" fill="#d4a373" stroke="#2d3142" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#9c6644" stroke-width="3">
    <line x1="518.5" y1="348" x2="581.5" y2="348"/>
    <line x1="521.5" y1="362" x2="578.5" y2="362"/>
    <line x1="538" y1="334" x2="537" y2="376"/>
    <line x1="560" y1="334" x2="561" y2="376"/>
  </g>

  <!-- ===== 鹈鹕：远侧腿（车身后方） ===== -->
  <line x1="398" y1="358" x2="385" y2="485" stroke="#ca6702" stroke-width="11" stroke-linecap="round">
    <animate attributeName="x2" dur="1.6s" repeatCount="indefinite"
      values="385;393.8;415;436.2;445;436.2;415;393.8;385"/>
    <animate attributeName="y2" dur="1.6s" repeatCount="indefinite"
      values="485;463.8;455;463.8;485;506.2;515;506.2;485"/>
  </line>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite"
      values="385 485;393.8 463.8;415 455;436.2 463.8;445 485;436.2 506.2;415 515;393.8 506.2;385 485"/>
    <rect x="-10" y="-1" width="20" height="8" rx="3.5" fill="#343a40"/>
    <ellipse cx="0" cy="-5" rx="12" ry="7" fill="#ca6702"/>
  </g>

  <!-- ===== 鹈鹕身体（整体上下颠簸） ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.25;0.5;0.75;1"
      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      values="0 0;0 -4;0 0;0 -4;0 0"/>

    <!-- 尾巴 -->
    <path d="M355 295 L315 278 L322 306 Z" fill="#ffffff" stroke="#2d3142" stroke-width="4" stroke-linejoin="round"/>
    <path d="M358 310 L322 306 L334 330 Z" fill="#ffffff" stroke="#2d3142" stroke-width="4" stroke-linejoin="round"/>
    <!-- 身体 -->
    <ellipse cx="392" cy="315" rx="60" ry="46" transform="rotate(-6 392 315)"
             fill="#ffffff" stroke="#2d3142" stroke-width="4.5"/>
    <!-- 脖子（双层描边技巧） -->
    <path d="M445 300 Q452 252 466 220" fill="none" stroke="#2d3142" stroke-width="34" stroke-linecap="round"/>
    <path d="M445 300 Q452 252 466 220" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round"/>

    <!-- 围巾：飘带（波动）+ 围脖 -->
    <path d="M452 250 C424 242 402 254 376 247 C356 242 342 252 324 246"
          fill="none" stroke="#2d3142" stroke-width="15" stroke-linecap="round">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
        values="M452 250 C424 242 402 254 376 247 C356 242 342 252 324 246;
                M452 250 C426 258 400 244 376 252 C356 257 340 245 324 251;
                M452 250 C424 242 402 254 376 247 C356 242 342 252 324 246"/>
    </path>
    <path d="M452 250 C424 242 402 254 376 247 C356 242 342 252 324 246"
          fill="none" stroke="#ef476f" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
        values="M452 250 C424 242 402 254 376 247 C356 242 342 252 324 246;
                M452 250 C426 258 400 244 376 252 C356 257 340 245 324 251;
                M452 250 C424 242 402 254 376 247 C356 242 342 252 324 246"/>
    </path>
    <rect x="446" y="238" width="30" height="13" rx="6" transform="rotate(-16 461 244.5)"
          fill="#ef476f" stroke="#2d3142" stroke-width="3.5"/>

    <!-- 头 -->
    <circle cx="472" cy="202" r="25" fill="#ffffff" stroke="#2d3142" stroke-width="4.5"/>
    <!-- 头顶呆毛 -->
    <path d="M455 184 Q446 176 449 166" fill="none" stroke="#2d3142" stroke-width="8" stroke-linecap="round"/>
    <path d="M455 184 Q446 176 449 166" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 喉囊（轻微晃动） -->
    <path fill="#ffd166" stroke="#2d3142" stroke-width="3.5" stroke-linejoin="round"
      d="M494 210 C528 250 570 256 596 230 C572 240 528 236 496 220 Z">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite"
        values="M494 210 C528 250 570 256 596 230 C572 240 528 236 496 220 Z;
                M494 210 C530 257 572 263 596 230 C572 243 528 238 496 220 Z;
                M494 210 C528 250 570 256 596 230 C572 240 528 236 496 220 Z"/>
    </path>
    <!-- 上喙 -->
    <path d="M490 190 C532 192 578 206 600 218 C606 222 605 229 598 230 C562 226 520 217 492 208 Z"
          fill="#ffb703" stroke="#2d3142" stroke-width="4" stroke-linejoin="round"/>
    <!-- 眼睛 + 腮红 -->
    <circle cx="479" cy="197" r="4.2" fill="#2d3142"/>
    <circle cx="480.5" cy="195.5" r="1.3" fill="#ffffff"/>
    <ellipse cx="461" cy="213" rx="6" ry="4" fill="#ffadad" opacity="0.55"/>

    <!-- 翅膀（搭在车把上，轻微摆动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
        values="-2.5 434 300;1.5 434 300;-2.5 434 300"/>
      <path d="M434 290 C482 286 532 296 566 314 C571 318 569 325 562 325 C516 316 470 313 434 315 Z"
            fill="#edf2f4" stroke="#2d3142" stroke-width="4" stroke-linejoin="round"/>
      <path d="M505 303 Q520 308 534 316" fill="none" stroke="#ced4da" stroke-width="3" stroke-linecap="round"/>
      <path d="M470 301 Q486 306 498 313" fill="none" stroke="#ced4da" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== 鹈鹕：近侧腿（身体前方） ===== -->
  <line x1="410" y1="360" x2="445" y2="485" stroke="#fb8500" stroke-width="12" stroke-linecap="round">
    <animate attributeName="x2" dur="1.6s" repeatCount="indefinite"
      values="445;436.2;415;393.8;385;393.8;415;436.2;445"/>
    <animate attributeName="y2" dur="1.6s" repeatCount="indefinite"
      values="485;506.2;515;506.2;485;463.8;455;463.8;485"/>
  </line>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite"
      values="445 485;436.2 506.2;415 515;393.8 506.2;385 485;393.8 463.8;415 455;436.2 463.8;445 485"/>
    <rect x="-10" y="-1" width="20" height="8" rx="3.5" fill="#343a40"/>
    <ellipse cx="0" cy="-5" rx="12" ry="7" fill="#fb8500" stroke="#2d3142" stroke-width="3"/>
  </g>

  <!-- 标题 -->
  <text x="400" y="46" text-anchor="middle" font-size="27" font-weight="bold"
        font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
        fill="#2d3142">骑自行车的鹈鹕</text>
</svg>
</body>
</html>
