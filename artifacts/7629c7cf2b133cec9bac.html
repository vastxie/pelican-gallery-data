<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 15%, #25344c 0%, #0c1119 70%);
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: min(96vw, 1180px);
    aspect-ratio: 960 / 560;
    border-radius: 20px;
    overflow: hidden;
    background: #8ed4f2;
    box-shadow: 0 34px 80px rgba(0,0,0,.62), 0 0 0 1px rgba(255,255,255,.09) inset;
    cursor: pointer;
    user-select: none;
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  .badge {
    position: absolute;
    left: 20px;
    bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 11px;
    border-radius: 999px;
    background: rgba(12,20,30,.42);
    backdrop-filter: blur(6px);
    color: #f4f8ff;
    font-size: clamp(9px, 1.15vw, 13px);
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: .92;
  }
  .badge .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ffd75e;
    box-shadow: 0 0 10px #ffd75e;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity:.35; transform: scale(.72);} }
  .hint {
    position: absolute;
    right: 20px;
    bottom: 16px;
    color: rgba(255,255,255,.72);
    font-size: clamp(9px, 1.05vw, 12px);
    letter-spacing: .06em;
    pointer-events: none;
    transition: opacity .3s;
  }
  .paused .dot { animation: none; background:#9fb0c4; box-shadow:none; }

  /* ---------------------------------------------------------------
     Pure-SVG presentation, no external assets
  --------------------------------------------------------------- */
  .wheel-spoke { stroke: #dbe3ec; stroke-width: 2.4; stroke-linecap: round; }
  .tire        { fill: none; stroke: #2b3038; stroke-width: 9; }
  .rim         { fill: none; stroke: #cfd8e3; stroke-width: 4; }
  .frame-tube  { fill: none; stroke: #2a9d8f; stroke-width: 11; stroke-linecap: round; }
  .frame-thin  { fill: none; stroke: #2a9d8f; stroke-width: 8;  stroke-linecap: round; }
  .metal       { fill: none; stroke: #b9c4d1; stroke-width: 9;  stroke-linecap: round; }
  .leg         { stroke-linecap: round; fill: none; }
  .leg-front   { stroke: #f2a04a; }
  .leg-back    { stroke: #cf7f31; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <svg id="scene" viewBox="0 0 960 560" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="一只鹈鹕戴着红色头盔、系着红围巾，正在骑一辆青绿色自行车向前飞驰">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"    stop-color="#2f9fe0"/>
        <stop offset="40%"  stop-color="#8ed4f2"/>
        <stop offset="76%"  stop-color="#dcf0f7"/>
        <stop offset="100%" stop-color="#fdf1d6"/>
      </linearGradient>
      <radialGradient id="sunGlow">
        <stop offset="0"   stop-color="#fff6bd" stop-opacity=".95"/>
        <stop offset="42%" stop-color="#ffe27a" stop-opacity=".34"/>
        <stop offset="100%" stop-color="#ffe27a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#79828f"/>
        <stop offset="18%" stop-color="#666f7c"/>
        <stop offset="100%" stop-color="#414954"/>
      </linearGradient>
      <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="#ffd98a"/>
        <stop offset="65%" stop-color="#fbc25a"/>
        <stop offset="100%" stop-color="#f0a93c"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0"   stop-color="#ffc25e"/>
        <stop offset="100%" stop-color="#f3a03a"/>
      </linearGradient>
      <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff6b6b"/>
        <stop offset="100%" stop-color="#d92b3d"/>
      </linearGradient>

      <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#16202c" flood-opacity=".24"/>
      </filter>
      <filter id="tinyShadow" x="-40%" y="-40%" width="180%" height="190%">
        <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#16202c" flood-opacity=".2"/>
      </filter>
      <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>

    <!-- ================= SKY ================= -->
    <rect x="0" y="0" width="960" height="560" fill="url(#skyGrad)"/>

    <!-- sun -->
    <g id="sun" transform="translate(792,104)">
      <circle r="130" fill="url(#sunGlow)"/>
      <g id="sunRays"></g>
      <circle r="48" fill="#ffe27a"/>
      <circle r="48" fill="none" stroke="#fff3b0" stroke-width="2" opacity=".7"/>
    </g>

    <!-- clouds -->
    <g id="clouds" opacity=".95"></g>

    <!-- distant birds -->
    <g id="birds" stroke="#3f5b74" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45"></g>

    <!-- ================= LAND ================= -->
    <g id="hillFar"></g>
    <g id="hillNear"></g>

    <!-- ================= ROAD ================= -->
    <rect x="0" y="486" width="960" height="76" fill="url(#roadGrad)"/>
    <rect x="0" y="486" width="960" height="5" fill="#8b95a3"/>
    <rect x="0" y="491" width="960" height="2" fill="#aab4c1" opacity=".6"/>
    <g id="roadSpeckle"></g>
    <g id="roadMarks"></g>
    <g id="grass"></g>

    <!-- ================= RIDER + BIKE ================= -->
    <g id="rider">

      <!-- contact shadow -->
      <ellipse cx="480" cy="490" rx="215" ry="11" fill="#141c26" opacity=".22" filter="url(#blurSoft)"/>

      <!-- ---- wheels ---- -->
      <g id="wheelRear"></g>
      <g id="wheelFront"></g>

      <!-- ---- far-side leg (behind frame) ---- -->
      <g id="legBack">
        <line class="leg leg-back" stroke-width="17" id="legBackThigh"/>
        <line class="leg leg-back" stroke-width="14" id="legBackShin"/>
        <g id="legBackFoot"></g>
      </g>

      <!-- ---- far-side crank ---- -->
      <g id="crankBack">
        <line x1="0" y1="0" x2="0" y2="25" stroke="#3d4652" stroke-width="9" stroke-linecap="round"/>
        <rect x="-13" y="22" width="26" height="8" rx="3" fill="#3d4652"/>
      </g>

      <!-- ---- chain ---- -->
      <g id="chain" opacity=".92">
        <g stroke="#333b45" stroke-width="5" stroke-linecap="round">
          <line x1="486" y1="400" x2="330" y2="421"/>
          <line x1="486" y1="440" x2="330" y2="439"/>
        </g>
        <g stroke="#9fabb8" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="butt">
          <line x1="486" y1="400" x2="330" y2="421"/>
          <line x1="486" y1="440" x2="330" y2="439"/>
        </g>
      </g>

      <!-- ---- frame ---- -->
      <g id="frame">
        <line class="frame-tube" x1="486" y1="420" x2="402" y2="336"/><!-- seat tube -->
        <line class="frame-tube" x1="486" y1="420" x2="634" y2="352"/><!-- down tube -->
        <line class="frame-tube" x1="412" y1="342" x2="616" y2="306"/><!-- top tube -->
        <line class="frame-thin" x1="330" y1="430" x2="404" y2="340"/><!-- seat stay -->
        <line class="frame-thin" x1="330" y1="430" x2="486" y2="420"/><!-- chain stay -->
        <line class="frame-tube" x1="612" y1="302" x2="638" y2="356" stroke-width="13"/><!-- head tube -->
        <line class="metal"      x1="638" y1="356" x2="630" y2="430"/><!-- fork -->
        <!-- saddle -->
        <path d="M 366 330 C 380 316, 424 314, 440 324 C 430 337, 386 344, 366 330 Z"
              fill="#2f3640" stroke="#20262e" stroke-width="2"/>
        <!-- handlebar -->
        <path d="M 552 306 C 586 286, 622 286, 648 300" fill="none"
              stroke="#b9c4d1" stroke-width="9" stroke-linecap="round"/>
        <line x1="612" y1="302" x2="600" y2="290" stroke="#b9c4d1" stroke-width="9" stroke-linecap="round"/>
        <circle cx="552" cy="306" r="7" fill="#2f3640"/>
        <circle cx="648" cy="300" r="7" fill="#2f3640"/>
      </g>

      <!-- ---- near-side crank + chainring ---- -->
      <g id="crankFront"></g>

      <!-- ---- near-side leg (in front of frame) ---- -->
      <g id="legFront">
        <line class="leg leg-front" stroke-width="18" id="legFrontThigh"/>
        <line class="leg leg-front" stroke-width="15" id="legFrontShin"/>
        <g id="legFrontFoot"></g>
      </g>

      <!-- ================= PELICAN ================= -->
      <g id="pelican">
        <g filter="url(#softShadow)">
          <!-- tail -->
          <path d="M 344 244 C 306 224, 268 206, 238 190 C 262 224, 258 256, 240 288
                   C 286 280, 320 292, 348 302 Z"
                fill="#efe7d6"/>
          <!-- body -->
          <ellipse cx="415" cy="272" rx="98" ry="72" fill="#fbf7ee"/>
          <!-- neck -->
          <path d="M 452 268 C 486 218, 508 190, 548 180 L 604 198
                   C 566 216, 534 248, 512 296 Z" fill="#fbf7ee"/>

          <!-- head (pivots while the body bobs) -->
          <g id="headPivot">
            <ellipse cx="588" cy="162" rx="44" ry="38" fill="#fbf7ee"/>

            <!-- upper mandible -->
            <path d="M 618 146 C 692 152, 750 164, 774 180 C 732 170, 684 168, 616 172 Z"
                  fill="url(#beakGrad)" stroke="#dd8f2b" stroke-width="2" stroke-linejoin="round"/>
            <ellipse cx="646" cy="158" rx="6" ry="2.6" fill="#d9882a" opacity=".85"
                     transform="rotate(9 646 158)"/>

            <!-- gular pouch -->
            <g id="pouch">
              <path d="M 616 169 C 644 228, 718 228, 774 179
                       C 724 204, 666 200, 616 169 Z"
                    fill="url(#pouchGrad)" stroke="#e0a03a" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M 640 196 C 668 210, 706 205, 736 190" fill="none"
                    stroke="#e5a848" stroke-width="2" opacity=".7" stroke-linecap="round"/>
            </g>

            <!-- eye -->
            <g id="eye">
              <ellipse cx="598" cy="154" rx="12.5" ry="13.5" fill="#ffffff"/>
              <circle cx="601" cy="155" r="7.4" fill="#1b1b1b"/>
              <circle cx="603.6" cy="151.6" r="2.6" fill="#ffffff"/>
              <path d="M 585 137 Q 598 129 613 137" fill="none" stroke="#d8cdb6"
                    stroke-width="3.6" stroke-linecap="round"/>
            </g>

            <!-- helmet -->
            <path d="M 543 150 C 545 104, 631 101, 637 148 C 612 133, 569 133, 543 150 Z"
                  fill="url(#helmetGrad)" stroke="#b81f30" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M 634 145 C 656 145, 667 152, 662 159 C 651 152, 642 149, 631 149 Z"
                  fill="#d92b3d" stroke="#b81f30" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 572 126 C 586 118, 602 118, 614 128" fill="none"
                  stroke="#ffffff" stroke-width="4" opacity=".5" stroke-linecap="round"/>
          </g>
        </g>

        <!-- near wing, reaching for the handlebar -->
        <path id="wing"
              d="M 470 236 C 508 246, 552 262, 594 280
                 C 604 286, 604 298, 592 302
                 C 546 300, 500 298, 458 296
                 C 448 276, 452 246, 470 236 Z"
              fill="#f4efe2" stroke="#ded3bd" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M 486 256 C 522 268, 552 280, 574 292" fill="none"
              stroke="#e2d8c4" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M 478 274 C 512 284, 540 292, 562 298" fill="none"
              stroke="#e2d8c4" stroke-width="2.4" stroke-linecap="round"/>

        <!-- scarf: band crosses the neck (~-45°), tails stream backwards -->
        <g id="scarfTail">
          <path d="M 503 200 C 462 182, 424 204, 380 184
                   C 392 199, 398 209, 406 217
                   C 448 228, 482 218, 505 213 Z"
                fill="#f2554a" stroke="#c9352c" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 466 200 C 448 199, 430 199, 414 198" fill="none"
                stroke="#ffffff" stroke-width="2.6" opacity=".4" stroke-linecap="round"/>
        </g>
        <ellipse cx="525" cy="222" rx="10" ry="34" fill="#f2554a" stroke="#c9352c" stroke-width="2"
                 transform="rotate(-45 525 222)"/>
        <circle cx="508" cy="207" r="11" fill="#f2554a" stroke="#c9352c" stroke-width="2"/>
      </g>
    </g>
  </svg>

  <div class="badge"><span class="dot"></span> Pelican Cycling Club</div>
  <div class="hint" id="hint">点击画面暂停 / 继续</div>
</div>

<script>
(() => {
  "use strict";

  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const $ = (id) => document.getElementById(id);

  /* =========================================================
     1.  Geometry constants — the whole rig lives in these numbers
     ========================================================= */
  const REAR  = { x: 330, y: 430 };   // rear hub
  const FRONT = { x: 630, y: 430 };   // front hub
  const BB    = { x: 486, y: 420 };   // bottom bracket
  const WHEEL_R = 58;
  const CRANK_R = 25;
  const THIGH = 68;                   // leg segment lengths
  const SHIN  = 70;
  const HIP_FRONT = { x: 438, y: 336 };
  const HIP_BACK  = { x: 430, y: 329 };

  const CRANK_SPEED = 1.75;           // rad / s
  const GEAR        = 2.3;            // wheel turns per crank turn

  /* =========================================================
     2.  Build simple scenery
     ========================================================= */

  // --- sun rays ---
  const rays = $("sunRays");
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const r1 = 58;
    const r2 = i % 2 ? 68 : 80;
    rays.appendChild(mk("line", {
      x1: Math.cos(a) * r1, y1: Math.sin(a) * r1,
      x2: Math.cos(a) * r2, y2: Math.sin(a) * r2,
      stroke: "#ffd75e", "stroke-width": 5, "stroke-linecap": "round"
    }));
  }

  // --- clouds ---
  const cloudLayer = $("clouds");
  const CLOUDS = [
    { x:  70, y:  74, s: 1.00, v: 13 },
    { x: 330, y: 138, s: 0.68, v:  9 },
    { x: 610, y:  58, s: 1.22, v: 17 },
    { x: 900, y: 126, s: 0.86, v: 11 },
    { x:1180, y:  86, s: 0.64, v:  8 },
    { x:1420, y: 150, s: 1.05, v: 15 }
  ];
  const PUFFS = [[0,0,27],[-31,7,20],[31,7,19],[-57,13,13],[57,13,14],[9,-15,19]];
  const cloudNodes = CLOUDS.map((c) => {
    const g = mk("g");
    for (const [px, py, r] of PUFFS) {
      g.appendChild(mk("circle", { cx: px, cy: py, r, fill: "#ffffff" }));
    }
    g.setAttribute("opacity", 0.9);
    cloudLayer.appendChild(g);
    return { node: g, ...c };
  });

  // --- little birds ---
  const birdLayer = $("birds");
  const BIRDS = [{ x: 250, y: 96, s: 1 }, { x: 300, y: 120, s: .7 }, { x: 196, y: 132, s: .55 }];
  const birdNodes = BIRDS.map((b) => {
    const g = mk("g", { transform: `translate(${b.x},${b.y}) scale(${b.s})` });
    g.appendChild(mk("path", { d: "M -11 0 Q -5 -7 0 0 Q 5 -7 11 0" }));
    birdLayer.appendChild(g);
    return { node: g, ...b };
  });

  // --- rolling hills (sine sums with periods dividing 960 => seamless) ---
  function hillPath(base, waves) {
    const pts = [];
    for (let x = 0; x <= 960; x += 6) {
      let y = base;
      for (const w of waves) {
        y -= w.a * Math.sin(2 * Math.PI * (w.f * x / 960) + (w.p || 0));
      }
      pts.push([x, y]);
    }
    let d = `M 0 600 L 0 ${pts[0][1].toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) d += ` L ${pts[i][0]} ${pts[i][1].toFixed(1)}`;
    return d + " L 960 600 Z";
  }
  function fillTiled(group, d, fill) {
    for (let i = 0; i < 2; i++) {
      group.appendChild(mk("path", { d, fill, transform: `translate(${i * 960},0)` }));
    }
  }
  fillTiled($("hillFar"),  hillPath(444, [{ a: 56, f: 1, p: 0.5 }, { a: 21, f: 3, p: 1.3 }]), "#a9dcc0");
  fillTiled($("hillNear"), hillPath(470, [{ a: 40, f: 2, p: 2.1 }, { a: 15, f: 5, p: 0.4 }]), "#6cc295");

  // --- deterministic random so the scenery looks the same every reload ---
  let seed = 20240611;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;

  // --- grass tufts on the shoulder ---
  const grass = $("grass");
  for (let i = 0; i < 30; i++) {
    const x = rnd() * 960;
    const h = 8 + rnd() * 13;
    const lean = (rnd() - 0.5) * 8;
    const d = `M ${x} 489 C ${x - 2} ${489 - h * .6}, ${x + lean - 3} ${489 - h * .8}, ${x + lean} ${489 - h}`;
    for (let k = 0; k < 2; k++) {
      grass.appendChild(mk("path", {
        d, transform: `translate(${k * 960},0)`,
        fill: "none", stroke: k ? "#3f8f66" : "#4ea277",
        "stroke-width": 2.6, "stroke-linecap": "round",
        opacity: 0.55 + rnd() * 0.35
      }));
    }
  }

  // --- asphalt speckle ---
  const speckle = $("roadSpeckle");
  for (let i = 0; i < 60; i++) {
    const x = rnd() * 960;
    const y = 500 + rnd() * 56;
    for (let k = 0; k < 2; k++) {
      speckle.appendChild(mk("ellipse", {
        cx: x + k * 960, cy: y, rx: 1.6 + rnd() * 3.4, ry: 1.1 + rnd() * 1.8,
        fill: rnd() > .5 ? "#8d97a4" : "#333b45", opacity: 0.18 + rnd() * 0.2
      }));
    }
  }

  // --- centre line dashes (spacing divides 960 => seamless) ---
  const marks = $("roadMarks");
  for (let i = 0; i < 6; i++) {
    for (let k = 0; k < 2; k++) {
      marks.appendChild(mk("rect", {
        x: i * 160 + k * 960, y: 524, width: 74, height: 9, rx: 4.5,
        fill: "#f2c94c", opacity: 0.85
      }));
    }
  }

  /* =========================================================
     3.  Build the bicycle wheels & cranks (drawn at origin,
         positioned/rotated via transforms each frame)
     ========================================================= */
  function buildWheel(group, withCog) {
    group.appendChild(mk("circle", { r: WHEEL_R, class: "tire" }));
    group.appendChild(mk("circle", { r: WHEEL_R - 6, class: "rim" }));
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      group.appendChild(mk("line", {
        x1: Math.cos(a) * 8,  y1: Math.sin(a) * 8,
        x2: Math.cos(a) * 48, y2: Math.sin(a) * 48,
        class: "wheel-spoke"
      }));
    }
    group.appendChild(mk("circle", { r: 8, fill: "#8f9aa7" }));
    group.appendChild(mk("circle", { r: 3, fill: "#59616c" }));
    if (withCog) {
      group.appendChild(mk("circle", { r: 9.5, fill: "#9aa5b1", stroke: "#6c7683", "stroke-width": 1.6 }));
    }
  }
  buildWheel($("wheelRear"), true);
  buildWheel($("wheelFront"), false);

  // --- cranks ---
  function buildCrank(group, nearSide) {
    if (nearSide) {
      group.appendChild(mk("circle", {
        r: 20, fill: "none", stroke: "#c3ccd8",
        "stroke-width": 5, "stroke-dasharray": "3.2 3.2"
      }));
      group.appendChild(mk("circle", { r: 12, fill: "#9aa5b1" }));
      group.appendChild(mk("circle", { r: 4.5, fill: "#5b6470" }));
    }
    group.appendChild(mk("line", {
      x1: 0, y1: 0, x2: 0, y2: CRANK_R,
      stroke: nearSide ? "#4a5462" : "#3d4652",
      "stroke-width": nearSide ? 10 : 9, "stroke-linecap": "round"
    }));
    group.appendChild(mk("rect", {
      x: -13, y: CRANK_R - 3, width: 26, height: 8, rx: 3,
      fill: nearSide ? "#4a5462" : "#3d4652"
    }));
  }
  buildCrank($("crankFront"), true);
  buildCrank($("crankBack"), false);

  // --- webbed feet ---
  function buildFoot(group, color) {
    group.appendChild(mk("path", {
      d: "M -8 -7 Q 8 -14 24 -5 Q 15 6 -7 5 Z",
      fill: color, stroke: "rgba(150,84,20,.55)", "stroke-width": 1.6, "stroke-linejoin": "round"
    }));
    group.appendChild(mk("path", {
      d: "M 2 -1 L 17 -7 M 0 2 L 17 1 M -3 4 L 14 6",
      fill: "none", stroke: "rgba(150,84,20,.4)", "stroke-width": 1.4, "stroke-linecap": "round"
    }));
  }
  buildFoot($("legFrontFoot"), "#f2a04a");
  buildFoot($("legBackFoot"),  "#cf7f31");

  /* =========================================================
     4.  Two-bone inverse kinematics for the pedalling legs
     ========================================================= */
  const legs = {
    front: { thigh: $("legFrontThigh"), shin: $("legFrontShin"), foot: $("legFrontFoot") },
    back:  { thigh: $("legBackThigh"),  shin: $("legBackShin"),  foot: $("legBackFoot")  }
  };

  function setLeg(parts, hip, pedal) {
    let dx = pedal.x - hip.x;
    let dy = pedal.y - hip.y;
    let d = Math.hypot(dx, dy) || 1;
    let foot = { x: pedal.x, y: pedal.y };

    const reach = THIGH + SHIN - 1;      // never fully lock the knee
    if (d > reach) {                      // over-extended: clamp the foot
      const k = reach / d;
      foot = { x: hip.x + dx * k, y: hip.y + dy * k };
      dx = foot.x - hip.x; dy = foot.y - hip.y; d = reach;
    }

    const base = Math.atan2(dy, dx);
    let cosA = (d * d + THIGH * THIGH - SHIN * SHIN) / (2 * d * THIGH);
    cosA = Math.max(-1, Math.min(1, cosA));
    const kneeAngle = base - Math.acos(cosA);   // knee bends forward
    const knee = {
      x: hip.x + Math.cos(kneeAngle) * THIGH,
      y: hip.y + Math.sin(kneeAngle) * THIGH
    };

    const set = (el, x1, y1, x2, y2) => {
      el.setAttribute("x1", x1.toFixed(2)); el.setAttribute("y1", y1.toFixed(2));
      el.setAttribute("x2", x2.toFixed(2)); el.setAttribute("y2", y2.toFixed(2));
    };
    set(parts.thigh, hip.x, hip.y, knee.x, knee.y);
    set(parts.shin,  knee.x, knee.y, foot.x, foot.y);
    parts.foot.setAttribute("transform", `translate(${foot.x.toFixed(2)},${foot.y.toFixed(2)})`);
  }

  /* =========================================================
     5.  Animation loop
     ========================================================= */
  const rider    = $("rider");
  const wheelRear  = $("wheelRear");
  const wheelFront = $("wheelFront");
  const crankFront = $("crankFront");
  const crankBack  = $("crankBack");
  const headPivot  = $("headPivot");
  const pouch      = $("pouch");
  const scarfTail  = $("scarfTail");
  const hillFar    = $("hillFar");
  const hillNear   = $("hillNear");
  const roadMarks  = $("roadMarks");
  const grassG     = $("grass");
  const speckleG   = $("roadSpeckle");

  const DEG = 180 / Math.PI;
  const wrap = (v, span) => ((v % span) + span) % span;

  let crank = 0;
  let wheel = 0;
  let sunA  = 0;
  const off = { road: 0, grass: 0, near: 0, far: 0 };
  let running = true;
  let last = performance.now();

  function tick(now) {
    requestAnimationFrame(tick);
    let dt = (now - last) / 1000;
    last = now;
    if (!running) return;
    dt = Math.min(dt, 0.05);            // stay sane after tab switches

    /* --- drive train --- */
    crank += CRANK_SPEED * dt;
    const wheelRate = CRANK_SPEED * GEAR;
    wheel += wheelRate * dt;
    const groundRate = wheelRate * WHEEL_R;   // px / s of road scrolling

    /* --- pedals --- */
    const a = crank;
    const pedalFront = { x: BB.x - CRANK_R * Math.sin(a), y: BB.y + CRANK_R * Math.cos(a) };
    const pedalBack  = { x: BB.x + CRANK_R * Math.sin(a), y: BB.y - CRANK_R * Math.cos(a) };

    wheelRear .setAttribute("transform", `translate(${REAR.x},${REAR.y})  rotate(${(wheel * DEG).toFixed(2)})`);
    wheelFront.setAttribute("transform", `translate(${FRONT.x},${FRONT.y}) rotate(${(wheel * DEG).toFixed(2)})`);
    crankFront.setAttribute("transform", `translate(${BB.x},${BB.y}) rotate(${(a * DEG).toFixed(2)})`);
    crankBack .setAttribute("transform", `translate(${BB.x},${BB.y}) rotate(${(a * DEG + 180).toFixed(2)})`);

    setLeg(legs.front, HIP_FRONT, pedalFront);
    setLeg(legs.back,  HIP_BACK,  pedalBack);

    /* --- body life: bounce, head bob, pouch wobble, scarf flutter --- */
    const beat = crank * 2;
    rider.setAttribute("transform", `translate(0,${(Math.sin(beat) * 1.7).toFixed(2)})`);
    headPivot.setAttribute("transform", `rotate(${(Math.sin(beat + 0.7) * 1.9).toFixed(2)} 566 178)`);
    pouch.setAttribute("transform", `rotate(${(Math.sin(beat + 1.5) * 2.6).toFixed(2)} 618 170)`);
    scarfTail.setAttribute("transform", `rotate(${(Math.sin(beat + 2.4) * 7).toFixed(2)} 507 206)`);

    /* --- parallax scenery --- */
    off.road  += groundRate * dt;
    off.grass += groundRate * 0.98 * dt;
    off.near  += groundRate * 0.30 * dt;
    off.far   += groundRate * 0.10 * dt;

    roadMarks.setAttribute("transform", `translate(${-wrap(off.road, 960).toFixed(2)},0)`);
    grassG   .setAttribute("transform", `translate(${-wrap(off.grass, 960).toFixed(2)},0)`);
    speckleG .setAttribute("transform", `translate(${-wrap(off.road * 1.0, 960).toFixed(2)},0)`);
    hillNear .setAttribute("transform", `translate(${-wrap(off.near, 960).toFixed(2)},0)`);
    hillFar  .setAttribute("transform", `translate(${-wrap(off.far,  960).toFixed(2)},0)`);

    /* --- sky --- */
    sunA += 6 * dt;
    rays.setAttribute("transform", `rotate(${sunA.toFixed(2)})`);

    for (const c of cloudNodes) {
      c.x -= c.v * dt;
      if (c.x < -200) { c.x += 1560; c.y = 46 + Math.random() * 120; }
      c.node.setAttribute("transform", `translate(${c.x.toFixed(1)},${c.y}) scale(${c.s})`);
    }
    for (const b of birdNodes) {
      b.x -= (28 + b.s * 22) * dt;
      if (b.x < -60) b.x += 1060;
      const flap = Math.sin(now / 220 + b.x * 0.05) * 0.5 + 0.6;
      b.node.setAttribute("transform",
        `translate(${b.x.toFixed(1)},${b.y}) scale(${b.s}) rotate(${(flap * 6).toFixed(1)})`);
    }
  }
  requestAnimationFrame(tick);

  /* =========================================================
     6.  Click to pause
     ========================================================= */
  const stage = $("stage");
  const hint  = $("hint");
  stage.addEventListener("click", () => {
    running = !running;
    stage.classList.toggle("paused", !running);
    hint.textContent = running ? "点击画面暂停 / 继续" : "已暂停 · 点击继续";
  });
})();
</script>
</body>
</html>
