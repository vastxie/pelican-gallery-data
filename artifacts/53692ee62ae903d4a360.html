<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e7">
  <title>鹈鹕的海岸骑行 · SVG 2D 动画</title>
  <style>
    :root {
      --paper: #f5f1e7;
      --ink: #173f43;
      --muted: #6f7f79;
      --coral: #df7350;
      --line: rgba(23, 63, 67, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(255,255,255,.8), transparent 32rem),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 26px clamp(20px, 4vw, 64px) 24px;
    }

    .topbar,
    .brand,
    .controls,
    .ride-status,
    .actions {
      display: flex;
      align-items: center;
    }

    .topbar {
      justify-content: space-between;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand { gap: 11px; }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: #fffaf0;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .brand-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .16em;
    }

    .edition {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      padding: 30px 2px 24px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 9px;
      color: var(--coral);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
    }

    .eyebrow::before {
      width: 20px;
      height: 2px;
      content: "";
      background: currentColor;
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      font-size: clamp(34px, 4.2vw, 58px);
      font-weight: 700;
      letter-spacing: -.055em;
      line-height: 1.12;
    }

    h1 span { color: var(--coral); }

    .intro-copy {
      max-width: 270px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .scene-shell {
      position: relative;
      overflow: hidden;
      border: 1.5px solid var(--ink);
      border-radius: 26px;
      background: #d8e9df;
      box-shadow: 0 8px 0 rgba(23, 63, 67, .08);
      isolation: isolate;
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
    }

    .scene-tag {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(23,63,67,.18);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,250,240,.72);
      backdrop-filter: blur(8px);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .15em;
      pointer-events: none;
    }

    .scene-tag::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      content: "";
      background: var(--coral);
    }

    .controls {
      justify-content: space-between;
      gap: 20px;
      padding: 20px 2px 0;
    }

    .ride-status {
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-icon {
      display: grid;
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--coral);
      font-size: 15px;
    }

    .actions { gap: 16px; }

    .key-hint {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .04em;
    }

    kbd {
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: rgba(255,255,255,.4);
      font-family: inherit;
      font-size: 9px;
    }

    .toggle {
      display: inline-flex;
      min-width: 126px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 17px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      color: #fffaf0;
      background: var(--ink);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }

    .toggle:hover { transform: translateY(-2px); }
    .toggle:active { transform: translateY(0); }
    .toggle:focus-visible { outline: 3px solid rgba(223,115,80,.35); outline-offset: 3px; }
    .toggle[aria-pressed="true"] { color: var(--ink); background: transparent; }
    .toggle svg { width: 14px; height: 14px; }
    .toggle .play-icon { display: none; }
    .toggle[aria-pressed="true"] .pause-icon { display: none; }
    .toggle[aria-pressed="true"] .play-icon { display: block; }

    .colophon {
      margin: 20px 0 0;
      color: rgba(23,63,67,.45);
      font-size: 9px;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 720px) {
      .page { padding-top: 18px; }
      .edition { display: none; }
      .intro { display: block; padding: 24px 2px 20px; }
      .intro-copy { max-width: 100%; margin-top: 12px; font-size: 12px; }
      .scene-shell { border-radius: 18px; }
      .scene-tag { top: 10px; left: 10px; padding: 6px 9px; font-size: 7px; }
      .key-hint { display: none; }
      .ride-status { font-size: 11px; }
      .controls { padding-top: 16px; }
      .toggle { min-width: 112px; padding: 10px 14px; font-size: 12px; }
    }

    @media (max-width: 430px) {
      .page { padding-right: 14px; padding-left: 14px; }
      .brand-sub { display: none; }
      .brand-name { font-size: 11px; }
      .intro-copy { display: none; }
      .status-copy { max-width: 120px; line-height: 1.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle { transition: none; }
    }
  </style>
</head>

        <span class="key-hint"><kbd>SPACE</kbd> 暂停 / 继续</span>
        <button class="toggle" id="toggle" type="button" aria-pressed="false" aria-label="暂停动画">
          <svg class="pause-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="3" y="2" width="3.5" height="12" rx="1"/>
            <rect x="9.5" y="2" width="3.5" height="12" rx="1"/>

          </svg>
          <span id="toggle-label">暂停骑行</span>
        </button>
      </div>
    </div>

    <p class="colophon">Hand-drawn in SVG · No images · Endless summer</p>
  </main>

  <script>
    const scene = document.getElementById('scene');
    const toggle = document.getElementById('toggle');
    const toggleLabel = document.getElementById('toggle-label');
    const statusCopy = document.getElementById('status-copy');
    let paused = false;

    function setPaused(nextPaused) {
      paused = nextPaused;
      if (paused) {
        scene.pauseAnimations();
      } else {
        scene.unpauseAnimations();
      }
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      toggleLabel.textContent = paused ? '继续骑行' : '暂停骑行';
      statusCopy.textContent = paused ? '歇一会儿，听听海浪。' : '海风正好，继续向前。';
    }

    toggle.addEventListener('click', () => setPaused(!paused));

    window.addEventListener('keydown', (event) => {
      const tag = document.activeElement?.tagName;
      const isControl = tag === 'BUTTON' || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (event.code === 'Space' && !event.repeat && !isControl) {
        event.preventDefault();
        setPaused(!paused);
      }
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setPaused(true);
    }
  </script>
