<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(#aee2ff 0%,#e8f7ff 60%,#9ed07a 60%,#7cb85c 100%);font-family:sans-serif;overflow:hidden}
  svg{width:90vmin;height:auto}
  /* 车轮旋转 */
  .wheel{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 踏板曲柄 */
  .crank{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
  /* 车身轻微颠簸 */
  .bike-body{animation:bounce .6s ease-in-out infinite alternate}
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
  /* 鹈鹕脖子点头 */
  .neck{animation:nod 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
  @keyframes nod{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-6deg)}}
  /* 翅膀扇动 */
  .wing{animation:flap 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:top left}
  @keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
  /* 腿蹬踏 */
  .leg-a{animation:pedal 1.2s linear infinite}
  .leg-b{animation:pedal 1.2s linear infinite reverse}
  @keyframes pedal{0%,100%{transform:translateY(0)}25%{transform:translateY(8px)}75%{transform:translateY(-8px)}}
  /* 云朵飘动 */
  .cloud{animation:drift 8s linear infinite}
  .cloud.c2{animation-duration:12s;animation-delay:-4s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-600px)}}
  /* 袋子里的鱼摆动 */
  .fish{animation:wiggle 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  @keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
</style>
</head>
<body>
<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
  <!-- 云 -->
  <g class="cloud" fill="#fff" opacity="0.9">
    <ellipse cx="480" cy="60" rx="40" ry="18"/><ellipse cx="510" cy="50" rx="28" ry="14"/>
    <ellipse cx="680" cy="90" rx="45" ry="20"/><ellipse cx="715" cy="80" rx="30" ry="14"/>
  </g>
  <g class="cloud c2" fill="#fff" opacity="0.7">
    <ellipse cx="560" cy="120" rx="35" ry="15"/><ellipse cx="880" cy="50" rx="40" ry="16"/>
  </g>
  <!-- 太阳 -->
  <circle cx="80" cy="70" r="35" fill="#ffd94d"/>
  <g stroke="#ffd94d" stroke-width="4" stroke-linecap="round">
    <line x1="80" y1="15" x2="80" y2="25"/><line x1="80" y1="115" x2="80" y2="125"/>
    <line x1="25" y1="70" x2="35" y2="70"/><line x1="125" y1="70" x2="135" y2="70"/>
    <line x1="41" y1="31" x2="48" y2="38"/><line x1="119" y1="31" x2="112" y2="38"/>
    <line x1="41" y1="109" x2="48" y2="102"/><line x1="119" y1="109" x2="112" y2="102"/>
  </g>
  <!-- 道路 -->
  <rect x="0" y="360" width="600" height="8" fill="#555"/>
  <g stroke="#fff" stroke-width="4" stroke-dasharray="24 20"><line x1="0" y1="396" x2="600" y2="396"/></g>

  <g class="bike-body">
    <!-- ===== 自行车 ===== -->
    <!-- 后轮 -->
    <g class="wheel">
      <circle cx="220" cy="330" r="45" fill="none" stroke="#333" stroke-width="6"/>
      <circle cx="220" cy="330" r="6" fill="#333"/>
      <g stroke="#888" stroke-width="2">
        <line x1="220" y1="285" x2="220" y2="375"/><line x1="175" y1="330" x2="265" y2="330"/>
        <line x1="188" y1="298" x2="252" y2="362"/><line x1="252" y1="298" x2="188" y2="362"/>
      </g>
    </g>
    <!-- 前轮 -->
    <g class="wheel">
      <circle cx="400" cy="330" r="45" fill="none" stroke="#333" stroke-width="6"/>
      <circle cx="400" cy="330" r="6" fill="#333"/>
      <g stroke="#888" stroke-width="2">
        <line x1="400" y1="285" x2="400" y2="375"/><line x1="355" y1="330" x2="445" y2="330"/>
        <line x1="368" y1="298" x2="432" y2="362"/><line x1="432" y1="298" x2="368" y2="362"/>
      </g>
    </g>
    <!-- 车架 -->
    <g stroke="#d33" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="220" y1="330" x2="310" y2="330"/>
      <line x1="310" y1="330" x2="260" y2="255"/>
      <line x1="260" y1="255" x2="370" y2="250"/>
      <line x1="370" y1="250" x2="400" y2="330"/>
      <line x1="310" y1="330" x2="370" y2="250"/>
      <line x1="220" y1="330" x2="260" y2="255"/>
    </g>
    <!-- 车把 -->
    <path d="M370 250 L385 220 Q388 212 380 210 L368 208" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 车座 -->
    <line x1="260" y1="255" x2="258" y2="240" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="256" cy="238" rx="18" ry="7" fill="#5a3a1e"/>
    <!-- 踏板曲柄 -->
    <g class="crank">
      <line x1="310" y1="306" x2="310" y2="354" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <rect x="296" y="300" width="28" height="8" rx="3" fill="#222"/>
      <rect x="296" y="350" width="28" height="8" rx="3" fill="#222"/>
    </g>

    <!-- ===== 鹈鹕 ===== -->
    <!-- 腿 -->
    <g class="leg-a"><path d="M275 260 L300 300 L310 305" stroke="#f5a623" stroke-width="7" fill="none" stroke-linecap="round"/></g>
    <g class="leg-b"><path d="M285 262 L318 310 L312 352" stroke="#e09a1a" stroke-width="7" fill="none" stroke-linecap="round"/></g>
    <!-- 身体 -->
    <ellipse cx="270" cy="215" rx="52" ry="45" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/>
    <!-- 翅膀（搭在车把上） -->
    <g class="wing">
      <path d="M285 195 Q345 195 372 212 Q340 230 292 232 Z" fill="#eee" stroke="#ccc" stroke-width="2"/>
      <path d="M300 210 Q335 208 360 214" stroke="#ccc" stroke-width="2" fill="none"/>
    </g>
    <!-- 尾巴 -->
    <path d="M222 200 Q200 190 192 178 Q212 178 226 190 Z" fill="#eee" stroke="#ccc" stroke-width="2"/>
    <!-- 脖子和头 -->
    <g class="neck">
      <path d="M305 195 Q330 160 335 130" stroke="#fdfdfd" stroke-width="24" fill="none" stroke-linecap="round"/>
      <circle cx="338" cy="118" r="22" fill="#fdfdfd" stroke="#ddd" stroke-width="2"/>
      <!-- 眼睛 -->
      <circle cx="345" cy="112" r="4" fill="#222"/>
      <circle cx="346.5" cy="110.5" r="1.3" fill="#fff"/>
      <!-- 冠羽 -->
      <path d="M330 100 Q322 88 330 84 Q334 92 336 98" fill="#f2c94c"/>
      <!-- 大喙+喉囊 -->
      <path d="M355 110 Q410 112 425 122 Q410 138 366 140 Q356 130 355 110 Z" fill="#f5a623" stroke="#e09a1a" stroke-width="2"/>
      <path d="M358 128 Q395 145 420 126 Q410 152 372 148 Q360 140 358 128 Z" fill="#fbd38d" stroke="#e09a1a" stroke-width="2"/>
      <!-- 囊里的鱼 -->
      <g class="fish">
        <path d="M382 138 Q392 132 400 138 Q392 144 382 138 Z" fill="#7fb3d5"/>
        <path d="M400 138 L406 133 L406 143 Z" fill="#7fb3d5"/>
        <circle cx="386" cy="137" r="1.2" fill="#222"/>
      </g>
    </g>
  </g>
</svg>
</body>
</html>
