<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% -10%,#2b4a6f,#141e30 70%);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8eef6;
  }
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.08em;opacity:.92}
  .stage{
    width:min(980px,96vw);aspect-ratio:16/9;border-radius:16px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.55);background:#bfe6fb;
    border:1px solid rgba(255,255,255,.18);
  }
  .stage.night{background:#0a1734}
  svg{display:block;width:100%;height:100%}

  .ui{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;opacity:.95}
  button{
    background:rgba(255,255,255,.12);color:#eaf1f8;border:1px solid rgba(255,255,255,.28);
    padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;transition:.18s;
  }
  button:hover{background:rgba(255,255,255,.24)}
  input[type=range]{width:150px;accent-color:#7fd1ff}

  /* ---- 云朵：横向漂移 ---- */
  .cloud{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes drift{from{transform:translateX(860px)}to{transform:translateX(-280px)}}

  /* ---- 太阳光芒 ---- */
  #rays{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 眨眼 ---- */
  #lid{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
  @keyframes blink{0%,93%{transform:scaleY(0)}95%{transform:scaleY(1)}97%{transform:scaleY(0)}}

  /* ---- 围巾飘动 ---- */
  #scarfTail{transform-box:fill-box;transform-origin:100% 60%;animation:wave .55s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-7deg) skewX(-4deg)}to{transform:rotate(9deg) skewX(6deg)}}

  #stars{transition:opacity .8s ease}
  #sunDisc,#glow,#rays{transition:opacity .6s ease}
</style>
</head>

<script>
/* =========================================================
   几何参数
   ========================================================= */
const P = {
  rear : {x:280, y:336},
  front: {x:528, y:336},
  R    : 46,                 // 车轮半径
  bb   : {x:398, y:340},      // 中轴（五通）
  crank: 20,                 // 曲柄长度
  hip  : {x:360, y:250},      // 髋关节
  femur: 60, tibia: 70       // 大腿 / 小腿
};

const $ = id => document.getElementById(id);
const el = {
  spinR:$('spinR'), spinF:$('spinF'), spinC:$('spinC'),
  legNear:$('legNear'), legFar:$('legFar'),
  crankNear:$('crankNear'), crankFar:$('crankFar'),
  footNear:$('footNear'), footFar:$('footFar'),
  crankNear:$('crankNear'),
  rider:$('rider'), head:$('head'), tail:$('tail'), wing:$('wing'),
  hill1:$('lyrHill1'), hill2:$('lyrHill2'), tree:$('lyrTree'),
  bush:$('lyrBush'), dash:$('lyrDash'), grass:$('lyrGrass'),
  shadow:$('shadow'), scarfTail:$('scarfTail')
};

/* ---- 生成车轮辐条 ---- */
(function spokes(){
  let s = '';
  for (let i = 0; i < 12; i++){
    const a = i * Math.PI / 6;
    s += `<line x1="${(Math.cos(a)*9).toFixed(2)}" y1="${(Math.sin(a)*9).toFixed(2)}"
                 x2="${(Math.cos(a)*36).toFixed(2)}" y2="${(Math.sin(a)*36).toFixed(2)}"/>`;
  }
  el.spinR.innerHTML = s;
  el.spinF.innerHTML = s;
})();

/* ---- 两段式反向运动学：已知髋、脚踏位置，求膝关节 ---- */
function solveKnee(hip, foot, L1, L2){
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  let d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.001);
  d = Math.max(d, Math.abs(L1 - L2) + 0.001);
  const base = Math.atan2(dy, dx);
  const cosA = (d*d + L1*L1 - L2*L2) / (2*d*L1);
  const A = Math.acos(Math.max(-1, Math.min(1, cosA)));
  const ang = base - A;                 // 膝盖朝前（+x）
  return { x: hip.x + L1*Math.cos(ang), y: hip.y + L1*Math.sin(ang) };
}

/* =========================================================
   动画主循环
   ========================================================= */
let dist = 0;                 // 累计前进距离（像素）
let speed = 230;              // 像素/秒
let paused = false;
let last = performance.now();

function pedalPos(theta){
  return {
    x: P.bb.x + P.crank * Math.cos(theta),
    y: P.bb.y + P.crank * Math.sin(theta)
  };
}

function drawLeg(pathEl, footEl, theta){
  const f = pedalPos(theta);
  const k = solveKnee(P.hip, f, P.femur, P.tibia);
  pathEl.setAttribute('d', `M${P.hip.x} ${P.hip.y} L${k.x.toFixed(2)} ${k.y.toFixed(2)} L${f.x.toFixed(2)} ${f.y.toFixed(2)}`);
  footEl.setAttribute('transform',
    `translate(${f.x.toFixed(2)} ${f.y.toFixed(2)}) rotate(${(Math.sin(theta)*12).toFixed(2)})`);
  return f;
}

function render(){
  const rad = dist / P.R;                                  // 车轮转角（弧度）
  const wheelDeg = rad * 180 / Math.PI;
  const theta = (dist / 150) * Math.PI * 2;                // 曲柄转角（踏频≈速度/150）

  // 车轮 / 牙盘旋转
  el.spinR.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
  el.spinF.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
  el.spinC.setAttribute('transform', `rotate(${(theta*180/Math.PI).toFixed(2)})`);

  // 曲柄 + 脚踏
  const fn = pedalPos(theta);
  el.crankNear.setAttribute('transform', `rotate(${(theta*180/Math.PI).toFixed(2)} 398 340)`);
  el.crankFar .setAttribute('transform', `rotate(${((theta+Math.PI)*180/Math.PI).toFixed(2)} 398 340)`);
  // 腿部跟随脚踏
  drawLeg(el.legNear, el.footNear, theta);
  drawLeg(el.legFar,  el.footFar,  theta + Math.PI);

  // 车身轻微颠簸 / 倾斜
  const bob  = Math.sin(dist * 0.055) * 2.2 - 1.2;
  const tilt = Math.sin(dist * 0.045 + 0.5) * 0.8;
  el.rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)}) rotate(${tilt.toFixed(2)} 400 336)`);
  el.shadow.setAttribute('rx', (152 + bob * 2).toFixed(1));

  // 头部点动、尾羽与翅膀摆动
  el.head.setAttribute('transform', `rotate(${(Math.sin(dist*0.05)*2.4).toFixed(2)} 424 146)`);
  el.tail.setAttribute('transform', `rotate(${(Math.sin(dist*0.07)*7).toFixed(2)} 302 210)`);
  el.wing.setAttribute('transform', `rotate(${(Math.sin(dist*0.05+1)*4).toFixed(2)} 368 192)`);

  // 视差背景滚动（800 为一块瓦片宽度）
  const scroll = (factor) => {
    const o = -((dist * factor) % 800);
    return `translate(${o.toFixed(2)} 0)`;
  };
  el.hill1.setAttribute('transform', scroll(0.07));
  el.hill2.setAttribute('transform', scroll(0.16));
  el.tree .setAttribute('transform', scroll(0.42));
  el.bush .setAttribute('transform', scroll(1.0));
  el.dash .setAttribute('transform', scroll(1.0));
  el.grass.setAttribute('transform', scroll(1.45));
}

function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) dist += speed * dt;
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   交互控件
   ========================================================= */
$('speed').addEventListener('input', e => {
  speed = +e.target.value;
  // 围巾飘动速度跟随车速
  el.scarfTail.style.animationDuration = (1.05 - (speed / 560) * 0.85).toFixed(2) + 's';
});

const btnPause = $('btnPause');
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? '▶ 继续' : '⏸ 暂停';
});

/* ---- 白天 / 夜间切换 ---- */
const themeEls = {
  sky1: $('sky1'), sky2: $('sky2'), sky3: $('sky3'),
  road1: $('road1'), road2: $('road2'),
  verge: $('verge'), curb: $('curb'), hill1: null
};
const stage = $('stage');
let night = false;
$('btnTheme').addEventListener('click', e => {
  night = !night;
  applyTheme();
  e.target.textContent = night ? '☀️ 白天模式' : '🌙 夜间模式';
});

function applyTheme(){
  const set = (el, c) => el.setAttribute('stop-color', c);
  if (night){
    set(themeEls.sky1, '#0b1c3f'); set(themeEls.sky2, '#16305c'); set(themeEls.sky3, '#274a75');
    set(themeEls.road1, '#2b3340'); set(themeEls.road2, '#1b222c');
    themeEls.verge.setAttribute('fill', '#3d6b4a');
    themeEls.curb .setAttribute('fill', '#4d5764');
    $('stars').setAttribute('opacity', '1');
    $('sunDisc').setAttribute('fill', '#eef3ff');
    $('sunDisc').setAttribute('r', '28');
    $('glow').setAttribute('fill', 'url(#gGlowNight)');
    $('rays').setAttribute('opacity', '0.12');
    $('scene').querySelector('#t-hill1 path').setAttribute('fill', '#243a5e');
    $('scene').querySelector('#t-hill2 path').setAttribute('fill', '#1f4a48');
    stage.classList.add('night');
  } else {
    set(themeEls.sky1, '#79c6ef'); set(themeEls.sky2, '#bfe6fb'); set(themeEls.sky3, '#eaf8ff');
    set(themeEls.road1, '#5f6a79'); set(themeEls.road2, '#39414e');
    themeEls.verge.setAttribute('fill', '#8FC27B');
    themeEls.curb .setAttribute('fill', '#828d99');
    $('stars').setAttribute('opacity', '0');
    $('sunDisc').setAttribute('fill', '#ffe066');
    $('sunDisc').setAttribute('r', '34');
    $('glow').setAttribute('fill', 'url(#gGlow)');
    $('rays').setAttribute('opacity', '0.85');
    $('scene').querySelector('#t-hill1 path').setAttribute('fill', '#b6d4e8');
    $('scene').querySelector('#t-hill2 path').setAttribute('fill', '#9dc6bd');
    stage.classList.remove('night');
  }
}
</script>
