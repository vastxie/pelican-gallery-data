<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车</title>
<style>
  :root {
    --sky: #87ceeb;
    --sky-deep: #5eb0d6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(#7ec8e3 0%, #c5e8f7 55%, #e8f6e4 55%, #b7d7a8 100%);
    font-family: "Segoe UI", "PingFang SC", sans-serif;
    overflow: hidden;
  }
  h1 {
    margin: 0;
    padding: 18px 24px 0;
    text-align: center;
    color: #1d3a4a;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
  }
  p.hint {
    margin: 6px 0 0;
    text-align: center;
    color: #355;
    font-size: 14px;
  }
  .stage {
    width: min(960px, 100vw);
    margin: 0 auto;
  }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <p class="hint">纯 SVG · 2D 循环动画</p>
  <div class="stage">
    <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕在骑自行车">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6ec4ea"/>
          <stop offset="100%" stop-color="#d4f0ff"/>
        </linearGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6c8"/>
          <stop offset="70%" stop-color="#ffd24a"/>
          <stop offset="100%" stop-color="#ffb703"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1a3a2a" flood-opacity="0.18"/>
        </filter>
      </defs>

      <!-- sky / ground -->
      <rect width="960" height="340" fill="url(#sky)"/>
      <rect y="340" width="960" height="180" fill="#9ccc7a"/>
      <path d="M0 360 Q 120 330 240 358 T 480 352 T 720 360 T 960 348 V 520 H 0 Z" fill="#7db85a"/>
      <!-- road -->
      <path d="M0 400 Q 240 388 480 404 T 960 396 V 470 H 0 Z" fill="#5c6b73"/>
      <path d="M0 430 H 960" stroke="#f4e7b0" stroke-width="4" stroke-dasharray="28 22" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="0.8s" repeatCount="indefinite"/>
      </path>

      <!-- sun -->
      <circle cx="820" cy="78" r="42" fill="url(#sun)">
        <animate attributeName="r" values="40;44;40" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- clouds -->
      <g fill="#fff" opacity="0.92">
        <g>
          <ellipse cx="0" cy="90" rx="46" ry="22"/>
          <ellipse cx="36" cy="82" rx="32" ry="20"/>
          <ellipse cx="70" cy="92" rx="28" ry="16"/>
          <animateTransform attributeName="transform" type="translate" from="-80 0" to="1040 0" dur="28s" repeatCount="indefinite"/>
        </g>
        <g>
          <ellipse cx="0" cy="150" rx="34" ry="16"/>
          <ellipse cx="28" cy="144" rx="24" ry="14"/>
          <animateTransform attributeName="transform" type="translate" from="200 0" to="1100 0" dur="36s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- distant hills -->
      <path d="M0 340 C 80 300 140 320 200 340 C 280 290 360 310 440 338 C 520 300 600 318 700 340 C 780 310 860 325 960 338 V 360 H 0 Z" fill="#6aa84f" opacity="0.55"/>

      <!-- rider + bike group, bobbing -->
      <g filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0; 0 4; 0 0" dur="0.7s" repeatCount="indefinite"/>

        <!-- shadow -->
        <ellipse cx="470" cy="430" rx="150" ry="14" fill="#2d3a22" opacity="0.22">
          <animate attributeName="rx" values="150;140;150;158;150" dur="0.7s" repeatCount="indefinite"/>
        </ellipse>

        <!-- ===== BICYCLE ===== -->
        <g id="bike" transform="translate(300,250)">
          <!-- frame -->
          <g stroke="#2b3a42" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <!-- rear triangle -->
            <path d="M70 120 L150 120 L110 60 Z"/>
            <!-- top tube / down tube to head -->
            <path d="M150 120 L230 70"/>
            <path d="M110 60 L230 70"/>
            <!-- fork -->
            <path d="M230 70 L250 150"/>
            <!-- seat post -->
            <path d="M110 60 L110 42"/>
            <!-- chainstay already in triangle; crank -->
          </g>
          <!-- seat -->
          <path d="M78 40 Q 110 28 148 42 Q 112 48 78 40 Z" fill="#3d2b1f"/>
          <!-- handlebar -->
          <g stroke="#2b3a42" stroke-width="6" fill="none" stroke-linecap="round">
            <path d="M230 70 L248 48"/>
            <path d="M232 48 H 272"/>
            <path d="M248 48 V 36"/>
          </g>
          <circle cx="270" cy="48" r="7" fill="#e07a3d"/>

          <!-- pedals / crank spinning -->
          <g transform="translate(150,120)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
              <line x1="-28" y1="0" x2="28" y2="0" stroke="#2b3a42" stroke-width="6" stroke-linecap="round"/>
              <rect x="22" y="-6" width="16" height="8" rx="2" fill="#444"/>
              <rect x="-38" y="-6" width="16" height="8" rx="2" fill="#444"/>
              <circle r="8" fill="#555"/>
              <circle r="3" fill="#ddd"/>
            </g>
          </g>

          <!-- chain hint -->
          <ellipse cx="150" cy="120" rx="26" ry="14" fill="none" stroke="#8a8175" stroke-width="3" stroke-dasharray="4 3"/>

          <!-- wheels -->
          <g>
            <!-- rear wheel -->
            <g transform="translate(70,150)">
              <circle r="52" fill="none" stroke="#1f2a30" stroke-width="8"/>
              <circle r="44" fill="none" stroke="#cfd6da" stroke-width="2"/>
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
                <g stroke="#8aa0ab" stroke-width="2">
                  <line x1="0" y1="-40" x2="0" y2="40"/>
                  <line x1="-40" y1="0" x2="40" y2="0"/>
                  <line x1="-28" y1="-28" x2="28" y2="28"/>
                  <line x1="-28" y1="28" x2="28" y2="-28"/>
                </g>
                <circle r="7" fill="#2b3a42"/>
                <circle r="3" fill="#f2f2f2"/>
              </g>
            </g>
            <!-- front wheel -->
            <g transform="translate(250,150)">
              <circle r="52" fill="none" stroke="#1f2a30" stroke-width="8"/>
              <circle r="44" fill="none" stroke="#cfd6da" stroke-width="2"/>
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.7s" repeatCount="indefinite"/>
                <g stroke="#8aa0ab" stroke-width="2">
                  <line x1="0" y1="-40" x2="0" y2="40"/>
                  <line x1="-40" y1="0" x2="40" y2="0"/>
                  <line x1="-28" y1="-28" x2="28" y2="28"/>
                  <line x1="-28" y1="28" x2="28" y2="-28"/>
                </g>
                <circle r="7" fill="#2b3a42"/>
                <circle r="3" fill="#f2f2f2"/>
              </g>
            </g>
          </g>
        </g>

        <!-- ===== PELICAN ===== -->
        <g id="pelican" transform="translate(392,168)">
          <!-- tail -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-8 20 70; 10 20 70; -8 20 70" dur="0.45s" repeatCount="indefinite"/>
            <path d="M8 62 Q -18 48 -8 86 Q 10 78 22 70 Z" fill="#f4f1ea"/>
            <path d="M6 66 Q -10 58 0 84" fill="none" stroke="#d9cfc0" stroke-width="2"/>
          </g>

          <!-- body -->
          <ellipse cx="48" cy="78" rx="46" ry="34" fill="#f7f4ee" stroke="#e2d8c8" stroke-width="2"/>
          <!-- wing flap -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 40 70; -28 40 70; 6 40 70; 0 40 70" dur="0.55s" repeatCount="indefinite"/>
            <path d="M30 62 Q 10 30 55 48 Q 78 62 60 86 Q 40 78 30 62 Z" fill="#efe8dc" stroke="#d9cfc0" stroke-width="1.5"/>
            <path d="M36 64 Q 28 48 52 56" fill="none" stroke="#c9bba8" stroke-width="2"/>
          </g>
          <!-- belly shading -->
          <ellipse cx="58" cy="88" rx="22" ry="14" fill="#fff" opacity="0.7"/>

          <!-- neck -->
          <path d="M78 62 C 96 40 92 18 108 8" fill="none" stroke="#f7f4ee" stroke-width="16" stroke-linecap="round"/>
          <path d="M78 62 C 96 40 92 18 108 8" fill="none" stroke="#e6ddd0" stroke-width="2"/>

          <!-- head -->
          <g>
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 1; 0 0" dur="0.7s" repeatCount="indefinite"/>
            <circle cx="118" cy="6" r="20" fill="#f7f4ee" stroke="#e2d8c8" stroke-width="2"/>
            <!-- eye -->
            <circle cx="126" cy="2" r="5.5" fill="#fff" stroke="#333" stroke-width="1"/>
            <circle cx="127.5" cy="2.2" r="2.6" fill="#1a1a1a">
              <animate attributeName="cx" values="127.5;129;127.5" dur="2.4s" repeatCount="indefinite"/>
            </circle>
            <circle cx="128.4" cy="1.2" r="0.9" fill="#fff"/>
            <!-- brow tuft -->
            <path d="M108 -8 Q 116 -16 124 -6" fill="none" stroke="#f0c14a" stroke-width="3" stroke-linecap="round"/>
            <!-- beak upper -->
            <path d="M134 6 L 196 14 L 136 16 Z" fill="#f4a261"/>
            <path d="M134 8 L 188 15" stroke="#e07a3d" stroke-width="1.5" fill="none"/>
            <!-- pouch -->
            <path d="M132 14 Q 168 18 190 16 Q 176 48 140 36 Q 128 28 132 14 Z" fill="#f6c28b" stroke="#e09a4a" stroke-width="1.5">
              <animate attributeName="d"
                values="M132 14 Q 168 18 190 16 Q 176 48 140 36 Q 128 28 132 14 Z;
                        M132 14 Q 170 22 190 16 Q 180 62 138 42 Q 124 30 132 14 Z;
                        M132 14 Q 168 18 190 16 Q 176 48 140 36 Q 128 28 132 14 Z"
                dur="1.6s" repeatCount="indefinite"/>
            </path>
            <!-- little fish peeking occasionally via pouch pulse already -->
          </g>

          <!-- legs pedaling: two legs offset phase -->
          <g stroke="#f4a261" stroke-width="5" fill="none" stroke-linecap="round">
            <!-- left leg -->
            <g>
              <animateTransform attributeName="transform" type="rotate" values="18 55 108; -22 55 108; 18 55 108" dur="0.7s" repeatCount="indefinite"/>
              <path d="M52 104 Q 48 128 62 146"/>
              <circle cx="66" cy="150" r="5" fill="#e07a3d" stroke="none"/>
            </g>
            <!-- right leg -->
            <g>
              <animateTransform attributeName="transform" type="rotate" values="-22 70 108; 18 70 108; -22 70 108" dur="0.7s" repeatCount="indefinite"/>
              <path d="M68 106 Q 78 128 70 148"/>
              <circle cx="66" cy="152" r="5" fill="#e09a4a" stroke="none"/>
            </g>
          </g>

          <!-- wing-arm on handlebar -->
          <path d="M70 70 Q 110 58 168 78" fill="none" stroke="#f7f4ee" stroke-width="10" stroke-linecap="round"/>
          <path d="M70 70 Q 110 58 168 78" fill="none" stroke="#e2d8c8" stroke-width="1.5"/>
          <ellipse cx="174" cy="80" rx="10" ry="7" fill="#f4a261"/>
        </g>
      </g>

      <!-- roadside grass tufts scrolling -->
      <g fill="#4e8c3a">
        <g>
          <path d="M0 430 l6 -16 l6 16 z"/>
          <path d="M16 434 l5 -12 l5 12 z"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.8s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M200 428 l7 -18 l6 18 z"/>
          <path d="M220 432 l5 -14 l6 14 z"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.8s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M460 436 l6 -14 l6 14 z"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.8s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M700 426 l8 -20 l7 20 z"/>
          <path d="M724 432 l5 -12 l5 12 z"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.8s" repeatCount="indefinite"/>
        </g>
        <g>
          <path d="M900 434 l6 -16 l6 16 z"/>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.8s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- birds in distance -->
      <g fill="none" stroke="#3d5a6c" stroke-width="2" stroke-linecap="round">
        <path d="M120 120 q 8 -8 16 0 q 8 -8 16 0">
          <animateTransform attributeName="transform" type="translate" values="0 0; 30 -8; 70 0" dur="6s" repeatCount="indefinite"/>
        </path>
        <path d="M160 100 q 6 -6 12 0 q 6 -6 12 0">
          <animateTransform attributeName="transform" type="translate" values="0 0; 40 -4; 90 2" dur="7s" repeatCount="indefinite"/>
        </path>
      </g>
    </svg>
  </div>
</body>
</html>
