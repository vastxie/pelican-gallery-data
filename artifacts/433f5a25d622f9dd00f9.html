<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 60%, #A5D6A7 60%, #81C784 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        .scene-container {
            position: relative;
            width: 900px;
            height: 600px;
        }
        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }
        h1 {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #2E7D32;
            font-size: 24px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="scene-container">
        <h1>🚲 鹈鹕骑自行车 🐦</h1>
        <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 渐变定义 -->
                <radialGradient id="skyGrad" cx="50%" cy="30%">
                    <stop offset="0%" stop-color="#87CEEB"/>
                    <stop offset="100%" stop-color="#B3E5FC"/>
                </radialGradient>
                <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#A5D6A7"/>
                    <stop offset="100%" stop-color="#66BB6A"/>
                </linearGradient>
                <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#9E9E9E"/>
                    <stop offset="100%" stop-color="#757575"/>
                </linearGradient>
                <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#E53935"/>
                    <stop offset="100%" stop-color="#C62828"/>
                </linearGradient>
                <radialGradient id="wheelGrad" cx="50%" cy="50%">
                    <stop offset="70%" stop-color="#424242"/>
                    <stop offset="100%" stop-color="#212121"/>
                </radialGradient>
                <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#FF8F00"/>
                    <stop offset="100%" stop-color="#F57F17"/>
                </linearGradient>
                <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#FFB74D"/>
                    <stop offset="100%" stop-color="#FF8F00"/>
                </linearGradient>
                <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#FAFAFA"/>
                    <stop offset="100%" stop-color="#E0E0E0"/>
                </linearGradient>
                <radialGradient id="sunGrad" cx="50%" cy="50%">
                    <stop offset="0%" stop-color="#FFF9C4"/>
                    <stop offset="50%" stop-color="#FFEE58"/>
                    <stop offset="100%" stop-color="#FDD835"/>
                </radialGradient>

                <!-- 云朵滤镜 -->
                <filter id="cloudShadow">
                    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- 背景 -->
            <rect width="900" height="600" fill="url(#skyGrad)"/>

            <!-- 太阳 -->
            <g>
                <circle cx="750" cy="80" r="45" fill="url(#sunGrad)" opacity="0.9">
                    <animate attributeName="r" values="45;48;45" dur="3s" repeatCount="indefinite"/>
                </circle>
                <!-- 太阳光芒 -->
                <g opacity="0.4">
                    <line x1="750" y1="20" x2="750" y2="5" stroke="#FDD835" stroke-width="3" stroke-linecap="round">
                        <animate attributeName="y2" values="5;0;5" dur="2s" repeatCount="indefinite"/>
                    </line>
                    <line x1="790" y1="40" x2="805" y2="30" stroke="#FDD835" stroke-width="3" stroke-linecap="round">
                        <animate attributeName="x2" values="805;810;805" dur="2s" repeatCount="indefinite"/>
                    </line>
                    <line x1="810" y1="80" x2="825" y2="80" stroke="#FDD835" stroke-width="3" stroke-linecap="round">
                        <animate attributeName="x2" values="825;830;825" dur="2s" repeatCount="indefinite"/>
                    </line>
                    <line x1="790" y1="120" x2="805" y2="130" stroke="#FDD835" stroke-width="3" stroke-linecap="round"/>
                    <line x1="750" y1="140" x2="750" y2="155" stroke="#FDD835" stroke-width="3" stroke-linecap="round"/>
                    <line x1="710" y1="120" x2="695" y2="130" stroke="#FDD835" stroke-width="3" stroke-linecap="round"/>
                    <line x1="690" y1="80" x2="675" y2="80" stroke="#FDD835" stroke-width="3" stroke-linecap="round"/>
                    <line x1="710" y1="40" x2="695" y2="30" stroke="#FDD835" stroke-width="3" stroke-linecap="round"/>
                </g>
            </g>

            <!-- 云朵 -->
            <g filter="url(#cloudShadow)">
                <g>
                    <animateTransform attributeName="transform" type="translate" values="0,0;60,0;0,0" dur="20s" repeatCount="indefinite"/>
                    <ellipse cx="150" cy="90" rx="50" ry="25" fill="white" opacity="0.9"/>
                    <ellipse cx="180" cy="80" rx="40" ry="22" fill="white" opacity="0.9"/>
                    <ellipse cx="120" cy="85" rx="35" ry="20" fill="white" opacity="0.9"/>
                </g>
                <g>
                    <animateTransform attributeName="transform" type="translate" values="0,0;-40,0;0,0" dur="25s" repeatCount="indefinite"/>
                    <ellipse cx="500" cy="60" rx="45" ry="20" fill="white" opacity="0.8"/>
                    <ellipse cx="530" cy="52" rx="35" ry="18" fill="white" opacity="0.8"/>
                    <ellipse cx="475" cy="55" rx="30" ry="16" fill="white" opacity="0.8"/>
                </g>
                <g>
                    <animateTransform attributeName="transform" type="translate" values="0,0;50,0;0,0" dur="30s" repeatCount="indefinite"/>
                    <ellipse cx="350" cy="120" rx="40" ry="18" fill="white" opacity="0.7"/>
                    <ellipse cx="380" cy="112" rx="30" ry="15" fill="white" opacity="0.7"/>
                </g>
            </g>

            <!-- 远处的山 -->
            <path d="M0 400 Q100 320 200 380 Q300 300 400 370 Q500 310 600 360 Q700 290 800 350 Q850 330 900 360 L900 400 Z" fill="#81C784" opacity="0.5"/>

            <!-- 地面 -->
            <rect x="0" y="400" width="900" height="200" fill="url(#groundGrad)"/>

            <!-- 路 -->
            <rect x="0" y="430" width="900" height="60" fill="url(#roadGrad)" rx="2"/>
            <!-- 路面标线 -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,0;-120,0" dur="1s" repeatCount="indefinite"/>
                <rect x="0" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="120" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="240" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="360" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="480" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="600" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="720" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="840" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
                <rect x="960" y="458" width="60" height="4" fill="white" opacity="0.7" rx="2"/>
            </g>

            <!-- 小花和草 -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,0;-200,0" dur="4s" repeatCount="indefinite"/>
                <circle cx="100" cy="425" r="4" fill="#E91E63"/>
                <circle cx="250" cy="420" r="3" fill="#FF5722"/>
                <circle cx="400" cy="423" r="4" fill="#9C27B0"/>
                <circle cx="550" cy="418" r="3" fill="#E91E63"/>
                <circle cx="700" cy="425" r="4" fill="#FF5722"/>
                <circle cx="850" cy="420" r="3" fill="#9C27B0"/>
                <circle cx="1000" cy="423" r="4" fill="#E91E63"/>
                <circle cx="1100" cy="418" r="3" fill="#FF5722"/>
            </g>

            <!-- ==================== 自行车 + 鹈鹕 整体 ==================== -->
            <g>
                <!-- 整体轻微上下弹跳 -->
                <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0;0,-3;0,0" dur="0.8s" repeatCount="indefinite"/>

                <!-- ========== 自行车 ========== -->
                <g id="bicycle">
                    <!-- 后轮 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="0 350 440;360 350 440" dur="1s" repeatCount="indefinite"/>
                        <circle cx="350" cy="440" r="42" fill="none" stroke="#333" stroke-width="5"/>
                        <circle cx="350" cy="440" r="38" fill="none" stroke="#555" stroke-width="1"/>
                        <!-- 辐条 -->
                        <line x1="350" y1="398" x2="350" y2="482" stroke="#888" stroke-width="1.5"/>
                        <line x1="308" y1="440" x2="392" y2="440" stroke="#888" stroke-width="1.5"/>
                        <line x1="320" y1="410" x2="380" y2="470" stroke="#888" stroke-width="1.5"/>
                        <line x1="380" y1="410" x2="320" y2="470" stroke="#888" stroke-width="1.5"/>
                        <!-- 轮毂 -->
                        <circle cx="350" cy="440" r="6" fill="#666"/>
                        <circle cx="350" cy="440" r="3" fill="#999"/>
                    </g>

                    <!-- 前轮 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="0 550 440;360 550 440" dur="1s" repeatCount="indefinite"/>
                        <circle cx="550" cy="440" r="42" fill="none" stroke="#333" stroke-width="5"/>
                        <circle cx="550" cy="440" r="38" fill="none" stroke="#555" stroke-width="1"/>
                        <!-- 辐条 -->
                        <line x1="550" y1="398" x2="550" y2="482" stroke="#888" stroke-width="1.5"/>
                        <line x1="508" y1="440" x2="592" y2="440" stroke="#888" stroke-width="1.5"/>
                        <line x1="520" y1="410" x2="580" y2="470" stroke="#888" stroke-width="1.5"/>
                        <line x1="580" y1="410" x2="520" y2="470" stroke="#888" stroke-width="1.5"/>
                        <!-- 轮毂 -->
                        <circle cx="550" cy="440" r="6" fill="#666"/>
                        <circle cx="550" cy="440" r="3" fill="#999"/>
                    </g>

                    <!-- 车架 -->
                    <!-- 下管: 中轴到前叉 -->
                    <line x1="450" y1="420" x2="540" y2="395" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>
                    <!-- 座管: 中轴到座垫 -->
                    <line x1="450" y1="420" x2="420" y2="360" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round"/>
                    <!-- 上管: 座垫到车头 -->
                    <line x1="420" y1="365" x2="540" y2="390" stroke="url(#frameGrad)" stroke-width="4" stroke-linecap="round"/>
                    <!-- 后下叉: 中轴到后轮 -->
                    <line x1="450" y1="420" x2="350" y2="440" stroke="url(#frameGrad)" stroke-width="4" stroke-linecap="round"/>
                    <!-- 后上叉: 座垫区域到后轮 -->
                    <line x1="420" y1="370" x2="350" y2="440" stroke="url(#frameGrad)" stroke-width="3.5" stroke-linecap="round"/>
                    <!-- 前叉 -->
                    <line x1="540" y1="390" x2="550" y2="440" stroke="#555" stroke-width="4" stroke-linecap="round"/>

                    <!-- 车把 -->
                    <line x1="535" y1="380" x2="555" y2="375" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    <line x1="530" y1="385" x2="540" y2="378" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                    <!-- 车把手 -->
                    <circle cx="530" cy="385" r="4" fill="#222"/>
                    <circle cx="558" cy="373" r="4" fill="#222"/>

                    <!-- 座垫 -->
                    <ellipse cx="415" cy="355" rx="18" ry="6" fill="#4E342E"/>
                    <ellipse cx="415" cy="354" rx="16" ry="4" fill="#5D4037"/>

                    <!-- 中轴/齿轮 -->
                    <circle cx="450" cy="420" r="12" fill="#555" stroke="#444" stroke-width="2"/>
                    <circle cx="450" cy="420" r="8" fill="#666"/>

                    <!-- 踏板曲柄 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="0 450 420;360 450 420" dur="1s" repeatCount="indefinite"/>
                        <!-- 曲柄臂 -->
                        <line x1="450" y1="420" x2="450" y2="445" stroke="#444" stroke-width="4" stroke-linecap="round"/>
                        <line x1="450" y1="420" x2="450" y2="395" stroke="#444" stroke-width="4" stroke-linecap="round"/>
                        <!-- 踏板 -->
                        <rect x="440" y="443" width="20" height="5" fill="#333" rx="2"/>
                        <rect x="440" y="392" width="20" height="5" fill="#333" rx="2"/>
                    </g>

                    <!-- 链条 (简化) -->
                    <path d="M450 432 Q400 455 350 446" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="3,2"/>
                    <path d="M450 408 Q400 390 350 434" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="3,2"/>
                </g>

                <!-- ========== 鹈鹕 ========== -->
                <g id="pelican">
                    <!-- 身体 -->
                    <ellipse cx="430" cy="320" rx="45" ry="35" fill="url(#bodyGrad)" stroke="#BDBDBD" stroke-width="1">
                        <!-- 身体随骑行轻微摇摆 -->
                        <animateTransform attributeName="transform" type="rotate" values="-2 430 320;2 430 320;-2 430 320" dur="0.8s" repeatCount="indefinite"/>
                    </ellipse>

                    <!-- 尾巴 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="-5 390 310;5 390 310;-5 390 310" dur="0.8s" repeatCount="indefinite"/>
                        <path d="M388 315 Q370 305 360 310 Q365 300 375 298 Q370 295 380 290 Q385 300 390 310" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
                    </g>

                    <!-- 翅膀 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="-8 430 300;8 430 300;-8 430 300" dur="0.6s" repeatCount="indefinite"/>
                        <path d="M415 295 Q400 280 410 265 Q425 275 440 270 Q435 285 445 295 Z" fill="#EEEEEE" stroke="#BDBDBD" stroke-width="1"/>
                        <!-- 翅膀纹理 -->
                        <path d="M418 290 Q410 280 415 272" fill="none" stroke="#CCC" stroke-width="1"/>
                        <path d="M425 290 Q420 278 425 270" fill="none" stroke="#CCC" stroke-width="1"/>
                    </g>

                    <!-- 脖子 -->
                    <path d="M460 305 Q475 280 478 260 Q480 245 475 235" fill="none" stroke="#F5F5F5" stroke-width="14" stroke-linecap="round"/>
                    <path d="M460 305 Q475 280 478 260 Q480 245 475 235" fill="none" stroke="#E0E0E0" stroke-width="12" stroke-linecap="round"/>
                    <path d="M460 305 Q475 280 478 260 Q480 245 475 235" fill="none" stroke="url(#bodyGrad)" stroke-width="10" stroke-linecap="round"/>

                    <!-- 头部 -->
                    <g>
                        <!-- 头部轻微点头 -->
                        <animateTransform attributeName="transform" type="rotate" values="-3 478 230;3 478 230;-3 478 230" dur="1s" repeatCount="indefinite"/>

                        <!-- 头 -->
                        <ellipse cx="480" cy="225" rx="22" ry="18" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>

                        <!-- 眼睛 -->
                        <circle cx="490" cy="218" r="6" fill="white" stroke="#333" stroke-width="1"/>
                        <circle cx="491" cy="217" r="3.5" fill="#1A1A1A"/>
                        <circle cx="492" cy="216" r="1.2" fill="white"/>

                        <!-- 头顶小毛 -->
                        <path d="M475 208 Q478 200 482 207" fill="none" stroke="#DDD" stroke-width="1.5"/>
                        <path d="M480 206 Q483 198 486 205" fill="none" stroke="#DDD" stroke-width="1.5"/>

                        <!-- 上喙 -->
                        <path d="M498 225 Q520 222 535 228 Q520 226 498 228" fill="url(#beakGrad)" stroke="#E65100" stroke-width="1"/>
                        <!-- 喙尖 -->
                        <path d="M533 227 Q538 228 535 230" fill="#F57F17" stroke="#E65100" stroke-width="0.5"/>

                        <!-- 下喙 + 喉囊 -->
                        <g>
                            <animateTransform attributeName="transform" type="rotate" values="0 498 228;3 498 228;0 498 228" dur="1.5s" repeatCount="indefinite"/>
                            <!-- 下喙 -->
                            <path d="M498 228 Q515 232 530 230" fill="none" stroke="#E65100" stroke-width="1.5"/>
                            <!-- 喉囊 -->
                            <path d="M498 228 Q510 245 525 235 Q515 232 498 228" fill="url(#pouchGrad)" opacity="0.8" stroke="#E65100" stroke-width="0.5"/>
                        </g>
                    </g>

                    <!-- 腿 (连接到踏板) -->
                    <!-- 左腿 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="0 450 420;360 450 420" dur="1s" repeatCount="indefinite"/>
                        <!-- 大腿 -->
                        <line x1="435" y1="348" x2="445" y2="395" stroke="#FFB74D" stroke-width="4" stroke-linecap="round">
                            <animate attributeName="x2" values="445;455;445" dur="0.5s" repeatCount="indefinite"/>
                        </line>
                    </g>

                    <!-- 右腿 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="180 450 420;540 450 420" dur="1s" repeatCount="indefinite"/>
                        <line x1="435" y1="348" x2="455" y2="395" stroke="#FFB74D" stroke-width="4" stroke-linecap="round">
                            <animate attributeName="x2" values="455;445;455" dur="0.5s" repeatCount="indefinite"/>
                        </line>
                    </g>

                    <!-- 脚 (橙色蹼足) - 左 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="0 450 420;360 450 420" dur="1s" repeatCount="indefinite"/>
                        <path d="M443 443 L435 450 L445 448 L440 455 L450 450 L448 457 L455 448 Z" fill="#FF8F00" stroke="#E65100" stroke-width="0.5"/>
                    </g>

                    <!-- 脚 (橙色蹼足) - 右 -->
                    <g>
                        <animateTransform attributeName="transform" type="rotate" values="180 450 420;540 450 420" dur="1s" repeatCount="indefinite"/>
                        <path d="M443 395 L435 388 L445 390 L440 383 L450 388 L448 381 L455 390 Z" fill="#FF8F00" stroke="#E65100" stroke-width="0.5"/>
                    </g>

                    <!-- 鹈鹕抓住车把的手臂/翅膀延伸 -->
                    <path d="M455 305 Q490 340 530 383" fill="none" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round">
                        <animate attributeName="d" values="M455 305 Q490 340 530 383;M455 305 Q490 338 530 385;M455 305 Q490 340 530 383" dur="0.8s" repeatCount="indefinite"/>
                    </path>
                    <path d="M455 305 Q490 340 530 383" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round">
                        <animate attributeName="d" values="M455 305 Q490 340 530 383;M455 305 Q490 338 530 385;M455 305 Q490 340 530 383" dur="0.8s" repeatCount="indefinite"/>
                    </path>
                </g>
            </g>

            <!-- 速度线 -->
            <g opacity="0.3">
                <line x1="280" y1="380" x2="240" y2="380" stroke="#666" stroke-width="2" stroke-linecap="round">
                    <animate attributeName="x1" values="280;260;280" dur="0.5s" repeatCount="indefinite"/>
                    <animate attributeName="x2" values="240;210;240" dur="0.5s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="0.5s" repeatCount="indefinite"/>
                </line>
                <line x1="290" y1="400" x2="245" y2="400" stroke="#666" stroke-width="1.5" stroke-linecap="round">
                    <animate attributeName="x1" values="290;270;290" dur="0.6s" repeatCount="indefinite"/>
                    <animate attributeName="x2" values="245;215;245" dur="0.6s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="0.6s" repeatCount="indefinite"/>
                </line>
                <line x1="285" y1="360" x2="255" y2="360" stroke="#666" stroke-width="1.5" stroke-linecap="round">
                    <animate attributeName="x1" values="285;265;285" dur="0.7s" repeatCount="indefinite"/>
                    <animate attributeName="x2" values="255;225;255" dur="0.7s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="0.7s" repeatCount="indefinite"/>
                </line>
            </g>

            <!-- 地面阴影 -->
            <ellipse cx="450" cy="488" rx="120" ry="8" fill="rgba(0,0,0,0.15)">
                <animate attributeName="rx" values="120;115;120" dur="0.8s" repeatCount="indefinite"/>
            </ellipse>

        </svg>
    </div>
</body>
</html>
