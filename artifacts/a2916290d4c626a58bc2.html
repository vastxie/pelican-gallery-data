<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #87CEEB 0%, #E0F0FF 60%, #90C695 60%, #6B8E5A 100%);
    overflow: hidden;
  }
  svg {
    width: 900px;
    height: 600px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7AA"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </radialGradient>
  </defs>

  <!-- Sky & Ground -->
  <rect x="0" y="0" width="900" height="360" fill="#87CEEB"/>
  <rect x="0" y="360" width="900" height="240" fill="#7CB574"/>
  <rect x="0" y="390" width="900" height="8" rx="2" fill="#555" opacity="0.7"/>

  <!-- Sun -->
  <circle cx="780" cy="80" r="50" fill="url(#sun)"/>

  <!-- Clouds -->
  <g opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;120,0;0,0" dur="30s" repeatCount="indefinite"/>
      <circle cx="150" cy="90" r="25" fill="white"/>
      <circle cx="175" cy="80" r="30" fill="white"/>
      <circle cx="200" cy="90" r="22" fill="white"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-80,0;0,0" dur="25s" repeatCount="indefinite"/>
      <circle cx="500" cy="60" r="20" fill="white"/>
      <circle cx="525" cy="50" r="28" fill="white"/>
      <circle cx="555" cy="58" r="24" fill="white"/>
    </g>
  </g>

  <!-- Whole bike + pelican group that moves across screen -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-200,0;1100,0" dur="12s" repeatCount="indefinite"/>

    <!-- Bicycle -->
    <g id="bicycle">
      <!-- Rear Wheel -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 350 370;360 350 370" dur="1.2s" repeatCount="indefinite"/>
        <circle cx="350" cy="370" r="38" fill="none" stroke="#333" stroke-width="3"/>
        <line x1="350" y1="332" x2="350" y2="408" stroke="#555" stroke-width="1.5"/>
        <line x1="312" y1="370" x2="388" y2="370" stroke="#555" stroke-width="1.5"/>
        <line x1="323" y1="343" x2="377" y2="397" stroke="#555" stroke-width="1.5"/>
        <line x1="377" y1="343" x2="323" y2="397" stroke="#555" stroke-width="1.5"/>
        <circle cx="350" cy="370" r="5" fill="#666"/>
      </g>

      <!-- Front Wheel -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 500 370;360 500 370" dur="1.2s" repeatCount="indefinite"/>
        <circle cx="500" cy="370" r="38" fill="none" stroke="#333" stroke-width="3"/>
        <line x1="500" y1="332" x2="500" y2="408" stroke="#555" stroke-width="1.5"/>
        <line x1="462" y1="370" x2="538" y2="370" stroke="#555" stroke-width="1.5"/>
        <line x1="473" y1="343" x2="527" y2="397" stroke="#555" stroke-width="1.5"/>
        <line x1="527" y1="343" x2="473" y2="397" stroke="#555" stroke-width="1.5"/>
        <circle cx="500" cy="370" r="5" fill="#666"/>
      </g>

      <!-- Frame -->
      <line x1="350" y1="370" x2="420" y2="310" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
      <line x1="420" y1="310" x2="500" y2="370" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
      <line x1="420" y1="310" x2="420" y2="340" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>
      <line x1="350" y1="370" x2="420" y2="340" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/>

      <!-- Seat post & seat -->
      <line x1="400" y1="325" x2="395" y2="290" stroke="#C0392B" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="395" cy="287" rx="16" ry="5" fill="#2C2C2C"/>

      <!-- Handlebar stem -->
      <line x1="460" y1="340" x2="490" y2="285" stroke="#C0392B" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Handlebar -->
      <line x1="478" y1="285" x2="502" y2="280" stroke="#333" stroke-width="4" stroke-linecap="round"/>

      <!-- Pedal crank -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 420 340;360 420 340" dur="1.2s" repeatCount="indefinite"/>
        <line x1="420" y1="340" x2="420" y2="360" stroke="#555" stroke-width="3"/>
        <rect x="414" y="358" width="12" height="4" rx="1" fill="#444"/>
        <line x1="420" y1="340" x2="420" y2="320" stroke="#555" stroke-width="3"/>
        <rect x="414" y="318" width="12" height="4" rx="1" fill="#444"/>
      </g>
      <circle cx="420" cy="340" r="4" fill="#666"/>
    </g>

    <!-- Pelican -->
    <g id="pelican">
      <!-- Body bobbing -->
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0;0,-4;0,0" dur="0.6s" repeatCount="indefinite"/>

      <!-- Body -->
      <ellipse cx="405" cy="265" rx="35" ry="28" fill="#F5F0E1"/>
      <ellipse cx="405" cy="270" rx="30" ry="20" fill="#FAF5E8"/>

      <!-- Wing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 380 255;-5 380 255;0 380 255;5 380 255;0 380 255" dur="0.8s" repeatCount="indefinite"/>
        <path d="M380 255 Q360 240 355 260 Q365 270 385 268 Z" fill="#D4C9A8"/>
      </g>

      <!-- Tail feathers -->
      <path d="M370 260 Q350 245 345 255 Q355 265 370 265 Z" fill="#C8BDA0"/>
      <path d="M368 255 Q345 238 342 250 Q352 260 368 260 Z" fill="#BEAE8A"/>

      <!-- Neck -->
      <path d="M425 255 Q440 240 445 215 Q448 200 445 185" fill="none" stroke="#F5F0E1" stroke-width="14" stroke-linecap="round"/>
      <path d="M425 255 Q440 240 445 215 Q448 200 445 185" fill="none" stroke="#FAF5E8" stroke-width="10" stroke-linecap="round"/>

      <!-- Head -->
      <ellipse cx="446" cy="178" rx="15" ry="13" fill="#F5F0E1"/>

      <!-- Eye -->
      <circle cx="452" cy="174" r="3.5" fill="white"/>
      <circle cx="453" cy="174" r="2" fill="#1a1a1a"/>
      <circle cx="454" cy="173" r="0.7" fill="white"/>

      <!-- Beak top -->
      <path d="M458 178 L500 182 L498 186 L458 184 Z" fill="#E8A030"/>

      <!-- Pouch (lower beak with pouch) -->
      <path d="M458 184 L498 186 Q495 200 480 205 Q465 208 458 196 Z" fill="#F0B840" opacity="0.85"/>
      <path d="M460 190 Q475 198 490 192" fill="none" stroke="#D49520" stroke-width="0.8"/>

      <!-- Crest feathers -->
      <path d="M440 168 Q435 155 438 148" fill="none" stroke="#D4C9A8" stroke-width="2" stroke-linecap="round"/>
      <path d="M445 166 Q442 152 446 144" fill="none" stroke="#BEAE8A" stroke-width="2" stroke-linecap="round"/>
      <path d="M450" fill="none" stroke="#D4C9A8" stroke-width="1.5" stroke-linecap="round"/>

      <!-- Legs reaching to pedals -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 420 340;360 420 340" dur="1.2s" repeatCount="indefinite"/>
        <!-- Right leg -->
        <line x1="420" y1="360" x2="408" y2="310" stroke="#E8A030" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="420" cy="362" rx="6" ry="2.5" fill="#E8A030"/>
        <!-- Left leg -->
        <line x1="420" y1="320" x2="400" y2="285" stroke="#E8A030" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="420" cy="318" rx="6" ry="2.5" fill="#E8A030"/>
      </g>

      <!-- Feet/arms on handlebar -->
      <path d="M430 270 Q460 268 488 282" fill="none" stroke="#E8A030" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Ground details - flowers -->
  <g opacity="0.7">
    <circle cx="100" cy="395" r="3" fill="#E74C3C"/>
    <circle cx="250" cy="398" r="2.5" fill="#F1C40F"/>
    <circle cx="400" cy="396" r="3" fill="#E74C3C"/>
    <circle cx="600" cy="397" r="2.5" fill="#9B59B6"/>
    <circle cx="750" cy="395" r="3" fill="#F1C40F"/>
    <circle cx="850" cy="398" r="2" fill="#E74C3C"/>
    <line x1="100" y1="398" x2="100" y2="408" stroke="#27AE60" stroke-width="1.5"/>
    <line x1="250" y1="400" x2="250" y2="410" stroke="#27AE60" stroke-width="1.5"/>
    <line x1="400" y1="399" x2="400" y2="409" stroke="#27AE60" stroke-width="1.5"/>
    <line x1="600" y1="400" x2="600" y2="410" stroke="#27AE60" stroke-width="1.5"/>
    <line x1="750" y1="398" x2="750" y2="408" stroke="#27AE60" stroke-width="1.5"/>
    <line x1="850" y1="400" x2="850" y2="408" stroke="#27AE60" stroke-width="1.5"/>
  </g>

  <!-- Grass blades -->
  <g stroke="#4A7A45" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M50 395 Q55 380 48 370"/>
    <path d="M180 397 Q185 382 178 372"/>
    <path d="M320 396 Q325 381 318 371"/>
    <path d="M550 395 Q555 380 548 370"/>
    <path d="M680 397 Q685 382 678 372"/>
    <path d="M820 396 Q825 381 818 371"/>
  </g>

</svg>
</body>
</html>
