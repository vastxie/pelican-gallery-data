<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 15%, #eaf7ff, #cfe7f7 55%, #aed2ea);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    width: min(96vw, 1040px);
    aspect-ratio: 9 / 5;
    border-radius: 22px;
    overflow: hidden;
    background: #cfeaff;
    box-shadow: 0 26px 60px rgba(16, 46, 76, .30), inset 0 1px 0 rgba(255,255,255,.7);
  }
  svg { display: block; width: 100%; height: 100%; }

  /* ---- 无限滚动 ---- */
  @keyframes scroll450 { to { transform: translateX(-450px); } }
  @keyframes scroll300 { to { transform: translateX(-300px); } }
  @keyframes scroll120 { to { transform: translateX(-120px); } }
  @keyframes scroll60  { to { transform: translateX(-60px);  } }

  .hillsBack  { animation: scroll450 34s linear infinite; }
  .hillsFront { animation: scroll450 18s linear infinite; }
  .clouds     { animation: scroll300 30s linear infinite; }
  .tufts      { animation: scroll120 2.4s linear infinite; }
  .pebbles    { animation: scroll120 1.1s linear infinite; }

  /* ---- 路面虚线 ---- */
  .road-dash { stroke-dasharray: 62 62; animation: dash .62s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -124; } }

  .side-dash { stroke-dasharray: 30 30; animation: dash .5s linear infinite; }

  /* ---- 速度线 ---- */
  .speed {
    opacity: 0;
    animation: speed 1.4s linear infinite;
  }
  @keyframes speed {
    0%   { transform: translateX(70px);  opacity: 0; }
    15%  { opacity: .85; }
    70%  { opacity: .55; }
    100% { transform: translateX(-330px); opacity: 0; }
  }

  .spin-sun { transform-origin: 782px 96px; animation: sun 40s linear infinite; }
  @keyframes sun { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .speed { display: none; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var BB   = { x: 455, y: 366 };   // 五通（曲柄中心）
  var CR   = 30;                   // 曲柄半径
  var HIP  = { x: 412, y: 252 };   // 髋关节
  var L1   = 80, L2 = 80;          // 大腿 / 小腿

  var $ = function (id) { return document.getElementById(id); };
  var crankNear = $("crankNear"), crankFar = $("crankFar");
  var legNear   = $("legNear"),   legFar   = $("legFar");
  var footNear  = $("footNear"),  footFar  = $("footFar");
  var spokesRear = $("spokesRear"), spokesFront = $("spokesFront");
  var bird = $("bird"), chainring = $("chainring");

  var DEG = 180 / Math.PI;

  /* 两段腿的逆向运动学：由髋、脚位置求膝盖 */
  function kneeOf(hip, foot) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var raw = Math.hypot(dx, dy) || 0.001;
    var ux = dx / raw, uy = dy / raw;
    var d = Math.min(Math.max(raw, Math.abs(L1 - L2) + 0.01), (L1 + L2) - 0.01);

    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var px = hip.x + a * ux, py = hip.y + a * uy;

    var k1 = { x: px - h * uy, y: py + h * ux };
    var k2 = { x: px + h * uy, y: py - h * ux };
    return k1.x >= k2.x ? k1 : k2;   // 膝盖朝前
  }

  function legPath(hip, foot) {
    var k = kneeOf(hip, foot);
    return "M" + hip.x.toFixed(1) + "," + hip.y.toFixed(1) +
           "L" + k.x.toFixed(1)   + "," + k.y.toFixed(1) +
           "L" + foot.x.toFixed(1)+ "," + foot.y.toFixed(1);
  }

  var SPEED = 2.2;          // 踏频（弧度/秒）
  var t0 = null;

  function tick(now) {
    if (t0 === null) t0 = now;
    var th = ((now - t0) / 1000) * SPEED;

    /* 身体起伏 */
    var bob = Math.sin(th * 2) * 2.5;
    var hip = { x: HIP.x, y: HIP.y + bob };
    bird.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");

    /* 脚踏位置 */
    var nearFoot = { x: BB.x + CR * Math.cos(th),          y: BB.y + CR * Math.sin(th) };
    var farFoot  = { x: BB.x + CR * Math.cos(th + Math.PI), y: BB.y + CR * Math.sin(th + Math.PI) };

    /* 曲柄 / 牙盘 */
    crankNear.setAttribute("transform", "rotate(" + (th * DEG).toFixed(2) + " " + BB.x + " " + BB.y + ")");
    crankFar .setAttribute("transform", "rotate(" + ((th + Math.PI) * DEG).toFixed(2) + " " + BB.x + " " + BB.y + ")");
    chainring.setAttribute("transform", "rotate(" + ((th + 12) * DEG).toFixed(2) + " " + BB.x + " " + BB.y + ")");

    /* 双腿 */
    legNear.setAttribute("d", legPath(hip, nearFoot));
    legFar .setAttribute("d", legPath({ x: hip.x - 7, y: hip.y + 3 }, farFoot));
    footNear.setAttribute("transform", "translate(" + nearFoot.x.toFixed(1) + " " + nearFoot.y.toFixed(1) + ")");
    footFar .setAttribute("transform", "translate(" + farFoot.x.toFixed(1)  + " " + farFoot.y.toFixed(1)  + ")");

    /* 车轮（齿轮比 2.6 : 1） */
    var w = (th * 2.6 * DEG).toFixed(2);
    spokesRear .setAttribute("transform", "rotate(" + w + " 330 362)");
    spokesFront.setAttribute("transform", "rotate(" + w + " 596 362)");

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    /* 静态首帧照常绘制 */
    requestAnimationFrame(tick);
  }
})();
</script>
