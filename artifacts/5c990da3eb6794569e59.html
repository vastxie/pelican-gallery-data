<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #8ec4d8;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  .waves {
    animation: wave-drift 6.5s linear infinite;
  }
  @keyframes wave-drift {
    from { transform: translateX(0); }
    to { transform: translateX(-160px); }
  }
  .pouch-wobble {
    transform-box: fill-box;
    transform-origin: 18% 30%;
    animation: pouch 0.8s ease-in-out infinite;
  }
  @keyframes pouch {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.015, 1.07); }
  }
  .fish {
    transform-box: fill-box;
    transform-origin: 80% 50%;
    animation: fish-wag 0.42s ease-in-out infinite;
  }
  @keyframes fish-wag {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(12deg); }
  }
  .eye-lid {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4.8s infinite;
  }
  @keyframes blink {
    0%, 86%, 100% { transform: scaleY(0.02); }
    91%, 95% { transform: scaleY(1); }
  }
  .gull-wing {
    transform-box: fill-box;
    animation: flap 1.3s ease-in-out infinite;
  }
  .gull-wing.left { transform-origin: right center; }
  .gull-wing.right { transform-origin: left center; animation-delay: -0.65s; }
  @keyframes flap {
    0%, 100% { transform: rotate(8deg) scaleY(1); }
    50% { transform: rotate(-16deg) scaleY(0.72); }
  }
  .bob-gull { animation: gull-bob 2.4s ease-in-out infinite; }
  @keyframes gull-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
    }
  }
</style>

  const pedalFar = document.getElementById('pedal-far');
  const pedalNear = document.getElementById('pedal-near');
  const footFar = document.getElementById('foot-far');
  const footNear = document.getElementById('foot-near');
  const thighFar = document.getElementById('thigh-far');
  const shinFar = document.getElementById('shin-far');
  const kneeFar = document.getElementById('knee-far');
  const thighNear = document.getElementById('thigh-near');
  const shinNear = document.getElementById('shin-near');
  const kneeNear = document.getElementById('knee-near');

  const rand = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(91);
  const dot = (parent, x, y, rx, ry, fill, opacity) => {
    const e = document.createElementNS(NS, 'ellipse');
    e.setAttribute('cx', x);
    e.setAttribute('cy', y);
    e.setAttribute('rx', rx);
    e.setAttribute('ry', ry);
    e.setAttribute('fill', fill);
    if (opacity) e.setAttribute('opacity', opacity);
    parent.appendChild(e);
  };
  for (let i = 0; i < 28; i++) {
    dot(pebbles, rand() * 960, 400 + rand() * 48, 1.1 + rand() * 2.4, 0.7 + rand() * 1.3, rand() > 0.55 ? '#e7c8a0' : '#d3ae84', 0.75);
  }
  const reedColors = ['#5f944c', '#7eb45f', '#3f7338', '#a3cc78'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElementNS(NS, 'path');
    const x = rand() * 960;
    const h = 26 + rand() * 34;
    const lean = (rand() - 0.5) * 16;
    p.setAttribute('d', `M${x} 520 C ${x + lean * 0.3} ${520 - h * 0.55}, ${x + lean} ${520 - h * 0.8}, ${x + lean * 1.2} ${520 - h}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', reedColors[i % reedColors.length]);
    p.setAttribute('stroke-width', String(1.6 + rand() * 1.6));
    p.setAttribute('stroke-linecap', 'round');
    reeds.appendChild(p);
  }
  const tile = (node, width) => {
    const copy = node.cloneNode(true);
    copy.removeAttribute('id');
    copy.setAttribute('transform', `translate(${width} 0)`);
    node.parentNode.appendChild(copy);
  };
  tile(pebbles, 960);
  tile(reeds, 960);
  const cloudCopy = clouds.cloneNode(true);
  cloudCopy.removeAttribute('id');
  cloudCopy.setAttribute('transform', 'translate(960 0)');
  clouds.appendChild(cloudCopy);

  const ik = (hip, target, l1, l2) => {
    let dx = target.x - hip.x;
    let dy = target.y - hip.y;
    let dist = Math.hypot(dx, dy);
    const max = l1 + l2 - 1;
    const min = Math.abs(l1 - l2) + 1;
    if (dist > max) dist = max;
    if (dist < min) dist = min;
    const base = Math.atan2(dy, dx);
    const cosA = (l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist);
    const offset = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const poses = [-1, 1].map((sign) => {
      const hipA = base + sign * offset;
      const knee = {
        x: hip.x + Math.cos(hipA) * l1,
        y: hip.y + Math.sin(hipA) * l1
      };
      return { knee };
    });
    poses.sort((a, b) => a.knee.y - b.knee.y);
    return poses[0];
  };

  const setLeg = (thigh, shin, kneeDot, foot, hip, target, lengths) => {
    const pose = ik(hip, target, lengths[0], lengths[1]);
    thigh.setAttribute('x1', hip.x);
    thigh.setAttribute('y1', hip.y);
    thigh.setAttribute('x2', pose.knee.x);
    thigh.setAttribute('y2', pose.knee.y);
    shin.setAttribute('x1', pose.knee.x);
    shin.setAttribute('y1', pose.knee.y);
    shin.setAttribute('x2', target.x);
    shin.setAttribute('y2', target.y);
    kneeDot.setAttribute('cx', pose.knee.x);
    kneeDot.setAttribute('cy', pose.knee.y);
    foot.setAttribute('transform', `translate(${target.x} ${target.y})`);
  };

  const pedalAt = (angle) => ({
    x: BB.x + Math.cos(angle) * CRANK,
    y: BB.y + Math.sin(angle) * CRANK
  });

  const draw = (angle, time) => {
    const deg = angle * 180 / Math.PI;
    const wheelDeg = deg * GEAR;
    const distance = angle * GEAR * WHEEL_R;
    const bob = Math.sin(angle * 2) * 2.6;

    rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    const squash = 1 + Math.sin(angle * 2) * 0.05;
    shadow.setAttribute('transform', `translate(0 ${(bob * 0.35).toFixed(2)}) scale(${squash.toFixed(3)} 1)`);
    shadow.setAttribute('opacity', String(0.14 + (1 - (bob + 2.6) / 5.2) * 0.05));

    crank.setAttribute('transform', `rotate(${deg.toFixed(2)} ${BB.x} ${BB.y})`);
    cog.setAttribute('transform', `translate(${REAR.x} ${REAR.y}) rotate(${wheelDeg.toFixed(2)})`);
    spinRear.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
    spinFront.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);

    const wrap = (value, size) => ((value % size) + size) % size;
    const slip = (-distance).toFixed(1);
    chainTop.setAttribute('stroke-dashoffset', slip);
    chainBot.setAttribute('stroke-dashoffset', slip);
    lane.setAttribute('stroke-dashoffset', String(distance));
    grass.setAttribute('patternTransform', `translate(${-wrap(distance, 42)} 0)`);
    pebbleScroll.setAttribute('transform', `translate(${-wrap(distance * 0.85, 960)} 0)`);
    reedScroll.setAttribute('transform', `translate(${-wrap(distance * 1.12, 960)} 0)`);
    clouds.setAttribute('transform', `translate(${-wrap(distance * 0.06, 960)} 0)`);
    boat.setAttribute('transform', `translate(${wrap(740 - distance * 0.18, 1280) - 160} 318)`);

    const far = pedalAt(angle + Math.PI);
    const near = pedalAt(angle);
    pedalFar.setAttribute('transform', `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)})`);
    pedalNear.setAttribute('transform', `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)})`);
    setLeg(thighFar, shinFar, kneeFar, footFar, HIP_FAR, far, L_FAR);
    setLeg(thighNear, shinNear, kneeNear, footNear, HIP_NEAR, near, L_NEAR);

    const nod = Math.sin(angle * 2) * 3.2;
    head.setAttribute('transform', `rotate(${nod.toFixed(2)} 500 168)`);
    const wag = Math.sin(angle * 2 + 0.6) * 6;
    tail.setAttribute('transform', `rotate(${wag.toFixed(2)} 324 250)`);
    void time;
  };

  draw(0.9, 0);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  let last = 0;
  let angle = 0.9;
  const loop = (now) => {
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    angle += dt * CADENCE * Math.PI * 2;
    draw(angle, now / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
