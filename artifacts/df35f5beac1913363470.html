<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车动画</title>
  <style>
    :root {
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #a8d8ff 0%, #6aa7ff 45%, #4f6ca6 100%);
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      }
      .frame {
        width: min(100vw, 1000px);
        aspect-ratio: 5 / 3;
        margin: 20px;
        border-radius: 24px;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        border: 8px solid rgba(255, 255, 255, 0.75);
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
        background: linear-gradient(180deg, #8fd3ff 0%, #dff3ff 58%, #c8ecb5 100%);
      }
      text {
        pointer-events: none;
      }
    </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wheelRim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f7f7f7" />
          <stop offset="100%" stop-color="#bcbcbc" />
        </linearGradient>
        <linearGradient id="bikeFrame" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffdf7b" />
          <stop offset="100%" stop-color="#ff9f43" />
        </linearGradient>
      </defs>

      <!-- sky and clouds -->
      <rect width="1000" height="600" fill="transparent" />
      <g opacity="0.6">
        <g fill="#ffffff" fill-opacity="0.7">
          <ellipse cx="140" cy="120" rx="62" ry="22" />
          <ellipse cx="90" cy="118" rx="40" ry="18" />
          <ellipse cx="188" cy="118" rx="34" ry="16" />
          <animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="28s" repeatCount="indefinite" />
        </g>
        <g fill="#ffffff" fill-opacity="0.55" transform="translate(240 0)">
          <ellipse cx="600" cy="92" rx="58" ry="22" />
          <ellipse cx="560" cy="90" rx="34" ry="15" />
          <ellipse cx="648" cy="92" rx="30" ry="13" />
          <animateTransform attributeName="transform" type="translate" values="240 0; 160 0; 240 0" dur="36s" repeatCount="indefinite" />
        </g>
      </g>

      <!-- grass -->
      <rect x="0" y="470" width="1000" height="130" fill="#6cae60" />
      <path d="M0 470 C80 450, 170 445, 260 462 C340 477, 430 472, 520 460 C610 448, 700 470, 785 462 C860 456, 940 450, 1000 458 L1000 600 L0 600 Z" fill="#57a257" opacity="0.95">
        <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 470 C80 450, 170 445, 260 462 C340 477, 430 472, 520 460 C610 448, 700 470, 785 462 C860 456, 940 450, 1000 458 L1000 600 L0 600 Z;M0 470 C80 458, 170 466, 260 450 C345 440, 440 462, 525 455 C610 450, 700 455, 785 468 C870 474, 940 458, 1000 452 L1000 600 L0 600 Z;M0 470 C80 450, 170 445, 260 462 C340 477, 430 472, 520 460 C610 448, 700 470, 785 462 C860 456, 940 450, 1000 458 L1000 600 L0 600 Z" />
      </path>

      <!-- road -->
      <rect x="0" y="460" width="1000" height="140" fill="#7b7b7b" opacity="0.9" />
      <g stroke="#f3f3f3" stroke-width="4" stroke-dasharray="28 22" opacity="0.7">
        <line x1="0" y1="525" x2="1000" y2="525" />
      </g>

      <!-- whole scene for tiny bounce -->
      <g id="rideScene" transform="translate(0 0)">
        <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; 0 -2; 0 0; 0 2; 0 0" dur="0.55s" repeatCount="indefinite" />

        <!-- bike -->
        <g id="bikeGroup" transform="translate(110 140)">
          <!-- wheels -->
          <g transform="translate(280 340)">
            <circle r="82" fill="#f2f2f2" stroke="url(#wheelRim)" stroke-width="8" />
            <circle r="5" fill="#444" />
            <line x1="-82" y1="0" x2="82" y2="0" stroke="#444" stroke-width="4" />
            <line x1="0" y1="-82" x2="0" y2="82" stroke="#444" stroke-width="4" />
            <line x1="-58" y1="-58" x2="58" y2="58" stroke="#666" stroke-width="3" />
            <line x1="-58" y1="58" x2="58" y2="-58" stroke="#666" stroke-width="3" />
            <animateTransform attributeName="transform" additive="sum" type="rotate" from="0 0 0" to="360 0 0" dur="1.3s" repeatCount="indefinite" />
          </g>

          <g transform="translate(620 340)">
            <circle r="82" fill="#f2f2f2" stroke="url(#wheelRim)" stroke-width="8" />
            <circle r="5" fill="#444" />
            <line x1="-82" y1="0" x2="82" y2="0" stroke="#444" stroke-width="4" />
            <line x1="0" y1="-82" x2="0" y2="82" stroke="#444" stroke-width="4" />
            <line x1="-58" y1="-58" x2="58" y2="58" stroke="#666" stroke-width="3" />
            <line x1="-58" y1="58" x2="58" y2="-58" stroke="#666" stroke-width="3" />
            <animateTransform attributeName="transform" additive="sum" type="rotate" from="0 0 0" to="360 0 0" dur="1.3s" repeatCount="indefinite" />
          </g>

          <!-- frame and forks -->
          <g fill="none" stroke="url(#bikeFrame)" stroke-width="10" stroke-linecap="round">
            <path d="M280 340 L450 270 L620 340" />
            <path d="M450 270 L520 220" />
            <path d="M450 270 L280 340" />
            <path d="M280 340 L360 340" />
            <path d="M450 270 L620 340" />
            <path d="M450 340 L530 250" />
            <path d="M530 250 L620 245" />
            <path d="M280 340 L340 260" />
            <path d="M620 340 L620 280" />
            <path d="M530 250 L360 248" />
          </g>

          <!-- chainring and pedal -->
          <g id="crank" transform="translate(280 340)">
            <circle r="18" fill="#ffd57a" stroke="#7d4e18" stroke-width="3" />
            <line x1="0" y1="0" x2="45" y2="15" stroke="#4e4e4e" stroke-width="6" />
            <circle cx="45" cy="15" r="10" fill="#cce1ff" stroke="#4e4e4e" stroke-width="3" />
            <line x1="0" y1="0" x2="-30" y2="-12" stroke="#4e4e4e" stroke-width="6" />
            <circle cx="-30" cy="-12" r="10" fill="#cce1ff" stroke="#4e4e4e" stroke-width="3" />

            <line x1="0" y1="-52" x2="0" y2="52" stroke="#444" stroke-width="3" />
            <line x1="-40" y1="-30" x2="40" y2="26" stroke="#444" stroke-width="3" />
            <animateTransform attributeName="transform" additive="sum" type="rotate" from="0 0 0" to="-360 0 0" dur="0.65s" repeatCount="indefinite" />
          </g>

          <!-- seat -->
          <rect x="365" y="220" width="16" height="45" rx="7" fill="#6d5f5b" />
          <ellipse cx="373" cy="220" rx="38" ry="18" fill="#ffe8ab" stroke="#6e4b17" stroke-width="3" />

          <!-- handlebar -->
          <line x1="560" y1="220" x2="630" y2="175" stroke="url(#bikeFrame)" stroke-width="10" stroke-linecap="round" />
          <line x1="630" y1="175" x2="670" y2="165" stroke="url(#bikeFrame)" stroke-width="8" stroke-linecap="round" />
          <line x1="530" y1="250" x2="620" y2="260" stroke="url(#bikeFrame)" stroke-width="10" stroke-linecap="round" />

          <!-- pelican rider -->
          <g id="pelican" transform="translate(350 170)">
            <animateTransform attributeName="transform" additive="sum" type="translate" values="350 170; 350 166; 350 170; 350 174; 350 170" dur="0.6s" repeatCount="indefinite" />
            <ellipse cx="48" cy="30" rx="50" ry="24" fill="#f4bf63" />
            <circle cx="98" cy="20" r="16" fill="#eaa84b" />
            <ellipse cx="100" cy="24" rx="3" ry="3" fill="#262626" />
            <ellipse cx="102" cy="20" rx="2" ry="2" fill="#fff" />
            <path d="M115 15 Q132 18 136 26 Q140 34 128 32 Q120 32 114 27 Z" fill="#f2b03d" />

            <!-- neck -->
            <rect x="92" y="26" width="4" height="18" fill="#e7ab49" rx="2" />

            <!-- wings -->
            <g fill="#e3a94d" opacity="0.95" transform="translate(38 24)">
              <ellipse cx="-30" cy="0" rx="29" ry="12" transform="rotate(-10)" >
                <animateTransform attributeName="transform" additive="sum" type="rotate" values="-12 0 0;18 0 0;-12 0 0" dur="0.5s" repeatCount="indefinite" />
              </ellipse>
              <ellipse cx="74" cy="0" rx="24" ry="10" transform="scale(-1,1) rotate(-10 74 0)">
                <animateTransform attributeName="transform" additive="sum" type="rotate" values="-6 74 0;14 74 0;-6 74 0" dur="0.5s" repeatCount="indefinite" />
              </ellipse>
            </g>

            <!-- feet near pedal -->
            <rect x="20" y="72" width="18" height="11" rx="4" fill="#ed9f39" opacity="0.95">
              <animate attributeName="y" values="72;68;72;70;72" dur="0.65s" repeatCount="indefinite" />
            </rect>
            <rect x="68" y="72" width="18" height="11" rx="4" fill="#ed9f39" opacity="0.95">
              <animate attributeName="y" values="72;70;72;68;72" dur="0.65s" repeatCount="indefinite" />
            </rect>

            <!-- tail -->
            <path d="M10 26 C0 38, -6 52, 12 58 C20 52, 16 40, 10 26 Z" fill="#d9933b" />
          </g>
        </g>
      </g>

      <text x="28" y="40" fill="#163b5e" font-size="30" font-weight="700">鹈鹕骑自行车</text>
      <text x="30" y="72" fill="#17486f" font-size="18">2D SVG 动画</text>
    </svg>
  </div>
</body>
</html>
