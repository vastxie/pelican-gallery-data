<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7e8c6">
  <title>海风骑行 · SVG 鹈鹕自行车动画</title>
  <style>
    :root {
      --ink: #263a3e;
      --cream: #fff9ea;
      --coral: #e75b4a;
      --orange: #f09a62;
      --yellow: #f3be3e;
      --wheel-speed: 1.32s;
      --pedal-speed: 1.32s;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      color: var(--ink);
      background: #f7e8c6;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    main,
    .scene {
      width: 100%;
      height: 100%;
    }

    .scene {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: linear-gradient(180deg, #f7e8c6 0%, #ffd8ad 100%);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    svg path,
    svg line,
    svg circle,
    svg ellipse,
    svg polyline,
    svg polygon {
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wheel-spin,
    .crank-spin {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform;
    }

    .wheel-spin { animation: spin var(--wheel-speed) linear infinite; }
    .crank-spin { animation: spin var(--pedal-speed) linear infinite; }

    .road-track {
      animation: roadTravel 2.8s linear infinite;
      will-change: transform;
    }

    .grass-track {
      animation: roadTravel 4.3s linear infinite;
      will-change: transform;
    }

    .dune-track {
      animation: roadTravel 18s linear infinite;
      will-change: transform;
    }

    .cloud-track {
      animation: roadTravel 34s linear infinite;
      will-change: transform;
    }

    .wave-track {
      animation: roadTravel 13s linear infinite;
      will-change: transform;
    }

    .rider-bob {
      animation: rideBob .66s ease-in-out infinite;
      will-change: transform;
    }

    .scarf-tail {
      animation: scarfWave .82s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: right center;
      will-change: transform;
    }

    .wing-tip {
      animation: wingSteer 1.32s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: left top;
      will-change: transform;
    }

    .blink {
      animation: blink 4.8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .pouch {
      animation: pouchBreath 1.32s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center top;
    }

    .leg-thigh,
    .leg-shin {
      transform-box: fill-box;
      transform-origin: center top;
      will-change: transform;
    }

    .leg-thigh { animation: thighCycle var(--pedal-speed) ease-in-out infinite; }
    .leg-shin { animation: shinCycle var(--pedal-speed) ease-in-out infinite; }
    .leg-far .leg-thigh,
    .leg-far .leg-shin { animation-delay: -.66s; }

    .chain-dashes {
      animation: chainRun .42s linear infinite;
    }

    .speed-line {
      animation: speedLine 1.8s linear infinite;
    }

    .speed-line:nth-child(2) { animation-delay: -.6s; }
    .speed-line:nth-child(3) { animation-delay: -1.2s; }

    .shadow-pulse {
      animation: shadowPulse .66s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes roadTravel {
      to { transform: translate3d(-1200px, 0, 0); }
    }

    @keyframes rideBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes scarfWave {
      from { transform: rotate(-3deg) skewX(0) scaleX(1); }
      to { transform: rotate(5deg) skewX(-7deg) scaleX(1.04); }
    }

    @keyframes wingSteer {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes blink {
      0%, 44%, 47%, 100% { transform: scaleY(1); }
      45.5% { transform: scaleY(.08); }
    }

    @keyframes pouchBreath {
      0%, 100% { transform: scaleY(.98); }
      50% { transform: scaleY(1.025); }
    }

    @keyframes thighCycle {
      0%, 100% { transform: rotate(-23deg); }
      50% { transform: rotate(25deg); }
    }

    @keyframes shinCycle {
      0%, 100% { transform: rotate(36deg); }
      50% { transform: rotate(-33deg); }
    }

    @keyframes chainRun {
      to { stroke-dashoffset: -18; }
    }

    @keyframes speedLine {
      0% { transform: translateX(0); opacity: 0; }
      20% { opacity: .6; }
      100% { transform: translateX(-175px); opacity: 0; }
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1); opacity: .17; }
      50% { transform: scaleX(.94); opacity: .11; }
    }

    .motion-toggle {
      position: absolute;
      z-index: 3;
      right: clamp(14px, 2.4vw, 34px);
      bottom: clamp(14px, 2.4vw, 30px);
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      min-height: 44px;
      padding: .65rem 1rem;
      border: 1.5px solid rgba(38, 58, 62, .25);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 249, 234, .84);
      box-shadow: 0 8px 24px rgba(38, 58, 62, .12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: 700 14px/1 inherit;
      letter-spacing: .04em;
      cursor: pointer;
      transition: transform .2s ease, background-color .2s ease;
    }

    .motion-toggle:hover { transform: translateY(-2px); }
    .motion-toggle:active { transform: translateY(0); }
    .motion-toggle:focus-visible { outline: 3px solid #2e7d82; outline-offset: 3px; }

    .motion-toggle__icon {
      width: 16px;
      height: 16px;
      display: grid;
      place-items: center;
      font-size: 12px;
    }

    .is-paused svg * {
      animation-play-state: paused !important;
    }

    @media (max-width: 700px) {
      .masthead { opacity: 0; }
      .motion-toggle__label { display: none; }
      .motion-toggle { width: 46px; padding: 0; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      svg * { animation: none !important; }
      .motion-toggle { display: none; }
    }
  </style>
</head>

        <span class="motion-toggle__label">暂停动画</span>
      </button>

  </main>

  <script>
    (() => {
      const scene = document.querySelector('#scene');
      const svg = document.querySelector('#pelican-scene');
      const toggle = document.querySelector('#motion-toggle');
      const icon = toggle.querySelector('.motion-toggle__icon');
      const label = toggle.querySelector('.motion-toggle__label');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      function setPaused(paused) {
        scene.classList.toggle('is-paused', paused);
        toggle.setAttribute('aria-pressed', String(paused));
        toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        icon.textContent = paused ? '▶' : 'Ⅱ';
        label.textContent = paused ? '播放动画' : '暂停动画';
      }

      function frameScene() {
        const ratio = window.innerWidth / window.innerHeight;
        if (ratio < 0.72) {
          const width = 630;
          const height = width / ratio;
          const y = 337.5 - height / 2;
          svg.setAttribute('viewBox', `285 ${y} ${width} ${height}`);
        } else if (ratio < 1.18) {
          const width = 850;
          const height = width / ratio;
          const y = 337.5 - height / 2;
          svg.setAttribute('viewBox', `175 ${y} ${width} ${height}`);
        } else {
          const height = 675;
          const width = Math.max(1200, height * ratio);
          const x = 600 - width / 2;
          svg.setAttribute('viewBox', `${x} 0 ${width} ${height}`);
        }
      }

      toggle.addEventListener('click', () => {
        setPaused(!scene.classList.contains('is-paused'));
      });

      window.addEventListener('resize', frameScene, { passive: true });
      reducedMotion.addEventListener?.('change', event => setPaused(event.matches));
      frameScene();

      if (reducedMotion.matches) setPaused(true);
    })();
  </script>
