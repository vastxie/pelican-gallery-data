<html lang="zh-CN" data-theme="day">

  <title>鹈鹕慢骑 · 一路都是好天气</title>
  <style>
    :root {

      --paper: #f6f4ec;
      --ink: #293f3d;
      --muted: #7b8678;
      --accent: #d66b4f;
      --sky-top: #edf0de;
      --sky-bottom: #f7f2de;
      --sea-top: #8fc5bd;
      --sea-bottom: #b7d8c5;
      --far-land: #b2c8aa;
      --near-land: #91ae96;
      --sun: #edb768;
      --sand: #e8dab3;
      --road: #f2e8ca;
      --cloud: #fffdf0;
    }
    :root[data-theme="sunset"] {
      --sky-top: #e9c8ba;
      --sky-bottom: #f5dbc1;
      --sea-top: #9eafac;
      --sea-bottom: #c4c4af;
      --far-land: #b4aea0;
      --near-land: #8b9e96;
      --sun: #e58659;
      --sand: #ddc39f;
      --road: #edd6b5;
      --cloud: #fae9d5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);

      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }

    .wrap { width: min(1120px, calc(100% - 64px)); margin: 0 auto; }
    .masthead {
      display: flex; align-items: center; justify-content: space-between;
      padding: 26px 0 19px; border-bottom: 1px solid #dce0d1;
    }
    .brand { display: flex; gap: 11px; align-items: center; }
    .brand-mark { width: 33px; height: 33px; flex: none; }
    .brand-name { font-size: 13px; font-weight: 750; letter-spacing: 2.4px; }
    .brand-name span { display: block; margin-top: 3px; font-size: 10px; letter-spacing: 3.7px; color: var(--muted); font-weight: 500; }
    .edition { font-size: 10px; color: var(--muted); letter-spacing: 2px; display: flex; align-items: center; gap: 9px; }
    .edition::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .intro { margin: 25px 0 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
    h1 { margin: 0; font-size: clamp(28px, 3.1vw, 41px); font-weight: 650; letter-spacing: -1.2px; line-height: 1.32; }
    .intro p { font-size: 12px; margin: 10px 0 0; letter-spacing: 1.1px; color: var(--muted); }
    .side-note { text-align: right; font-size: 10px; line-height: 1.85; letter-spacing: 2px; color: var(--muted); padding-bottom: 2px; }
    .scene-card { border: 1px solid #d7dccd; border-radius: 21px; overflow: hidden; background: #fffdf5; box-shadow: 0 12px 35px #34453e08; }
    .viewport { position: relative; overflow: hidden; background: var(--sky-top); }
    .art { display: block; width: 100%; height: auto; }
    .art .palette { transition: fill 700ms ease, stroke 700ms ease; }
    .art stop { transition: stop-color 700ms ease; }
    .toolbar { display: grid; grid-template-columns: 1fr 1.05fr auto; align-items: center; gap: 28px; padding: 19px 24px; }
    .transport { display: flex; align-items: center; gap: 15px; }
    .play { display: flex; align-items: center; gap: 9px; border: 0; border-radius: 10px; padding: 12px 17px; color: #fffdf1; background: #304c46; font-size: 12px; white-space: nowrap; transition: background 180ms ease, transform 180ms ease; }
    .play:hover { background: #436458; }
    .play:active { transform: scale(.97); }
    .play svg { width: 16px; height: 16px; }
    .play .play-shape { display: none; }
    .play[aria-pressed="true"] .play-shape { display: block; }
    .play[aria-pressed="true"] .pause-shape { display: none; }
    .live-state { font-size: 10px; white-space: nowrap; color: var(--muted); letter-spacing: .6px; display: flex; align-items: center; gap: 6px; }
    .state-dot { width: 5px; height: 5px; border-radius: 50%; background: #8ca680; }
    .paused .state-dot { background: #c3a37b; }
    .tempo { display: flex; align-items: center; gap: 11px; }
    .tempo label { font-size: 11px; white-space: nowrap; color: #7b8678; }
    input[type="range"] { --percent: 33.333%; width: 125px; min-width: 68px; height: 22px; margin: 0; background: transparent; cursor: pointer; appearance: none; -webkit-appearance: none; }
    input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 5px; background: linear-gradient(to right, #607f6d var(--percent), #e2e5d7 var(--percent)); }
    input[type="range"]::-moz-range-track { height: 3px; border-radius: 5px; background: #e2e5d7; }
    input[type="range"]::-moz-range-progress { height: 3px; background: #607f6d; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #52715f; border: 2px solid #fffdf5; box-shadow: 0 0 0 1px #52715f; margin-top: -5px; }
    input[type="range"]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #52715f; border: 2px solid #fffdf5; }
    .speed-value { font-size: 10px; font-variant-numeric: tabular-nums; min-width: 34px; color: #52634f; }
    .extras { display: flex; align-items: center; gap: 8px; }
    .small-button { display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #e2e5d8; background: transparent; color: #687760; border-radius: 10px; padding: 10px 12px; font-size: 11px; white-space: nowrap; transition: background 180ms ease, border-color 180ms ease; }
    .small-button:hover { background: #f3f2e7; border-color: #ccd3be; }
    .small-button[aria-pressed="true"] { color: #b1684e; background: #faeee0; border-color: #e8d2ba; }
    .small-button svg { width: 17px; height: 17px; }
    .keyboard-tip { display: none; font-size: 10px; color: #8c9485; }
    .footnote { display: flex; justify-content: space-between; margin: 16px 1px 24px; font-size: 10px; letter-spacing: 1px; color: #959c8c; gap: 10px; }
    .footnote .motto { font-family: Georgia, serif; letter-spacing: .4px; font-style: italic; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    @media (max-width: 920px) {
      .toolbar { gap: 15px; padding: 17px 19px; }
      .live-state { display: none; }
      .tempo { gap: 8px; }
      input[type="range"] { width: 102px; }
      .small-button { padding: 10px; }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 32px); }
      .masthead { padding: 20px 0 16px; }
      .brand-name { font-size: 11px; letter-spacing: 2px; }

      .edition { font-size: 9px; letter-spacing: 1px; }
      .intro { margin: 23px 0 20px; }
      h1 { font-size: 29px; letter-spacing: -.8px; }
      .intro p { font-size: 10px; letter-spacing: .5px; }
      .side-note { display: none; }
      .scene-card { border-radius: 16px; }
      .viewport { aspect-ratio: 1 / 1.04; }
      .art { position: absolute; width: 205%; max-width: none; height: 100%; left: -54%; }
      .toolbar { grid-template-columns: auto 1fr; gap: 14px 17px; padding: 16px; }
      .transport { gap: 0; }
      .play { padding: 11px 13px; font-size: 11px; }
      .tempo { flex-wrap: wrap; justify-content: flex-end; gap: 3px 10px; }
      .tempo label { font-size: 10px; }
      .tempo input { order: 3; width: 100%; }
      .speed-value { min-width: 30px; text-align: right; }
      .extras { grid-column: 1 / -1; padding-top: 13px; border-top: 1px solid #e9eadf; gap: 8px; }
      .small-button { border-radius: 8px; padding: 8px 10px; font-size: 10px; }
      .keyboard-tip { display: block; margin-left: auto; }
      .footnote { margin-top: 13px; font-size: 9px; letter-spacing: .3px; }
    }
    @media (max-width: 350px) {
      .wrap { width: calc(100% - 24px); }
      h1 { font-size: 26px; }
      .edition { display: none; }
      .toolbar { gap: 12px; padding: 13px; }
      .keyboard-tip { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

                <path id="scarfTail" d="M628 239C607 235 583 222 563 229L544 222 551 238C577 248 602 242 628 252Z" fill="#c9654c" stroke="#a85240" stroke-width="2"/>

                <path d="M486 280c25-30 57-26 88-17 31 2 59 19 58 43 0 23-29 44-63 44-43 0-76-15-88-37l-36-14 32-5-29-15 38 1Z" fill="url(#featherGradient)" stroke="#566854" stroke-width="3"/>
                <path d="M486 299q18 2 24 8m-17 10q18 0 28 5" fill="none" stroke="#bcc5ac" stroke-width="2"/>
                <path d="M585 285c37-19 32-33 38-54 3-18 5-41 24-50 17-9 40 0 44 20 5 17-7 32-23 40-3 17-5 36-18 52-17 15-45 11-65-8Z" fill="url(#featherGradient)" stroke="#566854" stroke-width="3"/>

                <g id="head">
                  <path d="M631 181q-10-10-5-19l14 8q-2-15 5-19 9 5 11 15" fill="#fffcef" stroke="#566854" stroke-width="2.5"/>
                  <path d="M626 177q11-20 32-21 22 0 35 24l-2 5-66-1Z" fill="#8d9c67" stroke="#566854" stroke-width="2.5"/>
                  <path d="M636 166q10-7 21-7" fill="none" stroke="#bdc696" stroke-width="3"/>
                  <path d="M625 183q36-3 72 3" fill="none" stroke="#596e4f" stroke-width="5"/>
                  <path d="M645 185 653 210 671 207 683 185" fill="none" stroke="#9aa783" stroke-width="2"/>
                  <path d="M686 213 809 217c-9 7-36 39-62 40-31 0-51-21-61-44Z" fill="url(#pouchGradient)" stroke="#a37b43" stroke-width="2.5"/>
                  <path d="M688 199c34-2 71 4 118 11 12 2 20 7 15 11-26 4-86-3-131-8Z" fill="#edb359" stroke="#a37b43" stroke-width="2.5"/>
                  <path d="M699 213 812 217" fill="none" stroke="#cf9048" stroke-width="1.5"/>
                  <path d="M700 225q21 19 46 22" fill="none" stroke="#f4cb80" stroke-width="2"/>
                  <circle cx="697" cy="205" r="1.8" fill="#ae7f41"/>
                  <g id="eye" transform="translate(668 197)"><circle r="5" fill="#354438"/><circle cx="1.5" cy="-1.8" r="1.5" fill="#fffdf1"/></g>
                  <path d="M661 186q6-3 12 0" fill="none" stroke="#687459" stroke-width="2"/>

                </g>
                <path d="M617 236q10 9 30 7l-3 13q-18 2-33-8Z" fill="#d57859" stroke="#a85842" stroke-width="2"/>
                <path d="M621 246q11 5 19 3" fill="none" stroke="#edaa80" stroke-width="2.5"/>
                <path d="M512 283c25-12 48-2 72 17 10 8 20 9 26 16-23 17-64 7-90-10q-13-11-8-23Z" fill="#e2e6d2" stroke="#7b8c70" stroke-width="2.5"/>
                <path d="M529 291q19 16 42 20m-47-11q13 15 34 17" fill="none" stroke="#b2bda3" stroke-width="2"/>
                <path d="M599 276q26 3 47 25 15 16 40 19l39-4q14-4 20 4l-9 9-53 3q-37-1-63-20c-17-11-33-11-21-36Z" fill="url(#featherGradient)" stroke="#63755c" stroke-width="3"/>
                <path d="M615 294q18 17 39 23m5 4 44 3" fill="none" stroke="#b8c4ab" stroke-width="2.5"/>
                <path d="m721 322 15 0m-16 5 11 0" stroke="#91a287" stroke-width="1.6"/>
              </g>

              <path id="nearLeg" d="M574 338 645 382 639 468" fill="none" stroke="#a68149" stroke-width="13"/>
              <path id="nearLegHighlight" d="M574 338 645 382 639 468" fill="none" stroke="#e6b767" stroke-width="8"/>
              <g id="nearPedal" transform="translate(640 468)"><path d="M-13 9h25" stroke="#566653" stroke-width="5"/></g>
              <g id="nearFoot" transform="translate(640 468)">
                <path d="M-11-5q13-5 19 0l18 8q4 5-3 6H-8q-7-3-3-14Z" fill="#e9bb69" stroke="#a68047" stroke-width="2"/>
                <path d="m6 0 12 6M0 1l8 5" fill="none" stroke="#c29553" stroke-width="1.5"/>

              <path d="M564 335q10 7 22 3" fill="none" stroke="#cbd3ba" stroke-width="6"/>

            <path d="M0 587q120-12 233 0t233 0 233 0 233 0 268 1v44H0Z" fill="#c2cba2"/>
            <g id="grasses"><use href="#grassTile" x="-1200"/><use href="#grassTile"/><use href="#grassTile" x="1200"/><use href="#grassTile" x="2400"/></g>
            <rect width="1200" height="630" fill="url(#paperTexture)" opacity=".34" pointer-events="none"/>
            <g opacity=".6" font-family="Georgia, serif" fill="#536d51" font-size="10" letter-spacing="2">
              <text x="46" y="558">EST. A GOOD DAY</text>
              <text x="1152" y="558" text-anchor="end">KEEP PEDALING ↗</text>
            </g>
          </svg>
        </div>
        <div class="toolbar" role="group" aria-label="骑行动画控制">
          <div class="transport">
            <button id="play" class="play" type="button" aria-pressed="false" aria-label="暂停骑行动画">
              <svg viewBox="0 0 20 20" aria-hidden="true" fill="currentColor"><g class="pause-shape"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></g><path class="play-shape" d="m6 3 11 7-11 7Z"/></svg>
              <span id="playText">停一会儿</span>
            </button>
            <span class="live-state"><i class="state-dot" aria-hidden="true"></i><span id="stateText">海风正好</span></span>
          </div>
          <div class="tempo">
            <label for="speed">骑行速度</label>
            <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-valuetext="1 倍速度">
            <output id="speedValue" for="speed" class="speed-value">1.00×</output>
          </div>
          <div class="extras">
            <button id="theme" class="small-button" type="button" aria-pressed="false" aria-label="切换到日落景色">
              <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 14h16M5 14a5 5 0 0 1 10 0M10 3v3M3 6l2 2M17 6l-2 2M4 17h12"/></svg><span id="themeText">看日落</span>
            </button>
            <button id="bell" class="small-button" type="button" aria-label="按响自行车铃铛" title="按响车铃">
              <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13V9a5 5 0 0 1 10 0v4l2 2H3l2-2ZM8 17q2 2 4 0M10 3V2"/></svg><span>叮铃</span>
            </button>
            <span class="keyboard-tip" aria-hidden="true">慢慢骑就好</span>
          </div>
        </div>
      </div>
      <p id="announcement" class="sr-only" role="status" aria-live="polite">动画正在播放。</p>
      <footer class="footnote"><span>SVG 小剧场 · 空格键暂停 / 继续</span><span class="motto">Life looks better at bicycle speed.</span></footer>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const nodes = Object.fromEntries([
        'bicycle', 'bikeShadow', 'rearSpin', 'frontSpin', 'crank',
        'farLeg', 'farLegHighlight', 'nearLeg', 'nearLegHighlight',
        'farFoot', 'nearFoot', 'farPedal', 'nearPedal', 'rider',
        'head', 'eye', 'scarfTail', 'scarfTailBack', 'clouds', 'land',
        'waves', 'grasses', 'roadMarks', 'sailboat', 'gullOne', 'gullTwo', 'bellWaves'
      ].map(id => [id, byId(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = motionPreference.matches;
      let time = 0;
      let rate = 1;
      let last = 0;
      let visible = true;
      let ringStarted = -Infinity;
      let audioContext;
      const play = byId('play');
      const slider = byId('speed');
      const announce = message => { byId('announcement').textContent = message; };
      const setTransform = (node, transform) => node.setAttribute('transform', transform);
      const n = value => value.toFixed(3);
      const mod = (value, period) => ((value % period) + period) % period;

      // Two-link legs: the feet stay attached to opposite crank ends at every speed.
      function leg(phase, bob) {
        const hip = { x: 574, y: 338 + bob };
        const foot = { x: 615 + Math.cos(phase) * 25, y: 468 + Math.sin(phase) * 25 - 5 };
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const thigh = 83, shin = 87;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const knee = { x: hip.x + along * dx / distance + bend * dy / distance,
          y: hip.y + along * dy / distance - bend * dx / distance };
        return { path: `M${n(hip.x)} ${n(hip.y)}L${n(knee.x)} ${n(knee.y)}L${n(foot.x)} ${n(foot.y)}`, foot };
      }

      function draw(now) {
        const phase = time * 2.35;
        const bob = Math.sin(phase * 2) * 1.55;
        const wheelDegrees = phase * 1.7 * 180 / Math.PI;
        const distance = phase * 1.7 * 85;
        setTransform(nodes.bicycle, `translate(0 ${n(Math.sin(phase * 2 + .5) * .65)})`);
        setTransform(nodes.rider, `translate(0 ${n(bob)})`);
        setTransform(nodes.rearSpin, `rotate(${n(wheelDegrees % 360)})`);
        setTransform(nodes.frontSpin, `rotate(${n(wheelDegrees % 360)})`);
        setTransform(nodes.crank, `rotate(${n(phase * 180 / Math.PI % 360)})`);
        for (const [side, angle] of [['near', phase], ['far', phase + Math.PI]]) {
          const result = leg(angle, bob);
          nodes[side + 'Leg'].setAttribute('d', result.path);
          nodes[side + 'LegHighlight'].setAttribute('d', result.path);
          setTransform(nodes[side + 'Foot'], `translate(${n(result.foot.x)} ${n(result.foot.y)})`);
          setTransform(nodes[side + 'Pedal'], `translate(${n(result.foot.x)} ${n(result.foot.y)})`);
        }
        setTransform(nodes.head, `rotate(${n(Math.sin(time * 1.6) * .7)} 654 203)`);
        const blink = mod(time, 5.8);
        const eyelid = blink > 5.55 && blink < 5.73 ? Math.max(.08, Math.abs(blink - 5.64) / .09) : 1;
        setTransform(nodes.eye, `translate(668 197) scale(1 ${n(eyelid)})`);
        const flutter = Math.sin(time * 6.5) * 6;
        nodes.scarfTail.setAttribute('d', `M628 239C602 ${n(231 + flutter)} 579 ${n(223 - flutter)} 559 ${n(229 + flutter)}L542 ${n(220 + flutter)} 549 ${n(237 + flutter)}C575 ${n(246 + flutter)} 601 241 627 251Z`);
        nodes.scarfTailBack.setAttribute('d', `M623 242C594 ${n(247 - flutter / 2)} 573 ${n(248 + flutter)} 555 ${n(245 + flutter)}L545 ${n(254 + flutter)}C577 ${n(261 + flutter)} 605 253 629 249Z`);
        setTransform(nodes.clouds, `translate(${-mod(time * 13, 1200)} 0)`);
        setTransform(nodes.land, `translate(${-mod(distance * .045, 1200)} 0)`);
        setTransform(nodes.waves, `translate(${-mod(time * 26, 1200)} ${n(Math.sin(time * .9) * 1.2)})`);
        setTransform(nodes.grasses, `translate(${-mod(distance, 1200)} 0)`);
        nodes.roadMarks.setAttribute('patternTransform', `translate(${-mod(distance, 240)} 0)`);
        setTransform(nodes.sailboat, `translate(${n(1280 - mod(1050 + time * 5, 1360))} ${n(342 + Math.sin(time * 1.3) * 1.5)}) rotate(${n(Math.sin(time * 1.3) * 1.8)})`);
        setTransform(nodes.gullOne, `translate(${n(Math.sin(time * .28) * 25)} ${n(Math.sin(time * 1.4) * 3)})`);
        setTransform(nodes.gullTwo, `translate(${n(Math.sin(time * .28 + .4) * 25)} ${n(Math.sin(time * 1.4 + 1) * 3)})`);
        nodes.bikeShadow.setAttribute('rx', n(216 + Math.sin(phase * 2) * 2));
        const ringAge = (now - ringStarted) / 1000;
        const ringing = ringAge >= 0 && ringAge < .85;
        nodes.bellWaves.setAttribute('opacity', ringing ? n((1 - ringAge / .85) * .8) : '0');
        setTransform(nodes.bellWaves, ringing ? `translate(751 299) scale(${n(1 + ringAge * .35)}) translate(-751 -299)` : '');
      }

      function updatePlayback(announceChange = true) {
        play.setAttribute('aria-pressed', String(paused));
        play.setAttribute('aria-label', paused ? '继续骑行动画' : '暂停骑行动画');
        byId('playText').textContent = paused ? '继续骑行' : '停一会儿';
        byId('stateText').textContent = paused ? '休息一下' : '海风正好';
        document.body.classList.toggle('paused', paused);
        if (announceChange) announce(paused ? '动画已暂停。' : '动画正在播放。');
      }
      play.addEventListener('click', () => { paused = !paused; updatePlayback(); });
      slider.addEventListener('input', () => {
        rate = Number(slider.value);
        byId('speedValue').value = rate.toFixed(2) + '×';
        slider.setAttribute('aria-valuetext', `${rate} 倍速度`);
        slider.style.setProperty('--percent', `${(rate - .5) / 1.5 * 100}%`);
      });
      slider.addEventListener('change', () => announce(`骑行速度已设为 ${rate} 倍。`));
      byId('theme').addEventListener('click', () => {
        const sunset = document.documentElement.dataset.theme !== 'sunset';
        document.documentElement.dataset.theme = sunset ? 'sunset' : 'day';
        byId('theme').setAttribute('aria-pressed', String(sunset));
        byId('theme').setAttribute('aria-label', sunset ? '切换到晴天景色' : '切换到日落景色');
        byId('themeText').textContent = sunset ? '回晴天' : '看日落';
        announce(sunset ? '已切换到日落景色。' : '已切换到晴天景色。');
      });
      byId('bell').addEventListener('click', () => {
        ringStarted = performance.now();
        announce('叮铃！鹈鹕按响了车铃。');
        // Sound is created locally, only after an explicit click.
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
          const start = audioContext.currentTime;
          for (const [frequency, offset, loudness] of [[1900, 0, .08], [2650, .07, .04]]) {
            const oscillator = audioContext.createOscillator();
            const volume = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, start + offset);
            volume.gain.setValueAtTime(0, start + offset);
            volume.gain.linearRampToValueAtTime(loudness, start + offset + .006);
            volume.gain.exponentialRampToValueAtTime(.0001, start + offset + .6);
            oscillator.connect(volume).connect(audioContext.destination);
            oscillator.start(start + offset);
            oscillator.stop(start + offset + .65);
            oscillator.onended = () => { oscillator.disconnect(); volume.disconnect(); };
          }
        } catch (_) { /* The visual bell remains available when audio is unsupported. */ }
      });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, textarea, select, a, [contenteditable="true"]')) return;
        event.preventDefault();
        paused = !paused;
        updatePlayback();
      });
      motionPreference.addEventListener('change', event => {
        if (event.matches) { paused = true; updatePlayback(); }
      });
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(entries => { visible = entries[0].isIntersecting; }).observe(byId('scene'));
      }
      function tick(now) {
        const delta = last ? Math.min((now - last) / 1000, .05) : 0;
        last = now;
        if (!paused && visible && !document.hidden) time += delta * rate;
        draw(now);
        requestAnimationFrame(tick);
      }
      updatePlayback();
      draw(0);
      requestAnimationFrame(tick);
    })();
  </script>
