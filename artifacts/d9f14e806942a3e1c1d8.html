<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4e9">
  <title>顺风慢行 · 鹈鹕的海岸骑行</title>
  <style>
    :root { color-scheme: light; --paper: #f6f4e9; --ink: #294d46; --muted: #79857a; --line: #dcded1; --orange: #da714e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #da714e; outline-offset: 5px; }
    .page { max-width: 1480px; margin: auto; padding: 0 64px; }
    header { height: 98px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-icon { width: 41px; height: 41px; }
    .brand-name { font-size: 15px; font-weight: 650; letter-spacing: 3px; }
    .brand-sub { display: block; margin-top: 5px; font-size: 8px; font-weight: 550; letter-spacing: 2.6px; }
    .edition { font-size: 10px; letter-spacing: 2px; display: flex; align-items: center; gap: 15px; }
    .edition span:first-child { color: var(--muted); }
    .edition i { width: 5px; height: 5px; border-radius: 50%; background: var(--orange); }
    .intro { text-align: center; padding: 39px 0 0; position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 15px; color: var(--orange); font-size: 10px; font-weight: 650; letter-spacing: 4px; }
    h1 { margin: 0; font: 500 clamp(30px, 3.3vw, 46px)/1.4 "Songti SC", "STSong", "Noto Serif CJK SC", serif; letter-spacing: 5px; }
    .subtitle { margin: 14px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 2px; }
    .art { position: relative; margin: -7px -28px -10px; }
    .scene { display: block; width: 100%; height: auto; overflow: hidden; }
    .art-caption { position: absolute; left: 28px; bottom: 33px; font-size: 9px; letter-spacing: 2px; color: var(--muted); display: flex; align-items: center; gap: 12px; }
    .art-caption::before { content: ""; width: 27px; height: 1px; background: #9da99b; }
    .controls { min-height: 86px; display: flex; align-items: center; justify-content: center; gap: 22px; }
    .play { border: 1px solid var(--ink); border-radius: 50%; width: 45px; height: 45px; display: grid; place-items: center; cursor: pointer; color: var(--ink); background: transparent; transition: background .2s, color .2s; }
    .play:hover { background: var(--ink); color: var(--paper); }
    .play svg { width: 17px; height: 17px; }
    .play .play-icon { display: none; }
    .play[data-paused="true"] .play-icon { display: block; }
    .play[data-paused="true"] .pause-icon { display: none; }
    .speeds { display: flex; padding: 5px; background: #eaece0; border-radius: 28px; gap: 3px; }
    .speed { border: 0; border-radius: 24px; padding: 10px 21px; background: transparent; color: #738173; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: background .2s, color .2s, box-shadow .2s; }
    .speed[aria-pressed="true"] { color: var(--ink); background: #fffdf3; box-shadow: 0 2px 5px #294d460b; }
    .speed:hover { color: var(--ink); }
    .status { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--muted); letter-spacing: 1px; min-width: 83px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #7c9c76; }
    body.paused .status-dot { background: #b4b7a6; }
    footer { margin-top: 12px; min-height: 68px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--muted); letter-spacing: 1.5px; }
    .footer-note { display: flex; align-items: center; gap: 9px; }
    .footer-note svg { width: 15px; height: 15px; }
    .footer-right { font-size: 9px; letter-spacing: 2px; }
    @media (min-width: 1500px) { .art { margin-top: -25px; } }
    @media (max-width: 700px) {
      .page { padding: 0 23px; }
      header { height: 79px; }
      .brand-name { font-size: 13px; letter-spacing: 2px; }
      .brand-sub { font-size: 7px; letter-spacing: 1.8px; }
      .brand-icon { width: 35px; }
      .edition { font-size: 8px; letter-spacing: 1px; gap: 8px; }
      .edition span:first-child { display: none; }
      .intro { padding-top: 45px; }
      .eyebrow { font-size: 8px; letter-spacing: 3px; }
      h1 { font-size: 31px; letter-spacing: 2px; }
      .subtitle { font-size: 10px; letter-spacing: 1px; }
      .art { margin: 12px -23px 0; overflow: hidden; }
      .scene { width: 174%; max-width: none; margin-left: -37%; }
      .art-caption { left: 24px; bottom: 6px; font-size: 7px; letter-spacing: 1.3px; }
      .controls { gap: 13px; margin-top: 25px; flex-wrap: wrap; min-height: 96px; }
      .speed { padding: 10px 15px; font-size: 10px; }
      .play { width: 41px; height: 41px; }
      .status { width: 100%; justify-content: center; margin-top: -8px; font-size: 9px; }
      footer { margin-top: 24px; min-height: 64px; font-size: 9px; letter-spacing: .5px; }
      .footer-right { font-size: 7px; letter-spacing: 1px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">

        <div class="brand-name">顺风慢行<span class="brand-sub">THE PELICAN CYCLING CLUB</span></div>

        <p class="subtitle">让海风带路，把日子骑成一首小诗。</p>

              <use href="#flower" transform="translate(1182 672) scale(.82)"/>
              <use href="#grass" transform="translate(1628 665) scale(1.05)"/>
              <use href="#flower" transform="translate(1660 661)"/>
              <use href="#grass" transform="translate(2611 674) scale(1.1)"/>
              <use href="#flower" transform="translate(2582 672) scale(.82)"/>
            </g>
            <rect width="1400" height="720" fill="url(#paper-dots)" pointer-events="none"/>
          </g>
        </svg>
        <div class="art-caption">沿着海岸线 · SOMEWHERE BY THE SEA</div>
      </div>

      <div class="controls" aria-label="动画控制">
        <button class="play" id="play-toggle" type="button" aria-label="暂停动画" title="暂停动画" data-paused="false">
          <svg class="pause-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg>
          <svg class="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6 3.5a1 1 0 0 1 1.5-.8l10 6.5a1 1 0 0 1 0 1.6l-10 6.5a1 1 0 0 1-1.5-.8Z"/></svg>
        </button>
        <div class="speeds" role="group" aria-label="骑行速度">
          <button class="speed" type="button" data-speed="0.6" aria-pressed="false">慢慢骑</button>
          <button class="speed" type="button" data-speed="1" aria-pressed="true">兜兜风</button>
          <button class="speed" type="button" data-speed="1.6" aria-pressed="false">追上海风</button>
        </div>
        <div class="status" role="status"><span class="status-dot"></span><span id="status-text">正在兜风</span></div>
      </div>
      <noscript><p style="text-align:center;font-size:12px">启用 JavaScript 后，鹈鹕就会开始骑行。</p></noscript>
    </main>

    <footer>
      <span class="footer-note"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M2 7h11q4 0 3-3t-4 0M2 11h15M5 15h6q4 0 3 3"/></svg>不赶时间，只追海风。</span>
      <span class="footer-right">TAKE THE SCENIC ROUTE ↗</span>
    </footer>
  </div>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'pelican-body', 'hip-feathers',
        'near-leg-outline', 'near-leg-color', 'far-leg-outline', 'far-leg-color',
        'near-foot', 'far-foot', 'near-crank', 'far-crank', 'near-crank-highlight',
        'road-markings', 'foreground-plants', 'distant-plants', 'ground-details',
        'scarf-tail', 'scarf-line', 'eye', 'eye-glint', 'closed-eye',
        'clouds', 'birds', 'sailboat', 'water-lines', 'bike-shadow'
      ].map(id => [id, byId(id)]));
      const playButton = byId('play-toggle');
      const speedButtons = [...document.querySelectorAll('.speed')];
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = motionPreference.matches;
      let speed = 1;
      let time = 0;
      let lastFrame = null;
      let frameId = null;
      const setTransform = (id, value) => parts[id].setAttribute('transform', value);

      // Two fixed-length segments keep the ankle attached to its moving pedal.
      function legPath(hip, ankle) {
        const upper = 118, lower = 115;
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hip.x + along * dx / distance + height * dy / distance;
        const kneeY = hip.y + along * dy / distance - height * dx / distance;
        return `M${hip.x} ${hip.y}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`;
      }

      function draw() {
        const angle = time * 2.6;
        const bob = Math.sin(angle * 2) * 1.7;
        const wheelAngle = (angle * 1.65 * 180 / Math.PI) % 360;
        // Road displacement matches the wheels' circumference and rotation.
        const distance = angle * 1.65 * 94;
        setTransform('rear-wheel', `rotate(${wheelAngle})`);
        setTransform('front-wheel', `rotate(${wheelAngle})`);
        setTransform('pelican-body', `translate(0 ${bob})`);
        setTransform('hip-feathers', `translate(0 ${bob})`);

        for (const [side, phase, offset] of [['near', 0, 0], ['far', Math.PI, -8]]) {
          const theta = angle + phase;
          const pedal = { x: 710 + 37 * Math.cos(theta), y: 553 + 37 * Math.sin(theta) };
          const ankle = { x: pedal.x - 6, y: pedal.y - 10 };
          const path = legPath({ x: 674 + offset, y: 376 + bob }, ankle);
          parts[`${side}-leg-outline`].setAttribute('d', path);
          parts[`${side}-leg-color`].setAttribute('d', path);
          parts[`${side}-crank`].setAttribute('d', `M710 553L${pedal.x} ${pedal.y}`);
          setTransform(`${side}-foot`, `translate(${pedal.x} ${pedal.y})`);
          if (side === 'near') parts['near-crank-highlight'].setAttribute('d', `M710 551L${pedal.x} ${pedal.y - 2}`);
        }

        setTransform('road-markings', `translate(${-distance % 200} 0)`);
        setTransform('foreground-plants', `translate(${-distance % 1400} 0)`);
        setTransform('distant-plants', `translate(${-(distance * .24) % 1540} 0)`);
        setTransform('ground-details', `translate(${-distance % 1560} 0)`);
        setTransform('clouds', `translate(${-24 * Math.sin(time * .055)} 0)`);
        setTransform('birds', `translate(${-9 * Math.sin(time * .18)} ${4 * Math.sin(time * .7)})`);
        setTransform('sailboat', `translate(${1122 - 16 * Math.sin(time * .05)} ${413 + Math.sin(time * 1.2) * 1.8}) rotate(${Math.sin(time * .8) * 1.5})`);
        setTransform('water-lines', `translate(${Math.sin(time * .7) * 10} 0)`);
        const flutter = Math.sin(angle * 2.1) * 5;
        parts['scarf-tail'].setAttribute('d', `M735 247C698 ${233 + flutter} 675 ${246 - flutter} 641 ${227 + flutter}L647 ${252 + flutter} 633 ${267 + flutter}C673 ${274 - flutter} 707 ${253 + flutter} 740 271Z`);
        parts['scarf-line'].setAttribute('d', `M644 ${246 + flutter}Q687 ${265 - flutter} 733 254`);
        const blinking = time % 5.7 > 5.51;
        parts.eye.setAttribute('opacity', blinking ? '0' : '1');
        parts['eye-glint'].setAttribute('opacity', blinking ? '0' : '1');
        parts['closed-eye'].setAttribute('opacity', blinking ? '1' : '0');
        parts['bike-shadow'].setAttribute('rx', 254 + bob * 1.3);
      }

      function frame(now) {
        frameId = null;
        if (paused || document.hidden) { lastFrame = null; return; }
        if (lastFrame !== null) time += Math.min((now - lastFrame) / 1000, .05) * speed;
        lastFrame = now;
        draw();
        frameId = requestAnimationFrame(frame);
      }

      function syncPlayback() {
        document.body.classList.toggle('paused', paused);
        playButton.dataset.paused = String(paused);
        playButton.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        playButton.title = paused ? '播放动画' : '暂停动画';
        byId('status-text').textContent = paused ? '歇一小会' : speed > 1 ? '迎风前行' : speed < 1 ? '悠闲慢骑' : '正在兜风';
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastFrame = null;
        if (!paused && !document.hidden) frameId = requestAnimationFrame(frame);
      }

      playButton.addEventListener('click', () => { paused = !paused; syncPlayback(); });
      speedButtons.forEach(button => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        syncPlayback();
      }));
      motionPreference.addEventListener('change', event => {
        if (event.matches) { paused = true; syncPlayback(); }
      });
      document.addEventListener('visibilitychange', syncPlayback);
      draw();
      syncPlayback();
    })();
  </script>
</body>
</html>
