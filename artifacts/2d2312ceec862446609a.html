<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23f5f2e9'/%3E%3Ccircle cx='27' cy='12' r='5' fill='%23d9a06c'/%3E%3Cpath d='M5 25Q12 17 20 25T35 25M8 31Q16 24 24 31' fill='none' stroke='%23294c45' stroke-width='2'/%3E%3C/svg%3E">
  <title>海风刚刚好 · 鹈鹕骑行</title>
  <style>
    :root{color-scheme:light;--ink:#294c45;--paper:#f5f2e9;--muted:#758079;--line:#d8ddd0;--orange:#d5734e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}button{touch-action:manipulation}
    .page{max-width:1280px;margin:auto;padding:34px 42px 25px}
    .masthead{display:flex;align-items:center;justify-content:space-between;padding-bottom:27px;border-bottom:1px solid var(--line);gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:650;letter-spacing:2px}
    .brand svg{width:30px;height:30px}
    .edition{font-size:11px;letter-spacing:2px;color:var(--muted)}
    .intro{display:flex;justify-content:space-between;align-items:flex-end;padding:30px 0 27px;gap:20px}
    .eyebrow{font-size:10px;letter-spacing:3px;font-weight:600;color:#8a9284;margin:0 0 12px}
    h1{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:clamp(30px,4vw,47px);font-weight:700;letter-spacing:3px;line-height:1.3;margin:0}
    .subtitle{font-size:13px;color:var(--muted);line-height:1.8;margin:12px 0 0;letter-spacing:1px}
    .weather{display:flex;align-items:center;gap:11px;font-size:11px;line-height:1.9;text-align:left;white-space:nowrap;color:#667d6b}
    .weather svg{width:35px;height:35px;color:#cf9262}
    .weather strong{color:var(--ink);font-size:12px;font-weight:500;letter-spacing:1px}
    .postcard{overflow:hidden;border:1px solid #c4cec0;border-radius:22px;background:#faf8ef;box-shadow:0 12px 35px #294c4508}
    .scene-wrap{position:relative;overflow:hidden;background:#f6e8cd}
    .scene{display:block;width:100%;height:auto;aspect-ratio:1200/660}
    .scene-label{position:absolute;left:25px;top:23px;display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:2px;color:#48685b;pointer-events:none}
    .scene-label span{width:6px;height:6px;border-radius:50%;background:#658878}
    .scene-label.is-paused span{background:#afab93}
    .scene-number{position:absolute;right:26px;top:23px;color:#8a967c;font-size:10px;letter-spacing:2px}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 25px;border-top:1px solid #c4cec0;background:#faf8ef}
    .controls-left{display:flex;align-items:center;gap:14px}
    button{border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1;transition:background .18s,box-shadow .18s}
    button:focus-visible,input:focus-visible{outline:3px solid #dba774;outline-offset:5px}
    .play{background:var(--ink);color:#fffdf4;padding:13px 20px;border-radius:40px;font-size:12px;letter-spacing:1px;min-width:126px}
    .play:hover{background:#3e655c}
    button svg{width:15px;height:15px;flex-shrink:0}
    .bell-button{background:transparent;color:var(--ink);padding:12px;border:1px solid var(--line);border-radius:50%;width:41px;height:41px}
    .bell-button:hover{background:#f1eadc}
    .ride-note{font-size:11px;color:#8b9181;letter-spacing:1px;margin:0}
    .speed{display:flex;align-items:center;gap:14px;min-width:250px}
    .speed label{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:1px}
    input[type=range]{width:117px;accent-color:var(--ink);cursor:pointer;height:18px;margin:0}
    output{font-size:12px;min-width:35px;color:var(--ink);font-variant-numeric:tabular-nums}
    .footer{display:flex;justify-content:space-between;gap:15px;padding:18px 3px 0;font-size:10px;letter-spacing:1px;color:#939989;line-height:1.7}
    .footer span:last-child{letter-spacing:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:700px){.page{padding:22px 18px}.masthead{padding-bottom:20px}.edition{font-size:9px;letter-spacing:1px}.intro{padding:26px 0 23px}.weather{display:none}.subtitle{font-size:11px;letter-spacing:.5px}.postcard{border-radius:17px}.scene{height:430px;aspect-ratio:auto}.scene-label{left:16px;top:18px;font-size:9px;letter-spacing:1px}.scene-number{right:16px;top:18px;font-size:9px}.controls{padding:17px 16px;gap:20px;flex-wrap:wrap}.controls-left{gap:10px}.play{padding:13px 17px;min-width:119px}.ride-note{display:none}.speed{min-width:0;flex:1;justify-content:flex-end;gap:10px}.speed input{width:85px}.speed label{font-size:10px}.footer{font-size:9px}.footer span:last-child{letter-spacing:1px}}
    @media(max-width:430px){.controls{justify-content:center;gap:16px}.controls-left{width:100%;justify-content:space-between}.play{flex:1}.speed{justify-content:center;width:100%;flex:auto;gap:18px}.speed input{width:135px}.scene{height:390px}.brand{font-size:11px;letter-spacing:1px}.eyebrow{font-size:9px;letter-spacing:2px}.footer{align-items:flex-start}.footer span:last-child{max-width:90px;text-align:right}}
    @media(prefers-reduced-motion:reduce){button{transition:none}}
  </style>
</head>

      <div class="controls">
        <div class="controls-left"><button class="play" id="toggle" type="button" aria-pressed="false" aria-label="暂停骑行"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M4 3h3v10H4zM9 3h3v10H9z"/></svg><span id="play-text">暂停骑行</span></button><button class="bell-button" id="ring" type="button" aria-label="按响车铃" title="按响车铃"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 13h12c-2-2-2-4-2-6a4 4 0 0 0-8 0c0 2 0 4-2 6Z" stroke="currentColor" stroke-width="1.4"/><path d="M8 16q2 2 4 0M10 2V1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button><p class="ride-note" id="ride-note">慢一点，好风景就在路上。</p></div>
        <div class="speed"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-valuetext="1 倍速"><output id="speed-value" for="speed">1.0×</output></div>
      </div>
    </section>
    <footer class="footer"><span>向前骑，直到海风把烦恼吹走。</span><span>ENJOY THE LITTLE THINGS</span></footer>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const ids = ['rear-spokes','front-spokes','crank-arms','rider-bike','pelican-upper','near-leg','near-leg-outline','far-leg','far-leg-light','near-foot','far-foot','near-pedal','far-pedal','scarf','scarf-fold','eye','clouds','waves','islands','meadow','road-marks','gulls','gull-one','gull-two','boat','bike-bell','bell-ripples'];
      const el = Object.fromEntries(ids.map(id => [id, $(id)]));
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reduced.matches, time = 0, speed = 1, last = null, bellUntil = 0, audioContext;
      const crankRate = 2.9, wheelRatio = 1.5, roadVelocity = crankRate * wheelRatio * 86;
      const set = (id, attr, value) => el[id].setAttribute(attr, value);
      const move = (id, x, y = 0) => set(id, 'transform', `translate(${x.toFixed(3)} ${y.toFixed(3)})`);
      const rotate = (id, deg) => set(id, 'transform', `rotate(${deg.toFixed(3)})`);
      // Two-link inverse kinematics keeps each foot exactly on its pedal.
      function knee(hip, foot, thigh, shin) {
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const side = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        return {x: hip.x + dx * along / distance - dy * side / distance, y: hip.y + dy * along / distance + dx * side / distance};
      }
      function draw() {
        const phase = time * crankRate, degrees = phase * 180 / Math.PI;
        const bounce = Math.sin(phase * 2) * 1.25;
        move('rider-bike', 0, bounce);
        rotate('rear-spokes', degrees * wheelRatio);
        rotate('front-spokes', degrees * wheelRatio);
        rotate('crank-arms', degrees);
        const hip = {x: 538, y: 391}, farHip = {x: 522, y: 385};
        const near = {x: 563 + Math.cos(phase) * 29, y: 510 + Math.sin(phase) * 29};
        const far = {x: 563 - Math.cos(phase) * 29, y: 510 - Math.sin(phase) * 29};
        const nearKnee = knee(hip, near, 83, 82), farKnee = knee(farHip, far, 88, 82);
        const legPath = (h, k, f) => `M${h.x} ${h.y} L${k.x.toFixed(3)} ${k.y.toFixed(3)} L${f.x.toFixed(3)} ${f.y.toFixed(3)}`;
        set('near-leg','d',legPath(hip, nearKnee, near));
        set('near-leg-outline','d',legPath(hip, nearKnee, near));
        set('far-leg','d',legPath(farHip, farKnee, far));
        set('far-leg-light','d',legPath(farHip, farKnee, far));
        move('near-foot', near.x, near.y - 3);move('far-foot', far.x, far.y - 3);
        move('near-pedal', near.x, near.y);move('far-pedal', far.x, far.y);
        $('chain').setAttribute('stroke-dashoffset',(time * 33).toFixed(2));
        const flutter = Math.sin(time * 7) * 6, flutter2 = Math.sin(time * 7 - 1.2) * 4;
        set('scarf','d',`M600 267Q561 ${270+flutter2} 545 ${247+flutter}Q520 ${241+flutter} 493 ${255+flutter}L509 ${267+flutter} 496 ${276+flutter}Q543 ${265+flutter2} 570 ${283+flutter2}Q587 285 607 271Z`);
        set('scarf-fold','d',`M512 ${260+flutter}Q546 ${251+flutter2} 570 ${272+flutter2}Q587 278 600 269`);
        const blinkPhase = time % 5.7;
        const blink = blinkPhase > 5.47 ? Math.max(.07, Math.abs(blinkPhase - 5.585) / .115) : 1;
        set('eye','transform',`translate(627 224) scale(1 ${blink.toFixed(3)})`);
        move('clouds', -(time * 9 % 1400));move('islands', -(time * 13 % 1400));
        move('waves', -(time * 38 % 1400));move('meadow', -(time * roadVelocity % 1200));
        set('road-marks','stroke-dashoffset',(time * roadVelocity % 360).toFixed(3));
        move('gulls', -(time * 18 % 1450) + (time * 18 >= 1450 ? 1100 : 0), Math.sin(time * .8) * 5);
        const flap = Math.sin(time * 2.2) * 4;
        set('gull-one','d',`M282 204q12 ${-10+flap} 24 0q12 ${-10+flap} 24 0`);
        set('gull-two','d',`M336 185q8 ${-7-flap*.6} 16 0q8 ${-7-flap*.6} 16 0`);
        move('boat', 193 - (time * 8 % 1500) + (time * 8 % 1500 > 240 ? 1500 : 0), 401 + Math.sin(time * 1.2) * 2);
      }
      function updateControls() {
        $('toggle').setAttribute('aria-pressed', String(paused));
        $('toggle').setAttribute('aria-label', paused ? '开始骑行' : '暂停骑行');
        $('play-text').textContent = paused ? '开始骑行' : '暂停骑行';
        $('play-icon').setAttribute('d',paused ? 'M4 2.5 13 8 4 13.5Z' : 'M4 3h3v10H4zM9 3h3v10H9z');
        $('ride-state').textContent = paused ? 'TAKE A BREAK / 歇一会儿' : 'ON THE WAY / 正在骑行';
        $('scene-label').classList.toggle('is-paused',paused);
        $('ride-note').textContent = reduced.matches && paused ? '已按你的偏好暂停，可手动开始。' : '慢一点，好风景就在路上。';
      }
      $('toggle').addEventListener('click',() => {paused = !paused;last = null;updateControls();});
      $('speed').addEventListener('input',e => {
        speed = Number(e.target.value);
        $('speed-value').textContent = speed.toFixed(1) + '×';
        e.target.setAttribute('aria-valuetext',speed.toFixed(1) + ' 倍速');
      });
      $('ring').addEventListener('click',() => {
        bellUntil = performance.now() + 1050;
        $('announcement').textContent = '叮铃！鹈鹕向你打了个招呼。';
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          audioContext.resume();
          [1568, 2093].forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator(), gain = audioContext.createGain();
            const start = audioContext.currentTime + index * .08;
            oscillator.type = 'sine';oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0,start);gain.gain.linearRampToValueAtTime(.075,start+.008);
            gain.gain.exponentialRampToValueAtTime(.001,start+.75);
            oscillator.connect(gain);gain.connect(audioContext.destination);
            oscillator.start(start);oscillator.stop(start+.8);
          });
        } catch (_) { /* The illustrated bell still works when audio is unavailable. */ }
      });
      reduced.addEventListener('change',e => {if(e.matches){paused=true;last=null;updateControls();}});
      document.addEventListener('visibilitychange',() => {last = null;});
      function tick(now) {
        if (last === null) last = now;
        const elapsed = Math.min((now - last) / 1000,.05);last = now;
        if (!paused) {time += elapsed * speed;draw();}
        const remaining = bellUntil - now;
        set('bell-ripples','opacity',remaining > 0 ? Math.min(1,remaining / 250) : 0);
        set('bike-bell','transform',remaining > 0 && !reduced.matches ? `rotate(${Math.sin(remaining*.04)*5} 708 377)` : 'rotate(0 708 377)');
        requestAnimationFrame(tick);
      }
      draw();updateControls();requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
