<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 - 2D SVG 动画</title>
  <style>
    :root {
      --bg-from: #56ccf2;
      --bg-to: #f2fcfe;
      --panel-bg: rgba(255, 255, 255, 0.86);
      --panel-border: rgba(255, 255, 255, 0.65);
      --text-main: #1e293b;
      --accent: #f97316;
      --accent-hover: #ea580c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      padding: 20px;
      overflow-x: hidden;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      position: relative;
    }

    .header-badge {
      position: absolute;
      top: 18px;
      left: 22px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      color: #0f172a;
    }

    .header-badge .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.75; }
    }

    svg#scene {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 24px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      padding: 8px 15px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .btn:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .slider-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: #475569;
    }

    input[type="range"] {
      accent-color: var(--accent);
      width: 120px;
      cursor: pointer;
    }

    .speed-readout {
      min-width: 44px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #0f172a;
      font-weight: 700;
    }

    .hint-text {
      font-size: 12.5px;
      color: #64748b;
    }

    /* Night mode transition helpers */
    .sky-transition {
      transition: stop-color 0.8s ease, fill 0.8s ease, opacity 0.8s ease;
    }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <div class="header-badge">
      <span class="dot"></span>
      <span>海滨骑行鹈鹕 · 2D 骨骼动力学 SVG 动画</span>
    </div>

    <svg id="scene" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Sky Gradients -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="skyStop1" class="sky-transition" offset="0%" stop-color="#38bdf8" />
          <stop id="skyStop2" class="sky-transition" offset="62%" stop-color="#bae6fd" />
          <stop id="skyStop3" class="sky-transition" offset="100%" stop-color="#fef9c3" />
        </linearGradient>

        <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="seaStop1" class="sky-transition" offset="0%" stop-color="#0284c7" />
          <stop id="seaStop2" class="sky-transition" offset="100%" stop-color="#0369a1" />
        </linearGradient>

        <!-- Pelican Gradients -->
        <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24" />
          <stop offset="55%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <linearGradient id="beakUpperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="70%" stop-color="#fb923c" />
          <stop offset="100%" stop-color="#f97316" />
        </linearGradient>

        <linearGradient id="pelicanBodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#e2e8f0" />
          <stop offset="100%" stop-color="#94a3b8" />
        </linearGradient>

        <!-- Bike Frame Gradient -->
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ef4444" />
          <stop offset="50%" stop-color="#dc2626" />
          <stop offset="100%" stop-color="#991b1b" />
        </linearGradient>

        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="50%" stop-color="#cbd5e1" />
          <stop offset="100%" stop-color="#64748b" />
        </linearGradient>

        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <linearGradient id="headlightBeamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75" />
          <stop offset="60%" stop-color="#fef08a" stop-opacity="0.22" />
          <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
        </linearGradient>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18" />
        </filter>

        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="8" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Reusable Wheel Spokes & Rim Template -->
        <g id="wheelTemplate">
          <!-- Outer Dark Tire -->
          <circle cx="0" cy="0" r="70" fill="none" stroke="url(#tireGrad)" stroke-width="12" />
          <!-- Whitewall Vintage Stripe -->
          <circle cx="0" cy="0" r="62" fill="none" stroke="#fef3c7" stroke-width="3.5" />
          <!-- Alloy Rim -->
          <circle cx="0" cy="0" r="58.5" fill="none" stroke="#94a3b8" stroke-width="3" />
          <!-- Spokes (12 spokes) -->
          <g stroke="#cbd5e1" stroke-width="1.6">
            <line x1="-58" y1="0" x2="58" y2="0" />
            <line x1="0" y1="-58" x2="0" y2="58" />
            <line x1="-41" y1="-41" x2="41" y2="41" />
            <line x1="-41" y1="41" x2="41" y2="-41" />
            <line x1="-50.2" y1="-29" x2="50.2" y2="29" />
            <line x1="-29" y1="-50.2" x2="29" y2="50.2" />
            <line x1="-50.2" y1="29" x2="50.2" y2="-29" />
            <line x1="-29" y1="50.2" x2="29" y2="-50.2" />
          </g>
          <!-- Brass Valve & Reflector -->
          <rect x="42" y="-3" width="9" height="6" rx="2" fill="#f59e0b" />
          <circle cx="-44" cy="0" r="4" fill="#fb7185" />
          <!-- Center Hub -->
          <circle cx="0" cy="0" r="10" fill="url(#chromeGrad)" stroke="#475569" stroke-width="2" />
          <circle cx="0" cy="0" r="4" fill="#334155" />
        </g>
      </defs>

      <!-- ================= 1. SKY & CELESTIAL LAYER ================= -->
      <rect width="900" height="400" fill="url(#skyGrad)" />

      <!-- Stars (Visible in Night Mode) -->
      <g id="starsGroup" opacity="0" class="sky-transition" fill="#ffffff">
        <circle cx="90" cy="55" r="1.5" />
        <circle cx="165" cy="95" r="2" />
        <circle cx="240" cy="42" r="1.2" />
        <circle cx="350" cy="78" r="1.8" />
        <circle cx="480" cy="35" r="1.4" />
        <circle cx="590" cy="68" r="2.2" />
        <circle cx="660" cy="32" r="1.5" />
        <circle cx="820" cy="50" r="1.8" />
        <circle cx="780" cy="110" r="1.2" />
        <circle cx="120" cy="145" r="1.4" />
        <circle cx="420" cy="120" r="1.5" />
      </g>

      <!-- Sun / Moon -->
      <g id="celestialBody" transform="translate(735, 95)" class="sky-transition">
        <circle id="sunHalo" cx="0" cy="0" r="56" fill="#fef08a" opacity="0.28" />
        <circle id="sunCore" cx="0" cy="0" r="38" fill="#fde047" filter="url(#glow)" />
      </g>

      <!-- Distant Clouds -->
      <g id="cloudsLayer" fill="#ffffff" opacity="0.88">
        <g class="cloud" data-x="110" data-speed="0.18" transform="translate(110, 82)">
          <path d="M0,25 Q0,8 18,8 Q26,-6 46,-4 Q66,-2 70,12 Q88,12 88,26 Q88,36 72,36 L12,36 Q0,36 0,25 Z" />
        </g>
        <g class="cloud" data-x="440" data-speed="0.12" transform="translate(440, 56) scale(1.25)">
          <path d="M0,25 Q0,8 18,8 Q26,-6 46,-4 Q66,-2 70,12 Q88,12 88,26 Q88,36 72,36 L12,36 Q0,36 0,25 Z" />
        </g>
        <g class="cloud" data-x="780" data-speed="0.22" transform="translate(780, 118) scale(0.85)">
          <path d="M0,25 Q0,8 18,8 Q26,-6 46,-4 Q66,-2 70,12 Q88,12 88,26 Q88,36 72,36 L12,36 Q0,36 0,25 Z" />
        </g>
      </g>

      <!-- Distant Seagulls -->
      <g id="seagullsLayer" stroke="#475569" stroke-width="2.2" fill="none" stroke-linecap="round">
        <path id="gull1" d="M 180,150 Q 190,140 200,150 Q 210,140 220,150" />
        <path id="gull2" d="M 225,132 Q 232,124 240,132 Q 248,124 255,132" />
      </g>

      <!-- ================= 2. DISTANT ISLAND, LIGHTHOUSE & SEA ================= -->
      <!-- Distant Island & Lighthouse -->
      <g id="islandLayer" transform="translate(0, 0)">
        <path d="M 40,345 Q 115,295 190,345 Z" fill="#64748b" opacity="0.45" />
        <!-- Lighthouse positioned behind island hill crest so base is firmly grounded -->
        <g transform="translate(735, 256)">
          <polygon points="-10,68 10,68 6,10 -6,10" fill="#f8fafc" />
          <polygon points="-8.5,48 8.5,48 7,34 -7,34" fill="#ef4444" />
          <polygon points="-7,22 7,22 6,10 -6,10" fill="#ef4444" />
          <rect x="-9" y="6" width="18" height="4" rx="1" fill="#1e293b" />
          <rect x="-5" y="0" width="10" height="6" fill="#fef08a" />
          <polygon points="-8,0 8,0 0,-9" fill="#dc2626" />
          <polygon id="lighthouseBeam" points="5,3 180,-35 180,42" fill="url(#headlightBeamGrad)" opacity="0" />
        </g>
        <path d="M 620,345 Q 725,282 835,345 Z" fill="#64748b" />
      </g>

      <!-- Ocean Water -->
      <rect x="0" y="340" width="900" height="90" fill="url(#seaGrad)" />

      <!-- Animated Waves -->
      <g id="wavesLayer" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
        <line class="waveLine" x1="40" y1="358" x2="110" y2="358" />
        <line class="waveLine" x1="230" y1="372" x2="320" y2="372" />
        <line class="waveLine" x1="450" y1="355" x2="520" y2="355" />
        <line class="waveLine" x1="610" y1="378" x2="710" y2="378" />
        <line class="waveLine" x1="790" y1="362" x2="860" y2="362" />
      </g>

      <!-- ================= 3. COASTAL PROMENADE & ROAD ================= -->
      <!-- Wooden Boardwalk Railing (Parallax Scrolling) -->
      <rect x="0" y="388" width="900" height="8" fill="#d97706" />
      <rect x="0" y="408" width="900" height="6" fill="#b45309" />
      <g id="railingPosts"></g>

      <!-- Sidewalk Curb -->
      <rect x="0" y="422" width="900" height="14" fill="#cbd5e1" />
      <rect x="0" y="432" width="900" height="4" fill="#94a3b8" />

      <!-- Asphalt Bike Path -->
      <rect x="0" y="436" width="900" height="124" fill="#334155" />
      <!-- Bike Lane Top Highlight -->
      <rect x="0" y="436" width="900" height="4" fill="#475569" />

      <!-- Scrolling Road Dashed Center Line -->
      <g id="roadDashes" fill="#fbbf24" opacity="0.85"></g>

      <!-- Scrolling Foreground Pebbles/Texture -->
      <g id="roadPebbles" fill="#1e293b" opacity="0.55"></g>

      <!-- ================= 4. PELICAN & BICYCLE RIG ================= -->
      <g id="bikeRig" transform="translate(45, 0)">
        <!-- Ground Shadow under Bike -->
        <ellipse id="groundShadow" cx="400" cy="488" rx="195" ry="12" fill="#0f172a" opacity="0.35" />

        <!-- Speed Wind Lines (Visible at high speed) -->
        <g id="windLines" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" opacity="0">
          <line id="wind1" x1="90" y1="220" x2="175" y2="220" />
          <line id="wind2" x1="55" y1="295" x2="155" y2="295" />
          <line id="wind3" x1="110" y1="365" x2="180" y2="365" />
        </g>

        <!-- ====== LAYER A: FAR SIDE (LEFT LEG & FAR PEDAL & FAR WING) ====== -->
        <!-- Far Crank Arm & Far Pedal -->
        <g id="farCrankGroup">
          <line id="farCrankArm" x1="375" y1="412" x2="375" y2="384" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
          <g id="farPedal" transform="translate(375, 384)">
            <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
            <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#f59e0b" />
          </g>
        </g>

        <!-- Pelican Far Leg (Left Leg - Behind Frame) -->
        <g id="farLegGroup">
          <!-- Upper Thigh (Feathered) -->
          <line id="farThigh" x1="322" y1="275" x2="375" y2="330" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
          <!-- Lower Leg (Orange Shank) -->
          <line id="farShin" x1="375" y1="330" x2="375" y2="384" stroke="#d97706" stroke-width="9" stroke-linecap="round" />
          <circle id="farKnee" cx="375" cy="330" r="6" fill="#d97706" />
          <!-- Webbed Foot (Far) -->
          <path id="farFoot" d="M -8,0 L 22,-4 L 28,4 L -8,5 Z" fill="#d97706" />
        </g>

        <!-- Pelican Far Wing (Reaching to Far Handlebar) -->
        <g id="farWingGroup">
          <path id="farWingPath" d="M 345,215 Q 415,235 466,248" fill="none" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
        </g>

        <!-- ====== LAYER B: BICYCLE WHEELS & FRAME ====== -->
        <!-- Rear Wheel -->
        <g id="rearWheel" transform="translate(255, 412)">
          <use href="#wheelTemplate" />
        </g>

        <!-- Front Wheel -->
        <g id="frontWheel" transform="translate(545, 412)">
          <use href="#wheelTemplate" />
        </g>

        <!-- Vintage Fenders (Mudguards) -->
        <path d="M 180,412 A 76,76 0 0 1 322,368" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />
        <path d="M 476,374 A 76,76 0 0 1 618,402" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" />

        <!-- Rear Cargo Rack & Fish Basket -->
        <g id="rearRack">
          <line x1="255" y1="412" x2="228" y2="322" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
          <line x1="322" y1="322" x2="215" y2="322" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
          <!-- Wooden Fish Crate on Rear Rack -->
          <g id="fishBasket" transform="translate(220, 286)">
            <rect x="0" y="0" width="58" height="34" rx="4" fill="#d97706" stroke="#92400e" stroke-width="2" />
            <line x1="4" y1="11" x2="54" y2="11" stroke="#92400e" stroke-width="2" />
            <line x1="4" y1="22" x2="54" y2="22" stroke="#92400e" stroke-width="2" />
            <!-- Little Fish Tail Sticking Out of Basket -->
            <g id="basketFish" transform="translate(26, 2)">
              <path d="M 0,0 Q 8,-14 18,-6 Q 10,4 0,0 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
              <polygon points="16,-6 26,-15 24,-1 16,-6" fill="#0284c7" />
            </g>
          </g>
        </g>

        <!-- Bicycle Frame Tubes -->
        <g id="bikeFrame" filter="url(#softShadow)">
          <!-- Chainstay -->
          <line x1="255" y1="412" x2="375" y2="412" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" />
          <!-- Seatstay -->
          <line x1="255" y1="412" x2="332" y2="308" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" />
          <!-- Seat Tube -->
          <line x1="375" y1="412" x2="326" y2="292" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" />
          <!-- Down Tube (Cruiser Curved) -->
          <path d="M 375,412 Q 445,380 498,312" fill="none" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" />
          <!-- Top Tube (Cruiser Step-Through Curve) -->
          <path d="M 332,312 Q 415,320 492,290" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />
          <!-- Head Tube -->
          <line x1="488" y1="278" x2="502" y2="322" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" />
          <!-- Front Fork -->
          <path d="M 498,318 Q 518,370 545,412" fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" />

          <!-- Chrome Seat Post & Handlebar Stem -->
          <line x1="326" y1="292" x2="318" y2="270" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round" />
          <path d="M 490,280 L 480,242 Q 476,232 462,240 L 452,252" fill="none" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round" />

          <!-- Brass Bike Bell -->
          <g id="bikeBell" transform="translate(474, 232)">
            <path d="M -7,0 A 7,7 0 0 1 7,0 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5" />
          </g>

          <!-- Vintage Headlight -->
          <g id="headlight" transform="translate(506, 286)">
            <polygon id="headlightBeam" points="10,2 340,-35 340,95" fill="url(#headlightBeamGrad)" opacity="0" class="sky-transition" />
            <path d="M -6,-8 L 8,-10 L 8,10 L -6,8 A 8,8 0 0 1 -6,-8 Z" fill="url(#chromeGrad)" stroke="#475569" stroke-width="1.5" />
            <ellipse cx="8" cy="0" rx="2.5" ry="9" fill="#fef08a" />
          </g>

          <!-- Leather Saddle -->
          <path id="saddle" d="M 292,268 Q 318,274 348,266 Q 354,274 335,280 Q 305,284 290,275 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />
        </g>

        <!-- Chain & Sprocket Assembly -->
        <g id="drivetrain">
          <!-- Outer Chain Loop (Animated Dash Offset) -->
          <path id="bikeChain" d="M 255,402 L 375,388 A 24,24 0 1 1 375,436 L 255,422 A 10,10 0 1 1 255,402 Z"
                fill="none" stroke="#334155" stroke-width="3.5" stroke-dasharray="6 4" />
          <!-- Rear Cassette -->
          <circle cx="255" cy="412" r="11" fill="#64748b" stroke="#334155" stroke-width="2" />
          <!-- Front Chainring (Rotates with Pedals) -->
          <g id="chainring" transform="translate(375, 412)">
            <circle cx="0" cy="0" r="24" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="5 3" />
            <circle cx="0" cy="0" r="20" fill="none" stroke="#cbd5e1" stroke-width="4" />
            <line x1="-20" y1="0" x2="20" y2="0" stroke="#cbd5e1" stroke-width="3.5" />
            <line x1="0" y1="-20" x2="0" y2="20" stroke="#cbd5e1" stroke-width="3.5" />
            <circle cx="0" cy="0" r="7" fill="#475569" />
          </g>
        </g>

        <!-- ====== LAYER C: PELICAN BODY, NECK, HEAD & BEAK ====== -->
        <g id="pelicanTorsoGroup" filter="url(#softShadow)">
          <!-- Tail Feathers (Wags with cadence) -->
          <g id="pelicanTail" transform="translate(285, 250)">
            <path d="M 0,0 L -34,-14 L -24,-2 L -38,4 L -20,10 L -28,18 L 4,14 Z"
                  fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
          </g>

          <!-- Plump Pelican Body -->
          <path d="M 284,252

  <script>
    (() => {
      // ==================== 1. INITIALIZE SCENERY ELEMENTS ====================
      const railingPostsGroup = document.getElementById('railingPosts');
      const roadDashesGroup = document.getElementById('roadDashes');
      const roadPebblesGroup = document.getElementById('roadPebbles');

      const postCount = 12;
      const postSpacing = 82;
      const posts = [];
      for (let i = 0; i < postCount; i++) {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('y', '380');
        rect.setAttribute('width', '10');
        rect.setAttribute('height', '44');
        rect.setAttribute('rx', '2');
        rect.setAttribute('fill', '#92400e');
        railingPostsGroup.appendChild(rect);
        posts.push({ el: rect, x: i * postSpacing });
      }

      const dashCount = 8;
      const dashSpacing = 125;
      const dashes = [];
      for (let i = 0; i < dashCount; i++) {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('y', '494');
        rect.setAttribute('width', '58');
        rect.setAttribute('height', '8');
        rect.setAttribute('rx', '4');
        roadDashesGroup.appendChild(rect);
        dashes.push({ el: rect, x: i * dashSpacing });
      }

      const pebbleCount = 18;
      const pebbles = [];
      for (let i = 0; i < pebbleCount; i++) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        const py = 446 + (i * 37) % 104;
        const rx = 2 + (i % 4);
        c.setAttribute('cy', py);
        c.setAttribute('rx', rx);
        c.setAttribute('ry', '1.5');
        roadPebblesGroup.appendChild(c);
        pebbles.push({ el: c, x: (i * 57) % 940 });
      }

      const clouds = Array.from(document.querySelectorAll('.cloud')).map((el) => ({
        el,
        x: parseFloat(el.dataset.x),
        y: el.getAttribute('transform').match(/translate\([^,]+,\s*([^)]+)\)/)[1],
        scale: (el.getAttribute('transform').match(/scale\(([^)]+)\)/) || [null, '1'])[1],
        speed: parseFloat(el.dataset.speed),
      }));

      // ==================== 2. DOM REFERENCES FOR RIGGING ====================
      const rearWheel = document.getElementById('rearWheel');
      const frontWheel = document.getElementById('frontWheel');
      const chainring = document.getElementById('chainring');
      const bikeChain = document.getElementById('bikeChain');

      const farCrankArm = document.getElementById('farCrankArm');
      const farPedal = document.getElementById('farPedal');
      const farThigh = document.getElementById('farThigh');
      const farShin = document.getElementById('farShin');
      const farKnee = document.getElementById('farKnee');
      const farFoot = document.getElementById('farFoot');

      const nearCrankArm = document.getElementById('nearCrankArm');
      const nearPedal = document.getElementById('nearPedal');
      const nearThigh = document.getElementById('nearThigh');
      const nearThighInner = document.getElementById('nearThighInner');
      const nearShin = document.getElementById('nearShin');
      const nearKnee = document.getElementById('nearKnee');
      const nearFootGroup = document.getElementById('nearFootGroup');

      const pelicanTorsoGroup = document.getElementById('pelicanTorsoGroup');
      const pelicanTail = document.getElementById('pelicanTail');
      const pelicanHeadGroup = document.getElementById('pelicanHeadGroup');
      const gularPouch = document.getElementById('gularPouch');
      const pouchFish = document.getElementById('pouchFish');
      const upperBeakGroup = document.getElementById('upperBeakGroup');
      const honkWaves = document.getElementById('honkWaves');
      const eyelid = document.getElementById('eyelid');
      const scarfTail = document.getElementById('scarfTail');
      const basketFish = document.getElementById('basketFish');

      const nearWingBody = document.getElementById('nearWingBody');
      const nearWingFeathers = document.getElementById('nearWingFeathers');
      const farWingPath = document.getElementById('farWingPath');
      const windLines = document.getElementById('windLines');
      const groundShadow = document.getElementById('groundShadow');

      // ==================== 3. KINEMATIC CONSTANTS & STATE ====================
      const CRANK_X = 375;
      const CRANK_Y = 412;
      const CRANK_R = 28;

      const HIP_BASE_X = 324;
      const HIP_BASE_Y = 272;
      const THIGH_LEN = 92;
      const SHIN_LEN = 92;

      let playing = true;
      let crankAngle = 0;
      let wheelAngle = 0;
      let chainOffset = 0;
      let speedMultiplier = 1.2;
      let targetSpeed = 1.2;
      let sprintTimer = 0;
      let honkTimer = 0;
      let blinkTimer = 0;
      let timeSec = 0;

      // Exact 2-Bone Inverse Kinematics Solver (Hip -> Knee -> Pedal)
      function solveLegIK(hx, hy, px, py, L1, L2) {
        const dx = px - hx;
        const dy = py - hy;
        let dist = Math.hypot(dx, dy);
        const maxReach = L1 + L2 - 0.5;
        if (dist > maxReach) dist = maxReach;
        if (dist < Math.abs(L1 - L2) + 0.5) dist = Math.abs(L1 - L2) + 0.5;

        // Law of cosines for distance along hip->pedal line
        const a = (L1 * L1 - L2 * L2 + dist * dist) / (2 * dist);
        const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));

        // Midpoint along hip->pedal
        const mx = hx + (a * dx) / dist;
        const my = hy + (a * dy) / dist;

        // Perpendicular vector pointing forward (+x, -y) so knee bends toward handlebars
        const kx = mx + (h * dy) / dist;
        const ky = my - (h * dx) / dist;

        return { kx, ky };
      }

      // ==================== 4. MAIN ANIMATION LOOP ====================
      let lastTime = performance.now();

      function animate(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (playing) {
          timeSec += dt;

          // Handle Sprint Boost decay
          if (sprintTimer > 0) {
            sprintTimer -= dt;
            if (sprintTimer <= 0) {
              targetSpeed = parseFloat(document.getElementById('speedSlider').value);
            }
          }
          speedMultiplier += (targetSpeed - speedMultiplier) * Math.min(1, dt * 6);

          // Advance crank and wheel angles
          const angularVel = speedMultiplier * 4.2; // rad/s
          crankAngle = (crankAngle + angularVel * dt) % (Math.PI * 2);
          wheelAngle = (wheelAngle + angularVel * 1.45 * (180 / Math.PI) * dt) % 360;
          chainOffset = (chainOffset - angularVel * 24 * dt) % 100;

          // 1. Rotate Wheels & Chainring
          rearWheel.setAttribute('transform', `translate(255, 412) rotate(${wheelAngle.toFixed(1)})`);
          frontWheel.setAttribute('transform', `translate(545, 412) rotate(${wheelAngle.toFixed(1)})`);
          chainring.setAttribute('transform', `translate(375, 412) rotate(${(crankAngle * 180 / Math.PI).toFixed(1)})`);
          bikeChain.setAttribute('stroke-dashoffset', chainOffset.toFixed(1));

          // 2. Torso Bobbing & Forward Lean with Speed
          const bobY = Math.sin(crankAngle * 2) * 4.5;
          const torsoPitch = Math.sin(crankAngle * 2 - 0.5) * 1.8 + (speedMultiplier - 1) * 2.2;
          pelicanTorsoGroup.setAttribute(
            'transform',
            `translate(0, ${bobY.toFixed(2)}) rotate(${torsoPitch.toFixed(2)}, 340, 260)`
          );

          // Ground shadow pulse
          groundShadow.setAttribute('rx', (195 - bobY * 1.5).toFixed(1));

          // Tail wagging
          const tailAngle = Math.sin(crankAngle * 2 + 1.2) * 8;
          pelicanTail.setAttribute('transform', `translate(285, 250) rotate(${tailAngle.toFixed(1)})`);

          // Scarf fluttering in the breeze
          const scarfWave = Math.sin(timeSec * 12 * speedMultiplier) * 5;
          scarfTail.setAttribute(
            'd',
            `M -18,2 Q -55,${(-8 + scarfWave).toFixed(1)} -88,${(6 - scarfWave * 0.9).toFixed(1)} Q -65,${(20 + scarfWave).toFixed(1)} -18,10 Z`
          );

          // 3. Head, Elastic Gular Pouch & Fish Jiggle
          const pouchBounce = Math.sin(crankAngle * 2 - 0.8) * (4.5 + speedMultiplier * 2);
          const headNod = Math.sin(crankAngle * 2 - 0.4) * 3.2;

          let beakOpenAngle = 0;
          let fishJumpY = 0;
          let fishRot = -12 + Math.sin(crankAngle * 2) * 8;

          if (honkTimer > 0) {
            honkTimer -= dt;
            const phase = Math.sin(honkTimer * 18);
            beakOpenAngle = -14 * Math.max(0, Math.sin(honkTimer * Math.PI));
            fishJumpY = -26 * Math.sin(Math.min(1, (1.1 - honkTimer) / 1.1) * Math.PI);
            fishRot += (1.1 - honkTimer) * 360;
            honkWaves.setAttribute('opacity', Math.abs(phase).toFixed(2));
          } else {
            honkWaves.setAttribute('opacity', '0');
          }

          pelicanHeadGroup.setAttribute(
            'transform',
            `translate(402, 96) rotate(${headNod.toFixed(2)})`
          );
          upperBeakGroup.setAttribute('transform', `rotate(${beakOpenAngle.toFixed(2)}, 8, -4)`);

          // Dynamic Bezier for the stretchy throat pouch
          const pMidY = (54 + pouchBounce - beakOpenAngle * 0.6).toFixed(1);
          const pRightY = (62 + pouchBounce * 1.15).toFixed(1);
          gularPouch.setAttribute(
            'd',
            `M 10,4 C 38,${pMidY} 98,${pRightY} 136,16 C 142,8 145,2 142,0 L 12,-2 Z`
          );

          pouchFish.setAttribute(
            'transform',
            `translate(76, ${(14 + pouchBounce * 0.35 + fishJumpY).toFixed(1)}) rotate(${fishRot.toFixed(1)})`
          );

          // Little fish in rear crate wiggling
          basketFish.setAttribute(
            'transform',
            `translate(26, 2) rotate(${(Math.sin(timeSec * 8) * 10).toFixed(1)})`
          );

          // Eye blinking every ~3.5 seconds
          blinkTimer += dt;
          if (blinkTimer > 3.6) {
            eyelid.setAttribute('ry', '7.5');
            if (blinkTimer > 3.76) {
              eyelid.setAttribute('ry', '0');
              blinkTimer = 0;
            }
          }

          // 4. Solve Near & Far Legs with Exact 2-Bone IK
          const hipX = HIP_BASE_X;
          const hipY = HIP_BASE_Y + bobY;

          // Near Pedal (Right Leg)
          const nearPx = CRANK_X + Math.cos(crankAngle) * CRANK_R;
          const nearPy = CRANK_Y + Math.sin(crankAngle) * CRANK_R;
          nearCrankArm.setAttribute('x2', nearPx.toFixed(1));
          nearCrankArm.setAttribute('y2', nearPy.toFixed(1));
          nearPedal.setAttribute('transform', `translate(${nearPx.toFixed(1)}, ${(nearPy + 3).toFixed(1)})`);

          const nearAnkleX = nearPx - 4;
          const nearAnkleY = nearPy - 3;
          const nearIK = solveLegIK(hipX, hipY, nearAnkleX, nearAnkleY, THIGH_LEN, SHIN_LEN);

          nearThigh.setAttribute('x1', hipX.toFixed(1));
          nearThigh.setAttribute('y1', hipY.toFixed(1));
          nearThigh.setAttribute('x2', nearIK.kx.toFixed(1));
          nearThigh.setAttribute('y2', nearIK.ky.toFixed(1));

          // Rotate fluffy drumstick feather cuff along thigh angle
          const thighAngleDeg = Math.atan2(nearIK.ky - hipY, nearIK.kx - hipX) * (180 / Math.PI);
          nearThighInner.setAttribute(
            'transform',
            `translate(${hipX.toFixed(1)}, ${hipY.toFixed(1)}) rotate(${thighAngleDeg.toFixed(1)})`
          );

          nearShin.setAttribute('x1', nearIK.kx.toFixed(1));
          nearShin.setAttribute('y1', nearIK.ky.toFixed(1));
          nearShin.setAttribute('x2', nearAnkleX.toFixed(1));
          nearShin.setAttribute('y2', nearAnkleY.toFixed(1));

          nearKnee.setAttribute('cx', nearIK.kx.toFixed(1));
          nearKnee.setAttribute('cy', nearIK.ky.toFixed(1));

          const nearFootTilt = Math.cos(crankAngle) * 12;
          nearFootGroup.setAttribute(
            'transform',
            `translate(${nearAnkleX.toFixed(1)}, ${nearAnkleY.toFixed(1)}) rotate(${nearFootTilt.toFixed(1)})`
          );

          // Far Pedal (Left Leg, phase + PI)
          const farAngle = crankAngle + Math.PI;
          const farPx = CRANK_X + Math.cos(farAngle) * CRANK_R;
          const farPy = CRANK_Y + Math.sin(farAngle) * CRANK_R;
          farCrankArm.setAttribute('x2', farPx.toFixed(1));
          farCrankArm.setAttribute('y2', farPy.toFixed(1));
          farPedal.setAttribute('transform', `translate(${farPx.toFixed(1)}, ${(farPy + 2).toFixed(1)})`);

          const farAnkleX = farPx - 4;
          const farAnkleY = farPy - 3;
          const farIK = solveLegIK(hipX + 4, hipY - 2, farAnkleX, farAnkleY, THIGH_LEN, SHIN_LEN);

          farThigh.setAttribute('x1', (hipX + 4).toFixed(1));
          farThigh.setAttribute('y1', (hipY - 2).toFixed(1));
          farThigh.setAttribute('x2', farIK.kx.toFixed(1));
          farThigh.setAttribute('y2', farIK.ky.toFixed(1));

          farShin.setAttribute('x1', farIK.kx.toFixed(1));
          farShin.setAttribute('y1', farIK.ky.toFixed(1));
          farShin.setAttribute('x2', farAnkleX.toFixed(1));
          farShin.setAttribute('y2', farAnkleY.toFixed(1));

          farKnee.setAttribute('cx', farIK.kx.toFixed(1));
          farKnee.setAttribute('cy', farIK.ky.toFixed(1));

          const farFootTilt = Math.cos(farAngle) * 12;
          farFoot.setAttribute(
            'transform',
            `translate(${farAnkleX.toFixed(1)}, ${farAnkleY.toFixed(1)}) rotate(${farFootTilt.toFixed(1)})`
          );

          // 5. Wing Articulation (Shoulder moves with torso bob, Wing tip stays on handlebar grip)
          const shoulderY = 204 + bobY;
          const elbowY = 262 + bobY * 0.55;
          nearWingBody.setAttribute(
            'd',
            `M 342,${shoulderY.toFixed(1)} C 325,${(232 + bobY).toFixed(1)} 355,${elbowY.toFixed(1)} 398,${elbowY.toFixed(1)} C 424,259 442,256 456,252 C 442,232 412,${(226 + bobY * 0.4).toFixed(1)} 385,${(212 + bobY * 0.7).toFixed(1)} C 368,${(203 + bobY).toFixed(1)} 352,${(196 + bobY).toFixed(1)} 342,${shoulderY.toFixed(1)} Z`
          );
          nearWingFeathers.setAttribute(
            'd',
            `M 352,${(244 + bobY * 0.7).toFixed(1)} Q 382,${(252 + bobY * 0.5).toFixed(1)} 414,246 M 364,${(254 + bobY * 0.6).toFixed(1)} Q 394,${(260 + bobY * 0.4).toFixed(1)} 428,252`
          );
          farWingPath.setAttribute(
            'd',
            `M 345,${(215 + bobY).toFixed(1)} Q 415,${(235 + bobY * 0.4).toFixed(1)} 466,248`
          );

          // 6. Scroll Parallax Scenery (Boardwalk Posts, Road Dashes, Pebbles, Clouds)
          const groundSpeed = speedMultiplier * 210 * dt;

          posts.forEach((p) => {
            p.x -= groundSpeed * 0.65;
            if (p.x < -20) p.x += postCount * postSpacing;
            p.el.setAttribute('x', p.x.toFixed(1));
          });

          dashes.forEach((d) => {
            d.x -= groundSpeed;
            if (d.x < -70) d.x += dashCount * dashSpacing;
            d.el.setAttribute('x', d.x.toFixed(1));
          });

          pebbles.forEach((p) => {
            p.x -= groundSpeed * 1.08;
            if (p.x < -10) p.x += 940;
            p.el.setAttribute('cx', p.x.toFixed(1));
          });

          clouds.forEach((c) => {
            c.x -= groundSpeed * c.speed * 0.15;
            if (c.x < -140) c.x = 940;
            c.el.setAttribute(
              'transform',
              `translate(${c.x.toFixed(1)}, ${c.y}) scale(${c.scale})`
            );
          });

          // Wind streaks visibility when sprinting/fast
          const windAlpha = Math.max(0, Math.min(0.85, (speedMultiplier - 1.5) * 0.7));
          windLines.setAttribute('opacity', windAlpha.toFixed(2));
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);

      // ==================== 5. UI CONTROLS & INTERACTION ====================
      const togglePlayBtn = document.getElementById('togglePlayBtn');
      const playIcon = document.getElementById('playIcon');
      const playText = document.getElementById('playText');
      const sprintBtn = document.getElementById('sprintBtn');
      const honkBtn = document.getElementById('honkBtn');
      const themeBtn = document.getElementById('themeBtn');
      const themeName = document.getElementById('themeName');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const sceneSvg = document.getElementById('scene');

      togglePlayBtn.addEventListener('click', () => {
        playing = !playing;
        playIcon.textContent = playing ? '⏸' : '▶️';
        playText.textContent = playing ? '暂停' : '继续';
      });

      speedSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        targetSpeed = val;
        sprintTimer = 0;
        speedValue.textContent = `${val.toFixed(1)}x`;
      });

      sprintBtn.addEventListener('click', () => {
        if (!playing) togglePlayBtn.click();
        targetSpeed = 2.8;
        sprintTimer = 2.6;
        honkTimer = 1.1;
        speedValue.textContent = '2.8x';
      });

      function triggerHonk() {
        if (!playing) togglePlayBtn.click();
        honkTimer = 1.1;
      }

      honkBtn.addEventListener('click', triggerHonk);
      sceneSvg.addEventListener('click', triggerHonk);

      // Theme Cycling: Day -> Golden Sunset -> Starry Night
      const themes = [
        {
          name: '晴朗白昼',
          sky: ['#38bdf8', '#bae6fd', '#fef9c3'],
          sea: ['#0284c7', '#0369a1'],
          sunCore: '#fde047',
          stars: 0,
          beam: 0,
        },
        {
          name: '落日余晖',
          sky: ['#7c2d12', '#f97316', '#fde047'],
          sea: ['#1e3a8a', '#7c2d12'],
          sunCore: '#fb923c',
          stars: 0.25,
          beam: 0.35,
        },
        {
          name: '星夜巡航',
          sky: ['#0f172a', '#1e1b4b', '#312e81'],
          sea: ['#090d16', '#1e293b'],
          sunCore: '#f8fafc',
          stars: 0.95,
          beam: 1,
        },
      ];
      let currentTheme = 0;

      themeBtn.addEventListener('click', () => {
        currentTheme = (currentTheme + 1) % themes.length;
        const t = themes[currentTheme];
        themeName.textContent = t.name;

        document.getElementById('skyStop1').setAttribute('stop-color', t.sky[0]);
        document.getElementById('skyStop2').setAttribute('stop-color', t.sky[1]);
        document.getElementById('skyStop3').setAttribute('stop-color', t.sky[2]);
        document.getElementById('seaStop1').setAttribute('stop-color', t.sea[0]);
        document.getElementById('seaStop2').setAttribute('stop-color', t.sea[1]);
        document.getElementById('sunCore').setAttribute('fill', t.sunCore);
        document.getElementById('starsGroup').setAttribute('opacity', t.stars);
        document.getElementById('headlightBeam').setAttribute('opacity', t.beam);
        document.getElementById('lighthouseBeam').setAttribute('opacity', t.beam * 0.7);
      });
    })();
  </script>
</body>
</html>
