<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑行记 · SVG 动画</title>
<style>
:root{color-scheme:light;--ink:#163b46;--muted:#52747b;--paper:#f4fbf7;--teal:#157c80;--orange:#ff9d55}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#fff 5%,#effaf4 65%,#e2f3ed);font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}.stage{width:min(100%,1000px);background:#fff;border:1px solid #d9ebe5;border-radius:28px;overflow:hidden;box-shadow:0 24px 70px #315f5417}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 30px 14px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5e9991;font-weight:800}.top h1{font-size:clamp(22px,4vw,34px);margin:5px 0 0;letter-spacing:-.04em}.badge{background:#e9f6ef;color:#347b69;padding:9px 13px;border-radius:99px;font-size:13px;font-weight:700}.scene{padding:0 18px}.scene svg{display:block;width:100%;height:auto;border-radius:20px;background:#bde9e5}.controls{display:flex;align-items:center;gap:16px;padding:18px 30px 24px}.toggle{border:0;border-radius:999px;background:var(--ink);color:white;font:700 14px system-ui,sans-serif;padding:12px 18px;cursor:pointer;min-width:112px}.toggle:hover{background:#245965}.toggle:focus-visible,input:focus-visible{outline:3px solid #ffb367;outline-offset:3px}.speed{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:650;margin-left:auto}.speed input{accent-color:var(--teal);width:130px}.speed output{min-width:34px;color:var(--ink);font-variant-numeric:tabular-nums}.hint{color:#71908f;font-size:12px}.scene .wheel{transform-box:fill-box;transform-origin:center}.scene .leg{transform-box:fill-box;transform-origin:top center}.scene .pedal{transform-box:fill-box;transform-origin:center}.scene .rider{transform-box:fill-box;transform-origin:50% 90%}.scene .scarf{transform-box:fill-box;transform-origin:left center}.scene .cloud{animation:cloud-drift 30s linear infinite}.scene .cloud.c2{animation-duration:40s;animation-delay:-17s}.scene .water{animation:water 2.8s ease-in-out infinite alternate}.scene .water.w2{animation-delay:-1.4s}@keyframes cloud-drift{from{transform:translateX(-35px)}to{transform:translateX(40px)}}@keyframes water{from{transform:translateX(-12px);opacity:.42}to{transform:translateX(12px);opacity:.8}}@media(max-width:600px){body{padding:10px}.stage{border-radius:20px}.top{padding:18px 18px 10px}.badge{font-size:11px;padding:7px 9px}.scene{padding:0 8px}.controls{padding:14px 17px 18px;gap:10px;flex-wrap:wrap}.toggle{min-width:100px;padding:11px 15px}.speed{margin-left:auto}.speed input{width:90px}.hint{width:100%;padding-left:2px}}
@media(prefers-reduced-motion:reduce){.scene .cloud,.scene .water{animation:none}}
</style>
</head>
<body><main class="stage"><header class="top"><div><div class="eyebrow">A little seaside adventure</div><h1>鹈鹕骑行记</h1></div><div class="badge">☀ 海风正好</div></header>
<div class="scene"><svg id="scene" viewBox="0 0 960 520" role="img" aria-labelledby="svgtitle svgdesc" xmlns="http://www.w3.org/2000/svg">
<title id="svgtitle">鹈鹕骑着自行车沿海岸前行</title><desc id="svgdesc">一只戴着蓝色头盔、围着橙色围巾的鹈鹕，骑着绿色自行车经过海边。车轮、踏板、双腿和围巾随着骑行动作转动，背景云朵和海面轻轻移动。</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#a8e0df"/><stop offset="1" stop-color="#d7f0df"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#52bcb3"/><stop offset="1" stop-color="#278b91"/></linearGradient><linearGradient id="hill" x2="0" y2="1"><stop stop-color="#83c7a0"/><stop offset="1" stop-color="#559e82"/></linearGradient><filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8"><feGaussianBlur stdDeviation="7"/></filter></defs>
<rect width="960" height="520" fill="url(#sky)"/><circle cx="789" cy="93" r="43" fill="#fff0b7"/><circle cx="789" cy="93" r="57" fill="#fff0b7" opacity=".16"/>
<g class="cloud" fill="#fff" opacity=".82"><ellipse cx="181" cy="102" rx="61" ry="20"/><circle cx="148" cy="91" r="21"/><circle cx="180" cy="79" r="29"/><circle cx="211" cy="94" r="20"/></g><g class="cloud c2" fill="#fff" opacity=".67"><ellipse cx="553" cy="149" rx="48" ry="15"/><circle cx="532" cy="140" r="17"/><circle cx="557" cy="130" r="23"/><circle cx="580" cy="143" r="16"/></g>
<path d="M0 287 Q135 212 250 268T495 258T740 249T960 252V366H0Z" fill="url(#hill)"/><path d="M0 323 Q144 293 283 323T544 313T790 314T960 305V520H0Z" fill="url(#sea)"/><path d="M0 319 Q124 290 259 321T520 312T781 316T960 300" fill="none" stroke="#d6f0d2" stroke-width="5" opacity=".8"/>
<g fill="none" stroke="#bff2dc" stroke-width="4" stroke-linecap="round"><path class="water" d="M67 386q34-8 68 0m579 19q43-10 86 0m-534 40q26-7 52 0m169-61q32-7 64 0m272 79q25-6 50 0"/><path class="water w2" d="M185 422q30-8 60 0m537-72q38-9 76 0M381 474q24-6 48 0m-348-59q24-6 48 0"/></g>
<ellipse cx="472" cy="433" rx="250" ry="23" fill="#174c50" opacity=".15" filter="url(#shadow)"/>
<!-- bicycle -->
<g fill="none" stroke="#174f54" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><circle class="wheel" cx="324" cy="380" r="78" stroke="#163e48" stroke-width="5"/><circle class="wheel" cx="631" cy="380" r="78" stroke="#163e48" stroke-width="5"/><circle cx="324" cy="380" r="5" fill="#163e48"/><circle cx="631" cy="380" r="5" fill="#163e48"/><path d="M324 380 421 380 369 288 324 380M421 380 500 287 369 288M500 287 631 380M500 287l38-5m-174 6-22-16"/><path d="M483 282q10-15 25-13"/></g><g fill="none" stroke="#6da6a0" stroke-width="2" opacity=".55"><circle cx="324" cy="380" r="69"/><circle cx="631" cy="380" r="69"/></g>
<g class="pedal"><circle cx="421" cy="380" r="17" fill="#ffbd63" stroke="#163e48" stroke-width="5"/><path d="M421 380l-29-29m29 29 34 28" stroke="#163e48" stroke-width="5" stroke-linecap="round"/><path d="M378 350h-27m107 58h28" stroke="#ffbd63" stroke-width="7" stroke-linecap="round"/></g>
<!-- pelican -->
<g class="rider"><path class="scarf" d="M455 192q-36 1-57 25 34-7 57 6l-14 31q37-13 51-42" fill="#f1844d" stroke="#d9643e" stroke-width="4" stroke-linejoin="round"/>
<!-- body --> <ellipse cx="468" cy="253" rx="57" ry="75" transform="rotate(-17 468 253)" fill="#fff8e8" stroke="#426a66" stroke-width="4"/><path d="M426 270q40 24 88 0" fill="none" stroke="#e6ddc8" stroke-width="5"/>
<!-- neck and head --> <path d="M457 221q-10-39 9-64 16-20 40-13 23 6 24 29 2 20-15 28-20 9-37-2l-4 39" fill="#fff8e8" stroke="#426a66" stroke-width="4" stroke-linecap="round"/>
<!-- pelican bill pouch --> <path d="M511 178q37-7 73 4 10 4 7 11-2 6-13 7l-40 15q-18 7-28-6" fill="#f6a849" stroke="#965f36" stroke-width="4" stroke-linejoin="round"/><path d="M521 190q26-5 54 0" fill="none" stroke="#dc8140" stroke-width="3"/>
<circle cx="507" cy="166" r="4.5" fill="#173e47"/><path d="M484 147q23-23 50-2l-2 12q-23-10-47 3z" fill="#368fa0" stroke="#246674" stroke-width="4"/><path d="M492 147q17-9 34-3" fill="none" stroke="#b5e9e1" stroke-width="4" stroke-linecap="round"/>
<!-- wing --> <path d="M444 235q22-19 49-2 14 10 11 29-24 16-55 4-12-6-5-31" fill="#eee6d5" stroke="#b9b09e" stroke-width="3"/><path d="M450 247q17 11 35 6m-31 1q13 10 28 7" fill="none" stroke="#c6bca8" stroke-width="3" stroke-linecap="round"/>
<!-- arms --> <path d="M445 222q-5 17-18 36l-13 23m71-62q17 14 26 33l19 28" fill="none" stroke="#f3b75e" stroke-width="9" stroke-linecap="round"/><circle cx="414" cy="282" r="7" fill="#fff4d7" stroke="#426a66" stroke-width="3"/><circle cx="530" cy="280" r="7" fill="#fff4d7" stroke="#426a66" stroke-width="3"/>
<!-- legs --> <path class="leg leg-a" d="M453 301q-2 26 20 42l-49 37" fill="none" stroke="#f0ac59" stroke-width="11" stroke-linecap="round"/><path class="leg leg-b" d="M487 301q14 22 0 42l-31 37" fill="none" stroke="#e99e4d" stroke-width="11" stroke-linecap="round"/><path d="M424 378q-14-7-25 1-6 7 2 11l29 1m29-10q-14-6-24 3-4 8 4 10l29-1" fill="#f6bb63" stroke="#9e7041" stroke-width="3" stroke-linecap="round"/>

</svg></div>
<div class="controls"><button class="toggle" id="toggle" type="button" aria-pressed="false" aria-label="暂停动画">❚❚　暂停</button><label class="speed" for="speed">骑行速度<input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="动画速度"><output id="speedOut" for="speed">1.0×</output></label><span class="hint">陪小鹈鹕吹吹海风</span></div></main>
<script>
(()=>{const scene=document.getElementById('scene'),button=document.getElementById('toggle'),slider=document.getElementById('speed'),out=document.getElementById('speedOut'),legs=[...document.querySelectorAll('.leg')],wheels=[...document.querySelectorAll('.wheel')],pedal=document.querySelector('.pedal'),rider=document.querySelector('.rider'),scarf=document.querySelector('.scarf');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,last=0,phase=0;function paint(t){if(!paused){if(last)phase+=(t-last)*.006*speed;last=t;const a=phase;wheels.forEach(w=>w.style.transform=`rotate(${a*65}deg)`);pedal.style.transform=`rotate(${a*65}deg)`;legs[0].style.transform=`rotate(${Math.sin(a*2)*19}deg)`;legs[1].style.transform=`rotate(${Math.sin(a*2+Math.PI)*19}deg)`;rider.style.transform=`translateY(${Math.sin(a*2)*2}px) rotate(${Math.sin(a)*.7}deg)`;scarf.style.transform=`rotate(${Math.sin(a*2.1)*8}deg)`;}requestAnimationFrame(paint)}requestAnimationFrame(paint);function sync(){button.setAttribute('aria-pressed',String(paused));button.setAttribute('aria-label',paused?'继续动画':'暂停动画');button.textContent=paused?'▶　继续':'❚❚　暂停';scene.classList.toggle('motion-paused',paused);if(paused)last=0}button.addEventListener('click',()=>{paused=!paused;sync()});slider.addEventListener('input',()=>{speed=Number(slider.value);out.value=`${speed.toFixed(1)}×`;out.textContent=out.value});if(paused)sync();})();
</script></body></html>
