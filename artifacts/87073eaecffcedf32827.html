<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root {
    --sky-top: #1b2a4a;
    --sky-mid: #4a6fa5;
    --sky-low: #e8a87c;
    --sun: #ffd166;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #11151f;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 120%, #26355c 0%, #0d1220 60%, #070a12 100%);
  }

  .poster {
    position: relative;
    width: min(1200px, 96vw);
    aspect-ratio: 16 / 9;
    border-radius: 22px;
    overflow: hidden;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.75),
      0 0 0 1px rgba(255, 255, 255, 0.06) inset,
      0 0 120px rgba(74, 111, 165, 0.18);
  }

  svg.scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  .title {
    position: absolute;
    left: 3.2%;
    top: 5.5%;
    z-index: 10;
    color: #fff;
    pointer-events: none;
    text-shadow: 0 3px 18px rgba(0, 0, 0, 0.55);
    animation: titleIn 1.6s cubic-bezier(.2,.7,.2,1) both;
  }
  .title h1 {
    margin: 0;
    font-size: clamp(16px, 2.6vw, 34px);
    letter-spacing: 0.06em;
    font-weight: 800;
  }
  .title p {
    margin: 6px 0 0;
    font-size: clamp(9px, 1vw, 14px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    opacity: 0.72;
  }

  @keyframes titleIn {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 场景渐变 ---------- */
  .sky-night  { stop-color: #16233d; }
  .sky-mid    { stop-color: #3f5f92; }
  .sky-warm   { stop-color: #f0a97a; }

  /* ---------- 太阳 ---------- */
  .sun-glow {
    transform-origin: 900px 300px;
    animation: sunPulse 5.5s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 0.85; transform: scale(1.06); }
  }

  /* ---------- 云 ---------- */
  .cloud { animation: cloudDrift linear infinite; }
  @keyframes cloudDrift {
    from { transform: translateX(-260px); }
    to   { transform: translateX(1460px); }
  }

  /* ---------- 山 ---------- */
  .hills-far  { animation: hillsSlide 60s linear infinite; }
  .hills-near { animation: hillsSlide 34s linear infinite; }
  @keyframes hillsSlide {
    from { transform: translateX(0); }
    to   { transform: translateX(-600px); }
  }

  /* ---------- 远处树 ---------- */
  .treeline { animation: hillsSlide 16s linear infinite; }
  @keyframes treelineSlide {
    from { transform: translateX(0); }
    to   { transform: translateX(-500px); }
  }

  /* ---------- 路面 ---------- */
  .road-lines {
    animation: roadScroll 1.1s linear infinite;
  }
  @keyframes roadScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-120px); }
  }

  /* ---------- 自行车组（上下颠簸） ---------- */
  .rider-rig {
    animation: bob 0.62s ease-in-out infinite;
    transform-origin: 600px 470px;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.2px); }
  }

  /* ---------- 车轮 ---------- */
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.72s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ---------- 曲柄 ---------- */
  .crank-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 0.72s linear infinite;
  }

  /* ---------- 腿部（由 JS 驱动骨骨） ---------- */

  /* ---------- 身体起伏 ---------- */
  .pelican-body {
    animation: bodyBob 0.62s ease-in-out infinite;
    transform-origin: 600px 300px;
  }
  @keyframes bodyBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-3px) rotate(-0.6deg); }
  }

  /* ---------- 翅膀拍打（轻微） ---------- */
  .wing {
    transform-box: fill-box;
    transform-origin: 78% 22%;
    animation: wingFlap 1.24s ease-in-out infinite;
  }
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    45%      { transform: rotate(-4deg); }
    70%      { transform: rotate(2deg); }
  }

  /* ---------- 喉囊抖动 ---------- */
  .pouch {
    transform-box: fill-box;
    transform-origin: 30% 0%;
    animation: pouchJiggle 2.3s ease-in-out infinite;
  }
  @keyframes pouchJiggle {
    0%, 100% { transform: scaleY(1) rotate(0deg); }
    30%      { transform: scaleY(1.07) rotate(-1.2deg); }
    60%      { transform: scaleY(0.96) rotate(0.6deg); }
  }

  /* ---------- 头部微动 ---------- */
  .head {
    transform-box: fill-box;
    transform-origin: 20% 90%;
    animation: headBob 1.86s ease-in-out infinite;
  }
  @keyframes headBob {
    0%, 100% { transform: rotate(-1.4deg); }
    50%      { transform: rotate(1.6deg); }
  }

  /* ---------- 眨眼 ---------- */
  .eyelid {
    transform-box: fill-box;
    transform-origin: center top;
    animation: blink 4.6s infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    94%, 97%      { transform: scaleY(1); }
  }

  /* ---------- 围巾飘动 ---------- */
  .scarf {
    transform-box: fill-box;
    transform-origin: 100% 20%;
    animation: scarfWave 1.15s ease-in-out infinite;
  }
  @keyframes scarfWave {
    0%, 100% { transform: rotate(0deg) skewY(0deg); }
    35%      { transform: rotate(-5deg) skewY(4deg); }
    65%      { transform: rotate(3deg) skewY(-3deg); }
  }

  /* ---------- 速度线 ---------- */
  .speed-lines { animation: speedFade 0.9s linear infinite; }
  @keyframes speedFade {
    0%   { opacity: 0; transform: translateX(30px); }
    35%  { opacity: 0.55; }
    100% { opacity: 0; transform: translateX(-70px); }
  }

  /* ---------- 前景草 ---------- */
  .grass-front { animation: grassMove 3.4s linear infinite; }
  @keyframes grassMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-240px); }
  }

  /* ---------- 尘土 ---------- */
  .dust {
    transform-box: fill-box;
    transform-origin: center;
    animation: dustPuff 1.05s ease-out infinite;
  }
  .dust:nth-child(2) { animation-delay: 0.35s; }
  .dust:nth-child(3) { animation-delay: 0.7s; }
  @keyframes dustPuff {
    0%   { opacity: 0.0; transform: translate(0, 0) scale(0.35); }
    25%  { opacity: 0.5; }
    100% { opacity: 0; transform: translate(-70px, 16px) scale(1.5); }
  }

  /* ---------- 影子 ---------- */
  .shadow {
    transform-box: fill-box;
    transform-origin: center;
    animation: shadowPulse 0.62s ease-in-out infinite;
  }
  @keyframes shadowPulse {
    0%, 100% { transform: scale(1); opacity: 0.32; }
    50%      { transform: scale(0.93); opacity: 0.26; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="poster">
    <div class="title">
      <h1>鹈鹕骑行 · Pelican Ride</h1>
      <p>SVG 2D Animation</p>
    </div>

    <svg class="scene" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="一只鹈鹕骑着自行车穿过黄昏的原野">
      <defs>
        <!-- 天空 -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   class="sky-night"/>
          <stop offset="42%"  class="sky-mid"/>
          <stop offset="76%"  stop-color="#f6c9a0"/>
          <stop offset="100%" class="sky-warm"/>
        </linearGradient>

        <!-- 太阳光晕 -->
        <radialGradient id="sunGrad">
          <stop offset="0%"   stop-color="#fff6d8" stop-opacity="1"/>
          <stop offset="45%"  stop-color="#ffd166" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
        </radialGradient>

        <!-- 山 -->
        <linearGradient id="hillFarGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#5b6f9e"/>
          <stop offset="100%" stop-color="#37456b"/>
        </linearGradient>
        <linearGradient id="hillNearGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#3c5a72"/>
          <stop offset="100%" stop-color="#243a4c"/>
        </linearGradient>

        <!-- 草地 -->
        <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#2b4a3f"/>
          <stop offset="100%" stop-color="#16261f"/>
        </linearGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#4a4750"/>
          <stop offset="100%" stop-color="#2a2831"/>
        </linearGradient>

        <!-- 鹈鹕身体渐变 -->
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="55%"  stop-color="#f1eee8"/>
          <stop offset="100%" stop-color="#d9d3c8"/>
        </linearGradient>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#e7e2d8"/>
          <stop offset="60%"  stop-color="#c8c0b3"/>
          <stop offset="100%" stop-color="#9e968a"/>
        </linearGradient>

        <!-- 喙 -->
        <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#ffcf5c"/>
          <stop offset="100%" stop-color="#e08a2e"/>
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffbe5c"/>
          <stop offset="100%" stop-color="#e8743a"/>
        </linearGradient>

        <!-- 车架渐变 -->
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#5ad1c8"/>
          <stop offset="50%"  stop-color="#2fa7a0"/>
          <stop offset="100%" stop-color="#1c7d80"/>
        </linearGradient>

        <!-- 金属 -->
        <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#e8ecf2"/>
          <stop offset="50%"  stop-color="#b6bec9"/>
          <stop offset="100%" stop-color="#7e8794"/>
        </linearGradient>

        <!-- 速度线渐变 -->
        <linearGradient id="speedGrad" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
        </linearGradient>

        <!-- 光晕滤镜 -->
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="9" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="tinyGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="2.2" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3"/>
        </filter>

        <!-- 车轮辐条裁剪 -->
        <clipPath id="wheelClipL"><circle cx="440" cy="470" r="78"/></clipPath>
        <clipPath id="wheelClipR"><circle cx="760" cy="470" r="78"/></clipPath>

        <!-- 星星 -->
        <g id="starShape">
          <path d="M0,-4 L1.1,-1.2 L4,0 L1.1,1.2 L0,4 L-1.1,1.2 L-4,0 L-1.1,-1.2 Z" fill="#fff"/>
        </g>
      </defs>

      <!-- ==================== 天空 ==================== -->
      <rect x="0" y="0" width="1200" height="675" fill="url(#skyGrad)"/>

      <!-- 星星 -->
      <g opacity="0.8">
        <use href="#starShape" x="120" y="70"  class="twinkle" style="animation: sunPulse 3.1s ease-in-out infinite"/>
        <use href="#starShape" x="280" y="46"  opacity="0.7"/>
        <use href="#starShape" x="430" y="90"  opacity="0.55"/>
        <use href="#starShape" x="610" y="52"  opacity="0.65"/>
        <use href="#starShape" x="760" y="110" opacity="0.45"/>
        <use href="#starShape" x="980" y="60"  opacity="0.75"/>
        <use href="#starShape" x="1100" y="120" opacity="0.5"/>
        <use href="#starShape" x="180" y="160" opacity="0.35"/>
        <use href="#starShape" x="520" y="150" opacity="0.4"/>
        <use href="#starShape" x="880" y="170" opacity="0.3"/>
      </g>

      <!-- 月亮 -->
      <g opacity="0.9">
        <circle cx="180" cy="120" r="30" fill="#fdf6e3" opacity="0.92" filter="url(#tinyGlow)"/>
        <circle cx="194" cy="112" r="26" fill="#22314f" opacity="0.85"/>
      </g>

      <!-- 太阳 -->
      <g class="sun-glow">
        <circle cx="900" cy="300" r="150" fill="url(#sunGrad)"/>
        <circle cx="900" cy="300" r="52" fill="#ffe6a3" filter="url(#softGlow)"/>
      </g>

      <!-- ==================== 云 ==================== -->
      <g opacity="0.28" fill="#ffffff">
        <g class="cloud" style="animation-duration: 42s; animation-delay: -8s;">
          <ellipse cx="200" cy="150" rx="70" ry="20"/>
          <ellipse cx="240" cy="136" rx="46" ry="24"/>
          <ellipse cx="160" cy="140" rx="40" ry="17"/>
        </g>
        <g class="cloud" style="animation-duration: 58s; animation-delay: -30s;">
          <ellipse cx="620" cy="110" rx="90" ry="22"/>
          <ellipse cx="660" cy="94" rx="52" ry="26"/>
          <ellipse cx="570" cy="98" rx="46" ry="18"/>
        </g>
        <g class="cloud" style="animation-duration: 50s; animation-delay: -18s;" opacity="0.7">
          <ellipse cx="1000" cy="180" rx="60" ry="16"/>
          <ellipse cx="1030" cy="168" rx="38" ry="18"/>
        </g>
      </g>

      <!-- ==================== 远山 ==================== -->
      <g class="hills-far" opacity="0.95">
        <path d="M-600,430 L-420,330 L-280,392 L-120,300 L40,400 L200,320 L380,410 L540,340 L700,420 L860,350 L1020,420 L1200,340 L1380,420 L1560,350 L1800,430 L1800,520 L-600,520 Z"
              fill="url(#hillFarGrad)"/>
      </g>

      <!-- 山体受光面 -->
      <g class="hills-far" opacity="0.35">
        <path d="M-120,300 L40,400 L200,320 L380,410 L540,340 L700,420 L860,350 L1020,420 L1200,340 L1380,420 L1560,350 L1800,430 L1800,520 L-600,520 L-600,430 L-420,330 L-280,392 Z"
              fill="#8fa6cc"/>
      </g>

      <!-- ==================== 近山 ==================== -->
      <g class="hills-near">
        <path d="M-600,470 L-460,392 L-320,450 L-160,370 L0,462 L160,398 L340,470 L500,404 L660,472 L820,410 L980,474 L1140,404 L1300,474 L1460,410 L1800,470 L1800,540 L-600,540 Z"
              fill="url(#hillNearGrad)"/>
      </g>

      <!-- ==================== 地平线树线 ==================== -->
      <g class="treeline" fill="#1b2f2a" opacity="0.9">
        <g id="treeRow">
          <!-- 重复的树丛 -->
          <path d="M0,500 L18,462 L36,500 Z M30,500 L52,452 L74,500 Z M70,500 L88,470 L106,500 Z M100,500 L124,448 L148,500 Z M146,500 L164,466 L182,500 Z"/>
          <path d="M180,500 L198,462 L216,500 Z M210,500 L232,452 L254,500 Z M250,500 L268,470 L286,500 Z M280,500 L304,448 L328,500 Z M326,500 L344,466 L362,500 Z"/>
          <path d="M360,500 L378,462 L396,500 Z M390,500 L412,452 L434,500 Z M430,500 L448,470 L466,500 Z M460,500 L484,448 L508,500 Z M506,500 L524,466 L542,500 Z"/>
          <path d="M540,500 L558,462 L576,500 Z M570,500 L592,452 L614,500 Z M610,500 L628,470 L646,500 Z M640,500 L664,448 L688,500 Z M686,500 L704,466 L722,500 Z"/>
          <path d="M720,500 L738,462 L756,500 Z M750,500 L772,452 L794,500 Z M790,500 L808,470 L826,500 Z M820,500 L844,448 L868,500 Z M866,500 L884,466 L902,500 Z"/>
          <path d="M900,500 L918,462 L936,500 Z M930,500 L952,452 L974,500 Z M970,500 L988,470 L1006,500 Z M1000,500 L1024,448 L1048,500 Z M1046,500 L1064,466 L1082,500 Z"/>
          <path d="M1080,500 L1098,462 L1116,500 Z M1110,500 L1132,452 L1154,500 Z M1150,500 L1168,470 L1186,500 Z M1180,500 L1204,448 L1228,500 Z M1226,500 L1244,466 L1262,500 Z"/>
          <path d="M1260,500 L1278,462 L1296,500 Z M1290,500 L1312,452 L1334,500 Z M1330,500 L1348,470 L1366,500 Z M1360,500 L1384,448 L1408,500 Z M1406,500 L1424,466 L1442,500 Z"/>
          <path d="M1440,500 L1458,462 L1476,500 Z M1470,500 L1492,452 L1514,500 Z M1510,500 L1528,470 L1546,500 Z M1540,500 L1564,448 L1588,500 Z M1586,500 L1604,466 L1622,500 Z"/>
        </g>
      </g>

      <!-- ==================== 地面 ==================== -->
      <rect x="0" y="498" width="1200" height="177" fill="url(#groundGrad)"/>

      <!-- 田野纹理 -->
      <g opacity="0.25" stroke="#7fae8f" stroke-width="2" fill="none">
        <path d="M0,560 Q150,548 300,560 T600,560 T900,560 T1200,560"/>
        <path d="M0,600 Q150,588 300,600 T600,600 T900,600 T1200,600"/>
        <path d="M0,640 Q150,628 300,640 T600,640 T900,640 T1200,640"/>
      </g>

      <!-- 路面 -->
      <rect x="0" y="590" width="1200" height="85" fill="url(#roadGrad)"/>
      <rect x="0" y="590" width="1200" height="4" fill="#6b6570" opacity="0.55"/>
      <g class="road-lines" opacity="0.55">
        <g fill="#e9e2d0">
          <rect x="0"   y="630" width="70" height="6" rx="3"/>
          <rect x="120" y="630" width="70" height="6" rx="3"/>
          <rect x="240" y="630" width="70" height="6" rx="3"/>
          <rect x="360" y="630" width="70" height="6" rx="3"/>
          <rect x="480" y="630" width="70" height="6" rx="3"/>
          <rect x="600" y="630" width="70" height="6" rx="3"/>
          <rect x="720" y="630" width="70" height="6" rx="3"/>
          <rect x="840" y="630" width="70" height="6" rx="3"/>
          <rect x="960" y="630" width="70" height="6" rx="3"/>
          <rect x="1080" y="630" width="70" height="6" rx="3"/>
          <rect x="1200" y="630" width="70" height="6" rx="3"/>
          <rect x="1320" y="630" width="70" height="6" rx="3"/>
        </g>
      </g>

      <!-- ==================== 影子 ==================== -->
      <ellipse class="shadow" cx="600" cy="556" rx="190" ry="16" fill="#000" opacity="0.32" filter="url(#blurSoft)"/>

      <!-- ==================== 尘土 ==================== -->
      <g fill="#cbb89a">
        <circle class="dust" cx="410" cy="540" r="7" opacity="0.45"/>
        <circle class="dust" cx="400" cy="546" r="5" opacity="0.4"/>
        <circle class="dust" cx="418" cy="534" r="4" opacity="0.35"/>
      </g>

      <!-- ==================== 速度线 ==================== -->
      <g class="speed-lines" stroke="url(#speedGrad)" stroke-width="3.5" stroke-linecap="round">
        <line x1="330" y1="330" x2="430" y2="330"/>
        <line x1="300" y1="392" x2="420" y2="392"/>
        <line x1="340" y1="452" x2="440" y2="452"/>
        <line x1="310" y1="512" x2="400" y2="512"/>
      </g>

      <!-- ==================== 鹈鹕 + 自行车 ==================== -->
      <g class="rider-rig">

        <!-- ---------- 后轮 ---------- -->
        <g>
          <circle cx="440" cy="470" r="86" fill="none" stroke="#1b1d22" stroke-width="13"/>
          <circle cx="440" cy="470" r="86" fill="none" stroke="#3a3f4a" stroke-width="3" opacity="0.7"/>
          <!-- 轮圈 -->
          <circle cx="440" cy="470" r="74" fill="none" stroke="url(#metalGrad)" stroke-width="6"/>
          <circle cx="440" cy="470" r="70" fill="none" stroke="#585f6b" stroke-width="2"/>
          <!-- 辐条（旋转） -->
          <g class="wheel-spin">
            <g stroke="#c3cad4" stroke-width="2.2" opacity="0.95">
              <line x1="440" y1="400" x2="440" y2="540"/>
              <line x1="370" y1="470" x2="510" y2="470"/>
              <line x1="390" y1="420" x2="490" y2="520"/>
              <line x1="490" y1="420" x2="390" y2="520"/>
              <line x1="378" y1="440" x2="502" y2="500" opacity="0.7"/>
              <line x1="502" y1="440" x2="378" y2="500" opacity="0.7"/>
              <line x1="420" y1="404" x2="460" y2="536" opacity="0.7"/>
              <line x1="460" y1="404" x2="420" y2="536" opacity="0.7"/>
            </g>
            <!-- 花鼓 -->
            <circle cx="440" cy="470" r="11" fill="#8d97a5" stroke="#5c6572" stroke-width="2"/>
            <circle cx="440" cy="470" r="4" fill="#e9eef5"/>
          </g>
        </g>

        <!-- ---------- 前轮 ---------- -->

<script>
  // 让云的起始位置随机化，避免所有云同步
  document.querySelectorAll('.cloud').forEach((cloud) => {
    const dur = 38 + Math.random() * 24;
    const delay = -(Math.random() * dur);
    cloud.style.animationDuration = dur + 's';
    cloud.style.animationDelay = delay + 's';
  });

  // ---------- 腿部骨骼与脚踏同步 ----------
  const BB = { x: 610, y: 470 };      // 五通（曲柄中心）
  const CRANK = 36;                    // 曲柄长度
  const RPM = 60 / 0.72;               // 与 .crank-spin 动画周期一致（约 83.3 rpm）
  const THIGH = 62, SHIN = 70;         // 大腿/小腿长度

  const near = {
    thigh: document.getElementById('legNearThigh'),
    shin:  document.getElementById('legNearShin'),
    foot:  document.getElementById('legNearFoot'),
    hip:   { x: 612, y: 372 },
    kneeDot: document.getElementById('kneeNear')
  };
  const far = {
    thigh: document.getElementById('legFarThigh'),
    shin:  document.getElementById('legFarShin'),
    foot:  document.getElementById('legFarFoot'),
    hip:   { x: 584, y: 368 }
  };

  const chain = document.getElementById('chain');
  const RAD = Math.PI / 180;

  // 两骨 IK：已知髂部与脚踏点，求膝关节点（膝盖朝向向前下）
  function solveKnee(hip, target, thigh, shin, forward) {
    let dx = target.x - hip.x, dy = target.y - hip.y;
    let dist = Math.hypot(dx, dy);
    const maxR = thigh + shin - 0.5;
    const minR = Math.abs(thigh - shin) + 0.5;
    dist = Math.max(minR, Math.min(maxR, dist));
    const baseAng = Math.atan2(dy, dx);
    const cosA = (dist * dist + thigh * thigh - shin * shin) / (2 * dist * thigh);
    const A = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const ang = baseAng + forward * A;
    return { x: hip.x + Math.cos(ang) * thigh, y: hip.y + Math.sin(ang) * thigh };
  }

  function driveLeg(leg, phase, back) {
    const a = phase * RAD;
    // 脚踏位置（与 CSS 曲柄旋转同步：0° 时在上方）
    const pedal = {
      x: BB.x + Math.sin(a) * CRANK,
      y: BB.y - Math.cos(a) * CRANK
    };
    const knee = solveKnee(leg.hip, pedal, THIGH, SHIN, back ? -1 : 1);

    leg.thigh.setAttribute('x1', leg.hip.x);
    leg.thigh.setAttribute('y1', leg.hip.y);
    leg.thigh.setAttribute('x2', knee.x);
    leg.thigh.setAttribute('y2', knee.y);
    // 髋关节圆点（藏进身体）
    if (!leg.hipDot) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('r', back ? 5.5 : 7);
      c.setAttribute('fill', back ? '#e8a33d' : '#e8a33d');
      leg.thigh.parentNode.insertBefore(c, leg.thigh);
      leg.hipDot = c;
    }
    leg.hipDot.setAttribute('cx', leg.hip.x);
    leg.hipDot.setAttribute('cy', leg.hip.y);

    leg.shin.setAttribute('x1', knee.x);
    leg.shin.setAttribute('y1', knee.y);
    leg.shin.setAttribute('x2', pedal.x);
    leg.shin.setAttribute('y2', pedal.y);

    const deg = Math.atan2(pedal.y - knee.y, pedal.x - knee.x) / RAD;
    leg.foot.setAttribute('transform', `translate(${pedal.x} ${pedal.y + 4}) rotate(${deg * 0.15})`);
    if (leg.kneeDot) {
      leg.kneeDot.setAttribute('cx', knee.x);
      leg.kneeDot.setAttribute('cy', knee.y);
      leg.kneeDot.style.display = '';
    }
  }

  // 链条包围盒
  const R1 = 24, R2 = 15; // 牙盘 / 飞轮半径
  function drawChain(phase) {
    const a = phase * RAD;
    // 用简单的两条切线近似链条
    const p1 = { x: BB.x, y: BB.y + R1 };
    const p2 = { x: BB.x, y: BB.y - R1 };
    const q1 = { x: 440, y: 470 + R2 };
    const q2 = { x: 440, y: 470 - R2 };
    const d = `M${p1.x},${p1.y} L${q1.x},${q1.y} A${R2},${R2} 0 0 0 ${q2.x},${q2.y} L${p2.x},${p2.y} A${R1},${R1} 0 0 0 ${p1.x},${p1.y}`;
    chain.setAttribute('d', d);
    chain.setAttribute('stroke-dashoffset', String(-(phase * R1) / 57.3));
  }

  const t0 = performance.now();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (reduce.matches) {
    document.querySelectorAll('.scene *').forEach(el => {
      el.style.animationDuration = '0s';
      el.style.animationPlayState = 'paused';
    });
    driveLeg(near, 0, false);
    driveLeg(far, 180, true);
    drawChain(0);
  } else {
    (function loop(now) {
      const phase = (((now - t0) / 720) * 360) % 360;
      driveLeg(near, phase, false);
      driveLeg(far, (phase + 180) % 360, true);
      drawChain(phase);
      requestAnimationFrame(loop);
    })(t0);
  }
</script>
