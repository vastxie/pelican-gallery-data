<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 🦤🚲</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(180deg,#1a2a6c,#b21f1f,#fdbb2d);
    background: linear-gradient(180deg,#7ec8f7 0%, #c9ecff 55%, #fff6d9 100%);
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:24px;
  }
  h1 { color:#154166; letter-spacing:.1em; margin-bottom:6px; text-shadow:0 2px 0 #fff; }
  p.sub { color:#3a6a94; margin-bottom:14px; }
  .stage {
    width:min(900px,96vw);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(21,65,102,.35), 0 4px 0 #fff inset;
    border:6px solid #fff;
    background:#aee3ff;
  }
  svg { display:block; width:100%; height:auto; }
  .panel {
    width:min(900px,96vw);
    margin-top:12px;
    background:rgba(255,255,255,.9);
    border-radius:14px;
    padding:12px 16px;
    display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    color:#264e6e; font-size:14px;
  }
  .btns { display:flex; gap:8px; }
  button {
    border:none; border-radius:999px; padding:8px 16px; cursor:pointer;
    background:#ff9f1c; color:#fff; font-weight:700; box-shadow:0 3px 0 #c46f00;
  }
  button:active { transform:translateY(2px); box-shadow:none; }
  button.secondary { background:#2ec4b6; box-shadow:0 3px 0 #1a7d74; }
  input[type=range]{ accent-color:#ff9f1c; }
</style>
</head>
<body>
<h1>🦤 鹈鹕骑自行车 · 2D SVG 动画</h1>
<p class="sub">纯 SVG 矢量绘制 + CSS / JS 驱动：蹬踏、转轮、翅膀扇动、背景滚动</p>

<div class="stage">
<svg id="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db9f5"/>
      <stop offset=".65" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#fff7d6"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d99ae"/>
      <stop offset="1" stop-color="#6c7689"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7f0"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf87"/>
      <stop offset="1" stop-color="#f59e4c"/>
    </linearGradient>
    <radialGradient id="sunG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".6" stop-color="#ffe45e"/>
      <stop offset="1" stop-color="#ffb300"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <circle cx="760" cy="90" r="48" fill="url(#sunG)"/>
  <circle cx="760" cy="90" r="65" fill="#ffdf5e" opacity=".25"/>

  <!-- 云 -->
  <g id="clouds" opacity=".95">
    <g class="cloud" fill="#fff">
      <ellipse cx="0" cy="0" rx="42" ry="20"/><ellipse cx="30" cy="-8" rx="30" ry="18"/><ellipse cx="-30" cy="-6" rx="26" ry="15"/>
    </g>
  </g>

  <!-- 远山 -->
  <g id="hills">
    <path d="M0 360 Q150 280 300 340 T600 335 T900 350 L900 420 L0 420 Z" fill="#9ed99e"/>
    <path d="M0 375 Q200 320 420 370 T900 365 L900 420 L0 420 Z" fill="#7cc47f"/>
  </g>

  <!-- 路边树（JS复制滚动） -->
  <g id="trees"></g>

  <!-- 地面 -->
  <rect x="0" y="410" width="900" height="110" fill="#7ec850"/>
  <rect x="0" y="410" width="900" height="12" fill="#6ab645"/>
  <rect x="0" y="430" width="900" height="90" fill="url(#roadG)"/>
  <g id="dashes" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-dasharray="36 32" opacity=".9">
    <line x1="0" y1="475" x2="900" y2="475"/>
  </g>
  <!-- 速度线 -->
  <g id="speedlines" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"></g>

  <!-- ===== 自行车 + 鹈鹕 整体（会上下颠簸） ===== -->
  <g id="rider" transform="translate(0,0)">
    <!-- 阴影 -->
    <ellipse id="shadow" cx="450" cy="478" rx="180" ry="14" fill="#000" opacity=".18"/>

    <!-- 自行车 -->
    <g id="bike" stroke-linecap="round" stroke-linejoin="round">
      <!-- 车架 -->
      <g stroke-width="9" fill="none">
        <line x1="310" y1="400" x2="430" y2="400" stroke="#e63946"/>
        <line x1="430" y1="400" x2="390" y2="290" stroke="#e63946"/>
        <line x1="390" y1="290" x2="330" y2="290" stroke="#e63946"/>
        <line x1="330" y1="290" x2="310" y2="400" stroke="#e63946"/>
        <line x1="430" y1="400" x2="590" y2="400" stroke="#e63946"/>
        <line x1="590" y1="400" x2="545" y2="290" stroke="#e63946"/>
        <line x1="390" y1="290" x2="545" y2="290" stroke="#2a9d8f" stroke-width="7"/>
      </g>
      <!-- 车座 & 车把 -->
      <line x1="315" y1="290" x2="345" y2="290" stroke="#222" stroke-width="12"/>
      <line x1="545" y1="290" x2="570" y2="255" stroke="#444" stroke-width="8"/>
      <path d="M555 255 Q575 245 585 260" fill="none" stroke="#222" stroke-width="8"/>
      <!-- 车篮 -->
      <g>
        <path d="M575 275 L625 275 L615 315 L583 315 Z" fill="#c98a4b" stroke="#7a4e22" stroke-width="4"/>
        <line x1="585" y1="275" x2="592" y2="315" stroke="#7a4e22" stroke-width="2"/>
        <line x1="600" y1="275" x2="600" y2="315" stroke="#7a4e22" stroke-width="2"/>
        <line x1="612" y1="275" x2="608" y2="315" stroke="#7a4e22" stroke-width="2"/>
        <circle cx="610" cy="265" r="8" fill="#ff595e"/>
        <circle cx="593" cy="262" r="7" fill="#ffca3a"/>
      </g>

      <!-- 轮子 -->
      <g id="wheelRear" transform="translate(310,400)">
        <circle r="72" fill="#fff" stroke="#222" stroke-width="10"/>
        <g id="spokesRear" stroke="#888" stroke-width="3">
          <line x1="0" y1="-62" x2="0" y2="62"/><line x1="-62" y1="0" x2="62" y2="0"/>
          <line x1="-44" y1="-44" x2="44" y2="44"/><line x1="-44" y1="44" x2="44" y2="-44"/>
        </g>
        <circle r="10" fill="#444"/>
      </g>
      <g id="wheelFront" transform="translate(590,400)">
        <circle r="72" fill="#fff" stroke="#222" stroke-width="10"/>
        <g id="spokesFront" stroke="#888" stroke-width="3">
          <line x1="0" y1="-62" x2="0" y2="62"/><line x1="-62" y1="0" x2="62" y2="0"/>
          <line x1="-44" y1="-44" x2="44" y2="44"/><line x1="-44" y1="44" x2="44" y2="-44"/>
        </g>
        <circle r="10" fill="#444"/>
      </g>

      <!-- 脚踏曲柄 -->
      <g id="crank" transform="translate(430,400)">
        <circle r="18" fill="none" stroke="#222" stroke-width="5"/>
        <line id="crankArm1" x1="0" y1="0" x2="0" y2="-32" stroke="#222" stroke-width="7"/>
        <line id="crankArm2" x1="0" y1="0" x2="0" y2="32" stroke="#222" stroke-width="7"/>
        <rect id="pedal1" x="-14" y="-40" width="28" height="10" rx="3" fill="#111"/>
        <rect id="pedal2" x="-14" y="30" width="28" height="10" rx="3" fill="#111"/>
      </g>
    </g>

    <!-- 鹈鹕腿（JS 更新路径，做踩踏 IK） -->
    <path id="legFar" d="M0 0" fill="none" stroke="#e8833a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="legNear" d="M0 0" fill="none" stroke="#f49a4a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse id="shoeFar" cx="0" cy="0" rx="14" ry="8" fill="#333"/>
    <ellipse id="shoeNear" cx="0" cy="0" rx="16" ry="9" fill="#111"/>

    <!-- 鹈鹕身体 -->
    <g id="pelican">
      <ellipse cx="400" cy="225" rx="95" ry="70" fill="url(#bodyG)" stroke="#8aa0b3" stroke-width="3"/>
      <!-- 尾巴 -->
      <path d="M315 210 L270 185 L278 215 L268 228 L315 235 Z" fill="#cdd9e5" stroke="#8aa0b3" stroke-width="3" stroke-linejoin="round"/>
      <!-- 翅膀 -->
      <g id="wing" transform="translate(400,230)">
        <ellipse id="wingShape" cx="-10" cy="0" rx="70" ry="32" fill="#fff" stroke="#8aa0b3" stroke-width="3"/>
        <path d="M-70 -5 Q-35 -18 0 -8 Q-35 -2 -70 -5" fill="#dbe7f0"/>
        <path d="M-65 8 Q-30 0 5 6" stroke="#8aa0b3" stroke-width="2" fill="none"/>
      </g>
      <!-- 脖子 + 头 -->
      <path d="M470 200 C500 170 505 130 490 105" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round"/>
      <path d="M470 200 C500 170 505 130 490 105" fill="none" stroke="#8aa0b3" stroke-width="38" stroke-linecap="round" opacity=".35"/>
      <path d="M470 200 C500 170 505 130 490 105" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
      <g id="head" transform="translate(488,95)">
        <ellipse cx="0" cy="0" rx="28" ry="24" fill="#fff" stroke="#8aa0b3" stroke-width="3"/>
        <!-- 眼睛 -->
        <circle cx="8" cy="-5" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
        <circle id="pupil" cx="10" cy="-4" r="3.2" fill="#111"/>
        <circle cx="11" cy="-5" r="1" fill="#fff"/>
        <!-- 上喙 -->
        <path d="M20 -8 L110 -2 L20 8 Z" fill="#ffb703" stroke="#a86e00" stroke-width="3" stroke-linejoin="round"/>
        <!-- 喉囊 -->
        <path id="pouch" d="M22 6 Q65 45 108 0 Q70 12 22 6" fill="url(#pouchG)" stroke="#a86e00" stroke-width="3"/>
        <!-- 头顶毛 -->
        <path d="M-20 -15 Q-28 -28 -12 -26 Q-6 -32 0 -22" fill="none" stroke="#8aa0b3" stroke-width="3" stroke-linecap="round"/>
        <!-- 围巾（骑车飘动） -->
        <path id="scarf" d="M-22 10 Q-60 18 -85 5 Q-60 28 -20 22 Z" fill="#e63946"/>
        <path id="scarfTail" d="M-80 12 Q-110 8 -125 20 Q-105 22 -82 22" fill="#e63946" opacity=".9"/>
      </g>
      <!-- 手臂抓把 -->
      <path d="M450 220 Q500 240 555 262" fill="none" stroke="#f49a4a" stroke-width="14" stroke-linecap="round"/>
      <circle cx="557" cy="263" r="10" fill="#f49a4a" stroke="#b25a1a" stroke-width="2"/>
    </g>
  </g>

  <!-- 前景小花 -->
  <g id="flowers"></g>
</svg>
</div>

<div class="panel">
  <div>速度 <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"> <span id="speedVal">1.0x</span>
  &nbsp;·&nbsp; 空格键暂停，拖动滑杆加速</div>
  <div class="btns">
    <button id="pauseBtn" class="secondary">⏸ 暂停</button>
    <button id="ringBtn">🔔 按铃铛！</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

// 初始化云
const cloudsG = $('clouds');
const cloudData = [];
for(let i=0;i<5;i++){
  const use = document.createElementNS(NS,'g');
  use.innerHTML = `<ellipse cx="0" cy="0" rx="42" ry="20" fill="#fff"/><ellipse cx="30" cy="-8" rx="30" ry="18" fill="#fff"/><ellipse cx="-30" cy="-6" rx="26" ry="15" fill="#fff"/>`;
  cloudsG.appendChild(use);
  cloudData.push({el:use, x: Math.random()*900, y: 40+Math.random()*140, s:.6+Math.random()*.9, v:10+Math.random()*20});
}
// 树
const treesG = $('trees');
function makeTree(x,y,s){
  const g=document.createElementNS(NS,'g');
  g.setAttribute('transform',`translate(${x},${y}) scale(${s})`);
  g.innerHTML=`<rect x="-6" y="-40" width="12" height="40" fill="#7a4e22"/><circle cx="0" cy="-55" r="28" fill="#2a9d43"/><circle cx="-18" cy="-45" r="18" fill="#35b851"/><circle cx="18" cy="-45" r="18" fill="#23913b"/>`;
  return g;
}
let trees=[];
for(let i=0;i<6;i++){ const t=makeTree(i*180,410,1); treesG.appendChild(t); trees.push({el:t,x:i*180}); }
// 花
const flowersG=$('flowers');
let flowers=[];
for(let i=0;i<10;i++){ const c=document.createElementNS(NS,'circle'); flowersG.appendChild(c); flowers.push({el:c,x:i*100+20}); }
// 速度线
const slG=$('speedlines');
let speedLines=[];
for(let i=0;i<8;i++){ const l=document.createElementNS(NS,'line'); l.setAttribute('stroke','#fff'); slG.appendChild(l); speedLines.push({x:Math.random()*900,y:100+Math.random()*250}); }

let t=0, speed=1, running=true, ringT=-10;

function footPos(angle, r){
  return {x: 430 + r*Math.cos(angle), y: 400 + r*Math.sin(angle)};
}
function solveLeg(hip, foot){
  // 两段骨骼 IK：大腿40，小腿50
  const L1=52, L2=62;
  let dx=foot.x-hip.x, dy=foot.y-hip.y;
  let d=Math.hypot(dx,dy); d=Math.min(d,L1+L2-2);
  const a=Math.atan2(dy,dx);
  const cosA=(L1*L1+d*d-L2*L2)/(2*L1*d);
  const ang=Math.acos(Math.max(-1,Math.min(1,cosA)));
  const kx=hip.x+L1*Math.cos(a-ang), ky=hip.y+L1*Math.sin(a-ang);
  // 缩放到实际foot
  const ang2=Math.atan2(foot.y-ky,foot.x-kx);
  const ex=kx+L2*Math.cos(ang2), ey=ky+L2*Math.sin(ang2);
  return `M${hip.x} ${hip.y} L${kx.toFixed(1)} ${ky.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}`;
}

function frame(dt){
  if(running) t+=dt*speed;
  const crankA = t*6;                 // 脚踏角速度
  const wheelA = t*8;                 // 轮子
  const bob = Math.sin(t*12)*5;       // 身体颠簸
  const flap = Math.sin(t*10)*18;     // 翅膀
  const bgOff = (t*220*speed)%200;

  $('rider').setAttribute('transform',`translate(0,${bob*0.5})`);
  $('pelican').setAttribute('transform',`translate(0,${bob}) rotate(${Math.sin(t*12)*1.5} 400 225)`);
  $('wing').setAttribute('transform',`translate(400,${230+bob}) rotate(${-10+flap} 20 0) scale(1,${1+Math.sin(t*10)*0.12})`);
  $('head').setAttribute('transform',`translate(488,${95+bob*1.2+Math.sin(t*6)*3}) rotate(${Math.sin(t*6)*4})`);
  $('scarfTail').setAttribute('transform',`rotate(${Math.sin(t*15)*12} -80 15)`);
  $('pupil').setAttribute('cx', 10+Math.sin(t*2)*1.5);
  // 喉囊呼吸
  $('pouch').setAttribute('d',`M22 6 Q65 ${45+Math.sin(t*4)*6} 108 0 Q70 12 22 6`);

  $('spokesFront').setAttribute('transform',`rotate(${wheelA*57.3})`);
  $('spokesRear').setAttribute('transform',`rotate(${wheelA*57.3})`);
  $('crank').setAttribute('transform',`translate(430,${400+bob*0.5}) rotate(${crankA*57.3})`);
  $('dashes').setAttribute('stroke-dashoffset', -t*400*speed);

  // 腿
  const hipN={x:395,y:245+bob}, hipF={x:385,y:245+bob};
  const crankR=32;
  // 曲柄旋转后的脚位置（加上rider bob）
  const f1={x:430+crankR*Math.sin(crankA), y:400+bob*0.5+crankR*Math.cos(crankA)* -1 * -1};
  // 简化：直接用圆
  const footNear={x:430+crankR*Math.cos(crankA), y:400+bob*0.5+crankR*Math.sin(crankA)};
  const footFar={x:430+crankR*Math.cos(crankA+Math.PI), y:400+bob*0.5+crankR*Math.sin(crankA+Math.PI)};
  $('legNear').setAttribute('d',solveLeg(hipN,footNear));
  $('legFar').setAttribute('d',solveLeg(hipF,footFar));
  $('legFar').setAttribute('opacity',.55);
  $('shoeNear').setAttribute('cx',footNear.x); $('shoeNear').setAttribute('cy',footNear.y);
  $('shoeFar').setAttribute('cx',footFar.x); $('shoeFar').setAttribute('cy',footFar.y);

  // 云
  cloudData.forEach(c=>{
    c.x-=c.v*dt*speed; if(c.x<-100)c.x=1000;
    c.el.setAttribute('transform',`translate(${c.x},${c.y}) scale(${c.s})`);
  });
  // 树滚动
  trees.forEach(tr=>{
    tr.x-=220*dt*speed; if(tr.x<-60)tr.x+=6*180;
    tr.el.setAttribute('transform',`translate(${tr.x},410) scale(1)`);
  });
  // 花
  flowers.forEach((f,i)=>{
    let x=(f.x - t*220*speed)%950; if(x<0)x+=950;
    f.el.setAttribute('cx',x); f.el.setAttribute('cy',422+ (i%3)*4);
    f.el.setAttribute('r', i%2?4:6); f.el.setAttribute('fill', i%3==0?'#ff595e':i%3==1?'#ffca3a':'#fff');
  });
  // 速度线
  speedLines.forEach(s=>{
    s.x-= (400+300*speed)*dt*(running?1:0); if(s.x<-50){s.x=950; s.y=80+Math.random()*280;}
  });
  slG.innerHTML = speed>1.1 && running ? speedLines.map(s=>`<line x1="${s.x}" y1="${s.y}" x2="${s.x+60}" y2="${s.y}" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/>`).join('') : '';

  // 阴影缩放
  $('shadow').setAttribute('rx', 180+Math.sin(t*12)*6);

  // 铃铛
  if(t-ringT<1){
    const k=(t-ringT);
    if(!document.getElementById('ringTxt')){
      const txt=document.createElementNS(NS,'text');
      txt.id='ringTxt'; txt.setAttribute('x',620); txt.setAttribute('y',200);
      txt.setAttribute('font-size','36'); txt.textContent='🔔 叮铃铃～';
      $('scene').appendChild(txt);
    }
    const el=document.getElementById('ringTxt');
    el.setAttribute('opacity', 1-k); el.setAttribute('transform',`translate(${k*30},${-k*40})`);
    if(k>=1) el.remove();
  }
  requestAnimationFrame(loop);
}
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; frame(dt); }
requestAnimationFrame(loop);

$('speed').oninput=e=>{ speed=parseFloat(e.target.value); $('speedVal').textContent=speed.toFixed(1)+'x'; };
$('pauseBtn').onclick=()=>{ running=!running; $('pauseBtn').textContent=running?'⏸ 暂停':'▶ 继续'; };
$('ringBtn').onclick=()=>{ ringT=t; };
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); $('pauseBtn').click(); }
});
</script>
</body>
</html>
