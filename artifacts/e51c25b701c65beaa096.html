<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>

:root{
  --sp: 1;
  --wheel: 1.82s;
  --crank: 0.75s;
  --dashes: 1.0s;
  --bob: 0.75s;
  --hillfar: 46s;
  --hillnear: 26s;
  --trees: 12s;
  --cloud1: 62s;
  --cloud2: 44s;
  --cloud3: 30s;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(1200px 700px at 50% -10%, #1f3350 0%, #0d1526 60%, #070c16 100%);
  color:#e8eef7;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:18px;
}
.wrap{width:min(980px,100%)}
h1{font-size:clamp(20px,3.2vw,30px);margin:0 0 4px;letter-spacing:.06em}
p.sub{margin:0 0 14px;opacity:.6;font-size:14px}
.stage{
  position:relative;border-radius:20px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07) inset;
  background:#0d1526;
}
svg#scene{display:block;width:100%;height:auto}
.controls{
  margin-top:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  font-size:14px;opacity:.92;
}
button{
  background:#1f8a80;color:#04231f;border:0;border-radius:999px;
  padding:9px 20px;font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 16px rgba(31,138,128,.35);transition:.2s;
}
button:hover{transform:translateY(-1px);background:#24a396}
input[type=range]{accent-color:#35b3a4;width:150px}
.hint{opacity:.45;font-size:12px;margin-left:auto}

/* ---------- scene animations ---------- */
.spin,.spinFront,.head,.wing,.tail,.pelicanBob,.hip,.eye{transform-box:view-box}
.shadow{transform-box:fill-box;transform-origin:center}

.spin{transform-origin:250px 357px}
.spinFront{transform-origin:600px 357px}
.spin{animation:spin calc(var(--wheel) * var(--sp)) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.c1{animation:drift calc(var(--cloud1) * var(--sp)) linear infinite}
.c2{animation:drift calc(var(--cloud2) * var(--sp)) linear infinite;animation-delay:-12s}
.c3{animation:drift calc(var(--cloud3) * var(--sp)) linear infinite;animation-delay:-6s}
@keyframes drift{
  from{transform:translateX(-260px)}
  to{transform:translateX(1160px)}
}

.hillsFar{animation:slide calc(var(--hillfar) * var(--sp)) linear infinite}
.hillsNear{animation:slide calc(var(--hillnear) * var(--sp)) linear infinite}
.trees{animation:slideTree calc(var(--trees) * var(--sp)) linear infinite}
@keyframes slide{
  from{transform:translateX(0)}
  to{transform:translateX(-160px)}
}
@keyframes slideTree{
  from{transform:translateX(0)}
  to{transform:translateX(-320px)}
}

.dashes{animation:road calc(var(--dashes) * var(--sp)) linear infinite}
@keyframes road{
  from{transform:translateX(0)}
  to{transform:translateX(-200px)}
}

.grass{animation:grass calc(var(--dashes) * var(--sp)) linear infinite}
@keyframes grass{
  0%{transform:translateX(0)}
  50%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

.shadow{animation:shadow calc(var(--crank) * var(--sp)) ease-in-out infinite}
@keyframes shadow{
  0%,100%{transform:scaleX(1);opacity:.22}
  50%{transform:scaleX(.96);opacity:.18}
}

.sun{animation:sunglow calc(5s * var(--sp)) ease-in-out infinite}
@keyframes sunglow{0%,100%{opacity:.95}50%{opacity:1}}

.pelicanBob{transform-origin:352px 250px;animation:bob calc(var(--bob) * var(--sp)) ease-in-out infinite}
@keyframes bob{
  0%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-2px) rotate(-.7deg)}
  50%{transform:translateY(-4px) rotate(0deg)}
  75%{transform:translateY(-2px) rotate(.7deg)}
  100%{transform:translateY(0) rotate(0deg)}
}

.head{transform-origin:452px 118px;animation:head calc(var(--bob) * var(--sp)) ease-in-out infinite}
@keyframes head{
  0%{transform:rotate(0deg)}
  30%{transform:rotate(-2.2deg)}
  60%{transform:rotate(1.4deg)}
  100%{transform:rotate(0deg)}
}

.wing{transform-origin:352px 186px;animation:wing calc(var(--bob) * var(--sp)) ease-in-out infinite}
@keyframes wing{
  0%{transform:rotate(0deg)}
  50%{transform:rotate(-1.6deg)}
  100%{transform:rotate(0deg)}
}

.tail{transform-origin:254px 200px;animation:tail calc(1.5s * var(--sp)) ease-in-out infinite}
@keyframes tail{
  0%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}100%{transform:rotate(0deg)}
}

.hip{animation:hip calc(var(--bob) * var(--sp)) ease-in-out infinite}
@keyframes hip{
  0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}
}

.eye{transform-origin:471px 78px;animation:blink calc(7s * var(--sp)) ease-in-out infinite}
@keyframes blink{
  0%,88%{transform:scaleY(1)}
  90%{transform:scaleY(.08)}
  92%{transform:scaleY(1)}
  100%{transform:scaleY(1)}
}

/* pause */
body.paused #scene *{animation-play-state:paused !important}

</style>
</head>

    </label>
    <span id="speedVal">1.00x</span>
    <span class="hint">提示：按空格键可暂停 / 继续</span>
  </div>
</div>
<script>

(function(){
  var svg = document.getElementById('scene');
  var btn = document.getElementById('toggle');
  var speed = document.getElementById('speed');
  var label = document.getElementById('speedVal');
  var smil = Array.prototype.slice.call(svg.querySelectorAll('animate,animateTransform'));
  smil.forEach(function(el){
    var d = el.getAttribute('dur');
    el.dataset.baseDur = d;
  });
  var base = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sp')) || 1;

  function setSpeed(v){
    base = v;
    document.documentElement.style.setProperty('--sp', v);
    smil.forEach(function(el){
      var b = el.dataset.baseDur;
      var num = parseFloat(b) || 1;
      var unit = b.replace(/[0-9.]/g,'') || 's';
      el.setAttribute('dur', (num * v) + unit);
    });
    label.textContent = v.toFixed(2) + 'x';
  }

  var paused = false;
  btn.addEventListener('click', function(){
    paused = !paused;
    document.body.classList.toggle('paused', paused);
    if (paused) { svg.pauseAnimations(); } else { svg.unpauseAnimations(); }
    btn.textContent = paused ? '\u25b6 \u7ee7\u7eed' : '\u23f8 \u6682\u505c';
  });

  document.addEventListener('keydown', function(e){
    if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); btn.click(); }
  });

  speed.addEventListener('input', function(){ setSpeed(parseFloat(speed.value)); });
  setSpeed(parseFloat(speed.value));
})();

</script>
