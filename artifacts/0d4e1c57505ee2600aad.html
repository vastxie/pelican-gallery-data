<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:28px 16px;box-sizing:border-box;
    background:radial-gradient(1200px 800px at 50% -10%,#2b3a52,#151b26);

  }
  svg{display:block;width:100%;height:auto}
  .controls{

    background:#1c2432;padding:10px 20px;border-radius:999px;
    box-shadow:0 10px 24px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.08);
  }
  button{
    background:#f0862f;color:#fff;border:none;border-radius:999px;
    padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .12s,background .12s;
  }
  button:hover{background:#ff9b46;transform:translateY(-1px)}
  .controls label{display:flex;align-items:center;gap:10px;font-size:13px;opacity:.9}
  input[type=range]{accent-color:#f0862f;width:170px}
  #spd{font-variant-numeric:tabular-nums;min-width:52px}
  .hint{font-size:12px;opacity:.55;margin:0;text-align:center}
</style>
</head>
<body>

  <circle cx="305" cy="385" r="15" fill="none" stroke="#474c52" stroke-width="3" stroke-dasharray="2.5 4"/>

  <circle cx="305" cy="385" r="4.5" fill="#33363c"/>
  <circle cx="490" cy="385" r="27" fill="none" stroke="#474c52" stroke-width="3" stroke-dasharray="3 4.5"/>

    <circle r="69" fill="none" stroke="#d7dade" stroke-width="5"/>
    <g class="spokes" id="spokesF" stroke="#a9b0b8" stroke-width="3">

      <path d="M490 385 L662 266"/>

    <path d="M413 270 Q438 258 470 265 L463 273 Q438 266 420 277 Z"
          fill="#3a3a40" stroke="#23252a" stroke-width="2"/>
    <path d="M662 266 L655 236" stroke="#3a3a40" stroke-width="8" fill="none"/>
    <path d="M655 236 Q648 224 626 227" stroke="#3a3a40" stroke-width="7" fill="none"/>
    <circle cx="626" cy="227" r="5" fill="#23252a"/>

  </g>

  <!-- ============ 近侧曲柄与踏板 ============ -->
  <line id="crankNear" x1="490" y1="385" x2="435" y2="385" stroke="#565b63" stroke-width="7" stroke-linecap="round"/>

  <!-- ============ 鹈鹕（上身整体随蹬踏起伏） ============ -->

      <path d="M0 0 L-68 0 L-6 13 Z"/>

    <ellipse cx="405" cy="200" rx="105" ry="64" fill="#ffffff" stroke="#33323a" stroke-width="4"
             transform="rotate(-16 405 200)"/>
    <path d="M468 156 Q436 226 376 254" stroke="#e3e7ec" stroke-width="7" fill="none" stroke-linecap="round"/>

          fill="#f0862f" stroke="#33323a" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ============ 近侧腿（最上层） ============ -->

<div class="controls">
  <button id="pp">⏸ 暂停</button>
  <label>踏频
    <input id="speed" type="range" min="0.3" max="2.2" step="0.05" value="1">
    <span id="spd">1.00×</span>
  </label>
</div>

<p class="hint">纯 SVG + 原生 JavaScript · 无依赖 · 腿部实时逆运动学（IK）求解 · 车轮 / 链条 / 踏板 / 背景视差全部同步驱动</p>

<script>
const $ = id => document.getElementById(id);

/* ---------- 几何常量 ---------- */
const REAR  = {x: 305, y: 385};   // 后轮心
const FRONT = {x: 705, y: 385};   // 前轮心
const BB    = {x: 490, y: 385};   // 曲柄中轴
const CRANK = 55;                 // 曲柄长
const HIP   = {x: 428, y: 248};   // 髋关节
const THIGH = 105, SHIN = 108;    // 大腿 / 小腿长
const WHEEL_RATIO = 2;            // 齿比：曲柄转 1 圈 → 车轮转 2 圈
const OMEGA = 2 * Math.PI / 1.15; // 基准踏频角速度（rad/s）

/* ---------- 生成辐条 ---------- */
document.querySelectorAll('.spokes').forEach(g => {
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 0); l.setAttribute('y1', 0);
    l.setAttribute('x2', (Math.cos(a) * 64).toFixed(1));
    l.setAttribute('y2', (Math.sin(a) * 64).toFixed(1));
    g.appendChild(l);
  }
});

/* ---------- 状态 ---------- */
let theta = 0, simT = 0, speed = 1, paused = false;
let roadOff = 0, hillOffA = 0, hillOffB = 0, flowOff = 0, chainOff = 0;
let last = performance.now();

const clouds = [
  {el: $('cloud1'), x: 170, y: 78,  s: 1},
  {el: $('cloud2'), x: 470, y: 52,  s: 0.75},
  {el: $('cloud3'), x: 760, y: 128, s: 0.9},
];
const sl = [
  {el: $('sl0'), x: 210, len: 70},
  {el: $('sl1'), x: 265, len: 52},
  {el: $('sl2'), x: 150, len: 84},
];

/* ---------- 腿部逆运动学（两连杆） ---------- */
function legPath(hip, foot) {
  const dx = foot.x - hip.x, dy = foot.y - hip.y;
  const dist = Math.hypot(dx, dy) || 1;
  const d = Math.min(Math.max(dist, Math.abs(THIGH - SHIN) + 0.5), THIGH + SHIN - 0.5);
  const a = (d * d + THIGH * THIGH - SHIN * SHIN) / (2 * d);
  const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
  const ux = dx / dist, uy = dy / dist;
  // 垂直方向的两个膝盖解，取靠前（x 更大）的那个
  const k1 = {x: hip.x + a * ux + h * (-uy), y: hip.y + a * uy + h * ux};
  const k2 = {x: hip.x + a * ux - h * (-uy), y: hip.y + a * uy - h * ux};
  const k = k1.x > k2.x ? k1 : k2;
  return `M${hip.x.toFixed(1)} ${hip.y.toFixed(1)} L${k.x.toFixed(1)} ${k.y.toFixed(1)} L${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`;
}
function footPath(p) { // 脚蹼踩在踏板上
  return `M${p.x - 8} ${p.y - 3} Q${p.x + 26} ${p.y - 9} ${p.x + 42} ${p.y + 1} Q${p.x + 30} ${p.y + 8} ${p.x - 8} ${p.y + 6} Z`;
}
function setCrank(el, p) { el.setAttribute('x2', p.x.toFixed(1)); el.setAttribute('y2', p.y.toFixed(1)); }
function setPedal(el, p) { el.setAttribute('x', (p.x - 14).toFixed(1)); el.setAttribute('y', (p.y - 5).toFixed(1)); }

/* ---------- 渲染 ---------- */
function render() {
  // 车轮辐条旋转（与曲柄 2:1）
  const deg = (theta * WHEEL_RATIO * 180 / Math.PI) % 360;
  $('spokesR').setAttribute('transform', `rotate(${deg.toFixed(2)})`);
  $('spokesF').setAttribute('transform', `rotate(${deg.toFixed(2)})`);

  // 蹬踏节奏的身体起伏：每踩一圈上下颠两次
  const bob = Math.sin(2 * theta);
  const bobY = bob * 3.2, sway = bob * 1.8;
  const hip = {x: HIP.x, y: HIP.y + bobY};

  $('pelican').setAttribute('transform',
    `translate(0 ${bobY.toFixed(2)}) rotate(${sway.toFixed(2)} ${HIP.x} ${HIP.y})`);
  $('wing').setAttribute('transform',
    `translate(470 148) rotate(${(-6 + Math.sin(2 * theta) * 7).toFixed(2)})`);
  $('tail').setAttribute('transform',
    `translate(332 228) rotate(${(Math.sin(2 * theta + 0.8) * 6).toFixed(2)})`);
  $('scarf').setAttribute('transform',
    `translate(524 140) rotate(${(Math.sin(simT * 6.5) * 12).toFixed(2)})`);
  $('fish').setAttribute('transform',
    `translate(700 124) rotate(${(Math.sin(simT * 9) * 6).toFixed(2)})`);
  $('sun').setAttribute('transform',
    `translate(880 78) scale(${(1 + 0.03 * Math.sin(simT * 2)).toFixed(4)})`);
  $('sweat').setAttribute('opacity',
    (Math.max(0, Math.sin(simT * 2.6)) * 0.8).toFixed(3));
  $('sweat').setAttribute('transform',
    `translate(0 ${(Math.max(0, Math.sin(simT * 2.6)) * -8).toFixed(1)})`);

  // 曲柄 / 踏板位置（两侧相位差 180°）
  const pF = {x: BB.x + CRANK * Math.cos(theta),     y: BB.y + CRANK * Math.sin(theta)};
  const pN = {x: BB.x - CRANK * Math.cos(theta),     y: BB.y - CRANK * Math.sin(theta)};
  setCrank($('crankFar'),  pF); setPedal($('pedalFar'),  pF);
  setCrank($('crankNear'), pN); setPedal($('pedalNear'), pN);

  // 双腿 IK
  $('legFar').setAttribute('d',  legPath(hip, pF));
  $('footFar').setAttribute('d', footPath(pF));
  $('legNear').setAttribute('d', legPath(hip, pN));
  $('footNear').setAttribute('d', footPath(pN));

  // 地面滚动与背景视差
  $('roadDash').setAttribute('stroke-dashoffset', (roadOff % 60).toFixed(1));
  $('hillsA').setAttribute('transform', `translate(${(-(hillOffA % 1000)).toFixed(1)} 0)`);
  $('hillsB').setAttribute('transform', `translate(${(-(hillOffB % 1000)).toFixed(1)} 0)`);
  $('flowers').setAttribute('transform', `translate(${(-(flowOff % 400)).toFixed(1)} 0)`);

  // 链条流动（上、下边方向相反）
  $('chainTop').setAttribute('stroke-dashoffset', (-chainOff % 8.5).toFixed(2));
  $('chainBottom').setAttribute('stroke-dashoffset', (chainOff % 8.5).toFixed(2));

  // 车影随起伏轻微呼吸
  $('shadow').setAttribute('transform',
    `translate(500 473) scale(${(1 - bobY * 0.006).toFixed(4)} 1) translate(-500 -473)`);
}

/* ---------- 主循环 ---------- */
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const v = 170 * OMEGA * speed; // 车速（px/s）：曲柄一圈车前进 2·2π·85 ≈ 1068px

  if (!paused) {
    theta  += OMEGA * speed * dt;
    simT   += dt;
    roadOff += v * dt;
    hillOffA += v * 0.22 * dt;
    hillOffB += v * 0.42 * dt;
    flowOff  += v * dt;
    chainOff += WHEEL_RATIO * OMEGA * speed * 12 * dt; // 链速 = 飞轮角速 × 半径

    clouds.forEach(c => {
      c.x -= (v * 0.07 + 12) * dt;
      if (c.x < -170) c.x = 1170;
      c.el.setAttribute('transform', `translate(${c.x.toFixed(1)} ${c.y}) scale(${c.s})`);
    });
    sl.forEach((s, i) => {
      s.x -= v * 0.4 * dt;
      if (s.x + s.len < 50) s.x = 330 + Math.random() * 80;
      s.el.setAttribute('x1', s.x.toFixed(1));
      s.el.setAttribute('x2', (s.x + s.len).toFixed(1));
      s.el.setAttribute('opacity', (0.1 + 0.32 * Math.max(0, Math.sin(simT * 2.3 + i * 1.9))).toFixed(3));
    });
  }
  render();
  requestAnimationFrame(frame);
}

/* ---------- 控件 ---------- */
$('pp').addEventListener('click', e => {
  paused = !paused;
  e.target.textContent = paused ? '▶ 播放' : '⏸ 暂停';
});
$('speed').addEventListener('input', e => {
  speed = +e.target.value;
  $('spd').textContent = speed.toFixed(2) + '×';
});

requestAnimationFrame(frame);
</script>
</body>
</html>
