<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 - SVG 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#87ceeb, #c9e9f6 70%, #f5e6c8 70%);
    font-family: sans-serif;
  }
  svg { max-width: 900px; width: 95%; height: auto; }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">

  <!-- 太阳 -->
  <circle cx="700" cy="70" r="35" fill="#ffd54f"/>
  <circle cx="700" cy="70" r="45" fill="#ffd54f" opacity="0.3">
    <animate attributeName="r" values="45;55;45" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- 云朵（向左飘动） -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="80" rx="45" ry="18"/>
      <ellipse cx="185" cy="70" rx="30" ry="15"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 700,0; 700,0" keyTimes="0; 0.99; 1" dur="30s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="400" cy="130" rx="38" ry="14"/>
      <ellipse cx="430" cy="120" rx="26" ry="12"/>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 450,0; 450,0" keyTimes="0; 0.99; 1" dur="22s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 地面线 -->
  <line x1="0" y1="400" x2="800" y2="400" stroke="#c9a86a" stroke-width="4"/>

  <!-- 路面虚线（向后滚动，制造前进感） -->
  <g stroke="#b08d57" stroke-width="4" stroke-dasharray="30 25">
    <line x1="-60" y1="420" x2="860" y2="420">
      <animate attributeName="stroke-dashoffset" from="0" to="55" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= 鹈鹕 + 自行车（整体轻微上下颠簸） ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-4; 0,0" dur="0.6s" repeatCount="indefinite"/>

    <!-- ========== 自行车 ========== -->
    <g stroke="#e53935" stroke-width="6" fill="none" stroke-linecap="round">

      <!-- 后轮 -->
      <g>
        <circle cx="250" cy="360" r="55" stroke="#333" stroke-width="7"/>
        <circle cx="250" cy="360" r="6" fill="#333" stroke="none"/>
        <g stroke="#999" stroke-width="2">
          <line x1="250" y1="305" x2="250" y2="415"/>
          <line x1="195" y1="360" x2="305" y2="360"/>
          <line x1="211" y1="321" x2="289" y2="399"/>
          <line x1="289" y1="321" x2="211" y2="399"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0 250 360" to="360 250 360" dur="1s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- 前轮 -->
      <g>
        <circle cx="500" cy="360" r="55" stroke="#333" stroke-width="7"/>
        <circle cx="500" cy="360" r="6" fill="#333" stroke="none"/>
        <g stroke="#999" stroke-width="2">
          <line x1="500" y1="305" x2="500" y2="415"/>
          <line x1="445" y1="360" x2="555" y2="360"/>
          <line x1="461" y1="321" x2="539" y2="399"/>
          <line x1="539" y1="321" x2="461" y2="399"/>
          <animateTransform attributeName="transform" type="rotate"
            from="0 500 360" to="360 500 360" dur="1s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- 车架 -->
      <line x1="250" y1="360" x2="360" y2="360"/>   <!-- 后下叉 -->
      <line x1="250" y1="360" x2="330" y2="260"/>   <!-- 座管方向 -->
      <line x1="360" y1="360" x2="330" y2="260"/>   <!-- 座管 -->
      <line x1="360" y1="360" x2="470" y2="255"/>   <!-- 下管到前叉 -->
      <line x1="330" y1="260" x2="470" y2="255"/>   <!-- 上管 -->
      <line x1="500" y1="360" x2="470" y2="255"/>   <!-- 前叉 -->
      <line x1="470" y1="255" x2="465" y2="230"/>   <!-- 车头 -->
      <line x1="445" y1="230" x2="495" y2="228" stroke="#333" stroke-width="7"/> <!-- 车把 -->
      <line x1="310" y1="258" x2="352" y2="258" stroke="#333" stroke-width="8"/> <!-- 车座 -->
    </g>

    <!-- 曲柄与脚踏（旋转） -->
    <g>
      <circle cx="360" cy="360" r="14" fill="#555"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 360 360" to="360 360 360" dur="1s" repeatCount="indefinite"/>
        <line x1="360" y1="360" x2="360" y2="315" stroke="#555" stroke-width="6"/>
        <line x1="360" y1="360" x2="360" y2="405" stroke="#555" stroke-width="6"/>
        <rect x="345" y="308" width="30" height="10" rx="4" fill="#222"/>
        <rect x="345" y="402" width="30" height="10" rx="4" fill="#222"/>
      </g>
    </g>

    <!-- ========== 鹈鹕 ========== -->
    <!-- 腿（蹬踏动画：脚跟随曲柄上下移动） -->
    <g stroke="#f4a300" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M 335 255 Q 355 300 360 315">
        <animate attributeName="d"
          values="M 335 255 Q 355 300 360 315;
                  M 335 255 Q 345 310 360 360;
                  M 335 255 Q 350 320 360 405;
                  M 335 255 Q 365 330 360 360;
                  M 335 255 Q 355 300 360 315"
          dur="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 身体 -->
    <ellipse cx="330" cy="215" rx="75" ry="48" fill="#f5f0e6" stroke="#d9cfc0" stroke-width="3"/>
    <!-- 尾羽 -->
    <path d="M 258 210 Q 225 195 218 215 Q 240 225 260 230 Z" fill="#e8dfcf" stroke="#d9cfc0" stroke-width="2"/>
    <!-- 翅膀（轻微扇动） -->
    <g>
      <path d="M 310 200 Q 355 185 385 215 Q 350 240 310 225 Q 295 212 310 200 Z"
            fill="#e8dfcf" stroke="#cfc3ae" stroke-width="2">
      </path>
      <animateTransform attributeName="transform" type="rotate"
        values="0 320 210; -6 320 210; 0 320 210" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- 脖子 -->
    <path d="M 380 195 Q 415 165 425 120" stroke="#f5f0e6" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M 380 195 Q 415 165 425 120" stroke="#d9cfc0" stroke-width="2" fill="none" opacity="0.5"/>

    <!-- 头（轻微点头） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 428 118; 4 428 118; 0 428 118" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="432" cy="105" rx="30" ry="24" fill="#f5f0e6" stroke="#d9cfc0" stroke-width="2"/>
      <!-- 眼睛 -->
      <circle cx="445" cy="97" r="5" fill="#222"/>
      <circle cx="446.5" cy="95.5" r="1.8" fill="#fff"/>
      <!-- 大嘴（上喙） -->
      <path d="M 458 100 L 560 112 Q 565 116 558 120 L 458 114 Z" fill="#f4a300" stroke="#d98e00" stroke-width="2"/>
      <!-- 喉囊（下喙+皮囊，会晃动） -->
      <path fill="#f6b93b" stroke="#d98e00" stroke-width="2">
        <animate attributeName="d"
          values="M 458 114 L 556 121 Q 530 158 485 150 Q 462 142 458 114 Z;
                  M 458 114 L 556 121 Q 530 165 485 156 Q 462 145 458 114 Z;
                  M 458 114 L 556 121 Q 530 158 485 150 Q 462 142 458 114 Z"
          dur="1.2s" repeatCount="indefinite"/>
      </path>
      <!-- 喉囊里的鱼（彩蛋，偶尔眨眼般露出） -->
      <g opacity="0.9">
        <ellipse cx="500" cy="135" rx="14" ry="7" fill="#64b5f6"/>
        <path d="M 486 135 L 476 129 L 476 141 Z" fill="#64b5f6"/>
        <circle cx="508" cy="133" r="2" fill="#222"/>
        <animateTransform attributeName="transform" type="translate"
          values="0,0; 0,4; 0,0" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <!-- 翅膀手臂扶着车把 -->
    </g>

    <!-- 翅膀尖搭在车把上 -->
    <path d="M 385 210 Q 430 225 460 230" stroke="#e8dfcf" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 385 210 Q 430 225 460 230" stroke="#cfc3ae" stroke-width="2" fill="none" opacity="0.6"/>

  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="230" x2="180" y2="230">
      <animate attributeName="x1" values="160;60" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="220;120" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="290" x2="170" y2="290">
      <animate attributeName="x1" values="140;40" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="210;110" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="340" x2="190" y2="340">
      <animate attributeName="x1" values="170;70" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="230;130" dur="0.45s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="0.45s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 扬起的尘土 -->
  <g fill="#d9c39a">
    <circle cx="200" cy="405" r="8" opacity="0.6">
      <animate attributeName="cx" values="210;140" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;12" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="412" r="6" opacity="0.5">
      <animate attributeName="cx" values="215;150" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;10" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
</body>
</html>
