<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 20%, #24304f 0%, #0f1424 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #e8edff;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 14px; letter-spacing: .5px; }
  .stage {
    width: min(100%, 960px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    background: #9fd8ff;
    cursor: pointer;
  }
  svg { display: block; width: 100%; height: auto; }
  .controls { margin-top: 14px; display: flex; gap: 14px; align-items: center; }
  button {
    background: #2c3a5f; color: #fff; border: 1px solid #47598a;
    border-radius: 999px; padding: 8px 18px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #3a4b78; }
  .hint { font-size: 13px; opacity: .65; }

  /* ---- CSS 驱动的部分 ---- */
  .cloud-layer { animation: drift 70s linear infinite; }
  @keyframes drift { to { transform: translateX(-800px); } }

  .sun-rays { transform-origin: 680px 80px; animation: spin 90s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }

  .puff { transform-box: fill-box; transform-origin: center; animation: puff 1.5s ease-out infinite; opacity: 0; }
  .puff:nth-child(2) { animation-delay: .5s; }
  .puff:nth-child(3) { animation-delay: 1s; }
  @keyframes puff {
    0%   { transform: translate(0,0) scale(.4); opacity: .55; }
    100% { transform: translate(-90px,-16px) scale(1.9); opacity: 0; }
  }

  .paused .cloud-layer, .paused .sun-rays, .paused .eye, .paused .puff { animation-play-state: paused; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>

<div class="stage" id="stage">
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sceneTitle">
  <title id="sceneTitle">一只鹈鹕骑着红色自行车在乡间公路上前行</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5db2f0"/>
      <stop offset="1" stop-color="#dcf2ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5e69"/>
      <stop offset="1" stop-color="#3e404a"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff3a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff3a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e1e5ee"/>
    </linearGradient>
    <linearGradient id="beakFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe55"/>
      <stop offset="1" stop-color="#f0891d"/>
    </linearGradient>
    <linearGradient id="pouchFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c15a"/>
      <stop offset="1" stop-color="#f4a63a"/>
    </linearGradient>

    <!-- 一棵树 -->
    <g id="tree">
      <rect x="-4" y="-34" width="8" height="40" fill="#7a4e2d"/>
      <circle cx="-15" cy="-40" r="15" fill="#3f9a4b"/>
      <circle cx="15"  cy="-40" r="15" fill="#3f9a4b"/>
      <circle cx="0"   cy="-52" r="19" fill="#4aa856"/>
      <circle cx="0"   cy="-38" r="16" fill="#46a352"/>
    </g>
  </defs>

  <!-- ===== 天空与太阳 ===== -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="95" fill="url(#sunGlow)"/>
  <g id="sunRays" class="sun-rays" stroke="#ffe17a" stroke-width="4" stroke-linecap="round" opacity=".8"></g>
  <circle cx="680" cy="80" r="38" fill="#ffd93b"/>

  <!-- ===== 云（CSS 漂移） ===== -->
  <g class="cloud-layer" fill="#ffffff" opacity=".92">
    <g id="cloudSet">
      <g transform="translate(120,95)">
        <ellipse cx="0" cy="0" rx="44" ry="18"/><ellipse cx="-24" cy="6" rx="26" ry="14"/>
        <ellipse cx="26" cy="4" rx="28" ry="15"/><ellipse cx="2" cy="-11" rx="24" ry="17"/>
      </g>
      <g transform="translate(400,60) scale(.8)">
        <ellipse cx="0" cy="0" rx="44" ry="18"/><ellipse cx="-24" cy="6" rx="26" ry="14"/>
        <ellipse cx="26" cy="4" rx="28" ry="15"/><ellipse cx="2" cy="-11" rx="24" ry="17"/>
      </g>
      <g transform="translate(560,150) scale(.65)">
        <ellipse cx="0" cy="0" rx="44" ry="18"/><ellipse cx="-24" cy="6" rx="26" ry="14"/>
        <ellipse cx="26" cy="4" rx="28" ry="15"/><ellipse cx="2" cy="-11" rx="24" ry="17"/>
      </g>
    </g>
    <use href="#cloudSet" x="800"/>
  </g>

  <!-- ===== 远山 / 近丘（JS 视差滚动） ===== -->
  <g id="hillsFar" fill="#93cf9c">
    <path id="hillFarPath" d="M0,335 C40,325 90,285 160,290 C230,295 260,340 330,338 C400,336 430,295 510,298 C590,301 610,345 690,342 C740,340 770,342 800,335 L800,410 L0,410 Z"/>
    <use href="#hillFarPath" x="800"/>
  </g>
  <g id="hillsNear" fill="#6dba78">
    <path id="hillNearPath" d="M0,372 C60,360 100,340 180,345 C250,350 290,375 360,370 C430,365 470,338 550,342 C620,346 660,378 720,375 C760,373 780,378 800,372 L800,410 L0,410 Z"/>
    <use href="#hillNearPath" x="800"/>
  </g>

  <!-- ===== 树 ===== -->
  <g id="trees">
    <g id="treeSet">
      <use href="#tree" transform="translate(70,392)"/>
      <use href="#tree" transform="translate(210,392) scale(.7)"/>
      <use href="#tree" transform="translate(345,392) scale(.9)"/>
      <use href="#tree" transform="translate(520,392) scale(1.1)"/>
      <use href="#tree" transform="translate(655,392) scale(.75)"/>
      <use href="#tree" transform="translate(760,392) scale(.95)"/>
    </g>
    <use href="#treeSet" x="800"/>
  </g>

  <!-- ===== 路肩草地 ===== -->
  <rect x="0" y="385" width="800" height="22" fill="#62b34f"/>
  <g id="tufts" fill="none" stroke="#3b8a32" stroke-width="2" stroke-linecap="round">
    <g id="tuftSet"></g>
    <use href="#tuftSet" x="800"/>
  </g>

  <!-- ===== 公路 ===== -->
  <rect x="0" y="405" width="800" height="62" fill="url(#road)"/>
  <rect x="0" y="405" width="800" height="3" fill="#8e919c"/>
  <line id="dash" x1="0" y1="438" x2="800" y2="438" stroke="#f3e08a" stroke-width="4" stroke-dasharray="40 20"/>
  <rect x="0" y="467" width="800" height="33" fill="#4f9a3f"/>

  <!-- 阴影 + 尘土 -->
  <ellipse cx="350" cy="406" rx="135" ry="5.5" fill="rgba(0,0,0,.26)"/>
  <g fill="#d9d3c2">
    <circle class="puff" cx="196" cy="398" r="7"/>
    <circle class="puff" cx="196" cy="398" r="7"/>
    <circle class="puff" cx="196" cy="398" r="7"/>
  </g>

  <!-- ===== 自行车：远侧曲柄与脚踏（在车架后面） ===== -->
  <line id="farArm" x1="322" y1="350" x2="290" y2="350" stroke="#383a42" stroke-width="5" stroke-linecap="round"/>
  <rect id="farPedal" x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#3a3c44"/>

  <!-- 远侧腿 -->
  <g id="farLeg" opacity=".82">
    <path id="farThighO" fill="none" stroke="#9aa0ad" stroke-width="18" stroke-linecap="round"/>
    <path id="farShinO"  fill="none" stroke="#b5641a" stroke-width="10" stroke-linecap="round"/>
    <path id="farThigh"  fill="none" stroke="#e4e7ee" stroke-width="14" stroke-linecap="round"/>
    <path id="farShin"   fill="none" stroke="#dd8a2a" stroke-width="7"  stroke-linecap="round"/>
    <path id="farFoot" d="M-11,-3 L4,-7 L17,-3 L19,1 L12,3 L-9,4 Z" fill="#dd8a2a" stroke="#b5641a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- 车轮 -->
  <g id="rearWheel">
    <circle cx="245" cy="355" r="50" fill="none" stroke="#2a2a2e" stroke-width="9"/>
    <circle cx="245" cy="355" r="44" fill="none" stroke="#cfd2db" stroke-width="3"/>
    <g id="rearSpokes" stroke="#b9bdc9" stroke-width="1.6"></g>
    <circle cx="245" cy="355" r="6" fill="#585b66"/>
  </g>
  <g id="frontWheel">
    <circle cx="455" cy="355" r="50" fill="none" stroke="#2a2a2e" stroke-width="9"/>
    <circle cx="455" cy="355" r="44" fill="none" stroke="#cfd2db" stroke-width="3"/>
    <g id="frontSpokes" stroke="#b9bdc9" stroke-width="1.6"></g>
    <circle cx="455" cy="355" r="6" fill="#585b66"/>
  </g>

  <!-- 车架 -->
  <g fill="none" stroke="#e04a3f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M322,350 L296,262 L430,268 L438,296 Z"/>
    <path d="M322,350 L245,355 L296,262"/>
    <path d="M438,296 C442,320 450,340 455,355"/>
  </g>
  <g fill="none" stroke="#4a4d57" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296,262 L291,242"/>
    <path d="M430,268 L427,250 C426,244 418,244 412,247 L400,250"/>
  </g>
  <!-- 车座 -->
  <path d="M262,242 C264,234 280,232 292,234 L316,238 C318,243 312,246 304,246 L270,247 C262,247 260,245 262,242 Z" fill="#2b2b2e"/>
  <!-- 握把 + 车铃 -->
  <line x1="400" y1="250" x2="414" y2="248" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <circle cx="419" cy="243" r="4.2" fill="#d7dbe6" stroke="#8d93a3" stroke-width="1.2"/>

  <!-- 链条 -->
  <path id="chain" d="M323.3,330 L245.7,345 A10,10 0 1 0 246.9,364.8 L325.9,369.6 A20,20 0 0 0 323.3,330 Z"
        fill="none" stroke="#3a3a3a" stroke-width="3" stroke-dasharray="4 3"/>
  <circle cx="245" cy="355" r="10" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  <!-- 牙盘 -->
  <circle cx="322" cy="350" r="20" fill="none" stroke="#3a3a3a" stroke-width="5"/>
  <g id="spider" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"></g>

  <!-- 近侧曲柄 + 中轴盖 + 脚踏 -->
  <line id="nearArm" x1="322" y1="350" x2="354" y2="350" stroke="#4a4d57" stroke-width="5" stroke-linecap="round"/>
  <circle cx="322" cy="350" r="5" fill="#5c606b"/>
  <rect id="nearPedal" x="-9" y="-2.5" width="18" height="5" rx="1.5" fill="#2a2a2e"/>

  <!-- 近侧腿 -->
  <g id="nearLeg">
    <path id="nearThighO" fill="none" stroke="#9aa0ad" stroke-width="18" stroke-linecap="round"/>
    <path id="nearShinO"  fill="none" stroke="#b5641a" stroke-width="10" stroke-linecap="round"/>
    <path id="nearThigh"  fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path id="nearShin"   fill="none" stroke="#f39a2b" stroke-width="7"  stroke-linecap="round"/>
    <path id="nearFoot" d="M-11,-3 L4,-7 L17,-3 L19,1 L12,3 L-9,4 Z" fill="#f39a2b" stroke="#b5641a" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path id="tail" d="M244,192 L206,168 L216,192 L194,192 L214,208 L200,218 L240,222 Z"
          fill="#f2f3f7" stroke="#9aa0ad" stroke-width="2" stroke-linejoin="round"/>

    <!-- 颈 + 头 -->
    <g id="headGroup">
      <!-- 描边层 -->
      <path d="M318,186 C338,176 330,140 358,120" fill="none" stroke="#9aa0ad" stroke-width="27" stroke-linecap="round"/>
      <circle cx="372" cy="112" r="22" fill="#9aa0ad"/>
      <!-- 填充层 -->
      <path d="M318,186 C338,176 330,140 358,120" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
      <circle cx="372" cy="112" r="20" fill="#ffffff"/>
      <!-- 冠羽 -->
      <path d="M360,96 L346,86 L358,92 L351,77 L366,93 Z" fill="#ffffff" stroke="#9aa0ad" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- 眼睛 -->
      <circle cx="381" cy="107" r="6.5" fill="#ffd98a"/>
      <g class="eye">
        <circle cx="381" cy="107" r="3.5" fill="#1f1f24"/>
        <circle cx="382.3" cy="105.6" r="1.1" fill="#ffffff"/>
      </g>
      <!-- 喙：上颌 -->
      <path d="M378,101 C412,99 456,109 484,125 C488,128 486,133 480,132 C448,118 412,113 378,116 Z"
            fill="url(#beakFill)" stroke="#c46e12" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- 喙：下颌喉囊 -->
      <path d="M379,116 C392,153 446,153 480,132 C447,127 412,123 379,116 Z"
            fill="url(#pouchFill)" stroke="#c46e12" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M383,108 C420,106 455,113 478,126" fill="none" stroke="rgba(120,60,0,.35)" stroke-width="1.2"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="290" cy="205" rx="60" ry="44" fill="#9aa0ad" transform="rotate(-8 290 205)"/>
    <ellipse cx="290" cy="205" rx="58" ry="42" fill="url(#bodyFill)" transform="rotate(-8 290 205)"/>

    <!-- 近侧翅膀（伸向车把） -->
    <path d="M294,178 C330,168 385,212 412,247 C414,252 412,256 406,254 C372,246 335,236 306,226 C292,220 288,196 294,178 Z"
          fill="#f7f8fb" stroke="#9aa0ad" stroke-width="2" stroke-linejoin="round"/>
    <g fill="none" stroke="#c9ced9" stroke-width="1.5">
      <path d="M300,186 C340,196 370,222 402,248"/>
      <path d="M298,200 C330,214 356,232 392,252"/>
    </g>
    <path d="M388,240 C398,244 407,248 413,252 C411,256 405,256 399,254 C394,250 390,246 386,242 Z" fill="#2f3238" opacity=".85"/>
  </g>
</svg>
</div>

<div class="controls">
  <button id="toggle" type="button">❚❚ 暂停</button>
  <span class="hint">点击画面也可以暂停 / 继续</span>
</div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);

  // ---- 几何参数 ----
  const BB = { x: 322, y: 350 };      // 中轴
  const RW = { x: 245, y: 355 };      // 后轮心
  const FW = { x: 455, y: 355 };      // 前轮心
  const CRANK = 32;                   // 曲柄长度
  const R = 50;                       // 车轮半径
  const RATIO = 2;                    // 牙盘/飞轮 传动比
  const PERIOD = 2.0;                 // 蹬一圈用时（秒）
  const HIP0 = { x: 302, y: 240 };    // 髋关节
  const L1 = 75, L2 = 75;             // 大腿 / 小腿长度

  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  // ---- 生成辐条 ----
  function buildSpokes(id, c) {
    const g = $(id);
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      g.appendChild(el('line', {
        x1: c.x, y1: c.y,
        x2: (c.x + 44 * Math.cos(a)).toFixed(1),
        y2: (c.y + 44 * Math.sin(a)).toFixed(1)
      }));
    }
    g.appendChild(el('circle', { cx: c.x + 26, cy: c.y, r: 3.2, fill: '#ff9d2e', stroke: 'none' }));
  }
  buildSpokes('rearSpokes', RW);
  buildSpokes('frontSpokes', FW);

  // ---- 牙盘辐臂 ----
  (function () {
    const g = $('spider');
    for (let i = 0; i < 5; i++) {
      const a = i * 2 * Math.PI / 5;
      g.appendChild(el('line', {
        x1: BB.x, y1: BB.y,
        x2: (BB.x + 18 * Math.cos(a)).toFixed(1),
        y2: (BB.y + 18 * Math.sin(a)).toFixed(1)
      }));
    }
    g.appendChild(el('circle', { cx: BB.x, cy: BB.y, r: 22.5, fill: 'none', 'stroke-dasharray': '2 2.3', 'stroke-width': 3 }));
  })();

  // ---- 太阳光芒 ----
  (function () {
    const g = $('sunRays');
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6;
      g.appendChild(el('line', {
        x1: (680 + 48 * Math.cos(a)).toFixed(1), y1: (80 + 48 * Math.sin(a)).toFixed(1),
        x2: (680 + 62 * Math.cos(a)).toFixed(1), y2: (80 + 62 * Math.sin(a)).toFixed(1)
      }));
    }
  })();

  // ---- 路边草丛 ----
  (function () {
    const g = $('tuftSet');
    const xs = [12, 58, 97, 150, 203, 241, 296, 348, 392, 447, 503, 541, 598, 652, 690, 742];
    xs.forEach((x, i) => {
      const h = 7 + (i % 4) * 2;
      g.appendChild(el('path', {
        d: `M${x},406 q2,-${h} 4,0 M${x + 5},406 q3,-${h + 3} 6,0 M${x + 11},406 q2,-${h - 2} 4,0`
      }));
    });
  })();

  // ---- 两段式腿部反向运动学 ----
  function solveLeg(hip, target) {
    let dx = target.x - hip.x, dy = target.y - hip.y;
    let d = Math.hypot(dx, dy);
    const maxD = L1 + L2 - 0.5;
    if (d > maxD) { const s = maxD / d; dx *= s; dy *= s; d = maxD; }
    const cosA = Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
    const a = Math.acos(cosA);
    const base = Math.atan2(dy, dx);
    const k1 = { x: hip.x + L1 * Math.cos(base - a), y: hip.y + L1 * Math.sin(base - a) };
    const k2 = { x: hip.x + L1 * Math.cos(base + a), y: hip.y + L1 * Math.sin(base + a) };
    return { knee: k1.x >= k2.x ? k1 : k2, ankle: { x: hip.x + dx, y: hip.y + dy } };   // 膝盖朝前
  }

  const f1 = n => n.toFixed(1);

  function poseLeg(prefix, hip, pedal) {
    const { knee, ankle } = solveLeg(hip, { x: pedal.x - 4, y: pedal.y - 5 });
    const thigh = `M${f1(hip.x)},${f1(hip.y)} L${f1(knee.x)},${f1(knee.y)}`;
    const shin = `M${f1(knee.x)},${f1(knee.y)} L${f1(ankle.x)},${f1(ankle.y)}`;
    $(prefix + 'ThighO').setAttribute('d', thigh);
    $(prefix + 'Thigh').setAttribute('d', thigh);
    $(prefix + 'ShinO').setAttribute('d', shin);
    $(prefix + 'Shin').setAttribute('d', shin);
    const tr = `translate(${f1(pedal.x)},${f1(pedal.y)})`;
    $(prefix + 'Foot').setAttribute('transform', tr);
    $(prefix + 'Pedal').setAttribute('transform', tr);
    const arm = $(prefix + 'Arm');
    arm.setAttribute('x2', f1(pedal.x));
    arm.setAttribute('y2', f1(pedal.y));
  }

  // ---- 每帧渲染 ----
  const deg = r => (r * 180 / Math.PI) % 360;

  function render(t) {
    const wheel = t * RATIO;
    const dist = wheel * R;                    // 行驶距离（像素），保证轮子与地面同步

    $('rearSpokes').setAttribute('transform', `rotate(${deg(wheel).toFixed(2)} ${RW.x} ${RW.y})`);
    $('frontSpokes').setAttribute('transform', `rotate(${deg(wheel).toFixed(2)} ${FW.x} ${FW.y})`);
    $('spider').setAttribute('transform', `rotate(${deg(t).toFixed(2)} ${BB.x} ${BB.y})`);

    const scroll = (id, f) => $(id).setAttribute('transform', `translate(${(-((dist * f) % 800)).toFixed(1)},0)`);
    scroll('hillsFar', 0.12);
    scroll('hillsNear', 0.28);
    scroll('trees', 0.55);
    scroll('tufts', 1);
    $('dash').setAttribute('stroke-dashoffset', (dist % 60).toFixed(1));
    $('chain').setAttribute('stroke-dashoffset', ((t * 20) % 7).toFixed(2));

    const bob = 2 * Math.sin(2 * t);
    $('pelican').setAttribute('transform', `translate(0,${bob.toFixed(2)})`);
    $('headGroup').setAttribute('transform', `translate(0,${(1.4 * Math.sin(2 * t + 1.1)).toFixed(2)})`);
    $('tail').setAttribute('transform', `rotate(${(3 * Math.sin(3 * t)).toFixed(2)} 240 205)`);

    const hip = { x: HIP0.x, y: HIP0.y + bob };
    const near = { x: BB.x + CRANK * Math.cos(t), y: BB.y + CRANK * Math.sin(t) };
    const far = { x: BB.x - CRANK * Math.cos(t), y: BB.y - CRANK * Math.sin(t) };
    poseLeg('near', hip, near);
    poseLeg('far', { x: hip.x - 4, y: hip.y }, far);
  }

  // ---- 动画循环 ----
  let angle = 0, last = null;
  let paused = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const btn = $('toggle'), stage = $('stage');
  function syncUI() {
    btn.textContent = paused ? '▶ 继续' : '❚❚ 暂停';
    stage.classList.toggle('paused', paused);
  }
  function toggle() { paused = !paused; syncUI(); }
  btn.addEventListener('click', toggle);
  $('scene').addEventListener('click', toggle);
  syncUI();

  function frame(ts) {
    if (last === null) last = ts;
    const dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (!paused) angle += dt * 2 * Math.PI / PERIOD;
    render(angle);
    requestAnimationFrame(frame);
  }
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
