<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹈鹕骑自行车</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 60%, #90EE90 60%, #228B22 100%);
            overflow: hidden;
        }
        .scene {
            position: relative;
            width: 100%;
            max-width: 1200px;
        }
        svg {
            width: 100%;
            height: auto;
        }
        /* Clouds */
        .cloud {
            fill: white;
            opacity: 0.9;
        }
        .cloud1 { animation: moveCloud1 25s linear infinite; }
        .cloud2 { animation: moveCloud2 30s linear infinite; }
        .cloud3 { animation: moveCloud3 20s linear infinite; }
        
        @keyframes moveCloud1 {
            from { transform: translateX(-200px); }
            to { transform: translateX(1400px); }
        }
        @keyframes moveCloud2 {
            from { transform: translateX(1400px); }
            to { transform: translateX(-200px); }
        }
        @keyframes moveCloud3 {
            from { transform: translateX(-300px); }
            to { transform: translateX(1500px); }
        }
        
        /* Bicycle wheels rotation */
        .wheel-front, .wheel-rear {
            animation: rotateWheel 0.8s linear infinite;
            transform-origin: center;
        }
        @keyframes rotateWheel {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Pedal animation */
        .pedal-group {
            animation: pedalMove 0.8s linear infinite;
            transform-origin: 350px 380px;
        }
        @keyframes pedalMove {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Pelican body bounce */
        .pelican-riding {
            animation: bounce 0.4s ease-in-out infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }
        
        /* Pelican wing flap */
        .wing {
            animation: flapWing 0.6s ease-in-out infinite alternate;
            transform-origin: right center;
        }
        @keyframes flapWing {
            from { transform: rotate(0deg); }
            to { transform: rotate(-15deg); }
        }
        
        /* Pelican head bob */
        .pelican-head {
            animation: headBob 0.8s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }
        @keyframes headBob {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }
        
        /* Ground movement */
        .ground-pattern {
            animation: groundMove 1s linear infinite;
        }
        @keyframes groundMove {
            from { transform: translateX(0); }
            to { transform: translateX(-100px); }
        }
        
        /* Sun rays */
        .sun-ray {
            animation: sunPulse 2s ease-in-out infinite alternate;
            transform-origin: center;
        }
        @keyframes sunPulse {
            from { opacity: 0.3; transform: scale(0.95); }
            to { opacity: 0.7; transform: scale(1.05); }
        }
        
        /* Flowers */
        .flower {
            animation: sway 2s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }
        .flower:nth-child(odd) { animation-delay: -1s; }
        @keyframes sway {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }
        
        /* Birds in background */
        .bg-bird {
            animation: flyBird 8s linear infinite;
        }
        .bg-bird:nth-child(2) { animation-delay: -3s; }
        .bg-bird:nth-child(3) { animation-delay: -6s; }
        @keyframes flyBird {
            from { transform: translate(-100px, 0); }
            to { transform: translate(1300px, -50px); }
        }
        
        /* Tail feather */
        .tail-feather {
            animation: tailWag 0.8s ease-in-out infinite alternate;
            transform-origin: left center;
        }
        @keyframes tailWag {
            from { transform: rotate(-10deg); }
            to { transform: rotate(10deg); }
        }
    </style>
</head>
<body>
    <div class="scene">
        <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
            <!-- Sky background with gradient -->
            <defs>
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#1E90FF"/>
                    <stop offset="100%" style="stop-color:#87CEEB"/>
                </linearGradient>
                <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFD700"/>
                    <stop offset="100%" style="stop-color:#FFA500"/>
                </radialGradient>
                <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#90EE90"/>
                    <stop offset="100%" style="stop-color:#228B22"/>
                </linearGradient>
            </defs>
            
            <!-- Sun -->
            <circle cx="950" cy="80" r="50" fill="url(#sunGrad)" class="sun-ray"/>
            <circle cx="950" cy="80" r="65" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5" class="sun-ray"/>
            
            <!-- Sun rays -->
            <g class="sun-ray" opacity="0.4">
                <line x1="950" y1="10" x2="950" y2="0" stroke="#FFD700" stroke-width="3"/>
                <line x1="950" y1="150" x2="950" y2="160" stroke="#FFD700" stroke-width="3"/>
                <line x1="880" y1="80" x2="870" y2="80" stroke="#FFD700" stroke-width="3"/>
                <line x1="1020" y1="80" x2="1030" y2="80" stroke="#FFD700" stroke-width="3"/>
                <line x1="900" y1="30" x2="893" y2="23" stroke="#FFD700" stroke-width="3"/>
                <line x1="1000" y1="130" x2="1007" y2="137" stroke="#FFD700" stroke-width="3"/>
                <line x1="900" y1="130" x2="893" y2="137" stroke="#FFD700" stroke-width="3"/>
                <line x1="1000" y1="30" x2="1007" y2="23" stroke="#FFD700" stroke-width="3"/>
            </g>
            
            <!-- Background birds -->
            <g class="bg-bird">
                <path d="M100,100 Q105,90 110,100 Q115,90 120,100" fill="none" stroke="#333" stroke-width="2"/>
            </g>
            <g class="bg-bird" style="animation-delay: -3s;">
                <path d="M200,80 Q205,70 210,80 Q215,70 220,80" fill="none" stroke="#333" stroke-width="2"/>
            </g>
            <g class="bg-bird" style="animation-delay: -6s;">
                <path d="M300,120 Q305,110 310,120 Q315,110 320,120" fill="none" stroke="#333" stroke-width="2"/>
            </g>
            
            <!-- Clouds -->
            <g class="cloud cloud1">
                <ellipse cx="200" cy="120" rx="60" ry="30" class="cloud"/>
                <ellipse cx="240" cy="110" rx="50" ry="25" class="cloud"/>
                <ellipse cx="180" cy="110" rx="40" ry="20" class="cloud"/>
            </g>
            <g class="cloud cloud2">
                <ellipse cx="800" cy="80" rx="70" ry="35" class="cloud"/>
                <ellipse cx="850" cy="70" rx="55" ry="28" class="cloud"/>
                <ellipse cx="780" cy="70" rx="45" ry="22" class="cloud"/>
            </g>
            <g class="cloud cloud3">
                <ellipse cx="500" cy="150" rx="55" ry="28" class="cloud"/>
                <ellipse cx="540" cy="140" rx="45" ry="22" class="cloud"/>
                <ellipse cx="480" cy="140" rx="35" ry="18" class="cloud"/>
            </g>
            
            <!-- Ground -->
            <rect x="0" y="450" width="1200" height="150" fill="url(#groundGrad)"/>
            
            <!-- Road -->
            <rect x="0" y="400" width="1200" height="80" fill="#666" rx="5"/>
            <rect x="0" y="405" width="1200" height="70" fill="#888"/>
            
            <!-- Road lines -->
            <g class="ground-pattern">
                <rect x="50" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
                <rect x="200" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
                <rect x="350" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
                <rect x="500" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
                <rect x="650" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
                <rect x="800" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
                <rect x="950" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
                <rect x="1100" y="435" width="80" height="8" fill="#FFD700" rx="4"/>
            </g>
            
            <!-- Grass details -->
            <g opacity="0.7">
                <path d="M50,450 Q55,430 60,450" fill="#228B22"/>
                <path d="M150,450 Q155,425 160,450" fill="#228B22"/>
                <path d="M300,450 Q305,428 310,450" fill="#228B22"/>
                <path d="M500,450 Q505,432 510,450" fill="#228B22"/>
                <path d="M700,450 Q705,427 710,450" fill="#228B22"/>
                <path d="M900,450 Q905,430 910,450" fill="#228B22"/>
                <path d="M1100,450 Q1105,425 1110,450" fill="#228B22"/>
            </g>
            
            <!-- Flowers on grass -->
            <g class="flower">
                <line x1="100" y1="450" x2="100" y2="420" stroke="#228B22" stroke-width="3"/>
                <circle cx="100" cy="415" r="8" fill="#FF69B4"/>
                <circle cx="100" cy="415" r="3" fill="#FFD700"/>
            </g>
            <g class="flower">
                <line x1="400" y1="450" x2="400" y2="425" stroke="#228B22" stroke-width="3"/>
                <circle cx="400" cy="420" r="7" fill="#FF4500"/>
                <circle cx="400" cy="420" r="3" fill="#FFD700"/>
            </g>
            <g class="flower">
                <line x1="800" y1="450" x2="800" y2="418" stroke="#228B22" stroke-width="3"/>
                <circle cx="800" cy="413" r="9" fill="#9370DB"/>
                <circle cx="800" cy="413" r="3" fill="#FFD700"/>
            </g>
            <g class="flower">
                <line x1="1050" y1="450" x2="1050" y2="422" stroke="#228B22" stroke-width="3"/>
                <circle cx="1050" cy="417" r="7" fill="#FF1493"/>
                <circle cx="1050" cy="417" r="3" fill="#FFD700"/>
            </g>
            
            <!-- TREE on left side -->
            <g>
                <rect x="80" y="300" width="25" height="150" fill="#8B4513"/>
                <ellipse cx="92" cy="280" rx="55" ry="50" fill="#228B22"/>
                <ellipse cx="70" cy="260" rx="35" ry="35" fill="#2E8B57"/>
                <ellipse cx="115" cy="265" rx="30" ry="30" fill="#2E8B57"/>
                <ellipse cx="92" cy="245" rx="25" ry="25" fill="#3CB371"/>
            </g>
            
            <!-- BICYCLE -->
            <g class="bicycle">
                <!-- Rear wheel -->
                <g class="wheel-rear" style="transform-origin: 280px 400px;">
                    <circle cx="280" cy="400" r="45" fill="none" stroke="#333" stroke-width="4"/>
                    <circle cx="280" cy="400" r="4" fill="#666"/>
                    <!-- Spokes -->
                    <line x1="280" y1="355" x2="280" y2="445" stroke="#999" stroke-width="1.5"/>
                    <line x1="235" y1="400" x2="325" y2="400" stroke="#999" stroke-width="1.5"/>
                    <line x1="248" y1="368" x2="312" y2="432" stroke="#999" stroke-width="1.5"/>
                    <line x1="312" y1="368" x2="248" y2="432" stroke="#999" stroke-width="1.5"/>
                </g>
                
                <!-- Front wheel -->
                <g class="wheel-front" style="transform-origin: 450px 400px;">
                    <circle cx="450" cy="400" r="45" fill="none" stroke="#333" stroke-width="4"/>
                    <circle cx="450" cy="400" r="4" fill="#666"/>
                    <!-- Spokes -->
                    <line x1="450" y1="355" x2="450" y2="445" stroke="#999" stroke-width="1.5"/>
                    <line x1="405" y1="400" x2="495" y2="400" stroke="#999" stroke-width="1.5"/>
                    <line x1="418" y1="368" x2="482" y2="432" stroke="#999" stroke-width="1.5"/>
                    <line x1="482" y1="368" x2="418" y2="432" stroke="#999" stroke-width="1.5"/>
                </g>
                
                <!-- Bicycle frame -->
                <!-- Seat tube -->
                <line x1="350" y1="340" x2="330" y2="400" stroke="#FF4500" stroke-width="6" stroke-linecap="round"/>
                <!-- Top tube -->
                <line x1="350" y1="340" x2="420" y2="340" stroke="#FF4500" stroke-width="6" stroke-linecap="round"/>
                <!-- Down tube -->
                <line x1="330" y1="400" x2="420" y2="340" stroke="#FF4500" stroke-width="6" stroke-linecap="round"/>
                <!-- Chain stay -->
                <line x1="330" y1="400" x2="280" y2="400" stroke="#FF4500" stroke-width="5" stroke-linecap="round"/>
                <!-- Seat stay -->
                <line x1="350" y1="340" x2="280" y2="400" stroke="#FF4500" stroke-width="5" stroke-linecap="round"/>
                <!-- Head tube / fork -->
                <line x1="420" y1="340" x2="450" y2="400" stroke="#FF4500" stroke-width="6" stroke-linecap="round"/>
                <line x1="420" y1="340" x2="440" y2="310" stroke="#FF4500" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Handlebars -->
                <path d="M410,305 Q430,295 450,305" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
                <circle cx="410" cy="305" r="4" fill="#333"/>
                <circle cx="450" cy="305" r="4" fill="#333"/>
                
                <!-- Seat -->
                <ellipse cx="350" cy="335" rx="22" ry="6" fill="#333"/>
                
                <!-- Chain and pedal mechanism -->
                <circle cx="330" cy="400" r="12" fill="none" stroke="#666" stroke-width="3"/>
                <g class="pedal-group">
                    <!-- Crank arms -->
                    <line x1="330" y1="400" x2="310" y2="380" stroke="#666" stroke-width="4" stroke-linecap="round"/>
                    <line x1="330" y1="400" x2="350" y2="420" stroke="#666" stroke-width="4" stroke-linecap="round"/>
                    <!-- Pedals -->
                    <rect x="300" y="377" width="18" height="6" fill="#333" rx="2"/>
                    <rect x="342" y="417" width="18" height="6" fill="#333" rx="2"/>
                </g>
                
                <!-- Chain (simplified) -->
                <path d="M330,412 Q305,430 280,412" fill="none" stroke="#555" stroke-width="2"/>
                <path d="M330,388 Q305,370 280,388" fill="none" stroke="#555" stroke-width="2"/>
            </g>
            
            <!-- PELICAN -->
            <g class="pelican-riding">
                <!-- Pelican body -->
                <ellipse cx="355" cy="280" rx="45" ry="35" fill="#F5F5DC"/>
                <ellipse cx="355" cy="285" rx="40" ry="30" fill="#FFFACD"/>
                
                <!-- Wing -->
                <g class="wing">
                    <path d="M330,270 Q290,250 300,290 Q310,310 340,295 Z" fill="#E8E8D0"/>
                    <path d="M335,275 Q300,260 308,288 Q315,305 338,292 Z" fill="#D3D3C3"/>
                </g>
                
                <!-- Tail feather -->
                <g class="tail-feather">
                    <path d="M310,290 Q290,280 285,295 Q290,300 310,295 Z" fill="#E8E8D0"/>
                    <path d="M312,285 Q288,272 282,290 Q288,298 312,290 Z" fill="#D3D3C3"/>
                </g>
                
                <!-- Legs on pedals -->
                <g>
                    <!-- Left leg -->
                    <path d="M345,310 Q340,340 315,380" fill="none" stroke="#FF8C00" stroke-width="6" stroke-linecap="round"/>
                    <!-- Right leg -->
                    <path d="M365,310 Q370,340 355,418" fill="none" stroke="#FF8C00" stroke-width="6" stroke-linecap="round"/>
                    <!-- Feet -->
                    <path d="M310,377 L300,382 L315,385 Z" fill="#FF8C00"/>
                    <path d="M350,415 L340,420 L355,423 Z" fill="#FF8C00"/>
                </g>
                
                <!-- Neck -->
                <path d="M370,265 Q385,230 380,200" fill="none" stroke="#F5F5DC" stroke-width="20"/>
                <path d="M370,265 Q385,230 380,200" fill="none" stroke="#FFFACD" stroke-width="16"/>
                
                <!-- Pelican head -->
                <g class="pelican-head">
                    <!-- Head shape -->
                    <ellipse cx="380" cy="185" rx="22" ry="20" fill="#F5F5DC"/>
                    
                    <!-- Eye -->
                    <circle cx="390" cy="180" r="6" fill="white"/>
                    <circle cx="392" cy="179" r="3" fill="#333"/>
                    <circle cx="393" cy="178" r="1" fill="white"/>
                    
                    <!-- Beak - upper -->
                    <path d="M395,185 L450,190 L440,195 L395,192 Z" fill="#FF8C00"/>
                    <path d="M395,185 L450,190 L445,188 L395,187 Z" fill="#FFA500"/>
                    
                    <!-- Beak - lower with pouch -->
                    <path d="M395,192 Q420,215 440,195 L450,190 L395,190 Z" fill="#FF8C00" opacity="0.9"/>
                    <path d="M395,192 Q415,210 435,195" fill="none" stroke="#CC7000" stroke-width="1"/>
                    
                    <!-- Beak tip -->
                    <path d="M445,188 L455,190 L445,192" fill="#CC5500"/>
                    
                    <!-- Head tuft -->
                    <path d="M370,168 Q375,155 380,165" fill="none" stroke="#E8E8D0" stroke-width="3"/>
                    <path d="M375,170 Q382,152 385,168" fill="none" stroke="#E8E8D0" stroke-width="2.5"/>
                </g>
            </g>
            
            <!-- Basket on front (pelican style!) -->
            <g>
                <rect x="435" y="290" width="35" height="25" fill="#DEB887" rx="3" stroke="#8B7355" stroke-width="2"/>
                <path d="M435,295 L470,295" stroke="#8B7355" stroke-width="1.5"/>
                <path d="M435,305 L470,305" stroke="#8B7355" stroke-width="1.5"/>
                <!-- Fish in basket -->
                <path d="M442,298 Q450,292 458,298 Q455,302 450,302 Q445,302 442,298 Z" fill="#4682B4"/>
                <circle cx="455" cy="297" r="1.5" fill="#333"/>
                <path d="M440,300 L436,303 L440,306" fill="#4682B4"/>
            </g>
            
            <!-- Motion lines -->
            <g opacity="0.3">
                <line x1="200" y1="380" x2="170" y2="380" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="190" y1="395" x2="155" y2="395" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="195" y1="410" x2="165" y2="410" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
                <line x1="210" y1="365" x2="185" y2="365" stroke="#333" stroke-width="2" stroke-dasharray="4,4"/>
            </g>
            
            <!-- Small dust particles -->
            <g opacity="0.2">
                <circle cx="240" cy="440" r="3" fill="#8B7355">
                    <animate attributeName="cx" from="240" to="200" dur="0.5s" repeatCount="indefinite"/>
                    <animate attributeName="cy" from="440" to="430" dur="0.5s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" from="0.3" to="0" dur="0.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="250" cy="445" r="2" fill="#8B7355">
                    <animate attributeName="cx" from="250" to="215" dur="0.4s" repeatCount="indefinite"/>
                    <animate attributeName="cy" from="445" to="435" dur="0.4s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" from="0.3" to="0" dur="0.4s" repeatCount="indefinite"/>
                </circle>
            </g>
            
            <!-- Title text -->
            <text x="600" y="50" text-anchor="middle" font-family="'Comic Sans MS', cursive, sans-serif" font-size="36" fill="#FF4500" stroke="#FFF" stroke-width="1">
                鹈鹕骑自行车 🐦🚲
            </text>
            
            <!-- Fun speech bubble -->
            <g>
                <rect x="460" y="150" width="120" height="45" fill="white" rx="15" stroke="#333" stroke-width="2"/>
                <polygon points="470,195 460,215 480,195" fill="white" stroke="#333" stroke-width="2"/>
                <rect x="468" y="193" width="14" height="5" fill="white"/>
                <text x="520" y="178" text-anchor="middle" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" fill="#333">
                    出发啦！
                </text>
            </g>
        </svg>
    </div>
</body>
</html>
