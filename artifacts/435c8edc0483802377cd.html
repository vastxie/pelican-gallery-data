<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body { margin:0; background:linear-gradient(#87ceeb,#e0f6ff); height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  svg { width:90vw; max-width:900px; height:auto; }
  .ground { fill:#8bc34a; }
  .cloud { fill:#fff; opacity:.85; animation: drift 20s linear infinite; }
  @keyframes drift { from{transform:translateX(900px)} to{transform:translateX(-300px)} }
  .cloud2 { animation-duration: 30s; animation-delay:-10s; }

  .rider { animation: bob 0.5s ease-in-out infinite alternate; transform-origin: 450px 260px; }
  @keyframes bob { from{transform:translateY(0)} to{transform:translateY(-3px)} }

  .wheel { transform-origin: center; animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pedal { transform-origin: 450px 360px; animation: spin 0.6s linear infinite; }

  .leg-l { transform-origin: 435px 300px; animation: pedalL 0.6s linear infinite; }
  .leg-r { transform-origin: 465px 300px; animation: pedalR 0.6s linear infinite; }
  @keyframes pedalL { 0%{transform:rotate(-15deg)} 50%{transform:rotate(20deg)} 100%{transform:rotate(-15deg)} }
  @keyframes pedalR { 0%{transform:rotate(20deg)} 50%{transform:rotate(-15deg)} 100%{transform:rotate(20deg)} }

  .scene { animation: scroll 4s linear infinite; }
  @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-200px)} }
</style>
</head>
<body>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- sky background -->
  <rect width="900" height="420" fill="url(#sky)"/>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#87ceeb"/>
      <stop offset="1" stop-color="#e0f6ff"/>
    </linearGradient>
  </defs>

  <!-- clouds -->
  <ellipse class="cloud" cx="150" cy="80" rx="45" ry="18"/>
  <ellipse class="cloud cloud2" cx="500" cy="120" rx="60" ry="22"/>
  <ellipse class="cloud" cx="750" cy="60" rx="40" ry="15" style="animation-delay:-5s"/>

  <!-- ground -->
  <rect class="ground" y="420" width="900" height="80"/>
  <g class="scene">
    <rect x="0" y="418" width="60" height="4" fill="#5a9e2e"/>
    <rect x="120" y="418" width="60" height="4" fill="#5a9e2e"/>
    <rect x="240" y="418" width="60" height="4" fill="#5a9e2e"/>
    <rect x="360" y="418" width="60" height="4" fill="#5a9e2e"/>
    <rect x="480" y="418" width="60" height="4" fill="#5a9e2e"/>
    <rect x="600" y="418" width="60" height="4" fill="#5a9e2e"/>
    <rect x="720" y="418" width="60" height="4" fill="#5a9e2e"/>
    <rect x="840" y="418" width="60" height="4" fill="#5a9e2e"/>
  </g>

  <!-- Bicycle + pelican group -->
  <g transform="translate(0,0)">
    <!-- Wheels -->
    <g transform="translate(340,390)">
      <circle r="42" fill="none" stroke="#222" stroke-width="5"/>
      <g class="wheel">
        <circle r="42" fill="none" stroke="#444" stroke-width="1"/>
        <line x1="-42" y1="0" x2="42" y2="0" stroke="#666" stroke-width="2"/>
        <line x1="0" y1="-42" x2="0" y2="42" stroke="#666" stroke-width="2"/>
        <line x1="-30" y1="-30" x2="30" y2="30" stroke="#666" stroke-width="2"/>
        <line x1="-30" y1="30" x2="30" y2="-30" stroke="#666" stroke-width="2"/>
        <circle r="6" fill="#333"/>
      </g>
    </g>
    <g transform="translate(560,390)">
      <circle r="42" fill="none" stroke="#222" stroke-width="5"/>
      <g class="wheel">
        <circle r="42" fill="none" stroke="#444" stroke-width="1"/>
        <line x1="-42" y1="0" x2="42" y2="0" stroke="#666" stroke-width="2"/>
        <line x1="0" y1="-42" x2="0" y2="42" stroke="#666" stroke-width="2"/>
        <line x1="-30" y1="-30" x2="30" y2="30" stroke="#666" stroke-width="2"/>
        <line x1="-30" y1="30" x2="30" y2="-30" stroke="#666" stroke-width="2"/>
        <circle r="6" fill="#333"/>
      </g>
    </g>

    <!-- Frame -->
    <line x1="340" y1="390" x2="450" y2="360" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
    <line x1="450" y1="360" x2="560" y2="390" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
    <line x1="450" y1="360" x2="500" y2="280" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
    <line x1="340" y1="390" x2="380" y2="270" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>
    <line x1="560" y1="390" x2="500" y2="280" stroke="#e63946" stroke-width="8" stroke-linecap="round"/>

    <!-- Handlebar -->
    <line x1="370" y1="275" x2="395" y2="260" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="370" y1="275" x2="355" y2="290" stroke="#222" stroke-width="5" stroke-linecap="round"/>

    <!-- Seat -->
    <rect x="485" y="272" width="30" height="8" rx="3" fill="#222"/>

    <!-- Pedal crank -->
    <g class="pedal">
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#222" stroke-width="4"/>
      <circle cx="-18" cy="0" r="5" fill="#333"/>
      <circle cx="18" cy="0" r="5" fill="#333"/>
    </g>
    <circle cx="450" cy="360" r="10" fill="#888" stroke="#333" stroke-width="2"/>

    <!-- Pelican -->
    <g class="rider">
      <!-- Legs -->
      <g class="leg-l">
        <line x1="435" y1="300" x2="440" y2="355" stroke="#f4a261" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g class="leg-r">
        <line x1="465" y1="300" x2="460" y2="355" stroke="#e59147" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- Body -->
      <ellipse cx="470" cy="240" rx="60" ry="45" fill="#fff" stroke="#333" stroke-width="2"/>
      <!-- Wing -->
      <path d="M475 235 Q510 245 500 275 Q470 265 465 245 Z" fill="#f1f1f1" stroke="#333" stroke-width="2"/>

      <!-- Neck -->
      <path d="M430 220 Q400 190 405 160" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
      <path d="M430 220 Q400 190 405 160" fill="none" stroke="#333" stroke-width="2" opacity="0.15"/>

      <!-- Head -->
      <circle cx="405" cy="155" r="26" fill="#fff" stroke="#333" stroke-width="2"/>

      <!-- Eye -->
      <circle cx="395" cy="150" r="4" fill="#222"/>
      <circle cx="394" cy="149" r="1.3" fill="#fff"/>

      <!-- Beak (upper) -->
      <path d="M383 160 Q350 168 340 178 Q355 175 385 172 Z" fill="#f4a261" stroke="#333" stroke-width="1.5"/>
      <!-- Pouch -->
      <path d="M385 172 Q360 195 388 190 Q395 185 390 172 Z" fill="#fbc687" stroke="#333" stroke-width="1.5"/>

      <!-- Little cap for fun -->
      <path d="M390 135 Q405 120 425 135 L423 142 L392 142 Z" fill="#e63946" stroke="#333" stroke-width="1.5"/>
      <circle cx="407" cy="122" r="4" fill="#e63946" stroke="#333" stroke-width="1.5"/>
    </g>
  </g>

  <!-- speed lines -->
  <g stroke="#fff" stroke-width="2" opacity="0.7">
    <line x1="200" y1="300" x2="260" y2="300">
      <animate attributeName="x1" values="200;100" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="260;160" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="340" x2="280" y2="340">
      <animate attributeName="x1" values="220;120" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="280;180" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="180" y1="260" x2="240" y2="260">
      <animate attributeName="x1" values="180;80" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="240;140" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="0.7s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
</body>
</html>
