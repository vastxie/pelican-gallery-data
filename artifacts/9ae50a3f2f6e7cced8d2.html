<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #16242c;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: #f6f1e6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px 16px 32px;
      background:
        radial-gradient(1100px 480px at 50% -8%, #35545f 0%, transparent 58%),
        #16242c;
    }

    h1 {
      font-weight: 600;
      letter-spacing: 0.22em;
      font-size: clamp(13px, 2.2vw, 17px);
      text-transform: uppercase;
      opacity: 0.82;
      margin-bottom: 16px;
    }

    .stage {
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.48),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    svg { display: block; width: 100%; height: 100%; }

    .caption {
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 0.06em;
      opacity: 0.55;
    }

    .scroll-far { animation: pan 46s linear infinite; }
    .scroll-near { animation: pan 11s linear infinite; }
    .scroll-road { animation: pan 5.5s linear infinite; }
    @keyframes pan {
      from { transform: translateX(0); }
      to { transform: translateX(-800px); }
    }

    .cloud-a { animation: drift 24s linear infinite; }
    .cloud-b { animation: drift 33s linear infinite; }
    .cloud-c { animation: drift 19s linear infinite; }
    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-900px); }
    }

    .wave { animation: wave 4.2s ease-in-out infinite; }
    @keyframes wave {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-36px); }
    }

    .sun-glow { animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.92; }
    }

    .rider { animation: ride 0.7s ease-in-out infinite; }
    @keyframes ride {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(1px, 4px); }
    }

    .body-bob {
      animation: body-bob 0.7s ease-in-out infinite;
      transform-origin: 390px 330px;
    }
    @keyframes body-bob {
      0%, 100% { transform: rotate(-1.4deg) translateY(0); }
      50% { transform: rotate(1.6deg) translateY(3px); }
    }

    .head {
      animation: head-nod 0.7s ease-in-out infinite;
      transform-origin: 410px 270px;
    }
    @keyframes head-nod {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(6deg); }
    }

    .pouch {
      animation: pouch 0.7s ease-in-out infinite;
      transform-origin: 500px 268px;
    }
    @keyframes pouch {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.03, 1.1); }
    }

    .wing {
      animation: wing 0.7s ease-in-out infinite;
      transform-origin: 372px 300px;
    }
    @keyframes wing {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-7deg); }
    }

    .tail {
      animation: tail 0.7s ease-in-out infinite;
      transform-origin: 320px 318px;
    }
    @keyframes tail {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }

    .spin-front {
      animation: spin 0.7s linear infinite;
      transform-origin: 538px 418px;
    }
    .spin-rear {
      animation: spin 0.7s linear infinite;
      transform-origin: 322px 418px;
    }
    .spin-crank {
      animation: spin 0.7s linear infinite;
      transform-origin: 430px 398px;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .speed-lines { animation: dash 0.35s linear infinite; }
    @keyframes dash {
      from { opacity: 0.15; transform: translateX(8px); }
      to { opacity: 0.55; transform: translateX(-12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <h1>Pelican on a Bicycle</h1>
  <div class="stage">
    <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕在海边公路上骑自行车">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5eafd8" />
          <stop offset="48%" stop-color="#d4eef8" />
          <stop offset="76%" stop-color="#f6d4aa" />
          <stop offset="100%" stop-color="#efbe86" />
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7ecde0" />
          <stop offset="40%" stop-color="#3b90b6" />
          <stop offset="100%" stop-color="#275f7b" />
        </linearGradient>
        <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f1d7aa" />
          <stop offset="100%" stop-color="#d4ae74" />
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd25a" />
          <stop offset="55%" stop-color="#f0a02e" />
          <stop offset="100%" stop-color="#c45b1f" />
        </linearGradient>
        <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffc3ae" />
          <stop offset="100%" stop-color="#e27868" />
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fffef9" />
          <stop offset="100%" stop-color="#e4d9c8" />
        </linearGradient>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3ad0c4" />
          <stop offset="100%" stop-color="#1a7f79" />
        </linearGradient>
        <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6c8" />
          <stop offset="50%" stop-color="#ffcf6b" />
          <stop offset="100%" stop-color="#f09a3a" stop-opacity="0" />
        </radialGradient>
        <pattern id="lane" width="56" height="10" patternUnits="userSpaceOnUse">
          <rect x="0" y="3" width="32" height="4" rx="2" fill="#f3e6ae" />
        </pattern>
      </defs>

      <rect width="800" height="450" fill="url(#sky)" />
      <circle class="sun-glow" cx="650" cy="88" r="84" fill="url(#sunG)" />
      <circle cx="650" cy="96" r="26" fill="#ffe389" />

      <g class="scroll-far" opacity="0.5" fill="#7eacbf">
        <ellipse cx="90" cy="250" rx="88" ry="16" />
        <ellipse cx="280" cy="254" rx="54" ry="12" />
        <ellipse cx="520" cy="252" rx="96" ry="18" />
        <ellipse cx="730" cy="250" rx="70" ry="14" />
        <ellipse cx="890" cy="250" rx="88" ry="16" />
        <ellipse cx="1080" cy="254" rx="54" ry="12" />
        <ellipse cx="1320" cy="252" rx="96" ry="18" />
        <ellipse cx="1530" cy="250" rx="70" ry="14" />
      </g>

      <g class="cloud-a" fill="#fff" opacity="0.8">
        <g transform="translate(30,50)">
          <ellipse cx="42" cy="20" rx="40" ry="15" /><ellipse cx="72" cy="16" rx="26" ry="16" /><ellipse cx="16" cy="18" rx="18" ry="11" />
        </g>
        <g transform="translate(930,50)">
          <ellipse cx="42" cy="20" rx="40" ry="15" /><ellipse cx="72" cy="16" rx="26" ry="16" /><ellipse cx="16" cy="18" rx="18" ry="11" />
        </g>
      </g>
      <g class="cloud-b" fill="#fff" opacity="0.62">
        <g transform="translate(250,76)"><ellipse cx="48" cy="16" rx="44" ry="13" /><ellipse cx="76" cy="13" rx="22" ry="11" /></g>
        <g transform="translate(1150,76)"><ellipse cx="48" cy="16" rx="44" ry="13" /><ellipse cx="76" cy="13" rx="22" ry="11" /></g>
      </g>
      <g class="cloud-c" fill="#fff" opacity="0.7">
        <g transform="translate(500,38)"><ellipse cx="28" cy="14" rx="28" ry="11" /><ellipse cx="48" cy="12" rx="16" ry="9" /></g>
        <g transform="translate(1400,38)"><ellipse cx="28" cy="14" rx="28" ry="11" /><ellipse cx="48" cy="12" rx="16" ry="9" /></g>
      </g>

      <rect y="256" width="800" height="92" fill="url(#sea)" />
      <g class="wave" fill="none" stroke="#e8f8ff" stroke-width="2" opacity="0.42">
        <path d="M-40 276 Q0 266 40 276 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" />
        <path d="M-20 296 Q20 288 60 296 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0" />
      </g>

      <path d="M0 328 Q200 316 400 326 T800 324 L800 358 L0 358 Z" fill="url(#sand)" />

      <rect y="350" width="800" height="100" fill="#4c555f" />
      <rect y="354" width="800" height="7" fill="#6a7380" />
      <g class="scroll-road"><rect y="398" width="1600" height="6" fill="url(#lane)" /></g>
      <rect y="440" width="800" height="10" fill="#3a424c" />

      <g class="scroll-near">
        <g fill="#4c8a46">
          <g transform="translate(70,348)">
            <ellipse cx="0" cy="4" rx="16" ry="7" fill="#6b9a48" />
            <path d="M-8 4 C -12 -16 -2 2 0 4 M0 4 C 2 -22 8 2 4 4 M8 4 C 16 -12 8 2 6 4" fill="none" stroke="#3f7a3c" stroke-width="2.2" stroke-linecap="round" />
          </g>
          <g transform="translate(210,346)">
            <ellipse cx="0" cy="4" rx="12" ry="6" fill="#6b9a48" />
            <path d="M-6 4 C -8 -12 0 2 2 4 M6 4 C 12 -14 6 2 4 4" fill="none" stroke="#3f7a3c" stroke-width="2" stroke-linecap="round" />
          </g>
          <g transform="translate(470,350)">
            <ellipse cx="0" cy="4" rx="18" ry="7" fill="#6b9a48" />
            <path d="M-10 4 C -16 -18 -2 2 0 4 M0 4 C 4 -24 10 2 6 4 M10 4 C 20 -12 10 2 8 4" fill="none" stroke="#3f7a3c" stroke-width="2.2" stroke-linecap="round" />
          </g>
          <g transform="translate(690,347)">
            <ellipse cx="0" cy="4" rx="14" ry="6" fill="#6b9a48" />
            <path d="M-6 4 C -10 -14 0 2 2 4 M8 4 C 14 -16 8 2 4 4" fill="none" stroke="#3f7a3c" stroke-width="2" stroke-linecap="round" />
          </g>
          <g transform="translate(870,348)">
            <ellipse cx="0" cy="4" rx="16" ry="7" fill="#6b9a48" />
            <path d="M-8 4 C -12 -16 -2 2 0 4 M0 4 C 2 -22 8 2 4 4 M8 4 C 16 -12 8 2 6 4" fill="none" stroke="#3f7a3c" stroke-width="2.2" stroke-linecap="round" />
          </g>
          <g transform="translate(1010,346)">
            <ellipse cx="0" cy="4" rx="12" ry="6" fill="#6b9a48" />
            <path d="M-6 4 C -8 -12 0 2 2 4 M6 4 C 12 -14 6 2 4 4" fill="none" stroke="#3f7a3c" stroke-width="2" stroke-linecap="round" />
          </g>
          <g transform="translate(1270,350)">
            <ellipse cx="0" cy="4" rx="18" ry="7" fill="#6b9a48" />
            <path d="M-10 4 C -16 -18 -2 2 0 4 M0 4 C 4 -24 10 2 6 4 M10 4 C 20 -12 10 2 8 4" fill="none" stroke="#3f7a3c" stroke-width="2.2" stroke-linecap="round" />
          </g>
          <g transform="translate(1490,347)">
            <ellipse cx="0" cy="4" rx="14" ry="6" fill="#6b9a48" />
            <path d="M-6 4 C -10 -14 0 2 2 4 M8 4 C 14 -16 8 2 4 4" fill="none" stroke="#3f7a3c" stroke-width="2" stroke-linecap="round" />
          </g>
        </g>
      </g>

      <g class="rider">
        <ellipse cx="430" cy="438" rx="122" ry="10" fill="#262d34" opacity="0.38" />

        <!-- rear wheel -->
        <g class="spin-rear">
          <circle cx="322" cy="418" r="44" fill="#1b2127" />
          <circle cx="322" cy="418" r="36" fill="#4c555f" />
          <circle cx="322" cy="418" r="33" fill="none" stroke="#d5e0e8" stroke-width="1.5" />
          <g stroke="#cfd8df" stroke-width="1.35">
            <line x1="322" y1="418" x2="322" y2="385" />
            <line x1="322" y1="418" x2="322" y2="451" />
            <line x1="322" y1="418" x2="289" y2="418" />
            <line x1="322" y1="418" x2="355" y2="418" />
            <line x1="322" y1="418" x2="299" y2="395" />
            <line x1="322" y1="418" x2="345" y2="441" />
            <line x1="322" y1="418" x2="345" y2="395" />
            <line x1="322" y1="418" x2="299" y2="441" />
          </g>
          <circle cx="322" cy="418" r="36" fill="none" stroke="#22292f" stroke-width="7" />
          <circle cx="322" cy="418" r="8" fill="#1b2127" />
          <circle cx="322" cy="418" r="3.4" fill="#e8eef2" />
        </g>

        <!-- front wheel -->
        <g class="spin-front">
          <circle cx="538" cy="418" r="44" fill="#1b2127" />
          <circle cx="538" cy="418" r="36" fill="#4c555f" />
          <circle cx="538" cy="418" r="33" fill="none" stroke="#d5e0e8" stroke-width="1.5" />
          <g stroke="#cfd8df" stroke-width="1.35">
            <line x1="538" y1="418" x2="538" y2="385" />
            <line x1="538" y1="418" x2="538" y2="451" />
            <line x1="538" y1="418" x2="505" y2="418" />
            <line x1="538" y1="418" x2="571" y2="418" />
            <line x1="538" y1="418" x2="515" y2="395" />
            <line x1="538" y1="418" x2="561" y2="441" />
            <line x1="538" y1="418" x2="561" y2="395" />
            <line x1="538" y1="418" x2="515" y2="441" />
          </g>
          <circle cx="538" cy="418" r="36" fill="none" stroke="#22292f" stroke-width="7" />
          <circle cx="538" cy="418" r="8" fill="#1b2127" />
          <circle cx="538" cy="418" r="3.4" fill="#e8eef2" />
        </g>

        <!-- chain -->
        <path d="M414 398 C 384 398, 348 408, 330 418" fill="none" stroke="#2a333b" stroke-width="3.2" />
        <path d="M430 414 C 392 430, 350 430, 322 422" fill="none" stroke="#2a333b" stroke-width="3.2" />

        <!-- frame -->
        <g fill="none" stroke="url(#frame)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M322 418 L 394 336 L 490 336 L 538 418" />
          <path d="M394 336 L 430 398 L 322 418" />
          <path d="M430 398 L 490 336" />
        </g>
        <path d="M328 410 L 396 342 L 486 342 L 532 410" fill="none" stroke="#145e5a" stroke-width="2.4" opacity="0.28" stroke-linecap="round" />

        <path d="M538 418 L 502 308" fill="none" stroke="#1c6e69" stroke-width="7" stroke-linecap="round" />
        <path d="M486 306 C 508 288, 550 288, 572 310" fill="none" stroke="#1c6e69" stroke-width="8" stroke-linecap="round" />
        <circle cx="490" cy="306" r="6" fill="#102f2d" />
        <circle cx="568" cy="310" r="6" fill="#102f2d" />
        <path d="M394 336 L 390 324" stroke="#1c6e69" stroke-width="6" stroke-linecap="round" />
        <ellipse cx="388" cy="322" rx="28" ry="8.5" fill="#2a221a" transform="rotate(-14 388 322)" />

        <!-- crank / chainring / pedals -->
        <g class="spin-crank">
          <circle cx="430" cy="398" r="17" fill="none" stroke="#2a333b" stroke-width="5" />
          <circle cx="430" cy="398" r="7" fill="#1b2127" />
          <g stroke="#8d99a3" stroke-width="1.5">
            <line x1="430" y1="398" x2="430" y2="383" />
            <line x1="430" y1="398" x2="443" y2="406" />
            <line x1="430" y1="398" x2="417" y2="406" />
          </g>
          <line x1="430" y1="366" x2="430" y2="430" stroke="#1b2127" stroke-width="5.5" stroke-linecap="round" />
          <rect x="417" y="426" width="26" height="9" rx="2.5" fill="#d2ab6c" />
          <rect x="417" y="361" width="26" height="9" rx="2.5" fill="#d2ab6c" />
        </g>

        <!-- pelican -->
        <g class="body-bob">
          <g class="tail">
            <path d="M318 316 Q 282 304 268 326 Q 292 338 322 328 Z" fill="#f4eee5" stroke="#d3c6b3" stroke-width="1.4" />
            <path d="M316 322 Q 294 316 286 328" fill="none" stroke="#cbbba6" stroke-width="1.2" />
          </g>

          <ellipse cx="368" cy="310" rx="64" ry="40" fill="url(#body)" transform="rotate(-20 368 310)" />
          <ellipse cx="348" cy="318" rx="30" ry="16" fill="#f8f3eb" transform="rotate(-32 348 318)" />

          <!-- far wing -->
          <path d="M348 298 Q 400 268 452 292 Q 422 310 364 312 Z" fill="#ebe3d6" />

          <!-- near wing gripping bars -->
          <g class="wing">
            <path d="M356 300 Q 430 262 508 298 Q 478 324 384 318 Z" fill="#fffaf2" stroke="#d5c7b3" stroke-width="1.4" />
            <path d="M392 298 Q 438 282 490 298" fill="none" stroke="#d0c0ab" stroke-width="1.15" />
            <path d="M396 308 Q 442 294 494 308" fill="none" stroke="#d0c0ab" stroke-width="1.15" />
          </g>

          <!-- far (rear) leg -->
          <path fill="none" stroke="#c48a28" stroke-width="7" stroke-linecap="round">
            <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
              values="M392 334 C 408 348 418 360 430 366;
                      M392 334 C 404 356 412 384 398 398;
                      M392 334 C 404 360 414 392 430 430;
                      M392 334 C 418 360 440 384 462 398;
                      M392 334 C 408 348 418 360 430 366" />
          </path>
          <ellipse fill="#c48a28" rx="11" ry="5.5">
            <animate attributeName="cx" dur="0.7s" repeatCount="indefinite" values="430;398;430;462;430" />
            <animate attributeName="cy" dur="0.7s" repeatCount="indefinite" values="366;398;430;398;366" />
          </ellipse>

          <!-- near (front) leg, 180° out of phase -->
          <path fill="none" stroke="#e2b14a" stroke-width="8" stroke-linecap="round">
            <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
              values="M400 336 C 412 360 422 392 430 430;
                      M400 336 C 424 360 446 384 462 398;
                      M400 336 C 414 348 422 360 430 366;
                      M400 336 C 410 356 418 384 398 398;
                      M400 336 C 412 360 422 392 430 430" />
          </path>
          <ellipse fill="#e2b14a" rx="12" ry="6">
            <animate attributeName="cx" dur="0.7s" repeatCount="indefinite" values="430;462;430;398;430" />
            <animate attributeName="cy" dur="0.7s" repeatCount="indefinite" values="430;398;366;398;430" />
          </ellipse>

          <g class="head">
            <path d="M398 284 C 414 246 436 232 458 246" fill="none" stroke="#efe8dc" stroke-width="18" stroke-linecap="round" />
            <path d="M398 284 C 414 246 436 232 458 246" fill="none" stroke="#fffdf8" stroke-width="11" stroke-linecap="round" />

            <g class="pouch">
              <path d="M454 256 Q 492 300 546 278 Q 512 246 458 248 Z" fill="url(#pouchG)" />
              <path d="M466 260 Q 502 284 534 274" fill="none" stroke="#c45f52" stroke-width="1.3" opacity="0.45" />
            </g>

            <ellipse cx="462" cy="240" rx="27" ry="22" fill="#fffdf8" />
            <path d="M474 234 L 582 248 L 476 258 Q 482 244 474 234 Z" fill="url(#beak)" />
            <path d="M474 234 L 582 248 L 476 246 Z" fill="#ffd25a" opacity="0.85" />
            <path d="M476 246 L 568 250" stroke="#c97a22" stroke-width="1.5" />
            <circle cx="578" cy="248" r="3.4" fill="#c24d24" />
            <circle cx="472" cy="236" r="6.8" fill="#1c2430" />
            <circle cx="474.2" cy="234.2" r="2.3" fill="#fff" />
            <path d="M456 226 Q 466 218 478 224" fill="none" stroke="#1c2430" stroke-width="2.1" stroke-linecap="round" />
            <path d="M444 226 Q 430 210 450 220" fill="none" stroke="#efe8dc" stroke-width="7" stroke-linecap="round" />
          </g>
        </g>

        <g class="speed-lines" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
          <line x1="248" y1="388" x2="198" y2="388" />
          <line x1="242" y1="404" x2="184" y2="404" />
          <line x1="256" y1="372" x2="220" y2="372" />
        </g>
      </g>
    </svg>
  </div>
  <p class="caption">海边公路 · 鹈鹕蹬车兜风</p>
</body>
</html>
