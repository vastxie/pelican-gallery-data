<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e6;color:#233c39;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1160px;margin:auto;padding:44px 28px 24px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:3px;color:#71817a;font-weight:700}h1{font-size:clamp(30px,5vw,52px);font-weight:600;letter-spacing:-2px;margin:9px 0 10px}p{font-size:14px;color:#6b7b73;margin:0;line-height:1.8}.badge{font-size:11px;letter-spacing:2px;border:1px solid #bcc6b5;border-radius:24px;padding:11px 16px;white-space:nowrap}.scene{position:relative;overflow:hidden;border-radius:24px;background:#d6e9df;box-shadow:0 18px 50px #38564a12;border:1px solid #fff}svg{width:100%;height:auto;display:block}.label{position:absolute;top:24px;left:28px;font-size:11px;letter-spacing:2px;color:#547b71}.panel{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:24px}.controls{display:flex;align-items:center;gap:16px}button{border:0;border-radius:30px;background:#254d43;color:#fff;padding:13px 22px;font:inherit;font-size:13px;cursor:pointer;min-width:102px}button:hover{background:#376658}button:focus-visible,input:focus-visible{outline:3px solid #e9a34d;outline-offset:4px}label{display:flex;align-items:center;gap:10px;font-size:12px;color:#6b7b73}input{width:100px;accent-color:#315d4e}.note{font-size:11px;letter-spacing:1px;color:#8d968b}.moving{animation-play-state:running}body.paused .moving{animation-play-state:paused!important}.far{animation:slide 24s linear infinite}.near{animation:slide 9s linear infinite}.road{animation:slide 2s linear infinite}.wheel{animation:spin 1.5s linear infinite;transform-box:fill-box;transform-origin:center}.rider{animation:bob 1.5s ease-in-out infinite}.scarf{animation:flutter .75s ease-in-out infinite;transform-origin:577px 234px}.cloud{animation:slide 65s linear infinite}.bird{animation:soar 5s ease-in-out infinite}@keyframes slide{to{transform:translateX(-1200px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes flutter{50%{transform:rotate(-5deg)}}@keyframes soar{50%{transform:translateY(-7px)}}@media(max-width:600px){main{padding:28px 16px}header{align-items:start}.badge{display:none}.panel{align-items:start;flex-direction:column;gap:16px}.label{top:15px;left:18px;font-size:9px}.controls{gap:12px}h1{letter-spacing:-1px}.scene{border-radius:16px}}@media(prefers-reduced-motion:reduce){.moving{animation-play-state:paused}}

<body><main>
<header><div><div class="eyebrow">A LITTLE COASTAL ESCAPE · 01</div><h1>海风，刚刚好。</h1><p>一只鹈鹕，一辆单车，一段不着急的旅程。</p></div><div class="badge">SVG · 2D 动画</div></header>

</div>
<div class="panel"><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停旅程</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speedText">1×</output></label></div><span class="note">慢一点，也能抵达。 / ENJOY THE RIDE</span></div>
</main>
<script>
const toggle=document.getElementById('toggle'),slider=document.getElementById('speed');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,phase=0,last=0;
const moving=[...document.querySelectorAll('.moving')];
const durations=moving.map(el=>parseFloat(getComputedStyle(el).animationDuration));
function sync(){document.body.classList.toggle('paused',paused);toggle.textContent=paused?'继续旅程':'暂停旅程';toggle.setAttribute('aria-pressed',String(paused));moving.forEach(el=>el.style.animationPlayState=paused?'paused':'running');}
toggle.addEventListener('click',()=>{paused=!paused;sync();});
slider.addEventListener('input',()=>{speed=Number(slider.value);document.getElementById('speedText').value=speed+'×';moving.forEach((el,i)=>el.style.animationDuration=durations[i]/speed+'s');});
const near=document.getElementById('nearLeg'),far=document.getElementById('farLeg'),foot=document.getElementById('foot');
function tick(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!paused)phase+=dt*speed*Math.PI*2/1.5;
const x=588+24*Math.cos(phase),y=454+24*Math.sin(phase),fx=1176-x,fy=908-y;
near.setAttribute('d',`M559 340L${590+19*Math.cos(phase-.6)} ${392+10*Math.sin(phase)}L${x} ${y}`);
far.setAttribute('d',`M545 340L${549+18*Math.cos(phase+2)} ${394+9*Math.sin(phase+2)}L${fx} ${fy}`);
foot.setAttribute('d',`M${x-9} ${y}l27 1-9-8`);
document.getElementById('crankLine').setAttribute('d',`M${fx} ${fy}L${x} ${y}`);
document.getElementById('pedalNear').setAttribute('d',`M${x-9} ${y+3}h20`);
document.getElementById('pedalFar').setAttribute('d',`M${fx-9} ${fy+3}h20`);
requestAnimationFrame(tick);}
sync();requestAnimationFrame(tick);
</script>
</body></html>
