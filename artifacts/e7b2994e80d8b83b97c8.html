<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  :root {
    --sky-top: #aee7ff;
    --sky-bottom: #ffe9c7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    background: #0d1b2a;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: 100%; height: 100%; display: block; }
  .title {
    position: absolute;
    top: 22px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffffff;
    letter-spacing: 2px;
    font-size: clamp(16px, 2.4vw, 26px);
    text-shadow: 0 2px 10px rgba(0,0,0,.35);
    pointer-events: none;
    z-index: 2;
  }
  .title small { display:block; font-size:.6em; opacity:.8; letter-spacing:4px; margin-top:4px; }

  /* ---------- Animations ---------- */

  /* Wheels spin */
  .wheel-spin { animation: spin 0.7s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Whole rig bobbing up & down for a lively ride */
  #rider-rig { animation: bob 0.7s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  /* Pedals + crank rotation */
  #crank { animation: spin 0.7s linear infinite; transform-origin: 0px 0px; }

  /* Legs pedaling — two legs alternate */
  #leg-front { animation: pedalFront 0.7s linear infinite; transform-origin: 0px 0px; }
  #leg-back  { animation: pedalBack  0.7s linear infinite; transform-origin: 0px 0px; }
  @keyframes pedalFront {
    0%   { transform: rotate(10deg); }
    50%  { transform: rotate(-10deg); }
    100% { transform: rotate(10deg); }
  }
  @keyframes pedalBack {
    0%   { transform: rotate(-10deg); }
    50%  { transform: rotate(10deg); }
    100% { transform: rotate(-10deg); }
  }

  /* Pouch/beak subtle wobble */
  #head-group { animation: headBob 1.4s ease-in-out infinite; transform-origin: 250px 150px; }
  @keyframes headBob {
    0%,100% { transform: rotate(0deg); }
    50%     { transform: rotate(2.5deg); }
  }

  /* Scarf flutter */
  .scarf { animation: flutter 0.7s ease-in-out infinite; transform-origin: 232px 168px; }
  @keyframes flutter {
    0%,100% { transform: rotate(0deg) skewX(0deg); }
    50%     { transform: rotate(-6deg) skewX(-8deg); }
  }

  /* Scrolling background layers */
  .scroll-far  { animation: scroll 12s linear infinite; }
  .scroll-mid  { animation: scroll 6s  linear infinite; }
  .scroll-near { animation: scroll 3s  linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-400px); } }

  /* Clouds drift */
  .cloud { animation: drift 20s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-900px); } }

  /* Sun rays pulse */
  #rays { animation: pulse 4s ease-in-out infinite; transform-origin: 720px 110px; }
  @keyframes pulse { 0%,100% { opacity:.55; transform: scale(1); } 50% { opacity:.9; transform: scale(1.06);} }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="title">鹈鹕骑自行车<small>PELICAN ON A BICYCLE</small></div>
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#aee7ff"/>
          <stop offset="60%" stop-color="#d8f1ff"/>
          <stop offset="100%" stop-color="#ffe9c7"/>
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#8fd06b"/>
          <stop offset="100%" stop-color="#5aa63e"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#5c5c66"/>
          <stop offset="100%" stop-color="#3f3f47"/>
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e6ecf2"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#ffcf5c"/>
          <stop offset="100%" stop-color="#ff9f1c"/>
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#ffb547"/>
          <stop offset="100%" stop-color="#ff7f11"/>
        </linearGradient>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stop-color="#fff6c9"/>
          <stop offset="100%" stop-color="#ffd452"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3"/>
        </filter>
      </defs>

      <!-- Sky -->
      <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

      <!-- Sun -->
      <g>
        <g id="rays" stroke="#ffe27a" stroke-width="6" stroke-linecap="round" opacity=".7">
          <line x1="720" y1="40"  x2="720" y2="12"/>
          <line x1="720" y1="180" x2="720" y2="208"/>
          <line x1="650" y1="110" x2="622" y2="110"/>
          <line x1="790" y1="110" x2="818" y2="110"/>
          <line x1="670" y1="60"  x2="650" y2="40"/>
          <line x1="770" y1="60"  x2="790" y2="40"/>
          <line x1="670" y1="160" x2="650" y2="180"/>
          <line x1="770" y1="160" x2="790" y2="180"/>
        </g>
        <circle cx="720" cy="110" r="46" fill="url(#sun)"/>
      </g>

      <!-- Clouds -->
      <g fill="#ffffff" opacity=".9">
        <g class="cloud">
          <ellipse cx="150" cy="90" rx="46" ry="26"/>
          <ellipse cx="190" cy="80" rx="38" ry="24"/>
          <ellipse cx="110" cy="80" rx="34" ry="22"/>
          <ellipse cx="520" cy="140" rx="40" ry="22"/>
          <ellipse cx="558" cy="132" rx="32" ry="20"/>
          <ellipse cx="980" cy="95" rx="44" ry="24"/>
          <ellipse cx="1020" cy="86" rx="36" ry="22"/>
        </g>
      </g>

      <!-- Far hills (parallax) -->
      <g class="scroll-far">
        <path d="M0,330 Q120,270 240,320 T480,320 T720,315 T960,320 T1200,320 V500 H0 Z" fill="#8ad0a6" opacity=".7"/>
      </g>
      <!-- Mid trees (parallax) -->
      <g class="scroll-mid">
        <g fill="#6bbf59">
          <circle cx="120" cy="330" r="26"/><circle cx="150" cy="322" r="22"/><rect x="126" y="330" width="8" height="26" fill="#7a5230"/>
          <circle cx="420" cy="335" r="24"/><circle cx="448" cy="328" r="20"/><rect x="426" y="335" width="8" height="24" fill="#7a5230"/>
          <circle cx="720" cy="332" r="26"/><circle cx="750" cy="324" r="22"/><rect x="726" y="332" width="8" height="26" fill="#7a5230"/>
          <circle cx="1020" cy="330" r="26"/><circle cx="1050" cy="322" r="22"/><rect x="1026" y="330" width="8" height="26" fill="#7a5230"/>
        </g>
      </g>

      <!-- Ground -->
      <rect x="0" y="350" width="800" height="150" fill="url(#ground)"/>
      <!-- Road -->
      <rect x="0" y="392" width="800" height="70" fill="url(#road)"/>
      <!-- Road dashes (parallax) -->
      <g class="scroll-near">
        <g fill="#ffd93b">
          <rect x="0"   y="424" width="60" height="8" rx="4"/>
          <rect x="120" y="424" width="60" height="8" rx="4"/>
          <rect x="240" y="424" width="60" height="8" rx="4"/>
          <rect x="360" y="424" width="60" height="8" rx="4"/>
          <rect x="480" y="424" width="60" height="8" rx="4"/>
          <rect x="600" y="424" width="60" height="8" rx="4"/>
          <rect x="720" y="424" width="60" height="8" rx="4"/>
          <rect x="840" y="424" width="60" height="8" rx="4"/>
        </g>
      </g>

      <!-- ====================== RIDER + BICYCLE ====================== -->
      <!-- Positioned around center; internal coords ~ (150..340, 200..430) -->
      <g id="rider-rig">
        <!-- Ground shadow -->
        <ellipse cx="248" cy="432" rx="120" ry="14" fill="#000000" opacity=".18" filter="url(#soft)"/>

        <!-- ===== Bicycle ===== -->
        <g id="bicycle" fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round">
          <!-- Back wheel -->
          <g transform="translate(180,395)">
            <circle r="46" fill="#1b1b1f" stroke="#2b2b33" stroke-width="6"/>
            <circle r="46" fill="none" stroke="#111" stroke-width="3"/>
            <g class="wheel-spin" stroke="#d7d7de" stroke-width="2.5">
              <line x1="-42" y1="0" x2="42" y2="0"/>
              <line x1="0" y1="-42" x2="0" y2="42"/>
              <line x1="-30" y1="-30" x2="30" y2="30"/>
              <line x1="-30" y1="30" x2="30" y2="-30"/>
              <circle r="7" fill="#888" stroke="none"/>
            </g>
          </g>
          <!-- Front wheel -->
          <g transform="translate(340,395)">
            <circle r="46" fill="#1b1b1f" stroke="#2b2b33" stroke-width="6"/>
            <circle r="46" fill="none" stroke="#111" stroke-width="3"/>
            <g class="wheel-spin" stroke="#d7d7de" stroke-width="2.5">
              <line x1="-42" y1="0" x2="42" y2="0"/>
              <line x1="0" y1="-42" x2="0" y2="42"/>
              <line x1="-30" y1="-30" x2="30" y2="30"/>
              <line x1="-30" y1="30" x2="30" y2="-30"/>
              <circle r="7" fill="#888" stroke="none"/>
            </g>
          </g>

          <!-- Frame -->
          <line x1="180" y1="395" x2="260" y2="395"/>  <!-- chain stay (bottom bracket) -->
          <line x1="260" y1="395" x2="230" y2="300"/>  <!-- seat tube -->
          <line x1="180" y1="395" x2="230" y2="300"/>  <!-- seat stay -->
          <line x1="260" y1="395" x2="322" y2="315"/>  <!-- down tube to head -->
          <line x1="230" y1="300" x2="322" y2="315"/>  <!-- top tube -->
          <!-- Fork -->
          <line x1="322" y1="315" x2="340" y2="395"/>
          <!-- Handlebar stem + bar -->
          <line x1="322" y1="315" x2="330" y2="292"/>
          <line x1="330" y1="292" x2="352" y2="286" stroke="#7f2018"/>
          <line x1="330" y1="292" x2="312" y2="298" stroke="#7f2018"/>
          <!-- Seat -->
          <path d="M212,298 Q230,290 248,298" stroke="#3a2b20" stroke-width="9"/>
        </g>

        <!-- Crank + pedals (rotates) -->
        <g transform="translate(260,395)">
          <circle r="10" fill="#2b2b33" stroke="#555" stroke-width="2"/>
          <g id="crank">
            <line x1="0" y1="0" x2="0" y2="26" stroke="#2b2b33" stroke-width="6" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="0" y2="-26" stroke="#2b2b33" stroke-width="6" stroke-linecap="round"/>
            <rect x="-9" y="24" width="18" height="7" rx="3" fill="#111"/>
            <rect x="-9" y="-31" width="18" height="7" rx="3" fill="#111"/>
          </g>
        </g>

        <!-- ===== Pelican ===== -->
        <!-- Legs (behind body): pedaling -->
        <g stroke="#ff9f1c" stroke-width="11" stroke-linecap="round" fill="none">
          <!-- back leg: hip ~ (236,300) to pedal top area -->
          <g id="leg-back" transform="translate(236,300)">
            <path d="M0,0 L8,44 L24,96"/>
            <!-- webbed foot -->
            <path d="M24,96 l16,6 M24,96 l14,-2" stroke-width="7"/>
          </g>
          <g id="leg-front" transform="translate(240,302)">
            <path d="M0,0 L12,44 L28,96"/>
            <path d="M28,96 l16,6 M28,96 l14,-2" stroke-width="7"/>
          </g>
        </g>

        <!-- Body -->
        <g>
          <!-- Tail -->
          <path d="M186,262 Q150,258 138,278 Q168,278 196,272 Z" fill="#dfe6ec" stroke="#c7d0d8" stroke-width="2"/>
          <!-- Main body / belly sitting on seat -->
          <path d="M196,300
                   Q182,250 216,230
                   Q250,214 276,238
                   Q300,262 286,300
                   Q248,320 196,300 Z"
                fill="url(#body)" stroke="#cfd8e0" stroke-width="2.5"/>

          <!-- Wing (near side) doing a wave/holding bar -->
          <path id="wing"
                d="M250,250
                   Q292,240 318,296
                   Q300,300 286,286
                   Q272,300 250,290
                   Q244,268 250,250 Z"
                fill="#eef3f7" stroke="#cfd8e0" stroke-width="2.5"/>
          <!-- Wing feather lines -->
          <g stroke="#c2ccd4" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M262,262 Q286,262 300,286"/>
            <path d="M258,274 Q282,276 294,292"/>
          </g>
        </g>

        <!-- Scarf -->
        <g class="scarf">
          <path d="M226,262 Q246,270 264,264 L262,276 Q244,282 224,274 Z" fill="#e63946"/>
          <path d="M226,272 Q214,286 196,290 L192,300 Q214,298 232,284 Z" fill="#c92f3c"/>
        </g>

        <!-- Head + neck + beak -->
        <g id="head-group">
          <!-- Neck -->
          <path d="M232,244 Q236,208 250,190 Q262,178 258,214 Q252,240 246,252 Z"
                fill="url(#body)" stroke="#cfd8e0" stroke-width="2.5"/>
          <!-- Head -->
          <circle cx="252" cy="168" r="30" fill="url(#body)" stroke="#cfd8e0" stroke-width="2.5"/>

          <!-- Upper beak -->
          <path d="M276,158 Q338,150 356,164 Q340,170 300,176 Q280,178 276,168 Z"
                fill="url(#beak)" stroke="#e08a17" stroke-width="2"/>
          <!-- Pouch (lower beak) -->
          <path d="M278,172 Q330,182 352,166 Q346,196 306,204 Q282,206 278,186 Z"
                fill="url(#pouch)" stroke="#e07a10" stroke-width="2"/>
          <!-- Fish peeking out :) -->
          <g transform="translate(340,188)">
            <ellipse cx="0" cy="0" rx="9" ry="5" fill="#8ecae6"/>
            <path d="M8,0 l8,-5 l0,10 Z" fill="#8ecae6"/>
            <circle cx="-3" cy="-1" r="1.5" fill="#023047"/>
          </g>

          <!-- Eye -->
          <circle cx="258" cy="160" r="7.5" fill="#ffffff" stroke="#cfd8e0"/>
          <circle cx="260" cy="161" r="4.5" fill="#1b2733"/>
          <circle cx="262" cy="159" r="1.6" fill="#ffffff"/>
          <!-- brow -->
          <path d="M246,148 Q258,142 270,148" stroke="#c2ccd4" stroke-width="2.5" fill="none" stroke-linecap="round"/>

          <!-- Little cap for character -->
          <path d="M232,150 Q250,128 274,146 Q252,146 232,152 Z" fill="#457b9d"/>
          <rect x="228" y="150" width="16" height="5" rx="2" fill="#1d3557"/>
        </g>
      </g>
      <!-- ==================== /RIDER + BICYCLE ==================== -->

      <!-- Foreground grass tufts (parallax near) -->
      <g class="scroll-near" fill="#4f9e37">
        <path d="M60,462 q6,-20 12,0 q6,-24 12,0 q6,-18 12,0 Z"/>
        <path d="M300,466 q6,-20 12,0 q6,-24 12,0 q6,-18 12,0 Z"/>
        <path d="M560,462 q6,-20 12,0 q6,-24 12,0 q6,-18 12,0 Z"/>
        <path d="M820,466 q6,-20 12,0 q6,-24 12,0 q6,-18 12,0 Z"/>
      </g>
    </svg>
  </div>
</body>
</html>
