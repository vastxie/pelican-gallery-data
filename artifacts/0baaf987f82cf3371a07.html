<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #87ceeb;
      --sky-bottom: #e0f4ff;
      --ground: #7ec850;
      --road: #5a5a5a;
      --road-line: #f5f5f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: #e8f4ff;
      padding: 1.5rem;
    }

    h1 {
      font-weight: 600;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .stage {
      width: min(920px, 100%);
      aspect-ratio: 16 / 10;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #87ceeb;
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Cloud drift */
    .cloud {
      animation: drift 28s linear infinite;
    }

    .cloud.slow {
      animation-duration: 42s;
      animation-delay: -12s;
    }

    .cloud.fast {
      animation-duration: 18s;
      animation-delay: -5s;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-1200px); }
    }

    /* Road dashes scrolling */
    .road-dash {
      animation: scroll-dash 0.8s linear infinite;
    }

    @keyframes scroll-dash {
      from { transform: translateX(0); }
      to { transform: translateX(-80px); }
    }

    /* Grass sway suggestion via repeating pattern scroll */
    .ground-pattern {
      animation: scroll-ground 2.4s linear infinite;
    }

    @keyframes scroll-ground {
      from { transform: translateX(0); }
      to { transform: translateX(-60px); }
    }

    /* Whole rider bob */
    .rider {
      animation: bob 0.45s ease-in-out infinite alternate;
      transform-origin: 420px 320px;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(4px); }
    }

    /* Wheel spin */
    .wheel-spin {
      animation: spin 0.7s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Pedal crank */
    .crank {
      animation: spin 0.7s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Legs linked to pedaling feel */
    .leg-near {
      animation: pedal-near 0.7s ease-in-out infinite;
      transform-origin: 398px 278px;
    }

    .leg-far {
      animation: pedal-far 0.7s ease-in-out infinite;
      transform-origin: 390px 276px;
    }

    @keyframes pedal-near {
      0% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
      100% { transform: rotate(-18deg); }
    }

    @keyframes pedal-far {
      0% { transform: rotate(22deg); }
      50% { transform: rotate(-18deg); }
      100% { transform: rotate(22deg); }
    }

    /* Wing flap */
    .wing {
      animation: flap 0.9s ease-in-out infinite alternate;
      transform-origin: 455px 230px;
    }

    @keyframes flap {
      from { transform: rotate(0deg); }
      to { transform: rotate(-14deg); }
    }

    /* Beak / head slight nod */
    .head-group {
      animation: nod 1.2s ease-in-out infinite alternate;
      transform-origin: 470px 215px;
    }

    @keyframes nod {
      from { transform: rotate(-2deg); }
      to { transform: rotate(3deg); }
    }

    /* Sun glow pulse */
    .sun-glow {
      animation: pulse 3s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.35; }
      to { opacity: 0.55; }
    }
  </style>
</head>
<body>
  <h1>鹈鹕骑自行车</h1>
  <div class="stage" role="img" aria-label="卡通鹈鹕骑着自行车在路上前进的动画">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6ec6f0" />
          <stop offset="55%" stop-color="#b8e4f8" />
          <stop offset="100%" stop-color="#dff3ff" />
        </linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8fd46a" />
          <stop offset="100%" stop-color="#5fad45" />
        </linearGradient>
        <linearGradient id="pelican-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="100%" stop-color="#e8eef5" />
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f4a261" />
          <stop offset="100%" stop-color="#e76f51" />
        </linearGradient>
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff7b2" />
          <stop offset="60%" stop-color="#ffd166" />
          <stop offset="100%" stop-color="#ffb703" />
        </radialGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.18" />
        </filter>
      </defs>

      <!-- Sky -->
      <rect width="800" height="500" fill="url(#sky)" />

      <!-- Sun -->
      <circle class="sun-glow" cx="680" cy="90" r="52" fill="#ffd166" opacity="0.4" />
      <circle cx="680" cy="90" r="34" fill="url(#sunGrad)" />

      <!-- Distant hills -->
      <path d="M0 320 C80 280 140 300 220 270 C300 240 360 290 450 265 C540 240 600 280 680 255 C740 238 780 260 800 250 L800 360 L0 360 Z" fill="url(#hill)" opacity="0.85" />
      <path d="M0 340 C100 310 180 330 280 305 C380 280 460 320 560 300 C640 285 720 310 800 295 L800 380 L0 380 Z" fill="#6bbb4a" />

      <!-- Clouds (duplicated strip for seamless loop) -->
      <g class="cloud slow" opacity="0.9">
        <g fill="#fff">
          <ellipse cx="120" cy="80" rx="38" ry="22" />
          <ellipse cx="150" cy="72" rx="28" ry="18" />
          <ellipse cx="95" cy="78" rx="22" ry="14" />
          <ellipse cx="420" cy="110" rx="44" ry="24" />
          <ellipse cx="455" cy="100" rx="30" ry="18" />
          <ellipse cx="390" cy="108" rx="24" ry="14" />
          <ellipse cx="700" cy="70" rx="36" ry="20" />
          <ellipse cx="730" cy="64" rx="26" ry="16" />
          <!-- wrap copies -->
          <ellipse cx="1320" cy="80" rx="38" ry="22" />
          <ellipse cx="1350" cy="72" rx="28" ry="18" />
          <ellipse cx="1295" cy="78" rx="22" ry="14" />
          <ellipse cx="1620" cy="110" rx="44" ry="24" />
          <ellipse cx="1655" cy="100" rx="30" ry="18" />
          <ellipse cx="1590" cy="108" rx="24" ry="14" />
          <ellipse cx="1900" cy="70" rx="36" ry="20" />
          <ellipse cx="1930" cy="64" rx="26" ry="16" />
        </g>
      </g>
      <g class="cloud fast" opacity="0.75">
        <g fill="#f7fbff">
          <ellipse cx="280" cy="50" rx="26" ry="14" />
          <ellipse cx="300" cy="46" rx="18" ry="10" />
          <ellipse cx="560" cy="88" rx="30" ry="16" />
          <ellipse cx="585" cy="82" rx="20" ry="12" />
          <ellipse cx="1480" cy="50" rx="26" ry="14" />
          <ellipse cx="1500" cy="46" rx="18" ry="10" />
          <ellipse cx="1760" cy="88" rx="30" ry="16" />
          <ellipse cx="1785" cy="82" rx="20" ry="12" />
        </g>
      </g>

      <!-- Ground / grass strip -->
      <rect y="370" width="800" height="130" fill="#5fad45" />
      <g class="ground-pattern">
        <g fill="#4f9a38" opacity="0.55">
          <path d="M10 390 q8 -16 16 0" />
          <path d="M40 400 q6 -12 12 0" />
          <path d="M70 385 q8 -18 16 0" />
          <path d="M110 395 q7 -14 14 0" />
          <path d="M150 388 q8 -16 16 0" />
          <path d="M190 400 q6 -12 12 0" />
          <path d="M230 386 q8 -17 16 0" />
          <path d="M270 395 q7 -13 14 0" />
          <path d="M310 390 q8 -16 16 0" />
          <path d="M350 402 q6 -11 12 0" />
          <path d="M390 387 q8 -18 16 0" />
          <path d="M430 396 q7 -14 14 0" />
          <path d="M470 389 q8 -15 16 0" />
          <path d="M510 401 q6 -12 12 0" />
          <path d="M550 386 q8 -17 16 0" />
          <path d="M590 394 q7 -13 14 0" />
          <path d="M630 391 q8 -16 16 0" />
          <path d="M670 400 q6 -12 12 0" />
          <path d="M710 388 q8 -18 16 0" />
          <path d="M750 396 q7 -14 14 0" />
          <path d="M790 390 q8 -16 16 0" />
          <!-- extension for scroll -->
          <path d="M830 390 q8 -16 16 0" />
          <path d="M860 400 q6 -12 12 0" />
          <path d="M890 385 q8 -18 16 0" />
        </g>
      </g>

      <!-- Road -->
      <rect y="410" width="800" height="70" fill="#5a5a5a" />
      <rect y="412" width="800" height="4" fill="#6e6e6e" />
      <g class="road-dash">
        <g stroke="#f0f0f0" stroke-width="5" stroke-linecap="round" stroke-dasharray="36 44">
          <line x1="-80" y1="445" x2="880" y2="445" />
        </g>
      </g>

      <!-- Bicycle + Pelican -->
      <g class="rider" filter="url(#softShadow)">
        <!-- Far wheel (behind) already drawn with near; crank first layers -->

        <!-- Far leg (behind frame) -->
        <g class="leg-far">
          <path d="M390 276 L378 318 L392 338" fill="none" stroke="#dfe6ee" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="396" cy="342" rx="10" ry="6" fill="#2b2d42" transform="rotate(-20 396 342)" />
        </g>

        <!-- Bike frame -->
        <g id="bike">
          <!-- Rear wheel -->
          <g transform="translate(320 350)">
            <g class="wheel-spin">
              <circle r="42" fill="none" stroke="#222" stroke-width="6" />
              <circle r="36" fill="none" stroke="#888" stroke-width="2" />
              <g stroke="#444" stroke-width="2">
                <line x1="0" y1="-36" x2="0" y2="36" />
                <line x1="-36" y1="0" x2="36" y2="0" />
                <line x1="-25" y1="-25" x2="25" y2="25" />
                <line x1="25" y1="-25" x2="-25" y2="25" />
              </g>
              <circle r="8" fill="#333" />
            </g>
            <circle r="42" fill="none" stroke="#111" stroke-width="3" opacity="0.35" />
          </g>

          <!-- Front wheel -->
          <g transform="translate(480 350)">
            <g class="wheel-spin">
              <circle r="42" fill="none" stroke="#222" stroke-width="6" />
              <circle r="36" fill="none" stroke="#888" stroke-width="2" />
              <g stroke="#444" stroke-width="2">
                <line x1="0" y1="-36" x2="0" y2="36" />
                <line x1="-36" y1="0" x2="36" y2="0" />
                <line x1="-25" y1="-25" x2="25" y2="25" />
                <line x1="25" y1="-25" x2="-25" y2="25" />
              </g>
              <circle r="8" fill="#333" />
            </g>
            <circle r="42" fill="none" stroke="#111" stroke-width="3" opacity="0.35" />
          </g>

          <!-- Frame tubes -->
          <g fill="none" stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <!-- main triangle -->
            <path d="M320 350 L390 270 L455 350" />
            <path d="M390 270 L455 300" />
            <!-- seat tube / top -->
            <path d="M390 270 L400 250" />
            <!-- down tube to BB -->
            <path d="M390 270 L400 330" />
            <!-- chain stays already in triangle -->
            <!-- fork -->
            <path d="M455 300 L480 350" />
            <!-- handle stem -->
            <path d="M455 300 L468 255" />
          </g>

          <!-- Seat -->
          <ellipse cx="398" cy="246" rx="18" ry="7" fill="#1d3557" />
          <!-- Handlebars -->
          <path d="M458 252 Q468 242 482 248" fill="none" stroke="#1d3557" stroke-width="6" stroke-linecap="round" />
          <path d="M482 248 Q490 252 488 262" fill="none" stroke="#1d3557" stroke-width="5" stroke-linecap="round" />
          <circle cx="488" cy="264" r="4" fill="#457b9d" />

          <!-- Crank + pedals -->
          <g transform="translate(400 330)">
            <g class="crank">
              <line x1="0" y1="0" x2="0" y2="22" stroke="#333" stroke-width="4" stroke-linecap="round" />
              <rect x="-10" y="20" width="20" height="6" rx="2" fill="#2b2d42" />
              <line x1="0" y1="0" x2="0" y2="-22" stroke="#333" stroke-width="4" stroke-linecap="round" />
              <rect x="-10" y="-26" width="20" height="6" rx="2" fill="#2b2d42" />
              <circle r="6" fill="#555" />
            </g>
          </g>

          <!-- Chain hint -->
          <path d="M400 330 Q430 318 460 340" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
        </g>

        <!-- Near leg -->
        <g class="leg-near">
          <path d="M398 278 L410 316 L402 340" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M398 278 L410 316 L402 340" fill="none" stroke="#dfe6ee" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="406" cy="344" rx="11" ry="6" fill="#2b2d42" transform="rotate(15 406 344)" />
        </g>

        <!-- Pelican body -->
        <g id="pelican">
          <!-- Tail -->
          <path d="M340 250 Q310 240 300 255 Q320 265 345 260 Z" fill="#f1faee" stroke="#cfd8e3" stroke-width="1" />

          <!-- Body -->
          <ellipse cx="390" cy="250" rx="48" ry="32" fill="url(#pelican-body)" stroke="#cfd8e3" stroke-width="1.5" />

          <!-- Wing -->
          <g class="wing">
            <path d="M370 235 Q400 200 455 225 Q430 245 395 248 Q380 248 370 235 Z" fill="#f8fafc" stroke="#b0bec9" stroke-width="1.5" />
            <path d="M385 232 Q410 215 440 228" fill="none" stroke="#cfd8dc" stroke-width="1.2" />
            <path d="M390 240 Q415 225 442 236" fill="none" stroke="#cfd8dc" stroke-width="1.2" />
          </g>

          <!-- Neck -->
          <path d="M425 240 C445 220 455 200 468 195" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
          <path d="M425 240 C445 220 455 200 468 195" fill="none" stroke="#e8eef5" stroke-width="12" stroke-linecap="round" />

          <!-- Head group -->
          <g class="head-group">
            <!-- Head -->
            <ellipse cx="478" cy="190" rx="22" ry="18" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" />

            <!-- Eye -->
            <circle cx="486" cy="186" r="5.5" fill="#1d3557" />
            <circle cx="487.5" cy="184.5" r="2" fill="#fff" />

            <!-- Beak upper -->
            <path d="M492 190 L560 198 L492 206 Z" fill="#f4a261" stroke="#e76f51" stroke-width="1" />
            <!-- Throat pouch -->
            <path d="M492 206 Q525 235 558 200 Q525 215 492 206 Z" fill="url(#pouch)" stroke="#d35400" stroke-width="1" />
            <!-- Beak tip -->
            <path d="M555 196 L568 199 L555 203 Z" fill="#e76f51" />

            <!-- Crest fluff -->
            <path d="M460 178 Q458 165 468 170" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
            <path d="M468 175 Q470 160 478 168" fill="none" stroke="#f1faee" stroke-width="3.5" stroke-linecap="round" />
          </g>

          <!-- Near wing tip resting / arm on handle -->
          <path d="M430 245 Q455 255 478 258" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
          <path d="M430 245 Q455 255 478 258" fill="none" stroke="#e8eef5" stroke-width="7" stroke-linecap="round" />
          <!-- "hand" on bar -->
          <ellipse cx="482" cy="258" rx="7" ry="5" fill="#f4a261" />
        </g>
      </g>

      <!-- Soft ground shadow under bike -->
      <ellipse cx="400" cy="395" rx="110" ry="10" fill="#000" opacity="0.12">
        <animate attributeName="rx" values="110;118;110" dur="0.45s" repeatCount="indefinite" />
      </ellipse>
    </svg>
  </div>
  <p class="hint">车轮滚动 · 双腿踩踏 · 翅膀轻扇 · 风景后移</p>
</body>
</html>
