  :root{

  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:28px 16px;
    background:radial-gradient(1200px 700px at 50% -10%, #1d3448 0%, #0d151d 60%, #070b10 100%);

    color:#e8f2fb;
  }
  h1{
    margin:0; font-size:clamp(20px,3.4vw,32px); font-weight:700; letter-spacing:.04em;
    background:linear-gradient(90deg,#ffd479,#ff9f68 55%,#7fd8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .stage{
    width:min(960px,100%); border-radius:22px; overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.08);
    background:#0b1118;
  }
  svg{display:block; width:100%; height:auto}
  .hint{margin:0; font-size:13px; color:#8fa6b8; letter-spacing:.05em}
  .hint b{color:#ffcf7d; font-weight:600}
</style>
