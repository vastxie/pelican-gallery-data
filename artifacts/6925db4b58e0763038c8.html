<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · Pelican Pedal (SVG 2D Animation)</title>
<style>
  :root{
    --bg:#0f1720;
    --card:#17222e;
    --card-2:#1e2b39;
    --ink:#e8f1f7;
    --muted:#93a7b8;
    --accent:#f5a83c;
    --accent-2:#1f9e8f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(1200px 600px at 20% -10%, #1d3040 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 110%, #1b2c3a 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px;
  }
  .wrap{width:min(1040px,100%)}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:clamp(20px,3.2vw,30px);margin:0;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .card{
    background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);
    border:1px solid #27384a;
    border-radius:18px;
    padding:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .stage{
    border-radius:12px;overflow:hidden;background:#bfe6f5;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  svg.scene{display:block;width:100%;height:auto}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  button,select{
    font:inherit;font-size:14px;color:var(--ink);
    background:#243546;border:1px solid #34485c;border-radius:10px;
    padding:8px 14px;cursor:pointer;transition:.18s;
  }
  button:hover,select:hover{background:#2c4155;border-color:var(--accent-2)}
  button.primary{background:var(--accent-2);border-color:#28b3a3;color:#04211d;font-weight:700}
  button.primary:hover{background:#28b3a3}
  .hint{color:var(--muted);font-size:12.5px;margin-left:auto}
  kbd{background:#243546;border:1px solid #3b4f64;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>鹈鹕骑自行车 <span>Pelican Pedal</span></h1>
      <div class="sub">纯 SVG + SMIL 绘制的 2D 动画：踩踏、轮子转动、视差滚动、拍翅与眨眼</div>
    </div>
  </header>

  <div class="card">
    <div class="stage">
      <svg id="scene" class="scene" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="一只鹈鹕正骑着自行车向前行驶的动画">
        <title>鹈鹕骑自行车</title>
        <desc>鹈鹕踩踏板前进，车轮转动，背景道路与树木视差滚动。</desc>

        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#8fd3ef"/>
            <stop offset="55%" stop-color="#c9ecf8"/>
            <stop offset="100%" stop-color="#eef9fc"/>
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#5a636b"/>
            <stop offset="100%" stop-color="#3f464c"/>
          </linearGradient>
          <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e3ecf1"/>
          </linearGradient>
          <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#f9b95a"/>
            <stop offset="100%" stop-color="#ef9330"/>
          </linearGradient>
          <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#fbd489"/>
            <stop offset="100%" stop-color="#f2a94a"/>
          </linearGradient>
          <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#fff6c9" stop-opacity="1"/>
            <stop offset="60%" stop-color="#ffe28a" stop-opacity=".75"/>
            <stop offset="100%" stop-color="#ffe28a" stop-opacity="0"/>
          </radialGradient>
          <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6"/>
          </filter>
          <clipPath id="headClip"><ellipse cx="404" cy="132" rx="26" ry="22"/></clipPath>
        </defs>

        <!-- ============================ 天空 ============================ -->
        <rect x="0" y="0" width="960" height="440" fill="url(#sky)"/>

        <!-- 太阳 -->
        <g>
          <circle cx="838" cy="86" r="78" fill="url(#sunG)"/>
          <circle cx="838" cy="86" r="34" fill="#fff3bf"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0"
                            dur="7s" repeatCount="indefinite"/>
        </g>

        <!-- 云 -->
        <g fill="#ffffff" opacity=".9">
          <g>
            <g transform="translate(0,0)">
              <ellipse cx="120" cy="80" rx="42" ry="20"/>
              <ellipse cx="152" cy="70" rx="30" ry="18"/>
              <ellipse cx="88"  cy="88" rx="26" ry="14"/>
            </g>
            <animateTransform attributeName="transform" type="translate" values="-260 0;1220 0"
                              dur="46s" repeatCount="indefinite"/>
          </g>
          <g opacity=".75">
            <g transform="translate(0,0)">
              <ellipse cx="420" cy="140" rx="30" ry="14"/>
              <ellipse cx="448" cy="132" rx="22" ry="12"/>
              <ellipse cx="398" cy="146" rx="18" ry="10"/>
            </g>
            <animateTransform attributeName="transform" type="translate" values="-320 0;1220 0"
                              dur="63s" repeatCount="indefinite"/>
          </g>
          <g opacity=".6">
            <g transform="translate(0,0)">
              <ellipse cx="700" cy="60" rx="34" ry="15"/>
              <ellipse cx="726" cy="54" rx="20" ry="11"/>
            </g>
            <animateTransform attributeName="transform" type="translate" values="-300 0;1220 0"

          </g>
        </g>

        <!-- 远处飞鸟 -->
        <g stroke="#5f7d8c" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".55">
          <path d="M 300 168 q 9 -8 18 0 q 9 -8 18 0"/>
          <path d="M 352 148 q 7 -6 14 0 q 7 -6 14 0"/>
          <animateTransform attributeName="transform" type="translate" values="-200 0;1200 0"
                            dur="24s" repeatCount="indefinite"/>
        </g>

        <!-- ======================== 远山（视差） ======================== -->
        <g opacity=".85">

        <!-- ======================== 中景树（视差） ======================== -->

              <circle cx="-20" cy="338" r="24" fill="#5aa36d"/>
              <circle cx="20" cy="336" r="26" fill="#468a58"/>
            </g>
            <g transform="translate(300,0)">
              <rect x="-4" y="342" width="8" height="58" rx="4" fill="#6b5138"/>
              <circle cx="0" cy="336" r="26" fill="#4f9463"/>
              <circle cx="-16" cy="348" r="18" fill="#5aa36d"/>
            </g>
            <g transform="translate(520,0)">
              <rect x="-5" y="326" width="10" height="74" rx="4" fill="#6b5138"/>
              <circle cx="0" cy="318" r="38" fill="#4a8d5c"/>
              <circle cx="-24" cy="336" r="26" fill="#5aa36d"/>
              <circle cx="24" cy="332" r="24" fill="#468a58"/>
            </g>
            <g transform="translate(760,0)">
              <rect x="-4" y="340" width="8" height="60" rx="4" fill="#6b5138"/>
              <circle cx="0" cy="332" r="28" fill="#4f9463"/>
            </g>
            <g transform="translate(1020,0)">
              <rect x="-4" y="330" width="9" height="70" rx="4" fill="#6b5138"/>
              <circle cx="0" cy="322" r="34" fill="#4f9463"/>
              <circle cx="-20" cy="338" r="24" fill="#5aa36d"/>
              <circle cx="20" cy="336" r="26" fill="#468a58"/>
            </g>
            <g transform="translate(1260,0)">
              <rect x="-4" y="342" width="8" height="58" rx="4" fill="#6b5138"/>
              <circle cx="0" cy="336" r="26" fill="#4f9463"/>
              <circle cx="-16" cy="348" r="18" fill="#5aa36d"/>
            </g>
            <g transform="translate(1480,0)">
              <rect x="-5" y="326" width="10" height="74" rx="4" fill="#6b5138"/>
              <circle cx="0" cy="318" r="38" fill="#4a8d5c"/>
              <circle cx="-24" cy="336" r="26" fill="#5aa36d"/>
              <circle cx="24" cy="332" r="24" fill="#468a58"/>
            </g>
            <g transform="translate(1720,0)">
              <rect x="-4" y="340" width="8" height="60" rx="4" fill="#6b5138"/>
              <circle cx="0" cy="332" r="28" fill="#4f9463"/>
            </g>
            <animateTransform attributeName="transform" type="translate" values="0 0;-960 0"
                              dur="7.5s" repeatCount="indefinite"/>
          </g>
        </g>

        <!-- ======================== 草地 & 道路 ======================== -->
        <rect x="0" y="416" width="960" height="24" fill="#8ec46a"/>
        <rect x="0" y="412" width="960" height="6"  fill="#7bb45a"/>
        <rect x="0" y="437" width="960" height="83" fill="url(#road)"/>
        <rect x="0" y="437" width="960" height="4"  fill="#6d767e"/>
        <g fill="#f7d774" opacity=".9">
          <g id="dashes">
            <rect x="0"   y="474" width="62" height="7" rx="3.5"/>
            <rect x="120" y="474" width="62" height="7" rx="3.5"/>
            <rect x="240" y="474" width="62" height="7" rx="3.5"/>
            <rect x="360" y="474" width="62" height="7" rx="3.5"/>
            <rect x="480" y="474" width="62" height="7" rx="3.5"/>
            <rect x="600" y="474" width="62" height="7" rx="3.5"/>
            <rect x="720" y="474" width="62" height="7" rx="3.5"/>
            <rect x="840" y="474" width="62" height="7" rx="3.5"/>
            <rect x="960" y="474" width="62" height="7" rx="3.5"/>
            <animateTransform attributeName="transform" type="translate" values="0 0;-120 0"
                              dur="0.33s" repeatCount="indefinite"/>
          </g>
        </g>

        <!-- 速度线 -->
        <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".35">
          <line x1="60"  y1="300" x2="140" y2="300"/>
          <line x1="30"  y1="330" x2="120" y2="330"/>
          <line x1="80"  y1="358" x2="150" y2="358"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;-90 0"
                            dur="0.55s" repeatCount="indefinite"/>
        </g>

        <!-- 地面阴影 -->
        <ellipse cx="385" cy="444" rx="165" ry="13" fill="#1d2328" opacity=".22" filter="url(#soft)">
          <animate attributeName="opacity" values=".22;.14;.22" dur="0.45s" repeatCount="indefinite"/>
        </ellipse>

        <!-- ============================ 自行车 ============================ -->
        <g id="bike">

          <!-- 后轮 -->
          <g>
            <circle cx="250" cy="385" r="52" fill="none" stroke="#2b3136" stroke-width="9"/>
            <circle cx="250" cy="385" r="52" fill="none" stroke="#3c444b" stroke-width="3" stroke-dasharray="6 10"/>
            <circle cx="250" cy="385" r="43" fill="none" stroke="#e3ebef" stroke-width="3"/>
            <g stroke="#c3ced5" stroke-width="1.8">
              <line x1="250" y1="345" x2="250" y2="425"/>
              <line x1="210" y1="385" x2="290" y2="385"/>
              <line x1="220" y1="355" x2="280" y2="415"/>
              <line x1="280" y1="355" x2="220" y2="415"/>
            </g>
            <g>
              <circle cx="250" cy="385" r="6" fill="#8c9aa4"/>
              <rect x="248.4" y="336" width="3.2" height="12" rx="1.6" fill="#e8a13c"/>
              <animateTransform attributeName="transform" type="rotate"
                                values="0 250 385;360 250 385" dur="0.9s" repeatCount="indefinite"/>
            </g>
          </g>

          <!-- 前轮 -->
          <g>
            <circle cx="520" cy="385" r="52" fill="none" stroke="#2b3136" stroke-width="9"/>
            <circle cx="520" cy="385" r="52" fill="none" stroke="#3c444b" stroke-width="3" stroke-dasharray="6 10"/>
            <circle cx="520" cy="385" r="43" fill="none" stroke="#e3ebef" stroke-width="3"/>
            <g stroke="#c3ced5" stroke-width="1.8">
              <line x1="520" y1="345" x2="520" y2="425"/>
              <line x1="480" y1="385" x2="560" y2="385"/>
              <line x1="490" y1="355" x2="550" y2="415"/>
              <line x1="550" y1="355" x2="490" y2="415"/>
            </g>
            <g>
              <circle cx="520" cy="385" r="6" fill="#8c9aa4"/>
              <rect x="518.4" y="336" width="3.2" height="12" rx="1.6" fill="#e8a13c"/>
              <animateTransform attributeName="transform" type="rotate"
                                values="0 520 385;360 520 385" dur="0.9s" repeatCount="indefinite"/>
            </g>
          </g>

          <!-- 车架 -->
          <g stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- 链条 -->
            <path d="M 352 306 L 258 374" stroke="#3c444b" stroke-width="3"/>
            <path d="M 368 332 L 258 394" stroke="#3c444b" stroke-width="3"/>
            <!-- 后飞轮 -->
            <circle cx="250" cy="385" r="9" fill="#9aa6ae" stroke="none"/>
            <circle cx="250" cy="385" r="9" fill="none" stroke="#6d787f" stroke-width="1.5" stroke-dasharray="3 3"/>
            <!-- 座管 -->
            <path d="M 360 320 L 330 266" stroke="#1f9e8f" stroke-width="9"/>
            <!-- 上管 -->
            <path d="M 332 268 L 498 288" stroke="#1f9e8f" stroke-width="9"/>
            <!-- 下管 -->
            <path d="M 360 320 L 500 290" stroke="#1f9e8f" stroke-width="9"/>
            <!-- 后下叉 -->
            <path d="M 360 320 L 250 385" stroke="#1f9e8f" stroke-width="8"/>
            <!-- 后上叉 -->
            <path d="M 330 266 L 250 385" stroke="#1f9e8f" stroke-width="7"/>
            <!-- 前叉 -->
            <path d="M 500 290 L 520 385" stroke="#1f9e8f" stroke-width="8"/>
            <!-- 车把 -->
            <path d="M 500 288 L 508 266" stroke="#1b8d80" stroke-width="8"/>
            <path d="M 508 266 L 548 260" stroke="#3d3a38" stroke-width="7"/>
            <path d="M 536 262 L 550 260" stroke="#6b4230" stroke-width="9"/>
            <!-- 高光 -->
            <path d="M 336 265 L 494 285" stroke="#57c9ba" stroke-width="2" opacity=".7"/>
            <path d="M 362 315 L 496 287" stroke="#57c9ba" stroke-width="2" opacity=".55"/>
          </g>
          <!-- 车座 -->
          <path d="M 306 258 q 22 -14 46 -6 q 6 3 2 8 q -26 10 -48 4 q -6 -2 0 -6 Z" fill="#6b4230"/>
          <path d="M 312 255 q 20 -11 40 -6" stroke="#8a5a42" stroke-width="3" fill="none" stroke-linecap="round"/>

          <!-- 曲柄 + 脚踏 -->
          <g id="crank">
            <circle cx="360" cy="320" r="16" fill="none" stroke="#c9d3d9" stroke-width="4"/>
            <circle cx="360" cy="320" r="16" fill="none" stroke="#9aa6ae" stroke-width="1.6" stroke-dasharray="4 4"/>
            <g stroke="#d7dfe4" stroke-width="5" stroke-linecap="round">
              <line x1="360" y1="320" x2="378" y2="320"/>

            </g>
            <g>
              <rect x="368" y="316.5" width="20" height="7" rx="3" fill="#4b545b"/>
              <animateTransform attributeName="transform" type="rotate"

            <g>
              <rect x="332" y="316.5" width="20" height="7" rx="3" fill="#4b545b"/>
              <animateTransform attributeName="transform" type="rotate"
                                values="0 342 320;30 342 320;60 342 320;90 342 320;120 342 320;150 342 320;180 342 320;210 342 320;240 342 320;270 342 320;300 342 320;330 342 320;360 342 320"

                              dur="0.9s" repeatCount="indefinite"/>
          </g>

          <!-- 远侧腿（在后） -->

              <g>
                <circle cx="348" cy="312" r="6" fill="#d9822f"/>
                <line x1="348" y1="312" x2="348" y2="342" stroke="#d9822f" stroke-width="9.5" stroke-linecap="round"/>
                <g>
                  <path d="M 348 342 l 15 1 l 12 4.5 l -12 3.5 l -15 -1.5 z" fill="#e08b33"/>
                  <animateTransform attributeName="transform" type="rotate"
                                    values="44.53 348 342;58.66 348 342;80.07 348 342;99.81 348 342;102.64 348 342;91.75 348 342;74.50 348 342;55.18 348 342;37.85 348 342;29.49 348 342;30.47 348 342;35.74 348 342"

                </g>
                <animateTransform attributeName="transform" type="rotate"

                                  dur="0.9s" repeatCount="indefinite"/>
              </g>
              <animateTransform attributeName="transform" type="rotate"
                                values="52.68 348 278;59.22 348 278;51.34 348 278;31.10 348 278;14.08 348 278;4.04 348 278;-1.84 348 278;-4.99 348 278;-4.37 348 278;4.67 348 278;21.05 348 278;38.39 348 278"
                                dur="0.9s" repeatCount="indefinite"/>
            </g>
          </g>

          <!-- 近侧腿 -->
          <g id="legA">
            <g>
              <line x1="334" y1="282" x2="334" y2="316" stroke="#e8892e" stroke-width="12" stroke-linecap="round"/>
              <g>
                <circle cx="334" cy="316" r="6.5" fill="#ef9436"/>
                <line x1="334" y1="316" x2="334" y2="346" stroke="#ef9436" stroke-width="10" stroke-linecap="round"/>
                <g>
                  <path d="M 334 346 l 16 1 l 13 5 l -13 4 l -16 -2 z" fill="#f59c3d"/>
                  <animateTransform attributeName="transform" type="rotate"
                                    values="75.60 334 346;53.55 334 346;33.15 334 346;41.18 334 346;48.16 334 346;56.95 334 346;69.39 334 346;87.72 334 346;108.69 334 346;117.81 334 346;111.21 334 346;95.57 334 346"
                                    dur="0.9s" repeatCount="indefinite"/>
                </g>
                <animateTransform attributeName="transform" type="rotate"
                                  values="-49.53 334 316;-22.65 334 316;0.00 334 316;-30.60 334 316;-57.21 334 316;-82.64 334 316;-105.58 334 316;-122.85 334 316;-128.31 334 316;-118.71 334 316;-99.27 334 316;-75.39 334 316"

              </g>
              <animateTransform attributeName="transform" type="rotate"
                                values="-26.07 334 282;-30.89 334 282;-33.15 334 282;-10.59 334 282;9.05 334 282;25.68 334 282;36.20 334 282;35.13 334 282;19.62 334 282;0.90 334 282;-11.94 334 282;-20.18 334 282"

          </g>

          <!-- ============================ 鹈鹕 ============================ -->
          <g id="pelican">
            <!-- 身体（轻微颠簸） -->
            <g>
              <g>
                <!-- 尾羽 -->
                <g fill="#e6eef3" stroke="#cdd9e0" stroke-width="1.5" stroke-linejoin="round">
                  <path d="M 240 226 q -30 -8 -44 -20 q 26 2 46 8 Z"/>
                  <path d="M 240 232 q -32 2 -48 8 q 28 2 50 -2 Z"/>
                  <path d="M 242 238 q -28 10 -40 22 q 26 -6 44 -14 Z"/>
                </g>

                <!-- 身体 -->
                <ellipse cx="300" cy="222" rx="68" ry="42" fill="url(#bodyG)" stroke="#c9d5dd" stroke-width="2" transform="rotate(-6 300 222)"/>
                <!-- 臀部 -->
                <ellipse cx="334" cy="266" rx="26" ry="20" fill="#f2f7fa" stroke="#c9d5dd" stroke-width="2"/>

                <!-- 颈 -->
                <path d="M 340 236 C 352 196 362 168 380 148" stroke="#f7fbfd" stroke-width="27" stroke-linecap="round" fill="none"/>
                <path d="M 340 236 C 352 196 362 168 380 148" stroke="#dfe9ef" stroke-width="27" stroke-linecap="round" fill="none"
                      stroke-dasharray="1 999" opacity=".0"/>

                <!-- 头 + 喙 -->
                <g>
                  <ellipse cx="404" cy="132" rx="26" ry="22" fill="url(#bodyG)" stroke="#c9d5dd" stroke-width="2"/>
                  <!-- 喉部黄皮 -->
                  <!-- 喉囊（会轻微摆动） -->
                  <g>
                    <path d="M 426 130 C 466 122 512 135 554 149 C 492 186 440 172 426 130 Z"
                          fill="url(#pouchG)" stroke="#e09542" stroke-width="1.5" stroke-linejoin="round"/>
                    <animateTransform attributeName="transform" type="rotate"
                                      values="0 430 130;3 430 130;0 430 130;-3 430 130;0 430 130"
                                      dur="1.8s" repeatCount="indefinite"/>
                  </g>
                  <!-- 上喙 -->
                  <path d="M 424 102 C 466 111 512 126 550 138 Q 558 141 552 148 C 512 137 466 124 428 132 Z"
                        fill="url(#beakG)" stroke="#dd8a34" stroke-width="1.5" stroke-linejoin="round"/>
                  <!-- 喙尖钩 -->
                  <path d="M 552 139 q 9 12 -3 17 l -7 -11 z" fill="#dd8a34"/>
                  <!-- 鼻孔 -->
                  <ellipse cx="448" cy="121" rx="4" ry="2.2" fill="#d1812f" transform="rotate(11 448 121)"/>
                  <!-- 眼 -->
                  <ellipse cx="395" cy="131" rx="9.5" ry="10" fill="#ffffff" stroke="#cdd9e0" stroke-width="1.2"/>
                  <circle cx="398" cy="132" r="4.6" fill="#22313d"/>
                  <circle cx="399.8" cy="130" r="1.7" fill="#ffffff"/>
                  <!-- 眨眼 -->
                  <g clip-path="url(#headClip)">
                    <rect x="382" y="112" width="30" height="0" fill="#f6fafc">
                      <animate attributeName="height" values="0;0;11;0;0" keyTimes="0;0.46;0.5;0.54;1"
                               dur="4.2s" repeatCount="indefinite"/>
                    </rect>
                  </g>
                  <!-- 头冠羽 -->
                  <g fill="#e9f1f5" stroke="#c9d5dd" stroke-width="1.2" stroke-linejoin="round">
                    <path d="M 386 116 q 4 -16 12 -19 q -4 12 -3 19 Z"/>
                    <path d="M 396 112 q 6 -15 14 -16 q -5 11 -6 16 Z"/>
                  </g>
                  <!-- 头盔 -->
                  <g>
                    <path d="M 381 116 A 25 23 0 0 1 428 113 L 429 119 L 382 122 Z" fill="#e2503c" stroke="#b93a2a" stroke-width="1.4" stroke-linejoin="round"/>
                    <path d="M 395 94 q 6 10 5 20" stroke="#ffffff" stroke-width="3" fill="none" opacity=".85" stroke-linecap="round"/>
                    <path d="M 423 107 q 12 -2 18 2 q -10 6 -18 4 Z" fill="#c7432f"/>
                  </g>
                </g>

                <!-- 围巾 -->
                <g>
                  <path d="M 334 222 q 16 12 34 10 l 3 -12 q -20 3 -33 -8 z" fill="#2f8fd6"/>
                  <path d="M 340 224 q -20 4 -32 20 q 22 3 36 -12 z" fill="#2f8fd6">
                    <animateTransform attributeName="transform" type="rotate"
                                      values="-9 340 224;9 340 224;-9 340 224" dur="0.62s" repeatCount="indefinite"/>
                  </path>
                </g>

                <!-- 翅膀（拍动） -->
                <g>
                  <path d="M 332 198 C 302 176 254 184 238 214 C 228 234 250 250 276 248 C 310 245 331 226 332 198 Z"
                        fill="#cddde6" stroke="#a7bcc8" stroke-width="2" stroke-linejoin="round"/>
                  <path d="M 262 200 C 252 216 250 232 258 244" stroke="#aec2cd" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                  <path d="M 278 196 C 268 214 266 232 274 246" stroke="#aec2cd" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                  <path d="M 294 196 C 288 212 288 228 296 242" stroke="#aec2cd" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                  <animateTransform attributeName="transform" type="rotate"
                                    values="-5 332 198;5 332 198;-5 332 198" dur="0.9s" repeatCount="indefinite"/>
                </g>
              </g>
              <!-- 身体的上下颠簸 -->
              <animateTransform attributeName="transform" type="translate"
                                values="0 0;0 -5;0 0;0 -2;0 0" dur="0.9s" repeatCount="indefinite"/>
            </g>
          </g>
        </g>

        <!-- 前景小草（视差最快） -->
        <g fill="#5f9e55" opacity=".9">
          <g id="grass">
            <g transform="translate(80,437)">
              <path d="M 0 0 q 2 -16 8 -22 q -2 14 0 22 Z"/>
              <path d="M 8 0 q 6 -14 16 -18 q -8 10 -10 18 Z"/>
            </g>
            <g transform="translate(420,437)">
              <path d="M 0 0 q 2 -14 8 -20 q -2 12 0 20 Z"/>
              <path d="M 8 0 q 6 -12 15 -16 q -8 9 -10 16 Z"/>
            </g>
            <g transform="translate(760,437)">
              <path d="M 0 0 q 2 -15 8 -21 q -2 13 0 21 Z"/>
              <path d="M 8 0 q 6 -13 16 -17 q -8 9 -10 17 Z"/>
            </g>
            <g transform="translate(1040,437)">
              <path d="M 0 0 q 2 -16 8 -22 q -2 14 0 22 Z"/>
              <path d="M 8 0 q 6 -14 16 -18 q -8 10 -10 18 Z"/>
            </g>
            <g transform="translate(1380,437)">
              <path d="M 0 0 q 2 -14 8 -20 q -2 12 0 20 Z"/>
              <path d="M 8 0 q 6 -12 15 -16 q -8 9 -10 16 Z"/>
            </g>
            <g transform="translate(1720,437)">
              <path d="M 0 0 q 2 -15 8 -21 q -2 13 0 21 Z"/>
              <path d="M 8 0 q 6 -13 16 -17 q -8 9 -10 17 Z"/>
            </g>
            <animateTransform attributeName="transform" type="translate" values="0 0;-960 0"
                              dur="3.4s" repeatCount="indefinite"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="bar">
      <button id="toggle" class="primary">⏸ 暂停</button>
      <button id="restart">⟲ 重新开始</button>
      <label style="font-size:13px;color:var(--muted)">速度
        <select id="speed" style="margin-left:6px">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
      </label>
      <span class="hint">按 <kbd>空格</kbd> 播放 / 暂停</span>
    </div>
  </div>
</div>

<script>
  const svg = document.getElementById('scene');
  const toggleBtn = document.getElementById('toggle');
  const speedSel = document.getElementById('speed');
  let paused = false;

  // 记录每个 SMIL 动画的原始时长，用于变速
  const anims = [...svg.querySelectorAll('animate, animateTransform')];
  anims.forEach(a => a.dataset.baseDur = a.getAttribute('dur'));

  function applySpeed(k){
    anims.forEach(a => {
      const base = parseFloat(a.dataset.baseDur);
      a.setAttribute('dur', (base / k).toFixed(4) + 's');
    });
  }

  function setPaused(p){
    paused = p;
    if (paused) svg.pauseAnimations(); else svg.unpauseAnimations();
    toggleBtn.textContent = paused ? '▶ 播放' : '⏸ 暂停';
  }

  toggleBtn.addEventListener('click', () => setPaused(!paused));

  document.getElementById('restart').addEventListener('click', () => {
    svg.setCurrentTime(0);
    if (paused) { svg.unpauseAnimations(); setPaused(false); }
  });

  speedSel.addEventListener('change', e => applySpeed(parseFloat(e.target.value)));

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'SELECT') {
      e.preventDefault();
      setPaused(!paused);
    }
  });
</script>
</body>
</html>
