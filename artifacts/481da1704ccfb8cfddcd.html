<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕飞骑 - 2D SVG 动画 | Pelican on Bicycle</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.18);
      --btn-active: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 顶部标题栏 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 10px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      font-size: 24px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .title-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 场景画布容器 */
    .stage-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 10 / 6;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    svg#stage {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 仪表盘浮层 */
    .dashboard-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .speedometer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.25rem;
      font-weight: 800;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .speed-unit {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .cadence-meter {
      font-size: 0.75rem;
      color: #a7f3d0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 提示气泡 */
    .toast-bubble {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #f8fafc;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 控制面板 */
    .controls-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-right: 4px;
    }

    /* 按钮样式 */
    .pill-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .pill-btn:hover {
      background: var(--btn-hover);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .pill-btn:active {
      transform: translateY(1px);
    }

    .pill-btn.active {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .action-btn {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.15));
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .action-btn:hover {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(239, 68, 68, 0.3));
      border-color: rgba(245, 158, 11, 0.6);
    }

    .action-btn.jump-active {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.5);
    }

    .key-badge {
      font-size: 0.65rem;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
    }

    /* 快捷键提示条 */
    .shortcuts-bar {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 4px 10px;
    }

    .shortcut-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
      .header-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .control-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .shortcuts-bar {
        display: none;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 顶部标题栏 -->
  <header class="header-bar">
    <div class="title-group">
      <div class="logo-badge">🚲</div>
      <div class="title-text">
        <h1>鹈鹕飞骑 · 2D SVG 矢量动画</h1>
        <p>基于 SVG 骨骼逆运动学 (IK) 动力驱动 & Web Audio 原生音效</p>
      </div>
    </div>
    <div class="header-controls">
      <button class="pill-btn" id="btnSound" title="切换声音">
        <span id="soundIcon">🔊</span>
        <span id="soundText">音效开</span>
      </button>
      <button class="pill-btn" id="btnFullscreen" title="全屏模式">
        <span>⛶</span>
        <span>全屏</span>
      </button>
    </div>
  </header>

  <!-- 场景舞台 -->
  <div class="stage-wrapper" id="stageWrapper">
    <!-- 仪表盘 -->
    <div class="dashboard-overlay">
      <div class="speedometer">
        <span id="speedValue">30</span>
        <span class="speed-unit">km/h</span>
      </div>
      <div class="cadence-meter">
        <span>⚡ 踏频:</span>
        <span id="cadenceValue">75</span>
        <span>rpm</span>
      </div>
    </div>

    <!-- 交互提示气泡 -->
    <div class="toast-bubble" id="toastBubble">
      <span id="toastIcon">🔔</span>
      <span id="toastMsg">车铃响叮当！</span>
    </div>

    <!-- 主 SVG 画布 -->
    <svg id="stage" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 天空渐变 (动态切换) -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8" id="skyStop1" />
          <stop offset="60%" stop-color="#7dd3fc" id="skyStop2" />
          <stop offset="100%" stop-color="#bae6fd" id="skyStop3" />
        </linearGradient>

        <!-- 海洋渐变 -->
        <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0284c7" id="oceanStop1" />
          <stop offset="40%" stop-color="#0369a1" id="oceanStop2" />
          <stop offset="100%" stop-color="#075985" id="oceanStop3" />
        </linearGradient>

        <!-- 远山渐变 -->
        <linearGradient id="mountainFarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.65" id="mfStop1" />
          <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.3" id="mfStop2" />
        </linearGradient>

        <!-- 近山渐变 -->
        <linearGradient id="mountainNearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" id="mnStop1" />
          <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.4" id="mnStop2" />
        </linearGradient>

        <!-- 眼睛遮罩剪裁 (防止眨眼溢出) -->
        <clipPath id="eyeClip">
          <ellipse cx="0" cy="0" rx="7" ry="7" />
        </clipPath>

        <!-- 自行车车架薄荷绿高光渐变 -->
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#5eead4" />
          <stop offset="50%" stop-color="#14b8a6" />
          <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>

        <!-- 车架镀铬金属渐变 -->
        <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="45%" stop-color="#cbd5e1" />
          <stop offset="55%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>

        <!-- 鹈鹕腹部羽毛渐变 -->
        <linearGradient id="bodyGrad" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="65%" stop-color="#f1f5f9" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <!-- 鹈鹕大鸟喙渐变 -->
        <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f59e0b" />
          <stop offset="60%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- 喉囊粉红柔润渐变 -->
        <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.95" />
          <stop offset="70%" stop-color="#fb7185" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.85" />
        </linearGradient>

        <!-- 车灯照射光芒渐变 -->
        <radialGradient id="lightBeamGrad" cx="0%" cy="50%" r="100%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
          <stop offset="25%" stop-color="#fef08a" stop-opacity="0.4" />
          <stop offset="70%" stop-color="#fef08a" stop-opacity="0.1" />
          <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
        </radialGradient>

        <!-- 太阳柔光 -->
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
          <stop offset="40%" stop-color="#fde047" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
        </radialGradient>

        <!-- 月亮柔光 -->
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
          <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.4" />
          <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
        </radialGradient>

        <!-- 阴影滤镜 -->
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
          <feOffset dx="0" dy="4" result="offsetblur" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.3" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- 轮胎橡胶渐变 -->
        <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="50%" stop-color="#1e293b" />
          <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>

        <!-- 轮毂白边渐变 -->
        <linearGradient id="whiteWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>

        <!-- 围巾红白条纹图案 -->
        <pattern id="scarfPattern" width="16" height="16" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="8" height="16" fill="#ef4444" />
          <rect x="8" y="0" width="8" height="16" fill="#ffffff" />
        </pattern>

        <!-- 编织车筐图案 -->
        <pattern id="basketPattern" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#d97706" />
          <path d="M0 0 L10 10 M10 0 L0 10" stroke="#b45309" stroke-width="1.5" />
        </pattern>
      </defs>

      <!-- 1. 背景天空 -->
      <rect id="skyRect" x="0" y="0" width="1000" height="420" fill="url(#skyGrad)" />

      <!-- 繁星 (夜间显示) -->
      <g id="starsGroup" opacity="0"></g>

      <!-- 天体 (太阳 / 月亮) -->
      <g id="sunMoonGroup" transform="translate(820, 110)">
        <circle id="sunHalo" cx="0" cy="0" r="70" fill="url(#sunGlow)" />
        <circle id="sunCore" cx="0" cy="0" r="32" fill="#fef08a" />
        <!-- 月牙 (夜间切换) -->
        <path id="moonBody" d="M12 -28 A 30 30 0 1 0 12 28 A 22 22 0 1 1 12 -28 Z" fill="#f8fafc" opacity="0" />
      </g>

      <!-- 远景海鸟群 -->
      <g id="birdsGroup">
        <path class="fly-bird" d="M0,0 Q6,-8 12,0 Q18,-8 24,0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" transform="translate(260, 140) scale(0.7)" />
        <path class="fly-bird" d="M0,0 Q6,-8 12,0 Q18,-8 24,0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" transform="translate(310, 125) scale(0.55)" />
        <path class="fly-bird" d="M0,0 Q6,-8 12,0 Q18,-8 24,0" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" transform="translate(680, 95) scale(0.65)" />
      </g>

      <!-- 飘动的云朵 (3层视差) -->
      <g id="cloudsLayerFar"></g>
      <g id="cloudsLayerNear"></g>

      <!-- 远景山峦 -->
      <path id="mountainFar" d="M-50,330 Q120,240 280,310 T680,280 Q850,230 1050,330 L1050,380 L-50,380 Z" fill="url(#mountainFarGrad)" />

      <!-- 近景山丘 & 灯塔 -->
      <path id="mountainNear" d="M-50,350 Q180,280 420,340 T880,310 Q980,290 1050,350 L1050,390 L-50,390 Z" fill="url(#mountainNearGrad)" />
      <!-- 远方灯塔 -->
      <g id="lighthouseGroup" transform="translate(860, 275) scale(0.8)">
        <polygon points="12,38 18,5 24,5 30,38" fill="#f8fafc" />
        <rect x="18" y="12" width="6" height="4" fill="#ef4444" />
        <rect x="17" y="24" width="8" height="4" fill="#ef4444" />
        <circle cx="21" cy="4" r="4" fill="#38bdf8" />
        <polygon points="21,4 120,-10 120,18" fill="#fef08a" opacity="0.35" id="lighthouseBeam" />
      </g>

      <!-- 2. 海洋与波浪 -->
      <rect id="oceanRect" x="0" y="340" width="1000" height="75" fill="url(#oceanGrad)" />
      <!-- 远景帆船 -->
      <g id="sailboat" transform="translate(420, 345)">
        <path d="M0,8 L20,8 L16,14 L4,14 Z" fill="#ffffff" />
        <polygon points="10,8 10,0 18,8" fill="#f8fafc" />
        <polygon points="9,8 9,2 2,8" fill="#e2e8f0" />
      </g>
      <!-- 海浪曲线 -->
      <g id="oceanWavesGroup"></g>

      <!-- 3. 海滨堤岸木栈道与石栏杆 -->
      <rect x="0" y="415" width="1000" height="15" fill="#475569" />
      <line x1="0" y1="415" x2="1000" y2="415" stroke="#94a3b8" stroke-width="2" />
      <!-- 沿途路灯与棕榈树 (循环视差) -->
      <g id="sceneryLayer"></g>
      <!-- 木栏杆扶手 -->
      <line x1="0" y1="422" x2="1000" y2="422" stroke="#64748b" stroke-width="3" />
      <g id="railingPostsGroup"></g>

      <!-- 4. 公路路面 -->
      <rect x="0" y="430" width="1000" height="170" fill="#1e293b" />
      <!-- 马路石基 -->
      <rect x="0" y="430" width="1000" height="8" fill="#334155" />
      <line x1="0" y1="438" x2="1000" y2="438" stroke="#475569" stroke-width="2" />
      <!-- 公路白色虚线 (中心标线) -->
      <line id="roadDashes" x1="-100" y1="525" x2="1100" y2="525" stroke="#f8fafc" stroke-width="6" stroke-dasharray="55 45" stroke-linecap="round" />
      <!-- 公路边缘黄线 -->
      <line x1="0" y1="450" x2="1000" y2="450" stroke="#eab308" stroke-width="3" opacity="0.8" />
      <line x1="0" y1="585" x2="1000" y2="585" stroke="#eab308" stroke-width="3" opacity="0.8" />

      <!-- 5. 鹈鹕与自行车的综合互动组 (支持跳跃/抬轮动效) -->
      <g id="cyclistContainer">
        <!-- 地面阴影 (跟随跳跃动态变化大小与透明度) -->
        <g id="groundShadows">
          <ellipse id="rearWheelShadow" cx="300" cy="512" rx="55" ry="9" fill="#090d16" opacity="0.65" />
          <ellipse id="frontWheelShadow" cx="680" cy="512" rx="55" ry="9" fill="#090d16" opacity="0.65" />
          <ellipse id="centerShadow" cx="490" cy="512" rx="140" ry="12" fill="#090d16" opacity="0.4" />
        </g>

        <!-- 自行车与骑手本体组 -->
        <g id="bikePelicanGroup">

          <!-- 车灯向前投射光锥 (夜间强烈) -->
          <g id="headlightBeamGroup" opacity="0.2">
            <polygon points="720,400 1000,340 1000,520 720,418" fill="url(#lightBeamGrad)" />
          </g>

          <!-- A. 远端车轮 (后轮、前轮的背景部分与辐条) -->
          <!-- 后轮辐条与轮圈 -->
          <g id="rearWheelGroup" transform="translate(300, 438)">
            <!-- 外胎 -->
            <circle cx="0" cy="0" r="74" fill="none" stroke="url(#tireGrad)" stroke-width="14" />
            <!-- 白边复古圈 -->
            <circle cx="0" cy="0" r="66" fill="none" stroke="url(#whiteWallGrad)" stroke-width="5" />
            <!-- 金属轮圈 -->

  // --- 初始化 SVG 静态几何对象 (辐条、星空、云彩、护栏等) ---
  function initStaticSvgGeometry() {
    // 1. 生成 16 根自行车辐条
    const numSpokes = 16;
    let spokesHtml = '';
    for (let i = 0; i < numSpokes; i++) {
      const angle = (i * 360) / numSpokes;
      const rad = (angle * Math.PI) / 180;
      const x2 = (Math.cos(rad) * 63).toFixed(1);
      const y2 = (Math.sin(rad) * 63).toFixed(1);
      spokesHtml += `<line x1="0" y1="0" x2="${x2}" y2="${y2}" stroke="#cbd5e1" stroke-width="1.4" opacity="0.85" />`;

    dom.starsGroup.innerHTML = starsHtml;

    // 3. 生成远近两层棉花糖云彩

      <g id="cloudF1" transform="translate(150, 60) scale(0.75)" opacity="0.5">

      <g id="cloudF2" transform="translate(620, 85) scale(0.65)" opacity="0.45">
        <path d="M0,40 Q25,15 60,25 Q90,-2 130,18 Q165,10 185,40 Z" fill="#ffffff" />

    `;

    dom.cloudsLayerNear.innerHTML = `
      <g id="cloudN1" transform="translate(360, 40) scale(1.1)" opacity="0.8">

    // 4. 生成沿路路灯与海滨绿植棕榈树 (循环视差排列)

    for (let i = 0; i < 4; i++) {
      const bx = i * 360;
      // 复古路灯
      sceneryHtml += `
        <g class="scenery-post" id="lamp_${i}" transform="translate(${bx + 40}, 300)">
          <!-- 灯杆 -->

          <polygon points="6,120 18,120 15,110 9,110" fill="#1e293b" />

  // --- Web Audio 纯原生声学合成引擎 (无需外部音频文件) ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 1. 合成清脆双音复古黄铜车铃声 ("叮——叮！")
  function playBellSound() {
    if (!state.soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;

    function strike(time, pitchScale = 1.0) {
      // 双谐波正弦振荡器模拟金属敲击
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(2093 * pitchScale, time); // 高纯度金属泛音 C7

      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(3135 * pitchScale, time); // G7 复合共鸣

      // 击打瞬态极快爆发，指数平滑衰减
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(0.28, time + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.65);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(time);
      osc2.start(time);
      osc1.stop(time + 0.7);
      osc2.stop(time + 0.7);
    }

    strike(now, 1.0);
    strike(now + 0.12, 1.05); // 第二下稍高，逼真还原机械弹簧回弹敲击
  }

  // 2. 合成搞笑生动的鹈鹕啼鸣声 ("嘎——!!")
  function playSquawkSound() {
    if (!state.soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sawtooth';
    // 频率从 420Hz 骤降到 210Hz
    osc.frequency.setValueAtTime(420, now);
    osc.frequency.exponentialRampToValueAtTime(210, now + 0.35);

    // 带通共鸣滤波器模拟鸟类咽喉共鸣腔
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(850, now);
    filter.Q.setValueAtTime(3.5, now);

    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.35, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.42);
  }

  // 3. 飞跃风声与落地弹簧阻尼声
  function playJumpSound() {
    if (!state.soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(380, now + 0.25);

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.18, now + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.36);
  }

  // 4. 小鱼跳跃清脆水花/泡泡音 ("啵——！")
  function playFishSound() {
    if (!state.soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(587, now); // D5
    osc.frequency.exponentialRampToValueAtTime(1318, now + 0.14); // E6

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.22, now + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.26);
  }

  // 5. 自行车飞轮机械棘轮齿轮轻柔轻响 (踏频运转时)
  let lastClickTime = 0;
  function playRatchetClick() {
    if (!state.soundEnabled || state.currentSpeed < 3) return;
    if (!audioCtx) return;

    const now = performance.now();
    // 根据踏频计算声音间隔
    const interval = Math.max(70, 450 - state.currentSpeed * 6);
    if (now - lastClickTime > interval) {
      lastClickTime = now;
      const actxNow = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200 + Math.random() * 300, actxNow);

      gain.gain.setValueAtTime(0.035, actxNow);
      gain.gain.exponentialRampToValueAtTime(0.0001, actxNow + 0.025);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(actxNow);
      osc.stop(actxNow + 0.03);
    }
  }

  // --- 骨骼逆运动学求解器 (2-Bone IK Solver) ---
  // 输入：髋关节 H(x, y), 脚踏轴心 P(x, y), 大腿长 L1, 小腿长 L2
  // 求解：膝盖关节 K(x, y) 坐标，使双关节平滑向前弯曲
  function solve2BoneIK(Hx, Hy, Px, Py, L1, L2) {
    const dx = Px - Hx;
    const dy = Py - Hy;
    let dist = Math.hypot(dx, dy);

    // 边界防死锁约束
    const maxReach = (L1 + L2) * 0.999;
    const minReach = Math.abs(L1 - L2) * 1.01 + 2;
    if (dist > maxReach) dist = maxReach;
    if (dist < minReach) dist = minReach;

    // 髋-脚矢量基准角度
    const alpha = Math.atan2(dy, dx);

    // 余弦定理计算大腿与基准线的夹角 beta
    const cosBeta = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
    const beta = Math.acos(Math.max(-1, Math.min(1, cosBeta)));

    // 计算向前弯曲的膝盖坐标 (alpha - beta 使得膝盖朝向自行车车头)
    const kneeAngle = alpha - beta;
    const Kx = Hx + L1 * Math.cos(kneeAngle);
    const Ky = Hy + L1 * Math.sin(kneeAngle);

    return { Kx, Ky, dist };
  }

  // 骨骼肌肉锥形曲率几何生成器 (连接髋与膝)
  function getTaperedThigh(Hx, Hy, Kx, Ky, wH, wK, isNear) {
    const dx = Kx - Hx;
    const dy = Ky - Hy;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    const midX = (Hx + Kx) / 2 + (isNear ? nx * (wH * 0.45) : -nx * (wH * 0.2));
    const midY = (Hy + Ky) / 2 + (isNear ? ny * (wH * 0.45) : -ny * (wH * 0.2));

    const p1x = (Hx + nx * wH).toFixed(1), p1y = (Hy + ny * wH).toFixed(1);
    const p2x = (Kx + nx * wK).toFixed(1), p2y = (Ky + ny * wK).toFixed(1);
    const p3x = (Kx - nx * wK).toFixed(1), p3y = (Ky - ny * wK).toFixed(1);
    const p4x = (Hx - nx * wH).toFixed(1), p4y = (Hy - ny * wH).toFixed(1);

    return `M ${p1x},${p1y} Q ${midX.toFixed(1)},${midY.toFixed(1)} ${p2x},${p2y} A ${wK} ${wK} 0 0 1 ${p3x},${p3y} L ${p4x},${p4y} Z`;
  }

  // 辅助函数：更新速度挡位按钮高亮状态
  function updateSpeedButtonsUI(speed) {
    document.querySelectorAll('[data-speed]').forEach(b => {
      const s = parseFloat(b.getAttribute('data-speed'));
      b.classList.toggle('active', Math.abs(s - speed) < 1);
    });
  }

  // --- 天色主题环境切换 ---
  const themes = {

  function setTimeOfDay(timeKey) {
    state.timeOfDay = timeKey;
    const theme = themes[timeKey];
    if (!theme) return;

    // 天空与海洋渐变
    dom.skyStop1.setAttribute('stop-color', theme.sky[0]);
    dom.skyStop2.setAttribute('stop-color', theme.sky[1]);
    dom.skyStop3.setAttribute('stop-color', theme.sky[2]);
    dom.oceanStop1.setAttribute('stop-color', theme.ocean[0]);
    dom.oceanStop2.setAttribute('stop-color', theme.ocean[1]);

    // 太阳 / 月亮切换
    dom.sunMoonGroup.setAttribute('transform', `translate(${theme.sunPos.x}, ${theme.sunPos.y})`);
    if (theme.isNight) {
      dom.sunHalo.setAttribute('fill', 'url(#moonGlow)');
      dom.sunHalo.setAttribute('r', '50');
      dom.sunCore.setAttribute('opacity', '0');
      dom.moonBody.setAttribute('opacity', '1');
      dom.starsGroup.setAttribute('opacity', '1');
      dom.headlightBulb.setAttribute('fill', '#ffffff');
      dom.headlightBeamGroup.setAttribute('opacity', theme.beamOpacity);
    } else {
      dom.sunHalo.setAttribute('fill', 'url(#sunGlow)');
      dom.sunHalo.setAttribute('r', '70');
      dom.sunCore.setAttribute('opacity', '1');
      dom.sunCore.setAttribute('fill', theme.sunColor);
      dom.moonBody.setAttribute('opacity', '0');
      dom.starsGroup.setAttribute('opacity', '0');
      dom.headlightBulb.setAttribute('fill', '#fef08a');
      dom.headlightBeamGroup.setAttribute('opacity', theme.beamOpacity);
    }

    // 路灯微光
    const lampBulbs = document.querySelectorAll('.lamp-bulb');
    const lampGlows = document.querySelectorAll('.lamp-glow');
    lampBulbs.forEach(b => b.setAttribute('opacity', theme.isNight ? '1' : '0.3'));
    lampGlows.forEach(g => g.setAttribute('opacity', theme.isNight ? '0.45' : '0'));

    // 更新按钮状态
    ['btnDawn', 'btnDay', 'btnSunset', 'btnNight'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) {
        btn.classList.toggle('active', btn.getAttribute('data-time') === timeKey);
      }
    });

    showToast(
      timeKey === 'dawn' ? '🌅 清晨朝霞' :
      timeKey === 'day' ? '☀️ 艳阳晴空' :
      timeKey === 'sunset' ? '🌇 暮色晚霞' : '🌙 静谧星夜',
      '天色已变换'
    );
  }

  // --- 交互气泡提示器 ---
  let toastTimer = null;
  function showToast(icon, msg) {
    dom.toastIcon.textContent = icon;
    dom.toastMsg.textContent = msg;
    dom.toastBubble.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      dom.toastBubble.classList.remove('show');
    }, 1800);
  }

  // --- 特技触发动作 ---
  function triggerBell() {
    playBellSound();
    // 车铃震颤动画
    dom.bellGroup.setAttribute('transform', 'translate(626, 235) rotate(-15)');
    setTimeout(() => dom.bellGroup.setAttribute('transform', 'translate(626, 235) rotate(15)'), 60);
    setTimeout(() => dom.bellGroup.setAttribute('transform', 'translate(626, 235) rotate(-8)'), 120);
    setTimeout(() => dom.bellGroup.setAttribute('transform', 'translate(626, 235) rotate(0)'), 200);

    // 音波外扩
    dom.bellRing1.setAttribute('opacity', '0.9');
    dom.bellRing1.setAttribute('r', '8');
    dom.bellRing2.setAttribute('opacity', '0.7');
    dom.bellRing2.setAttribute('r', '14');

    let waveScale = 0;
    const waveInt = setInterval(() => {
      waveScale += 0.2;
      dom.bellRing1.setAttribute('r', 8 + waveScale * 14);
      dom.bellRing1.setAttribute('opacity', Math.max(0, 0.9 - waveScale * 0.9));
      dom.bellRing2.setAttribute('r', 14 + waveScale * 18);
      dom.bellRing2.setAttribute('opacity', Math.max(0, 0.7 - waveScale * 0.7));
      if (waveScale >= 1) clearInterval(waveInt);
    }, 30);

    showToast('🔔', '车铃叮咚清脆！');
  }

  function triggerSquawk() {
    if (state.isSquawking) return;
    state.isSquawking = true;
    state.squawkProgress = 0;
    playSquawkSound();
    dom.squawkBubble.setAttribute('opacity', '1');
    showToast('📣', '鹈鹕大叫一声：嘎——！');
  }

  function triggerJump() {
    if (state.isJumping) return;
    state.isJumping = true;
    state.jumpProgress = 0;
    dom.btnJump.classList.add('jump-active');
    playJumpSound();
    showToast('🦘', '酷炫抬头飞跃！');
  }

  function triggerFishJump() {
    if (state.isFishJumping) return;
    state.isFishJumping = true;
    state.fishJumpProgress = 0;
    playFishSound();
    showToast('🐟', '小鱼伙伴兴奋翻腾！');
  }

  // --- 主动画物理循环 (requestAnimationFrame, 60/120 FPS) ---
  function updateAnimation(now) {
    const dt = Math.min((now - state.lastFrameTime) / 1000, 0.1); // 时间差 (秒)
    state.lastFrameTime = now;

    // 1. 速度平滑缓动逼近目标速度
    state.currentSpeed += (state.targetSpeed - state.currentSpeed) * (dt * 4.5);
    if (Math.abs(state.currentSpeed - state.targetSpeed) < 0.05) {
      state.currentSpeed = state.targetSpeed;
    }

    // 仪表盘刷新
    dom.speedValue.textContent = Math.round(state.currentSpeed);
    const rpm = Math.round((state.currentSpeed / 60) * 150);
    dom.cadenceValue.textContent = state.currentSpeed > 0.5 ? rpm : 0;

    // 2. 累积路程与踏频曲柄角度
    const speedPxPerSec = state.currentSpeed * 12; // 像素速率换算
    state.distance += speedPxPerSec * dt;

    // 曲柄角速度 (rad/s)
    const crankAngularVelocity = (state.currentSpeed / 20) * Math.PI * 2;
    state.crankAngle = (state.crankAngle + crankAngularVelocity * dt) % (Math.PI * 2);

    // 车轮转动角 (deg)
    const wheelCircumference = 2 * Math.PI * 74;
    const wheelRotSpeed = (speedPxPerSec / wheelCircumference) * 360;
    state.wheelAngle = (state.wheelAngle + wheelRotSpeed * dt) % 360;

    // 3. 播放链条棘轮转动声音
    playRatchetClick();

    // 4. 自行车车轮无级旋转
    dom.rearSpokes.setAttribute('transform', `rotate(${state.wheelAngle})`);
    dom.frontSpokes.setAttribute('transform', `rotate(${state.wheelAngle})`);

    // 5. 公路中心虚线快速平移 (无缝视觉流动)
    dom.roadDashes.setAttribute('stroke-dashoffset', state.distance * 1.0);

    // 6. 沿途景物视差无限循环滚动
    // 木护栏 (周期 60px)
    const railPosts = document.querySelectorAll('.rail-post');
    const railOffset = (state.distance * 0.9) % 60;
    railPosts.forEach((post, i) => {
      post.setAttribute('x', i * 60 - railOffset);
    });

    // 沿海路灯与棕榈树 (周期 1440px)
    for (let i = 0; i < 4; i++) {
      const lamp = document.getElementById(`lamp_${i}`);
      const palm = document.getElementById(`palm_${i}`);
      const baseDist = (state.distance * 0.7) % 1440;
      let lx = (i * 360 + 40 - baseDist);
      if (lx < -120) lx += 1440;
      let px = (i * 360 + 220 - baseDist);
      if (px < -120) px += 1440;
      if (lamp) lamp.setAttribute('transform', `translate(${lx}, 300)`);
      if (palm) palm.setAttribute('transform', `translate(${px}, 305)`);
    }

    // 7. 海浪与远山平移微动
    const waveDist = state.distance * 0.25;
    for (let i = 0; i < 3; i++) {
      const wPath = document.getElementById(`wave_${i}`);
      if (wPath) {
        const wy = 360 + i * 16;
        const wOffset = (waveDist + i * 40) % 120;
        let d = `M${-120 - wOffset},${wy}`;
        for (let x = -120 - wOffset; x < 1150; x += 120) {
          d += ` Q${x + 30},${wy - 6} ${x + 60},${wy} T${x + 120},${wy}`;
        }
        wPath.setAttribute('d', d);
      }
    }

    // 远方帆船随波浪轻摇
    const boatX = ((420 - state.distance * 0.05) % 1100 + 1100) % 1100 - 50;
    const boatBob = Math.sin(now * 0.003) * 3;
    const boatTilt = Math.sin(now * 0.002) * 4;
    dom.sailboat.setAttribute('transform', `translate(${boatX}, ${348 + boatBob}) rotate(${boatTilt})`);

    // 云朵慢速飘荡
    const cloudN1X = ((360 - state.distance * 0.08) % 1200 + 1200) % 1200 - 150;
    const cloudN2X = ((880 - state.distance * 0.08) % 1200 + 1200) % 1200 - 150;
    const cN1 = document.getElementById('cloudN1');
    const cN2 = document.getElementById('cloudN2');
    if (cN1) cN1.setAttribute('transform', `translate(${cloudN1X}, 40) scale(1.1)`);
    if (cN2) cN2.setAttribute('transform', `translate(${cloudN2X}, 70) scale(0.95)`);

    // 8. 鹈鹕躯干呼吸与踩踏颠簸 (驻足时有轻柔呼吸起伏)
    const idleBreathing = Math.sin(now * 0.003) * 1.5;
    const pedalCadenceBob = state.currentSpeed > 1
      ? Math.sin(state.crankAngle * 2) * (1.8 + state.currentSpeed * 0.04)
      : idleBreathing;
    const roadVibration = Math.sin(state.distance * 0.15) * (state.currentSpeed > 5 ? 1.0 : 0.2);
    let totalBobY = pedalCadenceBob + roadVibration;

    // 9. 处理飞跃特技跳跃物理
    let jumpAngle = 0;
    if (state.isJumping) {
      state.jumpProgress += dt * 1.5; // 跳跃时长约 0.67s
      if (state.jumpProgress >= 1) {
        state.isJumping = false;
        state.jumpProgress = 0;
        dom.btnJump.classList.remove('jump-active');
      } else {
        // 抛物线跳跃 + 车头微仰
        const jp = state.jumpProgress;
        const jumpH = Math.sin(jp * Math.PI) * 45;
        jumpAngle = -Math.sin(jp * Math.PI) * 12; // 抬头 12 度
        totalBobY -= jumpH;

        // 阴影随高度缩小虚化
        const shadowScale = Math.max(0.4, 1 - (jumpH / 50) * 0.5);
        dom.rearWheelShadow.setAttribute('rx', 55 * shadowScale);
        dom.frontWheelShadow.setAttribute('rx', 55 * shadowScale);
        dom.centerShadow.setAttribute('rx', 140 * shadowScale);
        dom.rearWheelShadow.setAttribute('opacity', 0.65 * shadowScale);
      }
    } else {
      dom.rearWheelShadow.setAttribute('rx', 55);
      dom.frontWheelShadow.setAttribute('rx', 55);
      dom.centerShadow.setAttribute('rx', 140);
      dom.rearWheelShadow.setAttribute('opacity', 0.65);
    }

    // 应用车架动态姿态
    dom.bikePelicanGroup.setAttribute('transform', `translate(0, ${totalBobY}) rotate(${jumpAngle} 470 430)`);

    // 10. 核心骨骼逆运动学驱动双腿蹬车 (IK Rigging)
    const crankCenter = { x: 470, y: 430 };
    const crankRadius = 28;
    const L1 = 76; // 大腿骨骼长度
    const L2 = 78; // 小腿骨骼长度

    // 近端踏板 (Near Leg)
    const nearPedalPos = {
      x: crankCenter.x + crankRadius * Math.cos(state.crankAngle),
      y: crankCenter.y + crankRadius * Math.sin(state.crankAngle),
    };
    // 近端曲柄臂更新
    dom.nearCrankArm.setAttribute('x2', nearPedalPos.x);
    dom.nearCrankArm.setAttribute('y2', nearPedalPos.y);
    dom.nearPedalNode.setAttribute('transform', `translate(${nearPedalPos.x}, ${nearPedalPos.y})`);

    // 求解近端腿部 IK
    const nearHipPos = { x: 442, y: 318 };
    const nearIK = solve2BoneIK(nearHipPos.x, nearHipPos.y, nearPedalPos.x, nearPedalPos.y, L1, L2);

    // 更新近端大腿 (丰满锥形肌肉轮廓)
    const nKx = nearIK.Kx, nKy = nearIK.Ky;
    dom.nearThigh.setAttribute('d', getTaperedThigh(nearHipPos.x, nearHipPos.y, nKx, nKy, 16, 8, true));
    // 近端小腿骨骼线
    dom.nearShin.setAttribute('d', `M${nKx},${nKy} L${nearPedalPos.x},${nearPedalPos.y}`);
    // 近端脚蹼贴紧踏板并随踩踏角度微屈
    const footFlexNear = Math.sin(state.crankAngle - 0.3) * 14;
    dom.nearFoot.setAttribute('transform', `translate(${nearPedalPos.x}, ${nearPedalPos.y}) rotate(${footFlexNear})`);

    // 远端踏板 (Far Leg, 反向相差 180 度)
    const farAngle = state.crankAngle + Math.PI;
    const farPedalPos = {
      x: crankCenter.x + crankRadius * Math.cos(farAngle),
      y: crankCenter.y + crankRadius * Math.sin(farAngle),
    };
    dom.farCrankArm.setAttribute('x2', farPedalPos.x);
    dom.farCrankArm.setAttribute('y2', farPedalPos.y);
    dom.farPedalNode.setAttribute('transform', `translate(${farPedalPos.x}, ${farPedalPos.y})`);

    // 求解远端腿部 IK
    const farHipPos = { x: 436, y: 314 };
    const farIK = solve2BoneIK(farHipPos.x, farHipPos.y, farPedalPos.x, farPedalPos.y, L1, L2);
    const fKx = farIK.Kx, fKy = farIK.Ky;
    dom.farThigh.setAttribute('d', getTaperedThigh(farHipPos.x, farHipPos.y, fKx, fKy, 14, 7, false));
    dom.farShin.setAttribute('d', `M${fKx},${fKy} L${farPedalPos.x},${farPedalPos.y}`);
    const footFlexFar = Math.sin(farAngle - 0.3) * 14;
    dom.farFoot.setAttribute('transform', `translate(${farPedalPos.x}, ${farPedalPos.y}) rotate(${footFlexFar})`);

    // 11. 动态流体正弦波围巾 (根据速度动态增加摆动频率与幅度)
    const scarfSpeedFactor = 0.008 + state.currentSpeed * 0.0003;
    const scarfWaveAmp = 8 + (state.currentSpeed / 60) * 16;
    const swTime = now * scarfSpeedFactor;

    const w1_y1 = 236 + Math.sin(swTime) * scarfWaveAmp;
    const w1_y2 = 242 + Math.sin(swTime - 1.2) * (scarfWaveAmp * 1.5);
    const w1_tip = 248 + Math.sin(swTime - 2.4) * (scarfWaveAmp * 2.0);

    const w2_y1 = 252 + Math.sin(swTime - 0.6) * (scarfWaveAmp * 0.8);
    const w2_y2 = 262 + Math.sin(swTime - 1.8) * (scarfWaveAmp * 1.3);
    const w2_tip = 274 + Math.sin(swTime - 3.0) * (scarfWaveAmp * 1.8);

    dom.scarfRibbon1.setAttribute('d', `M525,246 Q460,${w1_y1} 380,${w1_y2} L378,${w1_y2 + 14} Q460,${w1_y1 + 14} 525,258 Z`);
    dom.scarfRibbon2.setAttribute('d', `M528,248 Q470,${w2_y1} 410,${w2_y2} L408,${w2_y2 + 12} Q470,${w2_y1 + 12} 528,260 Z`);
    dom.fringe1.setAttribute('x1', '378');
    dom.fringe1.setAttribute('y1', w1_y2);
    dom.fringe1.setAttribute('x2', '362');
    dom.fringe1.setAttribute('y2', w1_tip);
    dom.fringe2.setAttribute('x1', '378');
    dom.fringe2.setAttribute('y1', w1_y2 + 14);
    dom.fringe2.setAttribute('x2', '362');
    dom.fringe2.setAttribute('y2', w1_tip + 14);

    // 12. 鹈鹕大喉囊与鸟喙弹性动力学 (微风中颤动，大叫时下垂张开)
    const pouchJiggle = Math.sin(now * 0.012) * (2 + state.currentSpeed * 0.08);
    if (state.isSquawking) {
      state.squawkProgress += dt * 2.2;
      if (state.squawkProgress >= 1) {
        state.isSquawking = false;
        dom.squawkBubble.setAttribute('opacity', '0');
        dom.lowerJawGroup.setAttribute('transform', 'translate(12, 6) rotate(0)');
        dom.mouthCavity.setAttribute('opacity', '0');
      } else {
        const sp = Math.sin(state.squawkProgress * Math.PI);
        const jawOpenDeg = sp * 24; // 下颚张开 24 度
        dom.lowerJawGroup.setAttribute('transform', `translate(12, 6) rotate(${jawOpenDeg})`);
        dom.mouthCavity.setAttribute('opacity', sp * 0.9);
      }
    } else {
      // 常态微风颤动
      const pouchBottomY = 50 + pouchJiggle;
      dom.gularPouch.setAttribute('d', `M-2,2 C18,${35 + pouchJiggle * 0.5} 48,${pouchBottomY} 92,13 C52,22 18,16 -2,2 Z`);
    }

    // 后脑勺小羽毛被风吹拂
    const crestWiggle = Math.sin(now * 0.008) * (2 + state.currentSpeed * 0.1);
    dom.crestFeathers.setAttribute('transform', `rotate(${crestWiggle})`);

    // 13. 车筐小鱼伙伴欢腾物理
    if (state.isFishJumping) {
      state.fishJumpProgress += dt * 2.0;
      if (state.fishJumpProgress >= 1) {
        state.fishJumpProgress = 0;
        state.isFishJumping = false;
      } else {
        const fp = state.fishJumpProgress;
        const fishY = -Math.sin(fp * Math.PI) * 28;
        const fishRot = fp * 360;
        dom.basketFish.setAttribute('transform', `translate(22, ${10 + fishY}) rotate(${fishRot})`);
      }
    } else {
      const fishBob = Math.sin(now * 0.008) * (1.5 + state.currentSpeed * 0.05);
      dom.basketFish.setAttribute('transform', `translate(22, ${10 + fishBob})`);
      const finWag = Math.sin(now * 0.015) * 15;
      dom.fishFin.setAttribute('transform', `rotate(${finWag} 6 -6)`);
    }

    // 14. 眼神追踪 (视线微移) 与随机眨眼
    if (Math.random() < 0.008) {
      // 眨眼
      dom.eyeLid.setAttribute('d', 'M-8,-8 L8,-8 L8,8 L-8,8 Z');
      setTimeout(() => {
        dom.eyeLid.setAttribute('d', 'M-8,-8 L8,-8 L8,-8 L-8,-8 Z');
      }, 140);
    }
    // 眼神视线追踪 (向鼠标微转，高速时专注看路)
    let pupilTargetX = 1.8;
    let pupilTargetY = -0.4;
    if (state.currentSpeed < 35) {
      const eyeWorldX = 570;
      const eyeWorldY = 135;
      const mdx = state.mouseX - eyeWorldX;
      const mdy = state.mouseY - eyeWorldY;
      const mDist = Math.hypot(mdx, mdy) || 1;
      const lookRadius = Math.min(2.4, mDist / 80);
      pupilTargetX = 1.0 + (mdx / mDist) * lookRadius;
      pupilTargetY = -0.4 + (mdy / mDist) * (lookRadius * 0.8);
    } else {
      // 狂飙时坚毅前视
      pupilTargetX = 2.6;
      pupilTargetY = -0.2;
    }
    dom.eyePupil.setAttribute('cx', pupilTargetX.toFixed(2));
    dom.eyePupil.setAttribute('cy', pupilTargetY.toFixed(2));
    if (dom.eyeGlint1) {
      dom.eyeGlint1.setAttribute('cx', (pupilTargetX + 1.2).toFixed(2));
      dom.eyeGlint1.setAttribute('cy', (pupilTargetY - 1.2).toFixed(2));
    }
    if (dom.eyeGlint2) {
      dom.eyeGlint2.setAttribute('cx', (pupilTargetX - 1.0).toFixed(2));
      dom.eyeGlint2.setAttribute('cy', (pupilTargetY + 1.2).toFixed(2));
    }

    // 15. 速度粒子特效 (车轮烟尘与高速破风线)
    if (state.currentSpeed > 8) {
      // 扬尘微粒
      for (let i = 0; i < 14; i++) {
        const p = document.getElementById(`dust_${i}`);
        if (p) {
          const pLife = (now * 0.003 + i * 0.25) % 1.0;
          const px = 280 - pLife * (50 + state.currentSpeed * 1.5);
          const py = 508 - Math.sin(pLife * Math.PI) * (14 + i * 2);
          const pr = 2 + pLife * 8;
          const popacity = (1 - pLife) * 0.45;
          p.setAttribute('cx', px);
          p.setAttribute('cy', py);
          p.setAttribute('r', pr);
          p.setAttribute('opacity', popacity);
        }
      }
    } else {
      for (let i = 0; i < 14; i++) {
        const p = document.getElementById(`dust_${i}`);
        if (p) p.setAttribute('opacity', '0');
      }
    }

    // 狂飙超速破风流线
    if (state.currentSpeed >= 40) {
      dom.windLines.setAttribute('opacity', ((state.currentSpeed - 40) / 20).toFixed(2));
      for (let i = 0; i < 6; i++) {
        const wl = document.getElementById(`wind_${i}`);
        if (wl) {
          const wLife = (now * 0.005 + i * 0.18) % 1.0;
          const wx = 800 - wLife * 600;
          const wy = 180 + i * 45 + Math.sin(wLife * 6) * 10;
          wl.setAttribute('x1', wx);
          wl.setAttribute('y1', wy);
          wl.setAttribute('x2', wx + 80 + state.currentSpeed);
          wl.setAttribute('y2', wy);
        }
      }
    } else {
      dom.windLines.setAttribute('opacity', '0');
    }

    requestAnimationFrame(updateAnimation);
  }

  // --- 用户事件绑定 (键盘快捷键、按钮、鼠标互动) ---
  function setupEventListeners() {
    // 速度预设按钮
    document.querySelectorAll('[data-speed]').forEach(btn => {
      btn.addEventListener('click', () => {
        const speed = parseFloat(btn.getAttribute('data-speed'));
        state.targetSpeed = speed;
        document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initAudio();
        showToast('⚡', `切换挡位: ${speed} km/h`);
      });
    });

    // 天色预设按钮
    document.querySelectorAll('[data-time]').forEach(btn => {
      btn.addEventListener('click', () => {
        const timeKey = btn.getAttribute('data-time');
        setTimeOfDay(timeKey);
        initAudio();
      });
    });

    // 特技动作按钮
    dom.btnRingBell.addEventListener('click', triggerBell);
    dom.btnSquawk.addEventListener('click', triggerSquawk);
    dom.btnJump.addEventListener('click', triggerJump);
    dom.btnFeedFish.addEventListener('click', triggerFishJump);

    // 声音切换按钮
    dom.btnSound.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      dom.soundIcon.textContent = state.soundEnabled ? '🔊' : '🔇';
      dom.soundText.textContent = state.soundEnabled ? '音效开' : '静音中';
      dom.btnSound.classList.toggle('active', state.soundEnabled);
      if (state.soundEnabled) initAudio();
      showToast(state.soundEnabled ? '🔊' : '🔇', state.soundEnabled ? '已开启音效' : '已静音');
    });

    // 全屏切换
    dom.btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        dom.stageWrapper.requestFullscreen().catch(err => {
          alert('全屏模式受限: ' + err.message);
        });
      } else {
        document.exitFullscreen();
      }
    });

    // 鼠标指针移动追踪 (眼神互动)
    dom.stage.addEventListener('pointermove', (e) => {
      const rect = dom.stage.getBoundingClientRect();
      state.mouseX = ((e.clientX - rect.left) / rect.width) * 1000;
      state.mouseY = ((e.clientY - rect.top) / rect.height) * 600;
    });

    // 点击 SVG 画面任意处交互触发
    dom.stage.addEventListener('pointerdown', (e) => {
      initAudio();
      const rect = dom.stage.getBoundingClientRect();
      const clickX = ((e.clientX - rect.left) / rect.width) * 1000;
      const clickY = ((e.clientY - rect.top) / rect.height) * 600;

      // 如果点击车铃区域
      if (Math.hypot(clickX - 626, clickY - 235) < 45) {
        triggerBell();
      }
      // 如果点击头部大嘴区域
      else if (Math.hypot(clickX - 640, clickY - 145) < 70) {
        triggerSquawk();
      }
      // 如果点击车筐小鱼
      else if (Math.hypot(clickX - 670, clickY - 240) < 45) {
        triggerFishJump();
      }
      // 否则执行特技跳跃
      else {
        triggerJump();
      }
    });

    // 全局键盘操控
    window.addEventListener('keydown', (e) => {
      initAudio();
      switch (e.code) {
        case 'Space':
          e.preventDefault();
          triggerBell();
          break;
        case 'KeyH':
          triggerSquawk();
          break;
        case 'KeyJ':
        case 'ArrowUp':
          e.preventDefault();
          triggerJump();
          break;
        case 'KeyF':
          triggerFishJump();
          break;
        case 'Digit0':
          document.getElementById('btnSpeed0').click();
          break;
        case 'Digit1':
          document.getElementById('btnSpeed15').click();
          break;
        case 'Digit2':
          document.getElementById('btnSpeed30').click();
          break;
        case 'Digit3':
          document.getElementById('btnSpeed60').click();
          break;
        case 'ArrowRight':
          state.targetSpeed = Math.min(70, state.targetSpeed + 5);
          updateSpeedButtonsUI(state.targetSpeed);
          showToast('⚡', `加速: ${Math.round(state.targetSpeed)} km/h`);
          break;
        case 'ArrowDown':
        case 'ArrowLeft':
          e.preventDefault();
          state.targetSpeed = Math.max(0, state.targetSpeed - 5);
          updateSpeedButtonsUI(state.targetSpeed);
          showToast('🛑', `减速: ${Math.round(state.targetSpeed)} km/h`);
          break;
        case 'KeyT': {
          const cycle = ['dawn', 'day', 'sunset', 'night'];
          const nextIdx = (cycle.indexOf(state.timeOfDay) + 1) % cycle.length;
          setTimeOfDay(cycle[nextIdx]);
          break;
        }
        case 'KeyM':
          dom.btnSound.click();
          break;
      }
    });
  }

  // --- 初始化启动引擎 ---
  window.addEventListener('DOMContentLoaded', () => {
    initStaticSvgGeometry();
    setupEventListeners();
    setTimeOfDay('day');
    requestAnimationFrame(updateAnimation);
  });
</script>
</body>
</html>
