<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;background:#cfe9f7;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:sans-serif}
  svg{width:min(96vw,900px);height:auto;display:block}
  .wheel{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
  .crank{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bob{animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .cloud{animation:drift 14s linear infinite}
  .cloud.c2{animation-duration:20s;animation-delay:-8s}
  @keyframes drift{from{transform:translateX(900px)}to{transform:translateX(-300px)}}
  .road{animation:road .6s linear infinite}
  @keyframes road{from{transform:translateX(0)}to{transform:translateX(-80px)}}
  .pouch{animation:pouch 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
  @keyframes pouch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.12)}}
</style>
</head>
<body>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 天空与太阳 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecdf3"/><stop offset="1" stop-color="#e2f3fc"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#sky)"/>
  <circle cx="780" cy="90" r="45" fill="#ffd94a"/>

  <!-- 云 -->
  <g class="cloud" fill="#fff" opacity=".9">
    <ellipse cx="0" cy="110" rx="50" ry="22"/><ellipse cx="35" cy="98" rx="38" ry="24"/><ellipse cx="-35" cy="102" rx="32" ry="18"/>
  </g>
  <g class="cloud c2" fill="#fff" opacity=".8">
    <ellipse cx="0" cy="170" rx="40" ry="16"/><ellipse cx="28" cy="160" rx="30" ry="18"/>
  </g>

  <!-- 远山 -->
  <path d="M0 330 Q120 240 240 320 T480 310 T720 325 T900 300 V360 H0Z" fill="#9fd08f"/>
  <!-- 地面 -->
  <rect y="350" width="900" height="150" fill="#6db35e"/>
  <rect y="370" width="900" height="70" fill="#555"/>
  <!-- 路面虚线 -->
  <g class="road" stroke="#fff" stroke-width="4" stroke-dasharray="40 40">
    <line x1="-80" y1="405" x2="1000" y2="405"/>
  </g>

  <!-- 自行车 + 鹈鹕 -->
  <g transform="translate(300 300)">
    <!-- 后轮 -->
    <g class="wheel">
      <circle cx="0" cy="80" r="60" fill="none" stroke="#222" stroke-width="8"/>
      <circle cx="0" cy="80" r="52" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#bbb" stroke-width="3">
        <line x1="0" y1="20" x2="0" y2="140"/><line x1="-60" y1="80" x2="60" y2="80"/>
        <line x1="-42" y1="38" x2="42" y2="122"/><line x1="42" y1="38" x2="-42" y2="122"/>
      </g>
      <circle cx="0" cy="80" r="6" fill="#333"/>
    </g>
    <!-- 前轮 -->
    <g class="wheel">
      <circle cx="220" cy="80" r="60" fill="none" stroke="#222" stroke-width="8"/>
      <circle cx="220" cy="80" r="52" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#bbb" stroke-width="3">
        <line x1="220" y1="20" x2="220" y2="140"/><line x1="160" y1="80" x2="280" y2="80"/>
        <line x1="178" y1="38" x2="262" y2="122"/><line x1="262" y1="38" x2="178" y2="122"/>
      </g>
      <circle cx="220" cy="80" r="6" fill="#333"/>
    </g>
    <!-- 车架 -->
    <g stroke="#d33" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M0 80 L70 0 L165 0 L220 80"/>
      <path d="M0 80 L110 80 L165 0"/>
      <path d="M70 0 L110 80"/>
      <path d="M165 0 L175 -30"/>
      <path d="M70 0 L60 -25"/>
    </g>
    <!-- 车把 -->
    <path d="M160 -32 Q185 -45 205 -30" stroke="#222" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- 车座 -->
    <path d="M35 -30 L85 -30 L75 -22 L45 -22Z" fill="#222"/>
    <!-- 脚踏曲柄 -->
    <g class="crank">
      <line x1="110" y1="48" x2="110" y2="112" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <rect x="98" y="42" width="24" height="8" rx="3" fill="#222"/>
      <rect x="98" y="110" width="24" height="8" rx="3" fill="#222"/>
    </g>
    <circle cx="110" cy="80" r="12" fill="#444"/>

    <!-- 鹈鹕 -->
    <g class="bob">
      <!-- 腿 -->
      <g stroke="#f4a52b" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M70 -30 L100 30 L110 48">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            values="M70 -30 L100 30 L110 48; M70 -30 L130 50 L110 80; M70 -30 L95 60 L110 112; M70 -30 L75 40 L110 80; M70 -30 L100 30 L110 48"/>
        </path>
        <path d="M70 -30 L95 60 L110 112">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite"
            values="M70 -30 L95 60 L110 112; M70 -30 L75 40 L110 80; M70 -30 L100 30 L110 48; M70 -30 L130 50 L110 80; M70 -30 L95 60 L110 112"/>
        </path>
      </g>
      <!-- 身体 -->
      <ellipse cx="80" cy="-60" rx="55" ry="38" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
      <!-- 尾羽 -->
      <path d="M28 -70 L0 -85 L20 -60 L-5 -55 L30 -50Z" fill="#e8e8e0" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
      <!-- 翅膀 -->
      <path d="M60 -70 Q95 -95 130 -60 Q100 -50 70 -55Z" fill="#dcdcd3" stroke="#333" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" values="0 60 -70;6 60 -70;0 60 -70" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <!-- 脖子 -->
      <path d="M115 -75 Q135 -110 150 -135" stroke="#f7f7f2" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M115 -75 Q135 -110 150 -135" stroke="#333" stroke-width="28" fill="none" stroke-linecap="round" opacity="0"/>
      <!-- 头 -->
      <circle cx="155" cy="-145" r="24" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
      <!-- 眼睛 -->
      <circle cx="165" cy="-152" r="5" fill="#222"/>
      <circle cx="167" cy="-154" r="1.8" fill="#fff"/>
      <!-- 上喙 -->
      <path d="M172 -148 L250 -138 L172 -128Z" fill="#f9b233" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
      <!-- 下喙 / 喉囊 -->
      <path class="pouch" d="M172 -130 L245 -136 Q225 -95 172 -110Z" fill="#f0a020" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
      <!-- 翅膀扶车把（手臂） -->
      <path d="M120 -70 Q160 -55 178 -34" stroke="#dcdcd3" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M120 -70 Q160 -55 178 -34" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>
    </g>
  </g>

  <text x="450" y="480" text-anchor="middle" fill="#2b5a2b" font-size="20">🚲 鹈鹕骑行中…</text>
</svg>
</body>
</html>
