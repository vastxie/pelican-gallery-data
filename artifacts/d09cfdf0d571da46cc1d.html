<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --period: 1.35s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #163044;
      overflow: hidden;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: absolute;
      left: 4.5%;
      top: 5.5%;
      color: #f7f1e6;
      text-shadow: 0 2px 12px rgba(20, 40, 55, 0.45);
      pointer-events: none;
    }

    .caption h1 {
      font-size: clamp(1.4rem, 2.6vw, 2.3rem);
      font-weight: 650;
      letter-spacing: 0.08em;
      line-height: 1.15;
    }

    .caption p {
      margin-top: 0.35rem;
      font-size: clamp(0.72rem, 1.2vw, 0.95rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.82;
    }

    .hint {
      position: absolute;
      right: 4.5%;
      bottom: 4.5%;
      color: rgba(255, 248, 235, 0.72);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      pointer-events: none;
    }

    .cloud-a { animation: drift 48s linear infinite; }
    .cloud-b { animation: drift 72s linear infinite; }
    .cloud-c { animation: drift 56s linear infinite; }
    .island-drift { animation: drift-slow 90s linear infinite; }
    .wave-a { animation: drift 9s linear infinite; }
    .wave-b { animation: drift 13s linear infinite; }
    .wave-c { animation: drift 7.5s linear infinite; }
    .sparkle { animation: twinkle 2.8s ease-in-out infinite; }
    .road-strip { animation: road 1.35s linear infinite; }
    .grass-strip { animation: road 1.35s linear infinite; }
    .dust { animation: dust 1.35s linear infinite; }

    .rider-bob { animation: bob 0.675s ease-in-out infinite; }
    .pouch-jiggle { animation: jiggle 0.675s ease-in-out infinite; }
    .wing-balance { animation: flap 0.9s ease-in-out infinite; }
    .head-bob { animation: head 1.35s ease-in-out infinite; }
    .fish-wag { animation: wag 0.4s ease-in-out infinite; }
    .cap-string { animation: string 0.9s ease-in-out infinite; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-400px); }
    }

    @keyframes drift-slow {
      from { transform: translateX(0); }
      to { transform: translateX(-500px); }
    }

    @keyframes road {
      from { transform: translateX(0); }
      to { transform: translateX(-402px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    @keyframes jiggle {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(3px) scaleY(1.06); }
    }

    @keyframes flap {
      0%, 100% { transform: rotate(6deg); }
      50% { transform: rotate(-10deg); }
    }

    @keyframes head {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes wag {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }

    @keyframes string {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-6deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.8; }
    }

    @keyframes dust {
      0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
      30% { opacity: 0.45; }
      100% { opacity: 0; transform: translate(-90px, -18px) scale(1.2); }
    }

    .paused .cloud-a,
    .paused .cloud-b,
    .paused .cloud-c,
    .paused .island-drift,
    .paused .wave-a,
    .paused .wave-b,
    .paused .wave-c,
    .paused .sparkle,
    .paused .road-strip,
    .paused .grass-strip,
    .paused .dust,
    .paused .rider-bob,
    .paused .pouch-jiggle,
    .paused .wing-balance,
    .paused .head-bob,
    .paused .fish-wag,
    .paused .cap-string {
      animation-play-state: paused;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>

  <script>
    (function () {
      const PERIOD = 1350;
      const bb = { x: 595, y: 500 };
      const crankLen = 36;
      const hipFar = { x: 532, y: 408 };
      const hipNear = { x: 552, y: 414 };
      const thigh = 70;
      const shin = 68;

      const crankSpin = document.getElementById("crank-spin");
      const farWheel = document.getElementById("far-wheel-spin");
      const nearWheel = document.getElementById("near-wheel-spin");
      const pedalFarLevel = document.getElementById("pedal-far-level");
      const pedalNearLevel = document.getElementById("pedal-near-level");
      const chain = document.getElementById("chain");
      const legFar = document.getElementById("leg-far");
      const legFarInner = document.getElementById("leg-far-inner");
      const legNear = document.getElementById("leg-near");
      const legNearInner = document.getElementById("leg-near-inner");
      const footFarDraw = document.getElementById("foot-far-draw");
      const footNearDraw = document.getElementById("foot-near-draw");
      const stage = document.getElementById("stage");

      let paused = false;
      let pauseAt = 0;
      let pauseAccum = 0;
      const t0 = performance.now();

      stage.addEventListener("click", function () {
        paused = !paused;
        if (paused) pauseAt = performance.now();
        else pauseAccum += performance.now() - pauseAt;
        stage.classList.toggle("paused", paused);
      });

      function kneePoint(hip, foot) {
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        let d = Math.hypot(dx, dy);
        const maxLen = thigh + shin - 1.5;
        const minLen = Math.abs(thigh - shin) + 1.5;
        if (d < 0.001) d = 0.001;
        const scale = d > maxLen ? maxLen / d : d < minLen ? minLen / d : 1;
        const fx = hip.x + dx * scale;
        const fy = hip.y + dy * scale;
        d = Math.hypot(fx - hip.x, fy - hip.y);
        const a = (thigh * thigh - shin * shin + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, thigh * thigh - a * a));
        const ux = (fx - hip.x) / d;
        const uy = (fy - hip.y) / d;
        const px = hip.x + ux * a;
        const py = hip.y + uy * a;
        const k1 = { x: px - uy * h, y: py + ux * h };
        const k2 = { x: px + uy * h, y: py - ux * h };
        return k1.x >= k2.x ? k1 : k2;
      }

      function legPath(hip, foot) {
        const k = kneePoint(hip, foot);
        return "M " + hip.x + " " + hip.y + " L " + k.x + " " + k.y + " L " + foot.x + " " + foot.y;
      }

      function footMarkup(foot, angle, color) {
        const deg = (angle * 180) / Math.PI;
        return (
          '<g transform="translate(' + foot.x + " " + foot.y + ") rotate(" + deg + ')">' +
          '<ellipse cx="10" cy="4" rx="16" ry="7" fill="' + color + '"/>' +
          '<path d="M2,4 Q10,16 22,6" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round"/>' +
          '<path d="M6,6 Q12,18 20,8" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>' +
          "</g>"
        );
      }

      function tick(now) {
        if (!paused) {
          const t = now - t0 - pauseAccum;
          const turns = t / PERIOD;
          const angle = turns * Math.PI * 2;
          const deg = (turns * 360) % 360;
          const counter = -deg;

          crankSpin.setAttribute("transform", "rotate(" + deg + ")");
          farWheel.setAttribute("transform", "rotate(" + deg + ")");
          nearWheel.setAttribute("transform", "rotate(" + deg + ")");
          pedalFarLevel.setAttribute("transform", "rotate(" + counter + ")");
          pedalNearLevel.setAttribute("transform", "rotate(" + counter + ")");
          chain.setAttribute("stroke-dashoffset", String((-turns * 36) % 1000));

          const farAng = angle + Math.PI / 2;
          const nearAng = angle + Math.PI / 2 + Math.PI;
          const footFar = {
            x: bb.x + Math.cos(farAng) * crankLen,
            y: bb.y + Math.sin(farAng) * crankLen
          };
          const footNear = {
            x: bb.x + Math.cos(nearAng) * crankLen,
            y: bb.y + Math.sin(nearAng) * crankLen
          };

          const pFar = legPath(hipFar, footFar);
          const pNear = legPath(hipNear, footNear);
          legFar.setAttribute("d", pFar);
          legFarInner.setAttribute("d", pFar);
          legNear.setAttribute("d", pNear);
          legNearInner.setAttribute("d", pNear);
          footFarDraw.innerHTML = footMarkup(footFar, 0.15, "#d49212");
          footNearDraw.innerHTML = footMarkup(footNear, 0.12, "#e8a317");
        }
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
