<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #90EE90 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  svg {
    width: 800px;
    height: 500px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 云朵 -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="40" ry="20" fill="white" opacity="0.9"/>
      <ellipse cx="-25" cy="5" rx="25" ry="15" fill="white" opacity="0.9"/>
      <ellipse cx="25" cy="5" rx="25" ry="15" fill="white" opacity="0.9"/>
    </g>
  </defs>

  <!-- 背景装饰 -->
  <!-- 云朵1 -->
  <g transform="translate(100,80)">
    <use href="#cloud"/>
    <animateTransform attributeName="transform" type="translate" from="100,80" to="900,80" dur="20s" repeatCount="indefinite"/>
  </g>
  <!-- 云朵2 -->
  <g transform="translate(400,120)">
    <use href="#cloud"/>
    <animateTransform attributeName="transform" type="translate" from="400,120" to="1200,120" dur="28s" repeatCount="indefinite"/>
  </g>
  <!-- 云朵3 -->
  <g transform="translate(-100,60)">
    <use href="#cloud"/>
    <animateTransform attributeName="transform" type="translate" from="-100,60" to="900,60" dur="24s" repeatCount="indefinite"/>
  </g>

  <!-- 地面线 -->
  <rect x="0" y="300" width="800" height="200" fill="#90EE90"/>
  <rect x="0" y="300" width="800" height="8" fill="#5D8A3C"/>

  <!-- 路面标线动画 -->
  <g>
    <rect x="0" y="330" width="60" height="8" rx="4" fill="white" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-200,0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="330" width="60" height="8" rx="4" fill="white" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-200,0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="330" width="60" height="8" rx="4" fill="white" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-200,0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="330" width="60" height="8" rx="4" fill="white" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-200,0" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="330" width="60" height="8" rx="4" fill="white" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-200,0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 主体：鹈鹕+自行车组 居中 -->
  <g id="pelican-bike" transform="translate(400,290)">

    <!-- ===== 自行车 ===== -->
    <!-- 车架 -->
    <!-- 后轮轴到座位 -->
    <line x1="-55" y1="0" x2="-10" y2="-55" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <!-- 后轮轴到中轴 -->
    <line x1="-55" y1="0" x2="0" y2="-10" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <!-- 前轮轴到车把 -->
    <line x1="55" y1="0" x2="30" y2="-60" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <!-- 中轴到前轮轴 -->
    <line x1="0" y1="-10" x2="55" y2="0" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <!-- 座位支撑到中轴 -->
    <line x1="-10" y1="-55" x2="0" y2="-10" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <!-- 上管 座位到车把 -->
    <line x1="-10" y1="-55" x2="30" y2="-60" stroke="#555" stroke-width="5" stroke-linecap="round"/>

    <!-- 后轮 -->
    <g transform="translate(-55,0)">
      <circle r="42" fill="none" stroke="#333" stroke-width="5"/>
      <circle r="8" fill="#555"/>
      <!-- 轮毂辐条 -->
      <g stroke="#888" stroke-width="2">
        <line x1="0" y1="-34" x2="0" y2="34">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="-34" y1="0" x2="34" y2="0">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="-24" y1="-24" x2="24" y2="24">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="24" y1="-24" x2="-24" y2="24">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle r="6" fill="#777"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(55,0)">
      <circle r="42" fill="none" stroke="#333" stroke-width="5"/>
      <circle r="8" fill="#555"/>
      <g stroke="#888" stroke-width="2">
        <line x1="0" y1="-34" x2="0" y2="34">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="-34" y1="0" x2="34" y2="0">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="-24" y1="-24" x2="24" y2="24">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
        <line x1="24" y1="-24" x2="-24" y2="24">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        </line>
      </g>
      <circle r="6" fill="#777"/>
    </g>

    <!-- 车把 -->
    <line x1="22" y1="-60" x2="38" y2="-60" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <line x1="30" y1="-55" x2="30" y2="-65" stroke="#444" stroke-width="4" stroke-linecap="round"/>

    <!-- 车座 -->
    <rect x="-28" y="-62" width="36" height="8" rx="4" fill="#333"/>

    <!-- 踏板 & 曲柄动画 -->
    <g transform="translate(0,-10)">
      <!-- 中轴 -->
      <circle r="8" fill="#666"/>
      <!-- 旋转曲柄 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="18" stroke="#555" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="18" r="5" fill="#888"/>
        <line x1="0" y1="0" x2="0" y2="-18" stroke="#555" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="-18" r="5" fill="#888"/>
      </g>
    </g>

    <!-- ===== 鹈鹕身体 ===== -->
    <!-- 身体 -->
    <ellipse cx="-5" cy="-85" rx="32" ry="38" fill="white" stroke="#ddd" stroke-width="1.5"/>

    <!-- 翅膀（扑动动画） -->
    <!-- 左翅 -->
    <g transform="translate(-5,-85)">
      <path d="M-32,0 Q-70,-15 -65,20 Q-50,10 -32,5 Z" fill="#e8e8e8">
        <animateTransform attributeName="transform" type="rotate" from="-10,-32,0" to="15,-32,0" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1" keyTimes="0;1" additive="sum"/>
      </path>
    </g>
    <!-- 右翅 -->
    <g transform="translate(-5,-85)">
      <path d="M32,0 Q70,-15 65,20 Q50,10 32,5 Z" fill="#e8e8e8">
        <animateTransform attributeName="transform" type="rotate" from="10,32,0" to="-15,32,0" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1" keyTimes="0;1" additive="sum"/>
      </path>
    </g>

    <!-- 脖子 -->
    <ellipse cx="-5" cy="-118" rx="14" ry="22" fill="white"/>

    <!-- 头部 -->
    <ellipse cx="-5" cy="-148" rx="24" ry="22" fill="white"/>

    <!-- 眼睛 -->
    <circle cx="10" cy="-152" r="7" fill="#FFD700"/>
    <circle cx="10" cy="-152" r="4" fill="#222"/>
    <circle cx="12" cy="-154" r="1.5" fill="white"/>

    <!-- 喙 上半 -->
    <path d="M-5,-138 Q30,-135 55,-128 Q52,-122 30,-126 Q10,-128 -5,-132 Z" fill="#FF8C00"/>
    <!-- 喙 下半/喉囊 -->
    <path d="M-5,-132 Q10,-128 30,-126 Q28,-115 10,-118 Q-3,-120 -5,-128 Z" fill="#FF6600" opacity="0.8"/>
    <!-- 喉囊鼓动 -->
    <ellipse cx="15" cy="-120" rx="14" ry="9" fill="#FF7F00" opacity="0.7">
      <animate attributeName="ry" from="9" to="14" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1" keyTimes="0;1"/>
    </ellipse>

    <!-- 脚（踩踏板） -->
    <!-- 左脚 -->
    <g transform="translate(0,-10)">
      <line x1="-5" y1="-75" x2="0" y2="-28">
        <animate attributeName="x2" from="-5" to="5" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1" keyTimes="0;1"/>
        <animate attributeName="y2" from="-28" to="-8" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1" keyTimes="0;1"/>
      </line>
    </g>
    <!-- 右脚 -->
    <g transform="translate(0,-10)">
      <line x1="-5" y1="-75" x2="0" y2="-8">
        <animate attributeName="x2" from="5" to="-5" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1" keyTimes="0;1"/>
        <animate attributeName="y2" from="-8" to="-28" dur="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1" keyTimes="0;1"/>
      </line>
    </g>

    <!-- 帽子（可爱） -->
    <rect x="-20" y="-178" width="40" height="18" rx="3" fill="#4169E1"/>
    <rect x="-26" y="-164" width="52" height="7" rx="3.5" fill="#4169E1"/>
    <!-- 帽子上的小球 -->
    <circle cx="-5" cy="-183" r="5" fill="#FF4444"/>

  </g>

  <!-- 标题文字 -->
  <text x="400" y="460" text-anchor="middle" font-family="楷体, KaiTi, serif" font-size="28" fill="#2d5a27" font-weight="bold">鹈鹕骑自行车</text>

</svg>
</body>
</html>
