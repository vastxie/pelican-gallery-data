<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  :root{
    --ink:#22333b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:radial-gradient(circle at 50% 0%,#2b3a4a,#131a21 70%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#eaf4f8;
  }
  h1{font-size:20px;font-weight:600;letter-spacing:2px;margin:18px 0 0;}
  .stage{
    width:min(94vw,900px);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.12);
  }
  svg{display:block;width:100%;height:auto;background:#bfe9fb;}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;font-size:13px;}
  button{
    cursor:pointer;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#eaf4f8;
    padding:6px 14px;border-radius:999px;font-size:13px;
    transition:.2s;
  }
  button:hover{background:rgba(255,255,255,.2);}
  button.on{background:#ffb03a;color:#22333b;border-color:#ffb03a;font-weight:600;}
</style>
</head>
<body>

<h1>🚲 骑自行车的鹈鹕（纯 SVG + SMIL 动画）</h1>

<div class="stage">
<svg id="scene" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" aria-label="一只鹈鹕骑着自行车前进">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec8ef"/>
      <stop offset=".55" stop-color="#a9e2f8"/>
      <stop offset="1" stop-color="#ffe6bd"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7178"/>
      <stop offset="1" stop-color="#454b52"/>
    </linearGradient>

    <!-- 可复用的小部件 -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="34" ry="20"/>
      <ellipse cx="-28" cy="6" rx="22" ry="14"/>
      <ellipse cx="26" cy="7" rx="26" ry="15"/>
      <ellipse cx="6" cy="-14" rx="20" ry="14"/>
    </g>
    <g id="tuft">
      <path d="M0 0 C -3 -12 -9 -16 -12 -22 M0 0 C 0 -14 1 -20 2 -25 M0 0 C 4 -12 9 -15 12 -21"
            fill="none" stroke="#5aa94f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="bush">
      <path d="M-26 0 a18 18 0 0 1 30 -6 a20 20 0 0 1 32 6 a16 16 0 0 1 -12 14 h-38 a14 14 0 0 1 -12 -14z" fill="#4f9e57"/>
    </g>
    <g id="palm">
      <path d="M0 0 C -4 -40 4 -70 0 -100" fill="none" stroke="#8a5a34" stroke-width="7" stroke-linecap="round"/>
      <g fill="#3e9c55">
        <path d="M0 -100 C -22 -118 -40 -116 -50 -104 C -34 -110 -16 -106 0 -96z"/>
        <path d="M0 -100 C 22 -118 40 -116 50 -104 C 34 -110 16 -106 0 -96z"/>
        <path d="M0 -100 C -16 -126 -30 -134 -44 -134 C -28 -122 -12 -112 0 -98z"/>
        <path d="M0 -100 C 16 -126 30 -134 44 -134 C 28 -122 12 -112 0 -98z"/>
        <path d="M0 -100 C -6 -122 -6 -136 0 -148 C 6 -136 6 -122 0 -100z"/>
      </g>
    </g>
  </defs>

  <!-- = 背景 = -->
  <rect x="0" y="0" width="800" height="405" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="690" cy="90" r="90" fill="url(#sunGlow)"/>
    <g>
      <circle cx="690" cy="90" r="34" fill="#ffe680"/>
      <g stroke="#ffe680" stroke-width="5" stroke-linecap="round">
        <line x1="690" y1="34" x2="690" y2="18"/>
        <line x1="690" y1="146" x2="690" y2="162"/>
        <line x1="634" y1="90" x2="618" y2="90"/>
        <line x1="746" y1="90" x2="762" y2="90"/>
        <line x1="650" y1="50" x2="639" y2="39"/>
        <line x1="730" y1="130" x2="741" y2="141"/>
        <line x1="650" y1="130" x2="639" y2="141"/>
        <line x1="730" y1="50" x2="741" y2="39"/>
      </g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 690 90" to="360 690 90" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 远山（两层视差滚动） -->
  <g fill="#8fd0a8" opacity=".75">
    <g>
      <path d="M-200 392 C -150 300 -60 300 0 360 C 60 300 150 300 200 392 z"/>
      <path d="M200 392 C 250 296 340 296 400 360 C 460 296 550 296 600 392 z"/>
      <path d="M600 392 C 650 300 740 300 800 360 C 860 300 950 300 1000 392 z"/>
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-800 0" dur="26s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#5fbd88" opacity=".85">
    <g>
      <path d="M-200 392 C -120 340 -40 340 40 390 C 120 336 200 336 280 390 z"/>
      <path d="M280 392 C 360 336 440 336 520 390 C 600 336 680 336 760 390 z"/>
      <path d="M760 392 C 840 336 920 336 1000 390 z"/>
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-400 0" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 云 -->
  <g fill="#ffffff" opacity=".9">

      <use href="#cloud" x="120" y="70" transform="translate(120,70) scale(1)"/>
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="900 0" dur="34s" repeatCount="indefinite"/>
    </g>
    <g opacity=".8">
      <use href="#cloud" transform="translate(430,140) scale(.7)"/>
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="950 0" dur="46s" repeatCount="indefinite"/>
    </g>
    <g opacity=".65">
      <use href="#cloud" transform="translate(620,44) scale(.5)"/>
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="980 0" dur="58s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 飞鸟 -->
  <g fill="none" stroke="#3b4a52" stroke-width="3" stroke-linecap="round" opacity=".7">
    <g>
      <path d="M0 0 q 8 -9 16 0 q 8 -9 16 0"/>

                        from="760 120" to="-80 90" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.8;.8;0" dur="19s" repeatCount="indefinite"/>

    <g>

  <!-- = 地面 / 公路 = -->

    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur=".8s" repeatCount="indefinite"/>
  </line>

    <line x1="60" y1="438" x2="150" y2="438">

  <g>
    <use href="#tuft" transform="translate(800,404) scale(1.2)"/>
    <use href="#bush" transform="translate(560,405) scale(.6)"/>

                      from="0 0" to="-800 0" dur="6s" repeatCount="indefinite"/>

  <g>
    <use href="#palm" transform="translate(120,404) scale(.4)"/>
    <use href="#tuft" transform="translate(430,404)"/>
    <use href="#bush" transform="translate(470,405) scale(.9)"/>

                      from="0 0" to="-1600 0" dur="12s" repeatCount="indefinite"/>

    <use href="#palm" transform="translate(930,404) scale(.45)"/>

    <!-- 速度气流 -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".5" fill="none">

      <path d="M232 285 h -60"/>
      <path d="M258 320 h -36"/>

    </g>

    <!-- 影子 -->
    <ellipse cx="400" cy="412" rx="150" ry="10" fill="#000" opacity=".22">
      <animate attributeName="rx" values="150;142;150" dur=".6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".22;.16;.22" dur=".6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 自行车轮子 -->
    <g id="wheels">
      <!-- 后轮 -->

        <circle cx="270" cy="345" r="60" fill="none" stroke="#23282c" stroke-width="11"/>

        <g stroke="#b9c6cc" stroke-width="2.5">

          <line x1="530" y1="303" x2="530" y2="387"/>
          <line x1="488" y1="345" x2="572" y2="345"/>
          <line x1="501" y1="316" x2="559" y2="374"/>
          <line x1="559" y1="316" x2="501" y2="374"/>
        </g>
        <circle cx="530" cy="345" r="7" fill="#9fb0b8" stroke="#6d7c84" stroke-width="2"/>

    <!-- 车架 -->
    <g stroke="#e0453c" stroke-width="9" stroke-linecap="round" fill="none">

    <!-- 车把 -->

                          from="0 400 345" to="360 400 345" dur="1.05s" repeatCount="indefinite"/>

      </g>

      <!-- 身体 -->

                    C 344 238 372 246 400 236 C 420 229 440 222 452 220 z;
                    M448 210 C 420 214 396 206 372 214 C 356 220 344 216 334 208

      <!-- 脖子 -->

      <!-- 头 -->

      </path>

      <g>

<div class="bar">
  <span>速度：</span>
  <button data-speed="1.8">慢</button>
  <button data-speed="1" class="on">正常</button>
  <button data-speed="0.6">快</button>
  <button id="pause">⏸ 暂停</button>
</div>

<script>
  // 调整 SMIL 动画的整体节奏（等比缩放每个动画的时长）
  const svg = document.getElementById('scene');
  const anims = [...svg.querySelectorAll('animate, animateTransform, animateMotion')];
  anims.forEach(a => {
    if (!a.dataset.baseDur) a.dataset.baseDur = a.getAttribute('dur') || '';
  });

  function setSpeed(k) {
    anims.forEach(a => {
      const base = a.dataset.baseDur;
      if (!base) return;
      const v = parseFloat(base);
      if (isNaN(v)) return;
      a.setAttribute('dur', (v * k).toFixed(3).replace(/\.?0+$/, '') + 's');
    });
    document.querySelectorAll('.bar button[data-speed]').forEach(b =>
      b.classList.toggle('on', parseFloat(b.dataset.speed) === k));
  }
  document.querySelectorAll('.bar button[data-speed]').forEach(b =>
    b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed))));

  const pauseBtn = document.getElementById('pause');
  let paused = false;
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  });
</script>
</body>
</html>
