<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{
    --sky-top:#a8dcf0;
    --sky-bottom:#e8f6e3;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(circle at 50% 0%, #1d2b3a 0%, #0d141c 70%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#e9f1f7;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 16px 40px;
  }
  h1{
    font-size:clamp(18px,3.4vw,28px);
    font-weight:600;
    letter-spacing:.08em;
    margin:0 0 6px;
    text-align:center;
  }
  p.sub{
    margin:0 0 22px;
    font-size:clamp(12px,2.2vw,14px);
    color:#8fa6b8;
    letter-spacing:.05em;
    text-align:center;
  }
  .stage{
    width:min(960px,100%);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 26px 60px -18px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.07);
    background:var(--sky-bottom);
    line-height:0;
  }
  svg{display:block;width:100%;height:auto;}
  .hint{
    margin-top:18px;
    font-size:12px;
    color:#7d93a5;
    letter-spacing:.06em;
  }
</style>
</head>
<body>

<h1>鹈鹕骑自行车</h1>
<p class="sub">Pelican on a Bicycle — 纯 SVG 2D 动画</p>

<div class="stage">
<svg id="scene" viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只鹈鹕骑着自行车在乡间小路上前行">
  <title>鹈鹕骑自行车</title>

  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="var(--sky-top)"/>
      <stop offset="62%"  stop-color="#d6eef0"/>
      <stop offset="100%" stop-color="var(--sky-bottom)"/>
    </linearGradient>

    <!-- 草地渐变 -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9ed46f"/>
      <stop offset="100%" stop-color="#5ba844"/>
    </linearGradient>

    <!-- 路面渐变 -->
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c9c2b4"/>
      <stop offset="100%" stop-color="#a49c8c"/>
    </linearGradient>

    <!-- 远山渐变 -->
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b9d9c6"/>
      <stop offset="100%" stop-color="#8fc0a4"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#95cc84"/>
      <stop offset="100%" stop-color="#6cb35c"/>
    </linearGradient>

    <!-- 鹈鹕身体渐变 -->
    <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#f4f2ec"/>
      <stop offset="100%" stop-color="#d9d4c8"/>
    </linearGradient>

    <!-- 喙渐变 -->
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffc857"/>
      <stop offset="70%"  stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e08e10"/>
    </linearGradient>

    <!-- 喉囊渐变 -->
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffd98a"/>
      <stop offset="100%" stop-color="#f2a94a"/>
    </linearGradient>

    <!-- 车架金属渐变 -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c92a3c"/>
    </linearGradient>

    <!-- 太阳光晕 -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#fff6c9" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#ffe680" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>

    <!-- 云朵模糊 -->
    <filter id="softCloud" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <!-- 整体柔和阴影 -->
    <filter id="dropSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a2a" flood-opacity=".22"/>
    </filter>

    <!-- 车轮辐条遮罩（让辐条不超出轮圈） -->
    <clipPath id="wheelClip">
      <circle cx="0" cy="0" r="56"/>
    </clipPath>

    <!-- 云朵形状 -->
    <g id="cloudShape">
      <ellipse cx="0"  cy="0"  rx="34" ry="20"/>
      <ellipse cx="-30" cy="6" rx="24" ry="14"/>
      <ellipse cx="30"  cy="5" rx="26" ry="15"/>
      <ellipse cx="6"  cy="-14" rx="22" ry="15"/>
    </g>

    <!-- 路边草丛 -->
    <g id="tuft">
      <path d="M0 0 C -2 -10 -6 -14 -9 -17 C -4 -15 -1 -11 0 -6 C 1 -12 4 -16 8 -19 C 5 -13 2 -8 1 0 Z"/>
    </g>
  </defs>

  <!-- ================= 背景天空 ================= -->
  <rect x="0" y="0" width="960" height="560" fill="url(#sky)"/>

  <!-- ================= 太阳 ================= -->
  <g>
    <circle cx="790" cy="92" r="120" fill="url(#sunGlow)">
      <animate attributeName="r" values="112;126;112" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="92" r="38" fill="#ffe066"/>
    <circle cx="790" cy="92" r="38" fill="none" stroke="#fff3b0" stroke-width="3" opacity=".8">
      <animate attributeName="r" values="38;46;38" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;.15;.8" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= 云朵（缓慢飘动） ================= -->
  <g filter="url(#softCloud)" fill="#ffffff" opacity=".9">
    <use href="#cloudShape" x="0" y="0" transform="translate(140,96) scale(1.15)">
      <animateTransform attributeName="transform" type="translate"
        values="140,96; 168,96; 140,96" dur="14s" repeatCount="indefinite"/>
    </use>
    <use href="#cloudShape" x="0" y="0" transform="translate(470,60) scale(.85)" opacity=".8">
      <animateTransform attributeName="transform" type="translate"
        values="470,60; 502,58; 470,60" dur="19s" repeatCount="indefinite"/>
    </use>
    <use href="#cloudShape" x="0" y="0" transform="translate(680,150) scale(.62)" opacity=".7">
      <animateTransform attributeName="transform" type="translate"
        values="680,150; 654,148; 680,150" dur="16.5s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ================= 远山（视差层：慢速） ================= -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -120,0" dur="16s" repeatCount="indefinite"/>
      <path d="M-160 360 L-40 268 L60 330 L160 250 L268 342 L360 286 L470 360 Z"
            fill="url(#hillFar)"/>
      <path d="M420 360 L540 262 L640 336 L760 254 L880 348 L980 292 L1120 360 Z"
            fill="url(#hillFar)"/>
    </g>
    <!-- 无缝循环的第二份 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="960,0; 840,0" dur="16s" repeatCount="indefinite"/>
      <path d="M-160 360 L-40 268 L60 330 L160 250 L268 342 L360 286 L470 360 Z"
            fill="url(#hillFar)"/>
      <path d="M420 360 L540 262 L640 336 L760 254 L880 348 L980 292 L1120 360 Z"
            fill="url(#hillFar)"/>
    </g>
  </g>

  <!-- ================= 近处丘陵（视差层：中速） ================= -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -240,0" dur="9s" repeatCount="indefinite"/>
      <path d="M-240 396 C -160 350 -80 372 0 392 C 90 414 170 348 260 366
               C 350 384 430 340 520 358 C 610 376 700 344 790 364
               C 880 384 960 350 1060 372 L 1200 396 L 1200 420 L -240 420 Z"
            fill="url(#hillNear)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="960,0; 720,0" dur="9s" repeatCount="indefinite"/>
      <path d="M-240 396 C -160 350 -80 372 0 392 C 90 414 170 348 260 366
               C 350 384 430 340 520 358 C 610 376 700 344 790 364
               C 880 384 960 350 1060 372 L 1200 396 L 1200 420 L -240 420 Z"
            fill="url(#hillNear)"/>
    </g>
  </g>

  <!-- ================= 草地 ================= -->
  <rect x="0" y="404" width="960" height="86" fill="url(#grass)"/>

  <!-- ================= 土路（快速滚动的路面纹理） ================= -->
  <rect x="0" y="470" width="960" height="66" fill="url(#road)"/>
  <rect x="0" y="470" width="960" height="5" fill="#8d8574" opacity=".55"/>

  <!-- 路面碎石纹理：循环滚动 -->
  <g fill="#8f8878" opacity=".45">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; -160,0" dur="1.6s" repeatCount="indefinite"/>
    <g>
      <circle cx="20"  cy="492" r="2.4"/><circle cx="72"  cy="507" r="1.8"/>
      <circle cx="118" cy="486" r="2.1"/><circle cx="164" cy="512" r="2.6"/>
      <circle cx="215" cy="497" r="1.7"/><circle cx="268" cy="518" r="2.2"/>
      <circle cx="316" cy="489" r="2.5"/><circle cx="366" cy="508" r="1.9"/>
      <circle cx="418" cy="494" r="2.3"/><circle cx="470" cy="516" r="1.6"/>
      <circle cx="520" cy="487" r="2.2"/><circle cx="572" cy="505" r="2.7"/>
      <circle cx="624" cy="492" r="1.8"/><circle cx="676" cy="514" r="2.4"/>
      <circle cx="728" cy="498" r="2.0"/><circle cx="780" cy="519" r="1.7"/>
      <circle cx="832" cy="490" r="2.5"/><circle cx="884" cy="509" r="2.1"/>
      <circle cx="936" cy="495" r="1.9"/><circle cx="988" cy="517" r="2.3"/>
      <circle cx="1040" cy="488" r="2.2"/><circle cx="1092" cy="506" r="1.8"/>
    </g>
  </g>

  <!-- 路边草丛（中景视差） -->
  <g fill="#4f9a3d">
    <g opacity=".9">
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -160,0" dur="2.6s" repeatCount="indefinite"/>
      <use href="#tuft" transform="translate(60,470) scale(1.1)"/>
      <use href="#tuft" transform="translate(210,470) scale(.9)"/>
      <use href="#tuft" transform="translate(340,470) scale(1.2)"/>
      <use href="#tuft" transform="translate(500,470) scale(.95)"/>
      <use href="#tuft" transform="translate(640,470) scale(1.15)"/>
      <use href="#tuft" transform="translate(790,470) scale(.85)"/>
      <use href="#tuft" transform="translate(900,470) scale(1.1)"/>
      <use href="#tuft" transform="translate(1020,470) scale(1)"/>
    </g>
    <g opacity=".9">
      <animateTransform attributeName="transform" type="translate"
        values="160,0; 0,0" dur="2.6s" repeatCount="indefinite"/>
      <use href="#tuft" transform="translate(60,470) scale(1.1)"/>
      <use href="#tuft" transform="translate(210,470) scale(.9)"/>
      <use href="#tuft" transform="translate(340,470) scale(1.2)"/>
      <use href="#tuft" transform="translate(500,470) scale(.95)"/>
      <use href="#tuft" transform="translate(640,470) scale(1.15)"/>
      <use href="#tuft" transform="translate(790,470) scale(.85)"/>
      <use href="#tuft" transform="translate(900,470) scale(1.1)"/>
      <use href="#tuft" transform="translate(1020,470) scale(1)"/>
    </g>
  </g>

  <!-- ================= 鹈鹕 + 自行车 整体（上下颠簸） ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-4; 0,0; 0,3; 0,0" dur="0.62s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1"/>

    <!-- 地面投影 -->
    <ellipse cx="480" cy="524" rx="190" ry="11" fill="#3f6b34" opacity=".28">
      <animate attributeName="rx" values="190;178;190" dur="0.62s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".28;.22;.28" dur="0.62s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ============ 自行车 ============ -->
    <g filter="url(#dropSoft)">

      <!-- ---- 后轮 ---- -->
      <g transform="translate(332,472)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0;360" dur="0.9s" repeatCount="indefinite"/>
          <circle r="58" fill="none" stroke="#2f2f33" stroke-width="9"/>
          <circle r="52" fill="#fdfdfb" opacity=".9"/>
          <circle r="50" fill="none" stroke="#c9c5bd" stroke-width="2"/>
          <!-- 辐条 -->
          <g clip-path="url(#wheelClip)" stroke="#b9b4aa" stroke-width="1.6" opacity=".95">
            <line x1="-56" y1="0" x2="56" y2="0"/>
            <line x1="0" y1="-56" x2="0" y2="56"/>
            <line x1="-40" y1="-40" x2="40" y2="40"/>
            <line x1="-40" y1="40" x2="40" y2="-40"/>
            <line x1="-52" y1="-21" x2="52" y2="21"/>
            <line x1="-52" y1="21" x2="52" y2="-21"/>
            <line x1="-21" y1="-52" x2="21" y2="52"/>
            <line x1="-21" y1="52" x2="21" y2="-52"/>
          </g>
          <!-- 反光片，用来直观感受转速 -->
          <circle cx="0" cy="-42" r="4.5" fill="#ff5f6d"/>
          <circle cx="0" cy="-42" r="4.5" fill="#fff" opacity=".5"/>
        </g>
        <circle r="7" fill="#8a8f96"/>
        <circle r="3" fill="#d7dade"/>
      </g>

      <!-- ---- 前轮 ---- -->
      <g transform="translate(648,472)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0;360" dur="0.9s" repeatCount="indefinite"/>
          <circle r="58" fill="none" stroke="#2f2f33" stroke-width="9"/>
          <circle r="52" fill="#fdfdfb" opacity=".9"/>
          <circle r="50" fill="none" stroke="#c9c5bd" stroke-width="2"/>
          <g clip-path="url(#wheelClip)" stroke="#b9b4aa" stroke-width="1.6" opacity=".95">
            <line x1="-56" y1="0" x2="56" y2="0"/>
            <line x1="0" y1="-56" x2="0" y2="56"/>
            <line x1="-40" y1="-40" x2="40" y2="40"/>
            <line x1="-40" y1="40" x2="40" y2="-40"/>
            <line x1="-52" y1="-21" x2="52" y2="21"/>
            <line x1="-52" y1="21" x2="52" y2="-21"/>
            <line x1="-21" y1="-52" x2="21" y2="52"/>
            <line x1="-21" y1="52" x2="21" y2="-52"/>
          </g>
          <circle cx="0" cy="-42" r="4.5" fill="#4dabf7"/>
          <circle cx="0" cy="-42" r="4.5" fill="#fff" opacity=".5"/>
        </g>
        <circle r="7" fill="#8a8f96"/>
        <circle r="3" fill="#d7dade"/>
      </g>

      <!-- ---- 车架 ---- -->
      <g stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" fill="none">
        <!-- 主三角 -->
        <path d="M332 472 L432 402 L556 402 Z"/>
        <!-- 上管到前叉 -->
        <path d="M556 402 L628 442"/>
        <!-- 前叉 -->
        <path d="M628 442 L648 472"/>
        <!-- 座管 -->
        <path d="M432 402 L406 356"/>
        <!-- 后下叉 -->
        <path d="M332 472 L432 452"/>
        <!-- 后上叉 -->
        <path d="M432 452 L432 402"/>
      </g>
      <!-- 车架高光 -->
      <g stroke="#ffb3b3" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".65">
        <path d="M340 466 L430 405"/>
        <path d="M556 398 L624 437"/>
      </g>
      <!-- 五通（中轴） -->
      <circle cx="432" cy="452" r="10" fill="#3a3f45"/>
      <circle cx="432" cy="452" r="4" fill="#c8ccd1"/>

      <!-- ---- 牙盘 + 曲柄（随踏频转动） ---- -->
      <g transform="translate(432,452)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="0;360" dur="0.9s" repeatCount="indefinite"/>
          <!-- 牙盘 -->
          <circle r="24" fill="none" stroke="#9aa0a6" stroke-width="4"/>
          <circle r="20" fill="none" stroke="#c9ced3" stroke-width="2" stroke-dasharray="3 4"/>
          <!-- 曲柄 -->
          <line x1="-26" y1="0" x2="26" y2="0" stroke="#4a4f55" stroke-width="7" stroke-linecap="round"/>
          <!-- 踏板 -->
          <rect x="20" y="-5" width="20" height="10" rx="3" fill="#2f3338"/>
          <rect x="-40" y="-5" width="20" height="10" rx="3" fill="#2f3338"/>
        </g>
      </g>

      <!-- ---- 链条（上下两段，略微抖动） ---- -->
      <g stroke="#6b7075" stroke-width="3.6" fill="none" stroke-linecap="round">
        <path d="M332 472 L432 476">
          <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.25s" repeatCount="indefinite"/>
        </path>
        <path d="M332 472 L432 428">
          <animate attributeName="stroke-dashoffset" values="0;-16" dur="0.25s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle cx="332" cy="472" r="9" fill="none" stroke="#9aa0a6" stroke-width="3.4"/>

      <!-- ---- 车座 ---- -->
      <path d="M374 358 C 386 348 424 346 440 354 C 448 358 444 366 432 366
               L 386 366 C 376 366 370 362 374 358 Z"
            fill="#2f3338"/>
      <path d="M378 356 C 390 349 420 348 434 354" stroke="#5a6066" stroke-width="2.6"
            fill="none" stroke-linecap="round"/>

      <!-- ---- 车把 ---- -->
      <g stroke="#3a3f45" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M628 442 L606 402"/>
        <path d="M606 402 L640 386"/>
        <path d="M606 402 L580 386"/>
      </g>
      <!-- 把套 -->
      <circle cx="580" cy="386" r="6.5" fill="#2b2f33"/>
      <circle cx="640" cy="386" r="6.5" fill="#2b2f33"/>
      <!-- 车铃 -->
      <circle cx="616" cy="394" r="6" fill="#f5c542"/>
      <circle cx="614" cy="392" r="2.2" fill="#fff8d6"/>

      <!-- ---- 前车灯（呼吸光） ---- -->
      <circle cx="646" cy="428" r="8" fill="#ffe9a8"/>
      <circle cx="646" cy="428" r="8" fill="#ffd43b">
        <animate attributeName="opacity" values="1;.5;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- 车灯外发光 -->
    <path d="M652 414 L740 396 L740 462 L652 442 Z" fill="#ffe98a" opacity=".3">
      <animate attributeName="opacity" values=".3;.14;.3" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <!-- ============ 鹈鹕 ============ -->
    <!--
      骨架锚点（与车架共享坐标系）：
        车座顶面   (406, 356)
        五通/中轴  (432, 452)  → 踏板绕其旋转，半径 26
        车把握把   (580, 386)
      鸟身以「骨盆」为原点，坐于车座之上，双腿下探至踏板。
    -->
    <g transform="translate(410,352)">

      <!-- ===== 尾羽（向后上方翘起，轻微摆动） ===== -->
      <g transform="translate(-52,10)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-5;4;-5" dur="1.1s" repeatCount="indefinite"/>
          <path d="M4 -6 C -20 -20 -46 -22 -68 -12
                   C -50 -12 -34 -4 -22 8
                   C -12 0 -4 -4 4 -2 Z"
                fill="#e9e4d9" stroke="#d5cfc2" stroke-width="2" stroke-linejoin="round"/>
          <path d="M-6 -6 C -26 -14 -44 -16 -60 -11" stroke="#cbc5b8" stroke-width="2" fill="none"/>
          <path d="M-4 2 C -22 -2 -38 -2 -52 2" stroke="#cbc5b8" stroke-width="1.8" fill="none"/>
        </g>
      </g>

      <!-- ===== 身体（坐在车座上的水滴形躯干） ===== -->
      <g filter="url(#dropSoft)">
        <path d="M-44 -4
                 C -50 -40 -24 -62 6 -62
                 C 38 -62 60 -40 58 -8
                 C 56 26 30 46 -2 46
                 C -30 46 -46 24 -44 -4 Z"
              fill="url(#bodyGrad)"/>
      </g>
      <!-- 腹部/下缘阴影，增加体积 -->
      <path d="M-40 6 C -34 34 -10 44 6 44 C 30 44 50 28 54 4
               C 40 24 18 34 -6 32 C -26 30 -38 20 -40 6 Z"
            fill="#cfc9bc" opacity=".5"/>

      <!-- ===== 远侧翅膀（在身体之后，只露一角） ===== -->
      <path d="M-34 -20 C -50 -6 -52 12 -42 26 C -34 14 -30 -4 -26 -18 Z"
            fill="#ddd7ca"/>

      <!-- ===== 腿（踩踏板） =====
           以骨盆为支点，远近两条腿相位相差 180°，与曲柄同步（0.9s） -->
      <!-- 远侧腿 -->
      <g transform="translate(-16,42)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-13;15;-13" dur="0.9s" repeatCount="indefinite"/>
          <path d="M0 0 C -2 20 -4 38 -2 52" stroke="#d98c0c" stroke-width="12"
                stroke-linecap="round" fill="none"/>
          <path d="M-2 52 C -6 58 -12 62 -18 64" stroke="#d98c0c" stroke-width="11"
                stroke-linecap="round" fill="none"/>
          <!-- 蹼足 -->
          <path d="M-30 60 C -22 58 -12 60 -8 66 C -16 70 -26 70 -32 66 Z"
                fill="#c97c0a"/>
        </g>
      </g>
      <!-- 近侧腿 -->
      <g transform="translate(18,44)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="15;-13;15" dur="0.9s" repeatCount="indefinite"/>
          <path d="M0 0 C 2 20 4 38 2 52" stroke="#f7b955" stroke-width="13"
                stroke-linecap="round" fill="none"/>
          <path d="M2 52 C -2 58 -8 62 -14 64" stroke="#f7b955" stroke-width="12"
                stroke-linecap="round" fill="none"/>
          <path d="M-26 60 C -18 58 -8 60 -4 66 C -12 70 -22 70 -28 66 Z"
                fill="#f5a623" stroke="#d98c0c" stroke-width="1.6"/>
        </g>
      </g>

      <!-- ===== 脖子（粗壮的 S 形，从躯干前上方伸向头部） =====
           长度经过压缩，使头部整体落在画面上方留白内 -->
      <path d="M18 -46
               C 28 -70 40 -88 56 -98
               L 86 -78
               C 68 -64 56 -44 52 -22
               C 42 -28 30 -38 18 -46 Z"
            fill="url(#bodyGrad)"/>
      <path d="M28 -50 C 40 -70 52 -84 64 -93" stroke="#d9d4c8" stroke-width="2.6"
            fill="none" opacity=".75"/>

      <!-- ===== 翅膀（前侧翅膀，肩部在躯干上方，翼尖搭向车把） ===== -->
      <g>
        <path d="M6 -44
                 C 44 -52 86 -44 116 -22
                 C 138 -6 152 12 160 26
                 C 132 20 96 6 62 -4
                 C 36 -16 16 -30 6 -44 Z"
              fill="#f2efe7" stroke="#d5cfc2" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M20 -34 C 56 -38 92 -26 120 -6" stroke="#d5cfc2" stroke-width="2" fill="none"/>
        <path d="M16 -22 C 48 -26 80 -14 108 6" stroke="#d5cfc2" stroke-width="1.8" fill="none"/>
        <!-- 翼尖覆在把套上 -->
        <circle cx="162" cy="28" r="9" fill="#f7f5ee" stroke="#d9d4c8" stroke-width="2"/>
      </g>

      <!-- ===== 头部 ===== -->
      <g transform="translate(72,-88)">
        <!-- 头 -->
        <ellipse cx="0" cy="0" rx="31" ry="28" fill="#fbfaf6"/>
        <!-- 后脑蓬松羽毛 -->
        <g stroke="#e3ded2" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M-18 -20 C -26 -32 -26 -42 -20 -50">
            <animate attributeName="d"
              values="M-18 -20 C -26 -32 -26 -42 -20 -50;
                      M-18 -20 C -30 -30 -32 -44 -26 -54;
                      M-18 -20 C -26 -32 -26 -42 -20 -50"
              dur="1.3s" repeatCount="indefinite"/>
          </path>
          <path d="M-8 -25 C -14 -38 -10 -48 -2 -54">
            <animate attributeName="d"
              values="M-8 -25 C -14 -38 -10 -48 -2 -54;
                      M-8 -25 C -18 -36 -16 -50 -8 -58;
                      M-8 -25 C -14 -38 -10 -48 -2 -54"
              dur="1.3s" repeatCount="indefinite"/>
          </path>
        </g>

        <!-- ===== 喙：上颌（长而略下弯） ===== -->
        <path d="M14 -12
                 C 48 -18 86 -14 116 -2
                 C 112 4 100 8 84 8
                 C 56 8 30 4 14 0 Z"
              fill="url(#beakGrad)" stroke="#d98c0c" stroke-width="2" stroke-linejoin="round"/>
        <!-- 上颌脊线高光 -->
        <path d="M20 -8 C 52 -12 84 -9 108 -1" stroke="#ffe6a8" stroke-width="2.6"
              fill="none" opacity=".9"/>

        <!-- ===== 喉囊（标志性的大皮囊，随颠簸晃动） ===== -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-2.5 16 2; 3 16 2; -2.5 16 2" dur="0.9s" repeatCount="indefinite"/>
          <path d="M14 0
                   C 24 34 56 50 90 34
                   C 106 26 114 10 116 -2
                   C 100 10 74 16 50 12
                   C 34 9 22 5 14 0 Z"
                fill="url(#pouchGrad)" stroke="#d98c0c" stroke-width="2" stroke-linejoin="round"/>
          <path d="M24 8 C 36 30 62 40 88 30" stroke="#ffe0a0" stroke-width="2.4"
                fill="none" opacity=".8"/>
        </g>

        <!-- ===== 眼睛 ===== -->
        <ellipse cx="0" cy="-8" rx="9.5" ry="9.5" fill="#ffffff" stroke="#d9d4c8" stroke-width="1.6"/>
        <g>
          <animateTransform attributeName="transform" type="translate"
            values="0,0; 2.2,0; 0,0; -1.6,0.6; 0,0" dur="3.6s" repeatCount="indefinite"
            keyTimes="0;0.3;0.5;0.72;1"/>
          <circle cx="1" cy="-8" r="5.4" fill="#26313d"/>
          <circle cx="2.8" cy="-10" r="1.9" fill="#ffffff"/>
          <circle cx="-0.8" cy="-6" r="1" fill="#ffffff" opacity=".7"/>
        </g>
        <!-- 眨眼 -->
        <ellipse cx="0" cy="-8" rx="10.5" ry="10.5" fill="#fbfaf6" opacity="0">
          <animate attributeName="opacity"
            values="0;0;1;0;0" dur="4.4s" repeatCount="indefinite"
            keyTimes="0;0.9;0.94;0.98;1"/>
        </ellipse>
        <!-- 眼下裸皮 -->
        <path d="M-20 2 C -12 10 0 12 8 8" stroke="#f0b0a8" stroke-width="2"
              fill="none" opacity=".5"/>
      </g>

    </g>
  </g>

  <!-- ================= 前景模糊草叶（快速掠过，营造速度感） ================= -->
  <g stroke="#3f8b31" stroke-width="5" stroke-linecap="round" opacity=".55" fill="none">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; -300,0" dur="0.95s" repeatCount="indefinite"/>
      <path d="M40 556 C 44 536 40 524 32 514"/>
      <path d="M180 556 C 184 538 180 526 172 516"/>
      <path d="M330 556 C 334 536 330 524 322 514"/>
      <path d="M470 556 C 474 538 470 526 462 516"/>
      <path d="M620 556 C 624 536 620 524 612 514"/>
      <path d="M760 556 C 764 538 760 526 752 516"/>
      <path d="M900 556 C 904 536 900 524 892 514"/>
      <path d="M1040 556 C 1044 538 1040 526 1032 516"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="300,0; 0,0" dur="0.95s" repeatCount="indefinite"/>
      <path d="M40 556 C 44 536 40 524 32 514"/>
      <path d="M180 556 C 184 538 180 526 172 516"/>
      <path d="M330 556 C 334 536 330 524 322 514"/>
      <path d="M470 556 C 474 538 470 526 462 516"/>
      <path d="M620 556 C 624 536 620 524 612 514"/>
      <path d="M760 556 C 764 538 760 526 752 516"/>
      <path d="M900 556 C 904 536 900 524 892 514"/>
      <path d="M1040 556 C 1044 538 1040 526 1032 516"/>
    </g>
  </g>

  <!-- ================= 速度线（跟随踏频脉动） ================= -->
  <g stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" opacity=".55">
    <animate attributeName="opacity" values=".5;.18;.5" dur="0.45s" repeatCount="indefinite"/>
    <line x1="176" y1="330" x2="228" y2="330"/>
    <line x1="152" y1="368" x2="218" y2="368"/>
    <line x1="186" y1="406" x2="236" y2="406"/>
  </g>

</svg>
