<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 60%, #90EE90 60%, #90EE90 100%);
    margin: 0;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    display: block;
  }
</style>
</head>
<body>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="800" height="300" fill="#87CEEB"/>
  <!-- Ground -->
  <rect y="300" width="800" height="200" fill="#7CB87C"/>
  <!-- Road -->
  <rect y="320" width="800" height="40" fill="#888"/>
  <!-- Road dashes -->
  <g fill="#FFD700" opacity="0.8">
    <rect x="0" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="700" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="336" width="60" height="8" rx="4">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-100,0" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Clouds -->
  <g opacity="0.9">
    <g fill="white">
      <ellipse cx="100" cy="80" rx="50" ry="25"/>
      <ellipse cx="130" cy="70" rx="40" ry="22"/>
      <ellipse cx="70" cy="70" rx="35" ry="20"/>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="900,0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g fill="white">
      <ellipse cx="600" cy="60" rx="55" ry="28"/>
      <ellipse cx="635" cy="50" rx="42" ry="22"/>
      <ellipse cx="565" cy="52" rx="38" ry="20"/>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="900,0" dur="18s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Sun -->
  <circle cx="700" cy="70" r="45" fill="#FFD700" opacity="0.9"/>
  <g stroke="#FFD700" stroke-width="3" opacity="0.7">
    <line x1="700" y1="10" x2="700" y2="0"/>
    <line x1="700" y1="130" x2="700" y2="140"/>
    <line x1="640" y1="70" x2="630" y2="70"/>
    <line x1="760" y1="70" x2="770" y2="70"/>
    <line x1="658" y1="28" x2="650" y2="20"/>
    <line x1="742" y1="112" x2="750" y2="120"/>
    <line x1="742" y1="28" x2="750" y2="20"/>
    <line x1="658" y1="112" x2="650" y2="120"/>
  </g>

  <!-- Main bicycle + pelican group that bobs slightly -->
  <g id="rider">
    <animateTransform attributeName="transform" type="translate" from="0,-2" to="0,2" dur="0.4s" repeatCount="indefinite" additive="sum" calcMode="spline" keySplines="0.4 0 0.6 1"/>

    <!-- BICYCLE -->
    <!-- Rear wheel -->
    <g transform="translate(330, 320)">
      <circle r="55" fill="none" stroke="#333" stroke-width="5"/>
      <circle r="8" fill="#555"/>
      <!-- Spokes -->
      <line x1="-55" y1="0" x2="55" y2="0" stroke="#666" stroke-width="2"/>
      <line x1="0" y1="-55" x2="0" y2="55" stroke="#666" stroke-width="2"/>
      <line x1="-39" y1="-39" x2="39" y2="39" stroke="#666" stroke-width="2"/>
      <line x1="39" y1="-39" x2="-39" y2="39" stroke="#666" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <!-- Front wheel -->
    <g transform="translate(490, 320)">
      <circle r="55" fill="none" stroke="#333" stroke-width="5"/>
      <circle r="8" fill="#555"/>
      <line x1="-55" y1="0" x2="55" y2="0" stroke="#666" stroke-width="2"/>
      <line x1="0" y1="-55" x2="0" y2="55" stroke="#666" stroke-width="2"/>
      <line x1="-39" y1="-39" x2="39" y2="39" stroke="#666" stroke-width="2"/>
      <line x1="39" y1="-39" x2="-39" y2="39" stroke="#666" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
    </g>

    <!-- Frame -->
    <!-- Chain stay: rear axle to bottom bracket -->
    <line x1="330" y1="320" x2="400" y2="290" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
    <!-- Seat stay: rear axle to seat tube top -->
    <line x1="330" y1="320" x2="390" y2="225" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>
    <!-- Seat tube: bottom bracket to seat -->
    <line x1="400" y1="290" x2="390" y2="225" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
    <!-- Top tube: seat to head tube -->
    <line x1="390" y1="225" x2="470" y2="230" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
    <!-- Down tube: bottom bracket to head tube -->
    <line x1="400" y1="290" x2="475" y2="235" stroke="#C0392B" stroke-width="7" stroke-linecap="round"/>
    <!-- Head tube -->
    <line x1="470" y1="225" x2="480" y2="265" stroke="#C0392B" stroke-width="8" stroke-linecap="round"/>
    <!-- Fork: head tube to front axle -->
    <line x1="478" y1="262" x2="490" y2="320" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/>

    <!-- Handlebar -->
    <line x1="472" y1="225" x2="465" y2="205" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <line x1="455" y1="200" x2="478" y2="200" stroke="#555" stroke-width="5" stroke-linecap="round"/>

    <!-- Seat post -->
    <line x1="390" y1="225" x2="388" y2="205" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <!-- Seat -->
    <ellipse cx="388" cy="203" rx="22" ry="8" fill="#333"/>

    <!-- Crank and pedals (rotating) -->
    <g transform="translate(400, 290)">
      <circle r="12" fill="#888"/>
      <g>
        <line x1="0" y1="-22" x2="0" y2="22" stroke="#888" stroke-width="4"/>
        <rect x="-10" y="-28" width="20" height="8" rx="3" fill="#555"/>
        <rect x="-10" y="20" width="20" height="8" rx="3" fill="#555"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- PELICAN BODY -->
    <!-- Body -->
    <ellipse cx="400" cy="200" rx="50" ry="35" fill="white" stroke="#DDD" stroke-width="1"/>
    <!-- Wing left (back) -->
    <ellipse cx="370" cy="205" rx="30" ry="14" fill="#E8E8E8" transform="rotate(-15,370,205)"/>
    <!-- Wing right (front) -->
    <ellipse cx="430" cy="200" rx="28" ry="12" fill="#EEE" transform="rotate(10,430,200)"/>

    <!-- Neck -->
    <path d="M400,168 Q410,150 415,130 Q418,115 420,105" fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M400,168 Q410,150 415,130 Q418,115 420,105" fill="none" stroke="#EEE" stroke-width="14" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="422" cy="100" rx="22" ry="18" fill="white" stroke="#DDD" stroke-width="1"/>

    <!-- Eye -->
    <circle cx="430" cy="96" r="5" fill="#222"/>
    <circle cx="432" cy="94" r="2" fill="white"/>

    <!-- Beak upper -->
    <path d="M438,102 Q465,108 472,114 Q465,116 438,110 Z" fill="#F4A340"/>
    <!-- Pouch / lower beak -->
    <path d="M438,110 Q464,116 470,120 Q458,128 440,120 Q438,115 438,110 Z" fill="#E8821A" opacity="0.9"/>

    <!-- Hat (fun accessory) -->
    <ellipse cx="418" cy="84" rx="26" ry="6" fill="#2C3E7A"/>
    <rect x="406" y="60" width="24" height="26" rx="3" fill="#2C3E7A"/>
    <!-- Hat stripe -->
    <rect x="406" y="76" width="24" height="4" fill="#E74C3C"/>

    <!-- Legs/feet on pedals -->
    <!-- Left leg -->
    <line x1="388" y1="230" x2="395" y2="268" stroke="#F4A340" stroke-width="5" stroke-linecap="round"/>
    <line x1="395" y1="268" x2="402" y2="285" stroke="#F4A340" stroke-width="5" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="412" y1="228" x2="405" y2="260" stroke="#F4A340" stroke-width="5" stroke-linecap="round"/>
    <line x1="405" y1="260" x2="398" y2="278" stroke="#F4A340" stroke-width="5" stroke-linecap="round"/>

    <!-- Feet -->
    <ellipse cx="403" cy="288" rx="12" ry="5" fill="#F4A340" transform="rotate(-10,403,288)"/>
    <ellipse cx="397" cy="280" rx="12" ry="5" fill="#F4A340" transform="rotate(10,397,280)"/>

    <!-- Wing flap animation hint - small wing detail -->
    <path d="M380,195 Q360,185 350,190 Q360,200 380,205" fill="#DDD">
      <animate attributeName="d"
        values="M380,195 Q360,185 350,190 Q360,200 380,205;
                M380,195 Q360,178 348,185 Q360,196 380,205;
                M380,195 Q360,185 350,190 Q360,200 380,205"
        dur="0.8s" repeatCount="indefinite"/>
    </path>

  </g>

  <!-- Trees in background scrolling -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-800,0" dur="6s" repeatCount="indefinite"/>
    <!-- Tree 1 -->
    <g transform="translate(100,260)">
      <rect x="-8" y="0" width="16" height="60" fill="#5D4037"/>
      <ellipse cx="0" cy="-10" rx="35" ry="45" fill="#2E7D32"/>
      <ellipse cx="-15" cy="5" rx="25" ry="35" fill="#388E3C"/>
      <ellipse cx="15" cy="0" rx="25" ry="38" fill="#43A047"/>
    </g>
    <!-- Tree 2 -->
    <g transform="translate(280,270)">
      <rect x="-7" y="0" width="14" height="50" fill="#5D4037"/>
      <ellipse cx="0" cy="-5" rx="30" ry="40" fill="#1B5E20"/>
      <ellipse cx="0" cy="-15" rx="22" ry="30" fill="#2E7D32"/>
    </g>
    <!-- Tree 3 -->
    <g transform="translate(550,255)">
      <rect x="-9" y="0" width="18" height="65" fill="#4E342E"/>
      <ellipse cx="0" cy="-15" rx="38" ry="50" fill="#388E3C"/>
      <ellipse cx="-18" cy="0" rx="28" ry="38" fill="#43A047"/>
      <ellipse cx="18" cy="-5" rx="28" ry="40" fill="#2E7D32"/>
    </g>
    <!-- Tree 4 -->
    <g transform="translate(720,265)">
      <rect x="-7" y="0" width="14" height="55" fill="#5D4037"/>
      <ellipse cx="0" cy="-8" rx="32" ry="42" fill="#1B5E20"/>
    </g>
    <!-- Duplicate for seamless loop -->
    <g transform="translate(900,260)">
      <rect x="-8" y="0" width="16" height="60" fill="#5D4037"/>
      <ellipse cx="0" cy="-10" rx="35" ry="45" fill="#2E7D32"/>
      <ellipse cx="-15" cy="5" rx="25" ry="35" fill="#388E3C"/>
      <ellipse cx="15" cy="0" rx="25" ry="38" fill="#43A047"/>
    </g>
    <g transform="translate(1080,270)">
      <rect x="-7" y="0" width="14" height="50" fill="#5D4037"/>
      <ellipse cx="0" cy="-5" rx="30" ry="40" fill="#1B5E20"/>
    </g>
    <g transform="translate(1350,255)">
      <rect x="-9" y="0" width="18" height="65" fill="#4E342E"/>
      <ellipse cx="0" cy="-15" rx="38" ry="50" fill="#388E3C"/>
    </g>
    <g transform="translate(1520,265)">
      <rect x="-7" y="0" width="14" height="55" fill="#5D4037"/>
      <ellipse cx="0" cy="-8" rx="32" ry="42" fill="#1B5E20"/>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="470" text-anchor="middle" font-family="'Arial', sans-serif" font-size="22" fill="#2C3E50" font-weight="bold">🐦 鹈鹕骑自行车 🚲</text>
</svg>
</body>
</html>
