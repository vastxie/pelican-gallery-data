<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#8fd3ff 0%, #cdefff 55%, #eaffd8 55%, #d3f2b0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  .stage {
    width: min(96vw, 900px);
    aspect-ratio: 16 / 10;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15));
  }
  svg { width: 100%; height: 100%; display: block; }

  /* 场景相对滚动：让远景元素向左平移，产生前进感 */
  @keyframes scroll-far {
    from { transform: translateX(0); }
    to   { transform: translateX(-300px); }
  }
  @keyframes scroll-near {
    from { transform: translateX(0); }
    to   { transform: translateX(-600px); }
  }
  .clouds  { animation: scroll-far 12s linear infinite; }
  .hills   { animation: scroll-far 8s linear infinite; }
  .ground-lines { animation: scroll-near 1.2s linear infinite; }

  /* 车轮旋转 */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .wheel-spin { animation: spin 0.7s linear infinite; transform-origin: center; }

  /* 整车 + 鹈鹕上下颠簸 */
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(0deg); }
    25%     { transform: translateY(-4px) rotate(-0.5deg); }
    50%     { transform: translateY(0) rotate(0deg); }
    75%     { transform: translateY(-3px) rotate(0.5deg); }
  }
  .rig { animation: bob 0.7s ease-in-out infinite; transform-origin: 450px 380px; }

  /* 蹬踏的腿 */
  @keyframes pedal-leg {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .crank { animation: pedal-leg 0.7s linear infinite; transform-origin: 450px 430px; }

  /* 喙轻轻开合 */
  @keyframes beak {
    0%,80%,100% { transform: rotate(0deg); }
    88% { transform: rotate(8deg); }
  }
  .lower-beak { animation: beak 2.6s ease-in-out infinite; transform-origin: 545px 300px; }

  /* 头顶羽毛飘动 */
  @keyframes feather {
    0%,100% { transform: rotate(-6deg); }
    50%     { transform: rotate(6deg); }
  }
  .crest { animation: feather 1.4s ease-in-out infinite; transform-origin: 470px 235px; }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sun" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6c8"/>
          <stop offset="100%" stop-color="#ffd85e"/>
        </radialGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#e9eef5"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffc043"/>
          <stop offset="100%" stop-color="#ff9e2c"/>
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffd97a"/>
          <stop offset="100%" stop-color="#ffb347"/>
        </linearGradient>
      </defs>

      <!-- 天空 -->
      <rect x="0" y="0" width="900" height="560" fill="#8fd3ff"/>
      <rect x="0" y="360" width="900" height="200" fill="#cdeb9d"/>
      <circle cx="120" cy="100" r="55" fill="url(#sun)"/>

      <!-- 云 -->
      <g class="clouds" fill="#ffffff" opacity="0.9">
        <g transform="translate(250,90)">
          <ellipse cx="0" cy="0" rx="45" ry="26"/>
          <ellipse cx="40" cy="8" rx="35" ry="22"/>
          <ellipse cx="-38" cy="10" rx="32" ry="20"/>
        </g>
        <g transform="translate(620,140)">
          <ellipse cx="0" cy="0" rx="40" ry="24"/>
          <ellipse cx="38" cy="6" rx="30" ry="18"/>
          <ellipse cx="-34" cy="8" rx="28" ry="18"/>
        </g>
        <g transform="translate(950,90)">
          <ellipse cx="0" cy="0" rx="45" ry="26"/>
          <ellipse cx="40" cy="8" rx="35" ry="22"/>
          <ellipse cx="-38" cy="10" rx="32" ry="20"/>
        </g>
      </g>

      <!-- 远山 -->
      <g class="hills" fill="#7cc36a">
        <path d="M-50 360 Q120 270 300 360 Z"/>
        <path d="M250 360 Q430 250 620 360 Z" fill="#6bb85c"/>
        <path d="M560 360 Q740 280 950 360 Z"/>
      </g>

      <!-- 地面 -->
      <rect x="0" y="360" width="900" height="200" fill="#9fd86f"/>
      <rect x="0" y="360" width="900" height="14" fill="#7cb85a"/>
      <!-- 路面 -->
      <rect x="0" y="470" width="900" height="90" fill="#5a5a66"/>
      <rect x="0" y="466" width="900" height="6" fill="#43434d"/>
      <g class="ground-lines">
        <g fill="#ffe27a">
          <rect x="0"   y="512" width="60" height="10" rx="5"/>
          <rect x="120" y="512" width="60" height="10" rx="5"/>
          <rect x="240" y="512" width="60" height="10" rx="5"/>
          <rect x="360" y="512" width="60" height="10" rx="5"/>
          <rect x="480" y="512" width="60" height="10" rx="5"/>
          <rect x="600" y="512" width="60" height="10" rx="5"/>
          <rect x="720" y="512" width="60" height="10" rx="5"/>
          <rect x="840" y="512" width="60" height="10" rx="5"/>
          <rect x="960" y="512" width="60" height="10" rx="5"/>
        </g>
      </g>

      <!-- 骑行装置：自行车 + 鹈鹕 -->
      <g class="rig">
        <!-- 自行车 -->
        <g>
          <!-- 后轮 -->
          <g transform="translate(360,455)">
            <circle r="55" fill="none" stroke="#222" stroke-width="8"/>
            <circle r="55" fill="none" stroke="#444" stroke-width="2"/>
            <g class="wheel-spin">
              <circle r="8" fill="#333"/>
              <g stroke="#c9c9c9" stroke-width="3">
                <line x1="0" y1="0" x2="0" y2="-50"/>
                <line x1="0" y1="0" x2="43" y2="25"/>
                <line x1="0" y1="0" x2="-43" y2="25"/>
                <line x1="0" y1="0" x2="43" y2="-25"/>
                <line x1="0" y1="0" x2="-43" y2="-25"/>
                <line x1="0" y1="0" x2="0" y2="50"/>
              </g>
            </g>
          </g>
          <!-- 前轮 -->
          <g transform="translate(560,455)">
            <circle r="55" fill="none" stroke="#222" stroke-width="8"/>
            <circle r="55" fill="none" stroke="#444" stroke-width="2"/>
            <g class="wheel-spin">
              <circle r="8" fill="#333"/>
              <g stroke="#c9c9c9" stroke-width="3">
                <line x1="0" y1="0" x2="0" y2="-50"/>
                <line x1="0" y1="0" x2="43" y2="25"/>
                <line x1="0" y1="0" x2="-43" y2="25"/>
                <line x1="0" y1="0" x2="43" y2="-25"/>
                <line x1="0" y1="0" x2="-43" y2="-25"/>
                <line x1="0" y1="0" x2="0" y2="50"/>
              </g>
            </g>
          </g>

          <!-- 车架 -->
          <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
            <line x1="360" y1="455" x2="450" y2="430"/>  <!-- 后下管到中轴 -->
            <line x1="450" y1="430" x2="500" y2="360"/>  <!-- 座管 -->
            <line x1="360" y1="455" x2="500" y2="360"/>  <!-- 上后管 -->
            <line x1="450" y1="430" x2="560" y2="455"/>  <!-- 下管到前轴 -->
            <line x1="500" y1="360" x2="575" y2="360"/>  <!-- 上管 -->
            <line x1="575" y1="360" x2="560" y2="455"/>  <!-- 前叉 -->
          </g>
          <!-- 车把 -->
          <line x1="575" y1="360" x2="600" y2="340" stroke="#333" stroke-width="8" stroke-linecap="round"/>
          <circle cx="602" cy="338" r="7" fill="#333"/>
          <!-- 座垫 -->
          <ellipse cx="497" cy="356" rx="26" ry="10" fill="#333"/>

          <!-- 曲柄和踏板 -->
          <g class="crank">
            <line x1="450" y1="430" x2="450" y2="470" stroke="#333" stroke-width="6" stroke-linecap="round"/>
            <rect x="435" y="468" width="30" height="8" rx="3" fill="#222"/>
          </g>
          <circle cx="450" cy="430" r="9" fill="#555"/>
        </g>

        <!-- 鹈鹕 -->
        <g>
          <!-- 蹬踏的腿（跟随曲柄） -->
          <g class="crank">
            <path d="M450 470 L455 445" stroke="#ffb347" stroke-width="11" stroke-linecap="round"/>
          </g>
          <path d="M470 400 L452 448" stroke="#ffb347" stroke-width="13" stroke-linecap="round"/>

          <!-- 身体 -->
          <ellipse cx="455" cy="370" rx="70" ry="58" fill="url(#body)" stroke="#c9d2dd" stroke-width="2"/>
          <!-- 翅膀 -->
          <path d="M430 350 Q400 380 420 415 Q450 400 460 365 Z" fill="#dfe6ef" stroke="#c2cbd8" stroke-width="2"/>

          <!-- 脖子 -->
          <path d="M485 345 Q505 300 480 250 Q470 245 460 250 Q460 300 448 345 Z" fill="url(#body)" stroke="#c9d2dd" stroke-width="2"/>

          <!-- 头 -->
          <circle cx="475" cy="248" r="40" fill="url(#body)" stroke="#c9d2dd" stroke-width="2"/>

          <!-- 头顶羽冠 -->
          <g class="crest">
            <path d="M470 214 Q460 190 478 196 Q474 208 486 200 Q484 214 470 214 Z" fill="#dfe6ef" stroke="#c2cbd8" stroke-width="1.5"/>
          </g>

          <!-- 眼睛 -->
          <circle cx="492" cy="240" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
          <circle cx="494" cy="241" r="3.5" fill="#222"/>

          <!-- 上喙 -->
          <path d="M500 250 Q560 245 600 258 Q560 266 502 268 Z" fill="url(#beak)" stroke="#e8901f" stroke-width="1.5"/>
          <!-- 下喙 + 喉囊 -->
          <g class="lower-beak">
            <path d="M502 268 Q560 275 600 258 Q575 300 520 300 Q505 290 502 268 Z" fill="url(#pouch)" stroke="#e8901f" stroke-width="1.5"/>
          </g>

          <!-- 围巾（增添骑行动感） -->
          <path d="M455 320 Q420 330 395 315 Q400 340 435 335 Z" fill="#4aa3df" stroke="#3a8bc0" stroke-width="1.5"/>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
