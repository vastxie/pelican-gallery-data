<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的兜风日记</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@400;700;800;900&display=swap');
  :root{color-scheme:light;--ink:#253c3b;--muted:#778985;--green:#738f79}
  *{box-sizing:border-box} body{margin:0;background:#f7f7ef;color:var(--ink);font-family:'Nunito','DM Sans',system-ui,sans-serif;min-height:100vh}
  .page{max-width:1440px;margin:auto;padding:30px 6.4% 25px} header{display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:11px;font-size:14px;letter-spacing:.13em;font-weight:900}.brand-icon{width:33px;height:33px;background:#dce9d9;border-radius:50%;display:grid;place-items:center;font-size:17px}
  .top-note{font-size:11px;letter-spacing:.19em;color:#87958d;font-weight:800}.top-note span{display:inline-block;width:7px;height:7px;background:#a5bd9b;border-radius:50%;margin-right:9px}
  main{text-align:center;padding-top:48px}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#8b9d8d;font-size:10px;font-weight:900;letter-spacing:.24em}.eyebrow:before,.eyebrow:after{content:'';width:24px;height:1px;background:#c7d3c5}
  h1{font-size:clamp(34px,4vw,54px);letter-spacing:.04em;margin:13px 0 10px;font-weight:900;line-height:1.2} .subtitle{font-size:14px;letter-spacing:.12em;color:#91a09a;margin:0}
  .scene-wrap{position:relative;margin:37px auto 0;max-width:1120px;border-radius:12px;overflow:hidden;background:#e4f0e9;box-shadow:0 12px 35px #778d7912}.scene{display:block;width:100%;height:auto}
  .scene-label{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:9px;color:#688679;font-size:10px;letter-spacing:.15em;font-weight:900}.scene-label i{width:6px;height:6px;border-radius:50%;background:#83a989}.scene-number{position:absolute;top:24px;right:28px;color:#8ba59a;font-size:10px;letter-spacing:.15em;font-weight:800}
  .bottom{max-width:1120px;margin:23px auto 0;display:flex;align-items:center;justify-content:space-between;text-align:left}.caption-title{font-size:13px;font-weight:900;letter-spacing:.04em}.caption-sub{font-size:11px;color:#a0aca4;margin-top:5px;letter-spacing:.08em}.controls{display:flex;align-items:center;gap:14px}.control-text{text-align:right;color:#9ca9a0;font-size:10px;letter-spacing:.12em;font-weight:800}.play{width:39px;height:39px;border:1px solid #dce5da;background:transparent;border-radius:50%;color:#718b78;cursor:pointer;font-size:14px;display:grid;place-items:center}.play:hover{background:#e9f0e6}
  footer{max-width:1120px;margin:46px auto 0;padding-top:19px;border-top:1px solid #e5eae1;display:flex;justify-content:space-between;color:#b0bbb0;font-size:10px;letter-spacing:.13em;font-weight:800}
  .wheel{animation:spin 2.2s linear infinite;transform-box:fill-box;transform-origin:center}.rider{animation:bob 1.1s ease-in-out infinite}.cloud{animation:drift 8s ease-in-out infinite alternate}.cloud.two{animation-duration:11s;animation-direction:alternate-reverse}.grass{animation:sway 2.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}.leg{animation:pedal 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}.road-mark{animation:road 2s linear infinite}.paused *{animation-play-state:paused!important}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes drift{to{transform:translateX(18px)}}@keyframes sway{to{transform:rotate(4deg)}}@keyframes pedal{to{transform:rotate(13deg)}}@keyframes road{to{transform:translateX(-90px)}}
  @media(max-width:600px){.page{padding:22px 5%}.top-note{font-size:9px}main{padding-top:48px}.scene-wrap{margin-top:30px}.scene-label,.scene-number{top:13px;font-size:8px}.scene-label{left:15px}.scene-number{right:15px}.bottom{margin-top:18px}footer{margin-top:38px}.subtitle{font-size:12px}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="page">
<header><div class="brand"><div class="brand-icon">✳</div> LITTLE WANDERS</div><div class="top-note"><span></span> A MOMENT OF JOY</div></header>
<main>

      <g fill="#f7f3de"><circle cx="80" cy="376" r="4"/><circle cx="104" cy="383" r="3"/><circle cx="1006" cy="371" r="4"/><circle cx="1031" cy="375" r="3"/></g>

      <!-- bicycle frame -->
      <g fill="none" stroke="#d57c60" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M405 365l92-96 52 96H405l72-80h151l-79 80-52-96"/><path d="M711 365l-74-116h-25"/></g>
      <path d="M626 252l-5-21h-22" fill="none" stroke="#354f4b" stroke-width="6" stroke-linecap="round"/><path d="M481 264h32" stroke="#354f4b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="549" cy="365" r="12" fill="#f5f2df" stroke="#354f4b" stroke-width="3"/><path d="M549 365l18 17h15" fill="none" stroke="#354f4b" stroke-width="4" stroke-linecap="round"/>

      <!-- pelican -->
      <g class="rider">
        <path class="leg" d="M514 252q-3 39 17 72l20 34" fill="none" stroke="#d99b63" stroke-width="8" stroke-linecap="round"/><path d="M545 358l14 5 12-1" fill="none" stroke="#d99b63" stroke-width="7" stroke-linecap="round"/>

    </svg>
  </div>
  <div class="bottom"><div><div class="caption-title">沿着海岸，慢慢骑行</div><div class="caption-sub">阳光正好，微风不燥。</div></div><div class="controls"><div class="control-text" id="status">ENJOY THE RIDE<br>暂停动画</div><button class="play" id="toggle" type="button" aria-label="暂停动画" aria-pressed="false">Ⅱ</button></div></div>
</main>
<footer><span>MADE FOR SLOW DAYS</span><span>✳ &nbsp; TAKE THE SCENIC ROUTE</span></footer>
</div>
<script>
  const button = document.getElementById('toggle');
  const scene = document.getElementById('sceneWrap');
  const status = document.getElementById('status');
  button.addEventListener('click', () => {
    const paused = scene.classList.toggle('paused');
    button.textContent = paused ? '▶' : 'Ⅱ';
    button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
    button.setAttribute('aria-pressed', String(paused));
    status.innerHTML = paused ? 'TAKE A BREATH<br>播放动画' : 'ENJOY THE RIDE<br>暂停动画';
  });
</script>
</body>
</html>
