<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4b96f">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #193c48;
      --cream: #fff8e8;
      --coral: #ed7558;
      --sun: #ffc65c;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background: #f6b96c;
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .poster {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 360px;
      overflow: hidden;
      background: #bfe7e5;
      isolation: isolate;
    }

    .scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    .masthead {
      position: absolute;
      z-index: 5;
      top: clamp(20px, 4vw, 54px);
      left: clamp(22px, 5vw, 72px);
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      color: rgba(25, 60, 72, .72);
      font-size: clamp(10px, 1.1vw, 14px);
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: var(--coral);
      content: "";
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", "STSong", serif;
      font-size: clamp(30px, 5vw, 66px);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: .95;
    }

    h1 span {
      display: block;
      margin-top: .18em;
      color: var(--coral);
      font-size: .46em;
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-weight: 800;
      letter-spacing: .25em;
    }

    .toggle {
      position: absolute;
      z-index: 8;
      right: clamp(18px, 3vw, 40px);
      bottom: clamp(18px, 3vw, 34px);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 43px;
      padding: 0 17px;
      border: 1px solid rgba(25, 60, 72, .15);
      border-radius: 999px;
      background: rgba(255, 248, 232, .86);
      box-shadow: 0 8px 24px rgba(25, 60, 72, .12);
      color: var(--ink);
      font: 800 13px/1 inherit;
      letter-spacing: .08em;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform .2s ease, background .2s ease;
    }

    .toggle:hover { transform: translateY(-2px); background: #fffaf0; }
    .toggle:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .toggle svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .play-icon { display: none; }
    .paused .pause-icon { display: none; }
    .paused .play-icon { display: block; }

    /* CSS-controlled secondary motion */
    .cloud-band { animation: cloud-drift 34s linear infinite; }
    .cloud-band.far { animation-duration: 49s; animation-direction: reverse; }
    .bike-rider { animation: rider-bob .72s ease-in-out infinite alternate; transform-origin: 660px 430px; }
    .pelican-body { animation: body-bob .72s ease-in-out infinite alternate; transform-origin: 650px 383px; }
    .wing { animation: wing-sway .72s ease-in-out infinite alternate; transform-origin: 626px 353px; }
    .head-feather { animation: feather-flick .5s ease-in-out infinite alternate; transform-origin: 686px 273px; }
    .scarf-tail { animation: scarf-wave .55s ease-in-out infinite alternate; transform-origin: 668px 315px; }
    .road-speck { animation: road-flow 1s linear infinite; }
    .shadow { animation: shadow-breathe .72s ease-in-out infinite alternate; transform-origin: 653px 583px; }

    .paused .scene *,
    .paused .scene *::before,
    .paused .scene *::after {
      animation-play-state: paused !important;
    }

    @keyframes cloud-drift {
      from { transform: translateX(-120px); }
      to { transform: translateX(1320px); }
    }

    @keyframes rider-bob {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    @keyframes body-bob {
      from { transform: rotate(-.7deg); }
      to { transform: rotate(1.1deg); }
    }

    @keyframes wing-sway {
      from { transform: rotate(-2deg); }
      to { transform: rotate(4deg); }
    }

    @keyframes feather-flick {
      from { transform: rotate(-7deg); }
      to { transform: rotate(7deg); }
    }

    @keyframes scarf-wave {
      from { transform: rotate(-2deg) skewX(0); }
      to { transform: rotate(5deg) skewX(-5deg); }
    }

    @keyframes road-flow {
      from { transform: translateX(0); }
      to { transform: translateX(-170px); }
    }

    @keyframes shadow-breathe {
      from { transform: scaleX(1); opacity: .18; }
      to { transform: scaleX(.92); opacity: .12; }
    }

    @media (max-aspect-ratio: 4/5) {
      .scene { width: 150%; margin-left: -27%; }
      .masthead { top: 26px; }
      h1 { font-size: clamp(34px, 11vw, 62px); }
      .bike-scale {
        transform: scale(.76);
        transform-box: view-box;
        transform-origin: 650px 450px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene * { animation: none !important; }
      .toggle { display: none; }
    }
  </style>
</head>

        </g>
      </g>
      </g>

      <!-- foreground grass -->
      <g fill="none" stroke-linecap="round">
        <path d="M45 718c8-37 9-57-3-82m5 48c-16-13-25-27-28-42m28 29c15-16 21-30 20-45" stroke="#2f6555" stroke-width="8"/>
        <path d="M1134 719c-5-39-1-68 13-91m-11 58c-15-14-22-28-22-43m25 32c17-16 27-33 29-52" stroke="#2f6555" stroke-width="8"/>

    </svg>

    <button class="toggle" id="toggle" type="button" aria-pressed="false" aria-label="暂停动画">
      <svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h4v12H3zm6 0h4v12H9z"/></svg>
      <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 2 10 6-10 6z"/></svg>
      <span>暂停</span>
    </button>
  </main>

  <script>
    const poster = document.querySelector('#poster');
    const scene = document.querySelector('#scene');
    const button = document.querySelector('#toggle');
    const label = button.querySelector('span');
    let paused = false;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      scene.pauseAnimations();
    }

    button.addEventListener('click', () => {
      paused = !paused;
      poster.classList.toggle('paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      label.textContent = paused ? '继续' : '暂停';
      if (paused) scene.pauseAnimations();
      else scene.unpauseAnimations();
    });
  </script>
</body>
</html>
