<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕的夏日骑行</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173f45;
      --cream: #fffaf0;
      --orange: #f4a261;
      --sky: #bce4e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #eef4ed;
      font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .scene {
      position: relative;
      width: min(100vw, 1500px);
      aspect-ratio: 12 / 7;
      max-height: 100vh;
      overflow: hidden;
      background: var(--sky);
    }

    svg { display: block; width: 100%; height: 100%; }

    .title {
      position: absolute;
      top: clamp(18px, 4vw, 54px);
      left: clamp(20px, 5vw, 72px);
      color: var(--ink);
      pointer-events: none;
    }

    .title .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: clamp(9px, 1vw, 13px);
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
      opacity: .65;
    }

    .title .eyebrow::before {
      content: "";
      width: 24px;
      height: 3px;
      border-radius: 3px;
      background: #ef8354;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 56px);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .title p {
      margin: 12px 0 0;
      font-size: clamp(10px, 1.25vw, 16px);
      letter-spacing: .15em;
      opacity: .7;
    }

    .toggle {
      position: absolute;
      right: clamp(14px, 3vw, 38px);
      top: clamp(14px, 3vw, 38px);
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(23, 63, 69, .16);
      border-radius: 999px;
      padding: 9px 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, .58);
      backdrop-filter: blur(8px);
      font: 700 12px/1 system-ui, sans-serif;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .toggle:hover { background: rgba(255, 255, 255, .9); transform: translateY(-2px); }
    .toggle:focus-visible { outline: 3px solid #ef8354; outline-offset: 3px; }
    .toggle svg { width: 14px; height: 14px; }
    .play-icon { display: none; }
    .is-paused .pause-icon { display: none; }
    .is-paused .play-icon { display: block; }

    /* 所有动作共用统一节奏，暂停按钮也会作用于这些动画。 */
    .cloud { animation: cloud-drift 34s linear infinite; }
    .cloud.two { animation-duration: 46s; animation-delay: -24s; }
    .cloud.three { animation-duration: 40s; animation-delay: -9s; }
    .sun-rays { transform-origin: 1015px 120px; animation: slow-spin 36s linear infinite; }
    .wheel-spokes.rear { transform-origin: 430px 500px; animation: wheel-spin 1.6s linear infinite; }
    .wheel-spokes.front { transform-origin: 770px 500px; animation: wheel-spin 1.6s linear infinite; }
    .crank { transform-origin: 580px 500px; animation: wheel-spin 1.6s linear infinite; }
    .pelican { animation: rider-bob .8s ease-in-out infinite; }
    .head { transform-origin: 590px 190px; animation: head-bob 2.4s ease-in-out infinite; }
    .scarf-tail { transform-origin: 552px 213px; animation: scarf-wave .55s ease-in-out infinite alternate; }
    .wing { transform-origin: 545px 270px; animation: wing-steer 1.6s ease-in-out infinite; }
    .leg-front { transform-origin: 535px 330px; animation: pedal-front 1.6s ease-in-out infinite; }
    .leg-back { transform-origin: 510px 330px; animation: pedal-back 1.6s ease-in-out infinite; }
    .road-dashes { animation: road-move 1s linear infinite; }
    .grass { animation: grass-move 5s linear infinite; }
    .bird { animation: bird-fly 14s linear infinite; }
    .bird.two { animation-delay: -7s; animation-duration: 18s; }
    .shadow { transform-origin: 600px 611px; animation: shadow-breathe .8s ease-in-out infinite; }

    .is-paused .scene * { animation-play-state: paused !important; }

    @keyframes cloud-drift {
      from { transform: translateX(-280px); }
      to { transform: translateX(1420px); }
    }
    @keyframes slow-spin { to { transform: rotate(360deg); } }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes head-bob {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes scarf-wave {
      from { transform: rotate(-5deg) scaleX(.96); }
      to { transform: rotate(8deg) scaleX(1.04); }
    }
    @keyframes wing-steer {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2deg); }
    }
    @keyframes pedal-front {
      0%, 100% { transform: rotate(-9deg) translateY(0); }
      25% { transform: rotate(5deg) translateY(4px); }
      50% { transform: rotate(10deg) translateY(7px); }
      75% { transform: rotate(-4deg) translateY(2px); }
    }
    @keyframes pedal-back {
      0%, 100% { transform: rotate(9deg) translateY(7px); }
      25% { transform: rotate(-4deg) translateY(2px); }
      50% { transform: rotate(-9deg) translateY(0); }
      75% { transform: rotate(5deg) translateY(4px); }
    }
    @keyframes road-move { to { transform: translateX(-200px); } }
    @keyframes grass-move { to { transform: translateX(-1200px); } }
    @keyframes shadow-breathe {
      0%, 100% { transform: scaleX(1); opacity: .18; }
      50% { transform: scaleX(.96); opacity: .14; }
    }
    @keyframes bird-fly {
      from { transform: translate(-100px, 15px); }
      50% { transform: translate(600px, -15px); }
      to { transform: translate(1350px, 5px); }
    }

    @media (max-width: 700px) {
      .scene { width: 100vw; height: 100vh; aspect-ratio: auto; }
      .scene > svg { width: 100%; height: 100%; object-fit: cover; }
      .title p { display: none; }
      .toggle span { display: none; }
      .toggle { padding: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene * { animation-play-state: paused !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="鹈鹕骑自行车动画">
    <svg id="illustration" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="svg-title svg-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="svg-title">鹈鹕的夏日骑行</title>
      <desc id="svg-desc">一只戴着红色围巾的鹈鹕，在蓝天白云下骑着橙色自行车。车轮和脚踏不停转动，路边风景向后移动。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a8dce3" />
          <stop offset="1" stop-color="#e8f2dd" />
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dccfb7" />
          <stop offset="1" stop-color="#c9bca8" />
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd166" />
          <stop offset="1" stop-color="#f4a261" />
        </linearGradient>
        <filter id="blur" x="-30%" y="-100%" width="160%" height="300%">
          <feGaussianBlur stdDeviation="8" />
        </filter>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#173f45" flood-opacity=".12" />
        </filter>

        <g id="cloud-shape" fill="#fff" opacity=".82">
          <ellipse cx="70" cy="42" rx="70" ry="24" />
          <circle cx="53" cy="28" r="28" />
          <circle cx="91" cy="19" r="37" />
          <circle cx="126" cy="37" r="25" />
        </g>

        <g id="spokes" stroke="#779397" stroke-width="2" opacity=".65">
          <circle r="88" fill="none" />
          <path d="M-88 0H88M0-88V88M-62-62L62 62M62-62L-62 62M-80-34L80 34M34-80L-34 80M-80 34L80-34M-34-80L34 80" />
          <circle cx="0" cy="-88" r="5" fill="#ef8354" stroke="none" />
        </g>

        <g id="grass-set">
          <path d="M45 605q-5-20-15-25M45 605q4-24 15-31M45 605q0-20 1-35M215 605q-4-15-13-22M215 605q6-17 17-23M970 605q-5-20-15-25M970 605q4-24 15-31M1120 605q-3-16-13-21M1120 605q6-17 16-21" fill="none" stroke="#4f8b70" stroke-width="5" stroke-linecap="round" />
          <g fill="#fff3b0"><circle cx="31" cy="579" r="4"/><circle cx="983" cy="578" r="4"/></g>
          <g fill="#ef8354"><circle cx="1105" cy="583" r="4"/><circle cx="232" cy="582" r="4"/></g>
        </g>
      </defs>

      <!-- 天空与远景 -->
      <rect width="1200" height="700" fill="url(#sky)" />
      <g class="sun-rays" stroke="#ffe8a3" stroke-width="5" stroke-linecap="round" opacity=".7">
        <path d="M1015 39v-20M1015 221v-20M934 120h-20M1116 120h-20M958 63l-14-14M1086 191l-14-14M1072 63l14-14M944 191l14-14" />
      </g>
      <circle cx="1015" cy="120" r="57" fill="#ffe8a3" />
      <circle cx="1015" cy="120" r="43" fill="#ffdf80" />

      <g class="cloud one"><use href="#cloud-shape" x="0" y="85" /></g>
      <g class="cloud two" opacity=".65"><use href="#cloud-shape" x="0" y="205" transform="scale(.72)" /></g>
      <g class="cloud three" opacity=".75"><use href="#cloud-shape" x="0" y="45" transform="scale(.5)" /></g>

      <g class="bird" fill="none" stroke="#477b7d" stroke-width="3" stroke-linecap="round">
        <path d="M0 180q10-10 20 0q10-10 20 0" />
      </g>
      <g class="bird two" fill="none" stroke="#477b7d" stroke-width="2.5" stroke-linecap="round">
        <path d="M0 250q8-8 16 0q8-8 16 0" />
      </g>

      <path d="M0 410Q120 265 250 408Q375 210 535 410Q690 260 820 410Q1010 210 1200 405V610H0Z" fill="#a5c8a7" />
      <path d="M0 470Q160 320 315 475Q480 300 650 470Q850 315 1000 470Q1100 380 1200 450V610H0Z" fill="#79ad91" />
      <path d="M0 525Q130 450 260 525Q420 420 580 525Q750 430 910 525Q1070 440 1200 515V620H0Z" fill="#4f8b70" />

      <!-- 远处小树 -->
      <g fill="#2f6f62" opacity=".8">
        <path d="M95 525l25-70 25 70zM140 535l20-55 20 55zM1020 520l27-76 27 76zM1070 535l20-59 20 59z" />
      </g>

      <!-- 路面 -->
      <path d="M0 590Q300 578 600 592T1200 588V700H0Z" fill="url(#road)" />
      <path d="M0 600Q300 588 600 602T1200 598" fill="none" stroke="#f5e9cf" stroke-width="6" />
      <g class="road-dashes" stroke="#f7edda" stroke-width="7" stroke-linecap="round" opacity=".8">
        <path d="M-160 665h85M40 665h85M240 665h85M440 665h85M640 665h85M840 665h85M1040 665h85M1240 665h85" />
      </g>
      <g class="grass">
        <use href="#grass-set" />
        <use href="#grass-set" x="1200" />
      </g>

      <!-- 自行车投影 -->
      <ellipse class="shadow" cx="600" cy="612" rx="270" ry="14" fill="#173f45" filter="url(#blur)" />

      <!-- 自行车：车轮 -->
      <g fill="none">
        <circle cx="430" cy="500" r="105" fill="#f8f3df" fill-opacity=".16" stroke="#173f45" stroke-width="13" />
        <circle cx="430" cy="500" r="96" stroke="#f7f0db" stroke-width="3" />
        <g class="wheel-spokes rear"><use href="#spokes" transform="translate(430 500)" /></g>
        <circle cx="430" cy="500" r="11" fill="#f4a261" stroke="#173f45" stroke-width="5" />

        <circle cx="770" cy="500" r="105" fill="#f8f3df" fill-opacity=".16" stroke="#173f45" stroke-width="13" />
        <circle cx="770" cy="500" r="96" stroke="#f7f0db" stroke-width="3" />
        <g class="wheel-spokes front"><use href="#spokes" transform="translate(770 500)" /></g>
        <circle cx="770" cy="500" r="11" fill="#f4a261" stroke="#173f45" stroke-width="5" />
      </g>

      <!-- 车架 -->
      <g fill="none" stroke="#e76f51" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M430 500L520 365L580 500L430 500M520 365L690 375L580 500L715 445L690 375" />
      </g>
      <path d="M690 375L715 445L770 500" fill="none" stroke="#173f45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M690 375L676 329L713 315" fill="none" stroke="#173f45" stroke-width="8" stroke-linecap="round" />
      <path d="M705 315h42q14 0 14 13" fill="none" stroke="#173f45" stroke-width="8" stroke-linecap="round" />
      <path d="M515 365l-10-25" stroke="#173f45" stroke-width="8" stroke-linecap="round" />
      <path d="M475 340h78" stroke="#173f45" stroke-width="15" stroke-linecap="round" />
      <path d="M430 500L580 500" stroke="#173f45" stroke-width="3" opacity=".65" />

      <!-- 后面的腿 -->
      <g class="leg-back" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M510 320Q488 393 535 445L548 496" stroke="#d99145" stroke-width="18" />
        <path d="M547 495l30 3" stroke="#173f45" stroke-width="10" />
        <path d="M550 495l23-7M550 497l24 7" stroke="#f4a261" stroke-width="7" />
      </g>

      <!-- 鹈鹕身体 -->
      <g class="pelican">
        <path d="M452 287Q407 275 390 244Q432 249 463 259" fill="#e8eee6" stroke="#173f45" stroke-width="6" stroke-linejoin="round" />
        <ellipse cx="520" cy="275" rx="94" ry="79" transform="rotate(-12 520 275)" fill="#fffaf0" stroke="#173f45" stroke-width="6" />
        <path d="M469 319Q515 345 565 320" fill="none" stroke="#d8e1d8" stroke-width="7" stroke-linecap="round" />

        <!-- 长脖子 -->
        <path d="M532 308C579 281 545 231 558 190C568 156 596 141 626 153L637 187C606 174 590 191 591 218C592 253 622 278 581 323Z" fill="#fffaf0" stroke="#173f45" stroke-width="6" stroke-linejoin="round" />
        <path d="M570 284Q592 263 576 233" fill="none" stroke="#d8e1d8" stroke-width="6" stroke-linecap="round" />

        <!-- 围巾 -->
        <path d="M552 211Q583 226 609 211L611 231Q578 242 550 225Z" fill="#e76f51" stroke="#173f45" stroke-width="5" stroke-linejoin="round" />
        <g class="scarf-tail">
          <path d="M555 220Q516 204 477 221L444 207L456 235Q507 221 552 236Z" fill="#e76f51" stroke="#173f45" stroke-width="5" stroke-linejoin="round" />
          <path d="M462 216l-9 13M477 217l-7 14" stroke="#ffb199" stroke-width="3" />
        </g>

        <!-- 头、眼睛、喙与喉囊 -->
        <g class="head">
          <circle cx="613" cy="163" r="47" fill="#fffaf0" stroke="#173f45" stroke-width="6" />
          <path d="M586 126q-9-19 4-24M601 120q-2-20 12-22" fill="none" stroke="#173f45" stroke-width="5" stroke-linecap="round" />
          <path d="M635 151Q714 155 816 180Q729 192 637 181Z" fill="url(#beak)" stroke="#173f45" stroke-width="6" stroke-linejoin="round" />
          <path d="M638 181Q711 250 801 185Q730 201 638 181Z" fill="#f6b65f" stroke="#173f45" stroke-width="5" stroke-linejoin="round" />
          <path d="M656 174Q725 176 785 181" fill="none" stroke="#db8b45" stroke-width="3" stroke-linecap="round" />
          <circle cx="625" cy="151" r="10" fill="#fff" stroke="#173f45" stroke-width="4" />
          <circle cx="629" cy="152" r="4.5" fill="#173f45" />
          <circle cx="631" cy="149" r="1.5" fill="#fff" />
          <path d="M608 139q14-9 27 0" fill="none" stroke="#173f45" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- 翅膀搭在车把上 -->
        <g class="wing">
          <path d="M545 255Q584 246 620 278L690 319Q677 338 658 326L599 302Q565 304 540 286Z" fill="#f4f5e9" stroke="#173f45" stroke-width="6" stroke-linejoin="round" />
          <path d="M643 310l-19 10M657 317l-17 11" stroke="#c9d6cd" stroke-width="4" stroke-linecap="round" />
          <path d="M684 317q14-8 25 2" fill="none" stroke="#173f45" stroke-width="7" stroke-linecap="round" />
        </g>
      </g>

      <!-- 前面的腿 -->
      <g class="leg-front" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M540 320Q566 384 552 438L611 496" stroke="#f4a261" stroke-width="19" />
        <path d="M610 496l29-2" stroke="#173f45" stroke-width="10" />
        <path d="M612 496l24-9M612 498l25 6" stroke="#f4a261" stroke-width="7" />
      </g>

      <!-- 转动脚踏 -->
      <g class="crank" fill="none" stroke="#173f45" stroke-linecap="round">
        <circle cx="580" cy="500" r="17" fill="#f4a261" stroke-width="6" />
        <path d="M550 500h60" stroke-width="7" />
        <path d="M540 493h22M598 507h22" stroke-width="7" />
      </g>

      <!-- 前景小石子 -->
      <g fill="#a89b88" opacity=".65">
        <ellipse cx="180" cy="637" rx="9" ry="3" />
        <ellipse cx="990" cy="630" rx="7" ry="2.5" />
        <ellipse cx="1090" cy="680" rx="11" ry="3" />
      </g>
    </svg>

    <header class="title">
      <div class="eyebrow">A little adventure</div>
      <h1>鹈鹕去兜风</h1>
      <p>迎着风，慢慢骑。</p>
    </header>

    <button class="toggle" type="button" aria-label="暂停动画" aria-pressed="false">
      <svg class="pause-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h3v12H3zM10 2h3v12h-3z" fill="currentColor" /></svg>
      <svg class="play-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor" /></svg>
      <span>暂停动画</span>
    </button>
  </main>

  <script>
    const button = document.querySelector('.toggle');
    const label = button.querySelector('span');

    function setPaused(paused) {
      document.body.classList.toggle('is-paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      label.textContent = paused ? '播放动画' : '暂停动画';
    }

    button.addEventListener('click', () => {
      setPaused(!document.body.classList.contains('is-paused'));
    });

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setPaused(true);
    }
  </script>
</body>
</html>
